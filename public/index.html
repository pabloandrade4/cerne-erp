    document.getElementById('btnNewContaPagar')?.addEventListener('click', ()=> openModal());
    document.getElementById('btnImportContasPagar')?.addEventListener('click', ()=> openImportModal());

    window.ContasPagar = { load };
  })();

  /* ================= CONTAS A RECEBER — lançamento manual, por empresa =================
     Ativado em 24/08/2026 — simétrico a Contas a Pagar acima (mesmo uso do
     filtro do header, mesma filosofia de status calculado). */
  (function(){
    const STATUS_OPCOES = [
      ['a_receber','A receber'],
      ['atrasado','Atrasado'],
      ['recebido','Recebido'],
      ['cancelado','Cancelado'],
    ];
    const STATUS_LABEL = Object.fromEntries(STATUS_OPCOES);
    const state = { loading:false, error:null, contas:[], resumo:null, status:'todos', search:'' };
    let origensSugeridas = null;

    function toast(message, type){
      const wrap = document.getElementById('toastWrap');
      const el = document.createElement('div');
      el.className = 'toast ' + (type||'success');
      el.innerHTML = svg(type==='error' ? 'alertCircle':'checkCircle') + '<span>'+message+'</span>';
      wrap.appendChild(el);
      setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .25s'; setTimeout(()=>el.remove(),250); }, 3200);
    }
    function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function money(v){ return v===null||v===undefined ? '—' : 'R$ ' + Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2}); }
    function fmtDate(iso){ if(!iso) return '—'; try{ const [y,m,d] = String(iso).slice(0,10).split('-'); return d+'/'+m+'/'+y; }catch(e){ return '—'; } }
    function tintVars(tint){ return tint==='muted' ? '--tint:var(--text-muted);--tint-soft:var(--surface-2);' : '--tint:var(--'+tint+');--tint-soft:var(--'+tint+'-soft);'; }
    function secCardHTML(k){
      return '<div class="kpi-sec" style="'+tintVars(k.tint)+'">'
        + '<div class="kpi-sec-icon">'+svg(k.icon)+'</div>'
        + '<div class="kpi-sec-body"><div class="kpi-sec-label">'+k.label+'</div><div class="kpi-sec-value">'+k.valueHtml+'</div></div></div>';
    }
    function statusChipStyle(status){
      const cor = status==='recebido' ? 'success' : status==='atrasado' ? 'danger' : status==='cancelado' ? 'text-muted' : 'warning';
      const bg = status==='cancelado' ? 'var(--surface-2)' : 'var(--'+cor+'-soft)';
      return 'color:var(--'+cor+');background:'+bg+';';
    }

    async function api(path, opts){
      const res = await fetch('/api/contas-receber'+path, { headers:{'Content-Type':'application/json'}, ...opts });
      let body = null; try{ body = await res.json(); }catch(e){}
      if(!res.ok){ const err = new Error((body&&(body.error||(body.errors&&body.errors.geral)))||'Falha na requisição.'); err.errors = body&&body.errors; throw err; }
      return body;
    }
    async function apiOrigens(){
      if(origensSugeridas) return origensSugeridas;
      try{ const res = await fetch('/api/contas-receber/origens-sugeridas'); origensSugeridas = ((await res.json()).origens)||[]; }
      catch(e){ origensSugeridas = []; }
      return origensSugeridas;
    }

    async function loadContas(){
      const filtro = window.CerneFiltro.state;
      if(!filtro.empresaId){ state.contas=[]; state.resumo=null; state.loading=false; render(); return; }
      state.loading = true; state.error = null; render();
      try{
        const params = new URLSearchParams({ empresaId: window.CerneJuntas.param(), periodo: filtro.periodo });
        if(filtro.periodo === 'personalizado'){ if(filtro.desdePersonalizado) params.set('desde', filtro.desdePersonalizado); if(filtro.atePersonalizado) params.set('ate', filtro.atePersonalizado); }
        if(state.status !== 'todos') params.set('status', state.status);
        if(state.search.trim()) params.set('search', state.search.trim());
        const data = await api('?'+params.toString(), { method:'GET' });
        state.contas = data.contas; state.resumo = data.resumo;
      }catch(err){ state.error = err.message || 'Não foi possível carregar as contas a receber.'; }
      finally{ state.loading = false; render(); }
    }

    function load(){ loadContas(); }

    window.CerneFiltro.onChange(()=>{
      const page = document.getElementById('page-receivable');
      if(page && page.classList.contains('active')) loadContas();
      else render();
    });

    function kpisHTML(r){
      const cards = [
        { label:'Total a receber', icon:'arrowDownCircle', tint:'copper', valueHtml: money(r.totalAReceber) },
        { label:'Previsto para hoje', icon:'clock', tint: r.previstoHoje>0?'warning':'muted', valueHtml: money(r.previstoHoje) },
        { label:'Atrasado', icon:'alertCircle', tint: r.atrasado>0?'danger':'muted', valueHtml: money(r.atrasado) },
        { label:'Recebido no período', icon:'checkCircle', tint:'success', valueHtml: money(r.recebidoNoPeriodo) },
      ];
      return '<div class="kpi-sec-grid" style="margin-bottom:14px;">' + cards.map(secCardHTML).join('') + '</div>';
    }

    function render(){
      const root = document.getElementById('contasReceberRoot');
      if(!root) return;
      const filtro = window.CerneFiltro.state;

      if(!filtro.loadingEmpresas && !filtro.empresas.length){
        root.innerHTML = '<div class="empty-panel"><div class="empty-icon">'+svg('building')+'</div>'
          + '<h2>Nenhuma empresa ativa</h2>'
          + '<p class="lead">Cadastre e ative uma empresa em <strong>Cadastros → Empresas</strong> antes de lançar contas a receber.</p></div>';
        return;
      }

      let html = '';
      if(state.resumo) html += kpisHTML(state.resumo);

      html += '<div class="toolbar">'
        + '<div class="seg" id="crSeg">'
          + [['todos','Todos']].concat(STATUS_OPCOES).map(function(par){ return '<button data-status="'+par[0]+'" class="'+(state.status===par[0]?'active':'')+'">'+par[1]+'</button>'; }).join('')
        + '</div>'
        + '<div class="search-box">'+svg('search')+'<input type="text" id="crSearch" placeholder="Buscar por descrição ou origem" value="'+state.search.replace(/"/g,'&quot;')+'"></div>'
        + window.CerneJuntas.html('crJuntas')
      + '</div>';

      if(state.loading || filtro.loadingEmpresas){
        html += '<div class="table-card"><div class="table-skel"><span class="spin"></span><span>Carregando contas a receber…</span></div></div>';
      } else if(state.error){
        html += '<div class="empty-panel"><div class="empty-icon" style="color:var(--danger); background:var(--danger-soft);">'+svg('alertCircle')+'</div>'
          + '<h2 style="color:var(--danger);">Não foi possível carregar</h2><p class="lead">'+escapeHtml(state.error)+'</p>'
          + '<button class="ghost-btn" id="crRetry" style="cursor:pointer; opacity:1;">'+svg('activity')+'<span>Tentar novamente</span></button></div>';
      } else if(!state.contas.length){
        const filtrado = !!(state.search || state.status!=='todos');
        html += '<div class="empty-panel"><div class="empty-icon">'+svg('arrowDownCircle')+'</div>'
          + '<h2>Nenhuma conta a receber encontrada</h2>'
          + '<p class="lead">'+(filtrado ? 'Nenhuma conta corresponde ao filtro atual.' : 'Cadastre o primeiro lançamento a receber desta empresa no período selecionado.')+'</p>'
          + (filtrado ? '' : '<button class="primary-btn enabled" id="crEmptyNew" type="button">'+svg('plus')+'<span>Nova conta a receber</span></button>')
        + '</div>';
      } else {
        html += '<div class="table-card"><div class="table-wrap"><table class="data-table"><thead><tr>'
          + '<th>Prevista</th>'+(window.CerneJuntas.on?'<th>Empresa</th>':'')+'<th>Descrição</th><th>Origem</th><th>Valor</th><th>Status</th><th></th>'
          + '</tr></thead><tbody>'
          + state.contas.map(c => '<tr'+(c.status==='cancelado'?' style="opacity:.6;"':'')+'>'
            + '<td class="tab-nums">'+fmtDate(c.dataPrevista)+'</td>'
            + (window.CerneJuntas.on ? '<td>'+escapeHtml(c.empresaNome||'—')+'</td>' : '')
            + '<td>'+escapeHtml(c.descricao)+(c.observacao?'<div class="di-sub">'+escapeHtml(c.observacao)+'</div>':'')+'</td>'
            + '<td>'+escapeHtml(c.origem||'—')+'</td>'
            + '<td class="mono">'+money(c.valor)+'</td>'
            + '<td><span class="status-chip" style="'+statusChipStyle(c.status)+'">'+STATUS_LABEL[c.status]+'</span>'
              + (c.status==='recebido' ? '<div class="di-sub">recebido em '+fmtDate(c.dataRecebida)+'</div>' : '')+'</td>'
            + '<td><div class="row-actions">'
              + (c.statusBase==='a_receber' ? '<button class="row-ic-btn" data-receber="'+c.id+'" title="Dar baixa (marcar como recebido)" type="button">'+svg('check')+'</button>' : '')
              + (c.statusBase==='recebido' ? '<button class="row-ic-btn" data-estornar="'+c.id+'" title="Desfazer a baixa (voltar para a receber)" type="button">'+svg('activity')+'</button>' : '')
              + (c.statusBase==='a_receber' ? '<button class="row-ic-btn" data-edit="'+c.id+'" title="Editar" type="button">'+svg('edit')+'</button>' : '')
              + (c.statusBase==='a_receber' ? '<button class="row-ic-btn" data-cancelar="'+c.id+'" title="Cancelar" type="button">'+svg('x')+'</button>' : '')
              + (c.statusBase!=='recebido' ? '<button class="row-ic-btn danger" data-excluir="'+c.id+'" title="Excluir" type="button">'+svg('trash')+'</button>' : '')
            + '</div></td>'
          + '</tr>').join('')
          + '</tbody></table></div></div>';
      }

      root.innerHTML = html;

      const seg = document.getElementById('crSeg');
      if(seg) seg.querySelectorAll('button').forEach(b=> b.addEventListener('click', ()=>{ state.status = b.dataset.status; loadContas(); }));
      const search = document.getElementById('crSearch');
      if(search) search.addEventListener('input', ()=>{
        state.search = search.value;
        clearTimeout(search._t);
        search._t = setTimeout(loadContas, 300);
      });
      window.CerneJuntas.bind('crJuntas', loadContas);
      const retry = document.getElementById('crRetry');
      if(retry) retry.addEventListener('click', loadContas);
      const emptyNew = document.getElementById('crEmptyNew');
      if(emptyNew) emptyNew.addEventListener('click', ()=> openModal());

      root.querySelectorAll('[data-edit]').forEach(b=> b.addEventListener('click', ()=>{
        const conta = state.contas.find(c=>String(c.id)===b.dataset.edit);
        if(conta) openModal(conta);
      }));
      root.querySelectorAll('[data-receber]').forEach(b=> b.addEventListener('click', ()=>{
        const conta = state.contas.find(c=>String(c.id)===b.dataset.receber);
        if(conta) openBaixaModal(conta);
      }));
      root.querySelectorAll('[data-estornar]').forEach(b=> b.addEventListener('click', async ()=>{
        if(!window.confirm('Desfazer a baixa? O lançamento volta para "a receber".')) return;
        b.disabled = true;
        try{ await api('/'+b.dataset.estornar+'/estornar', { method:'PATCH' }); toast('Baixa desfeita.'); loadContas(); }
        catch(err){ toast(err.message,'error'); b.disabled = false; }
      }));
      root.querySelectorAll('[data-cancelar]').forEach(b=> b.addEventListener('click', async ()=>{
        b.disabled = true;
        try{ await api('/'+b.dataset.cancelar+'/cancelar', { method:'PATCH' }); toast('Conta cancelada.'); loadContas(); }
        catch(err){ toast(err.message,'error'); b.disabled = false; }
      }));
      root.querySelectorAll('[data-excluir]').forEach(b=> b.addEventListener('click', async ()=>{
        b.disabled = true;
        try{ await api('/'+b.dataset.excluir, { method:'DELETE' }); toast('Conta excluída.'); loadContas(); }
        catch(err){ toast(err.message,'error'); b.disabled = false; }
      }));
    }

    function openModal(conta){
      const isEdit = !!conta;
      const modalRoot = document.getElementById('modalRoot');
      const amanha = new Date(Date.now()+24*60*60*1000).toISOString().slice(0,10);
      modalRoot.innerHTML = '<div class="modal-overlay" id="modalOverlay">'
        + '<div class="modal-card" style="max-width:560px;">'
          + '<div class="modal-head"><div class="modal-title">'+(isEdit?'Editar conta a receber':'Nova conta a receber')+'</div>'
            + '<button class="row-ic-btn" id="modalClose" type="button">'+svg('x')+'</button></div>'
          + '<div class="modal-sub">'+(isEdit?'Atualize os dados da conta a receber.':'Preencha os dados para lançar uma nova conta a receber.')+'</div>'
          + '<form id="crForm">'
            + '<div class="field"><label>Descrição</label><input type="text" id="fDescricao" placeholder="Ex: Recebível cliente X" value="'+(isEdit?escapeHtml(conta.descricao):'')+'">'
              + '<div class="field-error" id="eDescricao" style="display:none;"></div></div>'
            + '<div class="field"><label>Origem <span class="opt">(opcional)</span></label><input type="text" id="fOrigem" list="dlOrigensReceber" value="'+(isEdit?escapeHtml(conta.origem||''):'')+'"><datalist id="dlOrigensReceber"></datalist></div>'
            + '<div class="inline-form" style="margin-top:0;">'
              + '<div class="field narrow"><label>Valor</label><input type="text" inputmode="decimal" id="fValor" value="'+(isEdit?String(conta.valor).replace('.',','):'')+'">'
                + '<div class="field-error" id="eValor" style="display:none;"></div></div>'
              + '<div class="field narrow"><label>Data prevista</label><input type="date" id="fDataPrevista" value="'+(isEdit?conta.dataPrevista:amanha)+'">'
                + '<div class="field-error" id="eDataPrevista" style="display:none;"></div></div>'
            + '</div>'
            + (isEdit ? '' : '<div class="inline-form" style="margin-top:0;">'
              + '<div class="field narrow"><label>Parcelas <span class="opt">(1 = lançamento único)</span></label><input type="number" id="fParcelas" min="1" max="60" value="1"></div>'
              + '<div class="field narrow"><label>O valor acima é…</label><select id="fValorEhTotal"><option value="0">de cada parcela</option><option value="1">o total (dividir)</option></select></div>'
            + '</div>')
            + '<div class="field"><label>Observação <span class="opt">(opcional)</span></label><input type="text" id="fObservacao" value="'+(isEdit?escapeHtml(conta.observacao||''):'')+'"></div>'
            + '<div class="modal-actions">'
              + '<button type="button" class="btn-secondary" id="modalCancel">Cancelar</button>'
              + '<button type="submit" class="btn-primary" id="modalSave">'+svg('check')+'<span>'+(isEdit?'Salvar alterações':'Criar conta')+'</span></button>'
            + '</div>'
          + '</form>'
        + '</div>'
      + '</div>';

      const overlay = document.getElementById('modalOverlay');
      const close = ()=> modalRoot.innerHTML = '';
      overlay.addEventListener('click', (e)=>{ if(e.target === overlay) close(); });
      document.getElementById('modalClose')?.addEventListener('click', close);
      document.getElementById('modalCancel')?.addEventListener('click', close);

      (async function carregarPickers(){
        try{
          const origens = await apiOrigens();
          const dl = document.getElementById('dlOrigensReceber');
          if(dl) dl.innerHTML = origens.map(function(o){ return '<option value="'+escapeHtml(o)+'"></option>'; }).join('');
        }catch(e){}
      })();

      document.getElementById('crForm')?.addEventListener('submit', async (e)=>{
        e.preventDefault();
        ['eDescricao','eValor','eDataPrevista'].forEach(id=>{ const el=document.getElementById(id); el.style.display='none'; el.textContent=''; });

        const payload = {
          empresaId: isEdit ? conta.empresaId : window.CerneFiltro.state.empresaId,
          descricao: document.getElementById('fDescricao').value,
          origem: document.getElementById('fOrigem').value,
          valor: Number(document.getElementById('fValor').value.replace(',','.')),
          dataPrevista: document.getElementById('fDataPrevista').value,
          observacao: document.getElementById('fObservacao').value,
        };
        if(!isEdit){
          const np = parseInt((document.getElementById('fParcelas')||{}).value, 10);
          if(np >= 2){ payload.parcelas = np; payload.valorEhTotal = (document.getElementById('fValorEhTotal')||{}).value === '1'; }
        }

        const saveBtn = document.getElementById('modalSave');
        saveBtn.disabled = true;
        try{
          if(isEdit) await api('/'+conta.id, { method:'PUT', body: JSON.stringify(payload) });
          else await api('', { method:'POST', body: JSON.stringify(payload) });
          close();
          toast(isEdit ? 'Conta atualizada.' : (payload.parcelas ? payload.parcelas+' parcelas criadas.' : 'Conta a receber criada.'));
          loadContas();
        }catch(err){
          saveBtn.disabled = false;
          if(err.errors){
            let mostrou = false;
            ['descricao','valor','dataPrevista'].forEach(function(campo){
              const elId = 'e'+campo.charAt(0).toUpperCase()+campo.slice(1);
              if(err.errors[campo] && document.getElementById(elId)){ const el=document.getElementById(elId); el.textContent=err.errors[campo]; el.style.display='block'; mostrou = true; }
            });
            if(!mostrou) toast(err.message, 'error');
          } else {
            toast(err.message, 'error');
          }
        }
      });
    }

  /* ================= RECEBIMENTOS — repasses do Mercado Livre (somente leitura) =================
     Ativado em 24/08/2026. Diferente de Contas a Receber: aqui os dados vêm
     REAIS da sincronização do Mercado Livre (ver lib/recebimentosMl.js) —
     nenhum cadastro manual nesta etapa. Data de liberação, valor e data de
     recebimento reais ainda não vêm da API — mostrados como "Informação
     não disponível" (nunca inventados), preparando o terreno para a
     conciliação futura (valor esperado x valor repassado) pedida pelo
     usuário. */
  (function(){
    const state = { loading:false, error:null, recebimentos:[], contasBancarias:[], saldoConsolidado:null, loadingBancos:false };

    function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function money(v){ return v===null||v===undefined ? '<span class="dash">Informação não disponível</span>' : 'R$ ' + Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2}); }
    function fmtDate(iso){ if(!iso) return '<span class="dash">Informação não disponível</span>'; try{ return new Date(iso).toLocaleDateString('pt-BR'); }catch(e){ return '<span class="dash">Informação não disponível</span>'; } }
    const STATUS_LABEL = { a_liberar:'A liberar', disponivel:'Disponível', recebido:'Recebido', divergente:'Divergente' };
    function statusChipStyle(status){
      const cor = status==='recebido' ? 'success' : status==='divergente' ? 'danger' : status==='disponivel' ? 'teal' : 'warning';
      return 'color:var(--'+cor+');background:var(--'+cor+'-soft);';
    }
    function toast(message, type){
      const wrap = document.getElementById('toastWrap');
      const el = document.createElement('div');
      el.className = 'toast ' + (type||'success');
      el.innerHTML = svg(type==='error' ? 'alertCircle':'checkCircle') + '<span>'+message+'</span>';
      wrap.appendChild(el);
      setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .25s'; setTimeout(()=>el.remove(),250); }, 3200);
    }

    async function api(path){
      const res = await fetch('/api/recebimentos'+path);
      let body = null; try{ body = await res.json(); }catch(e){}
      if(!res.ok) throw new Error((body&&body.error)||'Falha na requisição.');
      return body;
    }

    async function apiBancos(path, opts){
      const res = await fetch('/api/contas-bancarias'+path, opts ? { headers:{'Content-Type':'application/json'}, ...opts } : undefined);
      let body = null; try{ body = await res.json(); }catch(e){}
      if(!res.ok) throw new Error((body&&body.error)||'Falha na requisição.');
      return body;
    }

    async function loadContasBancarias(){
      const filtro = window.CerneFiltro.state;
      if(!filtro.empresaId){ state.contasBancarias=[]; state.saldoConsolidado=null; return; }
      state.loadingBancos = true;
      try{
        const data = await apiBancos('?'+new URLSearchParams({empresaId:filtro.empresaId}).toString());
        state.contasBancarias = data.contas||[]; state.saldoConsolidado = data.saldoConsolidado||null;
      }catch(err){ state.contasBancarias=[]; state.saldoConsolidado=null; }
      finally{ state.loadingBancos = false; }
    }

    async function loadRecebimentos(){
      const filtro = window.CerneFiltro.state;
      if(!filtro.empresaId){ state.recebimentos=[]; state.contasBancarias=[]; state.saldoConsolidado=null; state.loading=false; render(); return; }
      state.loading = true; state.error = null; render();
      try{
        const params = new URLSearchParams({ empresaId: filtro.empresaId, periodo: filtro.periodo });
        if(filtro.periodo === 'personalizado'){ if(filtro.desdePersonalizado) params.set('desde', filtro.desdePersonalizado); if(filtro.atePersonalizado) params.set('ate', filtro.atePersonalizado); }
        const [data] = await Promise.all([ api('?'+params.toString()), loadContasBancarias() ]);
        state.recebimentos = data.recebimentos;
      }catch(err){ state.error = err.message || 'Não foi possível carregar os recebimentos.'; }
      finally{ state.loading = false; render(); }
    }

    function load(){ loadRecebimentos(); }

    window.CerneFiltro.onChange(()=>{
      const page = document.getElementById('page-settlements');
      if(page && page.classList.contains('active')) loadRecebimentos();
      else render();
    });

    function render(){
      const root = document.getElementById('recebimentosRoot');
      if(!root) return;
      const filtro = window.CerneFiltro.state;

      if(!filtro.loadingEmpresas && !filtro.empresas.length){
        root.innerHTML = '<div class="empty-panel"><div class="empty-icon">'+svg('building')+'</div>'
          + '<h2>Nenhuma empresa ativa</h2>'
          + '<p class="lead">Cadastre e ative uma empresa, conecte o Mercado Livre em <strong>Marketplaces</strong> e sincronize para ver os recebimentos aqui.</p></div>';
        return;
      }

      let html = contasBancariasPanelHTML();

      html += '<div class="field-hint" style="margin-bottom:12px;max-width:720px;">Esta tela mostra os pedidos com pagamento aprovado do Mercado Livre no período selecionado. Data de liberação, valor recebido e data de recebimento ainda não são retornados pela API nesta integração — aparecem como "Informação não disponível" (nunca um valor inventado) até que essa fonte real exista. Preparado para, no futuro, comparar o valor que o ERP esperava receber com o valor que o marketplace realmente repassou.</div>';

      if(state.loading || filtro.loadingEmpresas){
        html += '<div class="table-card"><div class="table-skel"><span class="spin"></span><span>Carregando recebimentos…</span></div></div>';
      } else if(state.error){
        html += '<div class="empty-panel"><div class="empty-icon" style="color:var(--danger); background:var(--danger-soft);">'+svg('alertCircle')+'</div>'
          + '<h2 style="color:var(--danger);">Não foi possível carregar</h2><p class="lead">'+escapeHtml(state.error)+'</p></div>';
      } else if(!state.recebimentos.length){
        html += '<div class="empty-panel"><div class="empty-icon">'+svg('swap')+'</div>'
          + '<h2>Nenhum recebimento no período</h2>'
          + '<p class="lead">Não há pedidos com pagamento aprovado do Mercado Livre no período e empresa selecionados.</p></div>';
      } else {
        html += '<div class="table-card"><div class="table-wrap"><table class="data-table"><thead><tr>'
          + '<th>Loja</th><th>Pedido</th><th>Data da venda</th><th>Valor bruto</th><th>Taxas/descontos</th><th>Líquido esperado</th><th>Previsão de liberação</th><th>Recebido</th><th>Data recebimento</th><th>Status</th>'
          + '</tr></thead><tbody>'
          + state.recebimentos.map(r => '<tr>'
            + '<td>'+escapeHtml(r.loja||'—')+'</td>'
            + '<td class="mono">'+escapeHtml(r.pedidoRef)+'</td>'
            + '<td class="tab-nums">'+fmtDate(r.dataVenda)+'</td>'
            + '<td class="mono">'+money(r.valorBruto)+'</td>'
            + '<td class="mono">'+(r.taxasDescontos!==null?('− '+money(r.taxasDescontos)):money(null))+'</td>'
            + '<td class="mono">'+money(r.valorLiquidoEsperado)+'</td>'
            + '<td class="tab-nums">'+fmtDate(r.dataPrevistaLiberacao)+'</td>'
            + '<td class="mono">'+money(r.valorRecebido)+'</td>'
            + '<td class="tab-nums">'+fmtDate(r.dataRecebimento)+'</td>'
            + '<td><span class="status-chip" style="'+statusChipStyle(r.status)+'">'+(STATUS_LABEL[r.status]||r.status)+'</span></td>'
          + '</tr>').join('')
          + '</tbody></table></div></div>';
      }

      root.innerHTML = html;
      const btnNovaContaInline = document.getElementById('bancosEmptyNovaConta');
      if(btnNovaContaInline) btnNovaContaInline.addEventListener('click', ()=> openNovaContaBancariaModal());
    }

    function contasBancariasPanelHTML(){
      let html = '<div class="table-card" style="margin-bottom:16px;">'
        + '<div class="panel-head"><div class="panel-title"><span class="panel-title-ic">'+svg('wallet')+'</span>Contas bancárias</div></div>';
      if(state.loadingBancos){
        html += '<div class="table-skel" style="padding:20px;"><span class="spin"></span><span>Carregando contas bancárias…</span></div>';
      } else if(!state.contasBancarias.length){
        html += '<div class="empty-panel" style="padding:24px 20px;">'
          + '<div class="empty-icon">'+svg('wallet')+'</div>'
          + '<h2>Nenhuma conta bancária cadastrada</h2>'
          + '<p class="lead">Cadastre uma conta e importe um extrato (PDF do Nubank, CSV ou XLSX) para o saldo bancário entrar automaticamente no Fluxo de Caixa.</p>'
          + '<button class="primary-btn enabled" id="bancosEmptyNovaConta" type="button" style="margin-top:6px;">'+svg('plus')+'<span>Nova conta bancária</span></button>'
          + '</div>';
      } else {
        const sc = state.saldoConsolidado;
        html += '<div style="padding:14px 20px 6px;">'
          + '<div class="kpi-sec" style="'+(sc?'--tint:var(--success);--tint-soft:var(--success-soft);':'--tint:var(--text-muted);--tint-soft:var(--surface-2);')+'max-width:340px;">'
          + '<div class="kpi-sec-icon">'+svg('wallet')+'</div>'
          + '<div class="kpi-sec-body"><div class="kpi-sec-label">Saldo bancário consolidado</div>'
          + '<div class="kpi-sec-value">'+(sc?money(sc.valor):'<span class="dash">Saldo não informado</span>')+'</div>'
          + (sc&&sc.dataReferencia?'<div class="di-sub">Referência: '+fmtDate(sc.dataReferencia)+(sc.contasSemSaldo?' · '+sc.contasSemSaldo+' conta(s) sem saldo importado':'')+'</div>':'')
          + '</div></div></div>'
          + '<div class="table-wrap"><table class="data-table"><thead><tr><th>Conta</th><th>Banco</th><th>Saldo atual</th><th>Atualizado em</th></tr></thead><tbody>'
          + state.contasBancarias.map(c=>'<tr><td>'+escapeHtml(c.nome)+(c.agencia||c.conta?'<div class="di-sub">'+escapeHtml([c.agencia,c.conta].filter(Boolean).join(' · '))+'</div>':'')+'</td>'
            + '<td>'+escapeHtml(c.banco||'—')+'</td>'
            + '<td class="mono">'+(c.saldoAtual===null?'<span class="dash">Saldo não informado</span>':money(c.saldoAtual))+'</td>'
            + '<td class="tab-nums">'+(c.saldoData?fmtDate(c.saldoData):'<span class="dash">—</span>')+'</td></tr>').join('')
          + '</tbody></table></div>';
      }
      html += '</div>';
      return html;
    }

    async function lerArquivoBase64(file){
      return new Promise((resolve,reject)=>{
        const reader = new FileReader();
        reader.onload = ()=> resolve(String(reader.result).replace(/^data:[^;]+;base64,/, ''));
        reader.onerror = ()=> reject(new Error('Não foi possível ler o arquivo.'));
        reader.readAsDataURL(file);
      });
    }

    function openNovaContaBancariaModal(){
      const empresaId = Number(window.CerneFiltro.state.empresaId);
      if(!empresaId){ toast('Selecione uma empresa antes de cadastrar uma conta.', 'error'); return; }

      const close = ()=> modalRoot.innerHTML='';
      modalRoot.innerHTML = '<div class="modal-overlay" id="ncbOverlay"><div class="modal-card" style="max-width:480px;">'
        + '<div class="modal-head"><div class="modal-title">Nova conta bancária</div><button class="row-ic-btn" id="ncbClose" type="button">'+svg('x')+'</button></div>'
        + '<div class="modal-sub">Cadastre a conta para depois importar o extrato e manter o saldo bancário atualizado automaticamente.</div>'
        + '<div class="form-grid" style="margin-top:14px;display:flex;flex-direction:column;gap:12px;">'
          + '<label>Nome da conta *<input type="text" id="ncbNome" placeholder="Ex.: Nubank PJ"></label>'
          + '<label>Banco<input type="text" id="ncbBanco" placeholder="Ex.: Nubank"></label>'
          + '<label>Agência<input type="text" id="ncbAgencia"></label>'
          + '<label>Conta<input type="text" id="ncbConta" placeholder="Ex.: 123456789-0"></label>'
        + '</div>'
        + '<div class="modal-actions"><button class="btn-secondary" id="ncbCancelar" type="button">Cancelar</button><button class="btn-primary" id="ncbSalvar" type="button">'+svg('check')+'<span>Cadastrar conta</span></button></div>'
        + '</div></div>';
      document.getElementById('ncbClose')?.addEventListener('click', close);
      document.getElementById('ncbCancelar')?.addEventListener('click', close);
      document.getElementById('ncbOverlay')?.addEventListener('click', e=>{ if(e.target.id==='ncbOverlay') close(); });
      document.getElementById('ncbSalvar')?.addEventListener('click', async ()=>{
        const btn = document.getElementById('ncbSalvar');
        const nome = document.getElementById('ncbNome').value.trim();
        if(!nome){ toast('Informe o nome da conta.', 'error'); return; }
        btn.disabled = true; btn.querySelector('span').textContent='Salvando…';
        try{
          const r = await apiBancos('', { method:'POST', body: JSON.stringify({
            empresaId, nome,
            banco: document.getElementById('ncbBanco').value.trim(),
            agencia: document.getElementById('ncbAgencia').value.trim(),
            conta: document.getElementById('ncbConta').value.trim(),
          })});
          if(r.errors){ toast(Object.values(r.errors)[0], 'error'); btn.disabled=false; btn.querySelector('span').textContent='Cadastrar conta'; return; }

          await loadContasBancarias(); render();

      });
    }

    function openImportExtratoModal(){
      const empresaId = Number(window.CerneFiltro.state.empresaId);
      if(!empresaId){ toast('Selecione uma empresa antes de importar um extrato.', 'error'); return; }
      if(!state.contasBancarias.length){ toast('Cadastre uma conta bancária antes de importar um extrato.', 'error'); return; }
      const modalRoot = document.getElementById('modalRoot');
      const close = ()=> modalRoot.innerHTML='';
      const imp = { contaBancariaId:'', file:null, analise:null, saldoManualFinal:'', saldoManualData:'' };

      function shell(conteudo, largura){
        modalRoot.innerHTML = '<div class="modal-overlay" id="impExtOverlay">'
          + '<div class="modal-card" style="max-width:'+(largura||'620px')+';max-height:92vh;overflow:auto;">'
            + '<div class="modal-head"><div class="modal-title">Importar extrato</div>'
              + '<button class="row-ic-btn" id="impExtClose" type="button">'+svg('x')+'</button></div>'
            + conteudo
          + '</div></div>';
        document.getElementById('impExtClose')?.addEventListener('click', close);
        document.getElementById('impExtOverlay')?.addEventListener('click', e=>{ if(e.target.id==='impExtOverlay') close(); });
      }

      function renderEscolha(){
        shell('<div class="modal-sub">Escolha a conta bancária e o arquivo do extrato. Aceita PDF do Nubank, CSV ou XLSX.</div>'
          + '<div style="display:flex;flex-direction:column;gap:12px;margin-top:14px;">'
            + '<label>Conta bancária *<select id="impExtConta"><option value="">Selecione…</option>'
              + state.contasBancarias.map(c=>'<option value="'+c.id+'">'+escapeHtml(c.nome)+(c.banco?' — '+escapeHtml(c.banco):'')+'</option>').join('')
              + '</select></label>'
          + '</div>'
          + '<div class="empty-panel" style="margin-top:14px;padding:26px 18px;">'
            + '<div class="empty-icon">'+svg('fileText')+'</div>'
            + '<h2>Selecione o arquivo do extrato</h2>'
            + '<p class="lead">PDF do Nubank, CSV ou XLSX, até 10 MB.</p>'
            + '<input type="file" id="impExtFile" accept=".pdf,.csv,.xlsx" style="display:none;">'
            + '<button class="primary-btn enabled" id="impExtChoose" type="button" style="margin-top:8px;">'+svg('fileText')+'<span>Escolher arquivo</span></button>'
          + '</div>');
        const input = document.getElementById('impExtFile');
        const selConta = document.getElementById('impExtConta');
        if(imp.contaBancariaId) selConta.value = imp.contaBancariaId;
        selConta.addEventListener('change', ()=> imp.contaBancariaId = selConta.value);
        document.getElementById('impExtChoose')?.addEventListener('click', ()=>input.click());
        input.addEventListener('change', async ()=>{
          const file = input.files && input.files[0]; if(!file) return;
          if(!imp.contaBancariaId){ toast('Selecione a conta bancária antes de escolher o arquivo.', 'error'); return; }
          if(file.size > 10*1024*1024){ toast('Arquivo maior que 10 MB.', 'error'); return; }
          const btn = document.getElementById('impExtChoose'); btn.disabled=true; btn.querySelector('span').textContent='Analisando extrato…';
          try{
            imp.file = file;
            const arquivoBase64 = await lerArquivoBase64(file);
            imp.analise = await apiBancos('/importar/analisar', { method:'POST', body: JSON.stringify({ nomeArquivo:file.name, arquivoBase64 }) });
            imp.saldoManualFinal=''; imp.saldoManualData='';
            renderPreview();
          }catch(err){ toast(err.message,'error'); btn.disabled=false; btn.querySelector('span').textContent='Escolher arquivo'; }
        });
      }

      function renderPreview(){
        const a = imp.analise.analise;
        const contaSelecionada = state.contasBancarias.find(c=>String(c.id)===String(imp.contaBancariaId));
        const semSaldo = a.saldoFinal===null || a.saldoFinal===undefined;
        const linhas = (a.preview||[]).slice(0,10).map(m=>'<tr><td class="tab-nums">'+fmtDate(m.data)+'</td><td>'+(m.tipo==='entrada'?'Entrada':'Saída')+'</td><td>'+escapeHtml(m.descricao||'')+'</td><td class="mono">'+money(m.valor)+'</td></tr>').join('');

          + (semSaldo
            ? '<div class="empty-panel" style="margin-top:14px;padding:18px;">'
              + '<div class="empty-icon" style="color:var(--warning);background:var(--warning-soft);">'+svg('alertCircle')+'</div>'
              + '<h2 style="font-size:15px;">Não foi possível identificar o saldo final deste extrato.</h2>'
