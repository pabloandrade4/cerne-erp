          + '<p class="lead">Cadastre e ative uma empresa em <strong>Cadastros → Empresas</strong> antes de lançar contas a receber.</p></div>';
        return;
      }

      let html = '';
      if(state.resumo) html += kpisHTML(state.resumo);

      html += '<div class="toolbar">'
        + '<div class="seg" id="crSeg">'
          + [['todos','Todos']].concat(STATUS_OPCOES).map(function(par){ return '<button data-status="'+par[0]+'" class="'+(state.status===par[0]?'active':'')+'">'+par[1]+'</button>'; }).join('')
        + '</div>'
        + '<div class="search-box">'+svg('search')+'<input type="text" id="crSearch" placeholder="Buscar por descrição ou origem" value="'+state.search.replace(/"/g,'&quot;')+'"></div>'
      + '</div>';

      if(state.loading || filtro.loadingEmpresas){
        html += '<div class="table-card"><div class="table-skel"><span class="spin"></span><span>Carregando contas a receber…</span></div></div>';
      } else if(state.error){
        html += '<div class="empty-panel"><div class="empty-icon" style="color:var(--danger); background:var(--danger-soft);">'+svg('alertCircle')+'</div>'
          + '<h2 style="color:var(--danger);">Não foi possível carregar</h2><p class="lead">'+escapeHtml(state.error)+'</p>'
          + '<button class="ghost-btn" id="crRetry" style="cursor:pointer; opacity:1;">'+svg('activity')+'<span>Tentar novamente</span></button></div>';
      } else if(!state.contas.length){
        const filtrado = !!(state.search || state.status!=='todos');
        html += '<div class="empty-panel"><div class="empty-icon">'+svg('arrowDownCircle')+'</div>'
          + '<h2>Nenhuma conta a receber encontrada</h2>'
          + '<p class="lead">'+(filtrado ? 'Nenhuma conta corresponde ao filtro atual.' : 'Cadastre o primeiro lançamento a receber desta empresa no período selecionado.')+'</p>'
          + (filtrado ? '' : '<button class="primary-btn enabled" id="crEmptyNew" type="button">'+svg('plus')+'<span>Nova conta a receber</span></button>')
        + '</div>';
      } else {
        html += '<div class="table-card"><div class="table-wrap"><table class="data-table"><thead><tr>'
          + '<th>Prevista</th><th>Descrição</th><th>Origem</th><th>Valor</th><th>Status</th><th></th>'
          + '</tr></thead><tbody>'
          + state.contas.map(c => '<tr'+(c.status==='cancelado'?' style="opacity:.6;"':'')+'>'
            + '<td class="tab-nums">'+fmtDate(c.dataPrevista)+'</td>'
            + '<td>'+escapeHtml(c.descricao)+(c.observacao?'<div class="di-sub">'+escapeHtml(c.observacao)+'</div>':'')+'</td>'
            + '<td>'+escapeHtml(c.origem||'—')+'</td>'
            + '<td class="mono">'+money(c.valor)+'</td>'
            + '<td><span class="status-chip" style="'+statusChipStyle(c.status)+'">'+STATUS_LABEL[c.status]+'</span>'
              + (c.status==='recebido' ? '<div class="di-sub">recebido em '+fmtDate(c.dataRecebida)+'</div>' : '')+'</td>'
            + '<td><div class="row-actions">'
              + (c.statusBase==='a_receber' ? '<button class="row-ic-btn" data-receber="'+c.id+'" title="Marcar como recebido" type="button">'+svg('check')+'</button>' : '')
              + (c.statusBase==='a_receber' ? '<button class="row-ic-btn" data-edit="'+c.id+'" title="Editar" type="button">'+svg('edit')+'</button>' : '')
              + (c.statusBase==='a_receber' ? '<button class="row-ic-btn" data-cancelar="'+c.id+'" title="Cancelar" type="button">'+svg('x')+'</button>' : '')
              + (c.statusBase!=='recebido' ? '<button class="row-ic-btn danger" data-excluir="'+c.id+'" title="Excluir" type="button">'+svg('trash')+'</button>' : '')
            + '</div></td>'
          + '</tr>').join('')
          + '</tbody></table></div></div>';
      }

      root.innerHTML = html;

      const seg = document.getElementById('crSeg');
      if(seg) seg.querySelectorAll('button').forEach(b=> b.addEventListener('click', ()=>{ state.status = b.dataset.status; loadContas(); }));
      const search = document.getElementById('crSearch');
      if(search) search.addEventListener('input', ()=>{
        state.search = search.value;
        clearTimeout(search._t);
        search._t = setTimeout(loadContas, 300);
      });
      const retry = document.getElementById('crRetry');
      if(retry) retry.addEventListener('click', loadContas);
      const emptyNew = document.getElementById('crEmptyNew');
      if(emptyNew) emptyNew.addEventListener('click', ()=> openModal());

      root.querySelectorAll('[data-edit]').forEach(b=> b.addEventListener('click', ()=>{
        const conta = state.contas.find(c=>String(c.id)===b.dataset.edit);
        if(conta) openModal(conta);
      }));
      root.querySelectorAll('[data-receber]').forEach(b=> b.addEventListener('click', async ()=>{
        const hoje = new Date().toISOString().slice(0,10);
        b.disabled = true;
        try{ await api('/'+b.dataset.receber+'/receber', { method:'PATCH', body: JSON.stringify({ dataRecebida: hoje }) }); toast('Conta marcada como recebida.'); loadContas(); }
        catch(err){ toast(err.message,'error'); b.disabled = false; }
      }));
      root.querySelectorAll('[data-cancelar]').forEach(b=> b.addEventListener('click', async ()=>{
        b.disabled = true;
        try{ await api('/'+b.dataset.cancelar+'/cancelar', { method:'PATCH' }); toast('Conta cancelada.'); loadContas(); }
        catch(err){ toast(err.message,'error'); b.disabled = false; }
      }));
      root.querySelectorAll('[data-excluir]').forEach(b=> b.addEventListener('click', async ()=>{
        b.disabled = true;
        try{ await api('/'+b.dataset.excluir, { method:'DELETE' }); toast('Conta excluída.'); loadContas(); }
        catch(err){ toast(err.message,'error'); b.disabled = false; }
      }));
    }

    function openModal(conta){
      const isEdit = !!conta;
      const modalRoot = document.getElementById('modalRoot');
      const amanha = new Date(Date.now()+24*60*60*1000).toISOString().slice(0,10);
      modalRoot.innerHTML = '<div class="modal-overlay" id="modalOverlay">'
        + '<div class="modal-card" style="max-width:560px;">'
          + '<div class="modal-head"><div class="modal-title">'+(isEdit?'Editar conta a receber':'Nova conta a receber')+'</div>'
            + '<button class="row-ic-btn" id="modalClose" type="button">'+svg('x')+'</button></div>'
          + '<div class="modal-sub">'+(isEdit?'Atualize os dados da conta a receber.':'Preencha os dados para lançar uma nova conta a receber.')+'</div>'
          + '<form id="crForm">'
            + '<div class="field"><label>Descrição</label><input type="text" id="fDescricao" placeholder="Ex: Recebível cliente X" value="'+(isEdit?escapeHtml(conta.descricao):'')+'">'
              + '<div class="field-error" id="eDescricao" style="display:none;"></div></div>'
            + '<div class="field"><label>Origem <span class="opt">(opcional)</span></label><input type="text" id="fOrigem" list="dlOrigensReceber" value="'+(isEdit?escapeHtml(conta.origem||''):'')+'"><datalist id="dlOrigensReceber"></datalist></div>'
            + '<div class="inline-form" style="margin-top:0;">'
              + '<div class="field narrow"><label>Valor</label><input type="text" inputmode="decimal" id="fValor" value="'+(isEdit?String(conta.valor).replace('.',','):'')+'">'
                + '<div class="field-error" id="eValor" style="display:none;"></div></div>'
              + '<div class="field narrow"><label>Data prevista</label><input type="date" id="fDataPrevista" value="'+(isEdit?conta.dataPrevista:amanha)+'">'
                + '<div class="field-error" id="eDataPrevista" style="display:none;"></div></div>'
            + '</div>'
            + '<div class="field"><label>Observação <span class="opt">(opcional)</span></label><input type="text" id="fObservacao" value="'+(isEdit?escapeHtml(conta.observacao||''):'')+'"></div>'
            + '<div class="modal-actions">'
              + '<button type="button" class="btn-secondary" id="modalCancel">Cancelar</button>'
              + '<button type="submit" class="btn-primary" id="modalSave">'+svg('check')+'<span>'+(isEdit?'Salvar alterações':'Criar conta')+'</span></button>'
            + '</div>'
          + '</form>'
        + '</div>'
      + '</div>';

      const overlay = document.getElementById('modalOverlay');
      const close = ()=> modalRoot.innerHTML = '';
      overlay.addEventListener('click', (e)=>{ if(e.target === overlay) close(); });
      document.getElementById('modalClose').addEventListener('click', close);
      document.getElementById('modalCancel').addEventListener('click', close);

      (async function carregarPickers(){
        try{
          const origens = await apiOrigens();
          const dl = document.getElementById('dlOrigensReceber');
          if(dl) dl.innerHTML = origens.map(function(o){ return '<option value="'+escapeHtml(o)+'"></option>'; }).join('');
        }catch(e){}
      })();

      document.getElementById('crForm').addEventListener('submit', async (e)=>{
        e.preventDefault();
        ['eDescricao','eValor','eDataPrevista'].forEach(id=>{ const el=document.getElementById(id); el.style.display='none'; el.textContent=''; });

        const payload = {
          empresaId: window.CerneFiltro.state.empresaId,
          descricao: document.getElementById('fDescricao').value,
          origem: document.getElementById('fOrigem').value,
          valor: Number(document.getElementById('fValor').value.replace(',','.')),
          dataPrevista: document.getElementById('fDataPrevista').value,
          observacao: document.getElementById('fObservacao').value,
        };

        const saveBtn = document.getElementById('modalSave');
        saveBtn.disabled = true;
        try{
          if(isEdit) await api('/'+conta.id, { method:'PUT', body: JSON.stringify(payload) });
          else await api('', { method:'POST', body: JSON.stringify(payload) });
          close();
          toast(isEdit ? 'Conta atualizada.' : 'Conta a receber criada.');
          loadContas();
        }catch(err){
          saveBtn.disabled = false;
          if(err.errors){
            let mostrou = false;
            ['descricao','valor','dataPrevista'].forEach(function(campo){
              const elId = 'e'+campo.charAt(0).toUpperCase()+campo.slice(1);
              if(err.errors[campo] && document.getElementById(elId)){ const el=document.getElementById(elId); el.textContent=err.errors[campo]; el.style.display='block'; mostrou = true; }
            });
            if(!mostrou) toast(err.message, 'error');
          } else {
            toast(err.message, 'error');
          }
        }
      });
    }

    document.getElementById('btnNewContaReceber').addEventListener('click', ()=> openModal());

    window.ContasReceber = { load };
  })();

  /* ================= RECEBIMENTOS — repasses do Mercado Livre (somente leitura) =================
     Ativado em 24/08/2026. Diferente de Contas a Receber: aqui os dados vêm
     REAIS da sincronização do Mercado Livre (ver lib/recebimentosMl.js) —
     nenhum cadastro manual nesta etapa. Data de liberação, valor e data de
     recebimento reais ainda não vêm da API — mostrados como "Informação
     não disponível" (nunca inventados), preparando o terreno para a
     conciliação futura (valor esperado x valor repassado) pedida pelo
     usuário. */
  (function(){
    const state = { loading:false, error:null, recebimentos:[] };

    function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function money(v){ return v===null||v===undefined ? '<span class="dash">Informação não disponível</span>' : 'R$ ' + Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2}); }
    function fmtDate(iso){ if(!iso) return '<span class="dash">Informação não disponível</span>'; try{ return new Date(iso).toLocaleDateString('pt-BR'); }catch(e){ return '<span class="dash">Informação não disponível</span>'; } }
    const STATUS_LABEL = { a_liberar:'A liberar', disponivel:'Disponível', recebido:'Recebido', divergente:'Divergente' };
    function statusChipStyle(status){
      const cor = status==='recebido' ? 'success' : status==='divergente' ? 'danger' : status==='disponivel' ? 'teal' : 'warning';
      return 'color:var(--'+cor+');background:var(--'+cor+'-soft);';
    }

    async function api(path){
      const res = await fetch('/api/recebimentos'+path);
      let body = null; try{ body = await res.json(); }catch(e){}
      if(!res.ok) throw new Error((body&&body.error)||'Falha na requisição.');
      return body;
    }

    async function loadRecebimentos(){
      const filtro = window.CerneFiltro.state;
      if(!filtro.empresaId){ state.recebimentos=[]; state.loading=false; render(); return; }
      state.loading = true; state.error = null; render();
      try{
        const params = new URLSearchParams({ empresaId: filtro.empresaId, periodo: filtro.periodo });
        const data = await api('?'+params.toString());
        state.recebimentos = data.recebimentos;
      }catch(err){ state.error = err.message || 'Não foi possível carregar os recebimentos.'; }
      finally{ state.loading = false; render(); }
    }

    function load(){ loadRecebimentos(); }

    window.CerneFiltro.onChange(()=>{
      const page = document.getElementById('page-settlements');
      if(page && page.classList.contains('active')) loadRecebimentos();
      else render();
    });

    function render(){
      const root = document.getElementById('recebimentosRoot');
      if(!root) return;
      const filtro = window.CerneFiltro.state;

      if(!filtro.loadingEmpresas && !filtro.empresas.length){
        root.innerHTML = '<div class="empty-panel"><div class="empty-icon">'+svg('building')+'</div>'
          + '<h2>Nenhuma empresa ativa</h2>'
          + '<p class="lead">Cadastre e ative uma empresa, conecte o Mercado Livre em <strong>Marketplaces</strong> e sincronize para ver os recebimentos aqui.</p></div>';
        return;
      }

      let html = '<div class="field-hint" style="margin-bottom:12px;max-width:720px;">Esta tela mostra os pedidos com pagamento aprovado do Mercado Livre no período selecionado. Data de liberação, valor recebido e data de recebimento ainda não são retornados pela API nesta integração — aparecem como "Informação não disponível" (nunca um valor inventado) até que essa fonte real exista. Preparado para, no futuro, comparar o valor que o ERP esperava receber com o valor que o marketplace realmente repassou.</div>';

      if(state.loading || filtro.loadingEmpresas){
        html += '<div class="table-card"><div class="table-skel"><span class="spin"></span><span>Carregando recebimentos…</span></div></div>';
      } else if(state.error){
        html += '<div class="empty-panel"><div class="empty-icon" style="color:var(--danger); background:var(--danger-soft);">'+svg('alertCircle')+'</div>'
          + '<h2 style="color:var(--danger);">Não foi possível carregar</h2><p class="lead">'+escapeHtml(state.error)+'</p></div>';
      } else if(!state.recebimentos.length){
        html += '<div class="empty-panel"><div class="empty-icon">'+svg('swap')+'</div>'
          + '<h2>Nenhum recebimento no período</h2>'
          + '<p class="lead">Não há pedidos com pagamento aprovado do Mercado Livre no período e empresa selecionados.</p></div>';
      } else {
        html += '<div class="table-card"><div class="table-wrap"><table class="data-table"><thead><tr>'
          + '<th>Loja</th><th>Pedido</th><th>Data da venda</th><th>Valor bruto</th><th>Taxas/descontos</th><th>Líquido esperado</th><th>Previsão de liberação</th><th>Recebido</th><th>Data recebimento</th><th>Status</th>'
          + '</tr></thead><tbody>'
          + state.recebimentos.map(r => '<tr>'
            + '<td>'+escapeHtml(r.loja||'—')+'</td>'
            + '<td class="mono">'+escapeHtml(r.pedidoRef)+'</td>'
            + '<td class="tab-nums">'+fmtDate(r.dataVenda)+'</td>'
            + '<td class="mono">'+money(r.valorBruto)+'</td>'
            + '<td class="mono">'+(r.taxasDescontos!==null?('− '+money(r.taxasDescontos)):money(null))+'</td>'
            + '<td class="mono">'+money(r.valorLiquidoEsperado)+'</td>'
            + '<td class="tab-nums">'+fmtDate(r.dataPrevistaLiberacao)+'</td>'
            + '<td class="mono">'+money(r.valorRecebido)+'</td>'
            + '<td class="tab-nums">'+fmtDate(r.dataRecebimento)+'</td>'
            + '<td><span class="status-chip" style="'+statusChipStyle(r.status)+'">'+(STATUS_LABEL[r.status]||r.status)+'</span></td>'
          + '</tr>').join('')
          + '</tbody></table></div></div>';
      }

      root.innerHTML = html;
    }

    window.Recebimentos = { load };
  })();

  /* ================= DESPESAS FIXAS — cadastro de despesas recorrentes =================
     Ativado em 25/08/2026 (ver docs/04-alteracoes.md). Usa o filtro do
     HEADER (só empresa — window.CerneFiltro.state.empresaId; despesa fixa
     não tem período, é um cadastro, igual Empresas/Fornecedores/Produtos).
     Uma despesa fixa é só o MOLDE — quem representa dinheiro de verdade é a
     Conta a Pagar gerada automaticamente em segundo plano (ver
     server/lib/despesasFixasScheduler.js); o botão "Gerar agora" força um
     ciclo imediato pra quem acabou de cadastrar não precisar esperar. */
  (function(){
    const FREQ_LABEL = { mensal:'Mensal', semanal:'Semanal', anual:'Anual' };
    const DIA_SEMANA_LABEL = { 1:'Segunda-feira', 2:'Terça-feira', 3:'Quarta-feira', 4:'Quinta-feira', 5:'Sexta-feira', 6:'Sábado', 7:'Domingo' };
    const state = { loading:false, error:null, despesas:[], ativoFiltro:'todos', geracaoAutomatica:null, gerandoAgora:false };
    let categoriasSugeridas = null;

    function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function money(v){ return v===null||v===undefined ? '—' : 'R$ ' + Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2}); }
    function fmtDate(iso){ if(!iso) return '—'; try{ const [y,m,d] = String(iso).slice(0,10).split('-'); return d+'/'+m+'/'+y; }catch(e){ return '—'; } }
    function hojeBRT(){
      const BRT_OFFSET_MS = 3*60*60*1000;
      const brt = new Date(Date.now() - BRT_OFFSET_MS);
      const p = n => String(n).padStart(2,'0');
      return brt.getUTCFullYear()+'-'+p(brt.getUTCMonth()+1)+'-'+p(brt.getUTCDate());
    }
    function diaDaSemanaISO(dataStr){
      const [y,m,d] = dataStr.split('-').map(Number);
      const dow = new Date(Date.UTC(y,m-1,d)).getUTCDay();
      return dow===0 ? 7 : dow;
    }
    function vencimentoLabel(d){
      if(d.frequencia==='semanal') return DIA_SEMANA_LABEL[d.diaVencimento] || ('Dia '+d.diaVencimento);
      if(d.frequencia==='anual'){ const [,m] = (d.dataInicio||'').split('-'); const MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez']; return 'Dia '+d.diaVencimento+'/'+(MESES[Number(m)-1]||''); }
      return 'Dia '+d.diaVencimento;
    }
    function toast(message, type){
      const wrap = document.getElementById('toastWrap');
      const el = document.createElement('div');
      el.className = 'toast ' + (type||'success');
      el.innerHTML = svg(type==='error' ? 'alertCircle':'checkCircle') + '<span>'+message+'</span>';
      wrap.appendChild(el);
      setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .25s'; setTimeout(()=>el.remove(),250); }, 3200);
    }

    async function api(path, opts){
      const res = await fetch('/api/despesas-fixas'+path, { headers:{'Content-Type':'application/json'}, ...opts });
      let body = null; try{ body = await res.json(); }catch(e){}
      if(!res.ok){ const err = new Error((body&&(body.error||(body.errors&&body.errors.geral)))||'Falha na requisição.'); err.errors = body&&body.errors; throw err; }
      return body;
    }
    async function apiCategorias(){
      if(categoriasSugeridas) return categoriasSugeridas;
      try{ const res = await fetch('/api/despesas-fixas/categorias-sugeridas'); categoriasSugeridas = ((await res.json()).categorias)||[]; }
      catch(e){ categoriasSugeridas = []; }
      return categoriasSugeridas;
    }

    async function loadDespesas(){
      const filtro = window.CerneFiltro.state;
      if(!filtro.empresaId){ state.despesas=[]; state.loading=false; render(); return; }
      state.loading = true; state.error = null; render();
      try{
        const params = new URLSearchParams({ empresaId: filtro.empresaId });
        if(state.ativoFiltro !== 'todos') params.set('ativo', state.ativoFiltro);
        const data = await api('?'+params.toString());
        state.despesas = data.despesas;
        state.geracaoAutomatica = data.geracaoAutomatica;
      }catch(err){ state.error = err.message || 'Não foi possível carregar as despesas fixas.'; }
      finally{ state.loading = false; render(); }
    }

    function load(){ loadDespesas(); }

    window.CerneFiltro.onChange(()=>{
      const page = document.getElementById('page-fixedExpenses');
      if(page && page.classList.contains('active')) loadDespesas();
      else render();
    });

    function statusGeracaoTexto(g){
      if(!g) return '';
      if(g.emExecucao) return 'Gerando agora…';
      if(!g.ultimaExecucaoEm) return 'Ainda não rodou nenhum ciclo de geração.';
      const quando = new Date(g.ultimaExecucaoEm).toLocaleString('pt-BR');
      if(g.ultimoErro) return 'Último ciclo (' + quando + ') falhou: ' + g.ultimoErro;
      return 'Última verificação: ' + quando + (g.ultimoTotalGeradas ? (' — ' + g.ultimoTotalGeradas + ' conta(s) a pagar gerada(s)') : ' — nenhuma conta nova (já estava tudo gerado)');
    }

    function render(){
      const root = document.getElementById('despesasFixasRoot');
      if(!root) return;
      const filtro = window.CerneFiltro.state;

      if(!filtro.loadingEmpresas && !filtro.empresas.length){
        root.innerHTML = '<div class="empty-panel"><div class="empty-icon">'+svg('building')+'</div>'
          + '<h2>Nenhuma empresa ativa</h2>'
          + '<p class="lead">Cadastre e ative uma empresa em <strong>Cadastros → Empresas</strong> antes de cadastrar despesas fixas.</p></div>';
        return;
      }

            + '<td>'+vencimentoLabel(d)+'</td>'
            + '<td class="tab-nums">'+fmtDate(d.dataInicio)+'</td>'

            + '<td><span class="status-chip" style="color:var(--'+(d.ativo?'success':'text-muted')+');background:'+(d.ativo?'var(--success-soft)':'var(--surface-2)')+';">'+(d.ativo?'Ativa':'Inativa')+'</span></td>'
            + '<td><div class="row-actions">'
              + '<button class="row-ic-btn" data-edit="'+d.id+'" title="Editar" type="button">'+svg('edit')+'</button>'
              + (d.ativo
                ? '<button class="row-ic-btn" data-desativar="'+d.id+'" title="Desativar" type="button">'+svg('power')+'</button>'
                : '<button class="row-ic-btn" data-ativar="'+d.id+'" title="Ativar" type="button">'+svg('power')+'</button>')

      root.innerHTML = html;

      const seg = document.getElementById('dfSeg');
      if(seg) seg.querySelectorAll('button').forEach(b=> b.addEventListener('click', ()=>{ state.ativoFiltro = b.dataset.ativo; loadDespesas(); }));
      const retry = document.getElementById('dfRetry');
      if(retry) retry.addEventListener('click', loadDespesas);
      const emptyNew = document.getElementById('dfEmptyNew');
      if(emptyNew) emptyNew.addEventListener('click', ()=> openModal());
      const gerarAgora = document.getElementById('dfGerarAgora');
      if(gerarAgora) gerarAgora.addEventListener('click', async ()=>{
        state.gerandoAgora = true; render();

          loadDespesas();

      root.querySelectorAll('[data-edit]').forEach(b=> b.addEventListener('click', ()=>{

      root.querySelectorAll('[data-ativar]').forEach(b=> b.addEventListener('click', async ()=>{
        b.disabled = true;
        try{ await api('/'+b.dataset.ativar+'/ativar', { method:'PATCH' }); toast('Despesa fixa ativada.'); loadDespesas(); }
        catch(err){ toast(err.message,'error'); b.disabled = false; }
      }));
      root.querySelectorAll('[data-desativar]').forEach(b=> b.addEventListener('click', async ()=>{
        b.disabled = true;
        try{ await api('/'+b.dataset.desativar+'/desativar', { method:'PATCH' }); toast('Despesa fixa desativada — as contas já geradas continuam intactas.'); loadDespesas(); }
        catch(err){ toast(err.message,'error'); b.disabled = false; }
      }));
      root.querySelectorAll('[data-excluir]').forEach(b=> b.addEventListener('click', async ()=>{
        b.disabled = true;
        try{ await api('/'+b.dataset.excluir, { method:'DELETE' }); toast('Despesa fixa excluída.'); loadDespesas(); }

    function openModal(despesa){

  /* ================= FLUXO DE CAIXA — evolução diária do caixa =================
     Ativado em 25/08/2026 (ver docs/04-alteracoes.md e docs/02-decisoes.md).
     Usa a empresa do filtro do HEADER (window.CerneFiltro.state.empresaId),
     mas tem PERÍODO PRÓPRIO (7/15/30 dias, este mês, próximo mês, período
     personalizado) — diferente do período do header (hoje/ontem/7d/30d/mes,
     que nunca inclui datas futuras): Fluxo de Caixa é sempre uma projeção
     pra FRENTE, então precisa do próprio filtro (ver lib/fluxoCaixa.js).
     REALIZADO x PROJETADO sempre separados visualmente; "Saldo atual"/
     "Saldo projetado" só aparecem se o usuário informar um saldo inicial —
     o ERP não tem integração bancária real, nunca inventa esse número. */
  (function(){
    const PERIODO_OPCOES = [
      ['7d','7 dias'], ['15d','15 dias'], ['30d','30 dias'],
      ['mes','Este mês'], ['proximoMes','Próximo mês'], ['personalizado','Personalizado'],
    ];
    const state = { loading:false, error:null, periodoChave:'30d', desdePersonalizado:null, atePersonalizado:null, dados:null };

    function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function money(v){ return v===null||v===undefined ? '—' : 'R$ ' + Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2}); }
    function moneyOuIndisponivel(campo){
      if(!campo || campo.valor===null || campo.valor===undefined) return '<span class="dash" title="Informe o saldo inicial para calcular">Não informado</span>';
      return money(campo.valor);
    }
    function fmtDate(iso){ if(!iso) return '—'; try{ const [y,m,d] = String(iso).slice(0,10).split('-'); return d+'/'+m+'/'+y; }catch(e){ return '—'; } }
    function fmtDiaCurto(diaISO){ const [, m, d] = diaISO.split('-'); return d+'/'+m; }
    function hojeBRT(){
      const BRT_OFFSET_MS = 3*60*60*1000;
      const brt = new Date(Date.now() - BRT_OFFSET_MS);
      const p = n => String(n).padStart(2,'0');
      return brt.getUTCFullYear()+'-'+p(brt.getUTCMonth()+1)+'-'+p(brt.getUTCDate());
    }
    function tintVars(tint){ return tint==='muted' ? '--tint:var(--text-muted);--tint-soft:var(--surface-2);' : '--tint:var(--'+tint+');--tint-soft:var(--'+tint+'-soft);'; }
    function toast(message, type){
      const wrap = document.getElementById('toastWrap');
      const el = document.createElement('div');
      el.className = 'toast ' + (type||'success');
      el.innerHTML = svg(type==='error' ? 'alertCircle':'checkCircle') + '<span>'+message+'</span>';
      wrap.appendChild(el);
      setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .25s'; setTimeout(()=>el.remove(),250); }, 3200);
    }

    async function api(path, opts){
      const res = await fetch('/api/fluxo-caixa'+path, { headers:{'Content-Type':'application/json'}, ...opts });
      let body = null; try{ body = await res.json(); }catch(e){}
      if(!res.ok){ const err = new Error((body&&(body.error||(body.errors&&body.errors.geral)))||'Falha na requisição.'); err.errors = body&&body.errors; throw err; }
      return body;
    }

    async function loadFluxo(){
      const filtro = window.CerneFiltro.state;
      if(!filtro.empresaId){ state.dados=null; state.loading=false; render(); return; }
      state.loading = true; state.error = null; render();
      try{
        const params = new URLSearchParams({ empresaId: filtro.empresaId, periodo: state.periodoChave });
        if(state.periodoChave === 'personalizado'){
          params.set('desde', state.desdePersonalizado || hojeBRT());
          params.set('ate', state.atePersonalizado || hojeBRT());
        }
        state.dados = await api('?'+params.toString());
      }catch(err){ state.error = err.message || 'Não foi possível carregar o fluxo de caixa.'; }
      finally{ state.loading = false; render(); }
    }

    function load(){
      if(!state.desdePersonalizado) state.desdePersonalizado = hojeBRT();
      if(!state.atePersonalizado) state.atePersonalizado = hojeBRT();
      loadFluxo();
    }

    window.CerneFiltro.onChange(()=>{
      const page = document.getElementById('page-cashFlow');
      if(page && page.classList.contains('active')) loadFluxo();
      else render();
    });

    // ---- cards de topo ----
    function cardHTML(k){
      return '<div class="kpi-hero" style="'+tintVars(k.tint)+'">'
        + '<div class="kpi-hero-top"><div class="kpi-hero-icon">'+svg(k.icon)+'</div></div>'
        + '<div class="kpi-hero-label">'+escapeHtml(k.label)+'</div>'
        + '<div class="kpi-hero-value">'+k.valueHtml+'</div>'
        + '<div class="kpi-hero-foot"><span class="kpi-hero-note">'+escapeHtml(k.note)+'</span></div>'
      + '</div>';
    }
    function cardsHTML(dados){
      const c = dados.cards;
      const items = [
        { label:'Saldo atual', icon:'wallet', tint: c.saldoAtual.valor===null?'muted':(c.saldoAtual.valor>=0?'success':'danger'), valueHtml: moneyOuIndisponivel(c.saldoAtual), note:'Hoje, a partir do saldo inicial informado' },
        { label:'Entradas previstas', icon:'arrowDownCircle', tint:'success', valueHtml: money(c.entradasPrevistas), note:'A receber no período selecionado — ainda não é dinheiro disponível' },
        { label:'Saídas previstas', icon:'arrowUpCircle', tint:'copper', valueHtml: money(c.saidasPrevistas), note:'Contas a pagar + despesas fixas previstas no período' },
        { label:'Saldo projetado', icon:'activity', tint: (c.saldoProjetado.valor===null?'muted':(c.saldoProjetado.valor>=0?'success':'danger')), valueHtml: moneyOuIndisponivel(c.saldoProjetado), note:'Saldo estimado ao final do período — nunca dinheiro garantido' },
        { label:'Contas vencidas', icon:'alertCircle', tint: c.contasVencidas>0?'danger':'muted', valueHtml: money(c.contasVencidas), note:'A pagar vencidas + a receber atrasadas (saldo em aberto, agora)' },
      ];
      return '<div class="kpi-hero-grid">' + items.map(cardHTML).join('') + '</div>';
    }

    // ---- fórmula (exatamente como pedido: saldo + contas a receber + recebimentos marketplace - contas a pagar - despesas fixas = saldo projetado) ----
    function formulaHTML(dados){
      const f = dados.resumoFormula;
      const linha = (label, valorHtml, sinal) => '<div class="formula-row"><span class="formula-sinal">'+(sinal||'')+'</span><span class="formula-label">'+label+'</span><span class="formula-valor mono">'+valorHtml+'</span></div>';
      return '<div class="chart-card" style="margin-bottom:14px;">'
        + '<div class="chart-card-head"><div class="panel-title"><span class="panel-title-ic">'+svg('barChart')+'</span>Como o saldo projetado é calculado</div></div>'
        + '<div class="formula-box">'
          + linha('Saldo inicial / atual', moneyOuIndisponivel(f.saldoInicialOuAtual))
          + linha('Contas a receber (no período)', money(f.contasAReceber), '+')
          + linha('Recebimentos previstos dos marketplaces', money(f.recebimentosPrevistosMarketplaces), '+')
          + linha('Contas a pagar (no período)', money(f.contasAPagar), '−')
          + linha('Despesas fixas previstas (ainda não geradas em Contas a Pagar)', money(f.despesasFixasPrevistas), '−')
          + '<div class="formula-row formula-total"><span class="formula-sinal">=</span><span class="formula-label">Saldo projetado</span><span class="formula-valor mono">'+moneyOuIndisponivel(f.saldoProjetado)+'</span></div>'
        + '</div>'
        + '<div class="field-hint" style="margin-top:10px;">Recebimentos previstos dos marketplaces entram só no total acima — o Mercado Livre não informa a data de liberação (ver tela Recebimentos), então esse valor nunca é encaixado num dia específico do gráfico abaixo, pra nunca inventar uma data.'
          + (dados.recebimentosMarketplaces && dados.recebimentosMarketplaces.quantidade ? (' ('+dados.recebimentosMarketplaces.quantidade+' pedido(s) no período.)') : '')
        + '</div>'
      + '</div>';
    }

    // ---- gráfico: evolução do saldo de caixa (REALIZADO sólido, PROJETADO tracejado) ----
    function chartSaldoHTML(dados){
      const dias = dados.serieDiaria;
      const temSaldo = dias.some(d => d.saldoAcumulado !== null && d.saldoAcumulado !== undefined);
      if(!dias.length || !temSaldo){
        return '<div class="chart-canvas h-lg">' + chartGridLines(4)
          + chartEmptyState('wallet', 'Informe o saldo inicial para ver a evolução do caixa — sem isso o ERP não inventa nenhum saldo.', 'Definir saldo inicial')
        + '</div>';
      }
      const n = dias.length;
      const W = Math.max(n*14, 14), H = 100, topPad = 10, botPad = 10;
      const usable = H - topPad - botPad;
      const vals = dias.map(d => d.saldoAcumulado||0);
      const maxV = Math.max(0, ...vals), minV = Math.min(0, ...vals);
      const range = (maxV - minV) || 1;
      const yFor = v => topPad + usable * (1 - (v - minV) / range);
      const baseY = yFor(0);

      const pontos = dias.map((d,i)=> ({ x:i*14+7, y:yFor(d.saldoAcumulado||0), d }));
      const realizadoPts = pontos.filter(p=>!p.d.ehPassado || p.d.ehHoje).length ? pontos.filter(p=>p.d.ehPassado || p.d.ehHoje) : [];
      // ponto de corte: tudo até (e incluindo) hoje é REALIZADO/já conhecido; a partir do dia seguinte é PROJETADO
      let corte = pontos.findIndex(p=>p.d.ehHoje);
      if(corte === -1) corte = dias[0].ehPassado ? pontos.length-1 : -1; // período inteiro no passado ou inteiro futuro
      const solidos = corte===-1 ? [] : pontos.slice(0, corte+1);
      const tracejados = corte===-1 ? pontos : pontos.slice(corte);

      const linhaSolida = solidos.length>1 ? '<polyline points="'+solidos.map(p=>p.x+','+p.y).join(' ')+'" fill="none" stroke="var(--teal)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>' : '';
      const linhaTracejada = tracejados.length>1 ? '<polyline points="'+tracejados.map(p=>p.x+','+p.y).join(' ')+'" fill="none" stroke="var(--copper)" stroke-width="2" stroke-dasharray="4 3" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>' : '';
      const dots = pontos.map(p=>{
        const label = fmtDiaCurto(p.d.dia)+' — '+(p.d.ehPassado||p.d.ehHoje?'Realizado':'Projetado')+': '+money(p.d.saldoAcumulado);
        return '<circle cx="'+p.x+'" cy="'+p.y+'" r="1.8" fill="'+(p.d.ehPassado||p.d.ehHoje?'var(--teal)':'var(--copper)')+'" vector-effect="non-scaling-stroke"><title>'+escapeHtml(label)+'</title></circle>';
      }).join('');
      const baseline = '<line x1="0" y1="'+baseY+'" x2="'+W+'" y2="'+baseY+'" stroke="var(--border-strong)" stroke-width="1" vector-effect="non-scaling-stroke"/>';

      const labelStep = Math.max(1, Math.ceil(n/9));
      const labels = dias.map((d,i) => '<span>'+((i%labelStep===0 || i===n-1) ? escapeHtml(fmtDiaCurto(d.dia)) : '')+'</span>').join('');

      return '<div class="chart-canvas" style="position:relative;height:200px;padding:0;">'
        + '<svg class="simple-chart-svg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="height:100%;">'
          + baseline + linhaSolida + linhaTracejada + dots
        + '</svg>'
      + '</div>'
      + '<div class="simple-chart-xlabels" style="grid-template-columns:repeat('+n+',1fr);">' + labels + '</div>';
    }
    function chartCardHTML(dados){
      return '<div class="chart-card" style="margin-bottom:14px;">'
        + '<div class="chart-card-head">'
          + '<div class="panel-title"><span class="panel-title-ic">'+svg('activity')+'</span>Evolução do saldo de caixa</div>'
          + '<div class="chart-legend">'
            + '<span class="legend-item"><span class="legend-dot" style="background:var(--teal)"></span>Realizado</span>'
            + '<span class="legend-item"><span class="legend-dot" style="background:var(--copper)"></span>Projetado</span>'
            + '<span class="panel-note">'+(dados.periodo?escapeHtml(dados.periodo.label):'')+'</span>'
          + '</div>'
        + '</div>'
        + chartSaldoHTML(dados)
      + '</div>';
    }

    // ---- tabela diária REALIZADO x PROJETADO ----
    function tabelaDiariaHTML(dados){
      const dias = dados.serieDiaria;
      if(!dias.length) return '';
      return '<div class="table-card"><div class="table-wrap"><table class="data-table"><thead><tr>'
        + '<th>Dia</th><th>Situação</th><th>Entradas realizadas</th><th>Saídas realizadas</th><th>Entradas projetadas</th><th>Saídas projetadas</th><th>Saldo acumulado</th>'
        + '</tr></thead><tbody>'
        + dias.map(d => '<tr'+(d.ehHoje?' style="background:var(--surface-2);"':'')+'>'
          + '<td class="tab-nums">'+fmtDate(d.dia)+(d.ehHoje?' <span class="status-chip" style="margin-left:6px;color:var(--teal);background:var(--teal-soft);">Hoje</span>':'')+'</td>'
          + '<td><span class="status-chip" style="'+(d.ehPassado||d.ehHoje?'color:var(--teal);background:var(--teal-soft);':'color:var(--copper);background:var(--copper-soft);')+'">'+(d.ehPassado||d.ehHoje?'Realizado':'Projetado')+'</span></td>'
          + '<td class="mono">'+(d.realizado.entradas?money(d.realizado.entradas):'—')+'</td>'
          + '<td class="mono">'+(d.realizado.saidas?money(d.realizado.saidas):'—')+'</td>'
          + '<td class="mono">'+(d.projetado.entradas?money(d.projetado.entradas):'—')+'</td>'
          + '<td class="mono">'+(d.projetado.saidas?money(d.projetado.saidas):'—')+'</td>'
          + '<td class="mono">'+(d.saldoAcumulado===null?'<span class="dash">Não informado</span>':money(d.saldoAcumulado))+'</td>'
        + '</tr>').join('')
        + '</tbody></table></div></div>';
    }

    function periodoSeletorHTML(){
      let html = '<div class="toolbar"><div class="seg" id="fcSeg">'
        + PERIODO_OPCOES.map(function(par){ return '<button data-periodo="'+par[0]+'" class="'+(state.periodoChave===par[0]?'active':'')+'">'+par[1]+'</button>'; }).join('')
      + '</div></div>';
      if(state.periodoChave === 'personalizado'){
        html += '<div class="inline-form" style="margin-top:0;margin-bottom:14px;align-items:flex-end;">'
          + '<div class="field narrow"><label>De</label><input type="date" id="fcDesde" value="'+(state.desdePersonalizado||'')+'"></div>'
          + '<div class="field narrow"><label>Até</label><input type="date" id="fcAte" value="'+(state.atePersonalizado||'')+'"></div>'
          + '<button class="ghost-btn" id="fcAplicar" type="button" style="cursor:pointer;opacity:1;">'+svg('check')+'<span>Aplicar</span></button>'
        + '</div>';
      }
      return html;
    }

    function render(){
      const root = document.getElementById('fluxoCaixaRoot');
      if(!root) return;
      const filtro = window.CerneFiltro.state;

      if(!filtro.loadingEmpresas && !filtro.empresas.length){
        root.innerHTML = '<div class="empty-panel"><div class="empty-icon">'+svg('building')+'</div>'
          + '<h2>Nenhuma empresa ativa</h2>'
          + '<p class="lead">Cadastre e ative uma empresa em <strong>Cadastros → Empresas</strong> antes de ver o fluxo de caixa.</p></div>';
        return;
      }

      let html = periodoSeletorHTML();

      if(state.loading || filtro.loadingEmpresas){
        html += '<div class="table-card"><div class="table-skel"><span class="spin"></span><span>Carregando fluxo de caixa…</span></div></div>';
      } else if(state.error){
        html += '<div class="empty-panel"><div class="empty-icon" style="color:var(--danger); background:var(--danger-soft);">'+svg('alertCircle')+'</div>'
          + '<h2 style="color:var(--danger);">Não foi possível carregar</h2><p class="lead">'+escapeHtml(state.error)+'</p>'
          + '<button class="ghost-btn" id="fcRetry" style="cursor:pointer; opacity:1;">'+svg('activity')+'<span>Tentar novamente</span></button></div>';
      } else if(!state.dados){
        html += '<div class="empty-panel"><div class="empty-icon">'+svg('activity')+'</div><h2>Selecione uma empresa</h2></div>';
      } else {
        html += cardsHTML(state.dados)
          + formulaHTML(state.dados)
          + chartCardHTML(state.dados)
          + tabelaDiariaHTML(state.dados);
      }

      root.innerHTML = html;

      const seg = document.getElementById('fcSeg');
      if(seg) seg.querySelectorAll('button').forEach(b=> b.addEventListener('click', ()=>{ state.periodoChave = b.dataset.periodo; loadFluxo(); }));
      const retry = document.getElementById('fcRetry');
      if(retry) retry.addEventListener('click', loadFluxo);
      const aplicar = document.getElementById('fcAplicar');
      if(aplicar) aplicar.addEventListener('click', ()=>{
        state.desdePersonalizado = document.getElementById('fcDesde').value || hojeBRT();
        state.atePersonalizado = document.getElementById('fcAte').value || hojeBRT();
        loadFluxo();
      });
      root.querySelectorAll('.chart-empty [disabled]').forEach(b=> { b.disabled=false; b.style.cursor='pointer'; b.style.opacity='1'; b.addEventListener('click', abrirModalSaldoInicial); });
    }

    function abrirModalSaldoInicial(){
      const filtro = window.CerneFiltro.state;
      if(!filtro.empresaId){ toast('Selecione uma empresa primeiro.', 'error'); return; }
      const modalRoot = document.getElementById('modalRoot');
      const hoje = hojeBRT();
      const atual = state.dados && state.dados.saldoInicial;
      modalRoot.innerHTML = '<div class="modal-overlay" id="modalOverlay">'
        + '<div class="modal-card" style="max-width:520px;">'
          + '<div class="modal-head"><div class="modal-title">Definir saldo inicial</div>'
            + '<button class="row-ic-btn" id="modalClose" type="button">'+svg('x')+'</button></div>'
          + '<div class="modal-sub">Informado por você — o ERP não tem integração bancária, então nunca calcula esse número sozinho. A partir daqui, o Fluxo de Caixa soma o que já foi realmente pago/recebido e o que está previsto.</div>'
          + '<form id="fcSaldoForm">'
            + '<div class="inline-form" style="margin-top:0;">'
              + '<div class="field narrow"><label>Valor do saldo</label><input type="text" inputmode="decimal" id="fSaldoValor" placeholder="Ex: 15000,00" value="'+(atual?String(atual.valor).replace('.',','):'')+'">'
                + '<div class="field-error" id="eSaldoValor" style="display:none;"></div></div>'
              + '<div class="field narrow"><label>Data de referência</label><input type="date" id="fSaldoData" value="'+(atual?atual.dataReferencia:hoje)+'">'
                + '<div class="field-error" id="eSaldoData" style="display:none;"></div></div>'
            + '</div>'
            + '<div class="field"><label>Observação <span class="opt">(opcional)</span></label><input type="text" id="fSaldoObs" placeholder="Ex: extrato do banco X em '+hoje+'" value="'+(atual&&atual.observacao?escapeHtml(atual.observacao):'')+'"></div>'
            + '<div class="modal-actions">'
              + '<button type="button" class="btn-secondary" id="modalCancel">Cancelar</button>'
              + '<button type="submit" class="btn-primary" id="modalSave">'+svg('check')+'<span>Salvar saldo inicial</span></button>'
            + '</div>'
          + '</form>'
        + '</div>'
      + '</div>';

      const overlay = document.getElementById('modalOverlay');
      const close = ()=> modalRoot.innerHTML = '';
      overlay.addEventListener('click', (e)=>{ if(e.target === overlay) close(); });
      document.getElementById('modalClose').addEventListener('click', close);
      document.getElementById('modalCancel').addEventListener('click', close);

      document.getElementById('fcSaldoForm').addEventListener('submit', async (e)=>{
        e.preventDefault();
        ['eSaldoValor','eSaldoData'].forEach(id=>{ const el=document.getElementById(id); el.style.display='none'; el.textContent=''; });
        const payload = {
          empresaId: filtro.empresaId,
          valor: Number(document.getElementById('fSaldoValor').value.replace(',','.')),
          dataReferencia: document.getElementById('fSaldoData').value,
          observacao: document.getElementById('fSaldoObs').value,
        };
        const saveBtn = document.getElementById('modalSave');
        saveBtn.disabled = true;
        try{
          await api('/saldo-inicial', { method:'POST', body: JSON.stringify(payload) });
          close();
          toast('Saldo inicial salvo.');
          loadFluxo();
        }catch(err){
          saveBtn.disabled = false;
          if(err.errors){
            if(err.errors.valor){ const el=document.getElementById('eSaldoValor'); el.textContent=err.errors.valor; el.style.display='block'; }
            if(err.errors.dataReferencia){ const el=document.getElementById('eSaldoData'); el.textContent=err.errors.dataReferencia; el.style.display='block'; }
          } else {
            toast(err.message, 'error');
          }
        }
      });
    }

    const btnSaldo = document.getElementById('btnSaldoInicialFluxoCaixa');
    if(btnSaldo) btnSaldo.addEventListener('click', abrirModalSaldoInicial);

    window.FluxoCaixa = { load };
  })();

  /* ================= DRE — Demonstrativo de Resultado do Exercício =================
     Ativado em 24/08/2026. Sem lógica financeira própria: só consome
     GET /api/dre, que reorganiza os mesmos números já usados em Financeiro/
     Visão Geral/Pedidos (lib/relatorioVendas.js) e o "pago no período" de
     Contas a Pagar (lib/contasPagar.js) — ver docs/02-decisoes.md. Usa o
     filtro do header (empresa + período), igual Contas a Pagar/Receber/
     Recebimentos. */
  (function(){
    const state = { loading:false, error:null, data:null };

    function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function money(v){ return v===null||v===undefined ? '—' : 'R$ ' + Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2}); }
    function pct(v){ return v===null||v===undefined ? null : Number(v).toLocaleString('pt-BR',{minimumFractionDigits:1, maximumFractionDigits:1})+'%'; }

    async function apiDRE(empresaId, periodo){
      const res = await fetch('/api/dre?empresaId='+empresaId+'&periodo='+periodo);
      let body = null; try{ body = await res.json(); }catch(e){}
      if(!res.ok) throw new Error((body && body.error) || 'Não foi possível carregar a DRE.');
      return body;
    }

    async function loadDRE(){
      const filtro = window.CerneFiltro.state;
      if(!filtro.empresaId){ state.data=null; state.loading=false; render(); return; }
      state.loading = true; state.error = null; render();
      try{ state.data = await apiDRE(filtro.empresaId, filtro.periodo); }
      catch(err){ state.error = err.message; state.data = null; }
      state.loading = false; render();
    }

    function load(){ loadDRE(); }

    window.CerneFiltro.onChange(()=>{
      const page = document.getElementById('page-dre');
      if(page && page.classList.contains('active')) loadDRE();
      else render();
    });

    function valorTexto(campo, hasOrders){
      if(campo.valor===null) return hasOrders ? 'Pendente' : 'Sem dados';
      return money(campo.valor);
    }

    function pctSpan(campo){
      return (campo.percentual!==null && campo.percentual!==undefined)
        ? ' <span style="font-size:11px;color:var(--text-muted);font-weight:500;">('+pct(campo.percentual)+' do faturamento)</span>' : '';
    }

    function linhaHTML(label, campo, hasOrders, opts){
      opts = opts || {};
      const pendNote = campo.valor!==null && campo.pendentes>0
        ? ' <span style="font-size:10.5px;color:var(--text-faint);font-weight:500;">('+campo.pendentes+' pedido(s) sem essa informação)</span>' : '';
      const valorHtml = campo.valor===null
        ? '<span style="color:var(--text-faint);font-style:italic;font-family:\'Public Sans\',sans-serif;font-weight:500;">'+valorTexto(campo, hasOrders)+'</span>'
        : (opts.negativo && campo.valor!==0 ? '− ' : '') + money(Math.abs(campo.valor)) + pctSpan(campo);
      return '<div class="bd-row'+(opts.negativo?' neg':'')+'"><span class="bd-label">'+label+pendNote+'</span><span class="bd-value">'+valorHtml+'</span></div>';
    }

    function totalRowHTML(label, campo, hasOrders){
      const positivo = campo.valor!==null && campo.valor>=0;
      return '<div class="bd-row total"><span class="bd-label">'+label+'</span><span class="bd-value '+(campo.valor===null?'':(positivo?'positive':'negative'))+'">'
        + valorTexto(campo, hasOrders) + (campo.valor!==null ? pctSpan(campo) : '') + '</span></div>';
    }

    function render(){
      const root = document.getElementById('dreRoot');
      if(!root) return;
      const filtro = window.CerneFiltro.state;

      if(!filtro.loadingEmpresas && !filtro.empresas.length){
        root.innerHTML = '<div class="empty-panel"><div class="empty-icon">'+svg('building')+'</div>'
          + '<h2>Nenhuma empresa ativa</h2>'
          + '<p class="lead">Cadastre e ative uma empresa em <strong>Cadastros → Empresas</strong> para ver a DRE aqui.</p></div>';
        return;
      }

      let html = '';
      if(state.loading || filtro.loadingEmpresas){
        html += '<div class="table-card"><div class="table-skel"><span class="spin"></span><span>Carregando DRE…</span></div></div>';
      } else if(state.error){
        html += '<div class="empty-panel"><div class="empty-icon" style="color:var(--danger); background:var(--danger-soft);">'+svg('alertCircle')+'</div>'
          + '<h2 style="color:var(--danger);">Não foi possível carregar</h2><p class="lead">'+escapeHtml(state.error)+'</p></div>';
      } else if(state.data){
        const d = state.data.dre;
        const l = d.linhas;
        const hasOrders = d.hasOrders;

        html += '<div class="panel" style="max-width:640px;">'
          + '<div class="panel-head"><div class="panel-title"><span class="panel-title-ic">'+svg('barChart')+'</span>Demonstrativo de Resultado</div><span class="panel-note">'+escapeHtml(state.data.periodo.label)+'</span></div>'
          + '<p style="font-size:12px;color:var(--text-muted);margin:0 0 10px;">'+d.qtdPedidos+' pedido(s) considerados na receita ('+d.qtdPedidosCancelados+' cancelado(s) — entram só na linha de cancelamentos). Percentuais calculados sobre o faturamento (vendas não canceladas do período).</p>'

          + '<div class="detail-section-title" style="margin-top:4px;">Receita</div>'
          + linhaHTML('Receita Bruta', l.receitaBruta, hasOrders)
          + linhaHTML('(−) Cancelamentos/Devoluções', l.cancelamentos, hasOrders, {negativo:true})
          + linhaHTML('(−) Descontos concedidos (cupom)', l.descontos, hasOrders, {negativo:true})
          + totalRowHTML('= Receita Líquida', l.receitaLiquida, hasOrders)

          + '<div class="detail-section-title">Deduções sobre a venda</div>'
          + linhaHTML('(−) Custo dos Produtos', l.custoProdutos, hasOrders, {negativo:true})
          + linhaHTML('(−) Taxas e Comissões dos marketplaces', l.taxasComissoes, hasOrders, {negativo:true})
          + linhaHTML('(−) Frete do vendedor', l.freteVendedor, hasOrders, {negativo:true})
          + linhaHTML('(−) Impostos', l.impostos, hasOrders, {negativo:true})
          + totalRowHTML('= Margem de Contribuição', l.margemContribuicao, hasOrders)

          + '<div class="detail-section-title">Despesas</div>'
          + linhaHTML('(−) Despesas / Contas pagas no período', l.despesasPeriodo, true, {negativo:true})
          + totalRowHTML('= Resultado Final', l.resultadoFinal, hasOrders)

          + (!hasOrders ? '<div class="bd-side-note">Nenhum pedido no período e empresa selecionados — por isso as linhas de receita aparecem como "Sem dados". As despesas pagas no período (Contas a Pagar) continuam sendo um saldo real, independente de haver venda.</div>' : '')
          + '<div class="bd-side-note">Usa exatamente o mesmo cálculo já usado em Pedidos, Financeiro e Relatórios (nenhuma fórmula nova) — e o mesmo "pago no período" já mostrado em Contas a Pagar.</div>'
        + '</div>';
      }

      root.innerHTML = html;
    }

    window.DRE = { load };
  })();

  /* ================= FATURAMENTO — central dos pedidos a faturar =================
     Ativado em 24/08/2026. NÃO duplica pedido: reaproveita a mesma fonte
     única de pedidos (lib/relatorioVendas.js) e só acrescenta a situação de
     faturamento de cada um (tabela faturamento_pedidos). Sem emissão real
     de NF-e nesta etapa — só o acompanhamento manual, com o fluxo de
     seleção múltipla já preparado. Usa o filtro do header. */
  (function(){
    const STATUS_OPCOES = [
      ['aguardando_faturamento','Aguardando faturamento'],
      ['faturado','Faturado'],
      ['erro','Erro'],
      ['cancelado','Cancelado'],
    ];
    const STATUS_LABEL = Object.fromEntries(STATUS_OPCOES);
    const state = { loading:false, error:null, itens:[], status:'todos', search:'', selecionados:new Set() };

    function toast(message, type){
      const wrap = document.getElementById('toastWrap');
      const el = document.createElement('div');
      el.className = 'toast ' + (type||'success');
      el.innerHTML = svg(type==='error' ? 'alertCircle':'checkCircle') + '<span>'+message+'</span>';
      wrap.appendChild(el);
      setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .25s'; setTimeout(()=>el.remove(),250); }, 3200);
    }
    function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function money(v){ return v===null||v===undefined ? '—' : 'R$ ' + Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2}); }
    function fmtDate(iso){ if(!iso) return '—'; try{ const d=new Date(iso); return d.toLocaleDateString('pt-BR'); }catch(e){ return '—'; } }
    function statusChipStyle(status){
      const cor = status==='faturado' ? 'success' : status==='erro' ? 'danger' : status==='cancelado' ? 'text-muted' : 'warning';
      const bg = status==='cancelado' ? 'var(--surface-2)' : 'var(--'+cor+'-soft)';
      return 'color:var(--'+cor+');background:'+bg+';';
    }

    async function api(path, opts){
      const res = await fetch('/api/faturamento'+path, { headers:{'Content-Type':'application/json'}, ...opts });
      let body = null; try{ body = await res.json(); }catch(e){}
      if(!res.ok){ const err = new Error((body&&(body.error||(body.errors&&body.errors.geral)))||'Falha na requisição.'); err.errors = body&&body.errors; throw err; }
      return body;
    }

    async function loadItens(){
      const filtro = window.CerneFiltro.state;
      if(!filtro.empresaId){ state.itens=[]; state.loading=false; render(); return; }
      state.loading = true; state.error = null; render();
      try{
        const params = new URLSearchParams({ empresaId: filtro.empresaId, periodo: filtro.periodo });
        if(state.status !== 'todos') params.set('status', state.status);
        if(state.search.trim()) params.set('search', state.search.trim());
        const data = await api('?'+params.toString(), { method:'GET' });
        state.itens = data.itens;
        state.selecionados = new Set([...state.selecionados].filter(id => state.itens.some(i=>i.pedidoId===id)));
      }catch(err){ state.error = err.message || 'Não foi possível carregar o faturamento.'; }
      finally{ state.loading = false; render(); }
    }

    function load(){ loadItens(); }

    window.CerneFiltro.onChange(()=>{
      const page = document.getElementById('page-billing');
      if(page && page.classList.contains('active')) loadItens();
      else render();
    });

    async function aplicarStatusLote(status){
      const ids = [...state.selecionados];
      if(!ids.length) return;
      try{
        const result = await api('/lote', { method:'PATCH', body: JSON.stringify({ pedidoIds: ids, status }) });
        toast(result.atualizados.length+' pedido(s) atualizado(s) para "'+STATUS_LABEL[status]+'".'+(result.falharam.length?(' '+result.falharam.length+' falharam.'):''));
        state.selecionados = new Set();
        loadItens();
      }catch(err){ toast(err.message, 'error'); }
    }

    async function aplicarStatusUnico(pedidoId, status){
      try{
        await api('/'+pedidoId+'/situacao', { method:'PATCH', body: JSON.stringify({ status }) });
        toast('Situação atualizada para "'+STATUS_LABEL[status]+'".');
        loadItens();
      }catch(err){ toast(err.message, 'error'); }
    }

    function render(){
      const root = document.getElementById('faturamentoRoot');
