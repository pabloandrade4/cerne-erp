          + '</div></div>'
          + '<div class="conn-actions">'+statusBadge(c.status)+'</div>'
          + '<div class="conn-meta">'
            + '<div class="conn-meta-item"><div class="cm-label">Última sincronização</div><div class="cm-value">'+(fmtDateTime(c.ultimaSincronizacaoEm) || 'Nunca sincronizado')+'</div></div>'
            + '<div class="conn-meta-item"><div class="cm-label">Token de acesso expira em</div><div class="cm-value">'+(fmtDateTime(c.tokenExpiraEm) || '—')+'</div></div>'
            + '<div class="conn-meta-item"><div class="cm-label">Conectado em</div><div class="cm-value">'+(fmtDateTime(c.criadoEm) || '—')+'</div></div>'
          + '</div>'
          + (c.status==='erro' && c.ultimoErro ? '<div class="bd-note">'+svg('alertCircle')+'<span>'+escapeHtml(c.ultimoErro)+'</span></div>' : '')
          + '<div style="margin-top:16px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; width:100%;">'
            + '<button class="btn-primary" id="mlSyncBtn" type="button" '+(state.syncing?'disabled':'')+'>'+svg('refreshCw')+'<span>'+(state.syncing?'Sincronizando…':'Sincronizar agora')+'</span></button>'
            + '<button class="btn-secondary" id="mlReconnectBtn" type="button">'+svg('link')+'<span>Reconectar</span></button>'
            + (state.syncResult ? '<span class="field-hint" style="margin:0;">'+state.syncResult.importados+' de '+state.syncResult.total+' pedido(s) dos últimos '+(state.syncResult.periodo?state.syncResult.periodo.dias:30)+' dias importados/atualizados'+(state.syncResult.erros.length? (', '+state.syncResult.erros.length+' com erro'):'')+'.</span>' : '<span class="field-hint" style="margin:0;">A sincronização traz os pedidos dos últimos 30 dias.</span>')
          + '</div>'
        + '</div>';
      } else {
        html += '<div class="empty-panel"><div class="empty-icon">'+svg('store')+'</div>'
          + '<h2>Nenhuma conta conectada</h2>'
          + '<p class="lead">Conecte a conta do Mercado Livre desta empresa para importar pedidos automaticamente. Você será redirecionado ao Mercado Livre para autorizar o acesso — os tokens ficam criptografados no servidor, nunca no navegador.</p>'
          + '<button class="primary-btn enabled" id="mlConnectBtn" type="button">'+svg('link')+'<span>Conectar Mercado Livre</span></button></div>';
      }

      // ---- Shopee (25/08/2026) — mesmo padrão do bloco do Mercado Livre acima ----
      html += '<div style="height:24px;"></div>';

      if(state.configuradoShopee === false){
        html += '<div class="empty-panel" style="margin-bottom:16px;"><div class="empty-icon" style="color:var(--warning); background:var(--warning-soft);">'+svg('alertCircle')+'</div>'
          + '<h2 style="color:var(--warning);">Integração com a Shopee ainda não configurada</h2>'
          + '<p class="lead">O aplicativo da Shopee Open Platform (Partner ID/Partner Key) ainda não foi configurado neste ambiente.</p></div>';
      }

      if(state.loadingContaShopee){
        html += '<div class="table-card"><div class="table-skel"><span class="spin"></span><span>Carregando conexão…</span></div></div>';
      } else if(state.contaShopee){
        const cs = state.contaShopee;
        html += '<div class="conn-card-real">'
          + '<div class="cc-left"><div class="cc-ic">'+svg('store')+'</div><div>'
            + '<div class="cc-nick">'+escapeHtml(cs.shopName || ('Loja '+cs.shopId))+'</div>'
            + '<div class="cc-sub">Shopee'+(cs.region?(' · '+cs.region):'')+' · Shop ID '+cs.shopId+'</div>'
          + '</div></div>'
          + '<div class="conn-actions">'+statusBadge(cs.status)+'</div>'
          + '<div class="conn-meta">'
            + '<div class="conn-meta-item"><div class="cm-label">Empresa vinculada</div><div class="cm-value">'+escapeHtml((state.empresas.find(e=>e.id===cs.empresaId)||{}).nomeFantasia || (state.empresas.find(e=>e.id===cs.empresaId)||{}).razaoSocial || '—')+'</div></div>'
            + '<div class="conn-meta-item"><div class="cm-label">Token de acesso expira em</div><div class="cm-value">'+(fmtDateTime(cs.tokenExpiraEm) || '—')+'</div></div>'
            + '<div class="conn-meta-item"><div class="cm-label">Última atualização</div><div class="cm-value">'+(fmtDateTime(cs.atualizadoEm) || '—')+'</div></div>'
          + '</div>'
          + (cs.status==='erro' && cs.ultimoErro ? '<div class="bd-note">'+svg('alertCircle')+'<span>'+escapeHtml(cs.ultimoErro)+'</span></div>' : '')
          + '<div style="margin-top:16px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; width:100%;">'
            + '<button class="btn-primary" id="shopeeRenovarBtn" type="button" '+(state.renovandoShopee?'disabled':'')+'>'+svg('refreshCw')+'<span>'+(state.renovandoShopee?'Renovando…':'Renovar token')+'</span></button>'
            + '<button class="btn-secondary" id="shopeeReconnectBtn" type="button">'+svg('link')+'<span>Reconectar</span></button>'
            + '<span class="field-hint" style="margin:0;">O token é renovado automaticamente pelo servidor antes de vencer. Sincronização de pedidos da Shopee ainda não foi implementada nesta etapa.</span>'
          + '</div>'
        + '</div>';
      } else {
        html += '<div class="empty-panel"><div class="empty-icon">'+svg('store')+'</div>'
          + '<h2>Nenhuma loja da Shopee conectada</h2>'
          + '<p class="lead">Conecte uma loja da Shopee desta empresa. Você será redirecionado à Shopee para autorizar o acesso — os tokens ficam criptografados no servidor, nunca no navegador. Pedidos da Shopee ainda não são importados nesta etapa.</p>'
          + '<button class="primary-btn enabled" id="shopeeConnectBtn" type="button">'+svg('link')+'<span>Conectar Shopee</span></button></div>';
      }

      root.innerHTML = html;

      const sel = document.getElementById('mlEmpresaSelect');
      if(sel) sel.addEventListener('change', ()=>{ state.empresaId = Number(sel.value); state.syncResult = null; loadContaDaEmpresa(); loadContaShopeeDaEmpresa(); });
      const connectBtn = document.getElementById('mlConnectBtn');
      if(connectBtn) connectBtn.addEventListener('click', ()=>{ window.location.href = '/api/integracoes/mercadolivre/conectar?empresaId='+state.empresaId; });
      const reconnectBtn = document.getElementById('mlReconnectBtn');
      if(reconnectBtn) reconnectBtn.addEventListener('click', ()=>{ window.location.href = '/api/integracoes/mercadolivre/conectar?empresaId='+state.empresaId; });
      const syncBtn = document.getElementById('mlSyncBtn');
      if(syncBtn) syncBtn.addEventListener('click', async ()=>{
        state.syncing = true; render();
        try{
          const result = await apiMl('/'+state.conta.id+'/sincronizar', { method:'POST' });
          state.syncResult = result;
          toast(result.importados+' pedido(s) importados/atualizados.');
          await loadContaDaEmpresa();
        }catch(err){ toast(err.message, 'error'); }
        state.syncing = false; render();
      });

      const shopeeConnectBtn = document.getElementById('shopeeConnectBtn');
      if(shopeeConnectBtn) shopeeConnectBtn.addEventListener('click', ()=>{ window.location.href = '/api/integracoes/shopee/conectar?empresaId='+state.empresaId; });
      const shopeeReconnectBtn = document.getElementById('shopeeReconnectBtn');
      if(shopeeReconnectBtn) shopeeReconnectBtn.addEventListener('click', ()=>{ window.location.href = '/api/integracoes/shopee/conectar?empresaId='+state.empresaId; });
      const shopeeRenovarBtn = document.getElementById('shopeeRenovarBtn');
      if(shopeeRenovarBtn) shopeeRenovarBtn.addEventListener('click', async ()=>{
        state.renovandoShopee = true; render();
        try{
          await apiShopee('/'+state.contaShopee.id+'/renovar-token', { method:'POST' });
          toast('Token da Shopee renovado com sucesso.');
          await loadContaShopeeDaEmpresa();
        }catch(err){ toast(err.message, 'error'); }
        state.renovandoShopee = false; render();
      });
    }

    window.Marketplaces = { load };
  })();

  /* ================= VISÃO GERAL — indicadores reais (Mercado Livre) =================
     Usa /api/relatorios/resumo-vendas, a MESMA fonte que Financeiro consulta e que a
     listagem de Pedidos usa por trás (lib/relatorioVendas.js no backend) — os três
     nunca calculam o resultado de um jeito diferente pro mesmo período.

     Empresa e período NÃO são estado próprio desta tela — vêm só do filtro do
     header (window.CerneFiltro), pra existir uma única fonte de verdade (era
     duplicado antes: um seletor aqui dentro e outro no header, cada um com seu
     próprio estado). */
  (function(){
    const state = { loading:false, error:null, data:null, painel:null, painelError:null };

    function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function money(v, moeda){ return v===null||v===undefined ? null : (moeda==='BRL'||!moeda?'R$ ':moeda+' ') + Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2}); }
    function moneySigned(v, moeda){ if(v===null||v===undefined) return null; const abs = money(Math.abs(v), moeda); return v<0 ? '− '+abs : abs; }
    function pctFmt(v){ return v===null||v===undefined ? null : (v<0?'− ':'')+Math.abs(Number(v)).toLocaleString('pt-BR',{minimumFractionDigits:1, maximumFractionDigits:1})+'%'; }
    function fmtDateTime(iso){ if(!iso) return null; try{ return new Date(iso).toLocaleString('pt-BR'); }catch(e){ return null; } }

    async function apiResumo(empresaId, periodo){
      const res = await fetch('/api/relatorios/resumo-vendas?empresaId='+empresaId+'&periodo='+periodo);
      let body = null; try{ body = await res.json(); }catch(e){}
      if(!res.ok) throw new Error((body && body.error) || 'Não foi possível carregar os indicadores.');
      return body;
    }

    // Evolução diária já vem de apiResumo (campo serieDiaria) — este
    // segundo endpoint cobre só Por marketplace, Fluxo de Caixa, Conexões &
    // Empresas e Alertas & IA (lib/visaoGeralPainel.js). Buscado em
    // paralelo e com erro isolado: se este falhar, os indicadores/gráfico
    // principal (que não dependem dele) continuam aparecendo normalmente.
    async function apiPainel(empresaId, periodo){
      const res = await fetch('/api/visao-geral/painel?empresaId='+empresaId+'&periodo='+periodo);
      let body = null; try{ body = await res.json(); }catch(e){}
      if(!res.ok) throw new Error((body && body.error) || 'Não foi possível carregar os indicadores adicionais.');
      return body;
    }

    async function loadResumo(){
      const filtro = window.CerneFiltro.state;
      if(!filtro.empresaId){ state.data = null; state.error = null; state.painel = null; state.painelError = null; state.loading = false; render(); return; }
      state.loading = true; state.error = null; state.painelError = null; render();
      const [resumoResult, painelResult] = await Promise.allSettled([
        apiResumo(filtro.empresaId, filtro.periodo),
        apiPainel(filtro.empresaId, filtro.periodo),
      ]);
      if(resumoResult.status==='fulfilled'){ state.data = resumoResult.value; state.error = null; }
      else { state.data = null; state.error = resumoResult.reason.message; }
      if(painelResult.status==='fulfilled'){ state.painel = painelResult.value; state.painelError = null; }
      else { state.painel = null; state.painelError = painelResult.reason.message; }
      state.loading = false; render();
    }

    function load(){ loadResumo(); }

    // Reage a troca de empresa/período no header — só recarrega se a Visão
    // Geral for a página ativa no momento (evita chamada à toa em outra tela).
    window.CerneFiltro.onChange(()=>{
      const page = document.getElementById('page-overview');
      if(page && page.classList.contains('active')) loadResumo();
      else render();
    });

    // ---- KPI cards ----
    function tintVars(tint){
      return tint === 'muted'
        ? '--tint:var(--text-muted);--tint-soft:var(--surface-2);'
        : '--tint:var(--'+tint+');--tint-soft:var(--'+tint+'-soft);';
    }

    function heroCardHTML(k){
      return '<div class="kpi-hero" style="'+tintVars(k.tint)+'">'
        + '<div class="kpi-hero-top"><div class="kpi-hero-icon">'+svg(k.icon)+'</div></div>'
        + '<div class="kpi-hero-label">'+k.label+'</div>'
        + '<div class="kpi-hero-value">'+k.valueHtml+'</div>'
        + '<div class="kpi-hero-foot"><span class="kpi-hero-note">'+k.note+'</span></div>'
        + '</div>';
    }
    function secCardHTML(k){
      return '<div class="kpi-sec" style="'+tintVars(k.tint)+'">'
        + '<div class="kpi-sec-icon">'+svg(k.icon)+'</div>'
        + '<div class="kpi-sec-body"><div class="kpi-sec-label">'+k.label+'</div><div class="kpi-sec-value">'+k.valueHtml+'</div>'
        + (k.subNote ? '<div class="kpi-sec-note">'+k.subNote+'</div>' : '')
        + '</div></div>';
    }

    // valorObj = { valor, pendentes } vindo de resumo-vendas. hasOrders = há pedido
    // (não cancelado) no período — decide entre "Sem dados" (nada no período) e
    // "Pendente" (tem pedido, mas falta essa informação em algum deles).
    function statusText(hasOrders, pendentes){
      if(hasOrders && pendentes>0) return pendentes===1 ? 'Pendente — 1 pedido sem essa informação' : 'Pendente — '+pendentes+' pedidos sem essa informação';
      return 'Sem dados';
    }

    function kpisHTML(resumo, moeda, hasOrders){
      const heroes = [
        { label:'Faturamento', icon:'barChart', tint:'copper', note:'Bruto no período (vendas não canceladas)',
          valueHtml: resumo.faturamento.valor!==null ? escapeHtml(money(resumo.faturamento.valor, moeda)) : '<span class="dash">'+statusText(hasOrders,resumo.faturamento.pendentes)+'</span>' },
        { label:'Margem de contribuição (R$)', icon:'wallet', tint: resumo.margemContribuicao.valor===null ? 'muted' : (resumo.margemContribuicao.valor>=0?'success':'danger'),
          note:'Venda − desconto (cupom) − taxas − frete vendedor − imposto − custo produto',
          valueHtml: resumo.margemContribuicao.valor!==null
            ? '<span class="'+(resumo.margemContribuicao.valor>=0?'pos':'neg')+'">'+escapeHtml(moneySigned(resumo.margemContribuicao.valor, moeda))+'</span>'
            : '<span class="dash">'+statusText(hasOrders,resumo.margemContribuicao.pendentes)+'</span>' },
        { label:'Margem de contribuição (%)', icon:'percent', tint: resumo.margemPercentual===null ? 'muted' : (resumo.margemPercentual>=0?'success':'danger'),
          note:'Margem de contribuição sobre o faturamento',
          valueHtml: resumo.margemPercentual!==null
            ? '<span class="'+(resumo.margemPercentual>=0?'pos':'neg')+'">'+escapeHtml(pctFmt(resumo.margemPercentual))+'</span>'
            : '<span class="dash">'+statusText(hasOrders,resumo.margemContribuicao.pendentes)+'</span>' },
      ];

      function secMoneyCard(label, icon, obj){
        return { label, icon, tint:'muted',
          valueHtml: obj.valor!==null ? escapeHtml(money(obj.valor, moeda)) : '<span class="dash">'+statusText(hasOrders,obj.pendentes)+'</span>',
          subNote: obj.valor!==null && obj.pendentes>0 ? (obj.pendentes===1?'1 pedido pendente':obj.pendentes+' pedidos pendentes') : null };
      }
      const secs = [
        { label:'Pedidos no período', icon:'bag', tint:'teal', valueHtml: String(resumo.qtdPedidos) },
        { label:'Pedidos cancelados', icon:'x', tint: resumo.cancelados.quantidade>0 ? 'warning' : 'muted',
          valueHtml: String(resumo.cancelados.quantidade),
          subNote: resumo.cancelados.quantidade>0 ? ('não entram nos valores acima'+(resumo.cancelados.valor!==null?(' · '+money(resumo.cancelados.valor,moeda)):'')) : null },
        secMoneyCard('Descontos (cupom)', 'tag', resumo.desconto),
        secMoneyCard('Taxas/comissões', 'receipt', resumo.tarifas),
        secMoneyCard('Frete do vendedor', 'truck', resumo.freteVendedor),
        secMoneyCard('Imposto', 'fileText', resumo.imposto),
        secMoneyCard('Custo dos produtos', 'box', resumo.custoProduto),
      ];

      return '<div class="kpi-hero-grid">' + heroes.map(heroCardHTML).join('') + '</div>'
        + '<div class="kpi-sec-grid" style="margin-top:10px;">' + secs.map(secCardHTML).join('') + '</div>';
    }

    // ---- Gráfico: Faturamento x Margem de contribuição por dia (SVG simples) ----
    // opts.heightPx/opts.emptyClass/opts.emptyMsg permitem uma versão compacta
    // (mini card "Evolução diária" da grade de 3, dentro de secondaryChartsHTML)
    // reaproveitando exatamente o mesmo desenho/dado do gráfico principal —
    // nunca um segundo cálculo, só um tamanho menor.
    function chartHTML(serie, moeda, opts){
      opts = opts || {};
      const heightPx = opts.heightPx || 200;
      if(!serie.length){
        return '<div class="chart-canvas '+(opts.emptyClass||'h-lg')+'">' + chartGridLines(4)
          + chartEmptyState('lineChart', opts.emptyMsg || 'Sem dados no período selecionado. O gráfico aparece assim que houver pedidos não cancelados sincronizados.')
        + '</div>';
      }
      const n = serie.length;
      const W = Math.max(n*10, 10), H = 100, topPad = 8, botPad = 10;
      const usable = H - topPad - botPad;
      const vals = serie.flatMap(d => [d.faturamento, d.margemContribuicao]);
      const maxV = Math.max(0, ...vals);
      const minV = Math.min(0, ...vals);
      const range = (maxV - minV) || 1;
      const yFor = v => topPad + usable * (1 - (v - minV) / range);
      const baseY = yFor(0);

      const barW = 6;
      let bars = '';
      let points = [];
      serie.forEach((d, i) => {
        const cx = i*10 + 5;
        const y1 = yFor(d.faturamento);
        const barY = Math.min(y1, baseY), barH = Math.max(Math.abs(y1-baseY), 0.6);
        const dataLabel = fmtDiaCurto(d.dia)+' — Faturamento: '+money(d.faturamento,moeda)+' · Margem de contribuição: '+money(d.margemContribuicao,moeda);
        bars += '<rect x="'+(cx-barW/2)+'" y="'+barY+'" width="'+barW+'" height="'+barH+'" rx="1" fill="var(--copper)" fill-opacity="0.85"><title>'+escapeHtml(dataLabel)+'</title></rect>';
        points.push(cx+','+yFor(d.margemContribuicao));
      });
      const line = '<polyline points="'+points.join(' ')+'" fill="none" stroke="var(--teal)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>';
      const dots = serie.map((d,i) => {
        const cx = i*10+5, cy = yFor(d.margemContribuicao);
        const dataLabel = fmtDiaCurto(d.dia)+' — Margem de contribuição: '+money(d.margemContribuicao,moeda);
        return '<circle cx="'+cx+'" cy="'+cy+'" r="1.6" fill="var(--teal)" vector-effect="non-scaling-stroke"><title>'+escapeHtml(dataLabel)+'</title></circle>';
      }).join('');
      const baseline = '<line x1="0" y1="'+baseY+'" x2="'+W+'" y2="'+baseY+'" stroke="var(--border-strong)" stroke-width="1" vector-effect="non-scaling-stroke"/>';

      const labelStep = Math.max(1, Math.ceil(n/9));
      const labels = serie.map((d,i) => '<span>'+((i%labelStep===0 || i===n-1) ? escapeHtml(fmtDiaCurto(d.dia)) : '')+'</span>').join('');

      return '<div class="chart-canvas" style="position:relative;height:'+heightPx+'px;padding:0;">'
        + '<svg class="simple-chart-svg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="height:100%;">'
          + baseline + bars + line + dots
        + '</svg>'
      + '</div>'
      + '<div class="simple-chart-xlabels" style="grid-template-columns:repeat('+n+',1fr);">' + labels + '</div>';
    }

    function fmtDiaCurto(diaISO){
      const [, m, d] = diaISO.split('-');
      return d+'/'+m;
    }

    function chartCardHTML(data){
      const serie = data ? data.serieDiaria : [];

            + '<span class="legend-item"><span class="legend-dot" style="background:var(--copper)"></span>Faturamento</span>'
            + '<span class="legend-item"><span class="legend-dot" style="background:var(--teal)"></span>Margem de contribuição</span>'
            + '<span class="panel-note">'+(data?escapeHtml(data.periodo.label):'')+'</span>'
          + '</div>'
        + '</div>'
        + chartHTML(serie, 'BRL')
        + (serie.length ? '<div class="field-hint" style="margin-top:8px;">Dias com pedido sem custo de SKU cadastrado somam só a margem já conhecida daquele dia — nunca um valor estimado.</div>' : '')

    // ---- Evolução diária (mini) + Por marketplace + Fluxo de caixa ----

    // Evolução diária reaproveita a MESMA série (serieDiaria) do gráfico

    function painelCardShell(icon, titulo, bodyHtml){
      return '<div class="chart-card">'

    function painelErroHTML(){ return '<div class="chart-canvas h-sm">'+chartEmptyState('alertCircle','Não foi possível carregar.')+'</div>'; }

                + '<div class="conn-sub">'+l.qtdPedidos+' pedido'+(l.qtdPedidos===1?'':'s')+(l.participacaoPercentual!==null?(' · '+pctFmt(l.participacaoPercentual)+' do faturamento'):'')+'</div>'
              + '</div></div>'

    function fluxoDeCaixaHTML(painel, painelError){
      let body;
      if(painelError) body = painelErroHTML();

      else {

    // ---- Conexões & Empresas (real, 26/08/2026 — Passo 2) ----
    function connectionsPanelHTML(painel, painelError){

          + '<span class="conn-status"><span class="dot"'+(c.empresas.total>0?' style="background:var(--success)"':'')+'></span>'+c.empresas.total+' empresa'+(c.empresas.total===1?'':'s')+'</span></div>'
        + '<div class="conn-row"><div class="conn-row-left"><span class="conn-ic">'+svg('store')+'</span><div><div class="conn-name">Mercado Livre</div><div class="conn-sub">'+(ml.contasConectadas>0 ? (mlStatusLabel+(ultimaSinc?(' · última sinc. '+ultimaSinc):'')) : 'Conecte para sincronizar pedidos')+'</div></div></div>'
          + '<span class="conn-status"><span class="dot"'+mlDotStyle+'></span>'+ml.contasConectadas+' conta'+(ml.contasConectadas===1?'':'s')+'</span></div>'
        + '<div class="conn-row"><div class="conn-row-left"><span class="conn-ic">'+svg('store')+'</span><div><div class="conn-name">Shopee</div><div class="conn-sub">'+(shopee.contasConectadas>0 ? shopeeStatusLabel : 'Conecte em Marketplaces')+'</div></div></div>'
          + '<span class="conn-status"><span class="dot"'+shopeeDotStyle+'></span>'+shopee.contasConectadas+' loja'+(shopee.contasConectadas===1?'':'s')+'</span></div>'

    // ---- Alertas & IA (regras simples sobre dado real, 26/08/2026 — Passo 3) ----
    const ALERTA_SEVERIDADE_COR = { danger:'danger', warning:'warning', info:'teal' };

    function alertsPanelHTML(painel, painelError){
      if(painelError){
        return '<div class="panel"><div class="panel-head"><div class="panel-title"><span class="panel-title-ic">'+svg('sparkle')+'</span>Alertas & IA</div></div>'
          + '<p style="font-size:12px;color:var(--danger);margin:0;">Não foi possível carregar os alertas.</p></div>';
      }
      if(!painel){
        return '<div class="panel"><div class="panel-head"><div class="panel-title"><span class="panel-title-ic">'+svg('sparkle')+'</span>Alertas & IA</div></div>'
          + '<div class="table-skel"><span class="spin"></span><span>Carregando…</span></div></div>';
      }
      const alertas = painel.alertas;
      const body = alertas.length
        ? alertas.map(a => {
            const cor = ALERTA_SEVERIDADE_COR[a.severidade] || 'teal';
            return '<div class="conn-row alert-row" data-page="'+escapeHtml(a.pagina)+'" style="cursor:pointer;">'
              + '<div class="conn-row-left"><span class="conn-ic" style="color:var(--'+cor+');">'+svg('alertCircle')+'</span><div>'
                + '<div class="conn-name">'+escapeHtml(a.titulo)+'</div><div class="conn-sub">'+escapeHtml(a.descricao)+'</div>'
              + '</div></div>'

        : '<div class="empty-panel" style="padding:20px 10px;"><div class="empty-icon" style="width:36px;height:36px;">'+svg('checkCircle')+'</div><p class="lead" style="font-size:12.5px;margin:8px 0 0;">Nenhum alerta no momento — tudo certo com os dados sincronizados.</p></div>';

      return '<div class="panel">'
        + '<div class="panel-head"><div class="panel-title"><span class="panel-title-ic">'+svg('sparkle')+'</span>Alertas & IA</div>'
          + (alertas.length ? '<span class="panel-note">'+alertas.length+' alerta'+(alertas.length===1?'':'s')+'</span>' : '<span class="status-chip" style="color:var(--success);background:var(--success-soft);">'+svg('checkCircle')+'Tudo certo</span>')
        + '</div>'
        + '<div>' + body + '</div>'
      + '</div>';
    }

    // Radar da IA (25/08/2026) — puramente ADITIVO: nunca troca nada da
    // alertsPanelHTML acima (regras já existentes, calculadas na hora a
    // cada requisição). Isto aqui só EXIBE o que o ciclo automático em
    // segundo plano (server/lib/ia/radarScheduler.js) já persistiu no
    // Postgres — nenhuma análise nova acontece ao carregar esta tela.
    const RADAR_SEVERIDADE_COR = { critico:'danger', atencao:'warning', oportunidade:'success', informativo:'teal' };
    const RADAR_SEVERIDADE_EMOJI = { critico:'🔴', atencao:'🟠', oportunidade:'🟢', informativo:'🔵' };
    const RADAR_SEVERIDADE_LABEL = { critico:'Crítico', atencao:'Atenção', oportunidade:'Oportunidades', informativo:'Informativo' };

    function radarPanelHTML(painel, painelError){
      if(painelError) return ''; // já mostrado pela alertsPanelHTML acima — não duplica o erro
      if(!painel){
        return '<div class="panel"><div class="panel-head"><div class="panel-title"><span class="panel-title-ic">'+svg('activity')+'</span>Radar da IA</div></div>'
          + '<div class="table-skel"><span class="spin"></span><span>Carregando…</span></div></div>';
      }
      const radar = painel.radar;
      if(!radar){
        return '<div class="panel"><div class="panel-head"><div class="panel-title"><span class="panel-title-ic">'+svg('activity')+'</span>Radar da IA</div></div>'
          + '<p style="font-size:12px;color:var(--muted);margin:0;">'+escapeHtml(painel.radarError || 'O Radar da IA ainda não rodou o primeiro ciclo — ele roda automaticamente em segundo plano, sem precisar desta tela aberta.')+'</p></div>';
      }

      const chips = ['critico','atencao','oportunidade','informativo'].map(sev => {
        const n = radar.contagem[sev] || 0;
        const cor = RADAR_SEVERIDADE_COR[sev];
        return '<span class="status-chip" style="color:var(--'+cor+');background:var(--'+cor+'-soft);margin-right:6px;">'+RADAR_SEVERIDADE_EMOJI[sev]+' '+n+' '+RADAR_SEVERIDADE_LABEL[sev]+'</span>';
      }).join('');

      const resumo = radar.resumoHoje || [];
      const listaHTML = resumo.length
        ? resumo.map(r => {
            const cor = RADAR_SEVERIDADE_COR[r.severidade] || 'teal';
            return '<div class="conn-row alert-row" data-page="'+escapeHtml(r.pagina || '')+'" style="cursor:'+(r.pagina?'pointer':'default')+';">'
              + '<div class="conn-row-left"><span class="conn-ic" style="color:var(--'+cor+');">'+r.emoji+'</span><div>'
                + '<div class="conn-name">'+escapeHtml(r.titulo)+'</div>'
                + '<div class="conn-sub">'+escapeHtml(r.oQueAconteceu||'')+'</div>'
                + (r.oQueRecomenda ? '<div class="conn-sub" style="margin-top:2px;"><strong>IA recomenda:</strong> '+escapeHtml(r.oQueRecomenda)+'</div>' : '')
              + '</div></div>'
              + (r.pagina ? '<span class="conn-status">'+svg('link')+'</span>' : '')
            + '</div>';
          }).join('')
        : '<div class="empty-panel" style="padding:20px 10px;"><div class="empty-icon" style="width:36px;height:36px;">'+svg('checkCircle')+'</div><p class="lead" style="font-size:12.5px;margin:8px 0 0;">Nada exigindo atenção agora — o Radar continua acompanhando em segundo plano.</p></div>';

      const atualizadoEmFmt = fmtDateTime(radar.ultimaExecucaoEm);
      const atualizadoNota = atualizadoEmFmt ? '<span class="panel-note">atualizado '+atualizadoEmFmt+'</span>' : '';

      return '<div class="panel">'
        + '<div class="panel-head"><div class="panel-title"><span class="panel-title-ic">'+svg('activity')+'</span>Radar da IA</div>'+atualizadoNota+'</div>'
        + '<div style="padding:2px 16px 12px;">'+chips+'</div>'
        + '<div class="section-label" style="padding:0 16px;"><span>O que precisa da minha atenção hoje</span></div>'
        + '<div>' + listaHTML + '</div>'
      + '</div>';
    }

    function render(){
      const root = document.getElementById('overviewRoot');
      if(!root) return;
      const filtro = window.CerneFiltro.state;

      if(!filtro.loadingEmpresas && !filtro.empresas.length){
        root.innerHTML = '<div class="empty-panel"><div class="empty-icon">'+svg('building')+'</div>'
          + '<h2>Nenhuma empresa ativa</h2>'
          + '<p class="lead">Cadastre e ative uma empresa, conecte o Mercado Livre em <strong>Marketplaces</strong> e sincronize para ver os indicadores aqui.</p></div>';
        return;
      }

      let html = '';

      if(filtro.loadingEmpresas || state.loading){
        html += '<div class="table-card"><div class="table-skel"><span class="spin"></span><span>Carregando indicadores…</span></div></div>';
      } else if(state.error){
        html += '<div class="empty-panel"><div class="empty-icon" style="color:var(--danger); background:var(--danger-soft);">'+svg('alertCircle')+'</div>'
          + '<h2 style="color:var(--danger);">Não foi possível carregar</h2><p class="lead">'+escapeHtml(state.error)+'</p></div>';
      } else if(state.data){
        const resumo = state.data.resumo;
        const hasOrders = resumo.qtdPedidos > 0;
        html += sectionLabel('Indicadores principais — '+state.data.periodo.label)
          + kpisHTML(resumo, 'BRL', hasOrders)
          + sectionLabel('Desempenho')
          + chartCardHTML(state.data)
          + secondaryChartsHTML(state.data, state.painel, state.painelError)
          + sectionLabel('Status da operação')
          + '<div class="grid-2">' + connectionsPanelHTML(state.painel, state.painelError) + alertsPanelHTML(state.painel, state.painelError) + '</div>'
          + radarPanelHTML(state.painel, state.painelError);
      }

      root.innerHTML = html;

      root.querySelectorAll('.alert-row').forEach(el => {
        el.addEventListener('click', () => { const page = el.dataset.page; if(page) navigate(page); });
      });
    }

    window.Overview = { load };
  })();

  /* ================= IA GESTORA — central de análise =================
     Ativada em 2026 (3 passos — ver docs/02-decisoes.md). Reescrita em
     25/08/2026 ("IA Gestora — central de análise", 3 novos passos):
       1) Histórico de conversas salvo no banco (login real — ver
          routes/iaGestora.js/lib/auth — escopado só a esta página).
       2) Respostas visuais (resumo/KPIs/tabela/gráfico/insights/atenção) —
          o "card" é montado no backend (lib/ia/estrutura.js) a partir de
          dados reais; aqui é só desenho, nenhum número é calculado no
          front-end.
       3) Botão "Baixar planilha" quando a mensagem tem card visual — a
          planilha vem pronta do backend (mesmos dados, nunca gerada aqui).
     Sempre usa a empresa e o período do HEADER (window.CerneFiltro), igual
     antes — nenhum seletor próprio nesta tela. */
  (function(){
    const SUGESTOES = [
      'Como estão minhas vendas hoje?',
      'Qual produto mais lucrou este mês?',
      'Tem alguma venda dando prejuízo?',
      'Quanto vou receber?',
      'Quais problemas precisam da minha atenção?',
    ];

    const state = {
      checkingAuth: true, usuario: null,
      loginEmail: '', loginSenha: '', loginErro: null, loginLoading: false,
      conversas: [], loadingConversas: false, contextEmpresaId: null,
      conversaId: null, messages: [], loading: false,
      // Radar da IA (25/08/2026) — resumo do que já foi persistido pelo
      // ciclo automático em segundo plano (server/lib/ia/radarScheduler.js).
      // Só LEITURA (GET /radar-resumo) — nunca dispara uma análise nova.
      radar: null, radarLoading: false, radarError: null,
    };

    function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function toast(message, type){
      const wrap = document.getElementById('toastWrap');
      if(!wrap) return;
      const el = document.createElement('div');
      el.className = 'toast ' + (type||'success');
      el.innerHTML = svg(type==='error' ? 'alertCircle':'checkCircle') + '<span>'+escapeHtml(message)+'</span>';
      wrap.appendChild(el);
      setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .25s'; setTimeout(()=>el.remove(),250); }, 3200);
    }

    async function apiIa(path, opts){
      const res = await fetch('/api/ia-gestora'+path, { credentials: 'same-origin', ...opts, headers: { 'Content-Type': 'application/json', ...(opts&&opts.headers) } });
      let body = null; try{ body = await res.json(); }catch(e){}
      if(!res.ok){ const err = new Error((body && body.error) || 'Não foi possível falar com a IA Gestora agora.'); err.status = res.status; err.codigo = body && body.codigo; throw err; }
      return body;
    }
    const apiMe = () => apiIa('/me');
    const apiLogin = (email, senha) => apiIa('/login', { method:'POST', body: JSON.stringify({ email, senha }) });
    const apiLogout = () => apiIa('/logout', { method:'POST' });
    const apiListarConversas = (empresaId) => apiIa('/conversas?empresaId='+empresaId);
    const apiAbrirConversa = (id) => apiIa('/conversas/'+id);
    const apiExcluirConversa = (id) => apiIa('/conversas/'+id, { method:'DELETE' });
    const apiPerguntar = (empresaId, periodo, pergunta, conversaId) => apiIa('/perguntar', { method:'POST', body: JSON.stringify({ empresaId, periodo, pergunta, conversaId: conversaId||undefined }) });
    const apiRadarResumo = (empresaId) => apiIa('/radar-resumo?empresaId='+empresaId);

    function empresaAtualNome(){
      const filtro = window.CerneFiltro.state;
      const emp = filtro.empresas.find(e => e.id === filtro.empresaId);
      return emp ? (emp.nomeFantasia || emp.razaoSocial) : null;
    }
    function periodoAtualLabel(){
      const chave = window.CerneFiltro.state.periodo;
      const def = HEADER_PERIODOS.find(p => p.chave === chave);
      return def ? def.label : chave;
    }

    async function carregarConversas(){
      const filtro = window.CerneFiltro.state;
      if(!filtro.empresaId){ state.conversas = []; return; }
      state.loadingConversas = true; render();
      try{
        const body = await apiListarConversas(filtro.empresaId);
        state.conversas = body.conversas || [];
      }catch(e){ /* lista de histórico é auxiliar — uma falha aqui não impede conversar */ }
      state.loadingConversas = false; render();
    }

    // Radar da IA — só leitura do que o ciclo em segundo plano já persistiu
    // (nunca dispara um ciclo novo aqui). Auxiliar, igual à lista de
    // conversas: uma falha aqui não impede conversar com a IA Gestora.
    async function carregarRadar(){
      const filtro = window.CerneFiltro.state;
      if(!filtro.empresaId){ state.radar = null; state.radarError = null; return; }
      state.radarLoading = true; render();
      try{
        state.radar = await apiRadarResumo(filtro.empresaId);
        state.radarError = null;
      }catch(e){ state.radar = null; state.radarError = e.message || 'Não foi possível carregar o Radar da IA agora.'; }
      state.radarLoading = false; render();
    }

    // Empresa mudou desde a última vez: uma conversa é sempre de UMA
    // empresa (db/schema.sql#ia_conversas) — trocar de empresa fecha a
    // conversa aberta (nunca mistura pergunta nova com histórico de outra
    // empresa) e recarrega a lista de conversas daquela empresa.
    function sincronizarContexto(){
      const filtro = window.CerneFiltro.state;
      if(state.contextEmpresaId !== null && state.contextEmpresaId !== filtro.empresaId){
        state.conversaId = null; state.messages = [];
      }
      if(state.contextEmpresaId !== filtro.empresaId){
        state.contextEmpresaId = filtro.empresaId;
        carregarConversas();
        carregarRadar();
      }
    }

    async function load(){
      if(state.checkingAuth || !state.usuario){
        try{
          const body = await apiMe();
          state.usuario = body.usuario;
        }catch(e){ state.usuario = null; }
        state.checkingAuth = false;
      }
      if(state.usuario) sincronizarContexto();
      render();
    }

    window.CerneFiltro.onChange(()=>{
      const page = document.getElementById('page-iaGestora');
      if(page && page.classList.contains('active') && state.usuario){ sincronizarContexto(); render(); }
    });

    function scrollParaFinal(){
      const msgsEl = document.getElementById('iaMsgs');
      if(msgsEl) msgsEl.scrollTop = msgsEl.scrollHeight;
    }

    // ---------------- Card visual (resumo/KPIs/tabela/gráfico/insights/atenção) ----------------
    // Só desenha o que veio de `estrutura` — nenhum valor é calculado aqui;
    // ver lib/ia/estrutura.js no backend.

    function fmtCelula(v, tipo){
      if(v === null || v === undefined) return 'pendente';
      if(tipo === 'money') return 'R$ ' + Number(v).toLocaleString('pt-BR', { minimumFractionDigits:2, maximumFractionDigits:2 });
      if(tipo === 'percent') return Number(v).toLocaleString('pt-BR', { maximumFractionDigits:1 }) + '%';
      if(tipo === 'int') return Number(v).toLocaleString('pt-BR');
      return escapeHtml(String(v));
    }

    function kpisHTML(kpis){
      if(!kpis || !kpis.length) return '';
      return '<div class="ia-kpis">' + kpis.map(k =>
        '<div class="ia-kpi"><div class="ia-kpi-label">'+escapeHtml(k.label)+(k.grupo?' · '+escapeHtml(k.grupo):'')+'</div>'
        + '<div class="ia-kpi-value">'+escapeHtml(k.valorFormatado || (k.valor===null?'pendente':String(k.valor)))+'</div>'
        + (k.destaque ? '<div class="ia-kpi-sub">'+escapeHtml(k.destaque)+'</div>' : '')
        + (k.variacaoPercentual!==undefined && k.variacaoPercentual!==null ? '<div class="ia-kpi-sub">'+(k.variacaoPercentual>=0?'+':'')+k.variacaoPercentual.toLocaleString('pt-BR',{maximumFractionDigits:1})+'% vs. período anterior</div>' : '')
        + '</div>'
      ).join('') + '</div>';
    }

    function tabelaHTML(tabela){
      if(!tabela || !tabela.linhas || !tabela.linhas.length) return '';
      const head = '<tr>' + tabela.colunas.map(c => '<th>'+escapeHtml(c.header)+'</th>').join('') + '</tr>';
      const rows = tabela.linhas.map(linha => '<tr>' + tabela.colunas.map(c => '<td>'+fmtCelula(linha[c.key], c.tipo)+'</td>').join('') + '</tr>').join('');
      return '<div class="ia-table-wrap"><table class="ia-table"><thead>'+head+'</thead><tbody>'+rows+'</tbody></table></div>';
    }

    function graficosHTML(graficos){
      if(!graficos || !graficos.length) return '';
      return graficos.map(g => {
        const maiorValor = Math.max(1, ...g.series.flatMap(s => s.valores.map(v => Math.abs(v||0))));
        const linhas = g.categorias.map((cat, i) => {
          const barras = g.series.map((s, si) => {
            const v = s.valores[i] || 0;
            const pct = Math.max(2, Math.round((Math.abs(v) / maiorValor) * 100));
            return '<div class="ia-chart-bar-track"><div class="ia-chart-bar-fill s'+(si%2)+'" style="width:'+pct+'%"></div></div>'
              + '<div class="ia-chart-value">'+escapeHtml(g.series.length>1?s.nome+': ':'')+fmtCelula(v, s.tipo)+'</div>';
          }).join('');
          return '<div class="ia-chart-row"><div class="ia-chart-label">'+escapeHtml(cat)+'</div><div class="ia-chart-bars">'+barras+'</div></div>';
        }).join('');
        return '<div class="ia-chart"><div class="ia-chart-title">'+escapeHtml(g.titulo)+'</div>'+linhas+'</div>';
      }).join('');
    }

    function cardHTML(msg){
      const e = msg.estrutura;
      if(!e) return '';
      const resumoLinha = e.resumo ? '<div class="ia-card-resumo">'
        + '<span>'+svg('clock')+' '+escapeHtml(e.resumo.periodo||'')+'</span>'
        + (e.resumo.empresa ? '<span>'+svg('building')+' '+escapeHtml(e.resumo.empresa)+'</span>' : '')
        + '</div>' : '';
      const insightsHtml = (e.insights && e.insights.length)
        ? '<div class="ia-insights"><h4>Principais conclusões</h4><ul>'+e.insights.map(i=>'<li>'+escapeHtml(i)+'</li>').join('')+'</ul></div>' : '';
      const atencaoHtml = e.atencao ? '<div class="ia-atencao"><h4>Atenção</h4>'+escapeHtml(e.atencao)+'</div>' : '';
      const temPlanilha = (e.tabela && e.tabela.linhas && e.tabela.linhas.length) || (e.graficos && e.graficos.length);
      const downloadHtml = (temPlanilha && msg.id) ? '<div class="ia-card-actions"><a class="ia-download-btn" href="/api/ia-gestora/conversas/'+state.conversaId+'/mensagens/'+msg.id+'/xlsx" target="_blank" rel="noopener">'+svg('download')+'<span>Baixar planilha (XLSX)</span></a></div>' : '';
      return '<div class="ia-card">'
        + resumoLinha
        + kpisHTML(e.kpis)
        + tabelaHTML(e.tabela)
        + graficosHTML(e.graficos)
        + insightsHtml
        + atencaoHtml
        + downloadHtml
        + '</div>';
    }

    function msgHTML(msg){
      const isUser = msg.papel === 'usuario';
      const bubbleClass = 'ia-bubble' + (msg.erro ? ' erro' : '');
      let toolsHtml = '';
      if(!isUser && msg.ferramentasUsadas && msg.ferramentasUsadas.length){
        toolsHtml = '<div class="ia-msg-tools">'+svg('search')+'<span>Consultou: '+escapeHtml(msg.ferramentasUsadas.join(', '))+'</span></div>';
      }
      return '<div class="ia-msg '+(isUser?'user':'assistant')+'">'
        + '<div class="ia-msg-ic">'+svg(isUser ? 'users' : 'messageCircle')+'</div>'
        + '<div><div class="'+bubbleClass+'">'+escapeHtml(msg.texto)+'</div>'+(isUser?'':cardHTML(msg))+toolsHtml+'</div>'
        + '</div>';
    }

    function typingHTML(){
      return '<div class="ia-msg assistant"><div class="ia-msg-ic">'+svg('messageCircle')+'</div>'
        + '<div class="ia-bubble ia-typing"><span class="spin"></span><span>IA Gestora está consultando os dados…</span></div></div>';
    }

    // Radar da IA — resumo "O que precisa da minha atenção hoje" (Passo 3
    // do pedido do usuário, ver docs/02-decisoes.md). Mostrado na tela
    // inicial da IA Gestora (antes de qualquer pergunta) — nunca substitui
    // o chat, só resume o que o ciclo automático em segundo plano já
    // detectou. Mesma paleta/emoji de severidade usada em Visão Geral >
    // Alertas & IA (página overview, função radarPanelHTML).
    const IA_RADAR_SEVERIDADE_COR = { critico:'danger', atencao:'warning', oportunidade:'success', informativo:'teal' };
    const IA_RADAR_SEVERIDADE_EMOJI = { critico:'🔴', atencao:'🟠', oportunidade:'🟢', informativo:'🔵' };
    const IA_RADAR_SEVERIDADE_LABEL = { critico:'Crítico', atencao:'Atenção', oportunidade:'Oportunidades', informativo:'Informativo' };

    function radarResumoBlockHTML(){
      if(state.radarLoading && !state.radar) return '<div class="ia-radar-block"><span class="spin"></span><span>Carregando o Radar da IA…</span></div>';
      if(state.radarError) return ''; // auxiliar — some silenciosamente, o chat continua funcionando normalmente
      if(!state.radar) return '';

      const contagem = state.radar.contagem || {};
      const totalRelevante = (contagem.critico||0) + (contagem.atencao||0) + (contagem.oportunidade||0);
      if(!totalRelevante) return '';

      const chips = ['critico','atencao','oportunidade','informativo'].map(sev => {
        const n = contagem[sev] || 0;
        if(!n) return '';
        const cor = IA_RADAR_SEVERIDADE_COR[sev];
        return '<span class="status-chip" style="color:var(--'+cor+');background:var(--'+cor+'-soft);margin-right:6px;">'+IA_RADAR_SEVERIDADE_EMOJI[sev]+' '+n+' '+IA_RADAR_SEVERIDADE_LABEL[sev]+'</span>';
      }).join('');

      const itens = (state.radar.resumoHoje || []).slice(0, 5).map(r => {
        const cor = IA_RADAR_SEVERIDADE_COR[r.severidade] || 'teal';
        return '<div class="conn-row alert-row" data-page="'+escapeHtml(r.pagina||'')+'" style="cursor:'+(r.pagina?'pointer':'default')+';">'
          + '<div class="conn-row-left"><span class="conn-ic" style="color:var(--'+cor+');">'+r.emoji+'</span><div>'
            + '<div class="conn-name">'+escapeHtml(r.titulo)+'</div>'
            + '<div class="conn-sub">'+escapeHtml(r.oQueAconteceu||'')+'</div>'
          + '</div></div>'
          + (r.pagina ? '<span class="conn-status">'+svg('link')+'</span>' : '')
        + '</div>';
      }).join('');

      return '<div class="ia-radar-block">'
        + '<div class="ia-radar-head"><span class="panel-title-ic">'+svg('activity')+'</span><strong>O que precisa da minha atenção hoje</strong></div>'
        + '<div style="margin:6px 0 10px;">'+chips+'</div>'
        + itens
      + '</div>';
    }

    function emptyStateHTML(){
      return '<div class="ia-empty">'
        + '<div class="empty-icon">'+svg('messageCircle')+'</div>'
        + '<h2>Pergunte à IA Gestora</h2>'
        + '<p>Ela consulta os dados reais desta empresa e período — nunca inventa número. Ainda só consulta e analisa: não altera nada no sistema.</p>'
        + radarResumoBlockHTML()
        + '<div class="ia-suggestions">' + SUGESTOES.map(s => '<button type="button" class="ia-chip" data-pergunta="'+escapeHtml(s)+'">'+escapeHtml(s)+'</button>').join('') + '</div>'
        + '</div>';
    }

    // ---------------- Login (login real, escopado a esta página) ----------------

    function renderLogin(){
      const root = document.getElementById('iaGestoraRoot');
      if(!root) return;
      root.innerHTML = '<div class="ia-page"><div class="ia-login-panel"><form class="ia-login-box" id="iaLoginForm">'
        + '<div class="empty-icon" style="align-self:center;">'+svg('messageCircle')+'</div>'
        + '<h2>Entrar na IA Gestora</h2>'
        + '<p class="lead-sm">Login necessário só para conversar e ver seu histórico — suas conversas nunca aparecem para outro usuário.</p>'
        + (state.loginErro ? '<div class="ia-login-error">'+escapeHtml(state.loginErro)+'</div>' : '')
        + '<div class="ia-login-field"><label>E-mail</label><input type="email" id="iaLoginEmail" autocomplete="username" required value="'+escapeHtml(state.loginEmail)+'"></div>'
        + '<div class="ia-login-field"><label>Senha</label><input type="password" id="iaLoginSenha" autocomplete="current-password" required></div>'
        + '<button type="submit" class="ia-login-submit" id="iaLoginSubmit" '+(state.loginLoading?'disabled':'')+'>'+(state.loginLoading?'Entrando…':'Entrar')+'</button>'
        + '</form></div></div>';

      const form = document.getElementById('iaLoginForm');
      if(form) form.addEventListener('submit', async (e)=>{
        e.preventDefault();
        state.loginEmail = document.getElementById('iaLoginEmail').value.trim();
        const senha = document.getElementById('iaLoginSenha').value;
        state.loginErro = null; state.loginLoading = true; render();
        try{
          const body = await apiLogin(state.loginEmail, senha);
          state.usuario = body.usuario;
          state.loginLoading = false;
          sincronizarContexto();
          render();
        }catch(err){
          state.loginErro = err.message || 'Não foi possível entrar.';
          state.loginLoading = false;
          render();
        }
      });
    }

    // ---------------- Sidebar de conversas ----------------

    function convosSidebarHTML(){
      const lista = state.conversas.length
        ? state.conversas.map(c => {
            const dt = new Date(c.atualizadoEm);
            const dataFmt = isNaN(dt) ? '' : dt.toLocaleDateString('pt-BR') + ' ' + dt.toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
            return '<div class="ia-convo-item'+(c.id===state.conversaId?' active':'')+'" data-id="'+c.id+'">'
              + '<div class="ia-convo-info"><div class="ia-convo-title">'+escapeHtml(c.titulo)+'</div><div class="ia-convo-meta">'+dataFmt+'</div></div>'
              + '<button type="button" class="ia-convo-del" data-del-id="'+c.id+'" title="Excluir conversa" aria-label="Excluir conversa">'+svg('trash')+'</button>'
              + '</div>';
          }).join('')
        : ('<div class="ia-convos-empty">'+(state.loadingConversas ? 'Carregando…' : 'Nenhuma conversa ainda. Pergunte algo para começar.')+'</div>');

      return '<div class="ia-convos">'
        + '<div class="ia-convos-head"><h3>Conversas</h3><button type="button" class="ia-new-btn" id="iaNovaConversaBtn">'+svg('plus')+'<span>Nova</span></button></div>'
        + '<div class="ia-convos-list" id="iaConvosList">' + lista + '</div>'
        + '<div class="ia-convos-foot"><span class="ia-convos-user">'+escapeHtml((state.usuario&&(state.usuario.nome||state.usuario.email))||'')+'</span><button type="button" class="ia-logout-btn" id="iaLogoutBtn">'+svg('logOut')+'<span>Sair</span></button></div>'
        + '</div>';
    }

    function render(){
      const root = document.getElementById('iaGestoraRoot');
      if(!root) return;

      if(state.checkingAuth){ root.innerHTML = '<div class="ia-page"><div class="ia-login-panel"><span class="spin"></span></div></div>'; return; }
      if(!state.usuario){ renderLogin(); return; }

      const filtro = window.CerneFiltro.state;
      if(!filtro.loadingEmpresas && !filtro.empresas.length){
        root.innerHTML = '<div class="empty-panel"><div class="empty-icon">'+svg('building')+'</div>'
          + '<h2>Nenhuma empresa ativa</h2>'
          + '<p class="lead">Cadastre e ative uma empresa em <strong>Cadastros → Empresas</strong> para conversar com a IA Gestora.</p></div>';
        return;
      }

      const empresaNome = empresaAtualNome();
      const periodoLabel = periodoAtualLabel();
      const contextoHtml = '<div class="ia-inputbar-context">'
        + svg('building') + '<span>'+escapeHtml(empresaNome || 'Selecione uma empresa no cabeçalho')+'</span>'
        + '<span style="opacity:.5;">·</span>'
        + svg('clock') + '<span>'+escapeHtml(periodoLabel)+'</span>'
        + '</div>';

      const msgsHtml = state.messages.length
        ? state.messages.map(msgHTML).join('') + (state.loading ? typingHTML() : '')
        : (state.loading ? typingHTML() : emptyStateHTML());

      root.innerHTML = '<div class="ia-page">'
        + convosSidebarHTML()
        + '<div class="ia-shell">'
          + '<div class="ia-msgs" id="iaMsgs">' + msgsHtml + '</div>'
          + '<div class="ia-inputbar">'
            + contextoHtml
            + '<div class="ia-input-row">'
              + '<textarea class="ia-textarea" id="iaInput" rows="1" placeholder="Pergunte sobre vendas, margem, custos, contas a pagar/receber, estoque…" '+(filtro.empresaId?'':'disabled')+'></textarea>'
              + '<button class="ia-send-btn" id="iaSendBtn" type="button" '+(filtro.empresaId?'':'disabled')+'>'+svg('send')+'</button>'
            + '</div>'
            + '<div class="ia-disclaimer">A IA Gestora só consulta e analisa dados reais desta empresa e período — ainda não altera nada no sistema.</div>'
          + '</div>'
        + '</div>'
      + '</div>';

      scrollParaFinal();

      const input = document.getElementById('iaInput');
      const sendBtn = document.getElementById('iaSendBtn');

      function autoresize(){ input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 120) + 'px'; }
      if(input){
        input.addEventListener('input', autoresize);
        input.addEventListener('keydown', (e)=>{
          if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); enviar(input.value); }
        });
      }
      if(sendBtn) sendBtn.addEventListener('click', ()=> enviar(input ? input.value : ''));

      root.querySelectorAll('.ia-chip').forEach(el=>{
        el.addEventListener('click', ()=> enviar(el.dataset.pergunta));
      });
      root.querySelectorAll('.ia-radar-block .alert-row').forEach(el=>{
        el.addEventListener('click', () => { const page = el.dataset.page; if(page) navigate(page); });
      });

      const novaBtn = document.getElementById('iaNovaConversaBtn');
      if(novaBtn) novaBtn.addEventListener('click', ()=>{
        state.conversaId = null; state.messages = []; render();
      });
      const logoutBtn = document.getElementById('iaLogoutBtn');
      if(logoutBtn) logoutBtn.addEventListener('click', async ()=>{
        try{ await apiLogout(); }catch(e){ /* mesmo se falhar, limpa o estado local — o cookie expira sozinho */ }
        state.usuario = null; state.conversaId = null; state.messages = []; state.conversas = []; state.contextEmpresaId = null;
        render();
      });
      root.querySelectorAll('.ia-convo-item').forEach(el=>{
        el.addEventListener('click', (e)=>{
          if(e.target.closest('.ia-convo-del')) return;
          abrirConversa(Number(el.dataset.id));
        });
      });
      root.querySelectorAll('.ia-convo-del').forEach(el=>{
        el.addEventListener('click', (e)=>{
          e.stopPropagation();
          excluirConversa(Number(el.dataset.delId));
        });
      });
    }

    async function abrirConversa(id){
      if(state.loading || id === state.conversaId) return;
      try{
        const conversa = await apiAbrirConversa(id);
        state.conversaId = conversa.id;
        state.messages = conversa.mensagens.map(m => ({ id: m.id, papel: m.papel, texto: m.texto, estrutura: m.estrutura, ferramentasUsadas: m.ferramentasUsadas, aviso: m.aviso }));
        render();
      }catch(err){ toast(err.message || 'Não foi possível abrir esta conversa.', 'error'); }
    }

    async function excluirConversa(id){
      if(!window.confirm('Excluir esta conversa? Essa ação não pode ser desfeita.')) return;
      try{
        await apiExcluirConversa(id);
        state.conversas = state.conversas.filter(c => c.id !== id);
        if(state.conversaId === id){ state.conversaId = null; state.messages = []; }
        toast('Conversa excluída.', 'success');
        render();
      }catch(err){ toast(err.message || 'Não foi possível excluir esta conversa.', 'error'); }
    }

    async function enviar(textoBruto){
      const texto = String(textoBruto || '').trim();
      const filtro = window.CerneFiltro.state;
      if(!texto || state.loading || !filtro.empresaId) return;

      state.messages.push({ papel: 'usuario', texto });
      state.loading = true;
      render();

      try{
        const resp = await apiPerguntar(filtro.empresaId, filtro.periodo, texto, state.conversaId);
        const ehErro = resp.aviso === 'nao_configurada' || resp.aviso === 'erro_provedor' || resp.aviso === 'limite_rodadas';
        state.conversaId = resp.conversaId;
        state.messages.push({ id: resp.mensagemId, papel: 'assistente', texto: resp.resposta, estrutura: resp.estrutura, ferramentasUsadas: resp.ferramentasUsadas, aviso: resp.aviso, erro: ehErro });
        carregarConversas();
      }catch(err){
        if(err.status === 401){
          state.usuario = null; state.messages.pop();
          toast('Sua sessão expirou — faça login de novo.', 'error');
        } else {
          state.messages.push({ papel: 'assistente', texto: err.message || 'Não consegui falar com a IA Gestora agora. Tente novamente.', erro: true });
        }
      }
      state.loading = false;
      render();
      const inputAfter = document.getElementById('iaInput');
      if(inputAfter) inputAfter.focus();
    }

    window.IAGestora = { load };
  })();

  /* ================= PEDIDOS — importados do Mercado Livre =================
     A listagem vem de /api/pedidos, que por trás usa lib/relatorioVendas.js —
     a MESMA fonte que Visão Geral e Financeiro consultam (routes/relatorios.js)
     pro mesmo período nunca aparecer com números diferentes em telas diferentes. */
  (function(){
    const PERIODOS = [
      { chave:'hoje', label:'Hoje' },
      { chave:'ontem', label:'Ontem' },
      { chave:'7d', label:'Últimos 7 dias' },
      { chave:'30d', label:'Últimos 30 dias' },
      { chave:'mes', label:'Este mês' },
    ];
    const state = { empresas:[], empresaId:null, loadingEmpresas:false, periodo:'30d', contaId:'', status:'', busca:'',
      items:[], totalNoPeriodo:0, totalFiltrado:0, periodoLabel:'', filtrosDisponiveis:{lojas:[],status:[]}, loading:false, error:null, gerandoRelatorio:false };

    function toast(message, type){
      const wrap = document.getElementById('toastWrap');
      const el = document.createElement('div');
      el.className = 'toast ' + (type||'success');
      el.innerHTML = svg(type==='error' ? 'alertCircle':'checkCircle') + '<span>'+message+'</span>';
      wrap.appendChild(el);
      setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .25s'; setTimeout(()=>el.remove(),250); }, 4200);
    }
    function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function fmtDateTime(iso){ if(!iso) return '—'; try{ return new Date(iso).toLocaleString('pt-BR'); }catch(e){ return '—'; } }
    // Data + hora em duas linhas (mais estreito que a data/hora por extenso) —
    // usado só na coluna "Data" da tabela, que precisa caber na largura normal
    // da tela sem precisar rolar pro lado. O detalhe do pedido continua usando
    // fmtDateTime (por extenso).
    function fmtDataCell(iso){
      if(!iso) return '—';
      try{
        const d = new Date(iso);
        const data = d.toLocaleDateString('pt-BR');
        const hora = d.toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
        return '<div class="cell-stack"><span>'+data+'</span><span class="cell-stack-sub">'+hora+'</span></div>';
      }catch(e){ return '—'; }
    }
    function money(v, moeda){ return v===null||v===undefined ? null : (moeda==='BRL'||!moeda?'R$ ':moeda+' ') + Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2}); }

    async function apiEmpresasAtivas(){
      const res = await fetch('/api/empresas?status=ativas');
      return ((await res.json()).empresas) || [];
    }
    async function apiPedidos(path){
      const res = await fetch('/api/pedidos'+path);
      let body = null; try{ body = await res.json(); }catch(e){}
      if(!res.ok) throw new Error((body && body.error) || 'Falha na requisição.');
      return body;
    }
    async function apiMlSync(contaId){
      const res = await fetch('/api/integracoes/mercadolivre/'+contaId+'/sincronizar', { method:'POST' });
      let body = null; try{ body = await res.json(); }catch(e){}
      if(!res.ok) throw new Error((body && body.error) || 'Falha ao sincronizar.');
      return body;
    }
    async function apiContaDaEmpresa(empresaId){
      const res = await fetch('/api/integracoes/mercadolivre?empresaId='+empresaId);
      const body = await res.json();
      return (body.contas && body.contas[0]) || null;
    }

    function queryFiltrosAtuais(){
      const params = new URLSearchParams({ empresaId: state.empresaId, periodo: state.periodo });
      if(state.contaId) params.set('contaId', state.contaId);
      if(state.status) params.set('status', state.status);
      if(state.busca.trim()) params.set('busca', state.busca.trim());
      return params;
    }

    async function loadPedidos(){
      state.loading = true; state.error = null; render();
      try{
        const data = await apiPedidos('?'+queryFiltrosAtuais().toString());
        state.items = data.pedidos;
        state.totalNoPeriodo = data.totalNoPeriodo;
        state.totalFiltrado = data.totalFiltrado;
        state.periodoLabel = data.periodo ? data.periodo.label : '';
        state.filtrosDisponiveis = data.filtrosDisponiveis || { lojas:[], status:[] };
      }catch(err){ state.error = err.message; }
      state.loading = false; render();
    }

    async function load(){
      state.loadingEmpresas = true; render();
      try{
        state.empresas = await apiEmpresasAtivas();
        if(!state.empresaId || !state.empresas.find(e=>e.id===state.empresaId)){
          state.empresaId = state.empresas.length ? state.empresas[0].id : null;
        }
      }catch(e){ state.empresas = []; }
      state.loadingEmpresas = false;
      if(state.empresaId) await loadPedidos(); else render();
    }

    function render(){
      const root = document.getElementById('pedidosRoot');
      if(!root) return;

      if(!state.loadingEmpresas && !state.empresas.length){
        root.innerHTML = '<div class="empty-panel"><div class="empty-icon">'+svg('building')+'</div>'
          + '<h2>Nenhuma empresa ativa</h2>'
          + '<p class="lead">Cadastre e ative uma empresa, conecte o Mercado Livre em <strong>Marketplaces</strong> e sincronize para ver os pedidos aqui.</p></div>';
        return;
      }

      let html = '<div class="toolbar">'
        + '<div style="display:flex;gap:10px;flex-wrap:wrap;">'
          + '<div class="empresa-picker" style="margin-bottom:0;"><select id="pedEmpresaSelect">'
            + state.empresas.map(e=>'<option value="'+e.id+'" '+(e.id===state.empresaId?'selected':'')+'>'+escapeHtml(e.nomeFantasia||e.razaoSocial)+'</option>').join('')
          + '</select></div>'
          + '<div class="empresa-picker" style="margin-bottom:0;"><select id="pedPeriodoSelect">'
            + PERIODOS.map(pr=>'<option value="'+pr.chave+'" '+(pr.chave===state.periodo?'selected':'')+'>'+pr.label+'</option>').join('')
          + '</select></div>'
          + '<div class="empresa-picker" style="margin-bottom:0;"><select id="pedLojaSelect">'
            + '<option value="">Todas as lojas</option>'
            + state.filtrosDisponiveis.lojas.map(l=>'<option value="'+l.id+'" '+(String(l.id)===String(state.contaId)?'selected':'')+'>'+escapeHtml(l.nickname||('Conta '+l.id))+'</option>').join('')
          + '</select></div>'
          + '<div class="empresa-picker" style="margin-bottom:0;"><select id="pedStatusSelect">'
            + '<option value="">Todos os status</option>'
            + state.filtrosDisponiveis.status.map(s=>'<option value="'+escapeHtml(s)+'" '+(s===state.status?'selected':'')+'>'+escapeHtml(s)+'</option>').join('')
          + '</select></div>'
          + '<div class="search-box" style="margin-bottom:0;">'+svg('search')+'<input type="text" id="pedBuscaInput" placeholder="Produto ou SKU" value="'+escapeHtml(state.busca)+'"></div>'
        + '</div>'
        + '<div style="display:flex;gap:10px;flex-wrap:wrap;">'
          + '<button class="ghost-btn" id="pedSyncBtn" type="button" style="cursor:pointer; opacity:1;">'+svg('refreshCw')+'<span>Sincronizar</span></button>'
          + '<button class="ghost-btn" id="pedRelatorioXlsxBtn" type="button" style="cursor:pointer; opacity:1;" title="Gerar relatório em Excel com os filtros atuais">'+svg('fileText')+'<span>Gerar relatório (Excel)</span></button>'
          + '<button class="ghost-btn" id="pedRelatorioCsvBtn" type="button" style="cursor:pointer; opacity:1;" title="Gerar relatório em CSV com os filtros atuais">'+svg('fileText')+'<span>CSV</span></button>'
        + '</div>'
      + '</div>';

      if(state.loading){
        html += '<div class="table-card"><div class="table-skel"><span class="spin"></span><span>Carregando pedidos…</span></div></div>';
      } else if(state.error){
        html += '<div class="empty-panel"><div class="empty-icon" style="color:var(--danger); background:var(--danger-soft);">'+svg('alertCircle')+'</div>'
          + '<h2 style="color:var(--danger);">Não foi possível carregar</h2><p class="lead">'+state.error+'</p></div>';
      } else if(!state.items.length){
        html += '<div class="empty-panel"><div class="empty-icon">'+svg('inbox')+'</div>'
          + '<h2>Nenhum pedido no período</h2>'
          + '<p class="lead">Não há pedidos sincronizados em "'+escapeHtml(state.periodoLabel||'')+'". Conecte uma conta do Mercado Livre em <strong>Marketplaces</strong> e clique em "Sincronizar agora", ou escolha outro período.</p></div>';
      } else {
        const cellMoney = (v, moeda, negative) => v===null
          ? '<span style="color:var(--text-faint);font-style:italic;">pendente</span>'
          : (negative && v!==0 ? '− ' : '') + money(Math.abs(v), moeda);
        const pctCell = (v) => v===null
          ? '<span style="color:var(--text-faint);font-style:italic;">pendente</span>'
          : '<span style="'+(v>=0?'color:var(--success);':'color:var(--danger);')+'">'+(v<0?'− ':'')+Math.abs(v).toLocaleString('pt-BR',{minimumFractionDigits:1, maximumFractionDigits:1})+'%</span>';

        // Colunas priorizadas pra tabela caber na largura normal da tela
        // desktop sem precisar rolar pro lado (pedido do usuário). Loja e
        // Imposto continuam disponíveis — só que dentro do detalhe do pedido
        // (clique no ícone de olho), não mais como coluna aqui.
        html += '<div class="table-card"><div class="table-wrap"><table class="data-table compact-orders"><thead><tr>'
          + '<th>Data</th><th>Pedido</th><th>Produto / SKU</th><th>Qtd.</th><th>Venda</th>'
          + '<th>Taxas</th><th>Frete vend.</th><th>Custo</th>'
          + '<th>Margem R$</th><th>Margem %</th><th>Logística</th><th>Status</th><th></th>'
          + '</tr></thead><tbody>'
          + state.items.map(p => '<tr'+(p.cancelado?' style="opacity:.6;"':'')+'>'
            + '<td class="tab-nums">'+fmtDataCell(p.dataCriacao)+'</td>'
            + '<td class="mono">'+escapeHtml(p.mlOrderId)+'</td>'
            + '<td class="produto-cell">'
              + '<div class="cell-stack"><span class="prod-title" title="'+escapeHtml(p.produtoResumo||'—')+'">'+escapeHtml(p.produtoResumo||'—')+(p.qtdItens>3?' +'+(p.qtdItens-3):'')+'</span>'
              + '<span class="cell-stack-sub mono" title="'+escapeHtml(p.skuResumo||'')+'">'+escapeHtml(p.skuResumo||'sem SKU')+'</span></div>'
            + '</td>'
            + '<td class="tab-nums">'+p.qtdUnidades+'</td>'
            + '<td class="mono">'+(money(p.valorTotal,p.moeda)||'<span style="color:var(--text-faint);font-style:italic;">indisp.</span>')+'</td>'
            + '<td class="mono">'+cellMoney(p.tarifasMl,p.moeda,true)+'</td>'
            + '<td class="mono">'+(money(p.freteVendedor,p.moeda)||'<span style="color:var(--text-faint);font-style:italic;">indisp.</span>')+'</td>'
            + '<td class="mono">'+cellMoney(p.custoProduto,p.moeda,true)+'</td>'
            + '<td class="mono" style="'+(p.margemContribuicao!==null?(p.margemContribuicao>=0?'color:var(--success);':'color:var(--danger);'):'')+'">'+(p.calculoCompleto ? money(p.margemContribuicao,p.moeda) : '<span style="color:var(--text-faint);font-style:italic;">pendente</span>')+'</td>'
            + '<td class="mono">'+(p.calculoCompleto ? pctCell(p.margemPercentual) : '<span style="color:var(--text-faint);font-style:italic;">pendente</span>')+'</td>'
            + '<td class="cell-stack-sub" style="white-space:normal;">'+escapeHtml(p.envioLogisticType||'—')+'</td>'
            + '<td><span class="badge-status '+(p.status==='paid'?'on':(p.cancelado?'err':'off'))+'"><span class="dot"></span>'+escapeHtml(p.status||'—')+'</span></td>'
            + '<td><div class="row-actions"><button class="row-ic-btn" data-detail="'+p.id+'" title="Ver detalhes (loja, imposto e mais)" type="button">'+svg('eye')+'</button></div></td>'
          + '</tr>').join('')
          + '</tbody></table></div></div>'
          + (state.totalFiltrado > state.items.length
              ? '<div class="field-hint" style="margin-top:10px;">Mostrando os '+state.items.length+' pedidos mais recentes de '+state.totalFiltrado+' que batem o filtro atual'+(state.totalFiltrado!==state.totalNoPeriodo?' (de '+state.totalNoPeriodo+' no período, antes do filtro de loja/status/produto)':'')+'. O botão "Gerar relatório" exporta todos, não só os mostrados aqui.</div>'
              : '')
          + '<div class="field-hint" style="margin-top:6px;">"Pendente" = falta cadastrar o custo do SKU em <strong>Custos</strong> e/ou o Mercado Livre não retornou alguma tarifa desse pedido ainda — nunca um valor estimado. Pedidos cancelados (linha esmaecida) não entram nos totais de Visão Geral e Financeiro. Loja e imposto do pedido estão no detalhe (ícone de olho).</div>';
      }

      root.innerHTML = html;

      const sel = document.getElementById('pedEmpresaSelect');
      if(sel) sel.addEventListener('change', ()=>{ state.empresaId = Number(sel.value); loadPedidos(); });
      const selPer = document.getElementById('pedPeriodoSelect');
      if(selPer) selPer.addEventListener('change', ()=>{ state.periodo = selPer.value; loadPedidos(); });
      const syncBtn = document.getElementById('pedSyncBtn');
      if(syncBtn) syncBtn.addEventListener('click', async ()=>{
        syncBtn.disabled = true;
        try{
          const conta = await apiContaDaEmpresa(state.empresaId);
          if(!conta){ toast('Conecte o Mercado Livre desta empresa em Marketplaces primeiro.', 'error'); syncBtn.disabled=false; return; }
          const result = await apiMlSync(conta.id);
          toast(result.importados+' pedido(s) importados/atualizados.');
          await loadPedidos();
        }catch(err){ toast(err.message, 'error'); }
        syncBtn.disabled = false;
      });
      const selLoja = document.getElementById('pedLojaSelect');
      if(selLoja) selLoja.addEventListener('change', ()=>{ state.contaId = selLoja.value; loadPedidos(); });
      const selStatus = document.getElementById('pedStatusSelect');
      if(selStatus) selStatus.addEventListener('change', ()=>{ state.status = selStatus.value; loadPedidos(); });
      const busca = document.getElementById('pedBuscaInput');
      if(busca) busca.addEventListener('input', ()=>{
        state.busca = busca.value;
        clearTimeout(busca._t);
        busca._t = setTimeout(loadPedidos, 300);
      });
      function baixarRelatorio(formato){
        const params = queryFiltrosAtuais();
        params.set('formato', formato);
        window.location.href = '/api/pedidos/relatorio?'+params.toString();
      }
      const relXlsxBtn = document.getElementById('pedRelatorioXlsxBtn');
      if(relXlsxBtn) relXlsxBtn.addEventListener('click', ()=> baixarRelatorio('xlsx'));
      const relCsvBtn = document.getElementById('pedRelatorioCsvBtn');
      if(relCsvBtn) relCsvBtn.addEventListener('click', ()=> baixarRelatorio('csv'));
      root.querySelectorAll('[data-detail]').forEach(b=> b.addEventListener('click', ()=> openDetail(b.dataset.detail)));
    }

    async function openDetail(id){
      const modalRoot = document.getElementById('modalRoot');
      modalRoot.innerHTML = '<div class="modal-overlay" id="modalOverlay"><div class="modal-card wide"><div class="table-skel"><span class="spin"></span><span>Carregando pedido…</span></div></div></div>';
      document.getElementById('modalOverlay').addEventListener('click', (e)=>{ if(e.target.id==='modalOverlay') modalRoot.innerHTML=''; });

      let data;
      try{ data = await apiPedidos('/'+id); }
      catch(err){ toast(err.message, 'error'); modalRoot.innerHTML=''; return; }

      const { pedido, itens, resultadoFinanceiro: rf } = data;
      const moeda = pedido.moeda;
      const bdLine = (label, valor, negative) => '<div class="bd-row'+(negative?' neg':'')+'">'
        + '<span class="bd-label">'+label+'</span>'
        + '<span class="bd-value">'+(valor===null ? '<span style="color:var(--text-faint); font-style:italic; font-family:\'Public Sans\',sans-serif; font-weight:500;">indisponível</span>' : (negative?'− ':'')+money(Math.abs(valor),moeda))+'</span>'
        + '</div>';

      const tarifasSideNote = rf.tarifasMl.componentes.filter(c=>c.valor!==null)
        .map(c=> escapeHtml(c.label)+': '+money(c.valor,moeda)).join(' · ');

      const html = '<div class="modal-overlay" id="modalOverlay"><div class="modal-card wide">'
        + '<div class="modal-head"><div class="modal-title">Pedido #'+pedido.mlOrderId+'</div><button class="row-ic-btn" id="modalClose" type="button">'+svg('x')+'</button></div>'
        + '<div class="modal-sub">'+fmtDateTime(pedido.dataCriacao)+' · <span class="badge-status '+(pedido.status==='paid'?'on':'off')+'" style="display:inline-flex;"><span class="dot"></span>'+escapeHtml(pedido.status||'—')+'</span></div>'

        + '<div class="detail-section-title">Pedido</div>'
        + '<div class="detail-grid">'
          + '<div class="dg-item"><div class="dg-label">Loja</div><div class="dg-value'+(pedido.loja?'':' muted')+'">'+(escapeHtml(pedido.loja)||'—')+'</div></div>'
          + '<div class="dg-item"><div class="dg-label">Comprador</div><div class="dg-value">'+escapeHtml(pedido.compradorNickname||'—')+'</div></div>'
          + '<div class="dg-item"><div class="dg-label">ID do pagamento</div><div class="dg-value'+(pedido.mlPaymentId?'':' muted')+'">'+(pedido.mlPaymentId||'indisponível')+'</div></div>'
          + '<div class="dg-item"><div class="dg-label">ID do envio (shipment)</div><div class="dg-value'+(pedido.mlShippingId?'':' muted')+'">'+(pedido.mlShippingId||'sem envio')+'</div></div>'
          + '<div class="dg-item"><div class="dg-label">Modalidade de logística</div><div class="dg-value'+(pedido.envioLogisticType?'':' muted')+'">'+(escapeHtml(pedido.envioLogisticType||pedido.envioLogisticMode)||'indisponível')+'</div></div>'
        + '</div>'

        + '<div class="detail-section-title">Itens</div>'
        + itens.map(it => '<div class="item-row"><div><div class="ir-title">'+escapeHtml(it.titulo||it.mlItemId||'—')+'</div>'
            + '<div class="ir-sku">'+(it.sku?('SKU '+escapeHtml(it.sku)):'sem SKU informado')+' · qtd '+it.quantidade+'</div></div>'
            + '<div class="mono">'+(money(it.valorTotalItem,moeda)||'indisponível')+'</div></div>').join('')

        + '<div class="detail-section-title">Margem de contribuição desta venda</div>'
        + bdLine('Valor da venda', rf.valorVenda, false)
        + (rf.desconto ? bdLine('(−) Desconto (cupom do pagamento)', rf.desconto, true) : '')
        + bdLine('(−) Taxas/comissões Mercado Livre', rf.tarifasMl.total, true)
        + (tarifasSideNote ? '<div class="bd-side-note">'+tarifasSideNote+'</div>' : '')
        + bdLine('(−) Frete do vendedor', rf.freteVendedor, true)
        + bdLine('(−) Imposto configurado ('+rf.imposto.aliquota+'%)', rf.imposto.valor, true)
        + bdLine('(−) Custo do produto', rf.custoProduto, true)
        + '<div class="bd-row total"><span class="bd-label">= Margem de contribuição</span><span class="bd-value '+(rf.resultado===null?'':(rf.resultado>=0?'positive':'negative'))+'">'
          + (rf.resultado===null ? 'Cálculo incompleto' : money(rf.resultado,moeda)) + '</span></div>'
        + (rf.margemPercentual!==null ? '<div class="bd-row"><span class="bd-label">% sobre o valor da venda</span><span class="bd-value '+(rf.margemPercentual>=0?'positive':'negative')+'">'+(rf.margemPercentual<0?'− ':'')+Math.abs(rf.margemPercentual).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'%</span></div>' : '')
        + (rf.pendencias.length ? '<div class="bd-note">'+svg('alertCircle')+'<span>'+rf.pendencias.map(escapeHtml).join('<br>')+'</span></div>' : '')

        + '<div class="detail-section-title">Frete pago pelo comprador (informativo)</div>'
        + bdLine('Frete comprador (receiver.cost)', rf.freteComprador, false)
        + '<div class="bd-side-note">Não entra no cálculo do resultado acima — é o valor pago pelo comprador, separado do custo de frete do vendedor.</div>'

        + '</div></div>';

      modalRoot.innerHTML = html;
      document.getElementById('modalOverlay').addEventListener('click', (e)=>{ if(e.target.id==='modalOverlay') modalRoot.innerHTML=''; });
      document.getElementById('modalClose').addEventListener('click', ()=> modalRoot.innerHTML='');
    }

    window.Pedidos = { load };
  })();

  /* ================= FINANCEIRO — primeira versão (só vendas do Mercado Livre) =================
     Usa /api/relatorios/resumo-vendas — a MESMA fonte que Visão Geral usa e que a
     listagem de Pedidos usa por trás — pro mesmo período nunca aparecer com um
     valor diferente aqui e nas outras duas telas.
     Nesta etapa: só o resultado das vendas do Mercado Livre. Contas a pagar, contas
     a receber, fluxo de caixa, DRE completa, banco, fornecedores e Shopee ficam
     para depois (não fazem parte desta versão). */
  (function(){
    const PERIODOS = [
      { chave:'hoje', label:'Hoje' },
      { chave:'ontem', label:'Ontem' },
      { chave:'7d', label:'Últimos 7 dias' },
      { chave:'30d', label:'Últimos 30 dias' },
      { chave:'mes', label:'Este mês' },
    ];
    const state = { empresas:[], empresaId:null, loadingEmpresas:false, periodo:'30d', loading:false, error:null, data:null };

    function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function money(v, moeda){ return v===null||v===undefined ? null : (moeda==='BRL'||!moeda?'R$ ':moeda+' ') + Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2}); }

    async function apiEmpresasAtivas(){
      const res = await fetch('/api/empresas?status=ativas');
      return ((await res.json()).empresas) || [];
    }
    async function apiResumo(empresaId, periodo){
      const res = await fetch('/api/relatorios/resumo-vendas?empresaId='+empresaId+'&periodo='+periodo);
      let body = null; try{ body = await res.json(); }catch(e){}
      if(!res.ok) throw new Error((body && body.error) || 'Não foi possível carregar o financeiro.');
      return body;
    }

    async function loadResumo(){
      state.loading = true; state.error = null; render();
      try{ state.data = await apiResumo(state.empresaId, state.periodo); }
      catch(err){ state.error = err.message; state.data = null; }
      state.loading = false; render();
    }

    async function load(){
      state.loadingEmpresas = true; render();
      try{
        state.empresas = await apiEmpresasAtivas();
        if(!state.empresaId || !state.empresas.find(e=>e.id===state.empresaId)){
          state.empresaId = state.empresas.length ? state.empresas[0].id : null;
        }
      }catch(e){ state.empresas = []; }
      state.loadingEmpresas = false;
      if(state.empresaId) await loadResumo(); else render();
    }

    function linha(label, obj, moeda, hasOrders, negativo){
      const pendenteTxt = hasOrders ? 'Pendente' : 'Sem dados';
      const valorHtml = obj.valor!==null
        ? (negativo && obj.valor!==0 ? '− ' : '') + money(Math.abs(obj.valor), moeda)
        : '<span style="color:var(--text-faint); font-style:italic; font-family:\'Public Sans\',sans-serif; font-weight:500;">'+pendenteTxt+'</span>';
      const pendNote = obj.valor!==null && obj.pendentes>0
        ? ' <span style="font-size:10.5px; color:var(--text-faint); font-weight:500;">('+obj.pendentes+' pedido(s) sem essa informação)</span>' : '';

          + (r.cancelados.quantidade>0 ? '<div class="bd-row"><span class="bd-label">Valor (informativo — fora do resultado acima)</span><span class="bd-value">'+(r.cancelados.valor!==null?money(r.cancelados.valor,moeda):'indisponível')+'</span></div>' : '')

  /* ================= PRODUTOS — cadastro simples, por empresa =================

  (function(){
    const state = { empresas:[], empresaId:null, loadingEmpresas:false, items:[], loading:false, error:null, status:'todos', search:'',

    function toast(message, type){
      const wrap = document.getElementById('toastWrap');
