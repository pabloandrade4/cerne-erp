        state.atePersonalizado = document.getElementById('dreAte').value || hojeBRT();
        loadDRE();
      });
      const fCategoria = document.getElementById('dreFiltroCategoria');
      if(fCategoria) fCategoria.addEventListener('change', ()=>{ state.categoriaId = fCategoria.value; loadDRE(); });
      const fConta = document.getElementById('dreFiltroConta');
      if(fConta) fConta.addEventListener('change', ()=>{ state.contaBancariaId = fConta.value; loadDRE(); });
      const search = document.getElementById('dreSearch');
      if(search) search.addEventListener('input', ()=>{
        state.search = search.value;
        clearTimeout(search._t);
        search._t = setTimeout(loadDetalhamento, 300);
      });
      const exportTipoSel = document.getElementById('dreExportTipo');
      if(exportTipoSel) exportTipoSel.addEventListener('change', ()=>{ state.exportTipo = exportTipoSel.value; });
      function urlExportar(formato){
        const params = paramsComuns();
        if(state.search.trim()) params.set('search', state.search.trim());
        params.set('tipo', state.exportTipo);
        params.set('formato', formato);
        return '/api/dre/exportar?'+params.toString();
      }
      const exportXlsx = document.getElementById('dreExportXlsx');
      if(exportXlsx) exportXlsx.addEventListener('click', ()=>{ window.location.href = urlExportar('xlsx'); });
      const exportCsv = document.getElementById('dreExportCsv');
      if(exportCsv) exportCsv.addEventListener('click', ()=>{ window.location.href = urlExportar('csv'); });
    }

    window.DRE = { load };
  })();

  /* ================= FATURAMENTO — central dos pedidos a faturar =================
     Ativado em 24/08/2026. NÃO duplica pedido: reaproveita a mesma fonte
     única de pedidos (lib/relatorioVendas.js) e só acrescenta a situação de
     faturamento de cada um (tabela faturamento_pedidos). Sem emissão real
     de NF-e nesta etapa — só o acompanhamento manual, com o fluxo de
     seleção múltipla já preparado. Usa o filtro do header. */
  (function(){
    const STATUS_OPCOES = [
      ['aguardando_faturamento','Aguardando faturamento'],
      ['faturado','Faturado'],
      ['erro','Erro'],
      ['cancelado','Cancelado'],
    ];
    const STATUS_LABEL = Object.fromEntries(STATUS_OPCOES);
    const state = { loading:false, error:null, itens:[], status:'todos', search:'', selecionados:new Set() };

    function toast(message, type){
      const wrap = document.getElementById('toastWrap');
      const el = document.createElement('div');
      el.className = 'toast ' + (type||'success');
      el.innerHTML = svg(type==='error' ? 'alertCircle':'checkCircle') + '<span>'+message+'</span>';
      wrap.appendChild(el);
      setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .25s'; setTimeout(()=>el.remove(),250); }, 3200);
    }
    function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function money(v){ return v===null||v===undefined ? '—' : 'R$ ' + Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2}); }
    function fmtDate(iso){ if(!iso) return '—'; try{ const d=new Date(iso); return d.toLocaleDateString('pt-BR'); }catch(e){ return '—'; } }
    function statusChipStyle(status){
      const cor = status==='faturado' ? 'success' : status==='erro' ? 'danger' : status==='cancelado' ? 'text-muted' : 'warning';
      const bg = status==='cancelado' ? 'var(--surface-2)' : 'var(--'+cor+'-soft)';
      return 'color:var(--'+cor+');background:'+bg+';';
    }

    async function api(path, opts){
      const res = await fetch('/api/faturamento'+path, { headers:{'Content-Type':'application/json'}, ...opts });
      let body = null; try{ body = await res.json(); }catch(e){}
      if(!res.ok){ const err = new Error((body&&(body.error||(body.errors&&body.errors.geral)))||'Falha na requisição.'); err.errors = body&&body.errors; throw err; }
      return body;
    }

    async function loadItens(){
      const filtro = window.CerneFiltro.state;
      if(!filtro.empresaId){ state.itens=[]; state.loading=false; render(); return; }
      state.loading = true; state.error = null; render();
      try{
        const params = new URLSearchParams({ empresaId: filtro.empresaId, periodo: filtro.periodo });
        if(filtro.periodo === 'personalizado'){ if(filtro.desdePersonalizado) params.set('desde', filtro.desdePersonalizado); if(filtro.atePersonalizado) params.set('ate', filtro.atePersonalizado); }
        if(state.status !== 'todos') params.set('status', state.status);
        if(state.search.trim()) params.set('search', state.search.trim());
        const data = await api('?'+params.toString(), { method:'GET' });
        state.itens = data.itens;
        state.selecionados = new Set([...state.selecionados].filter(id => state.itens.some(i=>i.pedidoId===id)));
      }catch(err){ state.error = err.message || 'Não foi possível carregar o faturamento.'; }
      finally{ state.loading = false; render(); }
    }

    function load(){ loadItens(); }

    window.CerneFiltro.onChange(()=>{
      const page = document.getElementById('page-billing');
      if(page && page.classList.contains('active')) loadItens();
      else render();
    });

    async function aplicarStatusLote(status){
      const ids = [...state.selecionados];
      if(!ids.length) return;
      try{
        const result = await api('/lote', { method:'PATCH', body: JSON.stringify({ pedidoIds: ids, status }) });
        toast(result.atualizados.length+' pedido(s) atualizado(s) para "'+STATUS_LABEL[status]+'".'+(result.falharam.length?(' '+result.falharam.length+' falharam.'):''));
        state.selecionados = new Set();
        loadItens();
      }catch(err){ toast(err.message, 'error'); }
    }

    async function aplicarStatusUnico(pedidoId, status){
      try{
        await api('/'+pedidoId+'/situacao', { method:'PATCH', body: JSON.stringify({ status }) });
        toast('Situação atualizada para "'+STATUS_LABEL[status]+'".');
        loadItens();
      }catch(err){ toast(err.message, 'error'); }
    }

    function render(){
      const root = document.getElementById('faturamentoRoot');
      if(!root) return;
      const filtro = window.CerneFiltro.state;

      if(!filtro.loadingEmpresas && !filtro.empresas.length){
        root.innerHTML = '<div class="empty-panel"><div class="empty-icon">'+svg('building')+'</div>'
          + '<h2>Nenhuma empresa ativa</h2>'
          + '<p class="lead">Cadastre e ative uma empresa em <strong>Cadastros → Empresas</strong> para ver o faturamento aqui.</p></div>';
        return;
      }

      let html = '<div class="field-hint" style="margin-bottom:12px;max-width:760px;">Central dos pedidos que precisam ser faturados. Nesta etapa não há emissão real de NF-e — a situação de faturamento é controlada manualmente, preparando o fluxo para quando a emissão fiscal for ligada.</div>';

      html += '<div class="toolbar">'
        + '<div class="seg" id="fatSeg">'
          + [['todos','Todos']].concat(STATUS_OPCOES).map(function(par){ return '<button data-status="'+par[0]+'" class="'+(state.status===par[0]?'active':'')+'">'+par[1]+'</button>'; }).join('')
        + '</div>'
        + '<div class="search-box">'+svg('search')+'<input type="text" id="fatSearch" placeholder="Buscar por pedido, loja ou cliente" value="'+state.search.replace(/"/g,'&quot;')+'"></div>'
      + '</div>';

      if(state.selecionados.size > 0){
        html += '<div class="toolbar" style="margin-top:0;"><span style="font-size:12.5px;color:var(--text-muted);font-weight:600;">'+state.selecionados.size+' selecionado(s):</span>'
          + '<button class="ghost-btn" data-lote="faturado" style="cursor:pointer;opacity:1;">'+svg('checkCircle')+'<span>Marcar como Faturado</span></button>'
          + '<button class="ghost-btn" data-lote="erro" style="cursor:pointer;opacity:1;">'+svg('alertCircle')+'<span>Marcar como Erro</span></button>'
          + '<button class="ghost-btn" data-lote="cancelado" style="cursor:pointer;opacity:1;">'+svg('x')+'<span>Marcar como Cancelado</span></button>'
        + '</div>';
      }

      if(state.loading || filtro.loadingEmpresas){
        html += '<div class="table-card"><div class="table-skel"><span class="spin"></span><span>Carregando pedidos…</span></div></div>';
      } else if(state.error){
        html += '<div class="empty-panel"><div class="empty-icon" style="color:var(--danger); background:var(--danger-soft);">'+svg('alertCircle')+'</div>'
          + '<h2 style="color:var(--danger);">Não foi possível carregar</h2><p class="lead">'+escapeHtml(state.error)+'</p></div>';
      } else if(!state.itens.length){
        html += '<div class="empty-panel"><div class="empty-icon">'+svg('receipt')+'</div>'
          + '<h2>Nenhum pedido encontrado</h2>'
          + '<p class="lead">Nenhum pedido corresponde ao filtro atual no período selecionado.</p></div>';
      } else {
        const todosSelecionados = state.itens.length>0 && state.itens.every(i=>state.selecionados.has(i.pedidoId));
        html += '<div class="table-card"><div class="table-wrap"><table class="data-table"><thead><tr>'
          + '<th><input type="checkbox" id="fatSelectAll" '+(todosSelecionados?'checked':'')+'></th>'
          + '<th>Data</th><th>Pedido</th><th>Marketplace</th><th>Loja</th><th>Cliente</th><th>Valor</th><th>Status do pedido</th><th>Faturamento</th><th></th>'
          + '</tr></thead><tbody>'
          + state.itens.map(i => '<tr'+(i.pedidoCancelado?' style="opacity:.6;"':'')+'>'
            + '<td><input type="checkbox" data-sel="'+i.pedidoId+'" '+(state.selecionados.has(i.pedidoId)?'checked':'')+'></td>'
            + '<td class="tab-nums">'+fmtDate(i.data)+'</td>'
            + '<td class="mono">'+escapeHtml(i.mlOrderId)+'</td>'
            + '<td>'+escapeHtml(i.marketplace)+'</td>'
            + '<td>'+escapeHtml(i.loja||'—')+'</td>'
            + '<td>'+escapeHtml(i.cliente||'—')+'</td>'
            + '<td class="mono">'+money(i.valor)+'</td>'
            + '<td>'+escapeHtml(i.statusPedido||'—')+'</td>'
            + '<td><span class="status-chip" style="'+statusChipStyle(i.situacaoFaturamento)+'">'+STATUS_LABEL[i.situacaoFaturamento]+'</span></td>'
            + '<td><select data-change="'+i.pedidoId+'" style="font-size:12px;padding:4px 6px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);">'
              + STATUS_OPCOES.map(function(par){ return '<option value="'+par[0]+'" '+(i.situacaoFaturamento===par[0]?'selected':'')+'>'+par[1]+'</option>'; }).join('')
            + '</select></td>'
          + '</tr>').join('')
          + '</tbody></table></div></div>';
      }

          + ['<button data-prioridade="todas" class="'+(state.prioridade==='todas'?'active':'')+'">Todas ('+totalPrioridade+')</button>']
            .concat(PRIORIDADE_OPCOES.map(function(par){ return '<button data-prioridade="'+par[0]+'" class="'+(state.prioridade===par[0]?'active':'')+'">'+par[1]+' ('+(cp[par[0]]||0)+')</button>'; }))
          .join('')
        + '</div>'
        + '<div class="seg" id="alStatusSeg">'
          + ['<button data-status="todos" class="'+(state.status==='todos'?'active':'')+'">Todos</button>']
            .concat(STATUS_OPCOES.map(function(par){ return '<button data-status="'+par[0]+'" class="'+(state.status===par[0]?'active':'')+'">'+par[1]+' ('+(cs[par[0]]||0)+')</button>'; }))
          .join('')
        + '</div>'
      + '</div>';

      if(state.loading || filtro.loadingEmpresas){
        html += '<div class="table-card"><div class="table-skel"><span class="spin"></span><span>Carregando alertas…</span></div></div>';
      } else if(state.error){
        html += '<div class="empty-panel"><div class="empty-icon" style="color:var(--danger); background:var(--danger-soft);">'+svg('alertCircle')+'</div>'
          + '<h2 style="color:var(--danger);">Não foi possível carregar</h2><p class="lead">'+escapeHtml(state.error)+'</p></div>';
      } else if(!state.itens.length){
        html += '<div class="empty-panel"><div class="empty-icon">'+svg('sparkle')+'</div>'
          + '<h2>Nenhum alerta encontrado</h2>'
          + '<p class="lead">Nenhum alerta corresponde ao filtro atual. O Radar da IA continua acompanhando esta empresa em segundo plano.</p></div>';
      } else {
        html += '<div class="table-card"><div class="table-wrap"><table class="data-table"><thead><tr>'
          + '<th>Data</th><th>Categoria</th><th>Problema</th><th>Valor envolvido</th><th>Recomendação</th><th>Status</th><th></th>'
          + '</tr></thead><tbody>'
          + state.itens.map(a => {
              const corPrioridade = PRIORIDADE_COR[a.prioridade] || 'teal';
              const acoes = [];
              if(a.statusCentral === 'novo') acoes.push('<button class="row-ic-btn" data-acao="visualizar" data-id="'+a.id+'" title="Marcar como visualizado" type="button">'+svg('eye')+'</button>');
              if(a.statusCentral !== 'resolvido') acoes.push('<button class="row-ic-btn" data-acao="resolver" data-id="'+a.id+'" title="Marcar como resolvido" type="button">'+svg('checkCircle')+'</button>');
              if(a.statusCentral !== 'ignorado' && a.statusCentral !== 'resolvido') acoes.push('<button class="row-ic-btn" data-acao="ignorar" data-id="'+a.id+'" title="Ignorar" type="button">'+svg('x')+'</button>');
              if(a.statusCentral === 'ignorado' || a.statusCentral === 'resolvido') acoes.push('<button class="row-ic-btn" data-acao="reabrir" data-id="'+a.id+'" title="Reabrir" type="button">'+svg('refreshCw')+'</button>');
              if(a.pagina) acoes.push('<button class="row-ic-btn" data-ir-pagina="'+escapeHtml(a.pagina)+'" title="Abrir tela relacionada" type="button">'+svg('logOut')+'</button>');
              return '<tr>'
                + '<td class="tab-nums" style="white-space:nowrap;">'+fmtDateTime(a.criadoEm)+'</td>'
                + '<td><span class="status-chip" style="color:var(--'+corPrioridade+');background:var(--'+corPrioridade+'-soft);">'+escapeHtml(a.prioridadeLabel)+'</span><div style="font-size:11px;color:var(--text-faint);margin-top:4px;">'+escapeHtml(categoriaLabel(a.categoria))+'</div></td>'
                + '<td><div style="font-weight:600;">'+escapeHtml(a.titulo)+'</div><div style="font-size:12px;color:var(--text-faint);max-width:340px;">'+escapeHtml(a.descricao||'')+'</div></td>'
                + '<td class="mono">'+(a.valorEnvolvido!=null ? money(a.valorEnvolvido) : '<span class="dash">—</span>')+'</td>'
                + '<td style="max-width:280px;font-size:12px;">'+escapeHtml(a.recomendacao||'—')+'</td>'
                + '<td><span class="status-chip" style="'+statusChipStyle(a.statusCentral)+'">'+escapeHtml(a.statusCentralLabel)+'</span></td>'
                + '<td><div class="row-actions">'+acoes.join('')+'</div></td>'
              + '</tr>';
            }).join('')
          + '</tbody></table></div></div>';
      }

      root.innerHTML = html;

      const prioSeg = document.getElementById('alPrioridadeSeg');
      if(prioSeg) prioSeg.querySelectorAll('button').forEach(b=> b.addEventListener('click', ()=>{ state.prioridade = b.dataset.prioridade; loadItens(); }));
      const statusSeg = document.getElementById('alStatusSeg');
      if(statusSeg) statusSeg.querySelectorAll('button').forEach(b=> b.addEventListener('click', ()=>{ state.status = b.dataset.status; loadItens(); }));
      root.querySelectorAll('[data-acao]').forEach(b=> b.addEventListener('click', ()=> acao(Number(b.dataset.id), b.dataset.acao)));
      root.querySelectorAll('[data-ir-pagina]').forEach(b=> b.addEventListener('click', ()=> navigate(b.dataset.irPagina)));
    }

    window.Alertas = { load };
  })();

  /* ================= ADS — Product Ads real do Mercado Livre =================
     Ativado em 25/08/2026, corrigido em 25/08/2026 (ver docs/04-alteracoes.md).
     Duas fontes bem separadas (ver lib/ads.js): investimento/vendas
     atribuídas/receita atribuída vêm SEMPRE da API de Advertising do
     Mercado Livre (nunca calculados aqui); faturamento real/margem "antes
     do Ads" vêm da MESMA fonte única de Pedidos/DRE/Financeiro
     (lib/relatorioVendas.js). Nunca inventa valor: quando a API de Ads não
     está disponível pra uma conta, os campos aparecem como "Pendente de
     sincronização" — nunca um número estimado. Empresa e período vêm do
     filtro do header (window.CerneFiltro); loja é um filtro só desta tela.

     IMPORTANTE: a API de Advertising do Mercado Livre não identifica quais
     PEDIDOS pertencem à publicidade — só devolve totais agregados por
     anúncio/dia. Por isso a tabela por anúncio é dividida em DUAS visões
     separadas, nunca misturadas numa só: "Performance atribuída Mercado
     Ads" (só o que o Mercado Livre atribui) e "Resultado real do SKU após
     Ads" (todas as vendas reais daquele SKU, que podem incluir venda
     orgânica, menos o investimento em Ads). */
  (function(){
    const state = { loading:false, error:null, data:null, contaId:'', sort:'faturamento', sincronizando:false, salvandoMargemMinima:false };

    function toast(message, type){
      const wrap = document.getElementById('toastWrap');
      const el = document.createElement('div');
      el.className = 'toast ' + (type||'success');
      el.innerHTML = svg(type==='error' ? 'alertCircle':'checkCircle') + '<span>'+message+'</span>';
      wrap.appendChild(el);
      setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .25s'; setTimeout(()=>el.remove(),250); }, 3200);
    }
    function fmtDateTime(iso){ if(!iso) return null; try{ return new Date(iso).toLocaleString('pt-BR'); }catch(e){ return null; } }
    function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function money(v){ return v===null||v===undefined ? null : 'R$ ' + Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2}); }
    function pendenteSync(){ return '<span style="color:var(--text-faint);font-style:italic;" title="Este dado depende da API de Publicidade do Mercado Livre, que ainda não retornou (ou a conta não tem acesso a Product Ads).">Pendente de sincronização</span>'; }
    function pendenteCusto(){ return '<span style="color:var(--text-faint);font-style:italic;" title="Falta cadastrar o custo de algum SKU deste anúncio em Produtos.">pendente</span>'; }
    function moneyOrPend(v){ return v===null||v===undefined ? pendenteSync() : money(v); }
    function roasFmt(v){ return v===null||v===undefined ? pendenteSync() : Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2})+'x'; }
    function pctFmt(v){ return v===null||v===undefined ? pendenteSync() : Number(v).toLocaleString('pt-BR',{minimumFractionDigits:1, maximumFractionDigits:1})+'%'; }
    function intFmt(v){ return v===null||v===undefined ? pendenteSync() : Number(v).toLocaleString('pt-BR'); }
    function fmtDiaCurto(diaISO){ const [, m, d] = diaISO.split('-'); return d+'/'+m; }

    async function apiAds(empresaId, periodo, contaId, desde, ate){
      const params = new URLSearchParams({ empresaId, periodo });
      if(contaId) params.set('contaId', contaId);
      if(periodo === 'personalizado'){ if(desde) params.set('desde', desde); if(ate) params.set('ate', ate); }
      const res = await fetch('/api/ads?'+params.toString());
      let body = null; try{ body = await res.json(); }catch(e){}
      if(!res.ok) throw new Error((body && body.error) || 'Não foi possível carregar os dados de Ads.');
      return body;
    }

    // ---- IA de Ads e Performance — config da margem mínima (mesmo padrão de
    // GET/PUT /api/promocoes/config) — o valor atual vem sempre junto da
    // resposta de /api/ads (campo margemMinimaPct), então só precisamos do
    // PUT aqui pra salvar; depois de salvar recarregamos /api/ads pra
    // reclassificar tudo (anúncio e campanha) com o novo mínimo. ----
    async function apiSalvarMargemMinimaAds(empresaId, margemMinimaPct){
      const res = await fetch('/api/ads/config-ia', { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ empresaId, margemMinimaPct }) });
      let body = null; try{ body = await res.json(); }catch(e){}
      if(!res.ok) throw new Error((body && (body.error||(body.errors&&JSON.stringify(body.errors)))) || 'Falha ao salvar a margem mínima.');
      return body;
    }

    async function salvarMargemMinima(valorStr){
      const filtro = window.CerneFiltro.state;
      const valor = Number(valorStr);
      if(!Number.isFinite(valor) || valor < 0 || valor > 100){
        toast('Informe um percentual entre 0 e 100.', 'error'); return;
      }
      state.salvandoMargemMinima = true; render();
      try{
        await apiSalvarMargemMinimaAds(filtro.empresaId, valor);
        toast('Margem mínima da IA de Ads atualizada.');
        await loadAds();
      }catch(err){
        toast(err.message || 'Falha ao salvar a margem mínima.', 'error');
      }finally{
        state.salvandoMargemMinima = false; render();
      }
    }

    async function apiSincronizarAds(){
      const res = await fetch('/api/ads/sincronizar', { method:'POST' });
      const body = await res.json().catch(()=>null);
      if(!res.ok) throw new Error((body && body.error) || 'Falha ao sincronizar Ads.');
      return body;
    }

    async function sincronizarAgora(){
      state.sincronizando = true; render();
      try{
        await apiSincronizarAds();
        toast('Sincronização de Ads concluída.');
        await loadAds();
      }catch(err){
        toast(err.message || 'Falha ao sincronizar Ads.', 'error');
      }finally{
        state.sincronizando = false; render();
      }
    }

    async function loadAds(){
      const filtro = window.CerneFiltro.state;
      if(!filtro.empresaId){ state.data = null; state.loading = false; render(); return; }
      state.loading = true; state.error = null; render();
      try{ state.data = await apiAds(filtro.empresaId, filtro.periodo, state.contaId, filtro.desdePersonalizado, filtro.atePersonalizado); }
      catch(err){ state.error = err.message; state.data = null; }
      state.loading = false; render();
    }

    function load(){ loadAds(); }

    window.CerneFiltro.onChange(()=>{
      const page = document.getElementById('page-ads');
      if(page && page.classList.contains('active')) loadAds();
      else render();
    });

    // ---- Cards de topo (Gasto hoje / Gasto no mês / Receita atribuída / ROAS / ACOS) ----
    function tintVars(tint){
      return tint === 'muted' ? '--tint:var(--text-muted);--tint-soft:var(--surface-2);' : '--tint:var(--'+tint+');--tint-soft:var(--'+tint+'-soft);';
    }
    function cardHTML(k){
      return '<div class="kpi-hero" style="'+tintVars(k.tint)+'">'
        + '<div class="kpi-hero-top"><div class="kpi-hero-icon">'+svg(k.icon)+'</div></div>'
        + '<div class="kpi-hero-label">'+escapeHtml(k.label)+'</div>'
        + '<div class="kpi-hero-value">'+k.valueHtml+'</div>'
        + '<div class="kpi-hero-foot"><span class="kpi-hero-note">'+escapeHtml(k.note)+'</span></div>'
      + '</div>';
    }
    function cardsHTML(cards){
      const items = [
        { label:'Gasto hoje', icon:'clock', tint:'copper', valueHtml: moneyOrPend(cards.gastoHoje), note:'Investimento real em Ads hoje (horário de Brasília)' },
        { label:'Gasto no mês', icon:'wallet', tint:'copper', valueHtml: moneyOrPend(cards.gastoMes), note:'Acumulado do dia 1 do mês até hoje' },
        { label:'Receita atribuída aos Ads', icon:'barChart', tint:'teal', valueHtml: moneyOrPend(cards.receitaAtribuidaPeriodo), note:'Vendas atribuídas pelo Mercado Livre no período selecionado' },
        { label:'ROAS', icon:'activity', tint: cards.roasPeriodo===null||cards.roasPeriodo===undefined ? 'muted' : (cards.roasPeriodo>=1?'success':'danger'), valueHtml: roasFmt(cards.roasPeriodo), note:'Receita atribuída ÷ investimento, no período' },
        { label:'ACOS', icon:'percent', tint:'muted', valueHtml: pctFmt(cards.acosPeriodo), note:'Investimento ÷ receita atribuída, no período' },
      ];
      return '<div class="kpi-hero-grid">' + items.map(cardHTML).join('') + '</div>'
        + (cards.parcial ? '<div class="field-hint" style="margin-top:8px;">Um ou mais desses números está somando só as lojas com sincronização de Ads disponível no momento — ver aviso acima.</div>' : '');
    }

    // ---- Gráfico diário: Investimento Ads x Receita atribuída (SVG simples, mesmo desenho de Visão Geral) ----
    function chartAdsHTML(diario){
      if(!diario || !diario.length){
        return '<div class="chart-canvas h-lg">' + chartGridLines(4)
          + chartEmptyState('lineChart', 'Sem série diária de Ads disponível para este período (a API de Publicidade pode não ter retornado dado, ou nenhuma conta tem acesso a Product Ads).')
        + '</div>';
      }
      const n = diario.length;
      const W = Math.max(n*10, 10), H = 100, topPad = 8, botPad = 10;
      const usable = H - topPad - botPad;
      const vals = diario.flatMap(d => [d.investimento||0, d.receitaAtribuida||0]);
      const maxV = Math.max(0, ...vals);
      const minV = Math.min(0, ...vals);
      const range = (maxV - minV) || 1;
      const yFor = v => topPad + usable * (1 - (v - minV) / range);
      const baseY = yFor(0);

      const barW = 6;
      let bars = '';
      let points = [];
      diario.forEach((d, i) => {
        const cx = i*10 + 5;
        const invest = d.investimento || 0;
        const y1 = yFor(invest);
        const barY = Math.min(y1, baseY), barH = Math.max(Math.abs(y1-baseY), 0.6);
        const dataLabel = fmtDiaCurto(d.data)+' — Investimento: '+(d.investimento===null?'pendente':money(d.investimento))+' · Receita atribuída: '+(d.receitaAtribuida===null?'pendente':money(d.receitaAtribuida));
        bars += '<rect x="'+(cx-barW/2)+'" y="'+barY+'" width="'+barW+'" height="'+barH+'" rx="1" fill="var(--copper)" fill-opacity="0.85"><title>'+escapeHtml(dataLabel)+'</title></rect>';
        points.push(cx+','+yFor(d.receitaAtribuida||0));
      });
      const line = '<polyline points="'+points.join(' ')+'" fill="none" stroke="var(--teal)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>';
      const dots = diario.map((d,i) => {
        const cx = i*10+5, cy = yFor(d.receitaAtribuida||0);
        const dataLabel = fmtDiaCurto(d.data)+' — Receita atribuída: '+(d.receitaAtribuida===null?'pendente':money(d.receitaAtribuida));
        return '<circle cx="'+cx+'" cy="'+cy+'" r="1.6" fill="var(--teal)" vector-effect="non-scaling-stroke"><title>'+escapeHtml(dataLabel)+'</title></circle>';
      }).join('');
      const baseline = '<line x1="0" y1="'+baseY+'" x2="'+W+'" y2="'+baseY+'" stroke="var(--border-strong)" stroke-width="1" vector-effect="non-scaling-stroke"/>';

      const labelStep = Math.max(1, Math.ceil(n/9));
      const labels = diario.map((d,i) => '<span>'+((i%labelStep===0 || i===n-1) ? escapeHtml(fmtDiaCurto(d.data)) : '')+'</span>').join('');

      return '<div class="chart-canvas" style="position:relative;height:200px;padding:0;">'
        + '<svg class="simple-chart-svg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="height:100%;">'
          + baseline + bars + line + dots
        + '</svg>'
      + '</div>'
      + '<div class="simple-chart-xlabels" style="grid-template-columns:repeat('+n+',1fr);">' + labels + '</div>';
    }
    function chartAdsCardHTML(data){
      return '<div class="chart-card" style="margin-bottom:14px;">'
        + '<div class="chart-card-head">'
          + '<div class="panel-title"><span class="panel-title-ic">'+svg('lineChart')+'</span>Investimento Ads x Receita atribuída</div>'
          + '<div class="chart-legend">'
            + '<span class="legend-item"><span class="legend-dot" style="background:var(--copper)"></span>Investimento</span>'
            + '<span class="legend-item"><span class="legend-dot" style="background:var(--teal)"></span>Receita atribuída</span>'
            + '<span class="panel-note">'+(data.periodo?escapeHtml(data.periodo.label):'')+'</span>'
          + '</div>'
        + '</div>'
        + chartAdsHTML(data.diario)
      + '</div>';
    }

    // ---- Ordenação da tabela por anúncio (aplicada às duas visões, pra manter a mesma ordem nas duas) ----
    function valOr(l, campo, seAusente){ const v = l[campo]; return v===null||v===undefined ? seAusente : v; }
    function comparadorDe(sort){
      if(sort==='lucro') return (a,b)=> valOr(b,'margemDepoisDoAds',-Infinity) - valOr(a,'margemDepoisDoAds',-Infinity);
      if(sort==='prejuizo') return (a,b)=> valOr(a,'margemDepoisDoAds',Infinity) - valOr(b,'margemDepoisDoAds',Infinity);
      if(sort==='gastoAds') return (a,b)=> valOr(b,'investimento',-Infinity) - valOr(a,'investimento',-Infinity);
      if(sort==='roas') return (a,b)=> valOr(b,'roas',-Infinity) - valOr(a,'roas',-Infinity);
      if(sort==='acos') return (a,b)=> valOr(b,'acos',-Infinity) - valOr(a,'acos',-Infinity); // maior ACOS = pior
      return (a,b)=> (b.faturamentoReal||0) - (a.faturamentoReal||0); // 'faturamento' (padrão)
    }
    const OPCOES_ORDENACAO = [
      { valor:'faturamento', label:'Maior faturamento' },
      { valor:'lucro', label:'Mais lucrativos' },
      { valor:'prejuizo', label:'Maior prejuízo' },
      { valor:'gastoAds', label:'Maior gasto em Ads' },
      { valor:'roas', label:'Melhor ROAS' },
      { valor:'acos', label:'Pior ACOS' },
    ];

    function anuncioCellHTML(l){
      return '<td class="produto-cell"><div class="cell-stack"><span class="prod-title" title="'+escapeHtml(l.anuncio||'—')+'">'+escapeHtml(l.anuncio||'(sem título)')+'</span>'
        + '<span class="cell-stack-sub mono">'+escapeHtml(l.sku||'sem SKU')+'</span></div></td>';
    }

    // ---- Visão 1: Performance atribuída Mercado Ads — só o que a API atribui diretamente ----
    function tabelaAtribuidaHTML(linhas){
      return '<div class="table-card"><div class="table-wrap"><table class="data-table"><thead><tr>'
        + '<th>Anúncio / SKU</th><th>Loja</th><th>Campanha</th><th>Investimento</th><th>Cliques</th><th>Impressões</th><th>CPC</th>'
        + '<th>Vendas atrib. (qtd)</th><th>Receita atribuída</th><th>ROAS</th><th>ACOS</th>'
        + '</tr></thead><tbody>'
        + linhas.map(l => '<tr>'
          + anuncioCellHTML(l)
          + '<td>'+escapeHtml(l.loja||'—')+'</td>'
          + '<td>'+(l.campanha ? escapeHtml(l.campanha) : '<span style="color:var(--text-faint);">—</span>')+'</td>'
          + '<td class="mono">'+moneyOrPend(l.investimento)+'</td>'
          + '<td class="mono">'+intFmt(l.cliques)+'</td>'
          + '<td class="mono">'+intFmt(l.impressoes)+'</td>'
          + '<td class="mono">'+moneyOrPend(l.cpc)+'</td>'
          + '<td class="mono">'+intFmt(l.qtdVendasAtribuidas)+'</td>'
          + '<td class="mono">'+moneyOrPend(l.faturamentoAtribuido)+'</td>'
          + '<td class="mono">'+roasFmt(l.roas)+'</td>'
          + '<td class="mono">'+pctFmt(l.acos)+'</td>'
        + '</tr>').join('')
        + '</tbody></table></div></div>';
    }

    // ---- IA de Ads e Performance — Fase A (14/09/2026): classificação em 5
    // níveis (mesmo espírito de badgeClassificacaoHTML da IA de Promoções),
    // substituindo o antigo status binário Lucrativo/Prejuízo. O backend
    // (lib/ia/adsMotor.js) já manda classificacaoCodigo/Label/Emoji prontos
    // pra cada anúncio e pra cada campanha — o front nunca decide sozinho. ----
    const CLASSIFICACAO_COR_ADS = {
      pausar:'var(--danger)', ajustar:'var(--warning)', manter:'var(--success)',
      escalar:'var(--copper)', dados_insuficientes:'var(--text-faint)',
    };
    function classificacaoBadgeHTML(l){
      const cor = CLASSIFICACAO_COR_ADS[l.classificacaoCodigo] || 'var(--text-faint)';
      const titulo = l.classificacaoCodigo==='dados_insuficientes'
        ? 'Falta custo do produto ou métrica de Ads ainda não sincronizada.'
        : '';
      return '<span style="display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:12.5px;color:'+cor+';white-space:nowrap;" title="'+escapeHtml(titulo)+'">'
        + (l.classificacaoEmoji||'')+' '+escapeHtml(l.classificacaoLabel||'—')
      + '</span>';
    }

    // ---- Resumo por Campanha — pedido explícito do usuário ("identificar
    // campanhas boas e ruins"): soma (nunca recalcula) os mesmos números
    // reais de cada anúncio, agrupado por campanha (lib/ia/adsMotor.js). ----
    function tabelaCampanhasHTML(campanhas){
      if(!campanhas || !campanhas.length){
        return '<div class="field-hint" style="margin-bottom:8px;">Nenhum anúncio com campanha de Ads identificada neste período (vendas 100% orgânicas não entram neste resumo).</div>';
      }
      return '<div class="table-card"><div class="table-wrap"><table class="data-table"><thead><tr>'

        + '<th>ROAS</th><th>TACOS</th><th>Margem após Ads (%)</th><th>Classificação da IA</th>'
        + '</tr></thead><tbody>'
        + campanhas.map(c => '<tr>'
          + '<td>'+escapeHtml(c.campanha||'—')+'</td>'
          + '<td>'+escapeHtml(c.loja||'—')+'</td>'
          + '<td class="mono">'+intFmt(c.qtdAnuncios)+'</td>'
          + '<td class="mono">'+moneyOrPend(c.investimento)+'</td>'
          + '<td class="mono">'+moneyOrPend(c.faturamentoReal)+'</td>'
          + '<td class="mono">'+roasFmt(c.roas)+'</td>'
          + '<td class="mono">'+pctFmt(c.tacos)+'</td>'
          + '<td class="mono" style="'+(c.margemDepoisDoAdsPct!==null && c.margemDepoisDoAdsPct!==undefined?(c.margemDepoisDoAdsPct>=0?'color:var(--success);':'color:var(--danger);'):'')+'">'+pctFmt(c.margemDepoisDoAdsPct)+'</td>'
          + '<td>'+classificacaoBadgeHTML(c)+'</td>'
        + '</tr>').join('')
        + '</tbody></table></div></div>';

    // ---- Visão 2: Resultado real do SKU após Ads — todas as vendas reais do SKU (pode incluir orgânica) menos o investimento em Ads ----
    function tabelaResultadoRealHTML(linhas){
      return '<div class="table-card"><div class="table-wrap"><table class="data-table"><thead><tr>'
        + '<th>Anúncio / SKU</th><th>Loja</th><th>Faturamento real (todas as vendas)</th><th>Gasto Ads</th><th>TACOS</th>'
        + '<th>Margem antes do Ads</th><th>Resultado após Ads</th><th>Margem após Ads (%)</th><th>Classificação da IA</th>'
        + '</tr></thead><tbody>'
        + linhas.map(l => '<tr>'
          + anuncioCellHTML(l)
          + '<td>'+escapeHtml(l.loja||'—')+'</td>'
          + '<td class="mono">'+(l.semVendaReal ? '<span style="color:var(--text-faint);">sem venda no período</span>' : money(l.faturamentoReal))+'</td>'
          + '<td class="mono">'+moneyOrPend(l.custoAds)+'</td>'
          + '<td class="mono">'+pctFmt(l.tacos)+'</td>'
          + '<td class="mono">'+(l.semVendaReal ? '<span style="color:var(--text-faint);">—</span>' : (l.margemAntesDoAds===null ? pendenteCusto() : money(l.margemAntesDoAds)))+'</td>'
          + '<td class="mono" style="'+(l.margemDepoisDoAds!==null && l.margemDepoisDoAds!==undefined?(l.margemDepoisDoAds>=0?'color:var(--success);':'color:var(--danger);'):'')+'">'+(l.margemDepoisDoAds===null||l.margemDepoisDoAds===undefined ? (l.semMetricasAds ? pendenteSync() : pendenteCusto()) : money(l.margemDepoisDoAds))+'</td>'
          + '<td class="mono">'+pctFmt(l.margemDepoisDoAdsPct)+'</td>'
          + '<td>'+classificacaoBadgeHTML(l)+'</td>'

        + '</tbody></table></div></div>';
    }

    function render(){
      const root = document.getElementById('adsRoot');
      if(!root) return;
      const filtro = window.CerneFiltro.state;

      if(!filtro.loadingEmpresas && !filtro.empresas.length){
        root.innerHTML = '<div class="empty-panel"><div class="empty-icon">'+svg('building')+'</div>'
          + '<h2>Nenhuma empresa ativa</h2>'

      }

      let html = '<div class="field-hint" style="margin-bottom:12px;max-width:900px;">Investimento, cliques, impressões, CPC, vendas/receita atribuída, ROAS e ACOS vêm direto da API de Publicidade (Product Ads) do Mercado Livre — nunca um valor estimado pelo ERP. A API do Mercado Livre não informa quais pedidos pertencem à publicidade, só totais agregados — por isso as tabelas abaixo mostram duas visões SEPARADAS, nunca misturadas: <strong>Performance atribuída Mercado Ads</strong> (só o que a API atribui) e <strong>Resultado real do SKU após Ads</strong> (todas as vendas reais daquele SKU/anúncio, que podem incluir venda orgânica, menos o investimento em Ads).</div>';

            + '<div class="empresa-picker" style="margin-bottom:0;"><select id="adsLojaSelect">'
              + '<option value="">Todas as lojas</option>'
              + state.data.lojas.map(l=>'<option value="'+l.id+'" '+(String(l.id)===String(state.contaId)?'selected':'')+'>'+escapeHtml(l.nickname||('Conta '+l.id))+'</option>').join('')
            + '</select></div>'
            + '<div class="empresa-picker" style="margin-bottom:0;"><select id="adsSortSelect">'
              + OPCOES_ORDENACAO.map(o=>'<option value="'+o.valor+'" '+(o.valor===state.sort?'selected':'')+'>Ordenar por: '+escapeHtml(o.label)+'</option>').join('')
            + '</select></div>'
            + '<button class="primary-btn enabled" id="btnSincronizarAds" type="button" '+(state.sincronizando?'disabled':'')+'>'+svg('refreshCw')+'<span>'+(state.sincronizando?'Sincronizando…':'Sincronizar agora')+'</span></button>'
            + '<div style="display:flex;align-items:center;gap:6px;" title="Abaixo deste percentual de margem após Ads, a IA classifica o anúncio/campanha como AJUSTAR ou PAUSAR.">'
              + '<label for="adsMargemMinimaInput" class="field-hint" style="margin:0;white-space:nowrap;">Margem mínima da IA (%)</label>'
              + '<input type="number" id="adsMargemMinimaInput" min="0" max="100" step="0.1" value="'+escapeHtml(String(state.data.margemMinimaPct!==undefined && state.data.margemMinimaPct!==null ? state.data.margemMinimaPct : 10))+'" style="width:70px;">'
              + '<button class="ghost-btn" id="adsSalvarMargemMinima" type="button" style="cursor:pointer;opacity:1;" '+(state.salvandoMargemMinima?'disabled':'')+'>'+svg('check')+'<span>'+(state.salvandoMargemMinima?'Salvando…':'Salvar')+'</span></button>'
            + '</div>'
          + '</div>'
          + (state.data.sincronizacaoAutomatica ? '<span class="panel-note" style="font-size:12px;">Sincronização automática em segundo plano'+(state.data.sincronizacaoAutomatica.ultimaExecucaoEm ? (' — última execução: '+escapeHtml(fmtDateTime(state.data.sincronizacaoAutomatica.ultimaExecucaoEm))) : ' ainda não rodou um ciclo completo')+'.</span>' : '')
        + '</div>';

        if(state.data.situacaoPorConta && state.data.situacaoPorConta.some(s=>!s.disponivel)){
          html += '<div class="table-card" style="padding:12px 16px;margin-bottom:14px;border-left:3px solid var(--warning);">'
            + state.data.situacaoPorConta.filter(s=>!s.disponivel).map(s=>
              '<div style="font-size:12.5px;color:var(--text-muted);display:flex;gap:8px;align-items:flex-start;margin:4px 0;">'
                + '<span style="color:var(--warning);flex-shrink:0;">'+svg('alertCircle')+'</span>'

      if(state.loading || filtro.loadingEmpresas){
        html += '<div class="table-card"><div class="table-skel"><span class="spin"></span><span>Carregando Ads…</span></div></div>';

      } else if(state.data && state.data.semConta){
        html += '<div class="empty-panel"><div class="empty-icon">'+svg('store')+'</div>'

          + '<p class="lead">Conecte uma conta do Mercado Livre em <strong>Marketplaces</strong> para ver Ads aqui.</p></div>';
      } else if(state.data && !state.data.linhas.length){
        html += '<div class="empty-panel"><div class="empty-icon">'+svg('megaphone')+'</div>'
          + '<h2>Nenhum anúncio com venda ou dado de Ads no período</h2>'

      } else if(state.data){
        const linhasOrdenadas = state.data.linhas.slice().sort(comparadorDe(state.sort));
        html += '<div class="panel-title" style="margin:18px 0 8px;"><span class="panel-title-ic">'+svg('barChart')+'</span>Resumo por Campanha (IA de Ads e Performance)</div>'
          + '<div class="field-hint" style="margin-bottom:8px;">Soma dos números reais de cada anúncio (nunca recalculados) agrupados por campanha, pra identificar rapidamente campanhas boas e ruins. 🔴 PAUSAR = resultado negativo após Ads · 🟠 AJUSTAR = positivo mas abaixo da margem mínima configurada acima · 🟡 MANTER = margem saudável · 🟢 ESCALAR = margem folgada, dá pra investir mais · ⚠️ DADOS INSUFICIENTES = falta custo do produto ou métrica de Ads. Anúncios sem campanha (venda orgânica) não entram aqui.</div>'
          + tabelaCampanhasHTML(state.data.campanhas)
          + '<div class="panel-title" style="margin:22px 0 8px;"><span class="panel-title-ic">'+svg('megaphone')+'</span>Performance atribuída Mercado Ads</div>'
          + '<div class="field-hint" style="margin-bottom:8px;">Investimento, vendas e receita que o Mercado Livre atribui diretamente à publicidade — dado real da API, nunca estimado.</div>'
          + tabelaAtribuidaHTML(linhasOrdenadas)
          + '<div class="panel-title" style="margin:22px 0 8px;"><span class="panel-title-ic">'+svg('wallet')+'</span>Resultado real do SKU após Ads</div>'
          + '<div class="field-hint" style="margin-bottom:8px;">Margem de contribuição real de <strong>todas</strong> as vendas daquele SKU/anúncio no período (venda − taxas/comissões − frete do vendedor − imposto − custo do produto), menos o investimento em Ads. <strong>Pode incluir vendas orgânicas</strong> (não geradas pela publicidade) — isso NÃO é "lucro gerado pelo Ads", é o resultado financeiro real do SKU já descontando o investimento em Ads.</div>'
          + tabelaResultadoRealHTML(linhasOrdenadas)
          + '<div class="field-hint" style="margin-top:6px;">"Pendente de sincronização" = a API de Publicidade do Mercado Livre ainda não retornou esse dado (ou a conta não tem Product Ads habilitado) — nunca um valor estimado. "pendente" = falta cadastrar o custo de algum SKU deste anúncio em <strong>Produtos</strong>.</div>';
      }

      root.innerHTML = html;

      const selLoja = document.getElementById('adsLojaSelect');
      if(selLoja) selLoja.addEventListener('change', ()=>{ state.contaId = selLoja.value; loadAds(); });
      const selSort = document.getElementById('adsSortSelect');
      if(selSort) selSort.addEventListener('change', ()=>{ state.sort = selSort.value; render(); });
      const btnSync = document.getElementById('btnSincronizarAds');
      if(btnSync) btnSync.addEventListener('click', sincronizarAgora);
      const btnMargemMinima = document.getElementById('adsSalvarMargemMinima');
      const inputMargemMinima = document.getElementById('adsMargemMinimaInput');
      if(btnMargemMinima && inputMargemMinima) btnMargemMinima.addEventListener('click', ()=> salvarMargemMinima(inputMargemMinima.value));
    }

    window.Ads = { load };
  })();

  /* ================= MODAL COMPARTILHADO — Detalhe do anúncio (Análise) =================
     Usado pelas 3 abas abaixo (Performance de Anúncios, Visitas e
     Conversão, Margem por Anúncio) — pedido explícito do usuário: "Quero
     conseguir clicar em um anúncio em qualquer uma dessas telas e abrir os
     detalhes daquele anúncio." Mostra os campos já carregados daquela linha
     (nenhuma chamada nova à API — os dados já vieram do backend na tela de
     origem) e oferece atalhos para ver o MESMO anúncio (mesmo SKU) nas
     outras 2 abas. */
  (function(){
    function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    // Mesmo padrão de miniatura das 3 telas (ver comentário em thumbHTML na
    // aba Performance de Anúncios) — versão "lg" pro modal, onde a imagem
    // tem mais destaque.
    function thumbHTML(url){
      if(!url) return '<span class="anuncio-thumb-lg-placeholder" title="Sem imagem disponível">'+svg('box')+'</span>';
      return '<span style="position:relative;display:inline-block;width:64px;height:64px;flex-shrink:0;">'
        + '<img class="anuncio-thumb-lg" src="'+escapeHtml(url)+'" alt="" loading="lazy" style="position:absolute;inset:0;" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\';">'
        + '<span class="anuncio-thumb-lg-placeholder" style="display:none;position:absolute;inset:0;">'+svg('box')+'</span>'
      + '</span>';
    }

    function abrir({ titulo, sku, loja, mlItemId, imagemUrl, campos, origem }){
      const modalRoot = document.getElementById('modalRoot');
      const outrasAbas = [
        { id:'performanceAnuncios', label:'Performance de Anúncios' },
        { id:'visitasConversao', label:'Visitas e Conversão' },
        { id:'margemAnuncio', label:'Margem por Anúncio' },
      ].filter(a => a.id !== origem);

      modalRoot.innerHTML = '<div class="modal-overlay" id="anuncioDetModalOverlay"><div class="modal-card" style="max-width:580px;">'
        + '<div class="modal-head" style="align-items:flex-start;">'
          + '<div style="display:flex;gap:12px;align-items:flex-start;flex:1;min-width:0;">'
            + thumbHTML(imagemUrl)
            + '<div style="min-width:0;"><h3 class="modal-title">'+escapeHtml(titulo||'(sem título)')+'</h3>'
            + '<div class="modal-sub" style="margin-top:2px;">'+(sku?('SKU <span class="mono">'+escapeHtml(sku)+'</span>'):'sem SKU')+(loja?(' · '+escapeHtml(loja)):'')+(mlItemId?(' · <span class="mono">'+escapeHtml(mlItemId)+'</span>'):'')+'</div></div>'
          + '</div>'
          + '<button class="row-ic-btn" id="anuncioDetModalClose" type="button">'+svg('x')+'</button></div>'
        + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin:16px 0;">'
          + campos.map(c => '<div><div style="font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.02em;">'+escapeHtml(c.label)+'</div><div style="font-size:14px;font-weight:600;margin-top:2px;">'+(c.html!==undefined?c.html:escapeHtml(c.value===null||c.value===undefined?'—':String(c.value)))+'</div></div>').join('')
        + '</div>'
        + (outrasAbas.length && sku ? '<div class="modal-sub" style="margin-top:4px;">Ver este mesmo anúncio (por SKU) em:</div>'
          + '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;">'
            + outrasAbas.map(a=>'<button class="btn-secondary" data-ir-para="'+a.id+'" type="button">'+escapeHtml(a.label)+'</button>').join('')
          + '</div>' : '')
        + '<div class="modal-actions"><button type="button" class="btn-secondary" id="anuncioDetModalFechar">Fechar</button></div>'
      + '</div></div>';

      const overlay = document.getElementById('anuncioDetModalOverlay');
      const close = ()=> modalRoot.innerHTML = '';
      overlay.addEventListener('click', (e)=>{ if(e.target === overlay) close(); });
      document.getElementById('anuncioDetModalClose').addEventListener('click', close);
      document.getElementById('anuncioDetModalFechar').addEventListener('click', close);
      modalRoot.querySelectorAll('[data-ir-para]').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const destino = btn.dataset.irPara;
          close();
          navigate(destino + (sku ? ('?sku='+encodeURIComponent(sku)) : ''));
        });
      });
    }

    window.AnuncioDetalheModal = { abrir };
  })();

  /* ================= PERFORMANCE DE ANÚNCIOS =================
     Ativada em 26/08/2026, pedido explícito do usuário. Vendas vêm da mesma
     fonte única de sempre (lib/relatorioVendas.js); preço/status/estoque
     vêm AO VIVO do Mercado Livre (mesma fonte da tela Anúncios) — quando a
     conta está com erro de conexão, esses campos aparecem indisponíveis,
     NUNCA um valor antigo ou estimado. Os indicadores 🟢🟡🔴 seguem
     critérios objetivos e documentados (ver lib/performanceAnuncios.js e
     docs/01-regras-de-negocio.md) — nunca definidos "no olho". Empresa e
     período vêm do filtro do header (window.CerneFiltro); loja, SKU e
     status são filtros só desta tela. */
  (function(){
    const state = { loading:false, error:null, data:null, contaId:'', sku:'', status:'', sort:'maisVendidos' };

    function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function money(v){ return v===null||v===undefined ? '<span style="color:var(--text-faint);font-style:italic;">indisponível</span>' : 'R$ ' + Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2}); }
    function pctFmt(v){ return v===null||v===undefined ? '—' : (v>=0?'+':'')+Number(v).toLocaleString('pt-BR',{minimumFractionDigits:1, maximumFractionDigits:1})+'%'; }
    // Miniatura da capa/foto principal do anúncio (dado real, vindo AO VIVO
    // do Mercado Livre — ver lib/mlAnuncios.js). "Placeholder discreto"
    // (ícone neutro) quando o anúncio não tem imagem disponível — nunca uma
    // imagem inventada/de outro anúncio. onerror troca pro placeholder se a
    // URL vier quebrada (imagem removida no Mercado Livre depois do
    // catálogo ter sido consultado, por exemplo).
    function thumbHTML(url, tam){
      const cls = tam==='lg' ? 'anuncio-thumb-lg' : 'anuncio-thumb';
      const clsPh = tam==='lg' ? 'anuncio-thumb-lg-placeholder' : 'anuncio-thumb-placeholder';
      const px = tam==='lg' ? 64 : 36;
      if(!url) return '<span class="'+clsPh+'" title="Sem imagem disponível">'+svg('box')+'</span>';
      return '<span style="position:relative;display:inline-block;width:'+px+'px;height:'+px+'px;flex-shrink:0;">'
        + '<img class="'+cls+'" src="'+escapeHtml(url)+'" alt="" loading="lazy" style="position:absolute;inset:0;" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\';">'
        + '<span class="'+clsPh+'" style="display:none;position:absolute;inset:0;">'+svg('box')+'</span>'
      + '</span>';
    }

    async function apiPerformance(empresaId, periodo, contaId, sku, status, desde, ate){
      const params = new URLSearchParams({ empresaId, periodo });
      if(contaId) params.set('contaId', contaId);
      if(sku) params.set('sku', sku);
      if(status) params.set('status', status);
      if(periodo === 'personalizado'){ if(desde) params.set('desde', desde); if(ate) params.set('ate', ate); }
      const res = await fetch('/api/performance-anuncios?'+params.toString());
      let body = null; try{ body = await res.json(); }catch(e){}
      if(!res.ok) throw new Error((body && body.error) || 'Não foi possível carregar Performance de Anúncios.');
      return body;
    }

    async function loadDados(){
      const filtro = window.CerneFiltro.state;
      if(!filtro.empresaId){ state.data = null; state.loading = false; render(); return; }
      state.loading = true; state.error = null; render();
      try{ state.data = await apiPerformance(filtro.empresaId, filtro.periodo, state.contaId, state.sku, state.status, filtro.desdePersonalizado, filtro.atePersonalizado); }
      catch(err){ state.error = err.message; state.data = null; }
      state.loading = false; render();
    }

    function load(queryStr){
      if(queryStr){
        const params = new URLSearchParams(queryStr);
        if(params.get('sku')) state.sku = params.get('sku');
      }
      loadDados();
    }

    window.CerneFiltro.onChange(()=>{
      const page = document.getElementById('page-performanceAnuncios');
      if(page && page.classList.contains('active')) loadDados();
      else render();
    });

    const OPCOES_ORDENACAO = [
      { valor:'maisVendidos', label:'Mais vendidos' },
      { valor:'menosVendidos', label:'Menos vendidos' },
      { valor:'maiorFaturamento', label:'Maior faturamento' },
      { valor:'menorFaturamento', label:'Menor faturamento' },
      { valor:'maiorCrescimento', label:'Maior crescimento' },
      { valor:'maiorQueda', label:'Maior queda' },
      { valor:'semVendas', label:'Anúncios sem vendas' },
    ];
    function valOr(l, campo, seAusente){ const v = l[campo]; return v===null||v===undefined ? seAusente : v; }
    function ordenarLinhas(linhas, sort){
      if(sort === 'semVendas'){
        return linhas.filter(l=>l.semVendaNoPeriodo).slice().sort((a,b)=> valOr(b,'diasSemVender', 999999) - valOr(a,'diasSemVender', 999999));
      }
      const copia = linhas.slice();
      if(sort==='menosVendidos') return copia.sort((a,b)=> a.unidadesVendidas - b.unidadesVendidas);
      if(sort==='menorFaturamento') return copia.sort((a,b)=> (a.faturamento||0) - (b.faturamento||0));
      if(sort==='maiorCrescimento') return copia.sort((a,b)=> valOr(b,'crescimentoPercentual',-Infinity) - valOr(a,'crescimentoPercentual',-Infinity));
      if(sort==='maiorQueda') return copia.sort((a,b)=> valOr(a,'crescimentoPercentual',Infinity) - valOr(b,'crescimentoPercentual',Infinity));
      if(sort==='maiorFaturamento') return copia.sort((a,b)=> (b.faturamento||0) - (a.faturamento||0));
      return copia.sort((a,b)=> b.unidadesVendidas - a.unidadesVendidas); // 'maisVendidos' (padrão)
    }

    function statusLabel(status){
      const map = { active:'Ativo', paused:'Pausado', closed:'Encerrado' };
      return map[status] || (status ? escapeHtml(status) : 'Indisponível');
    }

    function indicadorHTML(l){
      if(l.indicador==='baixo') return '<span style="color:var(--danger);font-weight:600;white-space:nowrap;">🔴 Baixo desempenho</span>';
      if(l.indicador==='atencao') return '<span style="color:var(--warning);font-weight:600;white-space:nowrap;">🟡 Atenção</span>';
      if(l.indicador==='bom') return '<span style="color:var(--success);font-weight:600;white-space:nowrap;">🟢 Bom desempenho</span>';
      if(l.indicador==='sem_classificacao') return '<span style="color:var(--text-faint);">Sem classificação ainda</span>';
      return '<span style="color:var(--text-faint);">'+statusLabel(l.status)+'</span>';
    }

    function tagsHTML(l){
      const tags = [];
      if(l.tags.semVendaVariosDias) tags.push('Sem vender há '+l.diasSemVender+'d');
      else if(l.semVendaHistorico) tags.push('Nunca vendeu');
      if(l.tags.vendendoCadaVezMenos) tags.push('Vendendo menos');
      if(l.tags.crescendo) tags.push('Crescendo');
      if(l.tags.praticamenteParado) tags.push('Praticamente parado');
      if(l.novoNoPeriodo) tags.push('Novo no período');
      if(!tags.length) return '';
      return tags.map(t=>'<span style="display:inline-block;font-size:11px;padding:2px 7px;border-radius:20px;background:var(--surface-2);color:var(--text-muted);margin:0 4px 4px 0;">'+escapeHtml(t)+'</span>').join('');
    }

    function anuncioCellHTML(l){
      return '<td class="produto-cell"><a href="javascript:void(0)" class="anuncio-link" data-ml-item="'+escapeHtml(l.mlItemId||'')+'" style="text-decoration:none;color:inherit;"><div class="anuncio-cell-flex">'
        + thumbHTML(l.imagemUrl)
        + '<div class="cell-stack">'
          + '<span class="prod-title" title="'+escapeHtml(l.anuncio||'—')+'" style="text-decoration:underline dotted;">'+escapeHtml(l.anuncio||'(sem título)')+'</span>'
          + '<span class="cell-stack-sub mono">'+escapeHtml(l.sku||'sem SKU')+'</span>'
        + '</div></div></a></td>';
    }

    // ---- KPIs, ranking e gráfico de topo — tudo Σ/ordenação das MESMAS
    // linhas já retornadas por /api/performance-anuncios (l.faturamento,
    // l.unidadesVendidas, l.quantidadePedidos, l.crescimentoPercentual,
    // l.indicador) — nenhum número novo, só soma/ordenação de exibição. */
    function kpiHeroHTML(linhas){
      if(!linhas.length) return '';
      const faturamentoTotal = linhas.reduce((s,l)=> s+(l.faturamento||0), 0);
      const faturamentoAnteriorTotal = linhas.reduce((s,l)=> s+(l.faturamentoPeriodoAnterior||0), 0);
      const unidadesTotal = linhas.reduce((s,l)=> s+(l.unidadesVendidas||0), 0);
      const pedidosTotal = linhas.reduce((s,l)=> s+(l.quantidadePedidos||0), 0);
      const crescimento = faturamentoAnteriorTotal>0 ? ((faturamentoTotal-faturamentoAnteriorTotal)/faturamentoAnteriorTotal*100) : null;
      const contagem = { bom:0, atencao:0, baixo:0 };
      linhas.forEach(l=>{ if(contagem[l.indicador]!==undefined) contagem[l.indicador]++; });
      const ativos = linhas.filter(l=>l.status==='active').length;
      const items = [
        { label:'Vendas (Faturamento)', icon:'barChart', tint:'copper', valueHtml:'R$ '+faturamentoTotal.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}), note: crescimento===null ? 'Sem base de comparação' : ((crescimento>=0?'↑ ':'↓ ')+Math.abs(crescimento).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'% vs. período anterior') },
        { label:'Unidades vendidas', icon:'box', tint:'petrol', valueHtml:String(unidadesTotal), note: pedidosTotal+' pedido(s)' },
        { label:'Anúncios monitorados', icon:'tag', tint:'purple', valueHtml:String(linhas.length), note: ativos+' ativo(s) no Mercado Livre' },
        { label:'🟢 Bom desempenho', icon:'checkCircle', tint:'success', valueHtml:String(contagem.bom), note:'Sem sinais de queda/parada' },
        { label:'🟡 Atenção', icon:'alertCircle', tint: contagem.atencao>0?'warning':'muted', valueHtml:String(contagem.atencao), note:'Vale acompanhar' },
        { label:'🔴 Baixo desempenho', icon:'alertCircle', tint: contagem.baixo>0?'danger':'muted', valueHtml:String(contagem.baixo), note:'Precisa de atenção' },
      ];
      return '<div class="kpi-hero-grid" style="margin-bottom:14px;">' + items.map(k=>
        '<div class="kpi-hero" style="--tint:var(--'+k.tint+');--tint-soft:var(--'+k.tint+'-soft);">'
          + '<div class="kpi-hero-top"><div class="kpi-hero-icon">'+svg(k.icon)+'</div></div>'
          + '<div class="kpi-hero-label">'+escapeHtml(k.label)+'</div>'
          + '<div class="kpi-hero-value" style="font-size:19px;">'+k.valueHtml+'</div>'
          + '<div class="kpi-hero-foot"><span class="kpi-hero-note">'+escapeHtml(k.note)+'</span></div>'
        + '</div>'
      ).join('') + '</div>';
    }

    function rankingListHTML(titulo, icone, linhas){
      if(!linhas.length) return '<div class="panel"><div class="panel-head"><div class="panel-title"><span class="panel-title-ic">'+svg(icone)+'</span>'+escapeHtml(titulo)+'</div></div><div class="field-hint">Sem dados suficientes.</div></div>';
      return '<div class="panel">'
        + '<div class="panel-head"><div class="panel-title"><span class="panel-title-ic">'+svg(icone)+'</span>'+escapeHtml(titulo)+'</div></div>'
        + linhas.map((l,i)=> '<div class="item-row"><div style="display:flex;align-items:center;gap:10px;min-width:0;">'
            + '<span style="flex-shrink:0;width:20px;color:var(--text-faint);font-weight:700;font-size:12px;">'+(i+1)+'</span>'
            + thumbHTML(l.imagemUrl)
            + '<div class="cell-stack" style="min-width:0;"><span class="ir-title" title="'+escapeHtml(l.anuncio||'—')+'">'+escapeHtml(l.anuncio||'(sem título)')+'</span><span class="ir-sku mono">'+escapeHtml(l.sku||'sem SKU')+'</span></div>'
          + '</div>'
          + '<div class="mono" style="text-align:right;flex-shrink:0;">'+money(l.faturamento)+'<div class="cell-stack-sub" style="'+(l.crescimentoPercentual!==null?(l.crescimentoPercentual>=0?'color:var(--success);':'color:var(--danger);'):'')+'">'+(l.novoNoPeriodo?'Novo':pctFmt(l.crescimentoPercentual))+'</div></div>'
        + '</div>').join('')
      + '</div>';
    }

    function chartFaturamentoHTML(linhas){
      const top = linhas.slice().sort((a,b)=>(b.faturamento||0)-(a.faturamento||0)).slice(0,8);
      if(!top.length || !top.some(l=>l.faturamento>0)) return '<div class="chart-canvas h-lg">'+chartGridLines(4)+chartEmptyState('barChart','Sem faturamento no período pra mostrar no gráfico.')+'</div>';
      const maxV = Math.max(...top.map(l=>l.faturamento||0), 1);
      return '<div style="display:flex;align-items:flex-end;gap:14px;height:190px;padding:6px 4px 0;">'
        + top.map(l=>{
            const h = Math.max(4, Math.round((l.faturamento||0)/maxV*160));
            return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;" title="'+escapeHtml(l.anuncio||'')+': '+money(l.faturamento)+'">'
              + '<div class="mono" style="font-size:10.5px;color:var(--text-faint);">'+money(l.faturamento).replace('R$ ','')+'</div>'
              + '<div style="width:100%;max-width:34px;height:'+h+'px;background:var(--copper);border-radius:5px 5px 0 0;"></div>'
              + '<div style="font-size:10px;color:var(--text-faint);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;">'+escapeHtml((l.sku||l.anuncio||'').slice(0,12))+'</div>'
            + '</div>';
        }).join('')
      + '</div>';
    }

    function criteriosResumoHTML(c){
      if(!c) return '';
      return '<div class="field-hint" style="margin-bottom:12px;max-width:960px;">Critérios objetivos: 🔴 Baixo desempenho = '+c.diasSemVenderRuim+'+ dias sem vender, ou parou de vender (vendia no período anterior e não vendeu agora), ou queda de '+Math.abs(c.quedaFortePct)+'% ou mais nas unidades vendidas. 🟡 Atenção = '+c.diasSemVenderAtencao+' a '+(c.diasSemVenderRuim-1)+' dias sem vender, ou queda de '+Math.abs(c.quedaModeradaPct)+'% ou mais, ou vendendo muito pouco (média ≤ '+c.mediaDiaParado+' unidade/dia). 🟢 Bom desempenho = vendeu no período sem nenhum desses sinais. Só se aplica a anúncios com status ativo.</div>';
    }

    function tabelaHTML(linhas){
      return '<div class="table-card"><div class="table-wrap"><table class="data-table"><thead><tr>'
        + '<th>Anúncio / SKU</th><th>Produto</th><th>Loja</th><th>Status</th><th>Indicador</th><th>Preço atual</th>'
        + '<th>Unid. vendidas</th><th>Pedidos</th><th>Faturamento</th><th>Média/dia</th><th>vs. período anterior</th><th>Sinalizações</th>'
        + '</tr></thead><tbody>'
        + linhas.map(l => '<tr>'
          + anuncioCellHTML(l)
          + '<td>'+(l.produto?escapeHtml(l.produto):'<span style="color:var(--text-faint);">—</span>')+'</td>'
          + '<td>'+escapeHtml(l.loja||'—')+'</td>'
          + '<td>'+statusLabel(l.status)+'</td>'
          + '<td>'+indicadorHTML(l)+'</td>'
          + '<td class="mono">'+money(l.precoAtual)+'</td>'
          + '<td class="mono tab-nums">'+l.unidadesVendidas+'</td>'
          + '<td class="mono tab-nums">'+l.quantidadePedidos+'</td>'
          + '<td class="mono">'+money(l.faturamento)+'</td>'
          + '<td class="mono">'+Number(l.mediaVendasPorDia).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+'</td>'
          + '<td class="mono" style="'+(l.crescimentoPercentual!==null?(l.crescimentoPercentual>=0?'color:var(--success);':'color:var(--danger);'):'')+'">'+(l.novoNoPeriodo?'<span style="color:var(--teal);">Novo</span>':pctFmt(l.crescimentoPercentual))+'</td>'
          + '<td>'+tagsHTML(l)+'</td>'
        + '</tr>').join('')
        + '</tbody></table></div></div>';
    }

    function abrirDetalhe(l){
      window.AnuncioDetalheModal.abrir({
        titulo: l.anuncio, sku: l.sku, loja: l.loja, mlItemId: l.mlItemId, imagemUrl: l.imagemUrl, origem: 'performanceAnuncios',
        campos: [
          { label:'Produto cadastrado', value: l.produto },
          { label:'Status', html: statusLabel(l.status) },
          { label:'Indicador', html: indicadorHTML(l) },
          { label:'Preço atual', html: money(l.precoAtual) },
          { label:'Unidades vendidas', value: l.unidadesVendidas },
          { label:'Pedidos', value: l.quantidadePedidos },
          { label:'Faturamento', html: money(l.faturamento) },
          { label:'Média de vendas/dia', value: l.mediaVendasPorDia },
          { label:'Unid. período anterior', value: l.unidadesPeriodoAnterior },
          { label:'Crescimento', html: l.novoNoPeriodo ? 'Novo no período' : pctFmt(l.crescimentoPercentual) },
          { label:'Dias sem vender', value: l.diasSemVender===null ? (l.semVendaHistorico ? 'nunca vendeu' : '—') : l.diasSemVender },
        ],
      });
    }

    function render(){
      const root = document.getElementById('performanceAnunciosRoot');
      if(!root) return;
      const filtro = window.CerneFiltro.state;

      if(!filtro.loadingEmpresas && !filtro.empresas.length){
        root.innerHTML = '<div class="empty-panel"><div class="empty-icon">'+svg('building')+'</div>'
          + '<h2>Nenhuma empresa ativa</h2><p class="lead">Cadastre e ative uma empresa em <strong>Cadastros → Empresas</strong> para ver Performance de Anúncios aqui.</p></div>';
        return;
      }

      let html = criteriosResumoHTML(state.data && state.data.criterios);

      if(state.data && !state.data.semConta){
        html += '<div class="toolbar"><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">'
          + '<div class="empresa-picker" style="margin-bottom:0;"><select id="paLojaSelect"><option value="">Todas as lojas</option>'
            + state.data.lojas.map(l=>'<option value="'+l.id+'" '+(String(l.id)===String(state.contaId)?'selected':'')+'>'+escapeHtml(l.nickname||('Conta '+l.id))+'</option>').join('')
          + '</select></div>'
          + '<div class="empresa-picker" style="margin-bottom:0;"><select id="paStatusSelect"><option value="">Todos os status</option>'
            + ['active','paused','closed'].map(s=>'<option value="'+s+'" '+(s===state.status?'selected':'')+'>'+statusLabel(s)+'</option>').join('')
          + '</select></div>'
          + '<input type="text" id="paSkuInput" placeholder="Buscar por SKU…" value="'+escapeHtml(state.sku)+'" style="height:38px;padding:0 12px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface-1);min-width:160px;">'
          + '<div class="empresa-picker" style="margin-bottom:0;"><select id="paSortSelect">'
            + OPCOES_ORDENACAO.map(o=>'<option value="'+o.valor+'" '+(o.valor===state.sort?'selected':'')+'>Ordenar por: '+escapeHtml(o.label)+'</option>').join('')
          + '</select></div>'
        + '</div></div>';

        if(state.data.situacaoPorConta && state.data.situacaoPorConta.some(s=>!s.disponivel)){
          html += '<div class="table-card" style="padding:12px 16px;margin-bottom:14px;border-left:3px solid var(--warning);">'
            + state.data.situacaoPorConta.filter(s=>!s.disponivel).map(s=>
              '<div style="font-size:12.5px;color:var(--text-muted);display:flex;gap:8px;align-items:flex-start;margin:4px 0;">'
                + '<span style="color:var(--warning);flex-shrink:0;">'+svg('alertCircle')+'</span>'
                + '<span><strong>'+escapeHtml(s.loja||('Conta '+s.contaId))+'</strong>: '+escapeHtml(s.mensagem||'')+'</span>'
              + '</div>'
            ).join('')
          + '</div>';
        }

        if(state.data.linhas && state.data.linhas.length){
          html += kpiHeroHTML(state.data.linhas);
          html += '<div class="grid-2" style="margin-bottom:14px;align-items:start;">'
            + '<div class="chart-card"><div class="chart-card-head"><div class="panel-title"><span class="panel-title-ic">'+svg('barChart')+'</span>Faturamento por anúncio (top 8)</div></div>'
              + chartFaturamentoHTML(state.data.linhas)
            + '</div>'
            + '<div style="display:flex;flex-direction:column;gap:14px;">'
              + rankingListHTML('Ranking por faturamento', 'barChart', state.data.linhas.slice().sort((a,b)=>(b.faturamento||0)-(a.faturamento||0)).slice(0,5))
              + rankingListHTML('Ranking por crescimento', 'activity', state.data.linhas.slice().filter(l=>l.crescimentoPercentual!==null||l.novoNoPeriodo).sort((a,b)=>(b.novoNoPeriodo?Infinity:b.crescimentoPercentual)-(a.novoNoPeriodo?Infinity:a.crescimentoPercentual)).slice(0,5))
            + '</div>'
          + '</div>';
        }
      }

      if(state.loading || filtro.loadingEmpresas){
        html += '<div class="table-card"><div class="table-skel"><span class="spin"></span><span>Carregando Performance de Anúncios…</span></div></div>';
      } else if(state.error){
        html += '<div class="empty-panel"><div class="empty-icon" style="color:var(--danger); background:var(--danger-soft);">'+svg('alertCircle')+'</div>'
          + '<h2 style="color:var(--danger);">Não foi possível carregar</h2><p class="lead">'+escapeHtml(state.error)+'</p></div>';
      } else if(state.data && state.data.semConta){
        html += '<div class="empty-panel"><div class="empty-icon">'+svg('store')+'</div>'
          + '<h2>Nenhuma conta do Mercado Livre conectada</h2><p class="lead">Conecte uma conta do Mercado Livre em <strong>Marketplaces</strong> para ver Performance de Anúncios aqui.</p></div>';
      } else if(state.data && !state.data.linhas.length){
        html += '<div class="empty-panel"><div class="empty-icon">'+svg('tag')+'</div>'
          + '<h2>Nenhum anúncio encontrado</h2><p class="lead">Nenhum anúncio com venda ou dado ao vivo para os filtros escolhidos.</p></div>';
      } else if(state.data){
        const linhasOrdenadas = ordenarLinhas(state.data.linhas, state.sort);
        if(!linhasOrdenadas.length){
          html += '<div class="empty-panel"><div class="empty-icon">'+svg('tag')+'</div><h2>Nenhum anúncio nesta ordenação/filtro</h2><p class="lead">Experimente "Todas as lojas"/"Todos os status" ou outra ordenação.</p></div>';
        } else {
          html += tabelaHTML(linhasOrdenadas);
        }
      }

      root.innerHTML = html;

      const selLoja = document.getElementById('paLojaSelect');
      if(selLoja) selLoja.addEventListener('change', ()=>{ state.contaId = selLoja.value; loadDados(); });
      const selStatus = document.getElementById('paStatusSelect');
      if(selStatus) selStatus.addEventListener('change', ()=>{ state.status = selStatus.value; loadDados(); });
      const skuInput = document.getElementById('paSkuInput');
      if(skuInput){
        let debounce = null;
        skuInput.addEventListener('input', ()=>{
          clearTimeout(debounce);
          debounce = setTimeout(()=>{ state.sku = skuInput.value; loadDados(); }, 400);
        });
      }
      const selSort = document.getElementById('paSortSelect');
      if(selSort) selSort.addEventListener('change', ()=>{ state.sort = selSort.value; render(); });

      root.querySelectorAll('.anuncio-link').forEach(el=>{
        el.addEventListener('click', ()=>{
          const mlItemId = el.dataset.mlItem;
          const l = (state.data.linhas||[]).find(x=>x.mlItemId===mlItemId);
          if(l) abrirDetalhe(l);
        });
      });
    }

    window.PerformanceAnuncios = { load };
  })();

  /* ================= VISITAS E CONVERSÃO =================
     Ativada em 26/08/2026, pedido explícito do usuário. Visitas vêm da API
     de Visitas do Mercado Livre (lib/mlVisitas.js — novo cliente,
     endpoints reais); vendas/pedidos vêm da mesma fonte única de sempre.
     Conversão = pedidos ÷ visitas × 100 (definição explícita, mostrada em
     toda a tela). REGRA DO USUÁRIO: nunca inventar número de visitas — "Dado
     não disponível" é mostrado literalmente quando a API não retorna. */
  (function(){
    const state = { loading:false, error:null, data:null, contaId:'', sku:'', sort:'maisVisitados' };

    function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function dadoNaoDisp(){ return '<span style="color:var(--text-faint);font-style:italic;">Dado não disponível</span>'; }
    function intOrIndisp(v){ return v===null||v===undefined ? dadoNaoDisp() : Number(v).toLocaleString('pt-BR'); }
    function pctOrIndisp(v){ return v===null||v===undefined ? dadoNaoDisp() : Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+'%'; }
    function pctSinal(v){ return v===null||v===undefined ? '—' : (v>=0?'+':'')+Number(v).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'%'; }
    function fmtDiaCurto(diaISO){ const [, m, d] = diaISO.split('-'); return d+'/'+m; }
    function money(v){ return v===null||v===undefined ? '—' : 'R$ ' + Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2}); }
    function thumbHTML(url){
      if(!url) return '<span class="anuncio-thumb-placeholder" title="Sem imagem disponível">'+svg('box')+'</span>';
      return '<span style="position:relative;display:inline-block;width:36px;height:36px;flex-shrink:0;">'
        + '<img class="anuncio-thumb" src="'+escapeHtml(url)+'" alt="" loading="lazy" style="position:absolute;inset:0;" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\';">'
        + '<span class="anuncio-thumb-placeholder" style="display:none;position:absolute;inset:0;">'+svg('box')+'</span>'
      + '</span>';
    }

    async function apiVisitas(empresaId, periodo, contaId, sku, desde, ate){
      const params = new URLSearchParams({ empresaId, periodo });
      if(contaId) params.set('contaId', contaId);
      if(sku) params.set('sku', sku);
      if(periodo === 'personalizado'){ if(desde) params.set('desde', desde); if(ate) params.set('ate', ate); }
      const res = await fetch('/api/visitas-conversao?'+params.toString());
      let body = null; try{ body = await res.json(); }catch(e){}
      if(!res.ok) throw new Error((body && body.error) || 'Não foi possível carregar Visitas e Conversão.');
      return body;
    }

    async function loadDados(){
      const filtro = window.CerneFiltro.state;
      if(!filtro.empresaId){ state.data = null; state.loading = false; render(); return; }
      state.loading = true; state.error = null; render();
      try{ state.data = await apiVisitas(filtro.empresaId, filtro.periodo, state.contaId, state.sku, filtro.desdePersonalizado, filtro.atePersonalizado); }
      catch(err){ state.error = err.message; state.data = null; }
      state.loading = false; render();
    }

    function load(queryStr){
      if(queryStr){
        const params = new URLSearchParams(queryStr);
        if(params.get('sku')) state.sku = params.get('sku');
      }
      loadDados();
    }

    window.CerneFiltro.onChange(()=>{
      const page = document.getElementById('page-visitasConversao');
      if(page && page.classList.contains('active')) loadDados();
      else render();
    });

    const OPCOES_ORDENACAO = [
      { valor:'maisVisitados', label:'Mais visitados' },
      { valor:'menosVisitados', label:'Menos visitados' },
      { valor:'melhorConversao', label:'Melhor conversão' },
      { valor:'piorConversao', label:'Pior conversão' },
      { valor:'maiorCrescimentoVisitas', label:'Maior crescimento de visitas' },
      { valor:'maiorQuedaVisitas', label:'Maior queda de visitas' },
      { valor:'muitasVisitasPoucasVendas', label:'Muitas visitas, poucas vendas' },
      { valor:'poucasVisitasBoaConversao', label:'Poucas visitas, boa conversão' },
    ];
    function valOr(l, campo, seAusente){ const v = l[campo]; return v===null||v===undefined ? seAusente : v; }
    function ordenarLinhas(linhas, sort){
      if(sort==='muitasVisitasPoucasVendas'){
        return linhas.filter(l=>l.insights.muitasVisitasPoucasVendas).slice().sort((a,b)=> valOr(b,'visitas',-Infinity) - valOr(a,'visitas',-Infinity));
      }
      if(sort==='poucasVisitasBoaConversao'){
        return linhas.filter(l=>l.insights.poucasVisitasBoaConversao).slice().sort((a,b)=> valOr(b,'conversao',-Infinity) - valOr(a,'conversao',-Infinity));
      }
      const copia = linhas.slice();
      if(sort==='menosVisitados') return copia.sort((a,b)=> valOr(a,'visitas',Infinity) - valOr(b,'visitas',Infinity));
      if(sort==='melhorConversao') return copia.sort((a,b)=> valOr(b,'conversao',-Infinity) - valOr(a,'conversao',-Infinity));
      if(sort==='piorConversao') return copia.sort((a,b)=> valOr(a,'conversao',Infinity) - valOr(b,'conversao',Infinity));
      if(sort==='maiorCrescimentoVisitas') return copia.sort((a,b)=> valOr(b,'evolucaoVisitasPercentual',-Infinity) - valOr(a,'evolucaoVisitasPercentual',-Infinity));
      if(sort==='maiorQuedaVisitas') return copia.sort((a,b)=> valOr(a,'evolucaoVisitasPercentual',Infinity) - valOr(b,'evolucaoVisitasPercentual',Infinity));
      return copia.sort((a,b)=> valOr(b,'visitas',-Infinity) - valOr(a,'visitas',-Infinity)); // 'maisVisitados'
    }

    // ---- KPIs e rankings de topo — Σ/ordenação das MESMAS linhas já
    // retornadas por /api/visitas-conversao (nenhum número novo). Visitas só
    // somam nos anúncios com l.visitas!==null — nunca inventa visita pros
    // que a API do Mercado Livre não retornou (mesma regra da tabela). */
    function kpiHeroHTML(linhas){
      if(!linhas.length) return '';
      const comVisita = linhas.filter(l=>l.visitas!==null);
      const visitasTotal = comVisita.reduce((s,l)=>s+l.visitas,0);
      const pedidosComVisita = comVisita.reduce((s,l)=>s+l.pedidos,0);
      const unidadesTotal = linhas.reduce((s,l)=>s+l.unidadesVendidas,0);
      const pedidosTotal = linhas.reduce((s,l)=>s+l.pedidos,0);
      const conversaoGeral = visitasTotal>0 ? (pedidosComVisita/visitasTotal*100) : null;
      const anunciosFortes = linhas.filter(l=>l.insights.muitasVisitasBoaConversao).length;
      const quedaVisitas = linhas.filter(l=>l.insights.quedaDeVisitas).length;
      const items = [
        { label:'Visitas (total)', icon:'eye', tint:'petrol', valueHtml: comVisita.length ? visitasTotal.toLocaleString('pt-BR') : dadoNaoDisp(), note: (linhas.length-comVisita.length)>0 ? (linhas.length-comVisita.length)+' anúncio(s) sem dado de visita' : 'Todos os anúncios com dado' },
        { label:'Vendas (unidades)', icon:'box', tint:'copper', valueHtml: String(unidadesTotal), note: pedidosTotal+' pedido(s)' },
        { label:'Conversão geral', icon:'activity', tint:'purple', valueHtml: conversaoGeral===null?dadoNaoDisp():conversaoGeral.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+'%', note:'Pedidos ÷ visitas, só anúncios com dado' },
        { label:'Anúncios monitorados', icon:'tag', tint:'muted', valueHtml: String(linhas.length), note: state.data.lojas.length+' loja(s)' },
        { label:'Anúncios fortes', icon:'checkCircle', tint: anunciosFortes>0?'success':'muted', valueHtml: String(anunciosFortes), note:'Muitas visitas + boa conversão' },
        { label:'Queda de visitas', icon:'alertCircle', tint: quedaVisitas>0?'danger':'muted', valueHtml: String(quedaVisitas), note:'vs. período anterior' },
      ];
      return '<div class="kpi-hero-grid" style="margin-bottom:14px;">' + items.map(k=>
        '<div class="kpi-hero" style="--tint:var(--'+k.tint+');--tint-soft:var(--'+k.tint+'-soft);">'
          + '<div class="kpi-hero-top"><div class="kpi-hero-icon">'+svg(k.icon)+'</div></div>'
          + '<div class="kpi-hero-label">'+escapeHtml(k.label)+'</div>'
          + '<div class="kpi-hero-value" style="font-size:18px;">'+k.valueHtml+'</div>'
          + '<div class="kpi-hero-foot"><span class="kpi-hero-note">'+escapeHtml(k.note)+'</span></div>'
        + '</div>'
      ).join('') + '</div>';
    }
    function rankingListHTML(titulo, icone, linhas, valorFn){
      if(!linhas.length) return '<div class="panel"><div class="panel-head"><div class="panel-title"><span class="panel-title-ic">'+svg(icone)+'</span>'+escapeHtml(titulo)+'</div></div><div class="field-hint">Sem dados suficientes.</div></div>';
      return '<div class="panel">'
        + '<div class="panel-head"><div class="panel-title"><span class="panel-title-ic">'+svg(icone)+'</span>'+escapeHtml(titulo)+'</div></div>'
