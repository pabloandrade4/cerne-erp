  /* ---------- FILTRO DO HEADER (empresa + período) — fonte única da Visão Geral ----------
     Único lugar que guarda "empresa selecionada" e "período selecionado" pra Visão
     Geral: os dois seletores que ficavam dentro da própria página foram removidos
     (eram um segundo estado, duplicado, e nunca em sincronia com o header). Pedidos
     e Financeiro continuam com o seletor próprio dentro da tela — não fazem parte
     desta correção. */
  const HEADER_PERIODOS = [
    { chave:'hoje', label:'Hoje' },
    { chave:'ontem', label:'Ontem' },
    { chave:'7d', label:'Últimos 7 dias' },
    { chave:'30d', label:'Últimos 30 dias' },
    { chave:'mes', label:'Este mês' },
    // Adicionado em 12/09/2026 (pedido explícito do usuário): poder
    // escolher qualquer intervalo de datas, não só os períodos prontos —
    // em TODA aba que usa este filtro do cabeçalho (a maioria do ERP, ver
    // lib/periodo.js). Mesma opção que Fluxo de Caixa/DRE já tinham no
    // período PRÓPRIO deles.
    { chave:'personalizado', label:'Personalizado' },
  ];
  function hojeBRTStr(){
    const BRT_OFFSET_MS = 3*60*60*1000;
    const brt = new Date(Date.now() - BRT_OFFSET_MS);
    const p = n => String(n).padStart(2,'0');
    return brt.getUTCFullYear()+'-'+p(brt.getUTCMonth()+1)+'-'+p(brt.getUTCDate());
  }
  window.CerneFiltro = (function(){
    const state = { empresas:[], empresaId:null, loadingEmpresas:true, periodo:'30d', desdePersonalizado:null, atePersonalizado:null };
    const listeners = [];
    function onChange(fn){ listeners.push(fn); }
    function notify(){ listeners.forEach(fn=>{ try{ fn(state); }catch(e){} }); }
    function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    function renderCompanyDropdown(){
      const dd = document.getElementById('companyDropdown');
      if(!dd) return;
      let html = '<div class="dropdown-title">Empresas ativas</div>';
      if(state.loadingEmpresas){
        html += '<div class="dropdown-item"><div><div class="di-name">Carregando…</div></div></div>';
      } else if(!state.empresas.length){
        html += '<div class="dropdown-item"><div><div class="di-name">Nenhuma empresa ativa</div></div></div>';
      } else {
        html += state.empresas.map(e =>
          '<div class="dropdown-item" data-empresa-id="'+e.id+'">'
            + '<div><div class="di-name">'+escapeHtml(e.nomeFantasia||e.razaoSocial)+'</div>'
            + (e.cnpj ? '<div class="di-sub mono">'+escapeHtml(e.cnpj)+'</div>' : '')+'</div>'
            + '<span class="dot'+(e.id===state.empresaId?'':' muted')+'"></span>'
          + '</div>'
        ).join('');
      }
      dd.innerHTML = html;
      dd.querySelectorAll('[data-empresa-id]').forEach(item=>{
        item.addEventListener('click', (e)=>{
          e.stopPropagation();
          const id = Number(item.dataset.empresaId);
          dd.classList.remove('open');
          if(id === state.empresaId) return;
          state.empresaId = id;
          renderCompanyDropdown();
          updateCompanyLabel();
          notify();
        });
      });
    }

    function updateCompanyLabel(){
      const lbl = document.getElementById('companyLabel');
      if(!lbl) return;
      if(state.loadingEmpresas){ lbl.textContent = 'Carregando…'; return; }
      const emp = state.empresas.find(e=>e.id===state.empresaId);
      lbl.textContent = emp ? (emp.nomeFantasia||emp.razaoSocial) : 'Nenhuma empresa ativa';
    }

    function fmtDataBR(iso){
      if(!iso) return '';
      const partes = String(iso).slice(0,10).split('-');
      return partes.length===3 ? (partes[2]+'/'+partes[1]) : iso;
    }

    // O formulário De/Até só aparece dentro do dropdown quando 'personalizado'
    // já é a escolha atual — clicar em "Personalizado" na lista já ativa o
    // período (com um valor padrão de datas) e mostra o formulário pra
    // ajustar; reabrir o dropdown depois também mostra o formulário, sempre
    // com as datas atualmente aplicadas, pra dar pra mudar sem escolher a
    // opção de novo.
    function renderPeriodDropdown(){
      const dd = document.getElementById('periodDropdown');
      if(!dd) return;
      const personalizadoAtivo = state.periodo === 'personalizado';
      dd.innerHTML = '<div class="dropdown-title">Período (Visão Geral)</div>' + HEADER_PERIODOS.map(p =>
        '<div class="dropdown-item" data-periodo="'+p.chave+'">'
          + '<div class="di-name">'+p.label+'</div>'
          + '<span class="dot'+(p.chave===state.periodo?'':' muted')+'"></span>'
        + '</div>'
      ).join('')
      + (personalizadoAtivo
        ? '<div style="padding:10px 14px 12px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;" onclick="event.stopPropagation()">'
            + '<div class="field narrow" style="margin:0;"><label style="font-size:11px;">De</label><input type="date" id="headerPeriodoDesde" value="'+(state.desdePersonalizado||'')+'" style="width:132px;"></div>'
            + '<div class="field narrow" style="margin:0;"><label style="font-size:11px;">Até</label><input type="date" id="headerPeriodoAte" value="'+(state.atePersonalizado||'')+'" style="width:132px;"></div>'
            + '<button class="ghost-btn" id="headerPeriodoAplicar" type="button" style="cursor:pointer;opacity:1;">Aplicar</button>'
          + '</div>'
        : '');
      dd.querySelectorAll('[data-periodo]').forEach(item=>{
        item.addEventListener('click', (e)=>{
          e.stopPropagation();
          const chave = item.dataset.periodo;
          if(chave === 'personalizado'){
            // Fica com o dropdown aberto pra escolher/confirmar as datas —
            // nunca fecha nem notifica só por clicar na opção.
            if(!state.desdePersonalizado) state.desdePersonalizado = hojeBRTStr();
            if(!state.atePersonalizado) state.atePersonalizado = hojeBRTStr();
            const jaEstavaPersonalizado = state.periodo === 'personalizado';
            state.periodo = 'personalizado';
            renderPeriodDropdown();
            updatePeriodLabel();
            if(!jaEstavaPersonalizado) notify();
            return;
          }
          dd.classList.remove('open');
          if(chave === state.periodo) return;
          state.periodo = chave;
          renderPeriodDropdown();
          updatePeriodLabel();
          notify();
        });
      });
      const aplicar = document.getElementById('headerPeriodoAplicar');
      if(aplicar){
        aplicar.addEventListener('click', (e)=>{
          e.stopPropagation();
          const d = document.getElementById('headerPeriodoDesde').value;
          const a = document.getElementById('headerPeriodoAte').value;
          state.desdePersonalizado = d || state.desdePersonalizado || hojeBRTStr();
          state.atePersonalizado = a || state.atePersonalizado || hojeBRTStr();
          dd.classList.remove('open');
          updatePeriodLabel();
          notify();
        });
      }
    }

    // Reaproveitado por outras telas que precisam mostrar o período atual em
    // texto (ex.: IA Gestora) — nunca duplica a lógica de formatação.
    function periodoLabel(){
      if(state.periodo === 'personalizado'){
        return state.desdePersonalizado && state.atePersonalizado
          ? (fmtDataBR(state.desdePersonalizado)+' – '+fmtDataBR(state.atePersonalizado))
          : 'Personalizado';
      }
      const p = HEADER_PERIODOS.find(p => p.chave === state.periodo);
      return p ? p.label : '';
    }

    function updatePeriodLabel(){
      const lbl = document.getElementById('periodLabel');
      if(!lbl) return;
      lbl.textContent = periodoLabel();
    }

    let empresasFetchEmAndamento = null;
    function carregarEmpresas(){
      // Evita duas buscas concorrentes de empresa (ex.: bootstrap inicial +
      // navegação pra Visão Geral acontecendo quase ao mesmo tempo).
      if(empresasFetchEmAndamento) return empresasFetchEmAndamento;
      state.loadingEmpresas = true; renderCompanyDropdown(); updateCompanyLabel();
      empresasFetchEmAndamento = (async ()=>{
        try{
          const res = await fetch('/api/empresas?status=ativas');
          const body = await res.json();
          state.empresas = (body && body.empresas) || [];
        }catch(e){ state.empresas = []; }
        if(!state.empresaId || !state.empresas.find(emp=>emp.id===state.empresaId)){
          state.empresaId = state.empresas.length ? state.empresas[0].id : null;
        }
        state.loadingEmpresas = false;
        renderCompanyDropdown();
        updateCompanyLabel();
        notify();
        empresasFetchEmAndamento = null;
      })();
      return empresasFetchEmAndamento;
    }

    renderPeriodDropdown();
    updatePeriodLabel();
    carregarEmpresas();

    // Fragmento de query string ('' ou '&desde=...&ate=...') pra toda tela
    // que usa este filtro anexar na própria chamada de API sempre que o
    // período for personalizado — nunca precisa duplicar a checagem
    // `periodo==='personalizado'` em cada tela.
    function periodoExtra(){
      if(state.periodo !== 'personalizado') return '';
      const d = state.desdePersonalizado || '', a = state.atePersonalizado || '';
      return (d ? '&desde='+encodeURIComponent(d) : '') + (a ? '&ate='+encodeURIComponent(a) : '');
    }

    return { state, onChange, refreshEmpresas: carregarEmpresas, periodoExtra, periodoLabel };
  })();

  /* ---------- SINCRONIZAÇÃO AUTOMÁTICA DO MERCADO LIVRE (indicador discreto) ----------
     A sincronização em si acontece 100% no servidor (ver server/lib/syncScheduler.js —
     um setInterval de 1 minuto rodando no processo Node, nunca no navegador). Este bloco
     só LÊ o status já calculado pelo servidor (GET /status-automatico) pra mostrar
     "Sincronizado há Xs" no header — o navegador nunca sincroniza nada, mesmo usando um
     setInterval aqui: um é só pra reler um status pronto, o outro (proibido) seria pra
     fazer a sincronização de verdade a partir do front-end. */
  (function(){
    let ultimoStatus = null;

    function fmtRelativo(iso){
      if(!iso) return null;
      const diffMs = Date.now() - new Date(iso).getTime();
      const seg = Math.max(0, Math.round(diffMs/1000));
      if(seg < 60) return 'Sincronizado há ' + seg + (seg===1?' segundo':' segundos');
      const min = Math.round(seg/60);
      if(min < 60) return 'Sincronizado há ' + min + (min===1?' minuto':' minutos');
      try{
        return 'Última sincronização: ' + new Date(iso).toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
      }catch(e){ return null; }
    }

    function render(){
      const wrap = document.getElementById('mlSyncStatus');
      const dot = document.getElementById('mlSyncDot');
      const txt = document.getElementById('mlSyncText');
      if(!wrap || !txt || !ultimoStatus) return;

      wrap.style.display = 'flex';
      wrap.classList.remove('ok','erro');

      if(ultimoStatus.emExecucao){
        txt.textContent = 'Sincronizando…';
      } else if(ultimoStatus.ultimoCicloOk === false){
        wrap.classList.add('erro');
        txt.textContent = 'Erro na sincronização';
        const detalhe = (ultimoStatus.contasComErro||[]).map(c=>c.erro).join(' | ') || ultimoStatus.ultimoErroGeral;
        wrap.title = detalhe ? ('Erro na sincronização automática: ' + detalhe) : 'Erro na sincronização automática.';
      } else if(ultimoStatus.ultimaExecucaoEm){
        wrap.classList.add('ok');
        txt.textContent = fmtRelativo(ultimoStatus.ultimaExecucaoEm) || '—';
        wrap.title = 'Sincronização automática ativa (a cada ' + (ultimoStatus.intervaloSegundos||60) + 's) — última verificação: ' + new Date(ultimoStatus.ultimaExecucaoEm).toLocaleString('pt-BR');
      } else {
        txt.textContent = 'Aguardando 1ª sincronização…';
      }
    }

    async function buscarStatus(){
      try{
        const res = await fetch('/api/integracoes/mercadolivre/status-automatico');
        if(!res.ok) return;
        ultimoStatus = await res.json();
        render();
      }catch(e){ /* falha de rede ao buscar o status não deve gerar erro visível — tenta de novo no próximo tick */ }
    }

    async function iniciar(){
      try{
        const res = await fetch('/api/integracoes/mercadolivre/config-status');
        const body = await res.json();
        if(!body || !body.configurado) return; // ML não configurado neste ambiente — não mostra o indicador
      }catch(e){ return; }

      await buscarStatus();
      setInterval(render, 5000);        // só recalcula o texto relativo ("há Xs") — nenhuma chamada de rede
      setInterval(buscarStatus, 20000);  // relê o status já pronto do servidor — nunca dispara sincronização
    }

    iniciar();
  })();

  /* ---------- THEME TOGGLE ---------- */
  const root = document.documentElement;
  function currentTheme(){
    const stamped = root.getAttribute('data-theme');
    if(stamped) return stamped;
    // Espelha a estrutura do CSS (ver TOKENS): claro é o padrão agora,
    // escuro só quando o sistema operacional pedir isso explicitamente —
    // mesma relação que existia antes, só com os papéis invertidos.
    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  try{
    const saved = localStorage.getItem('cerne.theme');
    if(saved === 'light' || saved === 'dark') root.setAttribute('data-theme', saved);
  }catch(e){}
  document.getElementById('themeToggle').addEventListener('click', ()=>{
    const next = currentTheme() === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try{ localStorage.setItem('cerne.theme', next); }catch(e){}
  });

  /* ================= EMPRESAS (dados reais via API) ================= */
  (function(){
    const state = { items:[], loading:false, error:null, status:'todas', search:'' };

    function toast(message, type){
      const wrap = document.getElementById('toastWrap');
      const el = document.createElement('div');
      el.className = 'toast ' + (type||'success');
      el.innerHTML = svg(type==='error' ? 'alertCircle':'checkCircle') + '<span>'+message+'</span>';
      wrap.appendChild(el);
      setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .25s'; setTimeout(()=>el.remove(),250); }, 3200);
    }

    async function api(path, opts){
      const res = await fetch('/api/empresas'+path, {
        headers:{'Content-Type':'application/json'},
        ...opts,
      });
      let body = null;
      try{ body = await res.json(); }catch(e){}
      if(!res.ok){
        const err = new Error((body && (body.error || 'Falha na requisição')) || 'Falha na requisição');
        err.status = res.status; err.errors = body && body.errors;
        throw err;
      }
      return body;
    }

    async function load(){
      state.loading = true; state.error = null; render();
      try{
        const qs = state.status !== 'todas' ? ('?status='+state.status) : '';
        const data = await api(qs, { method:'GET' });
        state.items = data.empresas;
      }catch(err){
        state.error = err.message || 'Não foi possível carregar as empresas.';
      }finally{
        state.loading = false; render();
      }
    }

    function filteredItems(){
      const q = state.search.trim().toLowerCase();
      if(!q) return state.items;
      return state.items.filter(e =>
        e.razaoSocial.toLowerCase().includes(q) ||
        (e.nomeFantasia||'').toLowerCase().includes(q) ||
        e.cnpj.includes(q.replace(/\D/g,''))
      );
    }

    function fmtDate(iso){
      try{ return new Date(iso).toLocaleDateString('pt-BR'); }catch(e){ return '—'; }
    }

    function render(){
      const root = document.getElementById('empresasRoot');
      if(!root) return;

      let html = '<div class="toolbar">'
        + '<div class="seg" id="empSeg">'
          + ['todas','ativas','inativas'].map(s=>'<button data-status="'+s+'" class="'+(state.status===s?'active':'')+'">'+(s[0].toUpperCase()+s.slice(1))+'</button>').join('')
        + '</div>'
        + '<div class="search-box">'+svg('search')+'<input type="text" id="empSearch" placeholder="Buscar por razão social, fantasia ou CNPJ" value="'+state.search.replace(/"/g,'&quot;')+'"></div>'
      + '</div>';

      if(state.loading){
        html += '<div class="table-card"><div class="table-skel"><span class="spin"></span><span>Carregando empresas…</span></div></div>';
      } else if(state.error){
        html += '<div class="empty-panel"><div class="empty-icon" style="color:var(--danger); background:var(--danger-soft);">'+svg('alertCircle')+'</div>'
          + '<h2 style="color:var(--danger);">Não foi possível carregar</h2><p class="lead">'+state.error+'</p>'
          + '<button class="ghost-btn" id="empRetry" style="cursor:pointer; opacity:1;">'+svg('activity')+'<span>Tentar novamente</span></button></div>';
      } else {
        const items = filteredItems();
        if(!state.items.length){
          html += '<div class="empty-panel"><div class="empty-icon">'+svg('building')+'</div>'
            + '<h2>Nenhuma empresa cadastrada</h2>'
            + '<p class="lead">Cadastre a primeira empresa (CNPJ, razão social e nome fantasia) para começar a organizar o grupo dentro do PF Embalagens.</p>'
            + '<button class="primary-btn enabled" id="empEmptyNew" type="button">'+svg('plus')+'<span>Cadastrar empresa</span></button></div>';
        } else if(!items.length){
          html += '<div class="empty-panel"><div class="empty-icon">'+svg('search')+'</div><h2>Nada encontrado</h2><p class="lead">Nenhuma empresa corresponde à busca "'+state.search+'".</p></div>';
        } else {
          html += '<div class="table-card"><div class="table-wrap"><table class="data-table"><thead><tr>'
            + '<th>Empresa</th><th>CNPJ</th><th>Status</th><th>Cadastrada em</th><th></th>'
            + '</tr></thead><tbody>'
            + items.map(e => '<tr class="'+(e.ativo?'':'inactive')+'">'
              + '<td><div class="company-name">'+escapeHtml(e.razaoSocial)+'</div>'+(e.nomeFantasia?'<div class="company-fantasy">'+escapeHtml(e.nomeFantasia)+'</div>':'')+'</td>'
              + '<td class="mono">'+e.cnpjFormatado+'</td>'
              + '<td>'+(e.ativo ? '<span class="badge-status on"><span class="dot"></span>Ativa</span>' : '<span class="badge-status off"><span class="dot"></span>Inativa</span>')+'</td>'
              + '<td class="tab-nums">'+fmtDate(e.criadoEm)+'</td>'
              + '<td><div class="row-actions">'
                + '<button class="row-ic-btn" data-edit="'+e.id+'" title="Editar" type="button">'+svg('edit')+'</button>'
                + '<button class="row-ic-btn '+(e.ativo?'danger':'success')+'" data-toggle="'+e.id+'" data-next="'+(!e.ativo)+'" title="'+(e.ativo?'Desativar':'Ativar')+'" type="button">'+svg('power')+'</button>'
              + '</div></td>'
            + '</tr>').join('')
            + '</tbody></table></div></div>';
        }
      }

      root.innerHTML = html;

      const seg = document.getElementById('empSeg');
      if(seg) seg.querySelectorAll('button').forEach(b=> b.addEventListener('click', ()=>{ state.status = b.dataset.status; load(); }));
      const search = document.getElementById('empSearch');
      if(search) search.addEventListener('input', ()=>{ state.search = search.value; render(); const el=document.getElementById('empSearch'); if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); } });
      const retry = document.getElementById('empRetry');
      if(retry) retry.addEventListener('click', load);
      const emptyNew = document.getElementById('empEmptyNew');
      if(emptyNew) emptyNew.addEventListener('click', ()=> openModal());
      root.querySelectorAll('[data-edit]').forEach(b=> b.addEventListener('click', ()=>{
        const emp = state.items.find(e=> String(e.id)===b.dataset.edit);
        openModal(emp);
      }));
      root.querySelectorAll('[data-toggle]').forEach(b=> b.addEventListener('click', async ()=>{
        const id = b.dataset.toggle, next = b.dataset.next === 'true';
        b.disabled = true;
        try{
          await api('/'+id+'/status', { method:'PATCH', body: JSON.stringify({ ativo: next }) });
          toast(next ? 'Empresa ativada.' : 'Empresa desativada.');
          load();
        }catch(err){ toast(err.message, 'error'); b.disabled = false; }
      }));
    }

    function escapeHtml(s){
      return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function maskCNPJ(v){
      const d = v.replace(/\D/g,'').slice(0,14);
      let out = d;
      if(d.length > 12) out = d.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{0,2})/, '$1.$2.$3/$4-$5');
      else if(d.length > 8) out = d.replace(/(\d{2})(\d{3})(\d{3})(\d{0,4})/, '$1.$2.$3/$4');
      else if(d.length > 5) out = d.replace(/(\d{2})(\d{3})(\d{0,3})/, '$1.$2.$3');
      else if(d.length > 2) out = d.replace(/(\d{2})(\d{0,3})/, '$1.$2');
      return out;
    }

    function openModal(empresa){
      const isEdit = !!empresa;
      const modalRoot = document.getElementById('modalRoot');
      modalRoot.innerHTML = '<div class="modal-overlay" id="modalOverlay">'
        + '<div class="modal-card">'
          + '<div class="modal-head"><div class="modal-title">'+(isEdit?'Editar empresa':'Nova empresa')+'</div>'
            + '<button class="row-ic-btn" id="modalClose" type="button">'+svg('x')+'</button></div>'
          + '<div class="modal-sub">'+(isEdit?'Atualize os dados cadastrais da empresa.':'Preencha os dados para cadastrar uma nova empresa/CNPJ no grupo.')+'</div>'
          + '<form id="empForm">'
            + '<div class="field"><label>CNPJ</label><input type="text" inputmode="numeric" id="fCnpj" placeholder="00.000.000/0000-00" value="'+(isEdit?maskCNPJ(empresa.cnpj):'')+'" maxlength="18">'
              + '<div class="field-error" id="eCnpj" style="display:none;"></div></div>'
            + '<div class="field"><label>Razão social</label><input type="text" id="fRazao" placeholder="Razão social conforme CNPJ" value="'+(isEdit?escapeHtml(empresa.razaoSocial):'')+'" maxlength="200">'
              + '<div class="field-error" id="eRazao" style="display:none;"></div></div>'
            + '<div class="field"><label>Nome fantasia <span class="opt">(opcional)</span></label><input type="text" id="fFantasia" placeholder="Nome usado no dia a dia" value="'+(isEdit?escapeHtml(empresa.nomeFantasia||''):'')+'" maxlength="200"></div>'
            + (isEdit ? '<div class="toggle-row"><div><div class="toggle-row-label">Empresa ativa</div><div class="toggle-row-sub">Empresas inativas ficam ocultas nas seleções do sistema.</div></div>'
              + '<button type="button" class="toggle '+(empresa.ativo?'on':'')+'" id="fAtivo" data-on="'+(empresa.ativo?'true':'false')+'"></button></div>' : '')
            + '<div class="modal-actions">'
              + '<button type="button" class="btn-secondary" id="modalCancel">Cancelar</button>'
              + '<button type="submit" class="btn-primary" id="modalSave">'+svg('check')+'<span>'+(isEdit?'Salvar alterações':'Cadastrar empresa')+'</span></button>'
            + '</div>'
          + '</form>'
        + '</div>'
      + '</div>';

      const overlay = document.getElementById('modalOverlay');
      const close = ()=> modalRoot.innerHTML = '';
      overlay.addEventListener('click', (e)=>{ if(e.target === overlay) close(); });
      document.getElementById('modalClose').addEventListener('click', close);
      document.getElementById('modalCancel').addEventListener('click', close);

      const cnpjInput = document.getElementById('fCnpj');
      cnpjInput.addEventListener('input', ()=>{ cnpjInput.value = maskCNPJ(cnpjInput.value); });
      cnpjInput.focus();

      const toggleBtn = document.getElementById('fAtivo');
      if(toggleBtn) toggleBtn.addEventListener('click', ()=>{
        const on = toggleBtn.dataset.on !== 'true';
        toggleBtn.dataset.on = String(on);
        toggleBtn.classList.toggle('on', on);
      });

      document.getElementById('empForm').addEventListener('submit', async (e)=>{
        e.preventDefault();
        ['eCnpj','eRazao'].forEach(id=>{ const el=document.getElementById(id); el.style.display='none'; el.textContent=''; });
        document.getElementById('fCnpj').classList.remove('invalid');
        document.getElementById('fRazao').classList.remove('invalid');

        const payload = {
          cnpj: document.getElementById('fCnpj').value,
          razaoSocial: document.getElementById('fRazao').value,
          nomeFantasia: document.getElementById('fFantasia').value,
        };
        if(isEdit && toggleBtn) payload.ativo = toggleBtn.dataset.on === 'true';

        const saveBtn = document.getElementById('modalSave');
        saveBtn.disabled = true;
        try{
          if(isEdit) await api('/'+empresa.id, { method:'PUT', body: JSON.stringify(payload) });
          else await api('', { method:'POST', body: JSON.stringify(payload) });
          close();
          toast(isEdit ? 'Empresa atualizada.' : 'Empresa cadastrada.');
          load();
        }catch(err){
          saveBtn.disabled = false;
          if(err.errors){
            if(err.errors.cnpj){ const el=document.getElementById('eCnpj'); el.textContent=err.errors.cnpj; el.style.display='block'; document.getElementById('fCnpj').classList.add('invalid'); }
            if(err.errors.razaoSocial){ const el=document.getElementById('eRazao'); el.textContent=err.errors.razaoSocial; el.style.display='block'; document.getElementById('fRazao').classList.add('invalid'); }
          } else {
            toast(err.message, 'error');
          }
        }
      });
    }

    document.getElementById('btnNewEmpresa').addEventListener('click', ()=> openModal());

    window.Empresas = { load };
  })();

  /* ================= MARKETPLACES — Mercado Livre e Shopee (OAuth real) =================
     Shopee (25/08/2026): mesmo desenho do Mercado Livre acima — botão "Conectar
     Shopee" -> autorização oficial da Shopee Open Platform -> volta conectado.

     simples logo abaixo do card, só com os campos reais que a Shopee manda
     (nenhum cálculo de margem/comissão/frete ainda — isso é Fase 2, ver

     do seletor de Empresa, pra não misturar com números que o usuário já
     usa hoje. */
  (function(){
    const state = {
      empresas:[], empresaId:null, loadingEmpresas:false, conta:null, loadingConta:false, syncing:false, configurado:null, syncResult:null,
      contaShopee:null, loadingContaShopee:false, configuradoShopee:null, renovandoShopee:false,
      syncingShopee:false, syncResultShopee:null, pedidosShopee:[], loadingPedidosShopee:false,
    };

    function toast(message, type){
      const wrap = document.getElementById('toastWrap');
      const el = document.createElement('div');
      el.className = 'toast ' + (type||'success');
      el.innerHTML = svg(type==='error' ? 'alertCircle':'checkCircle') + '<span>'+message+'</span>';
      wrap.appendChild(el);
      setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .25s'; setTimeout(()=>el.remove(),250); }, 4200);
    }

    function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function fmtDateTime(iso){ if(!iso) return null; try{ return new Date(iso).toLocaleString('pt-BR'); }catch(e){ return null; } }

    async function apiEmpresasAtivas(){
      const res = await fetch('/api/empresas?status=ativas');
      const body = await res.json();
      return (body && body.empresas) || [];
    }
    async function apiMl(path, opts){
      const res = await fetch('/api/integracoes/mercadolivre'+path, { headers:{'Content-Type':'application/json'}, ...opts });
      let body = null; try{ body = await res.json(); }catch(e){}
      if(!res.ok){ throw new Error((body && body.error) || 'Falha na requisição.'); }
      return body;
    }
    async function apiShopee(path, opts){
      const res = await fetch('/api/integracoes/shopee'+path, { headers:{'Content-Type':'application/json'}, ...opts });
      let body = null; try{ body = await res.json(); }catch(e){}
      if(!res.ok){ throw new Error((body && body.error) || 'Falha na requisição.'); }
      return body;
    }

    async function loadContaDaEmpresa(){
      state.loadingConta = true; render();
      try{
        const data = await apiMl('?empresaId='+state.empresaId);
        state.conta = (data.contas && data.contas[0]) || null;
      }catch(e){ state.conta = null; }
      state.loadingConta = false; render();
    }
    async function loadContaShopeeDaEmpresa(){
      state.loadingContaShopee = true; render();
      try{
        const data = await apiShopee('?empresaId='+state.empresaId);
        state.contaShopee = (data.contas && data.contas[0]) || null;
      }catch(e){ state.contaShopee = null; }
      state.loadingContaShopee = false; render();
      if(state.contaShopee) await loadPedidosShopee();
      else state.pedidosShopee = [];
    }

    // Fase 1 da sincronização de pedidos da Shopee (14/09/2026) — só lista o
    // que já foi sincronizado (real, sem cálculo nenhum); não dispara sync.
    async function loadPedidosShopee(){
      if(!state.contaShopee) return;
      state.loadingPedidosShopee = true; render();
      try{
        const data = await apiShopee('/'+state.contaShopee.id+'/pedidos');
        state.pedidosShopee = (data && data.pedidos) || [];
      }catch(e){ state.pedidosShopee = []; }
      state.loadingPedidosShopee = false; render();
    }

    async function load(queryStr){
      if(queryStr){
        const params = new URLSearchParams(queryStr);
        if(params.get('ml') === 'success') toast('Mercado Livre conectado com sucesso.');
        else if(params.get('ml') === 'error') toast(params.get('msg') || 'Não foi possível conectar o Mercado Livre.', 'error');
        if(params.get('shopee') === 'success') toast('Shopee conectada com sucesso.');
        else if(params.get('shopee') === 'error') toast(params.get('msg') || 'Não foi possível conectar a Shopee.', 'error');
      }
      state.loadingEmpresas = true; render();
      try{
        state.empresas = await apiEmpresasAtivas();
        if(!state.empresaId || !state.empresas.find(e=>e.id===state.empresaId)){
          state.empresaId = state.empresas.length ? state.empresas[0].id : null;
        }
      }catch(e){ state.empresas = []; }
      state.loadingEmpresas = false;
      try{ state.configurado = (await fetch('/api/integracoes/mercadolivre/config-status').then(r=>r.json())).configurado; }
      catch(e){ state.configurado = null; }
      try{ state.configuradoShopee = (await fetch('/api/integracoes/shopee/config-status').then(r=>r.json())).configurado; }
      catch(e){ state.configuradoShopee = null; }
      if(state.empresaId){ await Promise.all([loadContaDaEmpresa(), loadContaShopeeDaEmpresa()]); } else render();
    }

    function statusBadge(status){
      if(status === 'ativa') return '<span class="badge-status on"><span class="dot"></span>Conectada</span>';
      if(status === 'erro') return '<span class="badge-status err"><span class="dot"></span>Erro na conexão</span>';
      return '<span class="badge-status off"><span class="dot"></span>Desconectada</span>';
    }

    function render(){
      const root = document.getElementById('marketplacesRoot');
      if(!root) return;

      if(!state.loadingEmpresas && !state.empresas.length){
        root.innerHTML = '<div class="empty-panel"><div class="empty-icon">'+svg('building')+'</div>'
          + '<h2>Nenhuma empresa ativa</h2>'
          + '<p class="lead">Cadastre e ative pelo menos uma empresa em <strong>Cadastros → Empresas</strong> antes de conectar uma conta do Mercado Livre.</p></div>';
        return;
      }

      let html = '<div class="empresa-picker"><label>Empresa</label><select id="mlEmpresaSelect">'
        + state.empresas.map(e=>'<option value="'+e.id+'" '+(e.id===state.empresaId?'selected':'')+'>'+escapeHtml(e.nomeFantasia||e.razaoSocial)+'</option>').join('')
        + '</select></div>';

      if(state.configurado === false){
        html += '<div class="empty-panel" style="margin-bottom:16px;"><div class="empty-icon" style="color:var(--warning); background:var(--warning-soft);">'+svg('alertCircle')+'</div>'
          + '<h2 style="color:var(--warning);">Integração ainda não configurada</h2>'
          + '<p class="lead">O aplicativo do Mercado Livre (Client ID/Secret) ainda não foi configurado neste ambiente.</p></div>';
      }

      if(state.loadingConta){
        html += '<div class="table-card"><div class="table-skel"><span class="spin"></span><span>Carregando conexão…</span></div></div>';
      } else if(state.conta){
        const c = state.conta;
        html += '<div class="conn-card-real">'
          + '<div class="cc-left"><div class="cc-ic">'+svg('store')+'</div><div>'
            + '<div class="cc-nick">'+escapeHtml(c.nickname || ('Usuário '+c.mlUserId))+'</div>'
            + '<div class="cc-sub">Mercado Livre'+(c.siteId?(' · '+c.siteId):'')+' · ID '+c.mlUserId+'</div>'
          + '</div></div>'

          toast(result.importados+' pedido(s) da Shopee importados/atualizados.'+(result.erros.length? (' '+result.erros.length+' com erro — veja o console do servidor.'):''), result.erros.length?'error':'success');
