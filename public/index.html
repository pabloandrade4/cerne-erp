  /* ================= PRODUTOS — cadastro simples, por empresa =================
     Nome, SKU, custo e status — e a alíquota de imposto da empresa (movida
     pra cá em 24/08/2026, junto com a extinção da aba separada "Custo &
     Margem"; ver docs/02-decisoes.md). Sem kits/composição/estoque
     automático ainda. Esta é a fonte de custo por SKU usada no cálculo de
     margem das vendas (lib/relatorioVendas.js) — mas a MARGEM em si nunca
     aparece nesta tela, só em Pedidos/Visão Geral/Financeiro/Relatórios. */
  (function(){
    const state = { empresas:[], empresaId:null, loadingEmpresas:false, items:[], loading:false, error:null, status:'todos', search:'',
      aliquota:0, loadingAliquota:false, savingAliquota:false };

    function toast(message, type){
      const wrap = document.getElementById('toastWrap');
      const el = document.createElement('div');
      el.className = 'toast ' + (type||'success');
      el.innerHTML = svg(type==='error' ? 'alertCircle':'checkCircle') + '<span>'+message+'</span>';
      wrap.appendChild(el);
      setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .25s'; setTimeout(()=>el.remove(),250); }, 3200);
    }
    function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function money(v){ return 'R$ ' + Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2}); }
    function fmtDate(iso){ try{ return new Date(iso).toLocaleDateString('pt-BR'); }catch(e){ return '—'; } }

    async function apiEmpresasAtivas(){
      const res = await fetch('/api/empresas?status=ativas');
      return ((await res.json()).empresas) || [];
    }
    async function api(path, opts){
      const res = await fetch('/api/produtos'+path, { headers:{'Content-Type':'application/json'}, ...opts });
      let body = null; try{ body = await res.json(); }catch(e){}
      if(!res.ok){ const err = new Error((body&&body.error)||'Falha na requisição.'); err.errors = body&&body.errors; throw err; }
      return body;
    }
    // 14/09/2026, pedido explícito do usuário: "como podemos fazer para
    // puxar o sku com o custo direto" — SKUs que já apareceram em pedidos
    // reais (Mercado Livre + Shopee) desta empresa mas ainda não têm
    // produto cadastrado (ver rota em routes/produtos.js). Usado só pra
    // sugerir no cadastro/edição de produto — nunca preenche nada sozinho,
    // o usuário sempre escolhe/confirma antes de salvar.
    async function apiSugestoesSku(empresaId){
      const res = await fetch('/api/produtos/sugestoes-sku?empresaId='+empresaId);
      const body = await res.json().catch(()=>({}));
      return (body && body.sugestoes) || [];
    }
    async function apiConfig(path, opts){
      const res = await fetch('/api/config-financeiro'+path, { headers:{'Content-Type':'application/json'}, ...opts });
      let body = null; try{ body = await res.json(); }catch(e){}
      if(!res.ok){ const err = new Error((body&&body.error)||'Falha na requisição.'); err.errors = body&&body.errors; throw err; }
      return body;
    }

    async function loadItens(){
      state.loading = true; state.error = null; render();
      try{
        const params = new URLSearchParams({ empresaId: state.empresaId });
        if(state.status !== 'todos') params.set('status', state.status);
        if(state.search.trim()) params.set('search', state.search.trim());
        const data = await api('?'+params.toString(), { method:'GET' });
        state.items = data.produtos;
      }catch(err){ state.error = err.message || 'Não foi possível carregar os produtos.'; }
      finally{ state.loading = false; render(); }
    }

    async function loadAliquota(){
      state.loadingAliquota = true; render();
      try{
        const data = await apiConfig('/'+state.empresaId, { method:'GET' });
        state.aliquota = data.aliquotaImposto;
      }catch(err){ toast(err.message, 'error'); }
      finally{ state.loadingAliquota = false; render(); }
    }

    async function load(){
      state.loadingEmpresas = true; render();
      try{
        state.empresas = await apiEmpresasAtivas();
        if(!state.empresaId || !state.empresas.find(e=>e.id===state.empresaId)){
          state.empresaId = state.empresas.length ? state.empresas[0].id : null;
        }
      }catch(e){ state.empresas = []; }
      state.loadingEmpresas = false;
      if(state.empresaId) await Promise.all([loadItens(), loadAliquota()]); else render();
    }

    function render(){
      const root = document.getElementById('produtosRoot');
      if(!root) return;

      if(!state.loadingEmpresas && !state.empresas.length){
        root.innerHTML = '<div class="empty-panel"><div class="empty-icon">'+svg('building')+'</div>'
          + '<h2>Nenhuma empresa ativa</h2>'
          + '<p class="lead">Cadastre e ative uma empresa em <strong>Cadastros → Empresas</strong> antes de cadastrar produtos.</p></div>';
        return;
      }

      let html = '<div class="empresa-picker"><label>Empresa</label><select id="prdEmpresaSelect">'
        + state.empresas.map(e=>'<option value="'+e.id+'" '+(e.id===state.empresaId?'selected':'')+'>'+escapeHtml(e.nomeFantasia||e.razaoSocial)+'</option>').join('')
      + '</select></div>';

      html += '<div class="section-label"><span>Imposto configurado</span></div>'
        + '<div class="inline-form">'
          + '<div class="field narrow"><label>Alíquota de imposto (%)</label><input type="text" inputmode="decimal" id="prdAliquota" value="'+(state.loadingAliquota?'':state.aliquota)+'"></div>'
          + '<button class="btn-primary" id="prdSaveAliquota" type="button">'+svg('check')+'<span>Salvar</span></button>'
          + '<div class="field-hint" style="margin:0;">Percentual aplicado sobre o valor de cada venda, para todos os produtos desta empresa. Não vem do Mercado Livre — é uma configuração do ERP.</div>'
        + '</div>';

      html += '<div class="section-label"><span>Produtos cadastrados</span></div>'
        + '<div class="toolbar">'
          + '<button class="ghost-btn" id="prdCustosPlanilha" type="button" style="cursor:pointer;opacity:1;">'+svg('download')+'<span>Atualizar custos por planilha</span></button>'
          + '<div class="seg" id="prdSeg">'
            + [['todos','Todos'],['ativos','Ativos'],['inativos','Inativos']].map(function(par){ return '<button data-status="'+par[0]+'" class="'+(state.status===par[0]?'active':'')+'">'+par[1]+'</button>'; }).join('')
          + '</div>'
          + '<div class="search-box">'+svg('search')+'<input type="text" id="prdSearch" placeholder="Buscar por nome ou SKU" value="'+state.search.replace(/"/g,'&quot;')+'"></div>'
        + '</div>';

      if(state.loading){
        html += '<div class="table-card"><div class="table-skel"><span class="spin"></span><span>Carregando produtos…</span></div></div>';
      } else if(state.error){
        html += '<div class="empty-panel"><div class="empty-icon" style="color:var(--danger); background:var(--danger-soft);">'+svg('alertCircle')+'</div>'
          + '<h2 style="color:var(--danger);">Não foi possível carregar</h2><p class="lead">'+escapeHtml(state.error)+'</p>'
          + '<button class="ghost-btn" id="prdRetry" style="cursor:pointer; opacity:1;">'+svg('activity')+'<span>Tentar novamente</span></button></div>';
      } else if(!state.items.length){
        const filtrado = !!(state.search || state.status!=='todos');
        html += '<div class="empty-panel"><div class="empty-icon">'+svg('box')+'</div>'
          + '<h2>Nenhum produto encontrado</h2>'
          + '<p class="lead">'+(filtrado ? 'Nenhum produto corresponde ao filtro atual.' : 'Cadastre o primeiro produto (nome, SKU e custo) para começar o catálogo desta empresa.')+'</p>'
          + (filtrado ? '' : '<button class="primary-btn enabled" id="prdEmptyNew" type="button">'+svg('plus')+'<span>Cadastrar produto</span></button>')
        + '</div>';
      } else {
        html += '<div class="table-card"><div class="table-wrap"><table class="data-table"><thead><tr>'
          + '<th>Produto</th><th>SKU</th><th>Custo</th><th>Status</th><th>Cadastrado em</th><th></th>'
          + '</tr></thead><tbody>'
          + state.items.map(p => '<tr class="'+(p.ativo?'':'inactive')+'">'
            + '<td>'+escapeHtml(p.nome)+'</td>'
            + '<td class="mono">'+escapeHtml(p.sku)+'</td>'
            + '<td class="mono">'+money(p.custo)+'</td>'
            + '<td>'+(p.ativo ? '<span class="badge-status on"><span class="dot"></span>Ativo</span>' : '<span class="badge-status off"><span class="dot"></span>Inativo</span>')+'</td>'
            + '<td class="tab-nums">'+fmtDate(p.criadoEm)+'</td>'
            + '<td><div class="row-actions">'
              + '<button class="row-ic-btn" data-edit="'+p.id+'" title="Editar" type="button">'+svg('edit')+'</button>'
              + '<button class="row-ic-btn '+(p.ativo?'danger':'success')+'" data-toggle="'+p.id+'" data-next="'+(!p.ativo)+'" title="'+(p.ativo?'Desativar':'Ativar')+'" type="button">'+svg('power')+'</button>'
            + '</div></td>'
          + '</tr>').join('')
          + '</tbody></table></div></div>';
      }

      root.innerHTML = html;

      const sel = document.getElementById('prdEmpresaSelect');
      if(sel) sel.addEventListener('change', ()=>{ state.empresaId = Number(sel.value); loadItens(); loadAliquota(); });
      const saveAliquota = document.getElementById('prdSaveAliquota');
      if(saveAliquota) saveAliquota.addEventListener('click', async ()=>{
        const val = Number(String(document.getElementById('prdAliquota').value).replace(',','.'));
        if(!Number.isFinite(val) || val<0 || val>100){ toast('Informe um percentual entre 0 e 100.', 'error'); return; }
        saveAliquota.disabled = true;
        try{
          await apiConfig('/'+state.empresaId, { method:'PUT', body: JSON.stringify({ aliquotaImposto: val }) });
          state.aliquota = val;
          toast('Alíquota de imposto salva.');
        }catch(err){ toast(err.message, 'error'); }
        saveAliquota.disabled = false;
      });
      const btnCustosPlanilha = document.getElementById('prdCustosPlanilha');
      if(btnCustosPlanilha) btnCustosPlanilha.addEventListener('click', abrirModalCustosPlanilha);
      const seg = document.getElementById('prdSeg');
      if(seg) seg.querySelectorAll('button').forEach(b=> b.addEventListener('click', ()=>{ state.status = b.dataset.status; loadItens(); }));
      const search = document.getElementById('prdSearch');
      if(search) search.addEventListener('input', ()=>{
        state.search = search.value;
        clearTimeout(search._t);
        search._t = setTimeout(loadItens, 300);
      });
      const retry = document.getElementById('prdRetry');
      if(retry) retry.addEventListener('click', loadItens);
      const emptyNew = document.getElementById('prdEmptyNew');
      if(emptyNew) emptyNew.addEventListener('click', ()=> openModal());
      root.querySelectorAll('[data-edit]').forEach(b=> b.addEventListener('click', ()=>{
        const p = state.items.find(x=> String(x.id)===b.dataset.edit);
        openModal(p);
      }));
      root.querySelectorAll('[data-toggle]').forEach(b=> b.addEventListener('click', async ()=>{
        const id = b.dataset.toggle, next = b.dataset.next === 'true';
        b.disabled = true;
        try{
          await api('/'+id+'/status', { method:'PATCH', body: JSON.stringify({ ativo: next }) });
          toast(next ? 'Produto ativado.' : 'Produto desativado.');
          loadItens();
        }catch(err){ toast(err.message, 'error'); b.disabled = false; }
      }));
    }

    function openModal(produto){
      const isEdit = !!produto;
      const modalRoot = document.getElementById('modalRoot');
      modalRoot.innerHTML = '<div class="modal-overlay" id="modalOverlay">'
        + '<div class="modal-card">'
          + '<div class="modal-head"><div class="modal-title">'+(isEdit?'Editar produto':'Novo produto')+'</div>'
            + '<button class="row-ic-btn" id="modalClose" type="button">'+svg('x')+'</button></div>'
          + '<div class="modal-sub">'+(isEdit?'Atualize os dados do produto.':'Preencha os dados para cadastrar um novo produto no catálogo desta empresa.')+'</div>'
          + '<form id="prdForm">'
            + '<div class="field"><label>Nome do produto</label><input type="text" id="fNome" placeholder="Ex: Caixa de papelão 50x24x15" value="'+(isEdit?escapeHtml(produto.nome):'')+'" maxlength="200">'
              + '<div class="field-error" id="eNome" style="display:none;"></div></div>'
            + '<div class="field"><label>SKU</label><input type="text" id="fSku" list="skuSugestoesList" placeholder="Ex: CX-50X24X15" value="'+(isEdit?escapeHtml(produto.sku):'')+'" maxlength="100">'
              + '<datalist id="skuSugestoesList"></datalist>'
              + '<div class="field-hint" id="skuSugestoesHint" style="margin-top:4px;"></div>'
              + '<div class="field-error" id="eSku" style="display:none;"></div></div>'
            + '<div class="field"><label>Custo (R$)</label><input type="text" inputmode="decimal" id="fCusto" placeholder="0,00" value="'+(isEdit?String(produto.custo).replace('.',','):'')+'">'
              + '<div class="field-error" id="eCusto" style="display:none;"></div></div>'
            + (isEdit ? '<div class="toggle-row"><div><div class="toggle-row-label">Produto ativo</div><div class="toggle-row-sub">Produtos inativos ficam ocultos nas seleções do sistema.</div></div>'
              + '<button type="button" class="toggle '+(produto.ativo?'on':'')+'" id="fAtivo" data-on="'+(produto.ativo?'true':'false')+'"></button></div>' : '')
            + '<div class="modal-actions">'
              + '<button type="button" class="btn-secondary" id="modalCancel">Cancelar</button>'
              + '<button type="submit" class="btn-primary" id="modalSave">'+svg('check')+'<span>'+(isEdit?'Salvar alterações':'Cadastrar produto')+'</span></button>'
            + '</div>'
          + '</form>'
        + '</div>'
      + '</div>';

      const overlay = document.getElementById('modalOverlay');
      const close = ()=> modalRoot.innerHTML = '';
      overlay.addEventListener('click', (e)=>{ if(e.target === overlay) close(); });
      document.getElementById('modalClose')?.addEventListener('click', close);
      document.getElementById('modalCancel')?.addEventListener('click', close);
      document.getElementById('fNome').focus();

      // Sugestões de SKU puxadas direto dos pedidos (Mercado Livre + Shopee)
      // — pedido explícito do usuário (14/09/2026): evita digitar o SKU na
      // mão e errar (o que faz o custo nunca casar com a venda). Só
      // sugere, nunca preenche nada sem o usuário escolher.
      let sugestoesSku = [];
      const fSkuInput = document.getElementById('fSku');
      const skuHint = document.getElementById('skuSugestoesHint');
      if(skuHint) skuHint.textContent = 'Carregando sugestões de SKU dos pedidos…';
      apiSugestoesSku(state.empresaId).then(function(lista){
        sugestoesSku = lista;
        const datalist = document.getElementById('skuSugestoesList');
        if(!datalist) return; // modal já foi fechado antes da resposta chegar
        if(lista.length){
          datalist.innerHTML = lista.map(function(s){
            return '<option value="'+escapeHtml(s.sku)+'">'+escapeHtml(s.nomeSugerido||s.sku)+' — '+s.qtdPedidos+(s.qtdPedidos===1?' pedido':' pedidos')+' sem custo cadastrado</option>';
          }).join('');
          if(skuHint) skuHint.textContent = 'Comece a digitar pra ver SKUs que já apareceram em pedidos e ainda não têm custo cadastrado — escolher um da lista garante que bate certinho com a venda.';
        } else if(skuHint) {
          skuHint.textContent = isEdit ? '' : 'Nenhum SKU de pedido pendente de custo encontrado no momento — pode digitar o SKU manualmente.';
        }
      }).catch(function(){ if(skuHint) skuHint.textContent = ''; });

      if(fSkuInput && !isEdit){
        fSkuInput.addEventListener('input', function(){
          const sugestao = sugestoesSku.find(function(s){ return s.sku === fSkuInput.value; });
          const fNomeInput = document.getElementById('fNome');
          if(sugestao && sugestao.nomeSugerido && fNomeInput && !fNomeInput.value.trim()){
            fNomeInput.value = sugestao.nomeSugerido;
          }
        });
      }

      const toggleBtn = document.getElementById('fAtivo');
      if(toggleBtn) toggleBtn.addEventListener('click', ()=>{
        const on = toggleBtn.dataset.on !== 'true';
        toggleBtn.dataset.on = String(on);
        toggleBtn.classList.toggle('on', on);
      });

      document.getElementById('prdForm')?.addEventListener('submit', async (e)=>{
        e.preventDefault();
        ['eNome','eSku','eCusto'].forEach(id=>{ const el=document.getElementById(id); el.style.display='none'; el.textContent=''; });
        ['fNome','fSku','fCusto'].forEach(id=> document.getElementById(id).classList.remove('invalid'));

        const payload = {
          empresaId: state.empresaId,
          nome: document.getElementById('fNome').value,
          sku: document.getElementById('fSku').value,
          custo: Number(String(document.getElementById('fCusto').value).replace(',','.')),
        };
        if(isEdit && toggleBtn) payload.ativo = toggleBtn.dataset.on === 'true';

        const saveBtn = document.getElementById('modalSave');
        saveBtn.disabled = true;
        try{
          if(isEdit) await api('/'+produto.id, { method:'PUT', body: JSON.stringify(payload) });
          else await api('', { method:'POST', body: JSON.stringify(payload) });
          close();
          toast(isEdit ? 'Produto atualizado.' : 'Produto cadastrado.');
          loadItens();
        }catch(err){
          saveBtn.disabled = false;
          if(err.errors){
            const fieldMap = { nome:'Nome', sku:'Sku', custo:'Custo' };
            Object.entries(err.errors).forEach(([k,msg])=>{
              const suf = fieldMap[k]; if(!suf) return;
              const el=document.getElementById('e'+suf); if(el){ el.textContent=msg; el.style.display='block'; }
              const input=document.getElementById('f'+suf); if(input) input.classList.add('invalid');
            });
          } else {
            toast(err.message, 'error');
          }
        }
      });
    }

    // ---- Atualizar custos por planilha (02/10/2026, pedido explícito do
    // usuário). 1) baixa a planilha com os produtos atuais; 2) edita a
    // coluna Custo; 3) envia de volta — o sistema mostra uma prévia (o que
    // vai mudar) e só grava quando o usuário confirma. Ver
    // lib/produtosImportacao.js e routes/produtos.js (/custos/*). ----
    function abrirModalCustosPlanilha(){
      if(!state.empresaId){ toast('Selecione uma empresa primeiro.', 'error'); return; }
      const modalRoot = document.getElementById('modalRoot');
      const close = ()=>{ modalRoot.innerHTML=''; };
      let arquivo = null;
      const STATUS_TXT = { atualizar:'Vai atualizar', sem_mudanca:'Sem mudança', nao_encontrado:'SKU não cadastrado', erro:'Erro', ignorada:'Ignorada' };

      function tela(corpo){
        modalRoot.innerHTML = '<div class="modal-overlay" id="modalOverlay"><div class="modal-card wide">'
          + '<div class="modal-head"><div class="modal-title">Atualizar custos por planilha</div><button class="row-ic-btn" id="modalClose" type="button">'+svg('x')+'</button></div>'
          + corpo + '</div></div>';
        document.getElementById('modalClose')?.addEventListener('click', close);
        const ov = document.getElementById('modalOverlay');
        ov.addEventListener('click', (e)=>{ if(e.target===ov) close(); });
      }

      function telaInicial(erro){
        tela('<div class="modal-sub">1) Baixe a planilha com seus produtos atuais · 2) mude só a coluna <strong>Custo</strong> no Excel · 3) envie de volta aqui. Você vê uma prévia antes de gravar qualquer coisa.</div>'
          + '<div style="margin:12px 0;"><a class="ghost-btn" href="/api/produtos/custos/modelo?empresaId='+state.empresaId+'" style="cursor:pointer;opacity:1;">'+svg('download')+'<span>Baixar planilha com meus produtos</span></a></div>'
          + '<div class="field"><label>Planilha preenchida <span class="opt">(.xlsx ou .csv, com colunas SKU e Custo)</span></label><input type="file" id="prdArquivoCustos" accept=".xlsx,.csv"></div>'
          + (erro ? '<div class="field-error" style="display:block;">'+escapeHtml(erro)+'</div>' : '')
          + '<div class="modal-actions"><button type="button" class="btn-secondary" id="modalCancel">Fechar</button>'
          + '<button type="button" class="btn-primary" id="prdAnalisar">'+svg('check')+'<span>Ver prévia</span></button></div>');
        document.getElementById('modalCancel')?.addEventListener('click', close);
        document.getElementById('prdAnalisar')?.addEventListener('click', async ()=>{
          const f = document.getElementById('prdArquivoCustos').files[0];
          if(!f){ telaInicial('Escolha o arquivo da planilha primeiro.'); return; }
          arquivo = f;
          await enviar(false);
        });
      }

      async function enviar(confirmar){
        const btn = document.getElementById('prdAnalisar') || document.getElementById('prdConfirmarCustos');
        if(btn) btn.disabled = true;
        try{
          const res = await fetch('/api/produtos/custos/importar?empresaId='+state.empresaId+'&confirmar='+(confirmar?1:0), { method:'POST', headers:{'Content-Type':'application/octet-stream','X-File-Name':encodeURIComponent(arquivo.name)}, body: arquivo });
          const body = await res.json().catch(()=>({}));
          if(!res.ok) throw new Error(body.error || 'Não foi possível ler a planilha.');
          if(confirmar){ close(); toast(body.atualizados+' custo(s) atualizado(s).'); loadItens(); return; }
          telaPrevia(body);
        }catch(err){ telaInicial(err.message); }
      }

      function telaPrevia(r){
        const s = r.resumo;
        const linhas = r.linhas.filter(l=> l.status!=='sem_mudanca');
        tela('<div class="modal-sub">'+s.aAtualizar+' para atualizar · '+s.semMudanca+' sem mudança · '+s.naoEncontrados+' SKU não cadastrado · '+s.erros+' com erro · '+s.ignoradas+' ignorada(s)</div>'
          + '<div class="table-wrap" style="max-height:340px;overflow:auto;margin-top:8px;"><table class="data-table"><thead><tr><th>Linha</th><th>SKU</th><th>Produto</th><th>Custo atual</th><th>Custo novo</th><th>Situação</th></tr></thead><tbody>'
          + (linhas.length ? linhas.map(l=> '<tr'+(l.status==='atualizar'?'':' style="opacity:.75;"')+'><td class="tab-nums">'+l.linha+'</td><td class="mono">'+escapeHtml(l.sku||'—')+'</td><td>'+escapeHtml(l.nome||'—')+'</td>'
              + '<td class="mono">'+(l.custoAtual!==undefined?money(l.custoAtual):'—')+'</td><td class="mono">'+(l.custoNovo!==undefined?money(l.custoNovo):'—')+'</td>'
              + '<td>'+escapeHtml(STATUS_TXT[l.status]||l.status)+(l.motivo?'<div class="cell-stack-sub">'+escapeHtml(l.motivo)+'</div>':'')+'</td></tr>').join('')
            : '<tr><td colspan="6" style="text-align:center;color:var(--text-faint);padding:18px 0;">Nenhuma mudança encontrada na planilha.</td></tr>')
          + '</tbody></table></div>'
          + '<div class="modal-actions"><button type="button" class="btn-secondary" id="modalCancel">Voltar</button>'
          + (s.aAtualizar ? '<button type="button" class="btn-primary" id="prdConfirmarCustos">'+svg('check')+'<span>Atualizar '+s.aAtualizar+' custo(s)</span></button>' : '')
          + '</div>');
        document.getElementById('modalCancel')?.addEventListener('click', ()=> telaInicial());
        const c = document.getElementById('prdConfirmarCustos');
        if(c) c.addEventListener('click', ()=> enviar(true));
      }

      telaInicial();
    }

    { const b = document.getElementById('btnNewProduto'); if(b) b.addEventListener('click', ()=> openModal()); } // 30/10/2026: guarda — Produtos saiu do menu (Fase 1), o botão pode não existir

    window.Produtos = { load };
  })();

  /* ================= CONTAS A PAGAR — lançamento manual, por empresa =================
     Ativado em 24/08/2026 (ver docs/04-alteracoes.md). Usa o filtro do
     HEADER (empresa + período — window.CerneFiltro) em vez de um seletor
     próprio dentro da tela, igual Visão Geral — pedido explícito do
     usuário nesta etapa ("os filtros de empresa e período do header devem
     funcionar nessas três telas"). "Vencido" é calculado no servidor
     (nunca gravado) — ver server/lib/contasPagar.js. */
  (function(){
    const STATUS_OPCOES = [
      ['pendente','Pendente'],
      ['vencido','Vencido'],
      ['pago','Pago'],
      ['cancelado','Cancelado'],
    ];
    const STATUS_LABEL = Object.fromEntries(STATUS_OPCOES);
    const state = { loading:false, error:null, contas:[], resumo:null, status:'todos', search:'' };

    function toast(message, type){
      const wrap = document.getElementById('toastWrap');
      const el = document.createElement('div');
      el.className = 'toast ' + (type||'success');
      el.innerHTML = svg(type==='error' ? 'alertCircle':'checkCircle') + '<span>'+message+'</span>';
      wrap.appendChild(el);
      setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .25s'; setTimeout(()=>el.remove(),250); }, 3200);
    }
    function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function money(v){ return v===null||v===undefined ? '—' : 'R$ ' + Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2}); }
    function fmtDate(iso){ if(!iso) return '—'; try{ const [y,m,d] = String(iso).slice(0,10).split('-'); return d+'/'+m+'/'+y; }catch(e){ return '—'; } }
    // "Hoje" em America/Sao_Paulo (fuso fixo, UTC-3 — Brasil não usa mais
    // horário de verão desde 2019), mesmo cálculo do backend (lib/periodo.js/
    // diaBRT). NUNCA usar new Date().toISOString().slice(0,10) puro aqui: isso
    // pega o dia em UTC, que já virou o dia seguinte entre 21h e 23h59 no
    // horário de Brasília — a data de vencimento/pagamento sugerida ficaria
    // adiantada em 1 dia bem no fim do dia.
    function hojeBRT(){
      const BRT_OFFSET_MS = 3*60*60*1000;
      const brt = new Date(Date.now() - BRT_OFFSET_MS);
      const p = n => String(n).padStart(2,'0');
      return brt.getUTCFullYear()+'-'+p(brt.getUTCMonth()+1)+'-'+p(brt.getUTCDate());
    }
    function tintVars(tint){ return tint==='muted' ? '--tint:var(--text-muted);--tint-soft:var(--surface-2);' : '--tint:var(--'+tint+');--tint-soft:var(--'+tint+'-soft);'; }
    function secCardHTML(k){
      return '<div class="kpi-sec" style="'+tintVars(k.tint)+'">'
        + '<div class="kpi-sec-icon">'+svg(k.icon)+'</div>'
        + '<div class="kpi-sec-body"><div class="kpi-sec-label">'+k.label+'</div><div class="kpi-sec-value">'+k.valueHtml+'</div></div></div>';
    }
    function statusChipStyle(status){
      const cor = status==='pago' ? 'success' : status==='vencido' ? 'danger' : status==='cancelado' ? 'text-muted' : 'warning';
      const bg = status==='cancelado' ? 'var(--surface-2)' : 'var(--'+cor+'-soft)';
      return 'color:var(--'+cor+');background:'+bg+';';
    }

    async function api(path, opts){
      const res = await fetch('/api/contas-pagar'+path, { headers:{'Content-Type':'application/json'}, ...opts });
      let body = null; try{ body = await res.json(); }catch(e){}
      if(!res.ok){ const err = new Error((body&&(body.error||(body.errors&&body.errors.geral)))||'Falha na requisição.'); err.errors = body&&body.errors; throw err; }
      return body;
    }
    async function apiFornecedoresAtivos(empresaId){
      const res = await fetch('/api/fornecedores?empresaId='+empresaId+'&status=ativos');
      return ((await res.json()).fornecedores) || [];
    }
    // Cadastro real de categorias financeiras (31/08/2026) — substitui a
    // antiga lista fixa de sugestões por texto livre (CATEGORIAS_SUGERIDAS)
    // por um cadastro de verdade, editável por empresa, com um único nível
    // de subcategoria — ver lib/categoriasFinanceiras.js.
    async function apiCategoriasFinanceiras(empresaId, incluirInativas){
      const params = new URLSearchParams({ empresaId: empresaId });
      if(incluirInativas) params.set('incluirInativas','true');
      const res = await fetch('/api/categorias-financeiras?'+params.toString());
      const body = await res.json();
      return body.categorias || [];
    }
    async function apiContasBancariasAtivas(empresaId){
      const res = await fetch('/api/contas-bancarias?empresaId='+empresaId);
      const body = await res.json();
      return ((body.contas)||[]).filter(c=>c.ativo!==false);
    }

    async function loadContas(){
      const filtro = window.CerneFiltro.state;
      if(!filtro.empresaId){ state.contas=[]; state.resumo=null; state.loading=false; render(); return; }
      state.loading = true; state.error = null; render();
      try{
        const params = new URLSearchParams({ empresaId: window.CerneJuntas.param(), periodo: filtro.periodo });
        if(filtro.periodo === 'personalizado'){ if(filtro.desdePersonalizado) params.set('desde', filtro.desdePersonalizado); if(filtro.atePersonalizado) params.set('ate', filtro.atePersonalizado); }
        if(state.status !== 'todos') params.set('status', state.status);
        if(state.search.trim()) params.set('search', state.search.trim());
        const data = await api('?'+params.toString(), { method:'GET' });
        state.contas = data.contas; state.resumo = data.resumo;
      }catch(err){ state.error = err.message || 'Não foi possível carregar as contas a pagar.'; }
      finally{ state.loading = false; render(); }
    }

    function load(){ loadContas(); }

    window.CerneFiltro.onChange(()=>{
      const page = document.getElementById('page-payable');
      if(page && page.classList.contains('active')) loadContas();
      else render();
    });

    function kpisHTML(r){
      const cards = [
        { label:'Total a pagar', icon:'arrowUpCircle', tint:'copper', valueHtml: money(r.totalAPagar) },
        { label:'Vencendo hoje', icon:'clock', tint: r.vencendoHoje>0?'warning':'muted', valueHtml: money(r.vencendoHoje) },
        { label:'Vencidas', icon:'alertCircle', tint: r.vencidas>0?'danger':'muted', valueHtml: money(r.vencidas) },
        { label:'Pagas no período', icon:'checkCircle', tint:'success', valueHtml: money(r.pagasNoPeriodo) },
      ];
      return '<div class="kpi-sec-grid" style="margin-bottom:14px;">' + cards.map(secCardHTML).join('') + '</div>';
    }

    function render(){
      const root = document.getElementById('contasPagarRoot');
      if(!root) return;
      const filtro = window.CerneFiltro.state;

      if(!filtro.loadingEmpresas && !filtro.empresas.length){
        root.innerHTML = '<div class="empty-panel"><div class="empty-icon">'+svg('building')+'</div>'
          + '<h2>Nenhuma empresa ativa</h2>'
          + '<p class="lead">Cadastre e ative uma empresa em <strong>Cadastros → Empresas</strong> antes de lançar contas a pagar.</p></div>';
        return;
      }

      let html = '';
      if(state.resumo) html += kpisHTML(state.resumo);

      html += '<div class="toolbar">'
        + '<div class="seg" id="cpSeg">'
          + [['todos','Todos']].concat(STATUS_OPCOES).map(function(par){ return '<button data-status="'+par[0]+'" class="'+(state.status===par[0]?'active':'')+'">'+par[1]+'</button>'; }).join('')
        + '</div>'
        + '<div class="search-box">'+svg('search')+'<input type="text" id="cpSearch" placeholder="Buscar por CR, descrição, categoria ou fornecedor" value="'+state.search.replace(/"/g,'&quot;')+'"></div>'
        + window.CerneJuntas.html('cpJuntas')
      + '</div>';

      if(state.loading || filtro.loadingEmpresas){
        html += '<div class="table-card"><div class="table-skel"><span class="spin"></span><span>Carregando contas a pagar…</span></div></div>';
      } else if(state.error){
        html += '<div class="empty-panel"><div class="empty-icon" style="color:var(--danger); background:var(--danger-soft);">'+svg('alertCircle')+'</div>'
          + '<h2 style="color:var(--danger);">Não foi possível carregar</h2><p class="lead">'+escapeHtml(state.error)+'</p>'
          + '<button class="ghost-btn" id="cpRetry" style="cursor:pointer; opacity:1;">'+svg('activity')+'<span>Tentar novamente</span></button></div>';
      } else if(!state.contas.length){
        const filtrado = !!(state.search || state.status!=='todos');
        html += '<div class="empty-panel"><div class="empty-icon">'+svg('arrowUpCircle')+'</div>'
          + '<h2>Nenhuma conta a pagar encontrada</h2>'
          + '<p class="lead">'+(filtrado ? 'Nenhuma conta corresponde ao filtro atual.' : 'Cadastre a primeira conta a pagar desta empresa no período selecionado.')+'</p>'
          + (filtrado ? '' : '<button class="primary-btn enabled" id="cpEmptyNew" type="button">'+svg('plus')+'<span>Nova conta a pagar</span></button>')
        + '</div>';
      } else {
        html += '<div class="table-card"><div class="table-wrap"><table class="data-table"><thead><tr>'
          + '<th>Vencimento</th>'+(window.CerneJuntas.on?'<th>Empresa</th>':'')+'<th>Descrição</th><th>Categoria</th><th>Fornecedor</th><th>Valor</th><th>Status</th><th></th>'
          + '</tr></thead><tbody>'
          + state.contas.map(c => '<tr'+(c.status==='cancelado'?' style="opacity:.6;"':'')+'>'
            + '<td class="tab-nums">'+fmtDate(c.vencimento)+'</td>'
            + (window.CerneJuntas.on ? '<td>'+escapeHtml(c.empresaNome||'—')+'</td>' : '')
            + '<td>'+escapeHtml(c.descricao)+(c.documento?'<div class="di-sub"><strong>CR '+escapeHtml(c.documento)+'</strong></div>':'')+(c.observacao?'<div class="di-sub">'+escapeHtml(c.observacao)+'</div>':'')+'</td>'
            + '<td>'+escapeHtml(c.categoria||'—')+'</td>'
            + '<td>'+escapeHtml(c.fornecedorNome||'—')+'</td>'
            + '<td class="mono">'+money(c.valor)+'</td>'
            + '<td><span class="status-chip" style="'+statusChipStyle(c.status)+'">'+STATUS_LABEL[c.status]+'</span>'
              + (c.status==='pago' ? '<div class="di-sub">pago em '+fmtDate(c.dataPagamento)+(c.valorPago!==null&&c.valorPago!==c.valor?' · pagou '+money(c.valorPago):'')+'</div>' : '')+'</td>'
            + '<td><div class="row-actions">'
              + (c.statusBase==='pendente' ? '<button class="row-ic-btn" data-pagar="'+c.id+'" title="Dar baixa (marcar como pago)" type="button">'+svg('check')+'</button>' : '')
              + (c.statusBase==='pago' ? '<button class="row-ic-btn" data-estornar="'+c.id+'" title="Desfazer a baixa (voltar para pendente)" type="button">'+svg('activity')+'</button>' : '')
              + (c.statusBase!=='cancelado' ? '<button class="row-ic-btn" data-edit="'+c.id+'" title="Editar" type="button">'+svg('edit')+'</button>' : '')
              + (c.statusBase==='pendente' ? '<button class="row-ic-btn" data-cancelar="'+c.id+'" title="Cancelar" type="button">'+svg('x')+'</button>' : '')
              + (c.statusBase!=='pago' ? '<button class="row-ic-btn danger" data-excluir="'+c.id+'" title="Excluir" type="button">'+svg('trash')+'</button>' : '')
            + '</div></td>'
          + '</tr>').join('')
          + '</tbody></table></div></div>';
      }

      root.innerHTML = html;

      const seg = document.getElementById('cpSeg');
      if(seg) seg.querySelectorAll('button').forEach(b=> b.addEventListener('click', ()=>{ state.status = b.dataset.status; loadContas(); }));
      const search = document.getElementById('cpSearch');
      if(search) search.addEventListener('input', ()=>{
        state.search = search.value;
        clearTimeout(search._t);
        search._t = setTimeout(loadContas, 300);
      });
      window.CerneJuntas.bind('cpJuntas', loadContas);
      const retry = document.getElementById('cpRetry');
      if(retry) retry.addEventListener('click', loadContas);
      const emptyNew = document.getElementById('cpEmptyNew');
      if(emptyNew) emptyNew.addEventListener('click', ()=> openModal());

      root.querySelectorAll('[data-edit]').forEach(b=> b.addEventListener('click', ()=>{
        const conta = state.contas.find(c=>String(c.id)===b.dataset.edit);
        if(conta) openModal(conta);
      }));
      root.querySelectorAll('[data-pagar]').forEach(b=> b.addEventListener('click', ()=>{
        const conta = state.contas.find(c=>String(c.id)===b.dataset.pagar);
        if(conta) openBaixaModal(conta);
      }));
      root.querySelectorAll('[data-estornar]').forEach(b=> b.addEventListener('click', async ()=>{
        if(!window.confirm('Desfazer a baixa? A conta volta para pendente.')) return;
        b.disabled = true;
        try{ await api('/'+b.dataset.estornar+'/estornar', { method:'PATCH' }); toast('Baixa desfeita: conta voltou para pendente.'); loadContas(); }
        catch(err){ toast(err.message,'error'); b.disabled = false; }
      }));
      root.querySelectorAll('[data-cancelar]').forEach(b=> b.addEventListener('click', async ()=>{
        b.disabled = true;
        try{ await api('/'+b.dataset.cancelar+'/cancelar', { method:'PATCH' }); toast('Conta cancelada.'); loadContas(); }
        catch(err){ toast(err.message,'error'); b.disabled = false; }
      }));
      root.querySelectorAll('[data-excluir]').forEach(b=> b.addEventListener('click', async ()=>{
        b.disabled = true;
        try{ await api('/'+b.dataset.excluir, { method:'DELETE' }); toast('Conta excluída.'); loadContas(); }
        catch(err){ toast(err.message,'error'); b.disabled = false; }
      }));
    }

    // Gerenciar categorias financeiras (31/08/2026) — cadastro real por
    // empresa, editável direto do formulário de Contas a Pagar (link
    // "gerenciar categorias"). Abre em cima do modal de conta a pagar (sua
    // própria overlay anexada ao <body>, sem tocar em modalRoot) pra não
    // perder o que já foi digitado no formulário por trás. Nunca exclui
    // categoria de verdade — só ativa/desativa, ver lib/categoriasFinanceiras.js.
    function openCategoriasModal(onClose){
      const empresaId = window.CerneFiltro.state.empresaId;
      const wrap = document.createElement('div');
      wrap.className = 'modal-overlay';
      wrap.style.zIndex = '10000';
      document.body.appendChild(wrap);
      const st = { categorias: [], loading: true };

      function close(){ wrap.remove(); if(onClose) onClose(); }

      function linhaHtml(c, sub){
        return '<tr'+(!c.ativa?' style="opacity:.55;"':'')+'>'
          + '<td>'+(sub?'↳ ':'')+escapeHtml(c.nome)+'</td>'
          + '<td><span class="status-chip" style="'+(c.ativa?'color:var(--success);background:var(--success-soft);':'color:var(--text-muted);background:var(--surface-2);')+'">'+(c.ativa?'Ativa':'Desativada')+'</span></td>'
          + '<td><div class="row-actions">'
            + '<button class="row-ic-btn" type="button" data-renomear="'+c.id+'" data-nome-atual="'+escapeHtml(c.nome)+'" title="Renomear">'+svg('edit')+'</button>'
            + '<button class="row-ic-btn" type="button" data-toggle-ativa="'+c.id+'" data-ativar-agora="'+(c.ativa?'0':'1')+'" title="'+(c.ativa?'Desativar':'Ativar')+'">'+svg(c.ativa?'x':'check')+'</button>'
          + '</div></td></tr>';
      }

      function render(){
        let rows = '';
        st.categorias.forEach(function(raiz){
          rows += linhaHtml(raiz, false);
          (raiz.subcategorias||[]).forEach(function(s){ rows += linhaHtml(s, true); });
        });
        wrap.innerHTML = '<div class="modal-card" style="max-width:640px;max-height:88vh;overflow:auto;">'
          + '<div class="modal-head"><div class="modal-title">Categorias financeiras</div><button class="row-ic-btn" id="catmClose" type="button">'+svg('x')+'</button></div>'
          + '<div class="modal-sub">Usadas em Contas a Pagar, no extrato bancário e na DRE. Desativar uma categoria nunca apaga o histórico de lançamentos já feitos com ela.</div>'
          + (st.loading
            ? '<div class="table-skel" style="margin-top:12px;"><span class="spin"></span><span>Carregando…</span></div>'
            : '<div class="table-card" style="margin-top:14px;"><div class="table-wrap"><table class="data-table"><thead><tr><th>Nome</th><th>Status</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div></div>')
          + '<form id="catmForm" style="margin-top:16px;">'
            + '<div class="inline-form" style="margin-top:0;">'
              + '<div class="field narrow"><label>Nova categoria/subcategoria</label><input type="text" id="catmNome" placeholder="Ex: Salgados"></div>'
              + '<div class="field narrow"><label>Subcategoria de <span class="opt">(opcional)</span></label><select id="catmPai"><option value="">Categoria própria (nível principal)</option>'
                + st.categorias.filter(function(r){return r.ativa;}).map(function(r){ return '<option value="'+r.id+'">'+escapeHtml(r.nome)+'</option>'; }).join('') + '</select></div>'
            + '</div>'
            + '<div class="modal-actions"><button type="button" class="btn-secondary" id="catmClose2">Fechar</button><button type="submit" class="btn-primary" id="catmSalvar">'+svg('plus')+'<span>Adicionar</span></button></div>'
          + '</form>'
        + '</div>';

        document.getElementById('catmClose')?.addEventListener('click', close);
        document.getElementById('catmClose2')?.addEventListener('click', close);
        wrap.addEventListener('click', function(e){ if(e.target===wrap) close(); });

        wrap.querySelectorAll('[data-toggle-ativa]').forEach(function(btn){
          btn.addEventListener('click', async function(){
            btn.disabled = true;
            const id = btn.dataset.toggleAtiva;
            const ativarAgora = btn.dataset.ativarAgora === '1';
            try{ await fetch('/api/categorias-financeiras/'+id+(ativarAgora?'/ativar':'/desativar'), { method:'PATCH' }); await carregar(); }
            catch(e){ toast('Não foi possível atualizar a categoria.', 'error'); btn.disabled=false; }
          });
        });
        wrap.querySelectorAll('[data-renomear]').forEach(function(btn){
          btn.addEventListener('click', async function(){
            const id = btn.dataset.renomear;
            const atual = btn.dataset.nomeAtual;
            const novo = prompt('Novo nome da categoria:', atual);
            if(!novo || !novo.trim() || novo.trim()===atual) return;
            try{
              const res = await fetch('/api/categorias-financeiras/'+id, { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({nome: novo.trim()}) });
              const body = await res.json().catch(function(){return {};});
              if(!res.ok) throw new Error((body.errors&&body.errors.nome)||'Não foi possível renomear.');
              await carregar();
            }catch(e){ toast(e.message,'error'); }
          });
        });

        document.getElementById('catmForm')?.addEventListener('submit', async function(e){
          e.preventDefault();
          const nome = document.getElementById('catmNome').value.trim();
          const categoriaPaiId = document.getElementById('catmPai').value || null;
          if(!nome){ toast('Informe o nome da categoria.', 'error'); return; }
          const btn = document.getElementById('catmSalvar'); btn.disabled = true;
          try{
            const res = await fetch('/api/categorias-financeiras', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({empresaId:empresaId, nome:nome, categoriaPaiId:categoriaPaiId}) });
            const body = await res.json().catch(function(){return {};});
            if(!res.ok) throw new Error((body.errors&&(body.errors.nome||body.errors.categoriaPaiId))||'Não foi possível criar a categoria.');
            toast('Categoria criada.');
            await carregar();
          }catch(err){ toast(err.message,'error'); btn.disabled=false; }
        });
      }

      async function carregar(){
        st.loading = true; render();
        try{ st.categorias = await apiCategoriasFinanceiras(empresaId, true); }
        catch(e){ toast('Não foi possível carregar as categorias.', 'error'); }
        finally{ st.loading = false; render(); }
      }

      carregar();
    }

    function openModal(conta){
      const isEdit = !!conta;
      const modalRoot = document.getElementById('modalRoot');
      const hoje = hojeBRT();
      modalRoot.innerHTML = '<div class="modal-overlay" id="modalOverlay">'
        + '<div class="modal-card" style="max-width:560px;">'
          + '<div class="modal-head"><div class="modal-title">'+(isEdit?'Editar conta a pagar':'Nova conta a pagar')+'</div>'
            + '<button class="row-ic-btn" id="modalClose" type="button">'+svg('x')+'</button></div>'
          + '<div class="modal-sub">'+(isEdit?'Atualize os dados da conta a pagar.':'Preencha os dados para lançar uma nova conta a pagar.')+'</div>'
          + '<form id="cpForm">'
            + '<div class="field"><label>Descrição</label><input type="text" id="fDescricao" placeholder="Ex: Boleto fornecedor X" value="'+(isEdit?escapeHtml(conta.descricao):'')+'">'
              + '<div class="field-error" id="eDescricao" style="display:none;"></div></div>'
            + '<div class="field"><label>CR/documento <span class="opt">(opcional)</span></label><input type="text" id="fDocumento" placeholder="Ex: 9050" value="'+(isEdit?escapeHtml(conta.documento||''):'')+'"></div>'
            + '<div class="inline-form" style="margin-top:0;">'
              + '<div class="field narrow"><label>Categoria <span class="opt">(opcional)</span> <a href="#" id="fCategoriaGerenciar" style="font-size:11px;font-weight:400;">gerenciar categorias</a></label>'
                + '<select id="fCategoria"><option value="">Carregando…</option></select>'
                + (isEdit && conta.categoria && !conta.categoriaId ? '<div class="field-hint">Categoria atual (texto livre): '+escapeHtml(conta.categoria)+'. Escolha uma categoria do cadastro para substituir, ou deixe como está.</div>' : '')
              + '</div>'
              + '<div class="field narrow"><label>Fornecedor <span class="opt">(quando houver)</span></label><select id="fFornecedor"><option value="">Carregando…</option></select></div>'
            + '</div>'
            + '<div class="inline-form" style="margin-top:0;">'
              + '<div class="field narrow"><label>Valor</label><input type="text" inputmode="decimal" id="fValor" value="'+(isEdit?String(conta.valor).replace('.',','):'')+'">'
                + '<div class="field-error" id="eValor" style="display:none;"></div></div>'
              + '<div class="field narrow"><label>Vencimento</label><input type="date" id="fVencimento" value="'+(isEdit?conta.vencimento:hoje)+'">'
                + '<div class="field-error" id="eVencimento" style="display:none;"></div></div>'
            + '</div>'
            + (isEdit ? '' : '<div class="inline-form" style="margin-top:0;">'
              + '<div class="field narrow"><label>Parcelas <span class="opt">(1 = conta única)</span></label><input type="number" id="fParcelas" min="1" max="60" value="1"></div>'
              + '<div class="field narrow"><label>O valor acima é…</label><select id="fValorEhTotal"><option value="0">de cada parcela</option><option value="1">o total (dividir)</option></select></div>'
              + '<div class="field-hint" style="flex-basis:100%;">Com 2 ou mais parcelas, uma conta é criada por mês, a partir do vencimento escolhido.</div>'
            + '</div>')
            + '<div class="inline-form" style="margin-top:0;">'
              + '<div class="field narrow"><label>Conta bancária <span class="opt">(opcional)</span></label><select id="fContaBancaria"><option value="">Carregando…</option></select></div>'
              + '<div class="field narrow"><label>Forma de pagamento <span class="opt">(opcional)</span></label><input type="text" id="fFormaPagamento" placeholder="Ex: Pix, Boleto, Cartão" value="'+(isEdit?escapeHtml(conta.formaPagamento||''):'')+'"></div>'
            + '</div>'
            + (isEdit && conta.statusBase==='pago' ? '<div class="field"><label>Data do pagamento</label><input type="date" id="fDataPagamento" value="'+escapeHtml(conta.dataPagamento||hoje)+'"><div class="field-error" id="eDataPagamento" style="display:none;"></div></div>' : '')
            + '<div class="field"><label>Observação <span class="opt">(opcional)</span></label><input type="text" id="fObservacao" value="'+(isEdit?escapeHtml(conta.observacao||''):'')+'"></div>'
            + '<div class="modal-actions">'
              + '<button type="button" class="btn-secondary" id="modalCancel">Cancelar</button>'
              + '<button type="submit" class="btn-primary" id="modalSave">'+svg('check')+'<span>'+(isEdit?'Salvar alterações':'Criar conta')+'</span></button>'
            + '</div>'
          + '</form>'
        + '</div>'
      + '</div>';

      const overlay = document.getElementById('modalOverlay');
      const close = ()=> modalRoot.innerHTML = '';
      overlay.addEventListener('click', (e)=>{ if(e.target === overlay) close(); });
      document.getElementById('modalClose')?.addEventListener('click', close);
      document.getElementById('modalCancel')?.addEventListener('click', close);

      function categoriaOptionsHtml(categorias, selecionadaId){
        let out = '<option value="">Nenhuma</option>';
        categorias.forEach(function(raiz){
          out += '<option value="'+raiz.id+'" '+(selecionadaId===raiz.id?'selected':'')+'>'+escapeHtml(raiz.nome)+'</option>';
          if(raiz.subcategorias && raiz.subcategorias.length){
            out += '<optgroup label="'+escapeHtml(raiz.nome)+'">'
              + raiz.subcategorias.map(function(s){ return '<option value="'+s.id+'" '+(selecionadaId===s.id?'selected':'')+'>↳ '+escapeHtml(s.nome)+'</option>'; }).join('')
              + '</optgroup>';
          }
        });
        return out;
      }

      async function carregarPickers(){
        const empresaId = isEdit ? conta.empresaId : window.CerneFiltro.state.empresaId;
        try{
          const [fornecedores, categorias, contasBancarias] = await Promise.all([
            apiFornecedoresAtivos(empresaId), apiCategoriasFinanceiras(empresaId), apiContasBancariasAtivas(empresaId),
          ]);
          const fSel = document.getElementById('fFornecedor');
          if(fSel){
            fSel.innerHTML = '<option value="">Nenhum</option>' + fornecedores.map(function(f){ return '<option value="'+f.id+'" '+(isEdit&&conta.fornecedorId===f.id?'selected':'')+'>'+escapeHtml(f.razaoSocial)+'</option>'; }).join('');
          }
          const catSel = document.getElementById('fCategoria');
          if(catSel) catSel.innerHTML = categoriaOptionsHtml(categorias, isEdit?conta.categoriaId:null);
          const cbSel = document.getElementById('fContaBancaria');
          if(cbSel){
            cbSel.innerHTML = '<option value="">Nenhuma</option>' + contasBancarias.map(function(cb){ return '<option value="'+cb.id+'" '+(isEdit&&conta.contaBancariaId===cb.id?'selected':'')+'>'+escapeHtml(cb.nome)+(cb.banco?' ('+escapeHtml(cb.banco)+')':'')+'</option>'; }).join('');
          }
        }catch(e){ toast('Não foi possível carregar fornecedores/categorias/contas.', 'error'); }
      }
      carregarPickers();

      const gerenciarLink = document.getElementById('fCategoriaGerenciar');
      if(gerenciarLink) gerenciarLink.addEventListener('click', function(e){
        e.preventDefault();
        openCategoriasModal(function(){ carregarPickers(); });
      });

      document.getElementById('cpForm')?.addEventListener('submit', async (e)=>{
        e.preventDefault();
        ['eDescricao','eValor','eVencimento','eDataPagamento'].forEach(id=>{ const el=document.getElementById(id); if(!el) return; el.style.display='none'; el.textContent=''; });

        // Categoria agora vem do cadastro real (select id="fCategoria",
        // valor = categoriaId). Se nada for escolhido, preserva o texto
        // livre já existente no lançamento (edição) ou manda vazio (novo) —
        // nunca some com uma categoria já lançada só por o usuário não ter
        // mexido no campo. Ver validatePayload/atualizarContaPagar em
        // lib/contasPagar.js para a mesma regra do lado do servidor.
        const categoriaIdSelecionada = document.getElementById('fCategoria').value || null;
        const payload = {
          empresaId: isEdit ? conta.empresaId : window.CerneFiltro.state.empresaId,
          fornecedorId: document.getElementById('fFornecedor').value || null,
          descricao: document.getElementById('fDescricao').value,
          documento: document.getElementById('fDocumento').value,
          categoriaId: categoriaIdSelecionada,
          categoria: categoriaIdSelecionada ? undefined : (isEdit ? (conta.categoria || '') : ''),
          contaBancariaId: document.getElementById('fContaBancaria').value || null,
          formaPagamento: document.getElementById('fFormaPagamento').value,
          valor: Number(document.getElementById('fValor').value.replace(',','.')),
          vencimento: document.getElementById('fVencimento').value,
          observacao: document.getElementById('fObservacao').value,
        };
        if(isEdit && conta.statusBase==='pago') payload.dataPagamento = document.getElementById('fDataPagamento').value;
        if(!isEdit){
          const np = parseInt((document.getElementById('fParcelas')||{}).value, 10);
          if(np >= 2){ payload.parcelas = np; payload.valorEhTotal = (document.getElementById('fValorEhTotal')||{}).value === '1'; }
        }

        const saveBtn = document.getElementById('modalSave');
        saveBtn.disabled = true;
        try{
          if(isEdit) await api('/'+conta.id, { method:'PUT', body: JSON.stringify(payload) });
          else await api('', { method:'POST', body: JSON.stringify(payload) });
          close();
          toast(isEdit ? 'Conta atualizada.' : (payload.parcelas ? payload.parcelas+' parcelas criadas.' : 'Conta a pagar criada.'));
          loadContas();
        }catch(err){
          saveBtn.disabled = false;
          if(err.errors){
            let mostrou = false;
            ['descricao','valor','vencimento','dataPagamento','documento','fornecedorId'].forEach(function(campo){
              if(err.errors[campo]){
                const elId = (campo==='fornecedorId'||campo==='documento') ? null : 'e'+campo.charAt(0).toUpperCase()+campo.slice(1);
                if(elId && document.getElementById(elId)){ const el=document.getElementById(elId); el.textContent=err.errors[campo]; el.style.display='block'; mostrou = true; }
              }
            });
            if(!mostrou) toast(err.message, 'error');
          } else {
            toast(err.message, 'error');
          }
        }
      });
    }

    function openImportModal(){
      const empresaId = Number(window.CerneFiltro.state.empresaId);
      if(!empresaId){ toast('Selecione uma empresa antes de importar.', 'error'); return; }

      const CAMPOS = [
        ['documento','CR',false], ['descricao','Descrição',true], ['categoria','Categoria',false],
        ['fornecedor','Fornecedor',false], ['valor','Valor',true], ['vencimento','Vencimento',true],
        ['observacao','Observação',false]
      ];
      const imp = { nomeArquivo:'', colunas:[], linhas:[], mapeamento:{}, preview:null, force:new Set(), loading:false };
      const modalRoot = document.getElementById('modalRoot');
      const close = ()=> modalRoot.innerHTML='';

      async function fetchJson(url, opts){
        const res = await fetch(url, opts);
        let body=null; try{ body=await res.json(); }catch(e){}
        if(!res.ok) throw new Error((body&&body.error)||'Falha na importação.');
        return body;
      }

      function shell(conteudo, largura){
        modalRoot.innerHTML = '<div class="modal-overlay" id="cpImpOverlay">'
          + '<div class="modal-card" style="max-width:'+(largura||'980px')+';max-height:92vh;overflow:auto;">'
            + '<div class="modal-head"><div class="modal-title">Importar Contas a Pagar</div>'
              + '<button class="row-ic-btn" id="cpImpClose" type="button">'+svg('x')+'</button></div>'
            + conteudo
          + '</div></div>';
        document.getElementById('cpImpClose')?.addEventListener('click', close);
        document.getElementById('cpImpOverlay')?.addEventListener('click', e=>{ if(e.target.id==='cpImpOverlay') close(); });
      }

      function renderInicio(){
        shell('<div class="modal-sub">As contas serão importadas para a <strong>empresa selecionada no cabeçalho</strong> e entrarão na mesma base usada pelo Fluxo de Caixa.</div>'
          + '<div class="empty-panel" style="margin-top:16px;padding:28px 20px;">'
            + '<div class="empty-icon">'+svg('fileText')+'</div>'
            + '<h2>Selecione sua planilha</h2><p class="lead">Aceita CSV ou Excel (.xlsx), até 5.000 linhas.</p>'
            + '<input type="file" id="cpImpFile" accept=".csv,.xlsx" style="display:none;">'
            + '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px;">'
              + '<button class="primary-btn enabled" id="cpImpChoose" type="button">'+svg('fileText')+'<span>Escolher arquivo</span></button>'
              + '<a class="ghost-btn" href="/api/contas-pagar/importar/modelo" style="cursor:pointer;opacity:1;">'+svg('download')+'<span>Baixar modelo</span></a>'
            + '</div>'
          + '</div>', '680px');
        const input=document.getElementById('cpImpFile');
        document.getElementById('cpImpChoose')?.addEventListener('click', ()=>input.click());
        input.addEventListener('change', async ()=>{
          const file=input.files&&input.files[0]; if(!file) return;
          if(file.size > 10*1024*1024){ toast('Arquivo maior que 10 MB.', 'error'); return; }
          const nome=file.name.toLowerCase();
          if(!nome.endsWith('.csv') && !nome.endsWith('.xlsx')){ toast('Envie um arquivo CSV ou XLSX.', 'error'); return; }
          const btn=document.getElementById('cpImpChoose'); btn.disabled=true; btn.querySelector('span').textContent='Lendo arquivo…';
          try{
            const data=await fetchJson('/api/contas-pagar/importar/ler', { method:'POST', headers:{'Content-Type':'application/octet-stream','X-File-Name':encodeURIComponent(file.name)}, body:file });
            imp.nomeArquivo=data.nomeArquivo; imp.colunas=data.colunas||[]; imp.linhas=data.linhas||[]; imp.mapeamento=data.mapeamentoSugerido||{}; imp.preview=null; imp.force=new Set();
            renderMapeamento();
          }catch(err){ toast(err.message,'error'); btn.disabled=false; btn.querySelector('span').textContent='Escolher arquivo'; }
        });
      }

      function selectCampo(key){
        const atual=imp.mapeamento[key]||'';
        return '<select data-map="'+key+'"><option value="">Não importar</option>'
          + imp.colunas.map(c=>'<option value="'+escapeHtml(c)+'" '+(c===atual?'selected':'')+'>'+escapeHtml(c)+'</option>').join('')
          + '</select>';
      }

      function renderMapeamento(){
        const rows=CAMPOS.map(c=>'<tr><td><strong>'+c[1]+'</strong>'+(c[2]?'<span style="color:var(--danger);"> *</span>':'')+'</td><td>'+selectCampo(c[0])+'</td></tr>').join('');
        shell('<div class="modal-sub">Arquivo: <strong>'+escapeHtml(imp.nomeArquivo)+'</strong> · '+imp.linhas.length+' linha(s). Confira o mapeamento antes da prévia.</div>'
          + '<div class="table-card" style="margin-top:16px;"><div class="table-wrap"><table class="data-table"><thead><tr><th>Campo no PF Embalagens</th><th>Coluna da planilha</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'
          + '<div class="field-hint" style="margin-top:10px;">A planilha segue o cadastro manual: CR, Descrição, Categoria, Fornecedor, Valor, Vencimento e Observação. Obrigatórios: Descrição, Vencimento e Valor.</div>'
          + '<div class="modal-actions"><button class="btn-secondary" id="cpImpTrocar" type="button">Trocar arquivo</button><button class="btn-primary" id="cpImpPreview" type="button">'+svg('check')+'<span>Validar e ver prévia</span></button></div>');
        document.querySelectorAll('[data-map]').forEach(sel=>sel.addEventListener('change', ()=>{ if(sel.value) imp.mapeamento[sel.dataset.map]=sel.value; else delete imp.mapeamento[sel.dataset.map]; imp.preview=null; }));
        document.getElementById('cpImpTrocar')?.addEventListener('click', renderInicio);
        document.getElementById('cpImpPreview')?.addEventListener('click', gerarPreview);
      }

      async function gerarPreview(){
        const faltam=['descricao','vencimento','valor'].filter(k=>!imp.mapeamento[k]);
        if(faltam.length){ toast('Mapeie Descrição, Vencimento e Valor.', 'error'); return; }
        const btn=document.getElementById('cpImpPreview'); btn.disabled=true; btn.querySelector('span').textContent='Validando…';
        try{
          imp.preview=await fetchJson('/api/contas-pagar/importar/preview', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({empresaId, linhas:imp.linhas, mapeamento:imp.mapeamento}) });
          imp.force=new Set(); renderPreview();
        }catch(err){ toast(err.message,'error'); btn.disabled=false; btn.querySelector('span').textContent='Validar e ver prévia'; }
      }

      function renderPreview(){
        const r=imp.preview.resumo;
        const cards=[
          ['Linhas',r.total,'muted'], ['Prontas',r.prontas,'success'], ['Duplicidades',r.duplicidades,r.duplicidades?'warning':'muted'], ['Com erro',r.erros,r.erros?'danger':'muted']
        ].map(x=>'<div class="kpi-sec" style="'+tintVars(x[2])+'"><div class="kpi-sec-body"><div class="kpi-sec-label">'+x[0]+'</div><div class="kpi-sec-value">'+x[1]+'</div></div></div>').join('');
        const itens=(imp.preview.itens||[]).slice(0,500);
        const linhasHtml=itens.map(it=>{
          const d=it.dados||{};
          const label=it.status==='pronto'?'Pronto':it.status==='duplicidade'?'Possível duplicidade':'Erro';
          const style=it.status==='pronto'?'color:var(--success);background:var(--success-soft);':it.status==='duplicidade'?'color:var(--warning);background:var(--warning-soft);':'color:var(--danger);background:var(--danger-soft);';
          const force=it.status==='duplicidade' ? '<label style="display:flex;align-items:center;gap:6px;font-size:11px;white-space:nowrap;"><input type="checkbox" data-force="'+it.linha+'"> Importar mesmo assim</label>' : '';
          return '<tr><td class="tab-nums">'+it.linha+'</td><td><span class="status-chip" style="'+style+'">'+label+'</span>'+force+'</td>'
            + '<td>'+escapeHtml(d.fornecedorNomeImportado||'')+(d.fornecedorId?'Fornecedor cadastrado #'+d.fornecedorId:(d.fornecedorNomeImportado?'':'—'))+'</td>'
            + '<td>'+escapeHtml(d.descricao||'')+(it.erros&&it.erros.length?'<div class="di-sub" style="color:var(--danger);">'+escapeHtml(it.erros.join(' · '))+'</div>':'')+'</td>'
            + '<td>'+escapeHtml(d.documento||'—')+(d.parcela?'<div class="di-sub">Parcela '+escapeHtml(d.parcela)+'</div>':'')+'</td>'
            + '<td class="tab-nums">'+fmtDate(d.vencimento)+'</td><td class="mono">'+(d.valor?money(d.valor):'—')+'</td></tr>';
        }).join('');
        shell('<div class="modal-sub">Revise antes de gravar. Linhas com erro nunca são importadas; duplicidades ficam ignoradas, a menos que você marque “Importar mesmo assim”.</div>'
          + '<div class="kpi-sec-grid" style="margin-top:16px;margin-bottom:14px;">'+cards+'</div>'
          + '<div class="table-card"><div class="table-wrap"><table class="data-table"><thead><tr><th>Linha</th><th>Validação</th><th>Fornecedor</th><th>Descrição</th><th>CR</th><th>Vencimento</th><th>Valor</th></tr></thead><tbody>'+linhasHtml+'</tbody></table></div></div>'
          + ((imp.preview.itens||[]).length>500?'<div class="field-hint" style="margin-top:8px;">Mostrando as primeiras 500 linhas na prévia; todas serão processadas na confirmação.</div>':'')
          + '<div class="modal-actions"><button class="btn-secondary" id="cpImpBack" type="button">Voltar ao mapeamento</button><button class="btn-primary" id="cpImpConfirm" type="button">'+svg('check')+'<span>Confirmar importação</span></button></div>');
        document.querySelectorAll('[data-force]').forEach(ch=>ch.addEventListener('change', ()=>{ const n=Number(ch.dataset.force); if(ch.checked) imp.force.add(n); else imp.force.delete(n); }));
        document.getElementById('cpImpBack')?.addEventListener('click', renderMapeamento);
        document.getElementById('cpImpConfirm')?.addEventListener('click', confirmar);
      }

      async function confirmar(){
        const btn=document.getElementById('cpImpConfirm'); btn.disabled=true; btn.querySelector('span').textContent='Importando…';
        try{
          const result=await fetchJson('/api/contas-pagar/importar/confirmar', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ empresaId, nomeArquivo:imp.nomeArquivo, linhas:imp.linhas, mapeamento:imp.mapeamento, forceLinhas:Array.from(imp.force) }) });
          close();
          toast(result.importadas+' conta(s) importada(s).'+(result.duplicidadesIgnoradas?' '+result.duplicidadesIgnoradas+' duplicidade(s) ignorada(s).':'')+(result.erros?' '+result.erros+' linha(s) com erro.':''));
          loadContas();
        }catch(err){ toast(err.message,'error'); btn.disabled=false; btn.querySelector('span').textContent='Confirmar importação'; }
      }

      renderInicio();
    }

    // Dar baixa com mais detalhes: data, valor realmente pago (juros/desconto),
    // forma e de qual conta bancária saiu. Só rótulos — não mexe em saldo.
    async function openBaixaModal(conta){
      const modalRoot = document.getElementById('modalRoot');
      modalRoot.innerHTML = '<div class="modal-overlay" id="modalOverlay"><div class="modal-card" style="max-width:520px;">'
        + '<div class="modal-head"><div class="modal-title">Dar baixa na conta</div><button class="row-ic-btn" id="modalClose" type="button">'+svg('x')+'</button></div>'
        + '<div class="modal-sub"><strong>'+escapeHtml(conta.descricao)+'</strong> · vencimento '+fmtDate(conta.vencimento)+' · '+money(conta.valor)+(conta.empresaNome?' · '+escapeHtml(conta.empresaNome):'')+'</div>'
        + '<form id="baixaForm">'
          + '<div class="inline-form" style="margin-top:0;">'
            + '<div class="field narrow"><label>Data do pagamento</label><input type="date" id="bData" value="'+hojeBRT()+'"></div>'
            + '<div class="field narrow"><label>Valor pago</label><input type="text" inputmode="decimal" id="bValor" value="'+String(conta.valor).replace('.',',')+'"></div>'
          + '</div>'
          + '<div class="field-hint">Se pagou com juros ou desconto, mude o valor pago. O valor original do boleto não muda.</div>'
          + '<div class="inline-form" style="margin-top:8px;">'
            + '<div class="field narrow"><label>Forma de pagamento <span class="opt">(opcional)</span></label><input type="text" id="bForma" placeholder="Ex: Pix, Boleto" value="'+escapeHtml(conta.formaPagamento||'')+'"></div>'
            + '<div class="field narrow"><label>Saiu de qual conta? <span class="opt">(opcional)</span></label><select id="bConta"><option value="">Carregando…</option></select></div>'
          + '</div>'
          + '<div class="modal-actions"><button type="button" class="btn-secondary" id="modalCancel">Cancelar</button><button type="submit" class="btn-primary" id="bSalvar">'+svg('check')+'<span>Confirmar baixa</span></button></div>'
        + '</form></div></div>';
      const close = ()=> modalRoot.innerHTML = '';
      document.getElementById('modalOverlay').addEventListener('click', (e)=>{ if(e.target.id==='modalOverlay') close(); });
      document.getElementById('modalClose')?.addEventListener('click', close);
      document.getElementById('modalCancel')?.addEventListener('click', close);
      apiContasBancariasAtivas(conta.empresaId).then(function(cbs){
        const sel = document.getElementById('bConta'); if(!sel) return;
        sel.innerHTML = '<option value="">Não informar</option>' + cbs.map(function(cb){ return '<option value="'+cb.id+'" '+(conta.contaBancariaId===cb.id?'selected':'')+'>'+escapeHtml(cb.nome)+'</option>'; }).join('');
      }).catch(function(){ const sel=document.getElementById('bConta'); if(sel) sel.innerHTML='<option value="">Não informar</option>'; });
      document.getElementById('baixaForm').addEventListener('submit', async (e)=>{
        e.preventDefault();
        const btn = document.getElementById('bSalvar'); btn.disabled = true;
        const valorPago = Number(document.getElementById('bValor').value.replace(',','.'));
        try{
          await api('/'+conta.id+'/pagar', { method:'PATCH', body: JSON.stringify({
            dataPagamento: document.getElementById('bData').value,
            valorPago: valorPago > 0 ? valorPago : undefined,
            formaPagamento: document.getElementById('bForma').value,
            contaBancariaId: document.getElementById('bConta').value || null,
          }) });
          close(); toast('Conta marcada como paga.'); loadContas();

      });
