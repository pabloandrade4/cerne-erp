<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cerne</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  /* ============ TOKENS ============ */
  :root{
    color-scheme: dark;
    --page:#0A0C11;
    --surface:#13161D;
    --surface-2:#191D26;
    --surface-hover:#1F2430;
    --surface-raised:#20242F;
    --border:#262B37;
    --border-strong:#38414F;
    --text:#F1F2F6;
    --text-muted:#98A0B3;
    --text-faint:#69718A;
    --copper:#E0813C;
    --copper-strong:#F2954C;
    --copper-soft:rgba(224,129,60,.16);
    --copper-wash:rgba(224,129,60,.07);
    --teal:#41A8AF;
    --teal-soft:rgba(65,168,175,.16);
    --success:#3FB37E;
    --success-soft:rgba(63,179,126,.16);
    --warning:#E7B23E;
    --warning-soft:rgba(231,178,62,.16);
    --danger:#E5665A;
    --danger-soft:rgba(229,102,90,.16);
    --shadow-sm:0 2px 10px rgba(0,0,0,.30);
    --shadow-md:0 16px 40px rgba(0,0,0,.46);
    --ring:0 0 0 3px rgba(224,129,60,.35);
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      color-scheme: light;
      --page:#EDF0F5;
      --surface:#FFFFFF;
      --surface-2:#F4F6FA;
      --surface-hover:#ECEFF5;
      --surface-raised:#FFFFFF;
      --border:#E1E5EC;
      --border-strong:#CBD2DE;
      --text:#14171F;
      --text-muted:#5C6479;
      --text-faint:#8991A3;
      --copper:#C0682A;
      --copper-strong:#A85920;
      --copper-soft:rgba(192,104,42,.12);
      --copper-wash:rgba(192,104,42,.05);
      --teal:#257D84;
      --teal-soft:rgba(37,125,132,.11);
      --success:#25895A;
      --success-soft:rgba(37,137,90,.11);
      --warning:#9C6B0A;
      --warning-soft:rgba(156,107,10,.11);
      --danger:#C1452F;
      --danger-soft:rgba(193,69,47,.11);
      --shadow-sm:0 2px 10px rgba(20,24,32,.05);
      --shadow-md:0 18px 44px rgba(20,24,32,.10);
      --ring:0 0 0 3px rgba(192,104,42,.25);
    }
  }
  :root[data-theme="light"]{
    color-scheme: light;
    --page:#EDF0F5;
    --surface:#FFFFFF;
    --surface-2:#F4F6FA;
    --surface-hover:#ECEFF5;
    --surface-raised:#FFFFFF;
    --border:#E1E5EC;
    --border-strong:#CBD2DE;
    --text:#14171F;
    --text-muted:#5C6479;
    --text-faint:#8991A3;
    --copper:#C0682A;
    --copper-strong:#A85920;
    --copper-soft:rgba(192,104,42,.12);
    --copper-wash:rgba(192,104,42,.05);
    --teal:#257D84;
    --teal-soft:rgba(37,125,132,.11);
    --success:#25895A;
    --success-soft:rgba(37,137,90,.11);
    --warning:#9C6B0A;
    --warning-soft:rgba(156,107,10,.11);
    --danger:#C1452F;
    --danger-soft:rgba(193,69,47,.11);
    --shadow-sm:0 2px 10px rgba(20,24,32,.05);
    --shadow-md:0 18px 44px rgba(20,24,32,.10);
    --ring:0 0 0 3px rgba(192,104,42,.25);
  }

  /* ============ BASE ============ */
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--page);
    color:var(--text);
    font-family:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:14px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{ font-family:"Archivo","Public Sans",sans-serif; text-wrap:balance; margin:0; }
  ::selection{ background:var(--copper-soft); }
  button{ font:inherit; color:inherit; }
  a{ color:inherit; text-decoration:none; }
  .tab-nums{ font-variant-numeric:tabular-nums; }
  .mono{ font-family:"IBM Plex Mono",monospace; }
  :focus-visible{ outline:2px solid var(--copper); outline-offset:2px; border-radius:6px; }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration:.001ms !important; transition-duration:.001ms !important; } }
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-thumb{ background:var(--border-strong); border-radius:8px; }
  ::-webkit-scrollbar-track{ background:transparent; }

  /* ============ APP SHELL ============ */
  .app{ display:flex; min-height:100vh; }

  /* ---- Sidebar ---- */
  .sidebar{
    width:272px; flex-shrink:0;
    background:var(--surface);
    border-right:1px solid var(--border);
    display:flex; flex-direction:column;
    transition:width .16s ease;
    position:sticky; top:0; height:100vh;
  }
  .sidebar.collapsed{ width:78px; }
  .brand{
    display:flex; align-items:center; gap:11px;
    padding:19px 20px; border-bottom:1px solid var(--border);
    min-height:66px;
  }
  .brand-mark-wrap{
    width:34px; height:34px; flex-shrink:0; border-radius:10px;
    background:linear-gradient(155deg,var(--copper-soft),transparent);
    display:flex; align-items:center; justify-content:center;
  }
  .brand-mark{ width:20px; height:20px; color:var(--copper); }
  .brand-text{ overflow:hidden; white-space:nowrap; }
  .brand-name{ font-family:"Archivo",sans-serif; font-weight:800; font-size:16.5px; letter-spacing:.1px; }
  .brand-tag{ font-size:10.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.09em; margin-top:1px; font-weight:600; }
  .sidebar.collapsed .brand-text{ display:none; }
  .sidebar.collapsed .brand{ justify-content:center; padding:19px 12px; }

  .nav-scroll{ flex:1; overflow-y:auto; overflow-x:hidden; padding:16px 12px 16px; }
  .nav-group{ margin-bottom:6px; padding-top:6px; }
  .nav-group + .nav-group{ border-top:1px solid var(--border); margin-top:6px; padding-top:12px; }
  .nav-group-btn{
    width:100%; display:flex; align-items:center; justify-content:space-between;
    background:none; border:none; cursor:pointer;
    padding:6px 8px 8px; border-radius:8px;
    color:var(--text-faint); font-size:10.5px; font-weight:700;
    text-transform:uppercase; letter-spacing:.09em;
  }
  .nav-group-btn:hover{ color:var(--text-muted); }
  .nav-group-btn .chev-ic{ width:12px; height:12px; transition:transform .15s ease; opacity:.8; }
  .nav-group.open .nav-group-btn .chev-ic{ transform:rotate(180deg); }
  .sidebar.collapsed .nav-group-btn{ display:none; }

  .nav-list{ display:flex; flex-direction:column; gap:1px; overflow:hidden; max-height:0; transition:max-height .18s ease; }
  .nav-group.open .nav-list{ max-height:600px; }
  .sidebar.collapsed .nav-list{ max-height:none; }

  .nav-item{
    display:flex; align-items:center; gap:10px;
    padding:6px 8px; border-radius:9px;
    color:var(--text-muted); cursor:pointer; border:none; background:none;
    white-space:nowrap; position:relative; width:100%; text-align:left;
    font-size:13.5px; font-weight:500;
  }
  .nav-item::before{
    content:''; position:absolute; left:0; top:50%; transform:translateY(-50%);
    width:3px; height:0; border-radius:2px; background:var(--copper);
    transition:height .15s ease;
  }
  .nav-item:hover{ color:var(--text); }
  .nav-item:hover .nav-ic{ background:var(--surface-hover); color:var(--text); }
  .nav-item.active{ color:var(--text); font-weight:700; }
  .nav-item.active::before{ height:56%; }
  .nav-item.active .nav-ic{ background:var(--copper-soft); color:var(--copper); }
  .nav-ic{
    width:30px; height:30px; border-radius:8px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    color:var(--text-faint); transition:background .12s ease,color .12s ease;
  }
  .nav-ic svg{ width:17px; height:17px; }
  .nav-item span{ overflow:hidden; text-overflow:ellipsis; }
  .sidebar.collapsed .nav-item span{ display:none; }
  .sidebar.collapsed .nav-item{ justify-content:center; padding:6px; }
  .sidebar.collapsed .nav-item::before{ left:-4px; }

  .sidebar-footer{ border-top:1px solid var(--border); padding:12px; }
  .collapse-btn{
    width:100%; display:flex; align-items:center; gap:9px; justify-content:center;
    background:var(--surface-2); border:1px solid var(--border); border-radius:9px;
    padding:9px; cursor:pointer; color:var(--text-faint);
  }
  .collapse-btn:hover{ color:var(--text); border-color:var(--border-strong); background:var(--surface-hover); }
  .collapse-btn svg{ width:15px; height:15px; transition:transform .16s ease; flex-shrink:0; }
  .sidebar.collapsed .collapse-btn svg{ transform:rotate(180deg); }
  .collapse-btn .collapse-label{ font-size:12px; font-weight:600; }
  .sidebar.collapsed .collapse-label{ display:none; }

  /* ---- Main / Topbar ---- */
  .main{ flex:1; display:flex; flex-direction:column; min-width:0; background:var(--page); }
  .topbar{
    height:62px; flex-shrink:0;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 24px; border-bottom:1px solid var(--border);
    position:sticky; top:0; background:var(--page); z-index:5; gap:16px;
  }
  .topbar-left{ min-width:0; }
  .eyebrow{ font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--text-faint); }
  .page-title-sm{ font-size:15.5px; font-weight:700; margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-family:"Archivo",sans-serif; }
  .topbar-right{ display:flex; align-items:center; gap:6px; flex-shrink:0; }
  .topbar-divider{ width:1px; height:22px; background:var(--border); margin:0 4px; flex-shrink:0; }

  .pill-btn{
    display:flex; align-items:center; gap:8px; height:36px;
    background:var(--surface); border:1px solid var(--border);
    border-radius:10px; padding:0 10px 0 6px; cursor:pointer; position:relative;
  }
  .pill-btn:hover{ border-color:var(--border-strong); background:var(--surface-hover); }
  .pill-ic{
    width:23px; height:23px; border-radius:6.5px; background:var(--surface-2);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .pill-ic svg{ width:13px; height:13px; color:var(--text-muted); }
  .pill-btn .pill-label{ font-size:12.5px; font-weight:600; white-space:nowrap; }
  .pill-btn .pill-sub{ font-size:11px; color:var(--text-faint); }
  .chev{ width:12px !important; height:12px !important; color:var(--text-faint) !important; }

  .icon-btn{
    width:36px; height:36px; display:flex; align-items:center; justify-content:center;
    background:var(--surface); border:1px solid var(--border); border-radius:10px;
    cursor:pointer; position:relative; flex-shrink:0;
  }
  .icon-btn:hover{ border-color:var(--border-strong); background:var(--surface-hover); }
  .icon-btn svg{ width:16.5px; height:16.5px; color:var(--text-muted); }
  .badge{
    position:absolute; top:-4px; right:-4px; min-width:16px; height:16px; padding:0 3px;
    background:var(--copper); color:#fff; font-size:9.5px; font-weight:700;
    border-radius:8px; display:flex; align-items:center; justify-content:center;
    border:2px solid var(--page);
  }

  .user-chip{
    display:flex; align-items:center; gap:8px; height:36px; padding:0 10px 0 4px;
    border:1px solid var(--border); border-radius:10px; cursor:pointer; background:var(--surface);
  }
  .user-chip:hover{ background:var(--surface-hover); border-color:var(--border-strong); }
  .avatar{
    width:27px; height:27px; border-radius:7px; background:linear-gradient(150deg,var(--copper),var(--teal));
    color:#fff; display:flex; align-items:center; justify-content:center;
    font-family:"Archivo",sans-serif; font-weight:800; font-size:10.5px; flex-shrink:0;
    box-shadow:0 0 0 1px rgba(0,0,0,.06) inset;
  }
  .user-meta{ line-height:1.22; }
  .user-name{ font-size:12.5px; font-weight:700; }
  .user-role{ font-size:10.5px; color:var(--text-faint); }

  .dropdown{
    position:absolute; top:calc(100% + 8px); right:0; min-width:250px;
    background:var(--surface-raised); border:1px solid var(--border); border-radius:13px;
    box-shadow:var(--shadow-md); padding:8px; z-index:30; display:none;
  }
  .dropdown.open{ display:block; }
  .dropdown-title{ font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--text-faint); padding:7px 9px 5px; }
  .dropdown-item{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:9px 9px; border-radius:9px; cursor:pointer;
  }
  .dropdown-item:hover{ background:var(--surface-hover); }
  .dropdown-item .di-name{ font-size:13px; font-weight:600; }
  .dropdown-item .di-sub{ font-size:11.5px; color:var(--text-faint); margin-top:1px; }
  .dot{ width:7px; height:7px; border-radius:50%; background:var(--success); flex-shrink:0; }
  .dot.muted{ background:var(--border-strong); }

  /* ---- Content ---- */
  .content{ padding:26px 30px 68px; overflow-y:auto; }
  .page{ display:none; max-width:1320px; }
  .page.active{ display:block; animation:fade .16s ease; }
  @keyframes fade{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }

  .page-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:22px; flex-wrap:wrap; }
  .page-head h1{ font-size:25px; font-weight:800; letter-spacing:-.3px; }
  .page-desc{ color:var(--text-muted); font-size:13.5px; margin-top:5px; max-width:64ch; }
  .primary-btn{
    display:flex; align-items:center; gap:8px; background:var(--copper); color:#fff;
    border:none; border-radius:10px; padding:10px 16px; font-weight:700; font-size:12.5px;
    cursor:not-allowed; white-space:nowrap; opacity:.5;
  }
  .primary-btn svg{ width:14px; height:14px; }
  .ghost-btn{
    display:inline-flex; align-items:center; gap:6px; background:none; color:var(--text-muted);
    border:1px solid var(--border); border-radius:8px; padding:6px 11px; font-weight:600; font-size:11.5px;
    cursor:not-allowed; opacity:.75; white-space:nowrap;
  }
  .ghost-btn svg{ width:12.5px; height:12.5px; }

  /* ---- Section labels ---- */
  .section-label{ display:flex; align-items:center; gap:9px; margin:26px 0 12px; }
  .section-label:first-of-type{ margin-top:0; }
  .section-label span{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--text-faint); white-space:nowrap; }
  .section-label::after{ content:''; height:1px; flex:1; background:var(--border); }

  /* ---- KPI hero row ---- */
  .kpi-hero-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  @media (max-width:900px){ .kpi-hero-grid{ grid-template-columns:1fr 1fr; } }
  @media (max-width:600px){ .kpi-hero-grid{ grid-template-columns:1fr; } }

  .kpi-hero{
    position:relative; overflow:hidden;
    background:var(--surface); border:1px solid var(--border); border-radius:16px;
    padding:16px 17px 15px; box-shadow:var(--shadow-sm);
  }
  .kpi-hero::before{
    content:''; position:absolute; inset:0 0 auto 0; height:3px;
    background:var(--tint,var(--copper));
  }
  .kpi-hero::after{
    content:''; position:absolute; top:-40%; right:-25%; width:140px; height:140px; border-radius:50%;
    background:radial-gradient(circle,var(--tint-wash,var(--copper-wash)) 0%, transparent 72%);
    pointer-events:none;
  }
  .kpi-hero-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:14px; position:relative; }
  .kpi-hero-icon{
    width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
    background:var(--tint-soft,var(--copper-soft)); color:var(--tint,var(--copper));
  }
  .kpi-hero-icon svg{ width:18px; height:18px; }
  .kpi-hero-delta-slot{ font-size:11px; color:var(--text-faint); font-weight:600; text-align:right; }
  .kpi-hero-label{ font-size:12px; color:var(--text-muted); font-weight:600; margin-bottom:5px; position:relative; }
  .kpi-hero-value{ font-family:"Archivo",sans-serif; font-size:29px; font-weight:800; letter-spacing:-.5px; line-height:1; position:relative; color:var(--text); }
  .kpi-hero-value .dash{ color:var(--text-faint); font-weight:700; }
  .kpi-hero-foot{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:13px; position:relative; }
  .kpi-hero-note{ font-size:11px; color:var(--text-faint); }
  .kpi-spark{ width:64px; height:22px; flex-shrink:0; color:var(--border-strong); }

  /* ---- KPI secondary row ---- */
  .kpi-sec-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  @media (max-width:900px){ .kpi-sec-grid{ grid-template-columns:1fr 1fr; } }
  @media (max-width:600px){ .kpi-sec-grid{ grid-template-columns:1fr; } }
  .kpi-sec{
    display:flex; align-items:center; gap:11px;
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:11px 13px;
  }
  .kpi-sec-icon{
    width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
    background:var(--tint-soft,var(--teal-soft)); color:var(--tint,var(--teal));
  }
  .kpi-sec-icon svg{ width:15px; height:15px; }
  .kpi-sec-body{ min-width:0; flex:1; }
  .kpi-sec-label{ font-size:11px; color:var(--text-faint); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .kpi-sec-value{ font-family:"Archivo",sans-serif; font-size:17px; font-weight:800; letter-spacing:-.2px; color:var(--text); margin-top:1px; }
  .kpi-sec-value .dash{ color:var(--text-faint); }

  /* ---- Panels & grids ---- */
  .grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .grid-3{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  @media (max-width:980px){ .grid-2, .grid-3{ grid-template-columns:1fr; } }
  @media (min-width:981px) and (max-width:1180px){ .grid-3{ grid-template-columns:1fr 1fr; } }

  .panel{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px 17px; }
  .panel-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:13px; }
  .panel-title{ font-size:13px; font-weight:700; display:flex; align-items:center; gap:8px; font-family:"Archivo",sans-serif; }
  .panel-title-ic{ width:24px; height:24px; border-radius:7px; background:var(--copper-soft); color:var(--copper); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .panel-title-ic svg{ width:13px; height:13px; }
  .panel-note{ font-size:10.5px; font-weight:600; color:var(--text-faint); background:var(--surface-2); padding:4px 9px; border-radius:20px; border:1px solid var(--border); white-space:nowrap; }

  /* ---- Chart card / empty-state chart ---- */
  .chart-card{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:17px 18px 18px; }
  .chart-card-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
  .chart-legend{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .legend-item{ display:flex; align-items:center; gap:6px; font-size:11.5px; font-weight:600; color:var(--text-muted); }
  .legend-dot{ width:8px; height:8px; border-radius:2.5px; flex-shrink:0; }

  .chart-canvas{
    position:relative; border-radius:11px; background:var(--surface-2);
    border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  .chart-canvas.h-lg{ height:230px; }
  .chart-canvas.h-sm{ height:186px; }
  .chart-grid-lines{ position:absolute; inset:14px 14px 30px; pointer-events:none; }
  .chart-grid-lines i{ position:absolute; left:0; right:0; height:1px; background:var(--border); opacity:.9; }
  .chart-baseline{ position:absolute; left:14px; right:14px; bottom:30px; height:1px; background:var(--border-strong); }

  .chart-empty{ position:relative; display:flex; flex-direction:column; align-items:center; text-align:center; gap:9px; padding:18px 22px; max-width:340px; }
  .chart-empty-icon{
    width:38px; height:38px; border-radius:11px; background:var(--surface); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; color:var(--text-faint); margin-bottom:2px;
    box-shadow:var(--shadow-sm);
  }
  .chart-empty-icon svg{ width:18px; height:18px; }
  .chart-empty p{ margin:0; font-size:12px; color:var(--text-muted); line-height:1.45; }
  .chart-empty .ghost-btn{ margin-top:3px; }

  /* ---- Connections / integrations panel ---- */
  .progress-track{ height:6px; border-radius:4px; background:var(--surface-2); border:1px solid var(--border); overflow:hidden; margin:10px 0 14px; }
  .progress-fill{ height:100%; border-radius:4px; background:var(--copper); width:0%; transition:width .3s ease; }
  .conn-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 2px; border-bottom:1px solid var(--border); }

  .table-card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; overflow:hidden; }

  .toggle-row{ display:flex; align-items:center; justify-content:space-between; padding:4px 0 6px; }
  .toggle-row-label{ font-size:13px; font-weight:600; }
  .toggle-row-sub{ font-size:11px; color:var(--text-faint); margin-top:1px; }
  .toggle{ position:relative; width:38px; height:21px; border-radius:20px; background:var(--border-strong); cursor:pointer; flex-shrink:0; transition:background .15s ease; border:none; }
  .toggle.on{ background:var(--success); }
  .toggle::after{ content:''; position:absolute; top:2px; left:2px; width:17px; height:17px; border-radius:50%; background:#fff; transition:left .15s ease; box-shadow:0 1px 2px rgba(0,0,0,.25); }
  .toggle.on::after{ left:19px; }

  .modal-actions{ display:flex; justify-content:flex-end; gap:9px; margin-top:20px; }
  .btn-secondary{
    background:var(--surface-2); border:1px solid var(--border); border-radius:9px;
    padding:9px 15px; font-weight:700; font-size:12.5px; cursor:pointer; color:var(--text);

  .btn-secondary:hover{ background:var(--surface-hover); border-color:var(--border-strong); }
  .btn-primary{
    background:var(--copper); color:#fff; border:none; border-radius:9px;

  /* ================= EMPRESAS (dados reais via API) ================= */
  (function(){
    const state = { items:[], loading:false, error:null, status:'todas', search:'' };

    function toast(message, type){
      const wrap = document.getElementById('toastWrap');
      const el = document.createElement('div');
      el.className = 'toast ' + (type||'success');
      el.innerHTML = svg(type==='error' ? 'alertCircle':'checkCircle') + '<span>'+message+'</span>';
      wrap.appendChild(el);
      setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .25s'; setTimeout(()=>el.remove(),250); }, 3200);
    }

    async function api(path, opts){
      const res = await fetch('/api/empresas'+path, {
        headers:{'Content-Type':'application/json'},
        ...opts,
      });
      let body = null;
      try{ body = await res.json(); }catch(e){}
      if(!res.ok){
        const err = new Error((body && (body.error || 'Falha na requisição')) || 'Falha na requisição');
        err.status = res.status; err.errors = body && body.errors;
        throw err;
      }
      return body;
    }

    async function load(){
      state.loading = true; state.error = null; render();
      try{
        const qs = state.status !== 'todas' ? ('?status='+state.status) : '';
        const data = await api(qs, { method:'GET' });
        state.items = data.empresas;
      }catch(err){
        state.error = err.message || 'Não foi possível carregar as empresas.';
      }finally{
        state.loading = false; render();
      }
    }

    function filteredItems(){
      const q = state.search.trim().toLowerCase();
      if(!q) return state.items;
      return state.items.filter(e =>
        e.razaoSocial.toLowerCase().includes(q) ||
        (e.nomeFantasia||'').toLowerCase().includes(q) ||
        e.cnpj.includes(q.replace(/\D/g,''))
      );
    }

    function fmtDate(iso){
      try{ return new Date(iso).toLocaleDateString('pt-BR'); }catch(e){ return '—'; }
    }

    function render(){
      const root = document.getElementById('empresasRoot');
      if(!root) return;

      let html = '<div class="toolbar">'
        + '<div class="seg" id="empSeg">'
          + ['todas','ativas','inativas'].map(s=>'<button data-status="'+s+'" class="'+(state.status===s?'active':'')+'">'+(s[0].toUpperCase()+s.slice(1))+'</button>').join('')
        + '</div>'
        + '<div class="search-box">'+svg('search')+'<input type="text" id="empSearch" placeholder="Buscar por razão social, fantasia ou CNPJ" value="'+state.search.replace(/"/g,'&quot;')+'"></div>'
      + '</div>';

      if(state.loading){
        html += '<div class="table-card"><div class="table-skel"><span class="spin"></span><span>Carregando empresas…</span></div></div>';
      } else if(state.error){
        html += '<div class="empty-panel"><div class="empty-icon" style="color:var(--danger); background:var(--danger-soft);">'+svg('alertCircle')+'</div>'
          + '<h2 style="color:var(--danger);">Não foi possível carregar</h2><p class="lead">'+state.error+'</p>'
          + '<button class="ghost-btn" id="empRetry" style="cursor:pointer; opacity:1;">'+svg('activity')+'<span>Tentar novamente</span></button></div>';
      } else {
        const items = filteredItems();
        if(!state.items.length){
          html += '<div class="empty-panel"><div class="empty-icon">'+svg('building')+'</div>'
            + '<h2>Nenhuma empresa cadastrada</h2>'
            + '<p class="lead">Cadastre a primeira empresa (CNPJ, razão social e nome fantasia) para começar a organizar o grupo dentro do Cerne.</p>'
            + '<button class="primary-btn enabled" id="empEmptyNew" type="button">'+svg('plus')+'<span>Cadastrar empresa</span></button></div>';
        } else if(!items.length){
          html += '<div class="empty-panel"><div class="empty-icon">'+svg('search')+'</div><h2>Nada encontrado</h2><p class="lead">Nenhuma empresa corresponde à busca "'+state.search+'".</p></div>';
        } else {
          html += '<div class="table-card"><div class="table-wrap"><table class="data-table"><thead><tr>'
            + '<th>Empresa</th><th>CNPJ</th><th>Status</th><th>Cadastrada em</th><th></th>'
            + '</tr></thead><tbody>'
            + items.map(e => '<tr class="'+(e.ativo?'':'inactive')+'">'
              + '<td><div class="company-name">'+escapeHtml(e.razaoSocial)+'</div>'+(e.nomeFantasia?'<div class="company-fantasy">'+escapeHtml(e.nomeFantasia)+'</div>':'')+'</td>'
              + '<td class="mono">'+e.cnpjFormatado+'</td>'
              + '<td>'+(e.ativo ? '<span class="badge-status on"><span class="dot"></span>Ativa</span>' : '<span class="badge-status off"><span class="dot"></span>Inativa</span>')+'</td>'
              + '<td class="tab-nums">'+fmtDate(e.criadoEm)+'</td>'
              + '<td><div class="row-actions">'
                + '<button class="row-ic-btn" data-edit="'+e.id+'" title="Editar" type="button">'+svg('edit')+'</button>'
                + '<button class="row-ic-btn '+(e.ativo?'danger':'success')+'" data-toggle="'+e.id+'" data-next="'+(!e.ativo)+'" title="'+(e.ativo?'Desativar':'Ativar')+'" type="button">'+svg('power')+'</button>'
              + '</div></td>'
            + '</tr>').join('')
            + '</tbody></table></div></div>';
        }
      }

      root.innerHTML = html;

      const seg = document.getElementById('empSeg');
      if(seg) seg.querySelectorAll('button').forEach(b=> b.addEventListener('click', ()=>{ state.status = b.dataset.status; load(); }));
      const search = document.getElementById('empSearch');
      if(search) search.addEventListener('input', ()=>{ state.search = search.value; render(); const el=document.getElementById('empSearch'); if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); } });
      const retry = document.getElementById('empRetry');
      if(retry) retry.addEventListener('click', load);
      const emptyNew = document.getElementById('empEmptyNew');
      if(emptyNew) emptyNew.addEventListener('click', ()=> openModal());
      root.querySelectorAll('[data-edit]').forEach(b=> b.addEventListener('click', ()=>{
        const emp = state.items.find(e=> String(e.id)===b.dataset.edit);
        openModal(emp);
      }));
      root.querySelectorAll('[data-toggle]').forEach(b=> b.addEventListener('click', async ()=>{
        const id = b.dataset.toggle, next = b.dataset.next === 'true';
        b.disabled = true;
        try{
          await api('/'+id+'/status', { method:'PATCH', body: JSON.stringify({ ativo: next }) });
          toast(next ? 'Empresa ativada.' : 'Empresa desativada.');
          load();
        }catch(err){ toast(err.message, 'error'); b.disabled = false; }
      }));
    }

    function escapeHtml(s){
      return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function maskCNPJ(v){
      const d = v.replace(/\D/g,'').slice(0,14);
      let out = d;
      if(d.length > 12) out = d.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{0,2})/, '$1.$2.$3/$4-$5');
      else if(d.length > 8) out = d.replace(/(\d{2})(\d{3})(\d{3})(\d{0,4})/, '$1.$2.$3/$4');
      else if(d.length > 5) out = d.replace(/(\d{2})(\d{3})(\d{0,3})/, '$1.$2.$3');
      else if(d.length > 2) out = d.replace(/(\d{2})(\d{0,3})/, '$1.$2');
      return out;
    }

    function openModal(empresa){
      const isEdit = !!empresa;
      const modalRoot = document.getElementById('modalRoot');
      modalRoot.innerHTML = '<div class="modal-overlay" id="modalOverlay">'
        + '<div class="modal-card">'
          + '<div class="modal-head"><div class="modal-title">'+(isEdit?'Editar empresa':'Nova empresa')+'</div>'
            + '<button class="row-ic-btn" id="modalClose" type="button">'+svg('x')+'</button></div>'
          + '<div class="modal-sub">'+(isEdit?'Atualize os dados cadastrais da empresa.':'Preencha os dados para cadastrar uma nova empresa/CNPJ no grupo.')+'</div>'
          + '<form id="empForm">'
            + '<div class="field"><label>CNPJ</label><input type="text" inputmode="numeric" id="fCnpj" placeholder="00.000.000/0000-00" value="'+(isEdit?maskCNPJ(empresa.cnpj):'')+'" maxlength="18">'
              + '<div class="field-error" id="eCnpj" style="display:none;"></div></div>'
            + '<div class="field"><label>Razão social</label><input type="text" id="fRazao" placeholder="Razão social conforme CNPJ" value="'+(isEdit?escapeHtml(empresa.razaoSocial):'')+'" maxlength="200">'
              + '<div class="field-error" id="eRazao" style="display:none;"></div></div>'
            + '<div class="field"><label>Nome fantasia <span class="opt">(opcional)</span></label><input type="text" id="fFantasia" placeholder="Nome usado no dia a dia" value="'+(isEdit?escapeHtml(empresa.nomeFantasia||''):'')+'" maxlength="200"></div>'
            + (isEdit ? '<div class="toggle-row"><div><div class="toggle-row-label">Empresa ativa</div><div class="toggle-row-sub">Empresas inativas ficam ocultas nas seleções do sistema.</div></div>'
              + '<button type="button" class="toggle '+(empresa.ativo?'on':'')+'" id="fAtivo" data-on="'+(empresa.ativo?'true':'false')+'"></button></div>' : '')
            + '<div class="modal-actions">'
              + '<button type="button" class="btn-secondary" id="modalCancel">Cancelar</button>'
              + '<button type="submit" class="btn-primary" id="modalSave">'+svg('check')+'<span>'+(isEdit?'Salvar alterações':'Cadastrar empresa')+'</span></button>'
            + '</div>'
          + '</form>'
        + '</div>'
      + '</div>';

      const overlay = document.getElementById('modalOverlay');
      const close = ()=> modalRoot.innerHTML = '';
      overlay.addEventListener('click', (e)=>{ if(e.target === overlay) close(); });
      document.getElementById('modalClose').addEventListener('click', close);
      document.getElementById('modalCancel').addEventListener('click', close);

      const cnpjInput = document.getElementById('fCnpj');
      cnpjInput.addEventListener('input', ()=>{ cnpjInput.value = maskCNPJ(cnpjInput.value); });
      cnpjInput.focus();

      const toggleBtn = document.getElementById('fAtivo');
      if(toggleBtn) toggleBtn.addEventListener('click', ()=>{
        const on = toggleBtn.dataset.on !== 'true';
        toggleBtn.dataset.on = String(on);
        toggleBtn.classList.toggle('on', on);
      });

      document.getElementById('empForm').addEventListener('submit', async (e)=>{
        e.preventDefault();
        ['eCnpj','eRazao'].forEach(id=>{ const el=document.getElementById(id); el.style.display='none'; el.textContent=''; });
        document.getElementById('fCnpj').classList.remove('invalid');
        document.getElementById('fRazao').classList.remove('invalid');

        const payload = {
          cnpj: document.getElementById('fCnpj').value,
          razaoSocial: document.getElementById('fRazao').value,
          nomeFantasia: document.getElementById('fFantasia').value,
        };
        if(isEdit && toggleBtn) payload.ativo = toggleBtn.dataset.on === 'true';

        const saveBtn = document.getElementById('modalSave');
        saveBtn.disabled = true;
        try{
          if(isEdit) await api('/'+empresa.id, { method:'PUT', body: JSON.stringify(payload) });
          else await api('', { method:'POST', body: JSON.stringify(payload) });
          close();
          toast(isEdit ? 'Empresa atualizada.' : 'Empresa cadastrada.');
          load();
        }catch(err){
          saveBtn.disabled = false;
          if(err.errors){
            if(err.errors.cnpj){ const el=document.getElementById('eCnpj'); el.textContent=err.errors.cnpj; el.style.display='block'; document.getElementById('fCnpj').classList.add('invalid'); }
            if(err.errors.razaoSocial){ const el=document.getElementById('eRazao'); el.textContent=err.errors.razaoSocial; el.style.display='block'; document.getElementById('fRazao').classList.add('invalid'); }
          } else {
            toast(err.message, 'error');
          }
        }
      });
    }

    document.getElementById('btnNewEmpresa').addEventListener('click', ()=> openModal());

    window.Empresas = { load };
  })();

})();
</script>
</body>
</html>
