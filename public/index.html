          + '<h2 style="color:var(--danger);">Não foi possível carregar</h2><p class="lead">'+escapeHtml(state.error)+'</p></div>';
      } else if(!state.itens.length){
        html += '<div class="empty-panel"><div class="empty-icon">'+svg('receipt')+'</div>'
          + '<h2>Nenhum pedido encontrado</h2>'
          + '<p class="lead">Nenhum pedido corresponde ao filtro atual no período selecionado.</p></div>';
      } else {
        const todosSelecionados = state.itens.length>0 && state.itens.every(i=>state.selecionados.has(i.pedidoId));
        html += '<div class="table-card"><div class="table-wrap"><table class="data-table"><thead><tr>'
          + '<th><input type="checkbox" id="fatSelectAll" '+(todosSelecionados?'checked':'')+'></th>'
          + '<th>Data</th><th>Pedido</th><th>Marketplace</th><th>Loja</th><th>Cliente</th><th>Valor</th><th>Status do pedido</th><th>Faturamento</th><th></th>'
          + '</tr></thead><tbody>'
          + state.itens.map(i => '<tr'+(i.pedidoCancelado?' style="opacity:.6;"':'')+'>'
            + '<td><input type="checkbox" data-sel="'+i.pedidoId+'" '+(state.selecionados.has(i.pedidoId)?'checked':'')+'></td>'
            + '<td class="tab-nums">'+fmtDate(i.data)+'</td>'
            + '<td class="mono">'+escapeHtml(i.mlOrderId)+'</td>'
            + '<td>'+escapeHtml(i.marketplace)+'</td>'
            + '<td>'+escapeHtml(i.loja||'—')+'</td>'
            + '<td>'+escapeHtml(i.cliente||'—')+'</td>'
            + '<td class="mono">'+money(i.valor)+'</td>'
            + '<td>'+escapeHtml(i.statusPedido||'—')+'</td>'
            + '<td><span class="status-chip" style="'+statusChipStyle(i.situacaoFaturamento)+'">'+STATUS_LABEL[i.situacaoFaturamento]+'</span></td>'
            + '<td><select data-change="'+i.pedidoId+'" style="font-size:12px;padding:4px 6px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);">'
              + STATUS_OPCOES.map(function(par){ return '<option value="'+par[0]+'" '+(i.situacaoFaturamento===par[0]?'selected':'')+'>'+par[1]+'</option>'; }).join('')
            + '</select></td>'
          + '</tr>').join('')
          + '</tbody></table></div></div>';
      }

      root.innerHTML = html;

      const seg = document.getElementById('fatSeg');
      if(seg) seg.querySelectorAll('button').forEach(b=> b.addEventListener('click', ()=>{ state.status = b.dataset.status; loadItens(); }));
      const search = document.getElementById('fatSearch');
      if(search) search.addEventListener('input', ()=>{
        state.search = search.value;
        clearTimeout(search._t);
        search._t = setTimeout(loadItens, 300);
      });
      root.querySelectorAll('[data-lote]').forEach(b=> b.addEventListener('click', ()=> aplicarStatusLote(b.dataset.lote)));
      root.querySelectorAll('[data-change]').forEach(sel=> sel.addEventListener('change', ()=> aplicarStatusUnico(Number(sel.dataset.change), sel.value)));
      const selectAll = document.getElementById('fatSelectAll');
      if(selectAll) selectAll.addEventListener('change', ()=>{
        if(selectAll.checked) state.itens.forEach(i=> state.selecionados.add(i.pedidoId));
        else state.itens.forEach(i=> state.selecionados.delete(i.pedidoId));
        render();
      });
      root.querySelectorAll('[data-sel]').forEach(cb=> cb.addEventListener('change', ()=>{
        const id = Number(cb.dataset.sel);
        if(cb.checked) state.selecionados.add(id); else state.selecionados.delete(id);
        render();
      }));
    }

    window.Faturamento = { load };
  })();

  /* ================= NOTAS FISCAIS — registro e acompanhamento =================
     Ativado em 24/08/2026. Estrutura para registrar/acompanhar notas
     relacionadas a um pedido — sem emissão real (SEFAZ) nesta etapa e sem
     inventar número de NF-e/chave de acesso: só o que o usuário digitar
     (de uma nota já emitida em outro sistema). NÃO duplica pedido — cada
     nota é vinculada a um ml_pedidos existente (tabela notas_fiscais).
     Usa o filtro do header. */
  (function(){
    const STATUS_OPCOES = [
      ['pendente','Pendente'],
      ['emitida','Emitida'],
      ['cancelada','Cancelada'],
      ['rejeitada','Rejeitada'],
    ];
    const STATUS_LABEL = Object.fromEntries(STATUS_OPCOES);
    const state = { loading:false, error:null, itens:[], status:'todos', search:'' };

    function toast(message, type){
      const wrap = document.getElementById('toastWrap');
      const el = document.createElement('div');
      el.className = 'toast ' + (type||'success');
      el.innerHTML = svg(type==='error' ? 'alertCircle':'checkCircle') + '<span>'+message+'</span>';
      wrap.appendChild(el);
      setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .25s'; setTimeout(()=>el.remove(),250); }, 3200);
    }
    function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function money(v){ return v===null||v===undefined ? '—' : 'R$ ' + Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2}); }
    function fmtDate(iso){ if(!iso) return '—'; try{ const [y,m,d] = String(iso).slice(0,10).split('-'); return d+'/'+m+'/'+y; }catch(e){ return '—'; } }
    function statusChipStyle(status){
      const cor = status==='emitida' ? 'success' : (status==='rejeitada'||status==='cancelada') ? 'danger' : 'warning';
      return 'color:var(--'+cor+');background:var(--'+cor+'-soft);';
    }

    async function api(path, opts){
      const res = await fetch('/api/notas-fiscais'+path, { headers:{'Content-Type':'application/json'}, ...opts });
      let body = null; try{ body = await res.json(); }catch(e){}
      if(!res.ok){ const err = new Error((body&&(body.error||(body.errors&&body.errors.geral)))||'Falha na requisição.'); err.errors = body&&body.errors; throw err; }
      return body;
    }
    async function apiPedido(id){
      const res = await fetch('/api/pedidos/'+id);
      let body = null; try{ body = await res.json(); }catch(e){}
      if(!res.ok) throw new Error((body && body.error) || 'Não foi possível carregar o pedido.');
      return body;
    }

    async function loadItens(){
      const filtro = window.CerneFiltro.state;
      if(!filtro.empresaId){ state.itens=[]; state.loading=false; render(); return; }
      state.loading = true; state.error = null; render();
      try{
        const params = new URLSearchParams({ empresaId: filtro.empresaId, periodo: filtro.periodo });
        if(state.status !== 'todos') params.set('status', state.status);
        if(state.search.trim()) params.set('search', state.search.trim());
        const data = await api('?'+params.toString(), { method:'GET' });
        state.itens = data.itens;
      }catch(err){ state.error = err.message || 'Não foi possível carregar as notas fiscais.'; }
      finally{ state.loading = false; render(); }
    }

    function load(){ loadItens(); }

    window.CerneFiltro.onChange(()=>{
      const page = document.getElementById('page-invoices');
      if(page && page.classList.contains('active')) loadItens();
      else render();
    });

    function render(){
      const root = document.getElementById('notasFiscaisRoot');
      if(!root) return;
      const filtro = window.CerneFiltro.state;

      if(!filtro.loadingEmpresas && !filtro.empresas.length){
        root.innerHTML = '<div class="empty-panel"><div class="empty-icon">'+svg('building')+'</div>'
          + '<h2>Nenhuma empresa ativa</h2>'
          + '<p class="lead">Cadastre e ative uma empresa em <strong>Cadastros → Empresas</strong> para ver as notas fiscais aqui.</p></div>';
        return;
      }

      let html = '<div class="field-hint" style="margin-bottom:12px;max-width:760px;">Estrutura para registrar e acompanhar notas relacionadas aos pedidos — sem integração real com a SEFAZ nesta etapa. Números de NF-e e chaves de acesso nunca são inventados: um pedido sem nota registrada aparece como "Pendente".</div>';

      html += '<div class="toolbar">'
        + '<div class="seg" id="nfSeg">'
          + [['todos','Todos']].concat(STATUS_OPCOES).map(function(par){ return '<button data-status="'+par[0]+'" class="'+(state.status===par[0]?'active':'')+'">'+par[1]+'</button>'; }).join('')
        + '</div>'
        + '<div class="search-box">'+svg('search')+'<input type="text" id="nfSearch" placeholder="Buscar por pedido, cliente ou número da nota" value="'+state.search.replace(/"/g,'&quot;')+'"></div>'
      + '</div>';

      if(state.loading || filtro.loadingEmpresas){
        html += '<div class="table-card"><div class="table-skel"><span class="spin"></span><span>Carregando notas fiscais…</span></div></div>';
      } else if(state.error){
        html += '<div class="empty-panel"><div class="empty-icon" style="color:var(--danger); background:var(--danger-soft);">'+svg('alertCircle')+'</div>'
          + '<h2 style="color:var(--danger);">Não foi possível carregar</h2><p class="lead">'+escapeHtml(state.error)+'</p></div>';
      } else if(!state.itens.length){
        html += '<div class="empty-panel"><div class="empty-icon">'+svg('fileText')+'</div>'
          + '<h2>Nenhum pedido encontrado</h2>'
          + '<p class="lead">Nenhum pedido corresponde ao filtro atual no período selecionado.</p></div>';
      } else {
        html += '<div class="table-card"><div class="table-wrap"><table class="data-table"><thead><tr>'
          + '<th>Número</th><th>Série</th><th>Pedido</th><th>Cliente</th><th>Valor</th><th>Emissão</th><th>Chave de acesso</th><th>Status</th><th></th>'
          + '</tr></thead><tbody>'
          + state.itens.map(i => '<tr>'
            + '<td class="mono">'+(i.numero?escapeHtml(i.numero):'—')+'</td>'
            + '<td class="mono">'+(i.serie?escapeHtml(i.serie):'—')+'</td>'
            + '<td class="mono">'+escapeHtml(i.mlOrderId)+'</td>'
            + '<td>'+escapeHtml(i.cliente||'—')+'</td>'
            + '<td class="mono">'+(i.valor!==null?money(i.valor):'<span class="dash">—</span>')+'</td>'
            + '<td class="tab-nums">'+(i.dataEmissao?fmtDate(i.dataEmissao):'—')+'</td>'
            + '<td class="mono" style="font-size:11px;">'+(i.chaveAcesso?escapeHtml(i.chaveAcesso):'<span class="dash">—</span>')+'</td>'
            + '<td><span class="status-chip" style="'+statusChipStyle(i.status)+'">'+STATUS_LABEL[i.status]+'</span></td>'
            + '<td><div class="row-actions"><button class="row-ic-btn" data-abrir="'+i.pedidoId+'" title="Abrir" type="button">'+svg('eye')+'</button></div></td>'
          + '</tr>').join('')
          + '</tbody></table></div></div>';
      }

      root.innerHTML = html;

      const seg = document.getElementById('nfSeg');
      if(seg) seg.querySelectorAll('button').forEach(b=> b.addEventListener('click', ()=>{ state.status = b.dataset.status; loadItens(); }));
      const search = document.getElementById('nfSearch');
      if(search) search.addEventListener('input', ()=>{
        state.search = search.value;
        clearTimeout(search._t);
        search._t = setTimeout(loadItens, 300);
      });
      root.querySelectorAll('[data-abrir]').forEach(b=> b.addEventListener('click', ()=> openModal(Number(b.dataset.abrir))));
    }

    async function openModal(pedidoId){
      const modalRoot = document.getElementById('modalRoot');
      modalRoot.innerHTML = '<div class="modal-overlay" id="modalOverlay"><div class="modal-card wide"><div class="table-skel"><span class="spin"></span><span>Carregando pedido…</span></div></div></div>';
      const closeEarly = ()=> modalRoot.innerHTML='';
      document.getElementById('modalOverlay').addEventListener('click', (e)=>{ if(e.target.id==='modalOverlay') closeEarly(); });

      let pedidoData;
      try{ pedidoData = await apiPedido(pedidoId); }
      catch(err){ toast(err.message, 'error'); closeEarly(); return; }

      const nota = state.itens.find(i => i.pedidoId === pedidoId) || {};
      const pedido = pedidoData.pedido;
      const moeda = pedido.moeda || 'BRL';
      const moneyM = v => v===null||v===undefined ? '—' : (moeda==='BRL'?'R$ ':moeda+' ') + Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2});

      const html = '<div class="modal-overlay" id="modalOverlay"><div class="modal-card wide">'
        + '<div class="modal-head"><div class="modal-title">Nota fiscal — Pedido #'+pedido.mlOrderId+'</div><button class="row-ic-btn" id="modalClose" type="button">'+svg('x')+'</button></div>'
        + '<div class="modal-sub">'+escapeHtml(pedido.loja||'—')+' · '+escapeHtml(pedido.compradorNickname||'—')+'</div>'

        + '<div class="detail-section-title" style="margin-top:4px;">Dados do pedido</div>'
        + '<div class="detail-grid">'
          + '<div class="dg-item"><div class="dg-label">Data</div><div class="dg-value">'+new Date(pedido.dataCriacao).toLocaleDateString('pt-BR')+'</div></div>'
          + '<div class="dg-item"><div class="dg-label">Cliente</div><div class="dg-value">'+escapeHtml(pedido.compradorNickname||'—')+'</div></div>'
          + '<div class="dg-item"><div class="dg-label">Loja</div><div class="dg-value">'+escapeHtml(pedido.loja||'—')+'</div></div>'
          + '<div class="dg-item"><div class="dg-label">Valor do pedido</div><div class="dg-value">'+moneyM(nota.valorPedido)+'</div></div>'
          + '<div class="dg-item"><div class="dg-label">Status do pedido</div><div class="dg-value">'+escapeHtml(pedido.status||'—')+'</div></div>'
        + '</div>'
        + '<div class="detail-section-title">Itens</div>'
        + (pedidoData.itens||[]).map(it => '<div class="item-row"><div><div class="ir-title">'+escapeHtml(it.titulo||it.mlItemId||'—')+'</div>'
            + '<div class="ir-sku">'+(it.sku?('SKU '+escapeHtml(it.sku)):'sem SKU informado')+' · qtd '+it.quantidade+'</div></div>'
            + '<div class="mono">'+moneyM(it.valorTotalItem)+'</div></div>').join('')

        + '<div class="detail-section-title">Nota fiscal</div>'
        + '<form id="nfForm">'
          + '<div class="inline-form" style="margin-top:0;">'
            + '<div class="field narrow"><label>Número</label><input type="text" id="fNumero" value="'+(nota.numero?escapeHtml(nota.numero):'')+'"><div class="field-error" id="eNumero" style="display:none;"></div></div>'
            + '<div class="field narrow"><label>Série</label><input type="text" id="fSerie" value="'+(nota.serie?escapeHtml(nota.serie):'')+'"><div class="field-error" id="eSerie" style="display:none;"></div></div>'
          + '</div>'
          + '<div class="inline-form" style="margin-top:0;">'
            + '<div class="field narrow"><label>Valor <span class="opt">(opcional)</span></label><input type="text" inputmode="decimal" id="fValor" value="'+(nota.valor!=null?String(nota.valor).replace('.',','):'')+'"><div class="field-error" id="eValor" style="display:none;"></div></div>'
            + '<div class="field narrow"><label>Data de emissão</label><input type="date" id="fDataEmissao" value="'+(nota.dataEmissao||'')+'"><div class="field-error" id="eDataEmissao" style="display:none;"></div></div>'
          + '</div>'
          + '<div class="field"><label>Chave de acesso <span class="opt">(44 dígitos, quando existir)</span></label><input type="text" id="fChave" value="'+(nota.chaveAcesso?escapeHtml(nota.chaveAcesso):'')+'"><div class="field-error" id="eChaveAcesso" style="display:none;"></div></div>'
          + '<div class="field"><label>Status</label><select id="fStatus">'
            + STATUS_OPCOES.map(function(par){ return '<option value="'+par[0]+'" '+((nota.status||'pendente')===par[0]?'selected':'')+'>'+par[1]+'</option>'; }).join('')
          + '</select></div>'
          + '<div class="field"><label>Observação <span class="opt">(opcional)</span></label><input type="text" id="fObservacao" value="'+(nota.observacao?escapeHtml(nota.observacao):'')+'"></div>'
          + '<div class="modal-actions">'
            + '<button type="button" class="btn-secondary" id="modalCancel">Cancelar</button>'
            + '<button type="submit" class="btn-primary" id="modalSave">'+svg('check')+'<span>Salvar nota fiscal</span></button>'
          + '</div>'
        + '</form>'
      + '</div></div>';

      modalRoot.innerHTML = html;
      const overlay = document.getElementById('modalOverlay');
      const close = ()=> modalRoot.innerHTML = '';
      overlay.addEventListener('click', (e)=>{ if(e.target === overlay) close(); });
      document.getElementById('modalClose').addEventListener('click', close);
      document.getElementById('modalCancel').addEventListener('click', close);

      document.getElementById('nfForm').addEventListener('submit', async (e)=>{
        e.preventDefault();
        ['eNumero','eSerie','eValor','eDataEmissao','eChaveAcesso'].forEach(id=>{ const el=document.getElementById(id); el.style.display='none'; el.textContent=''; });

        const valorRaw = document.getElementById('fValor').value.trim();
        const payload = {
          numero: document.getElementById('fNumero').value,
          serie: document.getElementById('fSerie').value,
          valor: valorRaw ? Number(valorRaw.replace(',','.')) : null,
          dataEmissao: document.getElementById('fDataEmissao').value,
          chaveAcesso: document.getElementById('fChave').value,
          status: document.getElementById('fStatus').value,
          observacao: document.getElementById('fObservacao').value,
        };

        const saveBtn = document.getElementById('modalSave');
        saveBtn.disabled = true;
        try{
          await api('/pedido/'+pedidoId, { method:'PUT', body: JSON.stringify(payload) });
          close();
          toast('Nota fiscal salva.');
          loadItens();
        }catch(err){
          saveBtn.disabled = false;
          if(err.errors){
            let mostrou = false;
            ['numero','serie','valor','dataEmissao','chaveAcesso'].forEach(function(campo){
              if(err.errors[campo]){
                const elId = 'e'+campo.charAt(0).toUpperCase()+campo.slice(1);
                if(document.getElementById(elId)){ const el=document.getElementById(elId); el.textContent=err.errors[campo]; el.style.display='block'; mostrou = true; }
              }
            });
            if(!mostrou) toast(err.message, 'error');
          } else {
            toast(err.message, 'error');
          }
        }
      });
    }

    window.NotasFiscais = { load };
  })();

  /* ================= ADS — Product Ads real do Mercado Livre =================
     Ativado em 25/08/2026, corrigido em 25/08/2026 (ver docs/04-alteracoes.md).
     Duas fontes bem separadas (ver lib/ads.js): investimento/vendas
     atribuídas/receita atribuída vêm SEMPRE da API de Advertising do
     Mercado Livre (nunca calculados aqui); faturamento real/margem "antes
     do Ads" vêm da MESMA fonte única de Pedidos/DRE/Financeiro
     (lib/relatorioVendas.js). Nunca inventa valor: quando a API de Ads não
     está disponível pra uma conta, os campos aparecem como "Pendente de
     sincronização" — nunca um número estimado. Empresa e período vêm do
     filtro do header (window.CerneFiltro); loja é um filtro só desta tela.

     IMPORTANTE: a API de Advertising do Mercado Livre não identifica quais
     PEDIDOS pertencem à publicidade — só devolve totais agregados por
     anúncio/dia. Por isso a tabela por anúncio é dividida em DUAS visões
     separadas, nunca misturadas numa só: "Performance atribuída Mercado
     Ads" (só o que o Mercado Livre atribui) e "Resultado real do SKU após
     Ads" (todas as vendas reais daquele SKU, que podem incluir venda
     orgânica, menos o investimento em Ads). */
  (function(){
    const state = { loading:false, error:null, data:null, contaId:'', sort:'faturamento', sincronizando:false };

    function toast(message, type){
      const wrap = document.getElementById('toastWrap');
      const el = document.createElement('div');
      el.className = 'toast ' + (type||'success');
      el.innerHTML = svg(type==='error' ? 'alertCircle':'checkCircle') + '<span>'+message+'</span>';
      wrap.appendChild(el);
      setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .25s'; setTimeout(()=>el.remove(),250); }, 3200);
    }
    function fmtDateTime(iso){ if(!iso) return null; try{ return new Date(iso).toLocaleString('pt-BR'); }catch(e){ return null; } }
    function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function money(v){ return v===null||v===undefined ? null : 'R$ ' + Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2}); }
    function pendenteSync(){ return '<span style="color:var(--text-faint);font-style:italic;" title="Este dado depende da API de Publicidade do Mercado Livre, que ainda não retornou (ou a conta não tem acesso a Product Ads).">Pendente de sincronização</span>'; }
    function pendenteCusto(){ return '<span style="color:var(--text-faint);font-style:italic;" title="Falta cadastrar o custo de algum SKU deste anúncio em Produtos.">pendente</span>'; }
    function moneyOrPend(v){ return v===null||v===undefined ? pendenteSync() : money(v); }
    function roasFmt(v){ return v===null||v===undefined ? pendenteSync() : Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2})+'x'; }
    function pctFmt(v){ return v===null||v===undefined ? pendenteSync() : Number(v).toLocaleString('pt-BR',{minimumFractionDigits:1, maximumFractionDigits:1})+'%'; }
    function intFmt(v){ return v===null||v===undefined ? pendenteSync() : Number(v).toLocaleString('pt-BR'); }
    function fmtDiaCurto(diaISO){ const [, m, d] = diaISO.split('-'); return d+'/'+m; }

    async function apiAds(empresaId, periodo, contaId){
      const params = new URLSearchParams({ empresaId, periodo });
      if(contaId) params.set('contaId', contaId);
      const res = await fetch('/api/ads?'+params.toString());
      let body = null; try{ body = await res.json(); }catch(e){}
      if(!res.ok) throw new Error((body && body.error) || 'Não foi possível carregar os dados de Ads.');
      return body;
    }

    async function apiSincronizarAds(){
      const res = await fetch('/api/ads/sincronizar', { method:'POST' });
      const body = await res.json().catch(()=>null);
      if(!res.ok) throw new Error((body && body.error) || 'Falha ao sincronizar Ads.');
      return body;
    }

    async function sincronizarAgora(){
      state.sincronizando = true; render();
      try{
        await apiSincronizarAds();
        toast('Sincronização de Ads concluída.');
        await loadAds();
      }catch(err){
        toast(err.message || 'Falha ao sincronizar Ads.', 'error');
      }finally{
        state.sincronizando = false; render();
      }
    }

    async function loadAds(){
      const filtro = window.CerneFiltro.state;
      if(!filtro.empresaId){ state.data = null; state.loading = false; render(); return; }
      state.loading = true; state.error = null; render();
      try{ state.data = await apiAds(filtro.empresaId, filtro.periodo, state.contaId); }
      catch(err){ state.error = err.message; state.data = null; }
      state.loading = false; render();
    }

    function load(){ loadAds(); }

    window.CerneFiltro.onChange(()=>{
      const page = document.getElementById('page-ads');
      if(page && page.classList.contains('active')) loadAds();
      else render();
    });

    // ---- Cards de topo (Gasto hoje / Gasto no mês / Receita atribuída / ROAS / ACOS) ----
    function tintVars(tint){
      return tint === 'muted' ? '--tint:var(--text-muted);--tint-soft:var(--surface-2);' : '--tint:var(--'+tint+');--tint-soft:var(--'+tint+'-soft);';
    }
    function cardHTML(k){
      return '<div class="kpi-hero" style="'+tintVars(k.tint)+'">'
        + '<div class="kpi-hero-top"><div class="kpi-hero-icon">'+svg(k.icon)+'</div></div>'
        + '<div class="kpi-hero-label">'+escapeHtml(k.label)+'</div>'
        + '<div class="kpi-hero-value">'+k.valueHtml+'</div>'
        + '<div class="kpi-hero-foot"><span class="kpi-hero-note">'+escapeHtml(k.note)+'</span></div>'
      + '</div>';
    }
    function cardsHTML(cards){
      const items = [
        { label:'Gasto hoje', icon:'clock', tint:'copper', valueHtml: moneyOrPend(cards.gastoHoje), note:'Investimento real em Ads hoje (horário de Brasília)' },
        { label:'Gasto no mês', icon:'wallet', tint:'copper', valueHtml: moneyOrPend(cards.gastoMes), note:'Acumulado do dia 1 do mês até hoje' },
        { label:'Receita atribuída aos Ads', icon:'barChart', tint:'teal', valueHtml: moneyOrPend(cards.receitaAtribuidaPeriodo), note:'Vendas atribuídas pelo Mercado Livre no período selecionado' },
        { label:'ROAS', icon:'activity', tint: cards.roasPeriodo===null||cards.roasPeriodo===undefined ? 'muted' : (cards.roasPeriodo>=1?'success':'danger'), valueHtml: roasFmt(cards.roasPeriodo), note:'Receita atribuída ÷ investimento, no período' },
        { label:'ACOS', icon:'percent', tint:'muted', valueHtml: pctFmt(cards.acosPeriodo), note:'Investimento ÷ receita atribuída, no período' },
      ];
      return '<div class="kpi-hero-grid">' + items.map(cardHTML).join('') + '</div>'
        + (cards.parcial ? '<div class="field-hint" style="margin-top:8px;">Um ou mais desses números está somando só as lojas com sincronização de Ads disponível no momento — ver aviso acima.</div>' : '');
    }

    // ---- Gráfico diário: Investimento Ads x Receita atribuída (SVG simples, mesmo desenho de Visão Geral) ----
    function chartAdsHTML(diario){
      if(!diario || !diario.length){
        return '<div class="chart-canvas h-lg">' + chartGridLines(4)
          + chartEmptyState('lineChart', 'Sem série diária de Ads disponível para este período (a API de Publicidade pode não ter retornado dado, ou nenhuma conta tem acesso a Product Ads).')
        + '</div>';
      }
      const n = diario.length;
      const W = Math.max(n*10, 10), H = 100, topPad = 8, botPad = 10;
      const usable = H - topPad - botPad;
      const vals = diario.flatMap(d => [d.investimento||0, d.receitaAtribuida||0]);
      const maxV = Math.max(0, ...vals);
      const minV = Math.min(0, ...vals);
      const range = (maxV - minV) || 1;
      const yFor = v => topPad + usable * (1 - (v - minV) / range);
      const baseY = yFor(0);

      const barW = 6;
      let bars = '';
      let points = [];
      diario.forEach((d, i) => {
        const cx = i*10 + 5;
        const invest = d.investimento || 0;
        const y1 = yFor(invest);
        const barY = Math.min(y1, baseY), barH = Math.max(Math.abs(y1-baseY), 0.6);
        const dataLabel = fmtDiaCurto(d.data)+' — Investimento: '+(d.investimento===null?'pendente':money(d.investimento))+' · Receita atribuída: '+(d.receitaAtribuida===null?'pendente':money(d.receitaAtribuida));
        bars += '<rect x="'+(cx-barW/2)+'" y="'+barY+'" width="'+barW+'" height="'+barH+'" rx="1" fill="var(--copper)" fill-opacity="0.85"><title>'+escapeHtml(dataLabel)+'</title></rect>';
        points.push(cx+','+yFor(d.receitaAtribuida||0));
      });
      const line = '<polyline points="'+points.join(' ')+'" fill="none" stroke="var(--teal)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>';
      const dots = diario.map((d,i) => {
        const cx = i*10+5, cy = yFor(d.receitaAtribuida||0);
        const dataLabel = fmtDiaCurto(d.data)+' — Receita atribuída: '+(d.receitaAtribuida===null?'pendente':money(d.receitaAtribuida));
        return '<circle cx="'+cx+'" cy="'+cy+'" r="1.6" fill="var(--teal)" vector-effect="non-scaling-stroke"><title>'+escapeHtml(dataLabel)+'</title></circle>';
      }).join('');
      const baseline = '<line x1="0" y1="'+baseY+'" x2="'+W+'" y2="'+baseY+'" stroke="var(--border-strong)" stroke-width="1" vector-effect="non-scaling-stroke"/>';

      const labelStep = Math.max(1, Math.ceil(n/9));
      const labels = diario.map((d,i) => '<span>'+((i%labelStep===0 || i===n-1) ? escapeHtml(fmtDiaCurto(d.data)) : '')+'</span>').join('');

      return '<div class="chart-canvas" style="position:relative;height:200px;padding:0;">'
        + '<svg class="simple-chart-svg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="height:100%;">'
          + baseline + bars + line + dots
        + '</svg>'
      + '</div>'
      + '<div class="simple-chart-xlabels" style="grid-template-columns:repeat('+n+',1fr);">' + labels + '</div>';
    }
    function chartAdsCardHTML(data){
      return '<div class="chart-card" style="margin-bottom:14px;">'
        + '<div class="chart-card-head">'
          + '<div class="panel-title"><span class="panel-title-ic">'+svg('lineChart')+'</span>Investimento Ads x Receita atribuída</div>'
          + '<div class="chart-legend">'
            + '<span class="legend-item"><span class="legend-dot" style="background:var(--copper)"></span>Investimento</span>'
            + '<span class="legend-item"><span class="legend-dot" style="background:var(--teal)"></span>Receita atribuída</span>'
            + '<span class="panel-note">'+(data.periodo?escapeHtml(data.periodo.label):'')+'</span>'
          + '</div>'
        + '</div>'
        + chartAdsHTML(data.diario)
      + '</div>';
    }

    // ---- Ordenação da tabela por anúncio (aplicada às duas visões, pra manter a mesma ordem nas duas) ----
    function valOr(l, campo, seAusente){ const v = l[campo]; return v===null||v===undefined ? seAusente : v; }
    function comparadorDe(sort){
      if(sort==='lucro') return (a,b)=> valOr(b,'margemDepoisDoAds',-Infinity) - valOr(a,'margemDepoisDoAds',-Infinity);
      if(sort==='prejuizo') return (a,b)=> valOr(a,'margemDepoisDoAds',Infinity) - valOr(b,'margemDepoisDoAds',Infinity);
      if(sort==='gastoAds') return (a,b)=> valOr(b,'investimento',-Infinity) - valOr(a,'investimento',-Infinity);
      if(sort==='roas') return (a,b)=> valOr(b,'roas',-Infinity) - valOr(a,'roas',-Infinity);
      if(sort==='acos') return (a,b)=> valOr(b,'acos',-Infinity) - valOr(a,'acos',-Infinity); // maior ACOS = pior
      return (a,b)=> (b.faturamentoReal||0) - (a.faturamentoReal||0); // 'faturamento' (padrão)
    }
    const OPCOES_ORDENACAO = [
      { valor:'faturamento', label:'Maior faturamento' },
      { valor:'lucro', label:'Mais lucrativos' },
      { valor:'prejuizo', label:'Maior prejuízo' },
      { valor:'gastoAds', label:'Maior gasto em Ads' },
      { valor:'roas', label:'Melhor ROAS' },
      { valor:'acos', label:'Pior ACOS' },
    ];

    function anuncioCellHTML(l){
      return '<td class="produto-cell"><div class="cell-stack"><span class="prod-title" title="'+escapeHtml(l.anuncio||'—')+'">'+escapeHtml(l.anuncio||'(sem título)')+'</span>'
        + '<span class="cell-stack-sub mono">'+escapeHtml(l.sku||'sem SKU')+'</span></div></td>';
    }

    // ---- Visão 1: Performance atribuída Mercado Ads — só o que a API atribui diretamente ----
    function tabelaAtribuidaHTML(linhas){
      return '<div class="table-card"><div class="table-wrap"><table class="data-table"><thead><tr>'
        + '<th>Anúncio / SKU</th><th>Loja</th><th>Campanha</th><th>Investimento</th><th>Cliques</th><th>Impressões</th><th>CPC</th>'
        + '<th>Vendas atrib. (qtd)</th><th>Receita atribuída</th><th>ROAS</th><th>ACOS</th>'
        + '</tr></thead><tbody>'
        + linhas.map(l => '<tr>'
          + anuncioCellHTML(l)
          + '<td>'+escapeHtml(l.loja||'—')+'</td>'
          + '<td>'+(l.campanha ? escapeHtml(l.campanha) : '<span style="color:var(--text-faint);">—</span>')+'</td>'
          + '<td class="mono">'+moneyOrPend(l.investimento)+'</td>'
          + '<td class="mono">'+intFmt(l.cliques)+'</td>'
          + '<td class="mono">'+intFmt(l.impressoes)+'</td>'
          + '<td class="mono">'+moneyOrPend(l.cpc)+'</td>'
          + '<td class="mono">'+intFmt(l.qtdVendasAtribuidas)+'</td>'
          + '<td class="mono">'+moneyOrPend(l.faturamentoAtribuido)+'</td>'
          + '<td class="mono">'+roasFmt(l.roas)+'</td>'
          + '<td class="mono">'+pctFmt(l.acos)+'</td>'
        + '</tr>').join('')
        + '</tbody></table></div></div>';
    }

    // ---- Visão 2: Resultado real do SKU após Ads — todas as vendas reais do SKU (pode incluir orgânica) menos o investimento em Ads ----
    function statusBadge(l){
      if(l.status==='lucrativo') return '<span style="color:var(--success);font-weight:600;">Lucrativo</span>';
      if(l.status==='prejuizo') return '<span style="color:var(--danger);font-weight:600;">Prejuízo</span>';
      if(l.status==='sem_dado_ads') return '<span style="color:var(--text-faint);font-style:italic;">Sem dado de Ads</span>';
      return pendenteCusto();
    }
    function tabelaResultadoRealHTML(linhas){
      return '<div class="table-card"><div class="table-wrap"><table class="data-table"><thead><tr>'
        + '<th>Anúncio / SKU</th><th>Loja</th><th>Faturamento real (todas as vendas)</th><th>Gasto Ads</th><th>TACOS</th>'
        + '<th>Margem antes do Ads</th><th>Resultado após Ads</th><th>Margem após Ads (%)</th><th>Status</th>'
        + '</tr></thead><tbody>'
        + linhas.map(l => '<tr>'
          + anuncioCellHTML(l)
          + '<td>'+escapeHtml(l.loja||'—')+'</td>'
          + '<td class="mono">'+(l.semVendaReal ? '<span style="color:var(--text-faint);">sem venda no período</span>' : money(l.faturamentoReal))+'</td>'
          + '<td class="mono">'+moneyOrPend(l.custoAds)+'</td>'
          + '<td class="mono">'+pctFmt(l.tacos)+'</td>'
          + '<td class="mono">'+(l.semVendaReal ? '<span style="color:var(--text-faint);">—</span>' : (l.margemAntesDoAds===null ? pendenteCusto() : money(l.margemAntesDoAds)))+'</td>'
          + '<td class="mono" style="'+(l.margemDepoisDoAds!==null && l.margemDepoisDoAds!==undefined?(l.margemDepoisDoAds>=0?'color:var(--success);':'color:var(--danger);'):'')+'">'+(l.margemDepoisDoAds===null||l.margemDepoisDoAds===undefined ? (l.semMetricasAds ? pendenteSync() : pendenteCusto()) : money(l.margemDepoisDoAds))+'</td>'
          + '<td class="mono">'+pctFmt(l.margemDepoisDoAdsPct)+'</td>'
          + '<td>'+statusBadge(l)+'</td>'
        + '</tr>').join('')
        + '</tbody></table></div></div>';
    }

    function render(){
      const root = document.getElementById('adsRoot');
      if(!root) return;
      const filtro = window.CerneFiltro.state;

      if(!filtro.loadingEmpresas && !filtro.empresas.length){
        root.innerHTML = '<div class="empty-panel"><div class="empty-icon">'+svg('building')+'</div>'
          + '<h2>Nenhuma empresa ativa</h2>'
          + '<p class="lead">Cadastre e ative uma empresa em <strong>Cadastros → Empresas</strong> para ver Ads aqui.</p></div>';
        return;
      }

      let html = '<div class="field-hint" style="margin-bottom:12px;max-width:900px;">Investimento, cliques, impressões, CPC, vendas/receita atribuída, ROAS e ACOS vêm direto da API de Publicidade (Product Ads) do Mercado Livre — nunca um valor estimado pelo ERP. A API do Mercado Livre não informa quais pedidos pertencem à publicidade, só totais agregados — por isso as tabelas abaixo mostram duas visões SEPARADAS, nunca misturadas: <strong>Performance atribuída Mercado Ads</strong> (só o que a API atribui) e <strong>Resultado real do SKU após Ads</strong> (todas as vendas reais daquele SKU/anúncio, que podem incluir venda orgânica, menos o investimento em Ads).</div>';

      if(state.data){
        html += '<div class="toolbar">'
          + '<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">'
            + '<div class="empresa-picker" style="margin-bottom:0;"><select id="adsLojaSelect">'
              + '<option value="">Todas as lojas</option>'
              + state.data.lojas.map(l=>'<option value="'+l.id+'" '+(String(l.id)===String(state.contaId)?'selected':'')+'>'+escapeHtml(l.nickname||('Conta '+l.id))+'</option>').join('')
            + '</select></div>'
            + '<div class="empresa-picker" style="margin-bottom:0;"><select id="adsSortSelect">'
              + OPCOES_ORDENACAO.map(o=>'<option value="'+o.valor+'" '+(o.valor===state.sort?'selected':'')+'>Ordenar por: '+escapeHtml(o.label)+'</option>').join('')
            + '</select></div>'
            + '<button class="primary-btn enabled" id="btnSincronizarAds" type="button" '+(state.sincronizando?'disabled':'')+'>'+svg('refreshCw')+'<span>'+(state.sincronizando?'Sincronizando…':'Sincronizar agora')+'</span></button>'
          + '</div>'
          + (state.data.sincronizacaoAutomatica ? '<span class="panel-note" style="font-size:12px;">Sincronização automática em segundo plano'+(state.data.sincronizacaoAutomatica.ultimaExecucaoEm ? (' — última execução: '+escapeHtml(fmtDateTime(state.data.sincronizacaoAutomatica.ultimaExecucaoEm))) : ' ainda não rodou um ciclo completo')+'.</span>' : '')
        + '</div>';

        if(state.data.situacaoPorConta && state.data.situacaoPorConta.some(s=>!s.disponivel)){
          html += '<div class="table-card" style="padding:12px 16px;margin-bottom:14px;border-left:3px solid var(--warning);">'
            + state.data.situacaoPorConta.filter(s=>!s.disponivel).map(s=>
              '<div style="font-size:12.5px;color:var(--text-muted);display:flex;gap:8px;align-items:flex-start;margin:4px 0;">'
                + '<span style="color:var(--warning);flex-shrink:0;">'+svg('alertCircle')+'</span>'
                + '<span><strong>'+escapeHtml(s.loja||('Conta '+s.contaId))+'</strong>: '+escapeHtml(s.mensagem||'Dados de Ads indisponíveis para esta conta.')+'</span>'
              + '</div>'
            ).join('')
          + '</div>';
        }

        if(state.data.cards) html += cardsHTML(state.data.cards);
        html += chartAdsCardHTML(state.data);
      }

      if(state.loading || filtro.loadingEmpresas){
        html += '<div class="table-card"><div class="table-skel"><span class="spin"></span><span>Carregando Ads…</span></div></div>';
      } else if(state.error){
        html += '<div class="empty-panel"><div class="empty-icon" style="color:var(--danger); background:var(--danger-soft);">'+svg('alertCircle')+'</div>'
          + '<h2 style="color:var(--danger);">Não foi possível carregar</h2><p class="lead">'+escapeHtml(state.error)+'</p></div>';
      } else if(state.data && state.data.semConta){
        html += '<div class="empty-panel"><div class="empty-icon">'+svg('store')+'</div>'
          + '<h2>Nenhuma conta do Mercado Livre conectada</h2>'
          + '<p class="lead">Conecte uma conta do Mercado Livre em <strong>Marketplaces</strong> para ver Ads aqui.</p></div>';
      } else if(state.data && !state.data.linhas.length){
        html += '<div class="empty-panel"><div class="empty-icon">'+svg('megaphone')+'</div>'
          + '<h2>Nenhum anúncio com venda ou dado de Ads no período</h2>'
          + '<p class="lead">Não há vendas nem métricas de publicidade para "'+escapeHtml((state.data.periodo&&state.data.periodo.label)||'')+'". Escolha outro período ou verifique a sincronização de pedidos.</p></div>';
      } else if(state.data){
        const linhasOrdenadas = state.data.linhas.slice().sort(comparadorDe(state.sort));
        html += '<div class="panel-title" style="margin:18px 0 8px;"><span class="panel-title-ic">'+svg('megaphone')+'</span>Performance atribuída Mercado Ads</div>'
          + '<div class="field-hint" style="margin-bottom:8px;">Investimento, vendas e receita que o Mercado Livre atribui diretamente à publicidade — dado real da API, nunca estimado.</div>'
          + tabelaAtribuidaHTML(linhasOrdenadas)
          + '<div class="panel-title" style="margin:22px 0 8px;"><span class="panel-title-ic">'+svg('wallet')+'</span>Resultado real do SKU após Ads</div>'
          + '<div class="field-hint" style="margin-bottom:8px;">Margem de contribuição real de <strong>todas</strong> as vendas daquele SKU/anúncio no período (venda − taxas/comissões − frete do vendedor − imposto − custo do produto), menos o investimento em Ads. <strong>Pode incluir vendas orgânicas</strong> (não geradas pela publicidade) — isso NÃO é "lucro gerado pelo Ads", é o resultado financeiro real do SKU já descontando o investimento em Ads.</div>'
          + tabelaResultadoRealHTML(linhasOrdenadas)
          + '<div class="field-hint" style="margin-top:6px;">"Pendente de sincronização" = a API de Publicidade do Mercado Livre ainda não retornou esse dado (ou a conta não tem Product Ads habilitado) — nunca um valor estimado. "pendente" = falta cadastrar o custo de algum SKU deste anúncio em <strong>Produtos</strong>.</div>';
      }

      root.innerHTML = html;

      const selLoja = document.getElementById('adsLojaSelect');
      if(selLoja) selLoja.addEventListener('change', ()=>{ state.contaId = selLoja.value; loadAds(); });
      const selSort = document.getElementById('adsSortSelect');
      if(selSort) selSort.addEventListener('change', ()=>{ state.sort = selSort.value; render(); });
      const btnSync = document.getElementById('btnSincronizarAds');
      if(btnSync) btnSync.addEventListener('click', sincronizarAgora);
    }

    window.Ads = { load };
  })();

  /* ================= MODAL COMPARTILHADO — Detalhe do anúncio (Análise) =================
     Usado pelas 3 abas abaixo (Performance de Anúncios, Visitas e
     Conversão, Margem por Anúncio) — pedido explícito do usuário: "Quero
     conseguir clicar em um anúncio em qualquer uma dessas telas e abrir os
     detalhes daquele anúncio." Mostra os campos já carregados daquela linha
     (nenhuma chamada nova à API — os dados já vieram do backend na tela de
     origem) e oferece atalhos para ver o MESMO anúncio (mesmo SKU) nas
     outras 2 abas. */
  (function(){
    function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    // Mesmo padrão de miniatura das 3 telas (ver comentário em thumbHTML na
    // aba Performance de Anúncios) — versão "lg" pro modal, onde a imagem
    // tem mais destaque.
    function thumbHTML(url){
      if(!url) return '<span class="anuncio-thumb-lg-placeholder" title="Sem imagem disponível">'+svg('box')+'</span>';
      return '<span style="position:relative;display:inline-block;width:64px;height:64px;flex-shrink:0;">'
        + '<img class="anuncio-thumb-lg" src="'+escapeHtml(url)+'" alt="" loading="lazy" style="position:absolute;inset:0;" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\';">'
        + '<span class="anuncio-thumb-lg-placeholder" style="display:none;position:absolute;inset:0;">'+svg('box')+'</span>'
      + '</span>';
    }

    function abrir({ titulo, sku, loja, mlItemId, imagemUrl, campos, origem }){
      const modalRoot = document.getElementById('modalRoot');
      const outrasAbas = [
        { id:'performanceAnuncios', label:'Performance de Anúncios' },
        { id:'visitasConversao', label:'Visitas e Conversão' },
        { id:'margemAnuncio', label:'Margem por Anúncio' },
      ].filter(a => a.id !== origem);

      modalRoot.innerHTML = '<div class="modal-overlay" id="anuncioDetModalOverlay"><div class="modal-card" style="max-width:580px;">'
        + '<div class="modal-head" style="align-items:flex-start;">'

        + (outrasAbas.length && sku ? '<div class="modal-sub" style="margin-top:4px;">Ver este mesmo anúncio (por SKU) em:</div>'
          + '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;">'
            + outrasAbas.map(a=>'<button class="btn-secondary" data-ir-para="'+a.id+'" type="button">'+escapeHtml(a.label)+'</button>').join('')
          + '</div>' : '')
        + '<div class="modal-actions"><button type="button" class="btn-secondary" id="anuncioDetModalFechar">Fechar</button></div>'

      const overlay = document.getElementById('anuncioDetModalOverlay');
      const close = ()=> modalRoot.innerHTML = '';

    window.AnuncioDetalheModal = { abrir };
  })();

  /* ================= PERFORMANCE DE ANÚNCIOS =================
     Ativada em 26/08/2026, pedido explícito do usuário. Vendas vêm da mesma
     fonte única de sempre (lib/relatorioVendas.js); preço/status/estoque
     vêm AO VIVO do Mercado Livre (mesma fonte da tela Anúncios) — quando a
     conta está com erro de conexão, esses campos aparecem indisponíveis,
     NUNCA um valor antigo ou estimado. Os indicadores 🟢🟡🔴 seguem
     critérios objetivos e documentados (ver lib/performanceAnuncios.js e
     docs/01-regras-de-negocio.md) — nunca definidos "no olho". Empresa e
     período vêm do filtro do header (window.CerneFiltro); loja, SKU e
     status são filtros só desta tela. */
  (function(){
    const state = { loading:false, error:null, data:null, contaId:'', sku:'', status:'', sort:'maisVendidos' };

    function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function money(v){ return v===null||v===undefined ? '<span style="color:var(--text-faint);font-style:italic;">indisponível</span>' : 'R$ ' + Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2}); }
    function pctFmt(v){ return v===null||v===undefined ? '—' : (v>=0?'+':'')+Number(v).toLocaleString('pt-BR',{minimumFractionDigits:1, maximumFractionDigits:1})+'%'; }
    // Miniatura da capa/foto principal do anúncio (dado real, vindo AO VIVO
    // do Mercado Livre — ver lib/mlAnuncios.js). "Placeholder discreto"
    // (ícone neutro) quando o anúncio não tem imagem disponível — nunca uma
    // imagem inventada/de outro anúncio. onerror troca pro placeholder se a

    function thumbHTML(url, tam){
      const cls = tam==='lg' ? 'anuncio-thumb-lg' : 'anuncio-thumb';
      const clsPh = tam==='lg' ? 'anuncio-thumb-lg-placeholder' : 'anuncio-thumb-placeholder';
      const px = tam==='lg' ? 64 : 36;
      if(!url) return '<span class="'+clsPh+'" title="Sem imagem disponível">'+svg('box')+'</span>';
      return '<span style="position:relative;display:inline-block;width:'+px+'px;height:'+px+'px;flex-shrink:0;">'
        + '<img class="'+cls+'" src="'+escapeHtml(url)+'" alt="" loading="lazy" style="position:absolute;inset:0;" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\';">'
        + '<span class="'+clsPh+'" style="display:none;position:absolute;inset:0;">'+svg('box')+'</span>'
      + '</span>';
    }

    async function apiPerformance(empresaId, periodo, contaId, sku, status){
      const params = new URLSearchParams({ empresaId, periodo });
      if(contaId) params.set('contaId', contaId);
      if(sku) params.set('sku', sku);
      if(status) params.set('status', status);
      const res = await fetch('/api/performance-anuncios?'+params.toString());
      let body = null; try{ body = await res.json(); }catch(e){}
      if(!res.ok) throw new Error((body && body.error) || 'Não foi possível carregar Performance de Anúncios.');
      return body;
    }

    async function loadDados(){
      const filtro = window.CerneFiltro.state;
      if(!filtro.empresaId){ state.data = null; state.loading = false; render(); return; }
      state.loading = true; state.error = null; render();
      try{ state.data = await apiPerformance(filtro.empresaId, filtro.periodo, state.contaId, state.sku, state.status); }
      catch(err){ state.error = err.message; state.data = null; }
      state.loading = false; render();
    }

    function load(queryStr){
      if(queryStr){
        const params = new URLSearchParams(queryStr);
        if(params.get('sku')) state.sku = params.get('sku');

      loadDados();
    }

    window.CerneFiltro.onChange(()=>{
      const page = document.getElementById('page-performanceAnuncios');

    const OPCOES_ORDENACAO = [
      { valor:'maisVendidos', label:'Mais vendidos' },
      { valor:'menosVendidos', label:'Menos vendidos' },
      { valor:'maiorFaturamento', label:'Maior faturamento' },
      { valor:'menorFaturamento', label:'Menor faturamento' },
      { valor:'maiorCrescimento', label:'Maior crescimento' },
      { valor:'maiorQueda', label:'Maior queda' },
      { valor:'semVendas', label:'Anúncios sem vendas' },
    ];
    function valOr(l, campo, seAusente){ const v = l[campo]; return v===null||v===undefined ? seAusente : v; }
    function ordenarLinhas(linhas, sort){
      if(sort === 'semVendas'){
        return linhas.filter(l=>l.semVendaNoPeriodo).slice().sort((a,b)=> valOr(b,'diasSemVender', 999999) - valOr(a,'diasSemVender', 999999));
      }
      const copia = linhas.slice();
      if(sort==='menosVendidos') return copia.sort((a,b)=> a.unidadesVendidas - b.unidadesVendidas);
      if(sort==='menorFaturamento') return copia.sort((a,b)=> (a.faturamento||0) - (b.faturamento||0));
      if(sort==='maiorCrescimento') return copia.sort((a,b)=> valOr(b,'crescimentoPercentual',-Infinity) - valOr(a,'crescimentoPercentual',-Infinity));
      if(sort==='maiorQueda') return copia.sort((a,b)=> valOr(a,'crescimentoPercentual',Infinity) - valOr(b,'crescimentoPercentual',Infinity));
      if(sort==='maiorFaturamento') return copia.sort((a,b)=> (b.faturamento||0) - (a.faturamento||0));
      return copia.sort((a,b)=> b.unidadesVendidas - a.unidadesVendidas); // 'maisVendidos' (padrão)
    }

    function statusLabel(status){
      const map = { active:'Ativo', paused:'Pausado', closed:'Encerrado' };
      return map[status] || (status ? escapeHtml(status) : 'Indisponível');
    }

    function indicadorHTML(l){
      if(l.indicador==='baixo') return '<span style="color:var(--danger);font-weight:600;white-space:nowrap;">🔴 Baixo desempenho</span>';
      if(l.indicador==='atencao') return '<span style="color:var(--warning);font-weight:600;white-space:nowrap;">🟡 Atenção</span>';
      if(l.indicador==='bom') return '<span style="color:var(--success);font-weight:600;white-space:nowrap;">🟢 Bom desempenho</span>';
      if(l.indicador==='sem_classificacao') return '<span style="color:var(--text-faint);">Sem classificação ainda</span>';
      return '<span style="color:var(--text-faint);">'+statusLabel(l.status)+'</span>';
    }

    function tagsHTML(l){
      const tags = [];
      if(l.tags.semVendaVariosDias) tags.push('Sem vender há '+l.diasSemVender+'d');
      else if(l.semVendaHistorico) tags.push('Nunca vendeu');
      if(l.tags.vendendoCadaVezMenos) tags.push('Vendendo menos');
      if(l.tags.crescendo) tags.push('Crescendo');
      if(l.tags.praticamenteParado) tags.push('Praticamente parado');
      if(l.novoNoPeriodo) tags.push('Novo no período');
      if(!tags.length) return '';
      return tags.map(t=>'<span style="display:inline-block;font-size:11px;padding:2px 7px;border-radius:20px;background:var(--surface-2);color:var(--text-muted);margin:0 4px 4px 0;">'+escapeHtml(t)+'</span>').join('');
    }

    function anuncioCellHTML(l){
      return '<td class="produto-cell"><a href="javascript:void(0)" class="anuncio-link" data-ml-item="'+escapeHtml(l.mlItemId||'')+'" style="text-decoration:none;color:inherit;"><div class="anuncio-cell-flex">'
        + thumbHTML(l.imagemUrl)
        + '<div class="cell-stack">'
          + '<span class="prod-title" title="'+escapeHtml(l.anuncio||'—')+'" style="text-decoration:underline dotted;">'+escapeHtml(l.anuncio||'(sem título)')+'</span>'
          + '<span class="cell-stack-sub mono">'+escapeHtml(l.sku||'sem SKU')+'</span>'
        + '</div></div></a></td>';
    }

    function criteriosResumoHTML(c){
      if(!c) return '';
      return '<div class="field-hint" style="margin-bottom:12px;max-width:960px;">Critérios objetivos: 🔴 Baixo desempenho = '+c.diasSemVenderRuim+'+ dias sem vender, ou parou de vender (vendia no período anterior e não vendeu agora), ou queda de '+Math.abs(c.quedaFortePct)+'% ou mais nas unidades vendidas. 🟡 Atenção = '+c.diasSemVenderAtencao+' a '+(c.diasSemVenderRuim-1)+' dias sem vender, ou queda de '+Math.abs(c.quedaModeradaPct)+'% ou mais, ou vendendo muito pouco (média ≤ '+c.mediaDiaParado+' unidade/dia). 🟢 Bom desempenho = vendeu no período sem nenhum desses sinais. Só se aplica a anúncios com status ativo.</div>';
    }

    function tabelaHTML(linhas){
      return '<div class="table-card"><div class="table-wrap"><table class="data-table"><thead><tr>'
        + '<th>Anúncio / SKU</th><th>Produto</th><th>Loja</th><th>Status</th><th>Indicador</th><th>Preço atual</th>'
        + '<th>Unid. vendidas</th><th>Pedidos</th><th>Faturamento</th><th>Média/dia</th><th>vs. período anterior</th><th>Sinalizações</th>'
        + '</tr></thead><tbody>'
        + linhas.map(l => '<tr>'
          + anuncioCellHTML(l)
          + '<td>'+(l.produto?escapeHtml(l.produto):'<span style="color:var(--text-faint);">—</span>')+'</td>'
          + '<td>'+escapeHtml(l.loja||'—')+'</td>'
          + '<td>'+statusLabel(l.status)+'</td>'
          + '<td>'+indicadorHTML(l)+'</td>'
          + '<td class="mono">'+money(l.precoAtual)+'</td>'
          + '<td class="mono tab-nums">'+l.unidadesVendidas+'</td>'
          + '<td class="mono tab-nums">'+l.quantidadePedidos+'</td>'
          + '<td class="mono">'+money(l.faturamento)+'</td>'
          + '<td class="mono">'+Number(l.mediaVendasPorDia).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+'</td>'
          + '<td class="mono" style="'+(l.crescimentoPercentual!==null?(l.crescimentoPercentual>=0?'color:var(--success);':'color:var(--danger);'):'')+'">'+(l.novoNoPeriodo?'<span style="color:var(--teal);">Novo</span>':pctFmt(l.crescimentoPercentual))+'</td>'
          + '<td>'+tagsHTML(l)+'</td>'

    }

    function abrirDetalhe(l){
      window.AnuncioDetalheModal.abrir({

        campos: [
          { label:'Produto cadastrado', value: l.produto },
          { label:'Status', html: statusLabel(l.status) },
          { label:'Indicador', html: indicadorHTML(l) },
          { label:'Preço atual', html: money(l.precoAtual) },
          { label:'Unidades vendidas', value: l.unidadesVendidas },
          { label:'Pedidos', value: l.quantidadePedidos },
          { label:'Faturamento', html: money(l.faturamento) },
          { label:'Média de vendas/dia', value: l.mediaVendasPorDia },
          { label:'Unid. período anterior', value: l.unidadesPeriodoAnterior },
          { label:'Crescimento', html: l.novoNoPeriodo ? 'Novo no período' : pctFmt(l.crescimentoPercentual) },
          { label:'Dias sem vender', value: l.diasSemVender===null ? (l.semVendaHistorico ? 'nunca vendeu' : '—') : l.diasSemVender },
