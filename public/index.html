      el.innerHTML = svg(type==='error' ? 'alertCircle':'checkCircle') + '<span>'+escapeHtml(message)+'</span>';
      wrap.appendChild(el);
      setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .25s'; setTimeout(()=>el.remove(),250); }, 4200);
    }

    const TIPO_ORIGEM_LABEL = { pergunta:'Pergunta', mensagem:'Mensagem pós-venda', reclamacao:'Reclamação', devolucao:'Devolução' };
    const CLASSIFICACAO_INFO = {
      duvida_simples:   { emoji:'🟢', label:'Dúvida simples' },
      info_pedido:       { emoji:'🔵', label:'Informação do pedido' },
      problema_entrega:  { emoji:'🟡', label:'Problema de entrega' },
      reclamacao:        { emoji:'🟠', label:'Reclamação' },
      insatisfeito:      { emoji:'🔴', label:'Cliente insatisfeito' },
      devolucao:         { emoji:'🟣', label:'Devolução' },
    };
    const STATUS_LABEL = { novo:'Novo', aguardando_resposta:'Aguardando resposta', respondido:'Respondido', resolvido:'Resolvido' };
    const STATUS_DECISAO_LABEL = { aprovada:'Aprovada', editada:'Editada e aprovada', recusada:'Recusada' };
    const STATUS_DECISAO_COR = { aprovada:'var(--success)', editada:'var(--copper)', recusada:'var(--danger)' };

    function criarModuloAgenteSac(cfg){
      const state = {
        agente:null, itens:[], stats:null, loading:false, error:null,
        tabTipo:'todos', filtroStatus:'abertos', busca:'', gerando:false,
        editando:{}, // { [atendimentoId]: textoEditado }
        ultimoResultado:null, // resultado detalhado da última "Sincronizar agora" (ver ultimoResultadoHTML)
        statusAuto:null, // estado do scheduler automático em background (ver lib/ia/sacScheduler.js e statusAutoHTML)
      };

      async function apiAgente(){
        const res = await fetch('/api/ia-agentes');
        const body = await res.json().catch(()=>null);
        if(!res.ok) return null;
        return ((body && body.agentes) || []).find((a)=> a.codigo === cfg.codigoAgente) || null;
      }
      async function apiAtendimentos(empresaId){
        const params = new URLSearchParams({ empresaId, marketplace: cfg.marketplace });
        if(state.tabTipo === 'urgentes') params.set('urgente', 'true');
        else if(state.tabTipo !== 'todos') params.set('tipoOrigem', state.tabTipo);
        if(state.filtroStatus === 'abertos'){ /* filtra no cliente abaixo — mistura novo+aguardando_resposta */ }
        else if(state.filtroStatus !== 'todos') params.set('status', state.filtroStatus);
        if(state.busca.trim()) params.set('busca', state.busca.trim());
        const res = await fetch('/api/sac/atendimentos?' + params.toString());
        const body = await res.json().catch(()=>null);
        if(!res.ok) throw new Error((body && body.error) || 'Não foi possível carregar os atendimentos.');
        let itens = (body && body.atendimentos) || [];
        if(state.filtroStatus === 'abertos') itens = itens.filter((a)=> a.status === 'novo' || a.status === 'aguardando_resposta');
        return itens;
      }
      async function apiStats(empresaId){
        const res = await fetch('/api/sac/stats?' + new URLSearchParams({ empresaId, marketplace: cfg.marketplace }).toString());
        const body = await res.json().catch(()=>null);
        if(!res.ok) return null;
        return body;
      }
      async function apiDecidir(respostaId, statusDecisao, respostaFinal, empresaId){
        const res = await fetch('/api/sac/respostas/' + respostaId + '/decisao', {
          method:'PUT', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ empresaId, statusDecisao, respostaFinal, decididoPor:'Pablo' }),
        });
        const body = await res.json().catch(()=>null);
        if(!res.ok) throw new Error((body && body.error) || 'Não foi possível registrar a decisão.');
        return body;
      }
      async function apiResolver(atendimentoId, empresaId){
        const res = await fetch('/api/sac/atendimentos/' + atendimentoId + '/resolver', {
          method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ empresaId }),
        });
        const body = await res.json().catch(()=>null);
        if(!res.ok) throw new Error((body && body.error) || 'Não foi possível marcar como resolvido.');
        return body;
      }
      async function apiGerarAgora(empresaId){
        const res = await fetch('/api/sac/gerar-agora', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ empresaId, marketplace: cfg.marketplace }),
        });
        const body = await res.json().catch(()=>null);
        if(!res.ok) throw new Error((body && body.error) || 'Falha ao sincronizar agora.');
        return body;
      }
      // 15/09/2026 — pedido explícito do usuário "nao quero ter que ficar
      // sincronizando nada quero tudo automatico": só LÊ o estado já
      // calculado pelo servidor (GET /api/sac/status-automatico), o
      // navegador nunca dispara nada sozinho — mesmo padrão do indicador
      // "Sincronizado há Xs" do header (ver GET .../mercadolivre/status-automatico).
      async function apiStatusAuto(){
        try{
          const res = await fetch('/api/sac/status-automatico');
          if(!res.ok) return null;
          return await res.json();
        }catch(e){ return null; }
      }

      async function carregar(){
        const filtro = window.CerneFiltro.state;
        if(!filtro.empresaId){ state.itens = []; state.stats = null; state.loading = false; render(); return; }
        state.loading = true; state.error = null; render();
        try{
          const [itens, stats] = await Promise.all([apiAtendimentos(filtro.empresaId), apiStats(filtro.empresaId)]);
          state.itens = itens; state.stats = stats;
        }catch(e){ state.error = e.message; state.itens = []; }
        state.loading = false; render();
      }

      async function gerarAgora(){
        const filtro = window.CerneFiltro.state;
        if(!filtro.empresaId) return;
        state.gerando = true; render();
        try{
          const r = await apiGerarAgora(filtro.empresaId);
          state.ultimoResultado = r;
          const temErro = (r.erros && r.erros.length) || Object.values(r.detalhesPorFonte||{}).some((d)=> d && (d.erro || (d.erros&&d.erros.length)));
          toast('Sincronizado: ' + (r.atendimentosNovos||0) + ' atendimento(s) novo(s), ' + (r.sugestoesGeradas||0) + ' sugestão(ões) gerada(s).' + (temErro?' Veja os detalhes abaixo — houve erro em alguma fonte.':''), temErro?'error':'success');
          await carregar();
        }catch(e){ state.ultimoResultado = null; toast(e.message || 'Falha ao sincronizar agora.', 'error'); }
        finally{ state.gerando = false; render(); }
      }

      // Mostra o que aconteceu em CADA fonte na última sincronização (ver
      // lib/ia/sacCiclo.js#detalhesPorFonte, 15/09/2026 — pedido implícito
      // do usuário ao reportar "tem pós-venda pendente no Mercado Livre,
      // mas no sistema não consta nada"): fica visível até a próxima
      // sincronização, nunca só um toast que some em segundos — pra dar pra
      // conferir com calma quantos pedidos/itens foram verificados e se
      // alguma fonte devolveu erro.
      function ultimoResultadoHTML(){
        const r = state.ultimoResultado;
        if(!r) return '';
        const fontes = cfg.marketplace === 'shopee'
          ? [['conversas','Conversas (chat)'],['devolucoes','Devoluções']]
          : [['perguntas','Perguntas'],['mensagens','Mensagens pós-venda'],['reclamacoes','Reclamações']];
        const linhas = fontes.map(([chave,label])=>{
          const d = r.detalhesPorFonte ? r.detalhesPorFonte[chave] : null;
          if(!d) return '<div><b>'+escapeHtml(label)+':</b> sem dados nesta sincronização.</div>';
          let linha = '<div><b>'+escapeHtml(label)+':</b> ';
          if(d.pedidosVerificados !== undefined) linha += d.pedidosVerificados+' pedido(s) verificado(s), ';
          linha += (d.processadas||0)+' encontrada(s), '+(d.novos||0)+' nova(s)';
          linha += '</div>';
          if(d.erro) linha += '<div style="color:var(--danger);">⚠ '+escapeHtml(d.erro)+'</div>';
          if(d.erros && d.erros.length) linha += d.erros.map((e)=> '<div style="color:var(--danger);">⚠ '+escapeHtml(e)+'</div>').join('');
          return linha;
        }).join('');
        return '<div class="table-card" style="padding:14px 16px;margin-bottom:12px;font-size:12.5px;color:var(--text-muted);">'
          + '<div style="font-weight:700;color:var(--text);margin-bottom:6px;">Última sincronização'+(r.contasProcessadas!==undefined?(' — '+r.contasProcessadas+' conta(s)'):'')+'</div>'
          + linhas
          + (r.erros && r.erros.length ? r.erros.map((e)=> '<div style="color:var(--danger);margin-top:4px;">⚠ Conta '+escapeHtml(String(e.contaId))+': '+escapeHtml(e.erro)+'</div>').join('') : '')
        + '</div>';
      }

      async function decidir(atendimento, statusDecisao){
        const filtro = window.CerneFiltro.state;
        const respostaId = atendimento.respostaPendente && atendimento.respostaPendente.id;
        if(!respostaId) return;
        let respostaFinal = null;
        if(statusDecisao !== 'recusada'){
          const editado = state.editando[atendimento.id];
          respostaFinal = editado !== undefined ? editado : (atendimento.respostaPendente.respostaSugeridaIa || '');
          if(!respostaFinal.trim()){ toast('Escreva o texto da resposta antes de aprovar.', 'error'); return; }
          if(editado !== undefined && editado !== atendimento.respostaPendente.respostaSugeridaIa) statusDecisao = 'editada';
        }
        try{
          await apiDecidir(respostaId, statusDecisao, respostaFinal, filtro.empresaId);
          toast(statusDecisao === 'recusada' ? 'Sugestão recusada.' : 'Decisão registrada — nada foi enviado automaticamente.');
          delete state.editando[atendimento.id];
          await carregar();
        }catch(e){ toast(e.message || 'Falha ao registrar decisão.', 'error'); }
      }

      async function resolver(atendimento){
        const filtro = window.CerneFiltro.state;
        try{ await apiResolver(atendimento.id, filtro.empresaId); toast('Atendimento marcado como resolvido.'); await carregar(); }
        catch(e){ toast(e.message || 'Falha ao marcar como resolvido.', 'error'); }
      }

      async function load(){
        if(!state.agente) state.agente = await apiAgente();
        state.statusAuto = await apiStatusAuto();
        await carregar();
      }

      // Texto curto avisando que a verificação roda sozinha em background
      // (ver lib/ia/sacScheduler.js) — "Sincronizar agora" continua
      // disponível como atalho manual, mas deixou de ser a única forma de
      // atualizar a tela.
      function statusAutoHTML(){
        const s = state.statusAuto;
        if(!s) return '';
        const dados = cfg.marketplace === 'shopee' ? s.shopee : s.mercadoLivre;
        const min = Math.max(1, Math.round((s.intervaloSegundos||0) / 60));
        let texto = 'Verificação automática ativa — a cada ' + min + ' min, direto no servidor.';
        if(s.ultimaExecucaoEm) texto += ' Última verificação: ' + fmtDataHora(s.ultimaExecucaoEm) + '.';
        const temErro = dados && dados.comErro && dados.comErro.length;
        return '<div class="field-hint" style="margin-top:8px;display:flex;align-items:center;gap:6px;'+(temErro?'color:var(--danger);':'')+'">'
          + svg(temErro?'alertCircle':'checkCircle') + '<span>' + escapeHtml(texto) + (temErro?' Houve erro na última verificação automática — veja "Sincronizar agora" para tentar na hora.':'') + '</span>'
        + '</div>';
      }

      window.CerneFiltro.onChange(()=>{
        const page = document.getElementById('page-'+cfg.pageId);
        if(page && page.classList.contains('active')) carregar();
        else render();
      });

      function kpiStripHTML(){
        const s = state.stats;
        const box = (valor, label, classe)=> '<div class="sac-kpi-box"><b class="'+(classe||'')+'">'+(s ? valor : '—')+'</b><span>'+escapeHtml(label)+'</span></div>';
        return '<div class="sac-kpi-strip">'
          + box(s?s.atendimentosNovos:null, 'Novos')
          + box(s?s.aguardandoResposta:null, 'Aguardando resposta', 'warn')
          + box(s?s.respondidosHoje:null, 'Respondidos hoje')
          + box(s?s.reclamacoesAbertas:null, 'Reclamações abertas', s&&s.reclamacoesAbertas>0?'danger':'')
          + box(s?s.devolucoesAbertas:null, 'Devoluções abertas', s&&s.devolucoesAbertas>0?'danger':'')
          + box(s&&s.tempoMedioRespostaMin!==null? s.tempoMedioRespostaMin+' min':'—', 'Tempo médio de resposta (hoje)')
          + box(s?s.atendimentosCriticos:null, 'Críticos', s&&s.atendimentosCriticos>0?'danger':'')
        + '</div>';
      }

      function abasHTML(){
        const abas = [['todos','Todos'],['pergunta','Perguntas'],['mensagem','Pós-venda'],['reclamacao','Reclamações'],['devolucao','Devoluções'],['urgentes','Urgentes']];
        return '<div class="seg" id="'+cfg.rootElId+'Tabs" style="margin-bottom:10px;">'
          + abas.map(([v,l])=> '<button type="button" data-tab="'+v+'" class="'+(state.tabTipo===v?'active':'')+'">'+escapeHtml(l)+'</button>').join('')
        + '</div>';
      }

      function toolbarHTML(){
        return '<div class="agent-toolbar">'
          + '<div class="search-box">'+svg('search')+'<input type="text" id="'+cfg.rootElId+'Busca" placeholder="Buscar por cliente, produto, SKU ou mensagem…" value="'+escapeHtml(state.busca)+'"></div>'
          + '<select class="toolbar-select" id="'+cfg.rootElId+'Status">'
            + ['abertos','todos','novo','aguardando_resposta','respondido','resolvido'].map((v)=>
                '<option value="'+v+'" '+(state.filtroStatus===v?'selected':'')+'>'+(v==='abertos'?'Abertos (novo + aguardando)':v==='todos'?'Todos os status':STATUS_LABEL[v])+'</option>').join('')
          + '</select>'
          + '<button class="ghost-btn" id="'+cfg.rootElId+'GerarAgora" type="button" title="A verificação já roda sozinha em background — use aqui só se quiser checar agora, sem esperar." style="cursor:pointer;opacity:1;" '+(state.gerando?'disabled':'')+'>'+svg('refreshCw')+'<span>'+(state.gerando?'Sincronizando…':'Verificar agora')+'</span></button>'
        + '</div>';
      }

      function respostaBoxHTML(a){
        if(a.ultimaDecisao && !a.respostaPendente){
          const cor = STATUS_DECISAO_COR[a.ultimaDecisao.statusDecisao] || 'var(--text-faint)';
          return '<div class="sac-resposta-box"><div class="sac-decisao-final">'
            + '<span class="status" style="color:'+cor+';">'+escapeHtml(STATUS_DECISAO_LABEL[a.ultimaDecisao.statusDecisao] || a.ultimaDecisao.statusDecisao)+'</span>'
            + (a.ultimaDecisao.respostaFinal ? '<div style="margin-top:6px;white-space:pre-wrap;">'+escapeHtml(a.ultimaDecisao.respostaFinal)+'</div>' : '')
            + '<div class="cell-stack-sub" style="margin-top:6px;">'+fmtDataHora(a.ultimaDecisao.decididoEm)+(a.ultimaDecisao.decididoPor?(' · '+escapeHtml(a.ultimaDecisao.decididoPor)):'')+'</div>'
            + '</div><div class="sac-resposta-disclaimer">'+svg('alertCircle')+' Só registrado — nenhuma resposta foi enviada ao '+(cfg.marketplace==='shopee'?'Shopee':'Mercado Livre')+' automaticamente (Modo supervisionado, Fase 1).</div>'
          + '</div>';
        }
        if(!a.respostaPendente){
          return '<div class="sac-resposta-box"><div class="sac-sem-sugestao">Sugestão ainda não gerada — a verificação automática cuida disso sozinha em instantes, ou clique em "Verificar agora" para não esperar.</div></div>';
        }
        if(!a.respostaPendente.respostaSugeridaIa){
          return '<div class="sac-resposta-box"><div class="sac-resposta-label">A IA não gerou uma resposta</div>'
            + '<div class="sac-sem-sugestao">'+escapeHtml(a.respostaPendente.motivoSemSugestao || 'Situação exige análise humana.')+'</div></div>';
        }
        const textoAtual = state.editando[a.id] !== undefined ? state.editando[a.id] : a.respostaPendente.respostaSugeridaIa;
        return '<div class="sac-resposta-box">'
          + '<div class="sac-resposta-label">Sugestão da IA (você pode editar antes de aprovar)</div>'
          + '<textarea data-atendimento="'+a.id+'">'+escapeHtml(textoAtual)+'</textarea>'
          + '<div class="sac-resposta-acoes">'
            + '<button class="primary-btn enabled" data-acao="aprovar" data-id="'+a.id+'" type="button">'+svg('checkCircle')+'<span>Aprovar</span></button>'
            + '<button class="ghost-btn" data-acao="recusar" data-id="'+a.id+'" type="button" style="cursor:pointer;opacity:1;">'+svg('x')+'<span>Recusar</span></button>'
          + '</div>'
          + '<div class="sac-resposta-disclaimer">'+svg('alertCircle')+' Aprovar só REGISTRA a decisão — nenhuma resposta é enviada ao '+(cfg.marketplace==='shopee'?'Shopee':'Mercado Livre')+' automaticamente nesta fase (Modo supervisionado).</div>'
        + '</div>';
      }

      function itemHTML(a){
        const cls = CLASSIFICACAO_INFO[a.classificacao];
        return '<div class="sac-item'+(a.urgente?' urgente':'')+'">'
          + '<div class="sac-item-top">'
            + '<div class="sac-item-meta">'
              + '<span class="sac-badge">'+escapeHtml(TIPO_ORIGEM_LABEL[a.tipoOrigem]||a.tipoOrigem)+'</span>'
              + (cls ? '<span class="sac-badge">'+cls.emoji+' '+escapeHtml(cls.label)+'</span>' : '')
              + (a.urgente ? '<span class="sac-badge urgente">🔴 Urgente</span>' : '')
              + '<span class="sac-badge">'+escapeHtml(STATUS_LABEL[a.status]||a.status)+'</span>'
            + '</div>'
            + '<div class="sac-item-time">'+fmtDataHora(a.dataRecebido)+'</div>'
          + '</div>'
          + '<div class="sac-item-contexto">'
            + (a.clienteNome ? '<b>Cliente:</b> '+escapeHtml(a.clienteNome)+'  ' : '')
            + (a.produtoTitulo ? '<b>Produto:</b> '+escapeHtml(a.produtoTitulo)+'  ' : '')
            + (a.sku ? '<b>SKU:</b> '+escapeHtml(a.sku)+'  ' : '')
            + (a.pedidoRef ? '<b>Pedido:</b> '+escapeHtml(a.pedidoRef) : '')
          + '</div>'
          + '<div class="sac-msg">'+escapeHtml(a.mensagemCliente)+'</div>'
          + respostaBoxHTML(a)
          + ((a.status==='respondido') ? '<div style="margin-top:8px;"><button class="ghost-btn" data-acao="resolver" data-id="'+a.id+'" type="button" style="cursor:pointer;opacity:1;">'+svg('checkCircle')+'<span>Marcar como resolvido</span></button></div>' : '')
        + '</div>';
      }

      function render(){
        const root = document.getElementById(cfg.rootElId);
        if(!root) return;
        const filtro = window.CerneFiltro.state;

        if(!filtro.loadingEmpresas && !filtro.empresas.length){
          root.innerHTML = '<div class="empty-panel"><div class="empty-icon">'+svg('building')+'</div>'
            + '<h2>Nenhuma empresa ativa</h2><p class="lead">Cadastre e ative uma empresa em <strong>Cadastros → Empresas</strong> para usar este agente.</p></div>';
          return;
        }

        const a = state.agente;
        let html = '<div class="table-card" style="padding:20px;margin-bottom:14px;display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;">'
          + '<div class="kpi-hero-icon" style="flex-shrink:0;">'+svg((a && a.icone) || cfg.iconeFallback)+'</div>'
          + '<div style="min-width:0;flex:1;">'
            + '<div class="panel-title" style="margin:0 0 4px;">'+escapeHtml((a && a.nome) || cfg.nomeFallback)+'</div>'
            + '<div class="field-hint" style="max-width:760px;">'+escapeHtml((a && a.descricao) || cfg.descricaoFallback)+'</div>'
            + '<div class="field-hint" style="margin-top:8px;color:var(--text-faint);">Modo supervisionado (Fase 1): a IA lê e analisa os atendimentos reais, e sugere uma resposta — ela nunca oferece reembolso, aprova devolução, cancela pedido, dá desconto, envia cupom ou promete prazo não confirmado. Você sempre aprova, edita ou recusa antes de qualquer coisa, e nada é enviado ao marketplace automaticamente nesta fase.</div>'
            + statusAutoHTML()
          + '</div>'
        + '</div>';

        html += kpiStripHTML() + abasHTML() + toolbarHTML() + ultimoResultadoHTML();

        if(state.loading){
          html += '<div class="table-card"><div class="table-skel"><span class="spin"></span><span>Carregando…</span></div></div>';
        } else if(state.error){
          html += '<div class="empty-panel"><div class="empty-icon" style="color:var(--danger); background:var(--danger-soft);">'+svg('alertCircle')+'</div>'
            + '<h2 style="color:var(--danger);">Não foi possível carregar</h2><p class="lead">'+escapeHtml(state.error)+'</p></div>';
        } else if(!state.itens.length){
          html += '<div class="empty-panel"><div class="empty-icon">'+svg('inbox')+'</div>'
            + '<h2>Nenhum atendimento aqui</h2><p class="lead">Quando houver perguntas, mensagens, reclamações ou devoluções reais do '+(cfg.marketplace==='shopee'?'Shopee':'Mercado Livre')+', elas aparecem aqui sozinhas — a verificação automática roda em background. Clique em "Verificar agora" se quiser checar sem esperar.</p></div>';
        } else {
          html += state.itens.map(itemHTML).join('');
        }

        root.innerHTML = html;

        const tabsEl = document.getElementById(cfg.rootElId+'Tabs');
        if(tabsEl) tabsEl.querySelectorAll('button').forEach((b)=> b.addEventListener('click', ()=>{ state.tabTipo = b.dataset.tab; carregar(); }));

        const statusEl = document.getElementById(cfg.rootElId+'Status');
        if(statusEl) statusEl.addEventListener('change', ()=>{ state.filtroStatus = statusEl.value; carregar(); });

        const buscaEl = document.getElementById(cfg.rootElId+'Busca');
        if(buscaEl){
          let timer = null;
          buscaEl.addEventListener('input', ()=>{ state.busca = buscaEl.value; clearTimeout(timer); timer = setTimeout(carregar, 400); });
        }

        const btnGerar = document.getElementById(cfg.rootElId+'GerarAgora');
        if(btnGerar) btnGerar.addEventListener('click', gerarAgora);

        root.querySelectorAll('textarea[data-atendimento]').forEach((ta)=> ta.addEventListener('input', ()=>{ state.editando[Number(ta.dataset.atendimento)] = ta.value; }));

        root.querySelectorAll('[data-acao]').forEach((btn)=> btn.addEventListener('click', ()=>{
          const id = Number(btn.dataset.id);
          const acao = btn.dataset.acao;
          const a = state.itens.find((x)=> x.id === id);
          if(!a) return;
          if(acao === 'aprovar') decidir(a, 'aprovada');
          else if(acao === 'recusar') decidir(a, 'recusada');
          else if(acao === 'resolver') resolver(a);
        }));
      }

      return { load };
    }

    window.SacMercadoLivre = criarModuloAgenteSac({
      codigoAgente: 'sac_mercado_livre', marketplace: 'mercado_livre', pageId: 'sacMercadoLivre', rootElId: 'sacMercadoLivreRoot',
      iconeFallback: 'inbox', nomeFallback: 'SAC Mercado Livre',

        : '<button type="button" class="toggle '+(card.status==='online'?'on':'')+'" disabled style="cursor:not-allowed;opacity:.7;" title="Interruptor por empresa: chega na próxima etapa (ETAPA 4) — ainda não desliga a automação de verdade."></button>';

      const acaoBtn = card.emConstrucao
        ? '<button class="ghost-btn" type="button" disabled title="Este agente ainda não existe de verdade — sem tela de detalhes ainda.">'+svg('eye')+'<span>Ver detalhes</span></button>'
        : '<button class="ghost-btn" type="button" style="cursor:pointer;opacity:1;" data-page="'+card.pagina+'">'+svg(card.acaoLabel==='Conversar'?'messageCircle':'eye')+'<span>'+card.acaoLabel+'</span></button>';

      return '<div class="agent-card'+(card.emConstrucao?' em-construcao':'')+'" style="'+tintVars(card.tint)+'">'
        + '<div class="agent-card-top">'
          + '<div class="agent-card-id"><div class="kpi-hero-icon">'+svg(card.icone)+'</div>'
            + '<div><div class="agent-card-name">'+escapeHtml(card.nome)+'</div><div class="agent-card-area">'+escapeHtml(card.area)+'</div></div>'
          + '</div>'
          + badgeStatusHTML(card)
        + '</div>'
        + '<div class="agent-card-desc">'+escapeHtml(card.desc||'')+'</div>'
        + '<div class="agent-card-stats">'+stats+'</div>'
        + '<div class="agent-card-foot">'+toggleHtml+acaoBtn+'</div>'
        + (card.emConstrucao ? '' : '<div class="agent-card-ultima">Última atualização: '+fmtDataHora(card.ultimaAtualizacao)+'</div>')
      + '</div>';
    }

    function kpiRowHTML(){
      const k = state.resumo ? state.resumo.kpis : null;
      const semDado = state.loading || state.error || !k;
      const items = [
        { label:'Agentes ativos', icon:'sparkle', tint:'purple', value:k?k.agentesAtivos:null, note:'Cadastro ativo — interruptor por empresa chega na próxima etapa' },
        { label:'Tarefas executadas hoje', icon:'activity', tint:'petrol', value:k?k.tarefasHoje:null, note:'Sugestões novas + alertas novos gerados hoje pelos agentes' },
        { label:'Alertas importantes', icon:'alertCircle', tint:'warning', value:k?k.alertasImportantes:null, note:'Críticos + atenção, abertos agora (Radar)' },
      ];
      return '<div class="kpi-hero-grid" style="margin-bottom:14px;">' + items.map((it)=>{
        const valueHtml = semDado ? '<span class="dash">'+(state.error?'—':'…')+'</span>' : String(it.value);
        return '<div class="kpi-hero" style="'+tintVars(it.tint)+'">'
          + '<div class="kpi-hero-top"><div class="kpi-hero-icon">'+svg(it.icon)+'</div></div>'
          + '<div class="kpi-hero-label">'+it.label+'</div>'
          + '<div class="kpi-hero-value">'+valueHtml+'</div>'
          + '<div class="kpi-hero-foot"><span class="kpi-hero-note">'+it.note+'</span></div>'
        + '</div>';
      }).join('') + '</div>';
    }

    function heroIaGestoraHTML(){
      const p = PAGES['iaGestora'];
      const g = state.resumo ? state.resumo.iaGestora : null;
      return '<div class="ia-hub-hero">'
        + '<div class="ia-hub-hero-ic">'+svg(p.icon)+'</div>'
        + '<div class="ia-hub-hero-body">'
          + '<div class="ia-hub-hero-title">IA Gestora</div>'
          + '<div class="ia-hub-hero-sub">'+escapeHtml(p.desc)+'</div>'
          + '<div class="ia-hub-hero-stats">'
            + '<div class="ia-hub-hero-stat"><b>'+(g?g.conversasHoje:'—')+'</b><span>Conversas hoje</span></div>'
            + '<div class="ia-hub-hero-stat"><b>'+(g?g.mensagensHoje:'—')+'</b><span>Mensagens hoje</span></div>'
          + '</div>'
        + '</div>'
        + '<button type="button" class="primary-btn" data-page="iaGestora" style="flex-shrink:0;cursor:pointer;opacity:1;">'+svg('messageCircle')+'<span>Conversar com a IA Gestora</span></button>'
      + '</div>';
    }

    function toolbarHTML(areas){
      const areaOptions = ['todas'].concat(areas).map((a)=> '<option value="'+escapeHtml(a)+'" '+(state.filtroArea===a?'selected':'')+'>'+(a==='todas'?'Todas as áreas':escapeHtml(a))+'</option>').join('');
      return '<div class="agent-toolbar">'
        + '<div class="search-box">'+svg('search')+'<input type="text" id="agHubSearch" placeholder="Buscar agente por nome…" value="'+escapeHtml(state.search)+'"></div>'
        + '<select class="toolbar-select" id="agHubStatus">'
          + '<option value="todos" '+(state.filtroStatus==='todos'?'selected':'')+'>Status: todos</option>'
          + '<option value="online" '+(state.filtroStatus==='online'?'selected':'')+'>Online</option>'
          + '<option value="pausado" '+(state.filtroStatus==='pausado'?'selected':'')+'>Pausado</option>'
          + '<option value="em_construcao" '+(state.filtroStatus==='em_construcao'?'selected':'')+'>Em construção</option>'
        + '</select>'
        + '<select class="toolbar-select" id="agHubArea">'+areaOptions+'</select>'
        + '<label class="check-chip'+(state.somentePendencias?' active':'')+'"><input type="checkbox" id="agHubPendencias" '+(state.somentePendencias?'checked':'')+'>Com pendências</label>'
        + '<label class="check-chip'+(state.somenteAlertas?' active':'')+'"><input type="checkbox" id="agHubAlertas" '+(state.somenteAlertas?'checked':'')+'>Com alertas</label>'
      + '</div>';
    }

    function abasHTML(){
      return '<div class="seg" id="agHubTabs" style="margin-bottom:14px;">'
        + '<button type="button" data-aba="agentes" class="'+(state.aba==='agentes'?'active':'')+'">Agentes</button>'
        + '<button type="button" data-aba="historico" class="'+(state.aba==='historico'?'active':'')+'">Histórico</button>'
      + '</div>';
    }

    const HIST_ICONE = { sugestao:'sparkle', aprovada:'checkCircle', alterada:'edit', editada:'edit', recusada:'x', expirada:'clock', alerta:'alertCircle', atendimento_novo:'inbox' };
    const HIST_VERBO = { aprovada:'aprovou a resposta', alterada:'alterou a sugestão', editada:'editou e aprovou a resposta', recusada:'recusou a sugestão', expirada:'deixou a sugestão expirar' };
    const HIST_NOME_AGENTE = { ads_performance:'Ads e Performance', promocoes:'Promoções', radar:'Radar (Central de Alertas)', sac_mercado_livre:'SAC Mercado Livre', sac_shopee:'SAC Shopee' };

    function historicoEventoHTML(ev){
      const agente = HIST_NOME_AGENTE[ev.agenteCodigo] || ev.agenteCodigo;
      let corpo;
      if(ev.tipo === 'sugestao'){
        corpo = '<b>'+escapeHtml(agente)+'</b> sugeriu uma ação em <b>'+escapeHtml(ev.referencia)+'</b>';
      } else if(ev.tipo === 'atendimento_novo'){
        corpo = '<b>'+escapeHtml(agente)+'</b> recebeu um novo atendimento: <b>'+escapeHtml(ev.referencia)+'</b>';
      } else if(ev.tipo === 'alerta'){
        corpo = '<b>Radar</b> detectou: <b>'+escapeHtml(ev.referencia)+'</b>';
      } else {
        const verbo = HIST_VERBO[ev.tipo] || ev.tipo;
        corpo = '<b>'+escapeHtml(ev.usuario || 'Alguém')+'</b> '+verbo+' de <b>'+escapeHtml(agente)+'</b> em '+escapeHtml(ev.referencia);
      }
      return '<div class="hist-row">'
        + '<div class="hist-time">'+fmtHora(ev.ts)+'</div>'
        + '<div class="hist-ic">'+svg(HIST_ICONE[ev.tipo]||'activity')+'</div>'
        + '<div><div class="hist-body">'+corpo+'</div><div class="hist-sub">'+escapeHtml(ev.motivo||'')+'</div></div>'
      + '</div>';
    }

    function render(){
      const root = document.getElementById('agentesIaHubRoot');
      if(!root) return;
      const filtro = window.CerneFiltro.state;

      if(!filtro.loadingEmpresas && !filtro.empresas.length){
        root.innerHTML = '<div class="empty-panel"><div class="empty-icon">'+svg('building')+'</div>'
          + '<h2>Nenhuma empresa ativa</h2><p class="lead">Cadastre e ative uma empresa em <strong>Cadastros → Empresas</strong> para ver os agentes de IA.</p></div>';
        return;
      }

      let html = kpiRowHTML() + heroIaGestoraHTML() + abasHTML();

      if(state.aba === 'agentes'){
        if(state.loading){
          html += '<div class="table-card"><div class="table-skel"><span class="spin"></span><span>Carregando agentes…</span></div></div>';
        } else if(state.error){
          html += '<div class="empty-panel"><div class="empty-icon" style="color:var(--danger); background:var(--danger-soft);">'+svg('alertCircle')+'</div>'
            + '<h2 style="color:var(--danger);">Não foi possível carregar</h2><p class="lead">'+escapeHtml(state.error)+'</p></div>';
        } else {
          const todos = construirCards();
          const areas = Array.from(new Set(todos.map((c)=> c.area))).sort();
          html += toolbarHTML(areas);
          const filtrados = filtrarCards(todos);
          if(!filtrados.length){
            html += '<div class="empty-panel"><div class="empty-icon">'+svg('search')+'</div>'
              + '<h2>Nenhum agente encontrado</h2><p class="lead">Ajuste a busca ou os filtros acima.</p></div>';
          } else {
            html += '<div class="agent-grid">' + filtrados.map(agentCardHTML).join('') + '</div>';
          }
        }
      } else {
        html += toolbarHTML(state.resumo ? Array.from(new Set(construirCards().map((c)=> c.area))).sort() : []);
        if(state.loadingHistorico){
          html += '<div class="table-card"><div class="table-skel"><span class="spin"></span><span>Carregando histórico…</span></div></div>';
        } else if(state.errorHistorico){
          html += '<div class="empty-panel"><div class="empty-icon" style="color:var(--danger); background:var(--danger-soft);">'+svg('alertCircle')+'</div>'
            + '<h2 style="color:var(--danger);">Não foi possível carregar</h2><p class="lead">'+escapeHtml(state.errorHistorico)+'</p></div>';
        } else if(!state.historico.length){
          html += '<div class="empty-panel"><div class="empty-icon">'+svg('clock')+'</div>'
            + '<h2>Nenhum evento ainda</h2><p class="lead">Assim que um agente sugerir algo, você decidir, ou o Radar detectar um alerta, o evento aparece aqui.</p></div>';
        } else {
          html += '<div class="table-card"><div class="hist-list">' + state.historico.map(historicoEventoHTML).join('') + '</div></div>';
        }
      }

      root.innerHTML = html;

      const search = document.getElementById('agHubSearch');
      if(search) search.addEventListener('input', ()=>{ state.search = search.value; render(); const el=document.getElementById('agHubSearch'); if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); } });
      const selStatus = document.getElementById('agHubStatus');
      if(selStatus) selStatus.addEventListener('change', ()=>{ state.filtroStatus = selStatus.value; render(); });
      const selArea = document.getElementById('agHubArea');
      if(selArea) selArea.addEventListener('change', ()=>{ state.filtroArea = selArea.value; render(); });
      const chkPend = document.getElementById('agHubPendencias');
      if(chkPend) chkPend.addEventListener('change', ()=>{ state.somentePendencias = chkPend.checked; render(); });
      const chkAlert = document.getElementById('agHubAlertas');
      if(chkAlert) chkAlert.addEventListener('change', ()=>{ state.somenteAlertas = chkAlert.checked; render(); });
      const tabsEl = document.getElementById('agHubTabs');
      if(tabsEl) tabsEl.querySelectorAll('button').forEach((b)=> b.addEventListener('click', ()=>{
        state.aba = b.dataset.aba;
        if(state.aba === 'historico' && !state.historicoCarregado){ carregarHistorico(); }
        else render();
      }));
      root.querySelectorAll('[data-page]').forEach((el)=> el.addEventListener('click', ()=> navigate(el.dataset.page)));
    }

    window.AgentesIaHub = { load };
  })();

  /* ================= RELATÓRIOS — categorias com dados 100% reaproveitados =================
     Ativado em 25/08/2026. Regra central do usuário: os números aqui usam as
     MESMAS regras já usadas em Visão Geral/Pedidos/Financeiro (nenhum
     cálculo novo) — ver lib/relatoriosAgregados.js no backend. Empresa e
     período vêm do filtro do header; loja e SKU são filtros desta tela.
     Exportação (XLSX/CSV) sempre respeita os filtros atuais. */
  (function(){
    const CATEGORIAS = [
      ['vendas-margem','Vendas e Margem'],
      ['produtos','Produtos'],
      ['marketplaces','Marketplaces / Lojas'],
    ];
    const state = { loading:false, error:null, categoria:'vendas-margem', contaId:'', sku:'', lojas:[], data:null, visaoProdutos:'sku' };

    function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function money(v){ return v===null||v===undefined ? null : 'R$ ' + Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2}); }
    function pctFmt(v){ return v===null||v===undefined ? null : Number(v).toLocaleString('pt-BR',{minimumFractionDigits:1, maximumFractionDigits:1})+'%'; }
    function pend(){ return '<span style="color:var(--text-faint);font-style:italic;">pendente</span>'; }
    function pendSync(){ return '<span style="color:var(--text-faint);font-style:italic;">Pendente de sincronização</span>'; }
    function moneyOrPend(v){ return v===null||v===undefined ? pend() : money(v); }

    async function apiLojas(empresaId){
      try{
        const res = await fetch('/api/integracoes/mercadolivre?empresaId='+empresaId);
        const body = await res.json();
        return (body && body.contas) || [];
      }catch(e){ return []; }
    }

    async function apiCategoria(categoria, empresaId, periodo, contaId, sku, visaoProdutos, desde, ate){
      const params = new URLSearchParams({ empresaId, periodo });
      if(contaId) params.set('contaId', contaId);
      if(categoria === 'produtos' && visaoProdutos !== 'caixa' && sku.trim()) params.set('sku', sku.trim());
      if(periodo === 'personalizado'){ if(desde) params.set('desde', desde); if(ate) params.set('ate', ate); }
      const path = categoria === 'vendas-margem' ? '/api/relatorios/vendas-margem'
        : categoria === 'produtos' ? (visaoProdutos === 'caixa' ? '/api/relatorios/produtos-por-caixa' : '/api/relatorios/produtos')
        : '/api/relatorios/marketplaces';
      const res = await fetch(path+'?'+params.toString());
      let body = null; try{ body = await res.json(); }catch(e){}
      if(!res.ok) throw new Error((body && body.error) || 'Não foi possível carregar o relatório.');
      return body;
    }

    async function loadRelatorio(){
      const filtro = window.CerneFiltro.state;
      if(!filtro.empresaId){ state.data = null; state.loading = false; render(); return; }
      state.loading = true; state.error = null; render();
      try{
        const [dados, lojas] = await Promise.all([
          apiCategoria(state.categoria, filtro.empresaId, filtro.periodo, state.contaId, state.sku, state.visaoProdutos, filtro.desdePersonalizado, filtro.atePersonalizado),
          apiLojas(filtro.empresaId),
        ]);
        state.data = dados;
        state.lojas = lojas;
      }catch(err){ state.error = err.message; state.data = null; }
      state.loading = false; render();
    }

    function load(){ loadRelatorio(); }

    window.CerneFiltro.onChange(()=>{
      const page = document.getElementById('page-reports');
      if(page && page.classList.contains('active')) loadRelatorio();
      else render();
    });

    function baixarExportacao(formato){
      const filtro = window.CerneFiltro.state;
      if(!filtro.empresaId) return;
      const params = new URLSearchParams({ categoria: state.categoria, empresaId: filtro.empresaId, periodo: filtro.periodo, formato });
      if(state.contaId) params.set('contaId', state.contaId);
      if(state.categoria === 'produtos' && state.sku.trim()) params.set('sku', state.sku.trim());
      if(filtro.periodo === 'personalizado'){ if(filtro.desdePersonalizado) params.set('desde', filtro.desdePersonalizado); if(filtro.atePersonalizado) params.set('ate', filtro.atePersonalizado); }
      window.location.href = '/api/relatorios/exportar?'+params.toString();
    }

    function renderVendasMargem(d){
      const semPedidos = d.resumo.qtdPedidos === 0;
      const linhas = [
        ['Faturamento', semPedidos ? 0 : d.resumo.faturamento.valor, 'money'],
        ['Pedidos', d.resumo.qtdPedidos, 'int'],
        ['Unidades vendidas', d.totalUnidades, 'int'],
        ['Taxas/comissões', semPedidos ? 0 : d.resumo.tarifas.valor, 'money'],
        ['Frete vendedor', semPedidos ? 0 : d.resumo.freteVendedor.valor, 'money'],
        ['Imposto', semPedidos ? 0 : d.resumo.imposto.valor, 'money'],
        ['Custo dos produtos', d.resumo.custoProduto.valor, 'money'],
        ['Ads', d.ads.disponivel ? d.ads.valor : null, 'money-sync'],
        ['Margem de contribuição (R$)', d.resumo.margemContribuicao.valor, 'money'],
        ['Margem de contribuição (%)', semPedidos ? 0 : d.resumo.margemPercentual, 'percent'],
      ];
      let html = '<div class="panel" style="max-width:640px;">'
        + '<div class="panel-head"><div class="panel-title"><span class="panel-title-ic">'+svg('lineChart')+'</span>Vendas e Margem</div><span class="panel-note">'+escapeHtml((d.periodo&&d.periodo.label)||'')+'</span></div>'
        + linhas.map(([label, valor, tipo])=>{
            const valorHtml = tipo === 'money' ? moneyOrPend(valor)
              : tipo === 'money-sync' ? (valor===null ? pendSync() : money(valor))
              : tipo === 'percent' ? (valor===null ? pend() : pctFmt(valor))
              : valor;
            return '<div class="bd-row"><span class="bd-label">'+label+'</span><span class="bd-value">'+valorHtml+'</span></div>';
          }).join('')
        + (d.ads.disponivel && d.ads.parcial ? '<div class="bd-side-note">Ads: dado parcial — alguma loja está com a sincronização de Ads indisponível no momento.</div>' : '')
        + '<div class="bd-side-note">Mesmos números e regras de Visão Geral, Pedidos e Financeiro para o mesmo período/loja — nenhum cálculo separado.</div>'
      + '</div>';
      return html;
    }

    function renderProdutos(d){
      if(!d.linhas.length){
        return '<div class="empty-panel"><div class="empty-icon">'+svg('box')+'</div>'
          + '<h2>Nenhum produto vendido no período</h2>'
          + '<p class="lead">Não há itens de pedido para os filtros selecionados.</p></div>';
      }
      return '<div class="table-card"><div class="table-wrap"><table class="data-table"><thead><tr>'
        + '<th>SKU</th><th>Quantidade vendida</th><th>Faturamento</th><th>Custo</th><th>Imposto</th><th>Margem gerada</th>'
        + '</tr></thead><tbody>'
        + d.linhas.map(l => '<tr>'
          + '<td class="mono">'+escapeHtml(l.sku)+(l.rateado?' <span title="Frete/desconto/tarifas deste SKU foram rateados proporcionalmente porque ele às vezes divide pedido com outros itens." style="color:var(--text-faint);font-size:11px;">(rateado)</span>':'')+'</td>'
          + '<td class="tab-nums">'+l.quantidade+'</td>'
          + '<td class="mono">'+moneyOrPend(l.faturamento)+'</td>'
          + '<td class="mono">'+moneyOrPend(l.custo)+'</td>'
          + '<td class="mono">'+moneyOrPend(l.imposto)+'</td>'
          + '<td class="mono">'+moneyOrPend(l.margemContribuicao)+'</td>'
        + '</tr>').join('')
        + '</tbody></table></div></div>'
        + '<div class="field-hint" style="margin-top:6px;">"pendente" = falta cadastrar o custo do SKU em <strong>Produtos</strong> e/ou o Mercado Livre não retornou alguma tarifa — nunca um valor estimado.</div>';
    }

    // Visão "Por Caixa": agrupa pelo produto base físico (medida da caixa),
    // juntando todos os SKUs/kit que representam a mesma caixa — ver
    // GET /api/relatorios/produtos-por-caixa e lib/relatoriosAgregados.js.
    function renderProdutosPorCaixa(d){
      if(!d.linhas.length && !d.semProdutoBase.length){
        return '<div class="empty-panel"><div class="empty-icon">'+svg('box')+'</div>'
          + '<h2>Nenhum produto vendido no período</h2>'
          + '<p class="lead">Não há itens de pedido para os filtros selecionados.</p></div>';
      }
      let html = '';
      if(d.linhas.length){
        html += '<div class="table-card"><div class="table-wrap"><table class="data-table"><thead><tr>'
          + '<th>Produto base (medida)</th><th>Caixas físicas vendidas</th><th>Kits vendidos</th><th>Pedidos</th><th>Faturamento</th>'
          + '</tr></thead><tbody>'
          + d.linhas.map(l => '<tr>'
            + '<td class="mono">'+escapeHtml(l.produtoBase)
              + (l.origemHeuristica ? ' <span title="Produto base identificado automaticamente pelo padrão do SKU (dígitos no início = quantidade por kit) — sem vínculo cadastrado manualmente." style="color:var(--text-faint);font-size:11px;">(padrão do SKU)</span>' : '')
              + '<div class="di-sub">'+l.skus.map(s=>escapeHtml(s.sku)+' ('+s.multiplicador+'x)').join(', ')+'</div>'
            + '</td>'
            + '<td class="tab-nums">'+l.quantidadeCaixas.toLocaleString('pt-BR')+'</td>'
            + '<td class="tab-nums">'+l.kitsVendidos.toLocaleString('pt-BR')+'</td>'
            + '<td class="tab-nums">'+l.quantidadePedidos+'</td>'
            + '<td class="mono">'+moneyOrPend(l.faturamento)+'</td>'
          + '</tr>').join('')
          + '</tbody></table></div></div>';
      }
      html += '<div class="field-hint" style="margin-top:6px;">Caixas físicas vendidas = kits vendidos × unidades por kit de cada SKU, somado por produto base. Faturamento é a soma total gerada pelos SKUs daquela medida — nunca dividido pela quantidade de caixas.</div>';
      if(d.semProdutoBase.length){
        html += '<div class="panel" style="margin-top:14px;">'
          + '<div class="panel-head"><div class="panel-title"><span class="panel-title-ic">'+svg('alertCircle')+'</span>SKUs sem produto base identificado</div><span class="panel-note">'+d.semProdutoBase.length+'</span></div>'
          + '<div class="table-wrap"><table class="data-table"><thead><tr><th>SKU</th><th>Kits vendidos</th><th>Pedidos</th><th>Faturamento</th></tr></thead><tbody>'
          + d.semProdutoBase.map(l => '<tr>'
            + '<td class="mono">'+escapeHtml(l.sku)+'</td>'
            + '<td class="tab-nums">'+l.kitsVendidos.toLocaleString('pt-BR')+'</td>'
            + '<td class="tab-nums">'+l.quantidadePedidos+'</td>'
            + '<td class="mono">'+moneyOrPend(l.faturamento)+'</td>'
          + '</tr>').join('')
          + '</tbody></table></div>'
          + '<div class="bd-side-note">Esses SKUs não seguem o padrão "dígitos no início = quantidade por kit" e não têm vínculo cadastrado em Produto Base — nunca agrupados por chute. Não entram no total de caixas físicas acima.</div>'
        + '</div>';
      }
      return html;
    }

    window.Relatorios = { load };

  /* ================= SALA DOS AGENTES — cena 3D (19/09/2026) =================
     Pedido explícito do usuário: "tem como nos fazer agentes de ia para rodar
     24h por dia e fazer uma sala 3d onde vai mostar todos agentes
     trabalhando?". A resposta pra "rodar 24h" já existia antes desta tela —
     server.js#start já liga 8 schedulers reais que rodam sozinhos no
     servidor (nunca dependem de ninguém com o navegador aberto). Esta tela
     só dá uma cara visual (3D) pro status desses 8 processos reais, lido de
     GET /api/agentes-3d/status (routes/agentes3d.js) — NENHUM agente/dado
     novo é inventado aqui, e nenhuma lógica de negócio existente é tocada.

     Decisões importantes:
     - Three.js só é carregado (via CDN) na 1ª vez que esta tela abre — nunca
       no carregamento normal do ERP — pra não pesar nas outras telas.
     - "Descarregar" ao sair da tela (ver navigate()) só PAUSA o loop de
       animação e o polling — a cena em si fica guardada na memória. Isso já
       elimina praticamente todo o custo de CPU/GPU/rede em segundo plano, e
       evita destruir/reconstruir o contexto WebGL toda vez que o usuário
       volta pra esta tela (navegadores têm um limite baixo de contextos
       WebGL simultâneos que um destroy/rebuild repetido poderia estourar).
     - Layout fixo (LAYOUT_ORDEM) agrupado por categoria (sincronização,
       financeiro, IA) — mesma ordem sempre, pra o usuário aprender onde
       cada agente fica. */
  (function(){
    const THREE_CDN = 'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js';
    const ORBIT_CDN = 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js';

    // Reescrito em 19/09/2026 (pedido explícito do usuário: "sobre as IA não
    // são aquelas... vou te passar quais são") — só os 5 setores pedidos,
    // cada um com sua própria cor (ver routes/agentes3d.js#categoria) pra
    // ficar fácil de diferenciar visualmente as 5 zonas da sala.
    const LAYOUT_ORDEM = ['promocoes-ia','ads','anuncios-ia','concorrente-ia','sac-ia'];
    const CATEGORIA_TOKEN = { promocoes:'--purple', ads:'--copper', anuncios:'--petrol', concorrente:'--warning', sac:'--teal' };
    const CATEGORIA_LABEL = { promocoes:'Promoções', ads:'Ads', anuncios:'Anúncios', concorrente:'Análise de Concorrente', sac:'SAC' };
    // Mapa estático id->categoria, espelhando routes/agentes3d.js (cada
    // agente já nasce com sua categoria fixa lá). Precisa existir mesmo
    // ANTES do primeiro /status responder, porque construirCena() roda a
    // cor/letreiro de cada zona assim que a cena é montada — usa o dado ao
    // vivo (state.agentesPorId) quando já existir, e cai neste mapa fixo
    // como base honesta (nunca "adivinha" uma categoria nova).
    const CATEGORIA_POR_ID = { 'promocoes-ia':'promocoes', 'ads':'ads', 'anuncios-ia':'anuncios', 'concorrente-ia':'concorrente', 'sac-ia':'sac' };
    function categoriaDoAgente(id){
      return (state.agentesPorId[id] && state.agentesPorId[id].categoria) || CATEGORIA_POR_ID[id] || null;
    }

    const state = {
      shellPronta:false, cenaPronta:false, carregandoScripts:null,
      ativo:false, destruidoEnquantoCarregava:false,
      pollTimer:null, rafId:null,
      agentesPorId:{}, selecionadoId:null,
      three:null, // { renderer, scene, camera, controls, personagens:Map, clock }
    };

    function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function corToken(nomeVar, alt){ const v = getComputedStyle(document.documentElement).getPropertyValue(nomeVar).trim(); return v || alt || '#888888'; }
    function fmtRelativo(iso){
      if(!iso) return 'ainda não rodou';
      const ms = Date.now() - new Date(iso).getTime();
      if(ms < 0) return 'agora há pouco';
      const min = Math.floor(ms/60000);
      if(min < 1) return 'há poucos segundos';
      if(min < 60) return 'há ' + min + ' min';
      const h = Math.floor(min/60);
      if(h < 24) return 'há ' + h + 'h';
      return 'há ' + Math.floor(h/24) + 'd';
    }
    function fmtIntervalo(ms){ if(!ms) return '—'; const min = Math.round(ms/60000); return min < 1 ? Math.round(ms/1000)+'s' : (min+' min'); }

    function carregarScript(src){
      return new Promise((resolve, reject) => {
        const el = document.createElement('script');
        el.src = src; el.async = true;
        el.onload = () => resolve();
        el.onerror = () => reject(new Error('Falha ao carregar ' + src));
        document.head.appendChild(el);
      });
    }
    function garantirThree(){
      if(window.THREE && window.THREE.OrbitControls) return Promise.resolve();
      if(state.carregandoScripts) return state.carregandoScripts;
      state.carregandoScripts = carregarScript(THREE_CDN).then(() => carregarScript(ORBIT_CDN));
      return state.carregandoScripts;
    }

    async function apiStatus(){
      const res = await fetch('/api/agentes-3d/status');
      const body = await res.json().catch(()=>null);
      if(!res.ok) throw new Error((body&&body.error) || 'Não foi possível carregar o status dos agentes.');

    }

    // ---- Shell HTML (montada 1 única vez) ----

        + '</div>'

    function renderListaAgentes(){
      const wrap = document.getElementById('saListaAgentes');
      if(!wrap) return;
      wrap.innerHTML = LAYOUT_ORDEM.map(id => {

    function selecionarAgente(id){

    // ---- Cena 3D ----
    // Reescrito em 19/09/2026 (pedido explícito do usuário: "quero que faça
    // uma sala 3D igual ou melhor... 5 zonas bem demarcadas com letreiro por
    // setor, personagens mais trabalhados, iluminação melhor" — dentro do
    // que dá pra fazer só com Three.js, sem depender de nenhum projeto
    // externo de terceiros). 5 setores lado a lado (LAYOUT_ORDEM), cada um
    // com: tapete + parede de fundo na cor do setor, luz spot colorida,
    // divisória entre as zonas, e um personagem mais completo (braços,
    // cadeira, luminária, planta) — tudo geometria simples do Three.js, sem
    // nenhum asset externo pra baixar.
    function construirCena(){
      const THREE = window.THREE;
      const card = document.getElementById('saCanvasCard');
      if(!card) return;
      const largura = card.clientWidth, altura = 560;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(corToken('--page','#0A0C11'));
      scene.fog = new THREE.Fog(scene.background.getHex(), 24, 46);

      const camera = new THREE.PerspectiveCamera(40, largura/altura, 0.1, 120);
      camera.position.set(0, 11, 17);

      const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
      renderer.setSize(largura, altura);
      card.insertBefore(renderer.domElement, card.firstChild);

      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 0.8, 0);
      controls.enableDamping = true; controls.dampingFactor = 0.08;
      controls.minDistance = 7; controls.maxDistance = 30;
      controls.maxPolarAngle = Math.PI * 0.49;
      controls.update();

      scene.add(new THREE.HemisphereLight(0xffffff, 0x30323d, 0.85));
      const sol = new THREE.DirectionalLight(0xffffff, 0.55);
      sol.position.set(6, 16, 8);
      scene.add(sol);

      const chao = new THREE.Mesh(
        new THREE.PlaneGeometry(30, 18),
        new THREE.MeshStandardMaterial({ color: corToken('--surface-2','#191d26'), roughness:0.95 })
      );
      chao.rotation.x = -Math.PI/2;
      scene.add(chao);

      const grade = new THREE.GridHelper(30, 30, corToken('--border','#262b37'), corToken('--border','#262b37'));
      grade.position.y = 0.01;
      scene.add(grade);

      const paredeMat = new THREE.MeshStandardMaterial({ color: corToken('--surface','#13161d'), roughness:1 });
      const paredeFundo = new THREE.Mesh(new THREE.PlaneGeometry(30, 8), paredeMat);
      paredeFundo.position.set(0, 4, -8);
      scene.add(paredeFundo);

      // 5 zonas lado a lado, uma por setor — mesma ordem de LAYOUT_ORDEM.
      const personagens = new Map();
      const N = LAYOUT_ORDEM.length;
      const espaco = 4.7;
      const largZona = espaco - 0.5;

      // Divisórias entre as zonas (N-1 pilares) — reforça a leitura de "5
      // salas separadas" mesmo com o chão contínuo.
      for(let i=1;i<N;i++){
        const xDiv = (i - (N-1)/2) * espaco;
        const pilar = new THREE.Mesh(
          new THREE.BoxGeometry(0.14, 3, 2.6),
          new THREE.MeshStandardMaterial({ color: corToken('--border','#262b37'), roughness:0.9 })
        );
        pilar.position.set(xDiv, 1.5, 0.2);
        scene.add(pilar);
      }

      LAYOUT_ORDEM.forEach((id, i) => {
        const x = (i - (N-1)/2) * espaco;
        const corHex = corToken(CATEGORIA_TOKEN[categoriaDoAgente(id)], '#888888');
        const cor = new THREE.Color(corHex);

        const grupo = new THREE.Group();
        grupo.position.set(x, 0, 0.2);

        // Tapete da zona, na cor do setor — a "demarcação" pedida.
        const tapete = new THREE.Mesh(
          new THREE.PlaneGeometry(largZona, 3.6),
          new THREE.MeshStandardMaterial({ color: cor, roughness:1, transparent:true, opacity:0.16 })
        );
        tapete.rotation.x = -Math.PI/2;
        tapete.position.set(0, 0.015, 0.3);
        grupo.add(tapete);

        // Painel na parede de fundo, na cor do setor.
        const painel = new THREE.Mesh(
          new THREE.PlaneGeometry(largZona - 0.4, 2.2),
          new THREE.MeshStandardMaterial({ color: cor, roughness:1, transparent:true, opacity:0.22 })
        );
        painel.position.set(0, 2.1, -7.85);
        grupo.add(painel);

        // Luz spot colorida apontando pra mesa — "iluminação melhor" pedida.
        const spot = new THREE.SpotLight(cor, 1.1, 12, Math.PI/5, 0.5, 1.4);
        spot.position.set(0, 5.5, 2.5);
        spot.target.position.set(0, 0.8, 0.3);
        grupo.add(spot);
        grupo.add(spot.target);

        // Mesa
        const mesa = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.12, 0.9), new THREE.MeshStandardMaterial({ color:'#8a6a45', roughness:0.8 }));
        mesa.position.y = 0.75;
        grupo.add(mesa);
        [[-0.75,-0.35],[0.75,-0.35],[-0.75,0.35],[0.75,0.35]].forEach(([lx,lz]) => {
          const perna = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.75, 0.08), new THREE.MeshStandardMaterial({ color:'#5c4630' }));
          perna.position.set(lx, 0.375, lz);
          grupo.add(perna);
        });

        // Monitor (acende com a cor do setor quando está trabalhando)
        const monitor = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.36, 0.05), new THREE.MeshStandardMaterial({ color:'#111318', emissive:new THREE.Color(0x000000) }));
        monitor.position.set(0, 1.12, -0.3);
        grupo.add(monitor);

        // Luminária de mesa — acende junto com o monitor.
        const luminariaBase = new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.09,0.06,10), new THREE.MeshStandardMaterial({ color:'#333' }));
        luminariaBase.position.set(0.65, 0.84, -0.1);
        grupo.add(luminariaBase);
        const luminariaCupula = new THREE.Mesh(new THREE.ConeGeometry(0.12,0.16,12,1,true), new THREE.MeshStandardMaterial({ color:'#333', emissive:new THREE.Color(0x000000), side:THREE.DoubleSide }));
        luminariaCupula.position.set(0.65, 1.1, -0.1);
        luminariaCupula.rotation.x = Math.PI;
        grupo.add(luminariaCupula);

        // Cadeira
        const cadeiraMat = new THREE.MeshStandardMaterial({ color:'#2c313d', roughness:0.8 });
        const assento = new THREE.Mesh(new THREE.BoxGeometry(0.55,0.08,0.55), cadeiraMat);
        assento.position.set(0, 0.55, 0.95);
        grupo.add(assento);
        const encosto = new THREE.Mesh(new THREE.BoxGeometry(0.55,0.55,0.08), cadeiraMat);
        encosto.position.set(0, 0.85, 1.2);
        grupo.add(encosto);

        // Planta — um pouco de vida na zona.
        const vaso = new THREE.Mesh(new THREE.CylinderGeometry(0.14,0.11,0.22,10), new THREE.MeshStandardMaterial({ color:'#6b4a35' }));
        vaso.position.set(-largZona/2 + 0.5, 0.11, -1.1);
        grupo.add(vaso);
        const folhas = new THREE.Mesh(new THREE.SphereGeometry(0.28,10,10), new THREE.MeshStandardMaterial({ color: corToken('--success','#3FB37E'), roughness:1 }));
        folhas.position.set(-largZona/2 + 0.5, 0.5, -1.1);
        grupo.add(folhas);

        // Personagem: corpo + cabeça + 2 braços, cor do setor.
        const corpoMat = new THREE.MeshStandardMaterial({ color: cor });
        const corpo = new THREE.Mesh(new THREE.CylinderGeometry(0.26, 0.32, 0.85, 12), corpoMat);
        corpo.position.set(0, 1.18, 0.55);
        grupo.add(corpo);
        const cabecaMat = new THREE.MeshStandardMaterial({ color:0xe7c9a3 });
        const cabeca = new THREE.Mesh(new THREE.SphereGeometry(0.24, 16, 16), cabecaMat);
        cabeca.position.set(0, 1.78, 0.55);
        grupo.add(cabeca);
        [[-0.32,0],[0.32,0]].forEach(([bx]) => {
          const braco = new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.07,0.55,8), corpoMat);
          braco.position.set(bx, 1.1, 0.65);
          braco.rotation.x = -0.5;
          grupo.add(braco);
        });

        scene.add(grupo);
        personagens.set(id, {
          grupo, corpoMat, monitorMat: monitor.material, luminariaMat: luminariaCupula.material, spotLight: spot,
          baseY: grupo.position.y, faseAnim: Math.random()*Math.PI*2,
        });

        // Rótulo HTML flutuante — dobra como "letreiro" do setor (nome do
        // agente maior/mais destacado que antes) e como status ao vivo.
        const label = document.createElement('div');
        label.className = 'sa-label'; label.dataset.agenteId = id;
        label.innerHTML = '<div class="sa-label-chip"><span class="sa-label-dot" style="background:#888;"></span><span class="sa-label-texto">'+escapeHtml(id)+'</span></div>';
        label.addEventListener('click', () => selecionarAgente(id));
        label.style.pointerEvents = 'auto';
        label.style.cursor = 'pointer';
        card.appendChild(label);
        personagens.get(id).labelEl = label;

        // Placa fixa com o nome do setor, sempre visível acima da parede —
        // separada do chip de status (que já mostra o nome também, mas some
        // se o personagem sair da tela) pra sempre dar pra ler qual é qual.
        const placa = document.createElement('div');
        placa.className = 'sa-letreiro';
        placa.textContent = CATEGORIA_LABEL[categoriaDoAgente(id)] || id;
        placa.style.borderColor = corHex;
        placa.style.color = corHex;
        placa.dataset.agenteId = id;
        card.appendChild(placa);
        personagens.get(id).placaEl = placa;
      });

      state.three = { renderer, scene, camera, controls, personagens, clock: new THREE.Clock(), card };
      state.cenaPronta = true;

      window.addEventListener('resize', onResizeCena);
    }

    function onResizeCena(){
      if(!state.three) return;
      const { renderer, camera, card } = state.three;
      const largura = card.clientWidth;
      camera.aspect = largura/560;
      camera.updateProjectionMatrix();
      renderer.setSize(largura, 560);
    }

    function atualizarPersonagens(){
      const THREE = window.THREE;
      state.three.personagens.forEach((p, id) => {
        const a = state.agentesPorId[id];
        if(!a) return;
        const hex = corToken(CATEGORIA_TOKEN[a.categoria], '#888888');
        const cor = new THREE.Color(hex);
        p.corpoMat.color = cor;
        if(a.emExecucao){
          p.monitorMat.emissive = cor; p.monitorMat.emissiveIntensity = 0.9;
          if(p.luminariaMat){ p.luminariaMat.emissive = cor; p.luminariaMat.emissiveIntensity = 0.8; }
          if(p.spotLight) p.spotLight.intensity = 1.7;
        } else if(a.ultimoCicloOk === false){
          const corErro = new THREE.Color(corToken('--danger','#DC2626'));
          p.monitorMat.emissive = corErro; p.monitorMat.emissiveIntensity = 0.5;
          if(p.luminariaMat){ p.luminariaMat.emissive = corErro; p.luminariaMat.emissiveIntensity = 0.4; }
          if(p.spotLight) p.spotLight.intensity = 0.9;
        } else {
          p.monitorMat.emissive = new THREE.Color(0x000000); p.monitorMat.emissiveIntensity = 0;
          if(p.luminariaMat){ p.luminariaMat.emissive = new THREE.Color(0x000000); p.luminariaMat.emissiveIntensity = 0; }
          if(p.spotLight) p.spotLight.intensity = 1.1;
        }
        const dot = p.labelEl.querySelector('.sa-label-dot');
        const corStatus = a.emExecucao ? hex : (a.ultimoCicloOk === false ? corToken('--danger') : corToken('--text-faint'));
        dot.style.background = corStatus;
        p.labelEl.querySelector('.sa-label-texto').textContent = a.nome.length > 26 ? a.nome.slice(0,24)+'…' : a.nome;
      });
    }

    function loopAnimacao(){
      if(!state.ativo || !state.three) return;
      const { renderer, scene, camera, controls, personagens, clock, card } = state.three;
      const t = clock.getElapsedTime();
      personagens.forEach((p, id) => {
        const a = state.agentesPorId[id];
        const trabalhando = a && a.emExecucao;
        const amp = trabalhando ? 0.05 : 0.02;
        const vel = trabalhando ? 5 : 1.6;
        p.grupo.position.y = p.baseY + Math.sin(t*vel + p.faseAnim) * amp;
        if(trabalhando) p.grupo.rotation.y = Math.sin(t*1.4 + p.faseAnim) * 0.12;
      });
      controls.update();
      renderer.render(scene, camera);

      // Projeta cada rótulo pra posição de tela
      const rect = card.getBoundingClientRect();
      personagens.forEach((p) => {
        const pos = new THREE.Vector3(0, 2.15, 0.55).add(p.grupo.position);
        pos.project(camera);
        const visivel = pos.z < 1;
        p.labelEl.style.display = visivel ? '' : 'none';
        if(visivel){
          p.labelEl.style.left = ((pos.x*0.5+0.5) * rect.width) + 'px';
          p.labelEl.style.top = ((1 - (pos.y*0.5+0.5)) * rect.height) + 'px';
        }

        // Letreiro fixo do setor — projetado acima do painel na parede de
        // fundo (mais alto que o chip de status), sempre visível junto da
        // zona mesmo quando o personagem sai um pouco do enquadramento.
        if(p.placaEl){
          const posPlaca = new THREE.Vector3(0, 3.3, -7.85).add(p.grupo.position);
          posPlaca.project(camera);
          const placaVisivel = posPlaca.z < 1;
          p.placaEl.style.display = placaVisivel ? '' : 'none';
          if(placaVisivel){
            p.placaEl.style.left = ((posPlaca.x*0.5+0.5) * rect.width) + 'px';
            p.placaEl.style.top = ((1 - (posPlaca.y*0.5+0.5)) * rect.height) + 'px';
          }
        }
      });

      state.rafId = requestAnimationFrame(loopAnimacao);
    }

    // ---- Ciclo de dados (polling) ----
    async function atualizarStatus(){
      try{
        const lista = await apiStatus();
        state.agentesPorId = Object.fromEntries(lista.map(a => [a.id, a]));
        // Só remove o overlay quando a cena 3D existe de fato — se ela falhou
        // ao carregar (ex.: CDN bloqueado), load() já escreveu ali a mensagem
        // de erro explicando isso, e essa mensagem não pode ser apagada só
        // porque o status (que é independente da cena) veio com sucesso.
        if(state.cenaPronta){
          const overlay = document.getElementById('saStatusOverlay');
          if(overlay) overlay.remove();
        }
        renderListaAgentes();
        renderDetalhe();
        if(state.cenaPronta) atualizarPersonagens();
      }catch(err){
        const overlay = document.getElementById('saStatusOverlay');
        if(overlay){ overlay.innerHTML = '<span style="color:var(--danger);">'+escapeHtml(err.message||'Não foi possível carregar o status dos agentes.')+'</span>'; }
      }
    }

    async function load(){
      if(!state.shellPronta) montarShellHTML();
      state.ativo = true;

      if(!state.cenaPronta){
        try{
          await garantirThree();
          if(!state.ativo) return; // usuário já saiu da tela enquanto carregava
          construirCena();
        }catch(err){
          const overlay = document.getElementById('saStatusOverlay');
          if(overlay) overlay.innerHTML = '<span style="color:var(--danger);">Não foi possível carregar a sala 3D (biblioteca externa bloqueada?). O status continua disponível na lista ao lado.</span>';
        }
      }

      await atualizarStatus();
      if(!state.ativo) return;

      if(state.cenaPronta && state.rafId === null) loopAnimacao();
      if(state.pollTimer) clearInterval(state.pollTimer);
      state.pollTimer = setInterval(atualizarStatus, 20000);
    }

    function unload(){
      state.ativo = false;
      if(state.pollTimer){ clearInterval(state.pollTimer); state.pollTimer = null; }
      if(state.rafId !== null){ cancelAnimationFrame(state.rafId); state.rafId = null; }
    }

    window.SalaAgentes = { load, unload };
  })();

  // Só navega para a rota inicial depois que TODOS os módulos acima (Empresas,
  // Marketplaces, Pedidos, Custos, Produtos, Fornecedores, Anúncios, Estoque,
  // Estoque Full, Compras, Contas a Pagar, Contas a Receber, Recebimentos,
  // DRE, Faturamento, Notas Fiscais, Ads, Relatórios) já estão definidos —
  // chamar isso mais cedo fazia a tela de destino do OAuth do Mercado Livre
  // (#marketplaces?ml=...) e outras rotas carregarem em branco no primeiro
  // load/refresh.
  navigate(location.hash ? location.hash.slice(1) : 'overview');

})();
</script>
