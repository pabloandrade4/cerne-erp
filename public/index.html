        + linhas.map((l,i)=> '<div class="item-row"><div style="display:flex;align-items:center;gap:10px;min-width:0;">'
            + '<span style="flex-shrink:0;width:20px;color:var(--text-faint);font-weight:700;font-size:12px;">'+(i+1)+'</span>'
            + thumbHTML(l.imagemUrl)
            + '<div class="cell-stack" style="min-width:0;"><span class="ir-title" title="'+escapeHtml(l.anuncio||'—')+'">'+escapeHtml(l.anuncio||'(sem título)')+'</span><span class="ir-sku mono">'+escapeHtml(l.sku||'sem SKU')+'</span></div>'
          + '</div>'
          + '<div class="mono" style="text-align:right;flex-shrink:0;">'+valorFn(l)+'</div>'
        + '</div>').join('')
      + '</div>';
    }

    function insightsHTML(l){
      const tags = [];
      if(l.insights.muitasVisitasPoucasVendas) tags.push(['Muitas visitas, poucas vendas','var(--warning)']);
      if(l.insights.poucasVisitasBoaConversao) tags.push(['Poucas visitas, boa conversão','var(--teal)']);
      if(l.insights.muitasVisitasBoaConversao) tags.push(['Anúncio forte','var(--success)']);
      if(l.insights.quedaDeVisitas) tags.push(['Queda de visitas','var(--danger)']);
      if(!tags.length) return '';
      return tags.map(([t,cor])=>'<span style="display:inline-block;font-size:11px;padding:2px 7px;border-radius:20px;background:var(--surface-2);color:'+cor+';font-weight:600;margin:0 4px 4px 0;">'+escapeHtml(t)+'</span>').join('');
    }

    function anuncioCellHTML(l){
      return '<td class="produto-cell"><a href="javascript:void(0)" class="anuncio-link" data-ml-item="'+escapeHtml(l.mlItemId||'')+'" style="text-decoration:none;color:inherit;"><div class="anuncio-cell-flex">'
        + thumbHTML(l.imagemUrl)
        + '<div class="cell-stack">'
          + '<span class="prod-title" title="'+escapeHtml(l.anuncio||'—')+'" style="text-decoration:underline dotted;">'+escapeHtml(l.anuncio||'(sem título)')+'</span>'
          + '<span class="cell-stack-sub mono">'+escapeHtml(l.sku||'sem SKU')+'</span>'
        + '</div></div></a></td>';
    }

    function tabelaHTML(linhas){
      return '<div class="table-card"><div class="table-wrap"><table class="data-table"><thead><tr>'
        + '<th>Anúncio / SKU</th><th>Loja</th><th>Visitas</th><th>Unid. vendidas</th><th>Pedidos</th><th>Faturamento</th><th>Conversão (pedidos÷visitas)</th>'
        + '<th>Visitas per. anterior</th><th>Evolução visitas</th><th>Evolução conversão</th><th>Sinalizações</th>'
        + '</tr></thead><tbody>'
        + linhas.map(l => '<tr>'
          + anuncioCellHTML(l)
          + '<td>'+escapeHtml(l.loja||'—')+'</td>'
          + '<td class="mono">'+intOrIndisp(l.visitas)+'</td>'
          + '<td class="mono tab-nums">'+l.unidadesVendidas+'</td>'
          + '<td class="mono tab-nums">'+l.pedidos+'</td>'
          + '<td class="mono">'+money(l.faturamento)+'</td>'
          + '<td class="mono">'+pctOrIndisp(l.conversao)+'</td>'
          + '<td class="mono">'+intOrIndisp(l.visitasAnterior)+'</td>'
          + '<td class="mono" style="'+(l.evolucaoVisitasPercentual!==null?(l.evolucaoVisitasPercentual>=0?'color:var(--success);':'color:var(--danger);'):'')+'">'+(l.visitasNovo?'<span style="color:var(--teal);">Novo</span>':pctSinal(l.evolucaoVisitasPercentual))+'</td>'
          + '<td class="mono">'+(l.evolucaoConversaoPontos===null?'—':((l.evolucaoConversaoPontos>=0?'+':'')+l.evolucaoConversaoPontos.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+' p.p.'))+'</td>'
          + '<td>'+insightsHTML(l)+'</td>'
        + '</tr>').join('')
        + '</tbody></table></div></div>';
    }

    // ---- Gráficos: Visitas x Vendas (barras+linha) e Conversão ao longo do tempo (linha) ----
    function chartVisitasVendasHTML(serie){
      if(!serie || !serie.length){
        return '<div class="chart-canvas h-lg">' + chartGridLines(4) + chartEmptyState('lineChart', 'Sem série diária disponível para este período.') + '</div>';
      }
      const n = serie.length;
      const W = Math.max(n*10, 10), H = 100, topPad = 8, botPad = 10;
      const usable = H - topPad - botPad;
      const vals = serie.flatMap(d => [d.unidades||0, d.visitas||0]);
      const maxV = Math.max(1, ...vals);
      const yFor = v => topPad + usable * (1 - (v||0) / maxV);
      const baseY = yFor(0);
      const barW = 6;
      let bars = '', points = [];
      serie.forEach((d,i)=>{
        const cx = i*10+5;
        const y1 = yFor(d.unidades||0);
        const barY = Math.min(y1, baseY), barH = Math.max(Math.abs(y1-baseY), 0.6);
        const label = fmtDiaCurto(d.dia)+' — Vendas: '+(d.unidades||0)+' · Visitas: '+(d.visitas===null?'dado não disponível':d.visitas);
        bars += '<rect x="'+(cx-barW/2)+'" y="'+barY+'" width="'+barW+'" height="'+barH+'" rx="1" fill="var(--copper)" fill-opacity="0.85"><title>'+escapeHtml(label)+'</title></rect>';
        if(d.visitas!==null) points.push(cx+','+yFor(d.visitas));
      });
      const line = points.length ? '<polyline points="'+points.join(' ')+'" fill="none" stroke="var(--teal)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>' : '';
      const baseline = '<line x1="0" y1="'+baseY+'" x2="'+W+'" y2="'+baseY+'" stroke="var(--border-strong)" stroke-width="1" vector-effect="non-scaling-stroke"/>';
      const labelStep = Math.max(1, Math.ceil(n/9));
      const labels = serie.map((d,i) => '<span>'+((i%labelStep===0 || i===n-1) ? escapeHtml(fmtDiaCurto(d.dia)) : '')+'</span>').join('');
      return '<div class="chart-canvas" style="position:relative;height:200px;padding:0;">'
        + '<svg class="simple-chart-svg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="height:100%;">' + baseline + bars + line + '</svg>'
      + '</div>'
      + '<div class="simple-chart-xlabels" style="grid-template-columns:repeat('+n+',1fr);">' + labels + '</div>';
    }
    function chartConversaoHTML(serie){
      const comDado = (serie||[]).filter(d=>d.conversao!==null);
      if(!comDado.length){
        return '<div class="chart-canvas h-lg">' + chartGridLines(4) + chartEmptyState('activity', 'Sem conversão diária disponível (depende de visitas, que não estão disponíveis neste período).') + '</div>';
      }
      const n = serie.length;
      const W = Math.max(n*10, 10), H = 100, topPad = 8, botPad = 10;
      const usable = H - topPad - botPad;
      const maxV = Math.max(1, ...comDado.map(d=>d.conversao));
      const yFor = v => topPad + usable * (1 - v/maxV);
      let points = [];
      serie.forEach((d,i)=>{ if(d.conversao!==null) points.push((i*10+5)+','+yFor(d.conversao)); });
      const line = '<polyline points="'+points.join(' ')+'" fill="none" stroke="var(--success)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>';
      const dots = serie.map((d,i)=>{
        if(d.conversao===null) return '';
        const cx=i*10+5, cy=yFor(d.conversao);
        return '<circle cx="'+cx+'" cy="'+cy+'" r="1.6" fill="var(--success)" vector-effect="non-scaling-stroke"><title>'+escapeHtml(fmtDiaCurto(d.dia)+' — Conversão: '+d.conversao.toFixed(2)+'%')+'</title></circle>';
      }).join('');
      const labelStep = Math.max(1, Math.ceil(n/9));
      const labels = serie.map((d,i) => '<span>'+((i%labelStep===0 || i===n-1) ? escapeHtml(fmtDiaCurto(d.dia)) : '')+'</span>').join('');
      return '<div class="chart-canvas" style="position:relative;height:200px;padding:0;">'
        + '<svg class="simple-chart-svg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="height:100%;">' + line + dots + '</svg>'
      + '</div>'
      + '<div class="simple-chart-xlabels" style="grid-template-columns:repeat('+n+',1fr);">' + labels + '</div>';
    }

    function abrirDetalhe(l){
      window.AnuncioDetalheModal.abrir({
        titulo: l.anuncio, sku: l.sku, loja: l.loja, mlItemId: l.mlItemId, imagemUrl: l.imagemUrl, origem: 'visitasConversao',
        campos: [
          { label:'Visitas no período', html: intOrIndisp(l.visitas) },
          { label:'Unidades vendidas', value: l.unidadesVendidas },
          { label:'Pedidos', value: l.pedidos },
          { label:'Faturamento', html: money(l.faturamento) },
          { label:'Conversão (pedidos÷visitas)', html: pctOrIndisp(l.conversao) },
          { label:'Visitas período anterior', html: intOrIndisp(l.visitasAnterior) },
          { label:'Evolução de visitas', html: l.visitasNovo?'Novo no período':pctSinal(l.evolucaoVisitasPercentual) },
          { label:'Evolução de conversão', value: l.evolucaoConversaoPontos===null?'—':(l.evolucaoConversaoPontos+' p.p.') },
        ],
      });
    }

    function render(){
      const root = document.getElementById('visitasConversaoRoot');
      if(!root) return;
      const filtro = window.CerneFiltro.state;

      if(!filtro.loadingEmpresas && !filtro.empresas.length){
        root.innerHTML = '<div class="empty-panel"><div class="empty-icon">'+svg('building')+'</div>'
          + '<h2>Nenhuma empresa ativa</h2><p class="lead">Cadastre e ative uma empresa em <strong>Cadastros → Empresas</strong> para ver Visitas e Conversão aqui.</p></div>';
        return;
      }

      let html = '<div class="field-hint" style="margin-bottom:12px;max-width:960px;">Conversão = <strong>pedidos ÷ visitas × 100</strong> (um pedido com várias unidades do mesmo anúncio conta como 1 conversão). Visitas vêm direto da API de Visitas do Mercado Livre — quando a API não retorna esse dado para um anúncio/período, a tela mostra "Dado não disponível" (nunca um número estimado). Os gráficos mostram a série diária agregada de todas as lojas/anúncios filtrados — a API do Mercado Livre não oferece visitas diárias por anúncio individual.</div>';

      if(state.data && !state.data.semConta){
        html += '<div class="toolbar"><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">'
          + '<div class="empresa-picker" style="margin-bottom:0;"><select id="vcLojaSelect"><option value="">Todas as lojas</option>'
            + state.data.lojas.map(l=>'<option value="'+l.id+'" '+(String(l.id)===String(state.contaId)?'selected':'')+'>'+escapeHtml(l.nickname||('Conta '+l.id))+'</option>').join('')
          + '</select></div>'
          + '<input type="text" id="vcSkuInput" placeholder="Buscar por SKU…" value="'+escapeHtml(state.sku)+'" style="height:38px;padding:0 12px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface-1);min-width:160px;">'
          + '<div class="empresa-picker" style="margin-bottom:0;"><select id="vcSortSelect">'
            + OPCOES_ORDENACAO.map(o=>'<option value="'+o.valor+'" '+(o.valor===state.sort?'selected':'')+'>Ordenar por: '+escapeHtml(o.label)+'</option>').join('')
          + '</select></div>'
        + '</div></div>';

        if(state.data.situacaoPorConta && state.data.situacaoPorConta.some(s=>!s.disponivel)){
          html += '<div class="table-card" style="padding:12px 16px;margin-bottom:14px;border-left:3px solid var(--warning);">'
            + state.data.situacaoPorConta.filter(s=>!s.disponivel).map(s=>
              '<div style="font-size:12.5px;color:var(--text-muted);display:flex;gap:8px;align-items:flex-start;margin:4px 0;">'
                + '<span style="color:var(--warning);flex-shrink:0;">'+svg('alertCircle')+'</span>'
                + '<span><strong>'+escapeHtml(s.loja||('Conta '+s.contaId))+'</strong>: '+escapeHtml(s.mensagem||'')+'</span>'
              + '</div>'
            ).join('')
          + '</div>';
        }

        if(state.data.linhas && state.data.linhas.length) html += kpiHeroHTML(state.data.linhas);

        if(state.data.grafico){
          html += '<div class="chart-card" style="margin-bottom:14px;">'
            + '<div class="chart-card-head"><div class="panel-title"><span class="panel-title-ic">'+svg('lineChart')+'</span>Visitas x Vendas</div>'
              + '<div class="chart-legend"><span class="legend-item"><span class="legend-dot" style="background:var(--copper)"></span>Vendas (unidades)</span><span class="legend-item"><span class="legend-dot" style="background:var(--teal)"></span>Visitas</span></div>'
            + '</div>'
            + chartVisitasVendasHTML(state.data.grafico.serieDiaria)
          + '</div>';
          html += '<div class="chart-card" style="margin-bottom:14px;">'
            + '<div class="chart-card-head"><div class="panel-title"><span class="panel-title-ic">'+svg('activity')+'</span>Conversão ao longo do tempo</div></div>'
            + chartConversaoHTML(state.data.grafico.serieDiaria)
          + '</div>';
        }

        if(state.data.linhas && state.data.linhas.length){
          html += '<div class="grid-2" style="margin-bottom:14px;align-items:start;">'
            + rankingListHTML('Ranking de mais visitados', 'eye', state.data.linhas.filter(l=>l.visitas!==null).slice().sort((a,b)=>b.visitas-a.visitas).slice(0,5), l=>intOrIndisp(l.visitas))
            + rankingListHTML('Ranking de melhor conversão', 'activity', state.data.linhas.filter(l=>l.conversao!==null).slice().sort((a,b)=>b.conversao-a.conversao).slice(0,5), l=>pctOrIndisp(l.conversao))
          + '</div>';
        }
      }

      if(state.loading || filtro.loadingEmpresas){
        html += '<div class="table-card"><div class="table-skel"><span class="spin"></span><span>Carregando Visitas e Conversão…</span></div></div>';
      } else if(state.error){
        html += '<div class="empty-panel"><div class="empty-icon" style="color:var(--danger); background:var(--danger-soft);">'+svg('alertCircle')+'</div>'
          + '<h2 style="color:var(--danger);">Não foi possível carregar</h2><p class="lead">'+escapeHtml(state.error)+'</p></div>';
      } else if(state.data && state.data.semConta){
        html += '<div class="empty-panel"><div class="empty-icon">'+svg('store')+'</div>'
          + '<h2>Nenhuma conta do Mercado Livre conectada</h2><p class="lead">Conecte uma conta do Mercado Livre em <strong>Marketplaces</strong> para ver Visitas e Conversão aqui.</p></div>';
      } else if(state.data && !state.data.linhas.length){
        html += '<div class="empty-panel"><div class="empty-icon">'+svg('eye')+'</div>'
          + '<h2>Nenhum anúncio encontrado</h2><p class="lead">Nenhum anúncio com venda ou dado para os filtros escolhidos.</p></div>';
      } else if(state.data){
        const linhasOrdenadas = ordenarLinhas(state.data.linhas, state.sort);
        if(!linhasOrdenadas.length){
          html += '<div class="empty-panel"><div class="empty-icon">'+svg('eye')+'</div><h2>Nenhum anúncio nesta ordenação/filtro</h2><p class="lead">Experimente "Todas as lojas" ou outra ordenação.</p></div>';
        } else {
          html += tabelaHTML(linhasOrdenadas);
        }
      }

      root.innerHTML = html;

      const selLoja = document.getElementById('vcLojaSelect');
      if(selLoja) selLoja.addEventListener('change', ()=>{ state.contaId = selLoja.value; loadDados(); });
      const skuInput = document.getElementById('vcSkuInput');
      if(skuInput){
        let debounce = null;
        skuInput.addEventListener('input', ()=>{ clearTimeout(debounce); debounce = setTimeout(()=>{ state.sku = skuInput.value; loadDados(); }, 400); });
      }
      const selSort = document.getElementById('vcSortSelect');
      if(selSort) selSort.addEventListener('change', ()=>{ state.sort = selSort.value; render(); });

      root.querySelectorAll('.anuncio-link').forEach(el=>{
        el.addEventListener('click', ()=>{
          const mlItemId = el.dataset.mlItem;
          const l = (state.data.linhas||[]).find(x=>x.mlItemId===mlItemId);
          if(l) abrirDetalhe(l);
        });
      });
    }

    window.VisitasConversao = { load };
  })();

  /* ================= MARGEM POR ANÚNCIO =================
     Ativada em 26/08/2026, pedido explícito do usuário. Usa a MESMA regra
     financeira de Pedidos/Financeiro/Relatórios/Ads (lib/resultadoVenda.js)
     — nenhuma fórmula nova. Investimento em Ads vem da mesma fonte da tela
     Ads. Quando falta custo de algum SKU, a margem aparece marcada como
     incompleta (nunca uma soma parcial disfarçada de completa). */
  (function(){
    const state = { loading:false, error:null, data:null, contaId:'', sku:'', sort:'maiorResultado' };

    function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function pendenteCusto(){ return '<span style="color:var(--text-faint);font-style:italic;" title="Falta cadastrar o custo deste SKU em Produtos.">margem incompleta</span>'; }
    // Pedido explícito do usuário: "Se o Ads ainda não estiver sincronizado
    // para determinado anúncio, mostre: Ads pendente" (texto literal).
    function pendenteAds(){ return '<span style="color:var(--text-faint);font-style:italic;" title="Sem sincronização de Ads para este anúncio/período.">Ads pendente</span>'; }
    function money(v){ return v===null||v===undefined ? '—' : 'R$ ' + Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2}); }
    function pctFmt(v){ return v===null||v===undefined ? '—' : Number(v).toLocaleString('pt-BR',{minimumFractionDigits:1, maximumFractionDigits:1})+'%'; }
    function intFmt(v){ return v===null||v===undefined ? '—' : Number(v).toLocaleString('pt-BR'); }
    function thumbHTML(url){
      if(!url) return '<span class="anuncio-thumb-placeholder" title="Sem imagem disponível">'+svg('box')+'</span>';
      return '<span style="position:relative;display:inline-block;width:36px;height:36px;flex-shrink:0;">'
        + '<img class="anuncio-thumb" src="'+escapeHtml(url)+'" alt="" loading="lazy" style="position:absolute;inset:0;" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\';">'
        + '<span class="anuncio-thumb-placeholder" style="display:none;position:absolute;inset:0;">'+svg('box')+'</span>'
      + '</span>';
    }
    // "Performance atribuída pelo Mercado Ads" — dado bruto que o próprio
    // Ads calcula (cliques, impressões, CTR/CVR/ROAS, faturamento que o Ads
    // ATRIBUI ao anúncio) — pedido explícito do usuário: "deixe separado:
    // Performance atribuída pelo Mercado Ads de Resultado real do anúncio
    // após Ads". Renderizado à parte do resultado real (que usa só vendas
    // reais, nunca a atribuição do Ads).
    function adsAtribuidoResumoHTML(ads){
      if(!ads || !ads.disponivel) return '<span style="color:var(--text-faint);font-style:italic;">Ads pendente</span>';
      const partes = [];
      if(ads.cliques!==null && ads.cliques!==undefined) partes.push(intFmt(ads.cliques)+' cliques');
      if(ads.impressoes!==null && ads.impressoes!==undefined) partes.push(intFmt(ads.impressoes)+' impr.');
      if(ads.roasApi!==null && ads.roasApi!==undefined) partes.push('ROAS '+Number(ads.roasApi).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1}));
      else if(ads.acosApi!==null && ads.acosApi!==undefined) partes.push('ACOS '+pctFmt(ads.acosApi));
      return '<span style="font-size:12px;color:var(--text-muted);">'+(partes.length?escapeHtml(partes.join(' · ')):'<span style="color:var(--text-faint);font-style:italic;">sem métricas</span>')+'</span>'
        + (ads.campanha?('<div class="cell-stack-sub">'+escapeHtml(ads.campanha)+'</div>'):'');
    }

    async function apiMargem(empresaId, periodo, contaId, sku, desde, ate){
      const params = new URLSearchParams({ empresaId, periodo });
      if(contaId) params.set('contaId', contaId);
      if(sku) params.set('sku', sku);
      if(periodo === 'personalizado'){ if(desde) params.set('desde', desde); if(ate) params.set('ate', ate); }
      const res = await fetch('/api/margem-anuncio?'+params.toString());
      let body = null; try{ body = await res.json(); }catch(e){}
      if(!res.ok) throw new Error((body && body.error) || 'Não foi possível carregar Margem por Anúncio.');
      return body;
    }

    async function loadDados(){
      const filtro = window.CerneFiltro.state;
      if(!filtro.empresaId){ state.data = null; state.loading = false; render(); return; }
      state.loading = true; state.error = null; render();
      try{ state.data = await apiMargem(filtro.empresaId, filtro.periodo, state.contaId, state.sku, filtro.desdePersonalizado, filtro.atePersonalizado); }
      catch(err){ state.error = err.message; state.data = null; }
      state.loading = false; render();
    }

    function load(queryStr){
      if(queryStr){
        const params = new URLSearchParams(queryStr);
        if(params.get('sku')) state.sku = params.get('sku');
      }
      loadDados();
    }

    window.CerneFiltro.onChange(()=>{
      const page = document.getElementById('page-margemAnuncio');
      if(page && page.classList.contains('active')) loadDados();
      else render();
    });

    const OPCOES_ORDENACAO = [
      { valor:'maiorResultado', label:'Maior resultado' },
      { valor:'maiorPrejuizo', label:'Maior prejuízo' },
      { valor:'maiorMargemPct', label:'Maior margem %' },
      { valor:'menorMargemPct', label:'Menor margem %' },
      { valor:'maiorFaturamento', label:'Maior faturamento' },
      { valor:'maiorGastoAds', label:'Maior gasto com Ads' },
    ];
    function valOr(l, campo, seAusente){ const v = l[campo]; return v===null||v===undefined ? seAusente : v; }
    function ordenarLinhas(linhas, sort){
      const copia = linhas.slice();
      if(sort==='maiorPrejuizo') return copia.sort((a,b)=> valOr(a,'resultadoAposAds',Infinity) - valOr(b,'resultadoAposAds',Infinity));
      if(sort==='maiorMargemPct') return copia.sort((a,b)=> valOr(b,'margemContribuicaoPct',-Infinity) - valOr(a,'margemContribuicaoPct',-Infinity));
      if(sort==='menorMargemPct') return copia.sort((a,b)=> valOr(a,'margemContribuicaoPct',Infinity) - valOr(b,'margemContribuicaoPct',Infinity));
      if(sort==='maiorFaturamento') return copia.sort((a,b)=> (b.faturamento||0) - (a.faturamento||0));
      if(sort==='maiorGastoAds') return copia.sort((a,b)=> valOr(b,'investimentoAds',-Infinity) - valOr(a,'investimentoAds',-Infinity));
      return copia.sort((a,b)=> valOr(b,'resultadoAposAds',-Infinity) - valOr(a,'resultadoAposAds',-Infinity)); // 'maiorResultado'
    }

    // ---- KPIs, ranking e gráfico de topo — Σ/ordenação das MESMAS linhas
    // já retornadas por /api/margem-anuncio (nenhuma fórmula nova; margem
    // incompleta e Ads pendente ficam de fora das somas, nunca tratados
    // como zero). */
    function kpiHeroHTML(linhas){
      if(!linhas.length) return '';
      const faturamentoTotal = linhas.reduce((s,l)=>s+(l.faturamento||0),0);
      const completas = linhas.filter(l=>!l.margemIncompleta);
      const margemTotal = completas.reduce((s,l)=>s+(l.margemContribuicao||0),0);
      const margemPctMedia = faturamentoTotal>0 && completas.length ? (margemTotal/faturamentoTotal*100) : null;
      const comAds = linhas.filter(l=>l.resultadoAposAds!==null);
      const resultadoAposAdsTotal = comAds.reduce((s,l)=>s+l.resultadoAposAds,0);
      const negativas = linhas.filter(l=>l.destaques.margemNegativa).length;
      const prejuizoAds = linhas.filter(l=>l.destaques.prejuizoAposAds).length;
      const items = [
        { label:'Faturamento', icon:'barChart', tint:'copper', valueHtml: money(faturamentoTotal), note: linhas.length+' anúncio(s)' },
        { label:'Margem de contribuição', icon:'wallet', tint: margemTotal>=0?'success':'danger', valueHtml: completas.length?money(margemTotal):pendenteCusto(), note: (linhas.length-completas.length)>0 ? (linhas.length-completas.length)+' com margem incompleta' : 'Todos os anúncios com custo' },
        { label:'Margem % média', icon:'percent', tint:'purple', valueHtml: margemPctMedia===null?'—':pctFmt(margemPctMedia), note:'Sobre o faturamento' },
        { label:'Resultado após Ads', icon:'activity', tint: resultadoAposAdsTotal>=0?'success':'danger', valueHtml: comAds.length?money(resultadoAposAdsTotal):pendenteAds(), note: (linhas.length-comAds.length)>0 ? (linhas.length-comAds.length)+' com Ads pendente' : 'Todos com Ads sincronizado' },
        { label:'Margem negativa', icon:'alertCircle', tint: negativas>0?'danger':'muted', valueHtml:String(negativas), note:'Anúncio(s) vendendo no prejuízo' },
        { label:'Prejuízo após Ads', icon:'alertCircle', tint: prejuizoAds>0?'danger':'muted', valueHtml:String(prejuizoAds), note:'Margem positiva, mas Ads consome tudo' },
      ];
      return '<div class="kpi-hero-grid" style="margin-bottom:14px;">' + items.map(k=>
        '<div class="kpi-hero" style="--tint:var(--'+k.tint+');--tint-soft:var(--'+k.tint+'-soft);">'
          + '<div class="kpi-hero-top"><div class="kpi-hero-icon">'+svg(k.icon)+'</div></div>'
          + '<div class="kpi-hero-label">'+escapeHtml(k.label)+'</div>'
          + '<div class="kpi-hero-value" style="font-size:18px;">'+k.valueHtml+'</div>'
          + '<div class="kpi-hero-foot"><span class="kpi-hero-note">'+escapeHtml(k.note)+'</span></div>'
        + '</div>'
      ).join('') + '</div>';
    }
    function rankingListHTML(titulo, icone, linhas, valorFn){
      if(!linhas.length) return '<div class="panel"><div class="panel-head"><div class="panel-title"><span class="panel-title-ic">'+svg(icone)+'</span>'+escapeHtml(titulo)+'</div></div><div class="field-hint">Sem dados suficientes.</div></div>';
      return '<div class="panel">'
        + '<div class="panel-head"><div class="panel-title"><span class="panel-title-ic">'+svg(icone)+'</span>'+escapeHtml(titulo)+'</div></div>'
        + linhas.map((l,i)=> '<div class="item-row"><div style="display:flex;align-items:center;gap:10px;min-width:0;">'
            + '<span style="flex-shrink:0;width:20px;color:var(--text-faint);font-weight:700;font-size:12px;">'+(i+1)+'</span>'
            + thumbHTML(l.imagemUrl)
            + '<div class="cell-stack" style="min-width:0;"><span class="ir-title" title="'+escapeHtml(l.anuncio||'—')+'">'+escapeHtml(l.anuncio||'(sem título)')+'</span><span class="ir-sku mono">'+escapeHtml(l.sku||'sem SKU')+'</span></div>'
          + '</div>'
          + '<div class="mono" style="text-align:right;flex-shrink:0;">'+valorFn(l)+'</div>'
        + '</div>').join('')
      + '</div>';
    }
    function chartMargemHTML(linhas){
      const top = linhas.filter(l=>!l.margemIncompleta).slice().sort((a,b)=>(b.margemContribuicao||0)-(a.margemContribuicao||0)).slice(0,8);
      if(!top.length) return '<div class="chart-canvas h-lg">'+chartGridLines(4)+chartEmptyState('wallet','Sem margem completa no período pra mostrar no gráfico.')+'</div>';
      const maxV = Math.max(...top.map(l=>Math.abs(l.margemContribuicao||0)), 1);
      return '<div style="display:flex;align-items:flex-end;gap:14px;height:190px;padding:6px 4px 0;">'
        + top.map(l=>{
            const h = Math.max(4, Math.round(Math.abs(l.margemContribuicao||0)/maxV*160));
            const cor = l.margemContribuicao>=0 ? 'var(--success)' : 'var(--danger)';
            return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;" title="'+escapeHtml(l.anuncio||'')+': '+money(l.margemContribuicao)+'">'
              + '<div class="mono" style="font-size:10.5px;color:var(--text-faint);">'+money(l.margemContribuicao).replace('R$ ','')+'</div>'
              + '<div style="width:100%;max-width:34px;height:'+h+'px;background:'+cor+';border-radius:5px 5px 0 0;"></div>'
              + '<div style="font-size:10px;color:var(--text-faint);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;">'+escapeHtml((l.sku||l.anuncio||'').slice(0,12))+'</div>'
            + '</div>';
        }).join('')
      + '</div>';
    }

    function destaquesHTML(l){
      const tags = [];
      if(l.destaques.margemNegativa) tags.push(['Margem negativa','var(--danger)']);
      else if(l.destaques.prejuizoAposAds) tags.push(['Prejuízo após Ads','var(--danger)']);
      if(l.destaques.faturaMuitoPoucaMargem) tags.push(['Fatura muito, pouca margem','var(--warning)']);
      if(l.destaques.adsConsumindoResultado) tags.push(['Ads consumindo resultado','var(--warning)']);
      if(l.destaques.vendePoucoOtimaMargem) tags.push(['Vende pouco, ótima margem','var(--teal)']);
      if(l.destaques.vendeMuitoMargemSaudavel) tags.push(['Vende muito, margem saudável','var(--success)']);
      if(!tags.length) return '';
      return tags.map(([t,cor])=>'<span style="display:inline-block;font-size:11px;padding:2px 7px;border-radius:20px;background:var(--surface-2);color:'+cor+';font-weight:600;margin:0 4px 4px 0;">'+escapeHtml(t)+'</span>').join('');
    }

    function anuncioCellHTML(l){
      return '<td class="produto-cell"><a href="javascript:void(0)" class="anuncio-link" data-ml-item="'+escapeHtml(l.mlItemId||'')+'" style="text-decoration:none;color:inherit;"><div class="anuncio-cell-flex">'
        + thumbHTML(l.imagemUrl)
        + '<div class="cell-stack">'
          + '<span class="prod-title" title="'+escapeHtml(l.anuncio||'—')+'" style="text-decoration:underline dotted;">'+escapeHtml(l.anuncio||'(sem título)')+'</span>'
          + '<span class="cell-stack-sub mono">'+escapeHtml(l.sku||'sem SKU')+'</span>'
        + '</div></div></a></td>';
    }

    function tabelaHTML(linhas){
      return '<div class="table-card"><div class="table-wrap"><table class="data-table"><thead><tr>'
        + '<th>Anúncio / SKU</th><th>Produto</th><th>Loja</th><th>Pedidos</th><th>Qtd vendida</th><th>Faturamento</th><th>Custo produtos</th><th>Imposto</th>'
        + '<th>Tarifas</th><th>Frete vendedor</th><th>Margem contrib.</th><th>Margem %</th><th>Ads (investimento)</th><th>Ads (atribuído pelo Mercado Ads)</th><th>Resultado real após Ads</th><th>Margem real após Ads %</th><th>Destaques</th>'
        + '</tr></thead><tbody>'
        + linhas.map(l => '<tr>'
          + anuncioCellHTML(l)
          + '<td>'+(l.produto?escapeHtml(l.produto):'<span style="color:var(--text-faint);">—</span>')+'</td>'
          + '<td>'+escapeHtml(l.loja||'—')+'</td>'
          + '<td class="mono tab-nums">'+l.quantidadePedidos+'</td>'
          + '<td class="mono tab-nums">'+l.quantidadeVendida+'</td>'
          + '<td class="mono">'+money(l.faturamento)+'</td>'
          + '<td class="mono">'+(l.custoProdutos===null?pendenteCusto():money(l.custoProdutos))+'</td>'
          + '<td class="mono">'+money(l.imposto)+'</td>'
          + '<td class="mono">'+(l.tarifas===null?'<span style="color:var(--text-faint);">—</span>':money(l.tarifas))+'</td>'
          + '<td class="mono">'+(l.freteVendedor===null?'<span style="color:var(--text-faint);">—</span>':money(l.freteVendedor))+'</td>'
          + '<td class="mono" style="'+(l.margemContribuicao!==null?(l.margemContribuicao>=0?'color:var(--success);':'color:var(--danger);'):'')+'">'+(l.margemIncompleta?pendenteCusto():money(l.margemContribuicao))+'</td>'
          + '<td class="mono">'+(l.margemIncompleta?'—':pctFmt(l.margemContribuicaoPct))+'</td>'
          + '<td class="mono">'+(l.semDadosAds?pendenteAds():money(l.investimentoAds))+'</td>'
          + '<td>'+adsAtribuidoResumoHTML(l.adsAtribuido)+'</td>'
          + '<td class="mono" style="'+(l.resultadoAposAds!==null?(l.resultadoAposAds>=0?'color:var(--success);':'color:var(--danger);'):'')+'">'+(l.resultadoAposAds===null?(l.margemIncompleta?pendenteCusto():pendenteAds()):money(l.resultadoAposAds))+'</td>'
          + '<td class="mono">'+(l.margemAposAdsPct===null?'—':pctFmt(l.margemAposAdsPct))+'</td>'
          + '<td>'+destaquesHTML(l)+'</td>'
        + '</tr>').join('')
        + '</tbody></table></div></div>';
    }

    function abrirDetalhe(l){
      const ads = l.adsAtribuido;
      window.AnuncioDetalheModal.abrir({
        titulo: l.anuncio, sku: l.sku, loja: l.loja, mlItemId: l.mlItemId, imagemUrl: l.imagemUrl, origem: 'margemAnuncio',
        campos: [
          { label:'Pedidos', value: l.quantidadePedidos },
          { label:'Quantidade vendida', value: l.quantidadeVendida },
          { label:'Faturamento', html: money(l.faturamento) },
          { label:'Custo dos produtos', html: l.custoProdutos===null?pendenteCusto():money(l.custoProdutos) },
          { label:'Imposto', html: money(l.imposto) },
          { label:'Tarifas/comissões', html: l.tarifas===null?'—':money(l.tarifas) },
          { label:'Frete do vendedor', html: l.freteVendedor===null?'—':money(l.freteVendedor) },
          { label:'Margem de contribuição (antes do Ads)', html: l.margemIncompleta?pendenteCusto():money(l.margemContribuicao) },
          { label:'Margem de contribuição %', html: l.margemIncompleta?'—':pctFmt(l.margemContribuicaoPct) },
          { label:'— Resultado real (vendas reais) —', html: '<hr style="border:none;border-top:1px solid var(--border-strong);margin:2px 0;">' },
          { label:'Investimento em Ads (real, sincronizado)', html: l.semDadosAds?pendenteAds():money(l.investimentoAds) },
          { label:'Resultado real após Ads', html: l.resultadoAposAds===null?'—':money(l.resultadoAposAds) },
          { label:'Margem real após Ads %', html: l.margemAposAdsPct===null?'—':pctFmt(l.margemAposAdsPct) },
          { label:'— Performance atribuída pelo Mercado Ads —', html: '<hr style="border:none;border-top:1px solid var(--border-strong);margin:2px 0;">' },
          { label:'Campanha', value: (ads && ads.campanha) || (ads && ads.disponivel ? '—' : 'Ads pendente') },
          { label:'Cliques', value: ads && ads.disponivel ? intFmt(ads.cliques) : 'Ads pendente' },
          { label:'Impressões', value: ads && ads.disponivel ? intFmt(ads.impressoes) : 'Ads pendente' },
          { label:'CTR (Mercado Ads)', html: ads && ads.disponivel ? pctFmt(ads.ctrApi) : pendenteAds() },
          { label:'CVR (Mercado Ads)', html: ads && ads.disponivel ? pctFmt(ads.cvrApi) : pendenteAds() },
          { label:'ROAS (Mercado Ads)', value: ads && ads.disponivel && ads.roasApi!==null && ads.roasApi!==undefined ? ads.roasApi : (ads && ads.disponivel ? '—' : 'Ads pendente') },
          { label:'ACOS (Mercado Ads)', html: ads && ads.disponivel ? pctFmt(ads.acosApi) : pendenteAds() },
          { label:'Faturamento atribuído pelo Ads', html: ads && ads.disponivel ? money(ads.faturamentoAtribuido) : pendenteAds() },
        ],
      });
    }

    function render(){
      const root = document.getElementById('margemAnuncioRoot');
      if(!root) return;
      const filtro = window.CerneFiltro.state;

      if(!filtro.loadingEmpresas && !filtro.empresas.length){
        root.innerHTML = '<div class="empty-panel"><div class="empty-icon">'+svg('building')+'</div>'
          + '<h2>Nenhuma empresa ativa</h2><p class="lead">Cadastre e ative uma empresa em <strong>Cadastros → Empresas</strong> para ver Margem por Anúncio aqui.</p></div>';
        return;
      }

      let html = '<div class="field-hint" style="margin-bottom:12px;max-width:980px;">FATURAMENTO − tarifas/comissões − frete do vendedor − imposto − custo dos produtos = <strong>MARGEM DE CONTRIBUIÇÃO</strong>. MARGEM DE CONTRIBUIÇÃO − Ads = <strong>RESULTADO APÓS ADS</strong>. Mesma fórmula usada em Pedidos, Financeiro e Relatórios — nunca uma conta nova. Quando falta o custo de algum SKU em <strong>Produtos</strong>, a margem daquele anúncio aparece marcada como incompleta. A coluna <strong>"Ads (atribuído pelo Mercado Ads)"</strong> mostra cliques/impressões/CTR/ROAS calculados pelo próprio Mercado Ads — é informativo, separado do <strong>resultado real</strong> (que usa só vendas reais). Quando um anúncio ainda não tem Ads sincronizado, aparece <strong>"Ads pendente"</strong> e a margem antes do Ads continua calculada normalmente.</div>';

      if(state.data && !state.data.semConta){
        html += '<div class="toolbar"><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">'
          + '<div class="empresa-picker" style="margin-bottom:0;"><select id="maLojaSelect"><option value="">Todas as lojas</option>'
            + state.data.lojas.map(l=>'<option value="'+l.id+'" '+(String(l.id)===String(state.contaId)?'selected':'')+'>'+escapeHtml(l.nickname||('Conta '+l.id))+'</option>').join('')
          + '</select></div>'
          + '<input type="text" id="maSkuInput" placeholder="Buscar por SKU…" value="'+escapeHtml(state.sku)+'" style="height:38px;padding:0 12px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface-1);min-width:160px;">'
          + '<div class="empresa-picker" style="margin-bottom:0;"><select id="maSortSelect">'
            + OPCOES_ORDENACAO.map(o=>'<option value="'+o.valor+'" '+(o.valor===state.sort?'selected':'')+'>Ordenar por: '+escapeHtml(o.label)+'</option>').join('')
          + '</select></div>'
        + '</div></div>';

        if(state.data.linhas && state.data.linhas.length){
          html += kpiHeroHTML(state.data.linhas);
          html += '<div class="grid-2" style="margin-bottom:14px;align-items:start;">'
            + '<div class="chart-card"><div class="chart-card-head"><div class="panel-title"><span class="panel-title-ic">'+svg('wallet')+'</span>Margem de contribuição por anúncio (top 8)</div></div>'
              + chartMargemHTML(state.data.linhas)
            + '</div>'
            + '<div style="display:flex;flex-direction:column;gap:14px;">'
              + rankingListHTML('Maior resultado após Ads', 'activity', state.data.linhas.filter(l=>l.resultadoAposAds!==null).slice().sort((a,b)=>b.resultadoAposAds-a.resultadoAposAds).slice(0,5), l=>money(l.resultadoAposAds))
              + rankingListHTML('Maior margem %', 'percent', state.data.linhas.filter(l=>!l.margemIncompleta).slice().sort((a,b)=>(b.margemContribuicaoPct||0)-(a.margemContribuicaoPct||0)).slice(0,5), l=>pctFmt(l.margemContribuicaoPct))
            + '</div>'
          + '</div>';
        }
      }

      if(state.loading || filtro.loadingEmpresas){
        html += '<div class="table-card"><div class="table-skel"><span class="spin"></span><span>Carregando Margem por Anúncio…</span></div></div>';
      } else if(state.error){
        html += '<div class="empty-panel"><div class="empty-icon" style="color:var(--danger); background:var(--danger-soft);">'+svg('alertCircle')+'</div>'
          + '<h2 style="color:var(--danger);">Não foi possível carregar</h2><p class="lead">'+escapeHtml(state.error)+'</p></div>';
      } else if(state.data && state.data.semConta){
        html += '<div class="empty-panel"><div class="empty-icon">'+svg('store')+'</div>'
          + '<h2>Nenhuma conta do Mercado Livre conectada</h2><p class="lead">Conecte uma conta do Mercado Livre em <strong>Marketplaces</strong> para ver Margem por Anúncio aqui.</p></div>';
      } else if(state.data && !state.data.linhas.length){
        html += '<div class="empty-panel"><div class="empty-icon">'+svg('wallet')+'</div>'
          + '<h2>Nenhuma venda no período</h2><p class="lead">Não há vendas para os filtros escolhidos.</p></div>';
      } else if(state.data){
        html += tabelaHTML(ordenarLinhas(state.data.linhas, state.sort));
      }

      root.innerHTML = html;

      const selLoja = document.getElementById('maLojaSelect');
      if(selLoja) selLoja.addEventListener('change', ()=>{ state.contaId = selLoja.value; loadDados(); });
      const skuInput = document.getElementById('maSkuInput');
      if(skuInput){
        let debounce = null;
        skuInput.addEventListener('input', ()=>{ clearTimeout(debounce); debounce = setTimeout(()=>{ state.sku = skuInput.value; loadDados(); }, 400); });
      }
      const selSort = document.getElementById('maSortSelect');
      if(selSort) selSort.addEventListener('change', ()=>{ state.sort = selSort.value; render(); });

      root.querySelectorAll('.anuncio-link').forEach(el=>{
        el.addEventListener('click', ()=>{
          const mlItemId = el.dataset.mlItem;
          const l = (state.data.linhas||[]).find(x=>x.mlItemId===mlItemId);
          if(l) abrirDetalhe(l);
        });
      });
    }

    window.MargemAnuncio = { load };
  })();

  /* ================= IA DE PROMOÇÕES — Fase A + Fase B (13/09/2026) =================
     Pedido do usuário: módulo que analisa promoções do Mercado Livre e
     recomenda entrar/sair olhando a MARGEM REAL (nunca só o % de desconto).
     Fase A: 1) o card "Integração Mercado Livre" (leitura vs.
     leitura+escrita, pedido explícito do usuário na seção 0), nunca
     decidido por adivinhação — ver lib/mlPermissoes.js; 2) a configuração
     da margem mínima (seção 3).
     Fase B (pedido explícito do usuário, mesmo dia: "dentro dessa pagina
     quero que mostra todas as promoçoes juntos ao anuncios e a margem de
     cada uma elas, e a cada uma hora a ia tem que busca novas promoções"):
     3) a tabela com toda promoção + anúncio + margem real já calculada
     (lib/promocoesMotor.js) e a classificação da IA (🟢/🟡/🔴/🔵/⚠️); os
     dados vêm sempre de /api/promocoes/analise — já calculados pelo ciclo
     automático que roda a cada 1h no servidor (lib/ia/promocoesScheduler.js,
     nunca depende desta tela estar aberta) — com um botão "Atualizar agora"
     pra forçar uma busca na hora. "Ver detalhes" sempre funciona; Aceitar/
     Remover ficam desabilitados com a mensagem "AÇÃO NÃO DISPONÍVEL" —
     pedido explícito do usuário — enquanto a escrita não estiver liberada
     (ver card de Integração).
     Usa o filtro do topo (window.CerneFiltro) pra empresa, mesmo padrão de
     Margem por Anúncio/Ads/Performance de Anúncios. */
  (function(){
    const state = { statusIntegracao:null, loadingStatus:false, config:null, loadingConfig:false, salvando:false, error:null, analise:null, loadingAnalise:false, atualizandoAgora:false };

    function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function money(v){ return v===null||v===undefined ? '—' : 'R$ ' + Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2}); }
    function pctFmt(v){ return v===null||v===undefined ? '—' : (v<0?'− ':'')+Math.abs(Number(v)).toLocaleString('pt-BR',{minimumFractionDigits:1, maximumFractionDigits:1})+'%'; }
    function fmtDataHora(v){
      if(!v) return '—';
      const d = new Date(v);
      return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
    }
    function thumbHTML(url){
      if(!url) return '<span class="anuncio-thumb-placeholder" title="Sem imagem disponível">'+svg('box')+'</span>';
      return '<span style="position:relative;display:inline-block;width:36px;height:36px;flex-shrink:0;">'
        + '<img class="anuncio-thumb" src="'+escapeHtml(url)+'" alt="" loading="lazy" style="position:absolute;inset:0;" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\';">'
        + '<span class="anuncio-thumb-placeholder" style="display:none;position:absolute;inset:0;">'+svg('box')+'</span>'
      + '</span>';
    }
    const TIPO_PROMOCAO_LABEL = {
      DEAL:'Oferta (Deal)', MARKETPLACE_CAMPAIGN:'Campanha do marketplace', PRICE_DISCOUNT:'Desconto de preço',
      VOLUME:'Desconto por volume', DOD:'Oferta do dia', LIGHTNING:'Oferta relâmpago', PRE_NEGOTIATED:'Pré-negociada',
      SELLER_CAMPAIGN:'Campanha do vendedor', SMART:'Smart', PRICE_MATCHING:'Igualação de preço',
      UNHEALTHY_STOCK:'Estoque parado', SELLER_COUPON_CAMPAIGN:'Cupom do vendedor',
    };
    function tipoPromocaoLabel(t){ return TIPO_PROMOCAO_LABEL[t] || t || '—'; }
    // Mesma classificação/emoji de lib/promocoesMotor.js#classificar — só
    // repetida aqui pra exibição (o backend já manda o código e o rótulo
    // prontos; o emoji é só cosmético, nunca decide nada sozinho no front).
    const CLASSIFICACAO_COR = {
      entrar:'var(--success)', manter:'var(--success)', oportunidade:'var(--copper)',
      nao_recomendado:'var(--danger)', sair:'var(--danger)',
      risco_margem:'var(--warning)', dados_insuficientes:'var(--warning)',
    };
    const CLASSIFICACAO_EMOJI = {
      entrar:'🟢', manter:'🟡', oportunidade:'🔵', nao_recomendado:'🔴', sair:'🔴',
      risco_margem:'⚠️', dados_insuficientes:'⚠️',
    };
    function badgeClassificacaoHTML(l){
      const cor = CLASSIFICACAO_COR[l.classificacaoCodigo] || 'var(--text-faint)';
      const emoji = CLASSIFICACAO_EMOJI[l.classificacaoCodigo] || '';
      return '<span style="display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:12.5px;color:'+cor+';" title="'+escapeHtml(l.motivoIncompleto||'')+'">'
        + emoji+' '+escapeHtml(l.classificacaoLabel||'—')
      + '</span>';
    }
    function toast(message, type){
      const wrap = document.getElementById('toastWrap');
      const el = document.createElement('div');
      el.className = 'toast ' + (type||'success');
      el.innerHTML = svg(type==='error' ? 'alertCircle':'checkCircle') + '<span>'+escapeHtml(message)+'</span>';
      wrap.appendChild(el);
      setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .25s'; setTimeout(()=>el.remove(),250); }, 4200);
    }

    async function apiGet(url){
      const res = await fetch(url);
      let body = null; try{ body = await res.json(); }catch(e){}
      if(!res.ok) throw new Error((body && (body.error||(body.errors&&JSON.stringify(body.errors)))) || 'Falha na requisição.');
      return body;
    }
    async function apiStatusIntegracao(empresaId){ return apiGet('/api/promocoes/status-integracao?empresaId='+empresaId); }
    async function apiConfig(empresaId){ return apiGet('/api/promocoes/config?empresaId='+empresaId); }
    async function apiSalvarConfig(dados){
      const res = await fetch('/api/promocoes/config', { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(dados) });
      let body = null; try{ body = await res.json(); }catch(e){}
      if(!res.ok) throw new Error((body && (body.error||(body.errors&&JSON.stringify(body.errors)))) || 'Falha ao salvar configuração.');
      return body;
    }
    async function apiAnalise(empresaId){ return apiGet('/api/promocoes/analise?empresaId='+empresaId); }
    async function apiAnalisarAgora(empresaId){
      const res = await fetch('/api/promocoes/analisar', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ empresaId }) });
      let body = null; try{ body = await res.json(); }catch(e){}
      if(!res.ok) throw new Error((body && body.error) || 'Falha ao buscar promoções agora.');
      return body;
    }

    async function load(){
      const filtro = window.CerneFiltro.state;
      if(!filtro.empresaId){ state.statusIntegracao=null; state.config=null; state.analise=null; state.loadingStatus=false; state.loadingConfig=false; state.loadingAnalise=false; render(); return; }
      state.loadingStatus = true; state.loadingConfig = true; state.loadingAnalise = true; state.error = null; render();
      try{
        const [statusIntegracao, config, analise] = await Promise.all([
          apiStatusIntegracao(filtro.empresaId),
          apiConfig(filtro.empresaId),
          apiAnalise(filtro.empresaId),
        ]);
        state.statusIntegracao = statusIntegracao;
        state.config = config;
        state.analise = analise;
      }catch(err){ state.error = err.message || 'Não foi possível carregar a IA de Promoções.'; }
      state.loadingStatus = false; state.loadingConfig = false; state.loadingAnalise = false; render();
    }

    window.CerneFiltro.onChange(()=>{
      const page = document.getElementById('page-promocoesIa');
      if(page && page.classList.contains('active')) load();
      else render();
    });

    // ---- card "Integração Mercado Livre" (seção 0 do pedido do usuário) ----
    function cardIntegracaoHTML(){
      const r = state.statusIntegracao && state.statusIntegracao.resumo;
      const ok = !!(r && r.escritaDisponivel);
      return '<div class="table-card" style="padding:20px;margin-bottom:14px;">'
        + '<div class="panel-title" style="margin-bottom:14px;"><span class="panel-title-ic">'+svg('link')+'</span>Integração Mercado Livre</div>'
        + '<div style="display:flex;flex-wrap:wrap;gap:24px;margin-bottom:10px;">'
          + '<div><div class="field-hint" style="margin:0 0 4px;">Status</div><div style="font-weight:600;">'+(ok?'🟢 Leitura e escrita disponíveis':'🟢 Leitura disponível')+'</div></div>'
          + '<div><div class="field-hint" style="margin:0 0 4px;">Alteração de promoções</div><div style="font-weight:600;">'+(ok?'🟢 Escrita disponível':'🔴 Escrita não disponível')+'</div></div>'
        + '</div>'
        + '<div class="field-hint">'+escapeHtml((r && r.mensagem) || 'Seu aplicativo Mercado Livre possui atualmente acesso de leitura. A IA pode analisar e recomendar promoções, mas não pode alterá-las automaticamente.')+'</div>'
      + '</div>';
    }

    // ---- configuração (seção 3/10 do pedido do usuário) ----
    function cardConfigHTML(){
      const c = state.config || {};
      const modos = [
        { v:'somente_analisar', label:'Somente analisar / recomendar' },
        { v:'sugerir_aprovar', label:'Sugerir e aguardar aprovação' },
        { v:'automatico', label:'Automático' },
      ];
      const permiteEscrita = !!(state.statusIntegracao && state.statusIntegracao.resumo && state.statusIntegracao.resumo.escritaDisponivel);
      return '<div class="table-card" style="padding:20px;margin-bottom:14px;">'
        + '<div class="panel-title" style="margin-bottom:14px;"><span class="panel-title-ic">'+svg('percent')+'</span>Configuração da IA de Promoções</div>'
        + '<div class="inline-form" style="margin-top:0;align-items:flex-end;">'
          + '<div class="field narrow"><label>Margem mínima permitida em promoção (%)</label><input type="number" id="promoMargemMinima" min="0" max="100" step="0.1" value="'+(c.margemMinimaPct!==undefined?c.margemMinimaPct:14)+'"></div>'
          + '<div class="field narrow"><label>Margem de conforto p/ promoção com desconto (pontos %)</label><input type="number" id="promoMargemConforto" min="0" max="100" step="0.1" value="'+(c.margemConfortoPct!==undefined?c.margemConfortoPct:0)+'"></div>'
          + '<button class="ghost-btn" id="promoSalvarConfig" type="button" style="cursor:pointer;opacity:1;">'+svg('check')+'<span>Salvar</span></button>'
        + '</div>'
        + '<div class="field-hint" style="margin-top:6px;">Quando uma promoção deixar a margem estimada abaixo deste número, a IA vai marcar como <strong>🔴 NÃO RECOMENDADA</strong>.</div>'
        + '<div class="field-hint" style="margin-top:4px;">Margem de conforto (15/09/2026): pontos percentuais exigidos ACIMA da margem mínima, mas só pra promoções que têm desconto de verdade (preço abaixo do normal). Uma promoção no preço normal (sem desconto, margem igual à sua margem normal) continua exigindo só a margem mínima. Deixe em 0 para desligar — a IA volta a exigir só a margem mínima em qualquer caso.</div>'
        + '<div style="margin-top:18px;">'
          + '<div class="field-hint" style="margin:0 0 8px;">Modo da IA</div>'
          + modos.map(m => {
              const disabled = m.v !== 'somente_analisar' && !permiteEscrita;
              return '<label style="display:flex;align-items:center;gap:8px;margin-bottom:6px;'+(disabled?'opacity:.5;':'cursor:pointer;')+'" title="'+(disabled?'É necessário habilitar permissão de escrita na integração Mercado Livre.':'')+'">'
                + '<input type="radio" name="promoModoIa" value="'+m.v+'" '+(c.modoIa===m.v?'checked':'')+' '+(disabled?'disabled':'')+'>'
                + '<span>'+escapeHtml(m.label)+'</span>'
              + '</label>';
            }).join('')

      + '</div>';
    }

    // ---- tabela: todas as promoções junto com o anúncio e a margem real
    // de cada uma (pedido explícito do usuário, 13/09/2026) — lê sempre de
    // /api/promocoes/analise (já calculado pelo ciclo automático de hora em
    // hora, lib/ia/promocoesCiclo.js; nunca recalcula ao vivo aqui). ----
    function anuncioCellHTML(l){
      return '<td class="produto-cell"><a href="javascript:void(0)" class="promo-anuncio-link" data-ml-item="'+escapeHtml(l.mlItemId||'')+'" style="text-decoration:none;color:inherit;"><div class="anuncio-cell-flex">'
        + thumbHTML(l.imagemUrl)
        + '<div class="cell-stack">'
          + '<span class="prod-title" title="'+escapeHtml(l.titulo||'—')+'" style="text-decoration:underline dotted;">'+escapeHtml(l.titulo||'(sem título)')+'</span>'
          + '<span class="cell-stack-sub mono">'+escapeHtml(l.sku||'sem SKU')+'</span>'
        + '</div></div></a></td>';
    }

    function cardResumoAnaliseHTML(){
      const a = state.analise;
      const total = a ? a.totalItens : 0;
      return '<div class="table-card" style="padding:16px 20px;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;">'
        + '<div>'
          + '<div style="font-weight:600;">'+total+' item(ns) de promoção monitorado(s)</div>'
          + '<div class="field-hint" style="margin-top:2px;">Atualizado automaticamente a cada 1 hora'+(a && a.ultimaAtualizacaoEm ? (' · última busca: '+fmtDataHora(a.ultimaAtualizacaoEm)) : '')+'.</div>'
        + '</div>'
        + '<button class="ghost-btn" id="promoAtualizarAgora" type="button" style="cursor:pointer;opacity:1;" '+(state.atualizandoAgora?'disabled':'')+'>'
          + (state.atualizandoAgora ? '<span class="spin" style="width:13px;height:13px;"></span>' : svg('activity'))
          + '<span>'+(state.atualizandoAgora?'Buscando…':'Atualizar agora')+'</span>'
        + '</button>'
      + '</div>';
    }

    function tabelaPromocoesHTML(linhas){
      return '<div class="table-card"><div class="table-wrap"><table class="data-table"><thead><tr>'
        + '<th>Anúncio / SKU</th><th>Loja</th><th>Promoção</th><th>Status</th><th>Preço normal</th><th>Preço promo.</th>'
        + '<th>Desconto</th><th>Margem real</th><th>Classificação</th><th></th>'
        + '</tr></thead><tbody>'
        + linhas.map(l => '<tr>'
          + anuncioCellHTML(l)
          + '<td>'+escapeHtml(l.loja||'—')+'</td>'
          + '<td>'+escapeHtml(tipoPromocaoLabel(l.promotionType))+(l.promotionLabel?('<div class="cell-stack-sub" style="color:var(--text-faint);">'+escapeHtml(l.promotionLabel)+'</div>'):'')+'</td>'
          + '<td>'+(l.statusItemMl==='candidate' ? 'Candidata' : escapeHtml(l.statusItemMl||'—'))+'</td>'
          + '<td class="mono">'+money(l.precoNormal)+'</td>'
          + '<td class="mono">'+money(l.precoPromo)+'</td>'
          + '<td class="mono">'+pctFmt(l.descontoPct)+'</td>'
          + '<td class="mono" style="'+(l.margemRealPct!==null?(l.margemRealPct>=0?'color:var(--success);':'color:var(--danger);'):'')+'">'+(l.margemIncompleta?'<span style="color:var(--text-faint);font-style:italic;" title="'+escapeHtml(l.motivoIncompleto||'')+'">dados insuficientes</span>':pctFmt(l.margemRealPct))+'</td>'
          + '<td>'+badgeClassificacaoHTML(l)+'</td>'
          + '<td style="white-space:nowrap;">'
            + '<button class="row-ic-btn promo-ver-detalhes" data-ml-item="'+escapeHtml(l.mlItemId||'')+'" type="button" title="Ver detalhes">'+svg('activity')+'</button>'
            + ' <button class="row-ic-btn" type="button" disabled title="AÇÃO NÃO DISPONÍVEL: esta ação exige permissão de escrita na API do Mercado Livre. Atualmente sua aplicação possui apenas permissão de leitura." style="opacity:.4;cursor:not-allowed;">'+svg('checkCircle')+'</button>'
            + ' <button class="row-ic-btn" type="button" disabled title="AÇÃO NÃO DISPONÍVEL: esta ação exige permissão de escrita na API do Mercado Livre. Atualmente sua aplicação possui apenas permissão de leitura." style="opacity:.4;cursor:not-allowed;">'+svg('x')+'</button>'
          + '</td>'
        + '</tr>').join('')
        + '</tbody></table></div></div>';
    }

    function abrirDetalhePromocao(l){
      window.AnuncioDetalheModal.abrir({
        titulo: l.titulo, sku: l.sku, loja: l.loja, mlItemId: l.mlItemId, imagemUrl: l.imagemUrl, origem: 'promocoesIa',
        campos: [
          { label:'Promoção', value: tipoPromocaoLabel(l.promotionType) + (l.promotionLabel ? (' — '+l.promotionLabel) : '') },
          { label:'Status na promoção', value: l.statusItemMl==='candidate' ? 'Candidata (ainda não aplicada)' : (l.statusItemMl||'—') },
          { label:'Preço normal', html: money(l.precoNormal) },
          { label:'Preço promocional', html: money(l.precoPromo) },
          { label:'Desconto total', html: pctFmt(l.descontoPct) },
          { label:'Desconto bancado pelo Mercado Livre', html: l.descontoBancadoMeliPct===null?'<span style="color:var(--text-faint);font-style:italic;">Mercado Livre não informou a divisão para este tipo de promoção</span>':pctFmt(l.descontoBancadoMeliPct) },
          { label:'Desconto bancado pelo vendedor', html: pctFmt(l.descontoBancadoVendedorPct) },
          { label:'— Cálculo da margem real —', html: '<hr style="border:none;border-top:1px solid var(--border-strong);margin:2px 0;">' },
          { label:'Custo do produto', html: l.custoProduto===null?'<span style="color:var(--text-faint);font-style:italic;">não cadastrado</span>':money(l.custoProduto) },
          { label:'Tarifas/comissão (estimada pelo histórico)', html: l.tarifasEstimadas===null?'—':money(l.tarifasEstimadas) },
          { label:'Frete do vendedor (estimado pelo histórico)', html: l.freteVendedorEstimado===null?'—':money(l.freteVendedorEstimado) },
          { label:'Imposto (estimado)', html: l.impostoEstimado===null?'—':money(l.impostoEstimado) },
          { label:'Margem real (R$)', html: l.margemReal===null?'—':money(l.margemReal) },
          { label:'Margem real (%)', html: l.margemRealPct===null?'—':pctFmt(l.margemRealPct) },
          { label:'Margem mínima configurada', html: pctFmt(l.margemMinimaPctUsada) },
          { label:'Margem de conforto exigida (tem desconto? '+(l.temDesconto?'sim':'não')+')', html: (l.margemConfortoPctUsada && l.temDesconto) ? (pctFmt(l.margemConfortoPctUsada) + ' — mínimo exigido nesta promoção: ' + pctFmt(Number(l.margemMinimaPctUsada||0) + Number(l.margemConfortoPctUsada||0))) : '<span style="color:var(--text-faint);">não se aplica</span>' },
          { label:'Classificação da IA', html: badgeClassificacaoHTML(l) },
          { label:'Por que este dado pode estar incompleto', html: l.motivoIncompleto ? escapeHtml(l.motivoIncompleto) : '<span style="color:var(--text-faint);">Nenhum dado faltando.</span>' },
          { label:'Última atualização', value: fmtDataHora(l.atualizadoEm) },
        ],
      });
    }

    function render(){
      const root = document.getElementById('promocoesIaRoot');
      if(!root) return;
      const filtro = window.CerneFiltro.state;

      if(!filtro.loadingEmpresas && !filtro.empresas.length){
        root.innerHTML = '<div class="empty-panel"><div class="empty-icon">'+svg('building')+'</div>'
          + '<h2>Nenhuma empresa ativa</h2>'
          + '<p class="lead">Cadastre e ative uma empresa em <strong>Cadastros → Empresas</strong> antes de usar a IA de Promoções.</p></div>';
        return;
      }
      if(!filtro.empresaId){ root.innerHTML = '<div class="empty-panel"><div class="empty-icon">'+svg('sparkle')+'</div><h2>Selecione uma empresa</h2></div>'; return; }

      if((state.loadingStatus || state.loadingConfig) && !state.statusIntegracao){
        root.innerHTML = '<div class="table-card"><div class="table-skel"><span class="spin"></span><span>Carregando IA de Promoções…</span></div></div>';
        return;
      }
      if(state.error){
        root.innerHTML = '<div class="empty-panel"><div class="empty-icon" style="color:var(--danger); background:var(--danger-soft);">'+svg('alertCircle')+'</div>'
          + '<h2 style="color:var(--danger);">Não foi possível carregar</h2><p class="lead">'+escapeHtml(state.error)+'</p>'
          + '<button class="ghost-btn" id="promoRetry" style="cursor:pointer; opacity:1;">'+svg('activity')+'<span>Tentar novamente</span></button></div>';
        root.querySelector('#promoRetry').addEventListener('click', load);
        return;
      }

      let html = cardIntegracaoHTML() + cardConfigHTML() + cardResumoAnaliseHTML();

      if(state.loadingAnalise && !state.analise){
        html += '<div class="table-card"><div class="table-skel"><span class="spin"></span><span>Buscando promoções…</span></div></div>';
      } else if(state.analise && !state.analise.linhas.length){
        html += '<div class="empty-panel"><div class="empty-icon">'+svg('sparkle')+'</div>'
          + '<h2>Nenhuma promoção encontrada ainda</h2>'
          + '<p class="lead">A busca automática roda a cada 1 hora. Você também pode clicar em <strong>Atualizar agora</strong> para forçar uma busca neste instante.</p></div>';
      } else if(state.analise){
        html += tabelaPromocoesHTML(state.analise.linhas);
      }

      root.innerHTML = html;

      const btnAtualizarAgora = document.getElementById('promoAtualizarAgora');
      if(btnAtualizarAgora) btnAtualizarAgora.addEventListener('click', async ()=>{
        state.atualizandoAgora = true; render();
        try{
          await apiAnalisarAgora(filtro.empresaId);
          state.analise = await apiAnalise(filtro.empresaId);
          toast('Promoções atualizadas.');
        }catch(err){ toast(err.message || 'Não foi possível buscar promoções agora.', 'error'); }
        state.atualizandoAgora = false; render();
      });

      root.querySelectorAll('.promo-anuncio-link, .promo-ver-detalhes').forEach(el=>{
        el.addEventListener('click', ()=>{
          const mlItemId = el.dataset.mlItem;
          const l = (state.analise && state.analise.linhas || []).find(x=>x.mlItemId===mlItemId);
          if(l) abrirDetalhePromocao(l);
        });
      });

      const btnSalvar = document.getElementById('promoSalvarConfig');
      if(btnSalvar) btnSalvar.addEventListener('click', async ()=>{
        const margemMinimaPct = Number(document.getElementById('promoMargemMinima').value);
        const margemConfortoPct = Number(document.getElementById('promoMargemConforto').value);
        if(!Number.isFinite(margemMinimaPct) || margemMinimaPct < 0 || margemMinimaPct > 100){
          toast('Informe uma margem mínima entre 0 e 100.', 'error'); return;
        }
        if(!Number.isFinite(margemConfortoPct) || margemConfortoPct < 0 || margemConfortoPct > 100){
          toast('Informe uma margem de conforto entre 0 e 100.', 'error'); return;
        }
        btnSalvar.disabled = true;

    function criarModuloAgenteDecisoes(cfg){
      const state = { agente:null, aba:'pendentes', itens:[], loading:false, error:null, editandoId:null, gerando:false };

      async function apiAgente(){
        const res = await fetch('/api/ia-agentes');

  /* ================= AGENTES DE SAC — Mercado Livre / Shopee (14/09/2026) =================
