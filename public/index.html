      el.innerHTML = svg(type==='error' ? 'alertCircle':'checkCircle') + '<span>'+message+'</span>';
      wrap.appendChild(el);
      setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .25s'; setTimeout(()=>el.remove(),250); }, 3200);

    function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function money(v){ return 'R$ ' + Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2}); }
    function fmtDate(iso){ try{ return new Date(iso).toLocaleDateString('pt-BR'); }catch(e){ return '—'; } }

    async function apiEmpresasAtivas(){
      const res = await fetch('/api/empresas?status=ativas');
      return ((await res.json()).empresas) || [];
    }
    async function api(path, opts){
      const res = await fetch('/api/produtos'+path, { headers:{'Content-Type':'application/json'}, ...opts });
      let body = null; try{ body = await res.json(); }catch(e){}
      if(!res.ok){ const err = new Error((body&&body.error)||'Falha na requisição.'); err.errors = body&&body.errors; throw err; }
      return body;
    }
    async function apiConfig(path, opts){
      const res = await fetch('/api/config-financeiro'+path, { headers:{'Content-Type':'application/json'}, ...opts });
      let body = null; try{ body = await res.json(); }catch(e){}
      if(!res.ok){ const err = new Error((body&&body.error)||'Falha na requisição.'); err.errors = body&&body.errors; throw err; }
      return body;
    }

    async function loadItens(){
      state.loading = true; state.error = null; render();
      try{
        const params = new URLSearchParams({ empresaId: state.empresaId });
        if(state.status !== 'todos') params.set('status', state.status);
        if(state.search.trim()) params.set('search', state.search.trim());
        const data = await api('?'+params.toString(), { method:'GET' });
        state.items = data.produtos;
      }catch(err){ state.error = err.message || 'Não foi possível carregar os produtos.'; }
      finally{ state.loading = false; render(); }
    }

    async function loadAliquota(){
      state.loadingAliquota = true; render();
      try{
        const data = await apiConfig('/'+state.empresaId, { method:'GET' });
        state.aliquota = data.aliquotaImposto;
      }catch(err){ toast(err.message, 'error'); }
      finally{ state.loadingAliquota = false; render(); }
    }

    async function load(){
      state.loadingEmpresas = true; render();
      try{
        state.empresas = await apiEmpresasAtivas();
        if(!state.empresaId || !state.empresas.find(e=>e.id===state.empresaId)){
          state.empresaId = state.empresas.length ? state.empresas[0].id : null;
        }
      }catch(e){ state.empresas = []; }
      state.loadingEmpresas = false;
      if(state.empresaId) await Promise.all([loadItens(), loadAliquota()]); else render();

      + '</select></div>';

      html += '<div class="section-label"><span>Imposto configurado</span></div>'
        + '<div class="inline-form">'
          + '<div class="field narrow"><label>Alíquota de imposto (%)</label><input type="text" inputmode="decimal" id="prdAliquota" value="'+(state.loadingAliquota?'':state.aliquota)+'"></div>'
          + '<button class="btn-primary" id="prdSaveAliquota" type="button">'+svg('check')+'<span>Salvar</span></button>'
          + '<div class="field-hint" style="margin:0;">Percentual aplicado sobre o valor de cada venda, para todos os produtos desta empresa. Não vem do Mercado Livre — é uma configuração do ERP.</div>'
        + '</div>';

      html += '<div class="section-label"><span>Produtos cadastrados</span></div>'
        + '<div class="toolbar">'
          + '<div class="seg" id="prdSeg">'
            + [['todos','Todos'],['ativos','Ativos'],['inativos','Inativos']].map(function(par){ return '<button data-status="'+par[0]+'" class="'+(state.status===par[0]?'active':'')+'">'+par[1]+'</button>'; }).join('')
          + '</div>'
          + '<div class="search-box">'+svg('search')+'<input type="text" id="prdSearch" placeholder="Buscar por nome ou SKU" value="'+state.search.replace(/"/g,'&quot;')+'"></div>'
        + '</div>';

      if(state.loading){
        html += '<div class="table-card"><div class="table-skel"><span class="spin"></span><span>Carregando produtos…</span></div></div>';
      } else if(state.error){
        html += '<div class="empty-panel"><div class="empty-icon" style="color:var(--danger); background:var(--danger-soft);">'+svg('alertCircle')+'</div>'
          + '<h2 style="color:var(--danger);">Não foi possível carregar</h2><p class="lead">'+escapeHtml(state.error)+'</p>'
          + '<button class="ghost-btn" id="prdRetry" style="cursor:pointer; opacity:1;">'+svg('activity')+'<span>Tentar novamente</span></button></div>';
      } else if(!state.items.length){
        const filtrado = !!(state.search || state.status!=='todos');
        html += '<div class="empty-panel"><div class="empty-icon">'+svg('box')+'</div>'
          + '<h2>Nenhum produto encontrado</h2>'
          + '<p class="lead">'+(filtrado ? 'Nenhum produto corresponde ao filtro atual.' : 'Cadastre o primeiro produto (nome, SKU e custo) para começar o catálogo desta empresa.')+'</p>'
          + (filtrado ? '' : '<button class="primary-btn enabled" id="prdEmptyNew" type="button">'+svg('plus')+'<span>Cadastrar produto</span></button>')
        + '</div>';
      } else {
        html += '<div class="table-card"><div class="table-wrap"><table class="data-table"><thead><tr>'
          + '<th>Produto</th><th>SKU</th><th>Custo</th><th>Status</th><th>Cadastrado em</th><th></th>'
          + '</tr></thead><tbody>'
          + state.items.map(p => '<tr class="'+(p.ativo?'':'inactive')+'">'
            + '<td>'+escapeHtml(p.nome)+'</td>'
            + '<td class="mono">'+escapeHtml(p.sku)+'</td>'
            + '<td class="mono">'+money(p.custo)+'</td>'
            + '<td>'+(p.ativo ? '<span class="badge-status on"><span class="dot"></span>Ativo</span>' : '<span class="badge-status off"><span class="dot"></span>Inativo</span>')+'</td>'
            + '<td class="tab-nums">'+fmtDate(p.criadoEm)+'</td>'
            + '<td><div class="row-actions">'
              + '<button class="row-ic-btn" data-edit="'+p.id+'" title="Editar" type="button">'+svg('edit')+'</button>'
              + '<button class="row-ic-btn '+(p.ativo?'danger':'success')+'" data-toggle="'+p.id+'" data-next="'+(!p.ativo)+'" title="'+(p.ativo?'Desativar':'Ativar')+'" type="button">'+svg('power')+'</button>'
            + '</div></td>'
          + '</tr>').join('')
          + '</tbody></table></div></div>';
      }

      root.innerHTML = html;

      const sel = document.getElementById('prdEmpresaSelect');
      if(sel) sel.addEventListener('change', ()=>{ state.empresaId = Number(sel.value); loadItens(); loadAliquota(); });
      const saveAliquota = document.getElementById('prdSaveAliquota');
      if(saveAliquota) saveAliquota.addEventListener('click', async ()=>{
        const val = Number(String(document.getElementById('prdAliquota').value).replace(',','.'));
        if(!Number.isFinite(val) || val<0 || val>100){ toast('Informe um percentual entre 0 e 100.', 'error'); return; }
        saveAliquota.disabled = true;
        try{
          await apiConfig('/'+state.empresaId, { method:'PUT', body: JSON.stringify({ aliquotaImposto: val }) });
          state.aliquota = val;
          toast('Alíquota de imposto salva.');
        }catch(err){ toast(err.message, 'error'); }
        saveAliquota.disabled = false;
      });
      const seg = document.getElementById('prdSeg');
      if(seg) seg.querySelectorAll('button').forEach(b=> b.addEventListener('click', ()=>{ state.status = b.dataset.status; loadItens(); }));
      const search = document.getElementById('prdSearch');
      if(search) search.addEventListener('input', ()=>{
        state.search = search.value;
        clearTimeout(search._t);
        search._t = setTimeout(loadItens, 300);

      const retry = document.getElementById('prdRetry');
      if(retry) retry.addEventListener('click', loadItens);
      const emptyNew = document.getElementById('prdEmptyNew');
      if(emptyNew) emptyNew.addEventListener('click', ()=> openModal());
      root.querySelectorAll('[data-edit]').forEach(b=> b.addEventListener('click', ()=>{

      root.querySelectorAll('[data-toggle]').forEach(b=> b.addEventListener('click', async ()=>{

          await api('/'+id+'/status', { method:'PATCH', body: JSON.stringify({ ativo: next }) });
          toast(next ? 'Produto ativado.' : 'Produto desativado.');
          loadItens();
        }catch(err){ toast(err.message, 'error'); b.disabled = false; }
      }));
    }

    function openModal(produto){
      const isEdit = !!produto;
      const modalRoot = document.getElementById('modalRoot');
      modalRoot.innerHTML = '<div class="modal-overlay" id="modalOverlay">'
        + '<div class="modal-card">'
          + '<div class="modal-head"><div class="modal-title">'+(isEdit?'Editar produto':'Novo produto')+'</div>'
            + '<button class="row-ic-btn" id="modalClose" type="button">'+svg('x')+'</button></div>'
          + '<div class="modal-sub">'+(isEdit?'Atualize os dados do produto.':'Preencha os dados para cadastrar um novo produto no catálogo desta empresa.')+'</div>'
          + '<form id="prdForm">'
            + '<div class="field"><label>Nome do produto</label><input type="text" id="fNome" placeholder="Ex: Caixa de papelão 50x24x15" value="'+(isEdit?escapeHtml(produto.nome):'')+'" maxlength="200">'
              + '<div class="field-error" id="eNome" style="display:none;"></div></div>'
            + '<div class="field"><label>SKU</label><input type="text" id="fSku" placeholder="Ex: CX-50X24X15" value="'+(isEdit?escapeHtml(produto.sku):'')+'" maxlength="100">'
              + '<div class="field-error" id="eSku" style="display:none;"></div></div>'
            + '<div class="field"><label>Custo (R$)</label><input type="text" inputmode="decimal" id="fCusto" placeholder="0,00" value="'+(isEdit?String(produto.custo).replace('.',','):'')+'">'
              + '<div class="field-error" id="eCusto" style="display:none;"></div></div>'
            + (isEdit ? '<div class="toggle-row"><div><div class="toggle-row-label">Produto ativo</div><div class="toggle-row-sub">Produtos inativos ficam ocultos nas seleções do sistema.</div></div>'
              + '<button type="button" class="toggle '+(produto.ativo?'on':'')+'" id="fAtivo" data-on="'+(produto.ativo?'true':'false')+'"></button></div>' : '')
            + '<div class="modal-actions">'
              + '<button type="button" class="btn-secondary" id="modalCancel">Cancelar</button>'
              + '<button type="submit" class="btn-primary" id="modalSave">'+svg('check')+'<span>'+(isEdit?'Salvar alterações':'Cadastrar produto')+'</span></button>'
            + '</div>'
          + '</form>'
        + '</div>'
      + '</div>';

      const overlay = document.getElementById('modalOverlay');
      const close = ()=> modalRoot.innerHTML = '';
      overlay.addEventListener('click', (e)=>{ if(e.target === overlay) close(); });
      document.getElementById('modalClose').addEventListener('click', close);
      document.getElementById('modalCancel').addEventListener('click', close);
      document.getElementById('fNome').focus();

      const toggleBtn = document.getElementById('fAtivo');
      if(toggleBtn) toggleBtn.addEventListener('click', ()=>{
        const on = toggleBtn.dataset.on !== 'true';
        toggleBtn.dataset.on = String(on);
        toggleBtn.classList.toggle('on', on);
      });

      document.getElementById('prdForm').addEventListener('submit', async (e)=>{
        e.preventDefault();
        ['eNome','eSku','eCusto'].forEach(id=>{ const el=document.getElementById(id); el.style.display='none'; el.textContent=''; });
        ['fNome','fSku','fCusto'].forEach(id=> document.getElementById(id).classList.remove('invalid'));

        const payload = {
          empresaId: state.empresaId,
          nome: document.getElementById('fNome').value,
          sku: document.getElementById('fSku').value,
          custo: Number(String(document.getElementById('fCusto').value).replace(',','.')),
        };
        if(isEdit && toggleBtn) payload.ativo = toggleBtn.dataset.on === 'true';

        const saveBtn = document.getElementById('modalSave');
        saveBtn.disabled = true;
        try{
          if(isEdit) await api('/'+produto.id, { method:'PUT', body: JSON.stringify(payload) });
          else await api('', { method:'POST', body: JSON.stringify(payload) });
          close();
          toast(isEdit ? 'Produto atualizado.' : 'Produto cadastrado.');
          loadItens();
        }catch(err){
          saveBtn.disabled = false;
          if(err.errors){
            const fieldMap = { nome:'Nome', sku:'Sku', custo:'Custo' };
            Object.entries(err.errors).forEach(([k,msg])=>{
              const suf = fieldMap[k]; if(!suf) return;
              const el=document.getElementById('e'+suf); if(el){ el.textContent=msg; el.style.display='block'; }
              const input=document.getElementById('f'+suf); if(input) input.classList.add('invalid');
            });
          } else {
            toast(err.message, 'error');
          }
        }
      });
    }

    document.getElementById('btnNewProduto').addEventListener('click', ()=> openModal());

    window.Produtos = { load };
  })();

  /* ================= FORNECEDORES — cadastro por empresa =================

  (function(){
    const state = { empresas:[], empresaId:null, loadingEmpresas:false, items:[], loading:false, error:null, status:'todos', search:'' };

    function toast(message, type){
      const wrap = document.getElementById('toastWrap');
      const el = document.createElement('div');
      el.className = 'toast ' + (type||'success');
      el.innerHTML = svg(type==='error' ? 'alertCircle':'checkCircle') + '<span>'+message+'</span>';
      wrap.appendChild(el);
      setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .25s'; setTimeout(()=>el.remove(),250); }, 3200);
    }
    function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function fmtDate(iso){ try{ return new Date(iso).toLocaleDateString('pt-BR'); }catch(e){ return '—'; } }

    function maskDocumento(v){
      const d = v.replace(/\D/g,'').slice(0,14);
      if(d.length <= 11){
        let out = d;
        if(d.length > 9) out = d.replace(/(\d{3})(\d{3})(\d{3})(\d{0,2})/, '$1.$2.$3-$4');
        else if(d.length > 6) out = d.replace(/(\d{3})(\d{3})(\d{0,3})/, '$1.$2.$3');
        else if(d.length > 3) out = d.replace(/(\d{3})(\d{0,3})/, '$1.$2');
        return out;
      }
      return d.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{0,2})/, '$1.$2.$3/$4-$5');
    }

    async function apiEmpresasAtivas(){
      const res = await fetch('/api/empresas?status=ativas');
      return ((await res.json()).empresas) || [];
    }
    async function api(path, opts){
      const res = await fetch('/api/fornecedores'+path, { headers:{'Content-Type':'application/json'}, ...opts });
      let body = null; try{ body = await res.json(); }catch(e){}
      if(!res.ok){ const err = new Error((body&&body.error)||'Falha na requisição.'); err.errors = body&&body.errors; throw err; }
      return body;
    }

        if(state.search.trim()) params.set('search', state.search.trim());
        const data = await api('?'+params.toString(), { method:'GET' });
        state.items = data.fornecedores;
      }catch(err){ state.error = err.message || 'Não foi possível carregar os fornecedores.'; }
      finally{ state.loading = false; render(); }
    }

    async function load(){
      state.loadingEmpresas = true; render();
      try{
        state.empresas = await apiEmpresasAtivas();
        if(!state.empresaId || !state.empresas.find(e=>e.id===state.empresaId)){
          state.empresaId = state.empresas.length ? state.empresas[0].id : null;
        }
      }catch(e){ state.empresas = []; }
      state.loadingEmpresas = false;
      if(state.empresaId) await loadItens(); else render();
    }

    function render(){
      const root = document.getElementById('fornecedoresRoot');
      if(!root) return;

      if(!state.loadingEmpresas && !state.empresas.length){
        root.innerHTML = '<div class="empty-panel"><div class="empty-icon">'+svg('building')+'</div>'
          + '<h2>Nenhuma empresa ativa</h2>'
          + '<p class="lead">Cadastre e ative uma empresa em <strong>Cadastros → Empresas</strong> antes de cadastrar fornecedores.</p></div>';
        return;
      }

      let html = '<div class="toolbar">'
        + '<div class="empresa-picker" style="margin-bottom:0;"><select id="forEmpresaSelect">'
          + state.empresas.map(e=>'<option value="'+e.id+'" '+(e.id===state.empresaId?'selected':'')+'>'+escapeHtml(e.nomeFantasia||e.razaoSocial)+'</option>').join('')
        + '</select></div>'
        + '<div class="seg" id="forSeg">'
          + [['todos','Todos'],['ativos','Ativos'],['inativos','Inativos']].map(function(par){ return '<button data-status="'+par[0]+'" class="'+(state.status===par[0]?'active':'')+'">'+par[1]+'</button>'; }).join('')
        + '</div>'
        + '<div class="search-box">'+svg('search')+'<input type="text" id="forSearch" placeholder="Buscar por razão social, fantasia ou CNPJ/CPF" value="'+state.search.replace(/"/g,'&quot;')+'"></div>'
      + '</div>';

      if(state.loading){
        html += '<div class="table-card"><div class="table-skel"><span class="spin"></span><span>Carregando fornecedores…</span></div></div>';
      } else if(state.error){
        html += '<div class="empty-panel"><div class="empty-icon" style="color:var(--danger); background:var(--danger-soft);">'+svg('alertCircle')+'</div>'
          + '<h2 style="color:var(--danger);">Não foi possível carregar</h2><p class="lead">'+escapeHtml(state.error)+'</p>'
          + '<button class="ghost-btn" id="forRetry" style="cursor:pointer; opacity:1;">'+svg('activity')+'<span>Tentar novamente</span></button></div>';
      } else if(!state.items.length){
        const filtrado = !!(state.search || state.status!=='todos');
        html += '<div class="empty-panel"><div class="empty-icon">'+svg('truck')+'</div>'
          + '<h2>Nenhum fornecedor encontrado</h2>'
          + '<p class="lead">'+(filtrado ? 'Nenhum fornecedor corresponde ao filtro atual.' : 'Cadastre o primeiro fornecedor (razão social e CNPJ/CPF) desta empresa.')+'</p>'
          + (filtrado ? '' : '<button class="primary-btn enabled" id="forEmptyNew" type="button">'+svg('plus')+'<span>Cadastrar fornecedor</span></button>')
        + '</div>';
      } else {
        html += '<div class="table-card"><div class="table-wrap"><table class="data-table"><thead><tr>'
          + '<th>Fornecedor</th><th>CNPJ/CPF</th><th>Telefone</th><th>E-mail</th><th>Status</th><th></th>'
          + '</tr></thead><tbody>'
          + state.items.map(f => '<tr class="'+(f.ativo?'':'inactive')+'">'
            + '<td><div class="company-name">'+escapeHtml(f.razaoSocial)+'</div>'+(f.nomeFantasia?'<div class="company-fantasy">'+escapeHtml(f.nomeFantasia)+'</div>':'')+'</td>'
            + '<td class="mono">'+escapeHtml(f.documentoFormatado)+'</td>'
            + '<td class="mono">'+escapeHtml(f.telefone||'—')+'</td>'
            + '<td class="mono">'+escapeHtml(f.email||'—')+'</td>'
            + '<td>'+(f.ativo ? '<span class="badge-status on"><span class="dot"></span>Ativo</span>' : '<span class="badge-status off"><span class="dot"></span>Inativo</span>')+'</td>'
            + '<td><div class="row-actions">'
              + '<button class="row-ic-btn" data-edit="'+f.id+'" title="Editar" type="button">'+svg('edit')+'</button>'
              + '<button class="row-ic-btn '+(f.ativo?'danger':'success')+'" data-toggle="'+f.id+'" data-next="'+(!f.ativo)+'" title="'+(f.ativo?'Desativar':'Ativar')+'" type="button">'+svg('power')+'</button>'
            + '</div></td>'
          + '</tr>').join('')
          + '</tbody></table></div></div>';
      }

      root.innerHTML = html;

      const sel = document.getElementById('forEmpresaSelect');
      if(sel) sel.addEventListener('change', ()=>{ state.empresaId = Number(sel.value); loadItens(); });
      const seg = document.getElementById('forSeg');
      if(seg) seg.querySelectorAll('button').forEach(b=> b.addEventListener('click', ()=>{ state.status = b.dataset.status; loadItens(); }));
      const search = document.getElementById('forSearch');
      if(search) search.addEventListener('input', ()=>{
        state.search = search.value;
        clearTimeout(search._t);
        search._t = setTimeout(loadItens, 300);
      });
      const retry = document.getElementById('forRetry');
      if(retry) retry.addEventListener('click', loadItens);
      const emptyNew = document.getElementById('forEmptyNew');
      if(emptyNew) emptyNew.addEventListener('click', ()=> openModal());
      root.querySelectorAll('[data-edit]').forEach(b=> b.addEventListener('click', ()=>{
        const f = state.items.find(x=> String(x.id)===b.dataset.edit);
        openModal(f);
      }));
      root.querySelectorAll('[data-toggle]').forEach(b=> b.addEventListener('click', async ()=>{
        const id = b.dataset.toggle, next = b.dataset.next === 'true';
        b.disabled = true;
        try{
          await api('/'+id+'/status', { method:'PATCH', body: JSON.stringify({ ativo: next }) });
          toast(next ? 'Fornecedor ativado.' : 'Fornecedor desativado.');
          loadItens();
        }catch(err){ toast(err.message, 'error'); b.disabled = false; }
      }));
    }

    function openModal(fornecedor){
      const isEdit = !!fornecedor;
      const modalRoot = document.getElementById('modalRoot');
      modalRoot.innerHTML = '<div class="modal-overlay" id="modalOverlay">'
        + '<div class="modal-card">'
          + '<div class="modal-head"><div class="modal-title">'+(isEdit?'Editar fornecedor':'Novo fornecedor')+'</div>'
            + '<button class="row-ic-btn" id="modalClose" type="button">'+svg('x')+'</button></div>'
          + '<div class="modal-sub">'+(isEdit?'Atualize os dados do fornecedor.':'Preencha os dados para cadastrar um novo fornecedor desta empresa.')+'</div>'
          + '<form id="forForm">'
            + '<div class="field"><label>Razão social / Nome</label><input type="text" id="fRazao" placeholder="Razão social ou nome completo" value="'+(isEdit?escapeHtml(fornecedor.razaoSocial):'')+'" maxlength="200">'
              + '<div class="field-error" id="eRazao" style="display:none;"></div></div>'
            + '<div class="field"><label>Nome fantasia <span class="opt">(opcional)</span></label><input type="text" id="fFantasia" placeholder="Nome usado no dia a dia" value="'+(isEdit?escapeHtml(fornecedor.nomeFantasia||''):'')+'" maxlength="200"></div>'
            + '<div class="field"><label>CNPJ ou CPF</label><input type="text" inputmode="numeric" id="fDocumento" placeholder="00.000.000/0000-00 ou 000.000.000-00" value="'+(isEdit?maskDocumento(fornecedor.documento):'')+'" maxlength="18">'
              + '<div class="field-error" id="eDocumento" style="display:none;"></div></div>'
            + '<div class="field"><label>Telefone <span class="opt">(opcional)</span></label><input type="text" id="fTelefone" placeholder="(00) 00000-0000" value="'+(isEdit?escapeHtml(fornecedor.telefone||''):'')+'" maxlength="20"></div>'
            + '<div class="field"><label>E-mail <span class="opt">(opcional)</span></label><input type="text" id="fEmail" placeholder="contato@fornecedor.com" value="'+(isEdit?escapeHtml(fornecedor.email||''):'')+'" maxlength="255">'
              + '<div class="field-error" id="eEmail" style="display:none;"></div></div>'
            + '<div class="field"><label>Observação <span class="opt">(opcional)</span></label><input type="text" id="fObservacao" placeholder="Condições, contato, observações gerais" value="'+(isEdit?escapeHtml(fornecedor.observacao||''):'')+'"></div>'
            + (isEdit ? '<div class="toggle-row"><div><div class="toggle-row-label">Fornecedor ativo</div><div class="toggle-row-sub">Fornecedores inativos ficam ocultos nas seleções do sistema.</div></div>'
              + '<button type="button" class="toggle '+(fornecedor.ativo?'on':'')+'" id="fAtivo" data-on="'+(fornecedor.ativo?'true':'false')+'"></button></div>' : '')
            + '<div class="modal-actions">'
              + '<button type="button" class="btn-secondary" id="modalCancel">Cancelar</button>'
              + '<button type="submit" class="btn-primary" id="modalSave">'+svg('check')+'<span>'+(isEdit?'Salvar alterações':'Cadastrar fornecedor')+'</span></button>'
            + '</div>'
          + '</form>'
        + '</div>'
      + '</div>';

      const overlay = document.getElementById('modalOverlay');
      const close = ()=> modalRoot.innerHTML = '';
      overlay.addEventListener('click', (e)=>{ if(e.target === overlay) close(); });
      document.getElementById('modalClose').addEventListener('click', close);
      document.getElementById('modalCancel').addEventListener('click', close);

      const docInput = document.getElementById('fDocumento');
      docInput.addEventListener('input', ()=>{ docInput.value = maskDocumento(docInput.value); });
      document.getElementById('fRazao').focus();

      const toggleBtn = document.getElementById('fAtivo');
      if(toggleBtn) toggleBtn.addEventListener('click', ()=>{
        const on = toggleBtn.dataset.on !== 'true';
        toggleBtn.dataset.on = String(on);
        toggleBtn.classList.toggle('on', on);
      });

      document.getElementById('forForm').addEventListener('submit', async (e)=>{
        e.preventDefault();
        ['eRazao','eDocumento','eEmail'].forEach(id=>{ const el=document.getElementById(id); el.style.display='none'; el.textContent=''; });
        ['fRazao','fDocumento','fEmail'].forEach(id=> document.getElementById(id).classList.remove('invalid'));

        const payload = {
          empresaId: state.empresaId,
          razaoSocial: document.getElementById('fRazao').value,
          nomeFantasia: document.getElementById('fFantasia').value,
          documento: document.getElementById('fDocumento').value,
          telefone: document.getElementById('fTelefone').value,
          email: document.getElementById('fEmail').value,
          observacao: document.getElementById('fObservacao').value,
        };
        if(isEdit && toggleBtn) payload.ativo = toggleBtn.dataset.on === 'true';

        const saveBtn = document.getElementById('modalSave');
        saveBtn.disabled = true;
        try{
          if(isEdit) await api('/'+fornecedor.id, { method:'PUT', body: JSON.stringify(payload) });
          else await api('', { method:'POST', body: JSON.stringify(payload) });
          close();
          toast(isEdit ? 'Fornecedor atualizado.' : 'Fornecedor cadastrado.');
          loadItens();
        }catch(err){
          saveBtn.disabled = false;
          if(err.errors){
            const fieldMap = { razaoSocial:'Razao', documento:'Documento', email:'Email' };
            Object.entries(err.errors).forEach(([k,msg])=>{
              const suf = fieldMap[k]; if(!suf) return;
              const el=document.getElementById('e'+suf); if(el){ el.textContent=msg; el.style.display='block'; }
              const input=document.getElementById('f'+suf); if(input) input.classList.add('invalid');
            });
          } else {
            toast(err.message, 'error');
          }
        }
      });
    }

    document.getElementById('btnNewFornecedor').addEventListener('click', ()=> openModal());

    window.Fornecedores = { load };
  })();

  /* ================= ANÚNCIOS — visualização ao vivo (Mercado Livre) =================
     Mostra os anúncios reais das contas do Mercado Livre conectadas: ID,
     título, SKU, loja, preço, estoque disponível, status e tipo. Nada é
     inventado — se a conta não estiver conectada, ou a API do Mercado Livre
     falhar, a tela mostra exatamente isso (nunca uma lista vazia sem
     explicação, nunca um anúncio fictício). Edição de preço/estoque não faz
     parte desta etapa (pedido explícito do usuário). */
  (function(){
    const state = { empresas:[], empresaId:null, loadingEmpresas:false, loading:false, data:null, error:null };

    function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function money(v){ return v===null||v===undefined ? '—' : 'R$ ' + Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2}); }

    async function apiEmpresasAtivas(){
      const res = await fetch('/api/empresas?status=ativas');
      return ((await res.json()).empresas) || [];
    }
    async function apiAnuncios(empresaId){
      const res = await fetch('/api/anuncios?empresaId='+empresaId);
      let body = null; try{ body = await res.json(); }catch(e){}
      if(!res.ok) throw new Error((body && body.error) || 'Não foi possível carregar os anúncios.');
      return body;
    }

    async function loadAnuncios(){
      state.loading = true; state.error = null; render();
      try{ state.data = await apiAnuncios(state.empresaId); }
      catch(err){ state.error = err.message; state.data = null; }
      state.loading = false; render();
    }

    async function load(){
      state.loadingEmpresas = true; render();
      try{
        state.empresas = await apiEmpresasAtivas();
        if(!state.empresaId || !state.empresas.find(e=>e.id===state.empresaId)){
          state.empresaId = state.empresas.length ? state.empresas[0].id : null;
        }
      }catch(e){ state.empresas = []; }
      state.loadingEmpresas = false;
      if(state.empresaId) await loadAnuncios(); else render();
    }

    function statusBadge(status){
      if(status === 'active') return '<span class="badge-status on"><span class="dot"></span>Ativo</span>';
      if(status === 'paused') return '<span class="badge-status warn"><span class="dot"></span>Pausado</span>';
      if(status === 'closed') return '<span class="badge-status off"><span class="dot"></span>Encerrado</span>';
      return status ? ('<span class="badge-status off"><span class="dot"></span>'+escapeHtml(status)+'</span>') : '—';
    }

    function tipoAnuncioLabel(tipo){
      const map = { gold_special:'Clássico', gold_pro:'Premium', free:'Grátis' };
      if(!tipo) return '—';
      return map[tipo] || tipo;
    }

    function render(){
      const root = document.getElementById('anunciosRoot');
      if(!root) return;

      if(!state.loadingEmpresas && !state.empresas.length){
        root.innerHTML = '<div class="empty-panel"><div class="empty-icon">'+svg('building')+'</div>'
          + '<h2>Nenhuma empresa ativa</h2>'
          + '<p class="lead">Cadastre e ative uma empresa, e conecte o Mercado Livre em <strong>Marketplaces</strong>, para ver os anúncios aqui.</p></div>';
        return;
      }

      let html = '<div class="empresa-picker"><label>Empresa</label><select id="adsEmpresaSelect">'
        + state.empresas.map(e=>'<option value="'+e.id+'" '+(e.id===state.empresaId?'selected':'')+'>'+escapeHtml(e.nomeFantasia||e.razaoSocial)+'</option>').join('')
      + '</select></div>';

      if(state.loading){
        html += '<div class="table-card"><div class="table-skel"><span class="spin"></span><span>Buscando anúncios no Mercado Livre…</span></div></div>';
      } else if(state.error){
        html += '<div class="empty-panel"><div class="empty-icon" style="color:var(--danger); background:var(--danger-soft);">'+svg('alertCircle')+'</div>'
          + '<h2 style="color:var(--danger);">Não foi possível carregar</h2><p class="lead">'+escapeHtml(state.error)+'</p></div>';
      } else if(state.data && state.data.pendente){
        html += '<div class="empty-panel"><div class="empty-icon" style="color:var(--warning); background:var(--warning-soft);">'+svg('clock')+'</div>'
          + '<h2>Sincronização pendente</h2>'
          + '<p class="lead">'+escapeHtml(state.data.mensagem||'Ainda não é possível mostrar os anúncios desta empresa.')+'</p></div>';
      } else if(state.data && !state.data.itens.length){
        html += '<div class="empty-panel"><div class="empty-icon">'+svg('tag')+'</div>'
          + '<h2>Nenhum anúncio encontrado</h2>'
          + '<p class="lead">A conta '+escapeHtml((state.data.conta&&state.data.conta.nickname)||'')+' não tem nenhum anúncio publicado no Mercado Livre no momento.</p></div>';
      } else if(state.data){
        const itens = state.data.itens;
        html += '<div class="table-card"><div class="table-wrap"><table class="data-table"><thead><tr>'
          + '<th>ID</th><th>Título</th><th>SKU</th><th>Loja</th><th>Preço</th><th>Estoque</th><th>Status</th><th>Tipo</th>'
          + '</tr></thead><tbody>'
          + itens.map(a => '<tr>'
            + '<td class="mono">'+escapeHtml(a.id)+'</td>'
            + '<td>'+escapeHtml(a.titulo||'—')+'</td>'
            + '<td class="mono">'+escapeHtml(a.sku||'—')+'</td>'
            + '<td>'+escapeHtml(a.loja||'—')+'</td>'
            + '<td class="mono">'+money(a.preco)+'</td>'
            + '<td class="tab-nums">'+(a.estoqueDisponivel===null||a.estoqueDisponivel===undefined?'—':a.estoqueDisponivel)+'</td>'
            + '<td>'+statusBadge(a.status)+'</td>'
            + '<td>'+escapeHtml(tipoAnuncioLabel(a.tipoAnuncio))+'</td>'
          + '</tr>').join('')
          + '</tbody></table></div></div>'
          + (state.data.total > itens.length ? '<div class="field-hint" style="margin-top:10px;">Mostrando '+itens.length+' de '+state.data.total+' anúncio(s) — carregar mais ainda não foi implementado nesta etapa.</div>' : '');
      }

      root.innerHTML = html;

      const sel = document.getElementById('adsEmpresaSelect');
      if(sel) sel.addEventListener('change', ()=>{ state.empresaId = Number(sel.value); loadAnuncios(); });
    }

    document.getElementById('btnRefreshAnuncios').addEventListener('click', ()=>{ if(state.empresaId) loadAnuncios(); });

    window.Anuncios = { load };
  })();

  /* ================= ESTOQUE / ESTOQUE FULL — espelho somente leitura do
     Mercado Livre (26/08/2026) =================
     O Mercado Livre é a fonte oficial das quantidades (pedido explícito do
     usuário): ele faz todos os lançamentos e ajustes de estoque direto lá,
     então a quantidade aqui é SEMPRE somente leitura — sem botão de ajuste,
     sem modal, sem PUT. Cada tela lê o espelho gravado por
     server/lib/mlEstoque.js (server/routes/estoque.js e
     server/routes/estoqueFull.js), sincronizado automaticamente a cada 1
     minuto pelo mesmo ciclo de server/lib/syncScheduler.js — "Sincronizar
     agora" é só a opção de emergência, igual ao botão manual de pedidos.
     Uma linha por anúncio/variação (nunca agrupado por produto base) — as
     duas telas usam o MESMO código (criarTelaEstoqueSomenteLeitura), só
     mudam o endpoint/rótulos, pra nunca deixar as duas divergirem sem
     querer. Estoque e Estoque Full nunca somam nem misturam saldo: são
     duas telas/abas completamente separadas, cada uma no seu próprio
     endpoint (tipo='proprio' vs tipo='full' no banco). */
  function criarTelaEstoqueSomenteLeitura(opts){
    const state = { empresas:[], empresaId:null, loadingEmpresas:false, loading:false, sincronizando:false, data:null, error:null };

    function toast(message, type){
      const wrap = document.getElementById('toastWrap');
      const el = document.createElement('div');
      el.className = 'toast ' + (type||'success');
      el.innerHTML = svg(type==='error' ? 'alertCircle':'checkCircle') + '<span>'+message+'</span>';
      wrap.appendChild(el);
      setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .25s'; setTimeout(()=>el.remove(),250); }, 3200);
    }
    function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function pendenteSpan(){ return '<span style="color:var(--text-faint); font-style:italic; font-family:\'Public Sans\',sans-serif; font-weight:500;">Pendente</span>'; }
    function num(v){ return v === null || v === undefined ? pendenteSpan() : Number(v).toLocaleString('pt-BR'); }
    function fmtDateTime(iso){ if(!iso) return null; try{ return new Date(iso).toLocaleString('pt-BR'); }catch(e){ return null; } }
    function statusBadge(status){
      if(status === 'active') return '<span class="badge-status on"><span class="dot"></span>Ativo</span>';
      if(status === 'paused') return '<span class="badge-status warn"><span class="dot"></span>Pausado</span>';
      if(status === 'closed') return '<span class="badge-status off"><span class="dot"></span>Encerrado</span>';
      return status ? ('<span class="badge-status off"><span class="dot"></span>'+escapeHtml(status)+'</span>') : '—';
    }

    async function apiEmpresasAtivas(){
      const res = await fetch('/api/empresas?status=ativas');
      return ((await res.json()).empresas) || [];
    }
    async function apiGet(){
      const res = await fetch(opts.apiPath+'?empresaId='+encodeURIComponent(state.empresaId));
      const body = await res.json().catch(()=>null);
      if(!res.ok) throw new Error((body&&body.error)||'Falha ao carregar o estoque.');
      return body;
    }
    async function apiSincronizar(){
      const res = await fetch('/api/estoque/sincronizar', {
        method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ empresaId: state.empresaId }),
      });
      const body = await res.json().catch(()=>null);
      if(!res.ok) throw new Error((body&&body.error)||'Falha ao sincronizar.');
      return body;
    }

    async function loadDados(){
      state.loading = true; state.error = null; render();
      try{ state.data = await apiGet(); }
      catch(err){ state.error = err.message || 'Não foi possível carregar o estoque.'; state.data = null; }
      finally{ state.loading = false; render(); }
    }

    async function load(){
      state.loadingEmpresas = true; render();
      try{
        state.empresas = await apiEmpresasAtivas();
        if(!state.empresaId || !state.empresas.find(e=>e.id===state.empresaId)){
          state.empresaId = state.empresas.length ? state.empresas[0].id : null;
        }
      }catch(e){ state.empresas = []; }
      state.loadingEmpresas = false;
      if(state.empresaId) await loadDados(); else render();
    }

    async function sincronizarAgora(){
      if(!state.empresaId || state.sincronizando) return;
      state.sincronizando = true; render();
      try{
        const resultado = await apiSincronizar();
        if(resultado.ok) toast('Estoque sincronizado com o Mercado Livre.');
        else toast(resultado.contasComErro.length+' conta(s) falharam ao sincronizar — veja os logs.', 'error');
        await loadDados();
      }catch(err){ toast(err.message || 'Não foi possível sincronizar agora.', 'error'); }
      finally{ state.sincronizando = false; render(); }
    }

    function bannerHTML(){
      const d = state.data;
      if(!d || !d.pendente || !d.motivo) return '';
      return '<div class="empty-panel" style="padding:14px 16px; margin-bottom:14px; text-align:left; display:flex; align-items:center; gap:12px;">'
        + '<div class="empty-icon" style="color:var(--warning); background:var(--warning-soft); width:34px; height:34px; margin:0;">'+svg('clock')+'</div>'
        + '<div><strong>'+(d.motivo==='sem_conta' ? 'Nenhuma conta conectada.' : d.motivo==='conta_com_erro' ? 'Conta desconectada.' : 'Aguardando sincronização.')+'</strong> '
          + '<span style="color:var(--text-faint);">'+escapeHtml(d.mensagem||'')+'</span></div>'
      + '</div>';
    }

    function ultimaSincronizacaoHTML(){
      const d = state.data;
      if(!d || !d.ultimaSincronizacaoGeral) return '';
      return '<div class="field-hint" style="margin:0 0 14px;">Última sincronização (item mais recente): '+escapeHtml(fmtDateTime(d.ultimaSincronizacaoGeral))+'.</div>';
    }

    function render(){
      const root = document.getElementById(opts.rootId);
      if(!root) return;

      const btnSync = document.getElementById(opts.syncButtonId);
      if(btnSync){ btnSync.disabled = state.sincronizando || !state.empresaId; btnSync.querySelector('span').textContent = state.sincronizando ? 'Sincronizando…' : 'Sincronizar agora'; }

      if(!state.loadingEmpresas && !state.empresas.length){
        root.innerHTML = '<div class="empty-panel"><div class="empty-icon">'+svg('building')+'</div>'
          + '<h2>Nenhuma empresa ativa</h2>'
          + '<p class="lead">Cadastre e ative uma empresa em <strong>Cadastros → Empresas</strong> antes de ver o estoque.</p></div>';
        return;
      }

      let html = '<div class="toolbar">'
        + '<div class="empresa-picker" style="margin-bottom:0;"><select id="'+opts.selectId+'">'
          + state.empresas.map(e=>'<option value="'+e.id+'" '+(e.id===state.empresaId?'selected':'')+'>'+escapeHtml(e.nomeFantasia||e.razaoSocial)+'</option>').join('')
        + '</select></div>'
      + '</div>';

      if(state.loading){
        html += '<div class="table-card"><div class="table-skel"><span class="spin"></span><span>Carregando estoque…</span></div></div>';
      } else if(state.error){
        html += '<div class="empty-panel"><div class="empty-icon" style="color:var(--danger); background:var(--danger-soft);">'+svg('alertCircle')+'</div>'
          + '<h2 style="color:var(--danger);">Não foi possível carregar</h2><p class="lead">'+escapeHtml(state.error)+'</p>'
          + '<button class="ghost-btn" id="'+opts.retryId+'" style="cursor:pointer; opacity:1;">'+svg('activity')+'<span>Tentar novamente</span></button></div>';
      } else if(state.data){
        html += bannerHTML() + ultimaSincronizacaoHTML();

        const itens = state.data.itens || [];
        if(!itens.length){
          html += '<div class="empty-panel"><div class="empty-icon">'+svg('layers')+'</div>'
            + '<h2>'+opts.tituloVazio+'</h2>'
            + '<p class="lead">'+opts.mensagemVazia+'</p></div>';
        } else {
          html += '<div class="table-card"><div class="table-wrap"><table class="data-table"><thead><tr>'
            + '<th>Produto / Anúncio</th><th>SKU</th><th>Loja</th><th>ID do anúncio</th>'
            + '<th>Estoque disponível</th><th>Status</th><th>Última sincronização</th>'
            + '</tr></thead><tbody>'
            + itens.map(it => {
              return '<tr>'
                + '<td>'+escapeHtml(it.produto || '—')+'</td>'
                + '<td class="mono">'+(it.sku ? escapeHtml(it.sku) : '<span style="color:var(--text-faint);">sem SKU</span>')+'</td>'
                + '<td>'+escapeHtml(it.loja || '—')+'</td>'
                + '<td class="mono">'+escapeHtml(it.mlItemId || '—')+(it.mlVariationId ? ' <span style="color:var(--text-faint);">('+escapeHtml(String(it.mlVariationId))+')</span>' : '')+'</td>'
                + '<td class="tab-nums">'+(it.pendente ? pendenteSpan() : num(it.estoqueDisponivel))+'</td>'
                + '<td>'+statusBadge(it.status)+'</td>'
                + '<td>'+(fmtDateTime(it.ultimaSincronizacao) ? escapeHtml(fmtDateTime(it.ultimaSincronizacao)) : '—')+'</td>'
              + '</tr>';
            }).join('')
            + '</tbody></table></div></div>';
        }
      }

      root.innerHTML = html;

      const sel = document.getElementById(opts.selectId);
      if(sel) sel.addEventListener('change', ()=>{ state.empresaId = Number(sel.value); loadDados(); });
      const retry = document.getElementById(opts.retryId);
      if(retry) retry.addEventListener('click', loadDados);
    }

    const btnSync = document.getElementById(opts.syncButtonId);
    if(btnSync) btnSync.addEventListener('click', sincronizarAgora);

    return { load };
  }

  window.Estoque = criarTelaEstoqueSomenteLeitura({
    apiPath: '/api/estoque',
    rootId: 'estoqueRoot',
    selectId: 'stkEmpresaSelect',
    retryId: 'stkRetry',
    syncButtonId: 'btnSincronizarEstoque',
    tituloVazio: 'Nenhum item sincronizado ainda',
    mensagemVazia: 'Assim que a sincronização automática rodar (ou ao clicar em "Sincronizar agora"), os anúncios com estoque fora do Full aparecem aqui.',
  });

  window.EstoqueFull = criarTelaEstoqueSomenteLeitura({
    apiPath: '/api/estoque-full',
    rootId: 'estoqueFullRoot',
    selectId: 'stkFullEmpresaSelect',
    retryId: 'stkFullRetry',
    syncButtonId: 'btnSincronizarEstoqueFull',
    tituloVazio: 'Nenhum item Full sincronizado ainda',
    mensagemVazia: 'Assim que a sincronização automática rodar (ou ao clicar em "Sincronizar agora"), os anúncios com logística Full aparecem aqui.',
  });

  /* ================= COMPRAS — primeira versão simples =================
     Criar, listar, editar, pesquisar e mudar status de pedidos de compra a
     um fornecedor. Sem IA de compras e sem automatizar entrada de estoque
     ao marcar "Recebido" nesta etapa (pedido explícito do usuário). */
  (function(){
    const STATUS_OPCOES = [
      ['em_aberto','Em aberto'],
      ['pedido_realizado','Pedido realizado'],
      ['recebido','Recebido'],
      ['cancelado','Cancelado'],
    ];
    const STATUS_LABEL = Object.fromEntries(STATUS_OPCOES);
    const state = { empresas:[], empresaId:null, loadingEmpresas:false, items:[], loading:false, error:null, status:'todos', search:'' };

    function toast(message, type){
      const wrap = document.getElementById('toastWrap');
      const el = document.createElement('div');
      el.className = 'toast ' + (type||'success');
      el.innerHTML = svg(type==='error' ? 'alertCircle':'checkCircle') + '<span>'+message+'</span>';
      wrap.appendChild(el);
      setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .25s'; setTimeout(()=>el.remove(),250); }, 3200);
    }
    function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function money(v){ return 'R$ ' + Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2}); }
    function fmtDate(iso){ if(!iso) return '—'; try{ const [y,m,d] = String(iso).slice(0,10).split('-'); return d+'/'+m+'/'+y; }catch(e){ return '—'; } }

    async function apiEmpresasAtivas(){
      const res = await fetch('/api/empresas?status=ativas');
      return ((await res.json()).empresas) || [];
    }
    async function api(path, opts){
      const res = await fetch('/api/compras'+path, { headers:{'Content-Type':'application/json'}, ...opts });
      let body = null; try{ body = await res.json(); }catch(e){}
      if(!res.ok){ const err = new Error((body&&body.error)||'Falha na requisição.'); err.errors = body&&body.errors; throw err; }
      return body;
    }
    async function apiFornecedoresAtivos(empresaId){
      const res = await fetch('/api/fornecedores?empresaId='+empresaId+'&status=ativos');
      return ((await res.json()).fornecedores) || [];
    }
    async function apiProdutosAtivos(empresaId){
      const res = await fetch('/api/produtos?empresaId='+empresaId+'&status=ativos');
      return ((await res.json()).produtos) || [];
    }

    async function loadItens(){
      state.loading = true; state.error = null; render();
      try{
        const params = new URLSearchParams({ empresaId: state.empresaId });
        if(state.status !== 'todos') params.set('status', state.status);
        if(state.search.trim()) params.set('search', state.search.trim());
        const data = await api('?'+params.toString(), { method:'GET' });
        state.items = data.compras;
      }catch(err){ state.error = err.message || 'Não foi possível carregar as compras.'; }
      finally{ state.loading = false; render(); }
    }

    async function load(){
      state.loadingEmpresas = true; render();
      try{
        state.empresas = await apiEmpresasAtivas();
        if(!state.empresaId || !state.empresas.find(e=>e.id===state.empresaId)){
          state.empresaId = state.empresas.length ? state.empresas[0].id : null;
        }
      }catch(e){ state.empresas = []; }
      state.loadingEmpresas = false;
      if(state.empresaId) await loadItens(); else render();
    }

    function render(){
      const root = document.getElementById('comprasRoot');
      if(!root) return;

      if(!state.loadingEmpresas && !state.empresas.length){
        root.innerHTML = '<div class="empty-panel"><div class="empty-icon">'+svg('building')+'</div>'
          + '<h2>Nenhuma empresa ativa</h2>'
          + '<p class="lead">Cadastre e ative uma empresa em <strong>Cadastros → Empresas</strong> antes de registrar compras.</p></div>';
        return;
      }

      let html = '<div class="toolbar">'
        + '<div class="empresa-picker" style="margin-bottom:0;"><select id="cmpEmpresaSelect">'
          + state.empresas.map(e=>'<option value="'+e.id+'" '+(e.id===state.empresaId?'selected':'')+'>'+escapeHtml(e.nomeFantasia||e.razaoSocial)+'</option>').join('')
        + '</select></div>'
        + '<div class="seg" id="cmpSeg">'
          + [['todos','Todos']].concat(STATUS_OPCOES).map(function(par){ return '<button data-status="'+par[0]+'" class="'+(state.status===par[0]?'active':'')+'">'+par[1]+'</button>'; }).join('')
        + '</div>'
        + '<div class="search-box">'+svg('search')+'<input type="text" id="cmpSearch" placeholder="Buscar por fornecedor" value="'+state.search.replace(/"/g,'&quot;')+'"></div>'
      + '</div>';

      if(state.loading){
        html += '<div class="table-card"><div class="table-skel"><span class="spin"></span><span>Carregando compras…</span></div></div>';
      } else if(state.error){
        html += '<div class="empty-panel"><div class="empty-icon" style="color:var(--danger); background:var(--danger-soft);">'+svg('alertCircle')+'</div>'
          + '<h2 style="color:var(--danger);">Não foi possível carregar</h2><p class="lead">'+escapeHtml(state.error)+'</p>'
          + '<button class="ghost-btn" id="cmpRetry" style="cursor:pointer; opacity:1;">'+svg('activity')+'<span>Tentar novamente</span></button></div>';
      } else if(!state.items.length){
        const filtrado = !!(state.search || state.status!=='todos');
        html += '<div class="empty-panel"><div class="empty-icon">'+svg('cart')+'</div>'
          + '<h2>Nenhuma compra encontrada</h2>'
          + '<p class="lead">'+(filtrado ? 'Nenhuma compra corresponde ao filtro atual.' : 'Crie o primeiro pedido de compra desta empresa.')+'</p>'
          + (filtrado ? '' : '<button class="primary-btn enabled" id="cmpEmptyNew" type="button">'+svg('plus')+'<span>Nova compra</span></button>')
        + '</div>';
      } else {
        html += '<div class="table-card"><div class="table-wrap"><table class="data-table"><thead><tr>'
          + '<th>Data</th><th>Fornecedor</th><th>Itens</th><th>Valor total</th><th>Previsão de chegada</th><th>Status</th><th></th>'
          + '</tr></thead><tbody>'
          + state.items.map(c => '<tr>'
            + '<td class="tab-nums">'+fmtDate(c.dataCompra)+'</td>'
            + '<td>'+escapeHtml(c.fornecedorNome||'—')+'</td>'
            + '<td class="tab-nums">'+(c.qtdItens!==undefined?c.qtdItens:'—')+'</td>'
            + '<td class="mono">'+money(c.valorTotal)+'</td>'
            + '<td class="tab-nums">'+fmtDate(c.previsaoChegada)+'</td>'
            + '<td><select class="mono" data-status-select="'+c.id+'" style="font-size:11.5px; padding:4px 8px; border-radius:8px; border:1px solid var(--border); background:var(--surface-2); color:var(--text);">'
              + STATUS_OPCOES.map(function(par){ return '<option value="'+par[0]+'" '+(c.status===par[0]?'selected':'')+'>'+par[1]+'</option>'; }).join('')
            + '</select></td>'
            + '<td><div class="row-actions">'
              + '<button class="row-ic-btn" data-edit="'+c.id+'" title="Editar" type="button">'+svg('edit')+'</button>'
            + '</div></td>'
          + '</tr>').join('')
          + '</tbody></table></div></div>';
      }

      root.innerHTML = html;

      const sel = document.getElementById('cmpEmpresaSelect');
      if(sel) sel.addEventListener('change', ()=>{ state.empresaId = Number(sel.value); loadItens(); });
      const seg = document.getElementById('cmpSeg');
      if(seg) seg.querySelectorAll('button').forEach(b=> b.addEventListener('click', ()=>{ state.status = b.dataset.status; loadItens(); }));
      const search = document.getElementById('cmpSearch');
      if(search) search.addEventListener('input', ()=>{
        state.search = search.value;
        clearTimeout(search._t);
        search._t = setTimeout(loadItens, 300);
      });
      const retry = document.getElementById('cmpRetry');
      if(retry) retry.addEventListener('click', loadItens);
      const emptyNew = document.getElementById('cmpEmptyNew');
      if(emptyNew) emptyNew.addEventListener('click', ()=> openModal());
      root.querySelectorAll('[data-edit]').forEach(b=> b.addEventListener('click', async ()=>{
        try{
          const data = await api('/'+b.dataset.edit, { method:'GET' });
          openModal(data.compra);
        }catch(err){ toast(err.message, 'error'); }
      }));
      root.querySelectorAll('[data-status-select]').forEach(sel=> sel.addEventListener('change', async ()=>{
        const id = sel.dataset.statusSelect;
        sel.disabled = true;
        try{
          await api('/'+id+'/status', { method:'PATCH', body: JSON.stringify({ status: sel.value }) });
          toast('Status da compra atualizado.');
          loadItens();
        }catch(err){ toast(err.message, 'error'); sel.disabled = false; }
      }));
    }

    function openModal(compra){
      const isEdit = !!compra;
      let itens = isEdit && compra.itens && compra.itens.length
        ? compra.itens.map(function(it){ return { produtoId:it.produtoId, quantidade:it.quantidade, custoUnitario:it.custoUnitario, nome:it.produtoNome, sku:it.produtoSku }; })
        : [{ produtoId:null, quantidade:1, custoUnitario:0 }];
      let rowSeq = 0;
      itens.forEach(function(it){ it._rowId = 'r'+(rowSeq++); });

      const modalRoot = document.getElementById('modalRoot');
      modalRoot.innerHTML = '<div class="modal-overlay" id="modalOverlay">'
        + '<div class="modal-card" style="max-width:640px;">'
          + '<div class="modal-head"><div class="modal-title">'+(isEdit?'Editar compra':'Nova compra')+'</div>'
            + '<button class="row-ic-btn" id="modalClose" type="button">'+svg('x')+'</button></div>'
          + '<div class="modal-sub">'+(isEdit?'Atualize os dados do pedido de compra.':'Preencha os dados para registrar um novo pedido de compra.')+'</div>'
          + '<form id="cmpForm">'
            + '<div class="field"><label>Fornecedor</label><select id="fFornecedor"><option value="">Carregando…</option></select>'
              + '<div class="field-error" id="eFornecedor" style="display:none;"></div></div>'
            + '<div class="inline-form" style="margin-top:0;">'
              + '<div class="field narrow"><label>Data da compra</label><input type="date" id="fData" value="'+(isEdit&&compra.dataCompra?String(compra.dataCompra).slice(0,10):new Date().toISOString().slice(0,10))+'"></div>'
              + '<div class="field narrow"><label>Previsão de chegada <span class="opt">(opcional)</span></label><input type="date" id="fPrevisao" value="'+(isEdit&&compra.previsaoChegada?String(compra.previsaoChegada).slice(0,10):'')+'"></div>'
            + '</div>'
            + '<div class="field"><label>Observação <span class="opt">(opcional)</span></label><input type="text" id="fObservacao" placeholder="Observações gerais da compra" value="'+(isEdit?escapeHtml(compra.observacao||''):'')+'"></div>'
            + '<div class="section-label"><span>Itens da compra</span></div>'
            + '<div id="cmpItensList"></div>'
            + '<div class="field-error" id="eItens" style="display:none; margin-bottom:10px;"></div>'
            + '<button type="button" class="ghost-btn" id="cmpAddItem" style="cursor:pointer; opacity:1; margin-bottom:14px;">'+svg('plus')+'<span>Adicionar item</span></button>'
            + '<div class="bd-row total" style="margin-bottom:14px;"><span class="bd-label">Valor total da compra</span><span class="bd-value" id="cmpTotalGeral">R$ 0,00</span></div>'
            + '<div class="modal-actions">'
              + '<button type="button" class="btn-secondary" id="modalCancel">Cancelar</button>'
              + '<button type="submit" class="btn-primary" id="modalSave">'+svg('check')+'<span>'+(isEdit?'Salvar alterações':'Criar compra')+'</span></button>'
            + '</div>'
          + '</form>'
        + '</div>'
      + '</div>';

      const overlay = document.getElementById('modalOverlay');
      const close = ()=> modalRoot.innerHTML = '';
      overlay.addEventListener('click', (e)=>{ if(e.target === overlay) close(); });
      document.getElementById('modalClose').addEventListener('click', close);
      document.getElementById('modalCancel').addEventListener('click', close);

      let produtosAtivos = [];

      function calcularTotal(){
        return itens.reduce(function(acc, it){ return acc + (Number(it.quantidade)||0) * (Number(it.custoUnitario)||0); }, 0);
      }

      function renderItens(){
        const list = document.getElementById('cmpItensList');
        if(!list) return;
        list.innerHTML = itens.map(function(it, idx){
          const totalItem = (Number(it.quantidade)||0) * (Number(it.custoUnitario)||0);
          const produtoAindaAtivo = it.produtoId && produtosAtivos.some(function(p){ return p.id === Number(it.produtoId); });
          const opcaoInativa = (it.produtoId && !produtoAindaAtivo)
            ? '<option value="'+it.produtoId+'" selected>'+escapeHtml(it.nome||('Produto #'+it.produtoId))+(it.sku?' ('+escapeHtml(it.sku)+')':'')+' — inativo</option>'
            : '';
          const opcoesProduto = '<option value="">Selecione…</option>' + opcaoInativa + produtosAtivos.map(function(p){
            return '<option value="'+p.id+'" '+(Number(it.produtoId)===p.id?'selected':'')+'>'+escapeHtml(p.nome)+' ('+escapeHtml(p.sku)+')</option>';
          }).join('');
          return '<div class="inline-form" data-item-row="'+it._rowId+'" style="align-items:flex-end; margin-bottom:8px;">'
            + '<div class="field" style="min-width:200px; margin-bottom:0;"><label>Produto</label><select data-item-produto="'+it._rowId+'">'+opcoesProduto+'</select></div>'
            + '<div class="field narrow" style="margin-bottom:0;"><label>Quantidade</label><input type="text" inputmode="numeric" data-item-qtd="'+it._rowId+'" value="'+it.quantidade+'"></div>'
            + '<div class="field narrow" style="margin-bottom:0;"><label>Custo unitário</label><input type="text" inputmode="decimal" data-item-custo="'+it._rowId+'" value="'+String(it.custoUnitario).replace('.',',')+'"></div>'
            + '<div class="field narrow" style="margin-bottom:0;"><label>Total do item</label><input type="text" value="'+money(totalItem)+'" disabled></div>'
            + (itens.length > 1 ? '<button type="button" class="row-ic-btn danger" data-item-remove="'+it._rowId+'" title="Remover item" style="margin-bottom:2px;">'+svg('x')+'</button>' : '<span style="width:36px;"></span>')
          + '</div>';
        }).join('');

        list.querySelectorAll('[data-item-produto]').forEach(function(sel){
          sel.addEventListener('change', function(){
            const row = itens.find(function(it){ return it._rowId === sel.dataset.itemProduto; });
            if(row) row.produtoId = sel.value ? Number(sel.value) : null;
          });
        });
        list.querySelectorAll('[data-item-qtd]').forEach(function(input){
          input.addEventListener('input', function(){
            const row = itens.find(function(it){ return it._rowId === input.dataset.itemQtd; });
            if(row){ row.quantidade = input.value; renderItens(); atualizarTotalGeral(); posicionarFoco(input.dataset.itemQtd,'qtd'); }
          });
        });
        list.querySelectorAll('[data-item-custo]').forEach(function(input){
          input.addEventListener('input', function(){
            const row = itens.find(function(it){ return it._rowId === input.dataset.itemCusto; });
            if(row){ row.custoUnitario = input.value.replace(',','.'); renderItens(); atualizarTotalGeral(); posicionarFoco(input.dataset.itemCusto,'custo'); }
          });
        });
        list.querySelectorAll('[data-item-remove]').forEach(function(btn){
          btn.addEventListener('click', function(){
            itens = itens.filter(function(it){ return it._rowId !== btn.dataset.itemRemove; });
            renderItens();
            atualizarTotalGeral();
          });
        });
      }

      // Reposiciona o cursor no campo que estava sendo editado depois de um
      // re-render (evita perder o foco a cada tecla digitada).
      let focoPendente = null;
      function posicionarFoco(rowId, campo){
        focoPendente = { rowId, campo };
        requestAnimationFrame(function(){
          if(!focoPendente) return;
          const seletor = focoPendente.campo === 'qtd' ? '[data-item-qtd="'+focoPendente.rowId+'"]' : '[data-item-custo="'+focoPendente.rowId+'"]';
          const el = document.querySelector(seletor);
          if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
          focoPendente = null;
        });
      }

      function atualizarTotalGeral(){
        const el = document.getElementById('cmpTotalGeral');
        if(el) el.textContent = money(calcularTotal());
      }

      document.getElementById('cmpAddItem').addEventListener('click', function(){
        itens.push({ produtoId:null, quantidade:1, custoUnitario:0, _rowId:'r'+(rowSeq++) });
        renderItens();
        atualizarTotalGeral();
      });

      (async function carregarPickers(){
        try{
          const [fornecedores, produtos] = await Promise.all([
            apiFornecedoresAtivos(state.empresaId),
            apiProdutosAtivos(state.empresaId),
          ]);
          produtosAtivos = produtos;
          const fSel = document.getElementById('fFornecedor');
          if(fSel){
            fSel.innerHTML = fornecedores.length
              ? fornecedores.map(function(f){ return '<option value="'+f.id+'" '+(isEdit&&compra.fornecedorId===f.id?'selected':'')+'>'+escapeHtml(f.razaoSocial)+'</option>'; }).join('')
              : '<option value="">Nenhum fornecedor ativo cadastrado</option>';
          }
          renderItens();
          atualizarTotalGeral();
        }catch(e){
          toast('Não foi possível carregar fornecedores/produtos.', 'error');
        }
      })();

      document.getElementById('cmpForm').addEventListener('submit', async (e)=>{
        e.preventDefault();
        ['eFornecedor','eItens'].forEach(id=>{ const el=document.getElementById(id); el.style.display='none'; el.textContent=''; });

        const payload = {
          empresaId: state.empresaId,
          fornecedorId: Number(document.getElementById('fFornecedor').value),

          if(err.errors){

              if(err.errors[campo]){

    window.ContasPagar = { load };

        { label:'Total a receber', icon:'arrowDownCircle', tint:'copper', valueHtml: money(r.totalAReceber) },
        { label:'Previsto para hoje', icon:'clock', tint: r.previstoHoje>0?'warning':'muted', valueHtml: money(r.previstoHoje) },
        { label:'Atrasado', icon:'alertCircle', tint: r.atrasado>0?'danger':'muted', valueHtml: money(r.atrasado) },
        { label:'Recebido no período', icon:'checkCircle', tint:'success', valueHtml: money(r.recebidoNoPeriodo) },
      ];
      return '<div class="kpi-sec-grid" style="margin-bottom:14px;">' + cards.map(secCardHTML).join('') + '</div>';
    }

    function render(){
      const root = document.getElementById('contasReceberRoot');
      if(!root) return;
      const filtro = window.CerneFiltro.state;

      if(!filtro.loadingEmpresas && !filtro.empresas.length){
        root.innerHTML = '<div class="empty-panel"><div class="empty-icon">'+svg('building')+'</div>'
