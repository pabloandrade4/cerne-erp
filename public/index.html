      root.innerHTML = html;

      const sel = document.getElementById('pedEmpresaSelect');
      if(sel) sel.addEventListener('change', ()=>{ state.empresaId = Number(sel.value); loadResumo(); loadPedidos(); });
      const selPer = document.getElementById('pedPeriodoSelect');
      if(selPer) selPer.addEventListener('change', ()=>{
        state.periodo = selPer.value;
        if(state.periodo === 'personalizado'){
          if(!state.desdePersonalizado) state.desdePersonalizado = hojeBRT();
          if(!state.atePersonalizado) state.atePersonalizado = hojeBRT();
        }
        loadResumo(); loadPedidos();
      });
      const pedAplicarPeriodo = document.getElementById('pedAplicarPeriodo');
      if(pedAplicarPeriodo) pedAplicarPeriodo.addEventListener('click', ()=>{
        const d = document.getElementById('pedDesdeInput').value || hojeBRT();
        const a = document.getElementById('pedAteInput').value || hojeBRT();
        state.desdePersonalizado = d; state.atePersonalizado = a;
        loadResumo(); loadPedidos();
      });
      const syncBtn = document.getElementById('pedSyncBtn');
      if(syncBtn) syncBtn.addEventListener('click', async ()=>{
        syncBtn.disabled = true;
        try{
          // Sincroniza as duas lojas conectadas desta empresa (Mercado Livre
          // e Shopee), quando existirem — mesmo botão de sempre, agora
          // cobrindo as duas (14/09/2026). Cada uma é isolada: se uma
          // falhar, a outra ainda sincroniza normalmente.
          const [contaMl, contaShopee] = await Promise.all([
            apiContaDaEmpresa(state.empresaId),
            apiContaShopeeDaEmpresa(state.empresaId),
          ]);
          if(!contaMl && !contaShopee){
            toast('Conecte o Mercado Livre e/ou a Shopee desta empresa em Marketplaces primeiro.', 'error');
            syncBtn.disabled = false; return;
          }
          const mensagens = [];
          if(contaMl){
            try{ const r = await apiMlSync(contaMl.id); mensagens.push(r.importados+' do Mercado Livre'); }
            catch(err){ mensagens.push('Mercado Livre: '+err.message); }
          }
          if(contaShopee){
            try{ const r = await apiShopeeSync(contaShopee.id); mensagens.push(r.importados+' da Shopee'); }
            catch(err){ mensagens.push('Shopee: '+err.message); }
          }
          toast('Sincronizado — '+mensagens.join(' · ')+'.');

        syncBtn.disabled = false;
      });
      const selLoja = document.getElementById('pedLojaSelect');
      if(selLoja) selLoja.addEventListener('change', ()=>{ state.contaId = selLoja.value; loadResumo(); loadPedidos(); });
      const selStatus = document.getElementById('pedStatusSelect');
      if(selStatus) selStatus.addEventListener('change', ()=>{ state.status = selStatus.value; loadPedidos(); });
      const busca = document.getElementById('pedBuscaInput');

      function baixarRelatorio(formato){
        const params = queryFiltrosAtuais();
        params.set('formato', formato);
        window.location.href = '/api/pedidos/relatorio?'+params.toString();
      }
      const relXlsxBtn = document.getElementById('pedRelatorioXlsxBtn');
      if(relXlsxBtn) relXlsxBtn.addEventListener('click', ()=> baixarRelatorio('xlsx'));
      const relCsvBtn = document.getElementById('pedRelatorioCsvBtn');
      if(relCsvBtn) relCsvBtn.addEventListener('click', ()=> baixarRelatorio('csv'));
      root.querySelectorAll('[data-detail]').forEach(b=> b.addEventListener('click', (e)=>{ e.stopPropagation(); openDetail(b.dataset.detail); }));
      root.querySelectorAll('[data-row-detail]').forEach(tr=> tr.addEventListener('click', ()=> openDetail(tr.dataset.rowDetail)));
    }

    // Detalhe do pedido em painel lateral (drawer), em vez do modal
    // centralizado antigo — pedido de redesenho visual do usuário ("se
    // puder ser feito sem alterar a lógica existente"). Só troca o
    // CONTAINER (modal-card -> side-panel); todo o conteúdo abaixo
    // (seções, campos, fórmula de margem) é exatamente o mesmo, buscado do
    // mesmo endpoint /api/pedidos/:id, sem nenhum cálculo novo.
    function closeSidePanel(){

      // Shopee (14/09/2026): mesmo painel de sempre, só trocando os campos

        + '<div class="modal-sub">'+escapeHtml(canalLabel)+' · '+fmtDateTime(pedido.dataCriacao)+' · <span class="badge-status '+(pedido.status==='paid'?'on':'off')+'" style="display:inline-flex;"><span class="dot"></span>'+escapeHtml(pedido.status||'—')+'</span></div>'

          + '<div class="dg-item"><div class="dg-label">Comprador</div><div class="dg-value">'+escapeHtml(pedido.compradorNickname||'—')+'</div></div>'
          + (isShopee
              ? '<div class="dg-item"><div class="dg-label">Forma de pagamento</div><div class="dg-value'+(pedido.metodoPagamento?'':' muted')+'">'+(escapeHtml(pedido.metodoPagamento)||'indisponível')+'</div></div>'

                + '<div class="dg-item"><div class="dg-label">ID do envio (shipment)</div><div class="dg-value'+(pedido.mlShippingId?'':' muted')+'">'+(pedido.mlShippingId||'sem envio')+'</div></div>')
          + '<div class="dg-item"><div class="dg-label">'+(isShopee?'Transportadora':'Modalidade de logística')+'</div><div class="dg-value'+(pedido.envioLogisticType?'':' muted')+'">'+(escapeHtml(pedido.envioLogisticType||pedido.envioLogisticMode)||'indisponível')+'</div></div>'
        + '</div>'

          + (rf.resultado===null ? 'Cálculo incompleto' : money(rf.resultado,moeda)) + '</span></div>'
        + (rf.margemPercentual!==null ? '<div class="bd-row"><span class="bd-label">% sobre o valor da venda</span><span class="bd-value '+(rf.margemPercentual>=0?'positive':'negative')+'">'+(rf.margemPercentual<0?'− ':'')+Math.abs(rf.margemPercentual).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'%</span></div>' : '')
        + (rf.pendencias.length ? '<div class="bd-note">'+svg('alertCircle')+'<span>'+rf.pendencias.map(escapeHtml).join('<br>')+'</span></div>' : '')

        + '<div class="detail-section-title">Frete pago pelo comprador (informativo)</div>'
        + bdLine(isShopee ? 'Frete comprador' : 'Frete comprador (receiver.cost)', rf.freteComprador, false)
        + '<div class="bd-side-note">'+(isShopee
            ? 'A Shopee ainda não separa esse valor nos dados já sincronizados nesta etapa da integração.'
            : 'Não entra no cálculo do resultado acima — é o valor pago pelo comprador, separado do custo de frete do vendedor.')+'</div>'

        + '</div>';

      document.getElementById('sidePanelOverlay').addEventListener('click', closeSidePanel);
      document.getElementById('sidePanelClose').addEventListener('click', closeSidePanel);

    window.Pedidos = { load };
  })();

  /* ================= FINANCEIRO — dashboard consolidado (26/08/2026) =================
     Redesenho visual pedido pelo usuário: reunir numa só tela o que já
     existe, cada um na sua própria tela — nunca um cálculo novo, sempre a
     MESMA função/consulta que a tela cheia usa:
       - Cards de topo + gráfico de saldo: /api/fluxo-caixa (mesmo
         `cardsHTML`/`chartSaldoHTML` de FluxoCaixa, copiados aqui).
       - Resumo de DRE: /api/dre (mesmos campos de `linhas` que a tela DRE
         usa — só um subconjunto, o resto fica um clique em "Ver
         demonstrativo completo").
       - Contas a pagar / Contas a receber: /api/contas-pagar e
         /api/contas-receber — usa o campo `resumo` que essas rotas já
         calculam (mesmo que a lista completa usa), nunca refeito aqui.
       - Recebimentos de marketplaces: /api/recebimentos — agrupado por
         loja só somando (Σ) os valores que cada linha já traz prontos
         (nunca uma fórmula nova, só uma soma de exibição).
       - Despesas fixas: /api/despesas-fixas (lista das ativas) +
         `resumoFormula.despesasFixasPrevistas` que já vem pronto de
         /api/fluxo-caixa (o rateio por frequência/dia já existe em
         lib/fluxoCaixa.js — nunca recalculado aqui).
     Datas: usa o filtro global (window.CerneFiltro) pra empresa e pro
     período de DRE/Contas a pagar/Contas a receber/Recebimentos — exceto
     o Fluxo de Caixa, que continua com seu próprio seletor de período
     (é uma janela pra FRENTE — "próximos N dias" —, um conceito diferente
     do período pra TRÁS do filtro global; forçar os dois a serem a mesma
     coisa mudaria o que o número significa, então ficam separados, do
     jeito que a própria tela de Fluxo de Caixa já funciona).
     "A vencer" nos mini-cards de Contas a Pagar/Receber mostra os
     PRÓXIMOS 7 DIAS (não 30) porque é o que resumoContasPagar/
     resumoContasReceber já calculam — não inventamos uma janela de 30
     dias que a função de resumo não produz. */
  (function(){
    const FLUXO_PERIODOS = [ ['7d','7 dias'], ['30d','30 dias'], ['mes','Este mês'] ];
    const state = {
      loading:false, error:null,
      loadingFluxo:false, erroFluxo:null,
      periodoFluxo:'30d',
      fluxo:null, dre:null, contasPagar:null, contasReceber:null, recebimentos:null, despesasFixas:null,
    };

    function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function money(v){ return v===null||v===undefined ? '—' : 'R$ ' + Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2}); }
    function moneyOuIndisponivel(campo){
      if(!campo || campo.valor===null || campo.valor===undefined) return '<span class="dash" title="Informe o saldo inicial em Fluxo de Caixa">Não informado</span>';
      return money(campo.valor);
    }
    function pct(v){ return v===null||v===undefined ? null : Number(v).toLocaleString('pt-BR',{minimumFractionDigits:1, maximumFractionDigits:1})+'%'; }
    function fmtDate(iso){ if(!iso) return '—'; try{ const [y,m,d] = String(iso).slice(0,10).split('-'); return d+'/'+m+'/'+y; }catch(e){ return '—'; } }
    function fmtDiaCurto(diaISO){ const [, m, d] = diaISO.split('-'); return d+'/'+m; }
    function tintVars(tint){ return tint==='muted' ? '--tint:var(--text-muted);--tint-soft:var(--surface-2);' : '--tint:var(--'+tint+');--tint-soft:var(--'+tint+'-soft);'; }
    function navLink(label, page){ return '<a href="javascript:void(0)" class="fin-nav-link" data-page="'+page+'">'+escapeHtml(label)+'<span class="fin-nav-arrow">→</span></a>'; }

    async function apiGet(url){
      const res = await fetch(url);
      let body = null; try{ body = await res.json(); }catch(e){}
      if(!res.ok) throw new Error((body && body.error) || 'Falha na requisição.');
      return body;
    }

    async function loadFluxo(){
      const filtro = window.CerneFiltro.state;
      if(!filtro.empresaId){ state.fluxo=null; state.loadingFluxo=false; render(); return; }
      state.loadingFluxo = true; state.erroFluxo = null; render();
      try{ state.fluxo = await apiGet('/api/fluxo-caixa?empresaId='+filtro.empresaId+'&periodo='+state.periodoFluxo); }
      catch(err){ state.erroFluxo = err.message || 'Não foi possível carregar o fluxo de caixa.'; state.fluxo = null; }
      state.loadingFluxo = false; render();
    }

    async function loadResto(){
      const filtro = window.CerneFiltro.state;
      if(!filtro.empresaId){ state.dre=state.contasPagar=state.contasReceber=state.recebimentos=state.despesasFixas=null; state.loading=false; render(); return; }
      state.loading = true; state.error = null; render();
      const empresaId = filtro.empresaId, periodo = filtro.periodo;
      const [dre, cp, cr, rec, df] = await Promise.allSettled([
        apiGet('/api/dre?empresaId='+empresaId+'&periodo='+periodo),
        apiGet('/api/contas-pagar?empresaId='+empresaId+'&periodo='+periodo+'&status=pendente'),
        apiGet('/api/contas-receber?empresaId='+empresaId+'&periodo='+periodo+'&status=a_receber'),
        apiGet('/api/recebimentos?empresaId='+empresaId+'&periodo='+periodo),
        apiGet('/api/despesas-fixas?empresaId='+empresaId+'&ativo=true'),
      ]);
      // Cada painel é independente — se um endpoint falhar, os outros continuam
      // mostrando dado real normalmente (nunca tudo quebra por causa de um só).
      state.dre = dre.status==='fulfilled' ? dre.value : null;
      state.contasPagar = cp.status==='fulfilled' ? cp.value : null;
      state.contasReceber = cr.status==='fulfilled' ? cr.value : null;
      state.recebimentos = rec.status==='fulfilled' ? rec.value : null;
      state.despesasFixas = df.status==='fulfilled' ? df.value : null;
      state.error = (dre.status==='rejected' && cp.status==='rejected' && cr.status==='rejected' && rec.status==='rejected' && df.status==='rejected')
        ? 'Não foi possível carregar o financeiro.' : null;
      state.loading = false; render();
    }

    function load(){ loadFluxo(); loadResto(); }

    window.CerneFiltro.onChange(()=>{
      const page = document.getElementById('page-finance');
      if(page && page.classList.contains('active')){ loadFluxo(); loadResto(); }
      else render();
    });

    // ---- cards de topo (mesma função/campos de FluxoCaixa.cardsHTML) ----
    function cardHTML(k){
      return '<div class="kpi-hero" style="'+tintVars(k.tint)+'">'
        + '<div class="kpi-hero-top"><div class="kpi-hero-icon">'+svg(k.icon)+'</div></div>'
        + '<div class="kpi-hero-label">'+escapeHtml(k.label)+'</div>'
        + '<div class="kpi-hero-value">'+k.valueHtml+'</div>'
        + '<div class="kpi-hero-foot"><span class="kpi-hero-note">'+escapeHtml(k.note)+'</span></div>'
      + '</div>';
    }
    function cardsHTML(dados){
      const c = dados.cards;
      const items = [
        { label:'Saldo atual', icon:'wallet', tint: c.saldoAtual.valor===null?'muted':(c.saldoAtual.valor>=0?'success':'danger'), valueHtml: moneyOuIndisponivel(c.saldoAtual), note:'A partir do saldo inicial informado' },
        { label:'Entradas previstas', icon:'arrowDownCircle', tint:'success', valueHtml: money(c.entradasPrevistas), note:'A receber no período' },
        { label:'Saídas previstas', icon:'arrowUpCircle', tint:'copper', valueHtml: money(c.saidasPrevistas), note:'Contas a pagar + despesas fixas' },
        { label:'Saldo projetado', icon:'activity', tint: (c.saldoProjetado.valor===null?'muted':(c.saldoProjetado.valor>=0?'success':'danger')), valueHtml: moneyOuIndisponivel(c.saldoProjetado), note:'Estimado ao fim do período' },
        { label:'Contas vencidas', icon:'alertCircle', tint: c.contasVencidas>0?'danger':'muted', valueHtml: money(c.contasVencidas), note:'A pagar vencidas + a receber atrasadas' },
      ];
      return '<div class="kpi-hero-grid">' + items.map(cardHTML).join('') + '</div>';
    }

    // ---- gráfico de saldo (mesma função de FluxoCaixa.chartSaldoHTML) ----
    function chartSaldoHTML(dados){
      const dias = dados.serieDiaria;
      const temSaldo = dias.some(d => d.saldoAcumulado !== null && d.saldoAcumulado !== undefined);
      if(!dias.length || !temSaldo){
        return '<div class="chart-canvas h-lg">' + chartGridLines(4)
          + chartEmptyState('wallet', 'Informe o saldo inicial em Fluxo de Caixa pra ver a evolução do caixa — sem isso o ERP não inventa nenhum saldo.')
        + '</div>';
      }
      const n = dias.length;
      const W = Math.max(n*14, 14), H = 100, topPad = 10, botPad = 10;
      const usable = H - topPad - botPad;
      const vals = dias.map(d => d.saldoAcumulado||0);
      const maxV = Math.max(0, ...vals), minV = Math.min(0, ...vals);
      const range = (maxV - minV) || 1;
      const yFor = v => topPad + usable * (1 - (v - minV) / range);
      const baseY = yFor(0);

      const pontos = dias.map((d,i)=> ({ x:i*14+7, y:yFor(d.saldoAcumulado||0), d }));
      let corte = pontos.findIndex(p=>p.d.ehHoje);
      if(corte === -1) corte = dias[0].ehPassado ? pontos.length-1 : -1;
      const solidos = corte===-1 ? [] : pontos.slice(0, corte+1);
      const tracejados = corte===-1 ? pontos : pontos.slice(corte);

      const linhaSolida = solidos.length>1 ? '<polyline points="'+solidos.map(p=>p.x+','+p.y).join(' ')+'" fill="none" stroke="var(--teal)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>' : '';
      const linhaTracejada = tracejados.length>1 ? '<polyline points="'+tracejados.map(p=>p.x+','+p.y).join(' ')+'" fill="none" stroke="var(--copper)" stroke-width="2" stroke-dasharray="4 3" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>' : '';
      const dots = pontos.map(p=>{
        const label = fmtDiaCurto(p.d.dia)+' — '+(p.d.ehPassado||p.d.ehHoje?'Realizado':'Projetado')+': '+money(p.d.saldoAcumulado);
        return '<circle cx="'+p.x+'" cy="'+p.y+'" r="1.8" fill="'+(p.d.ehPassado||p.d.ehHoje?'var(--teal)':'var(--copper)')+'" vector-effect="non-scaling-stroke"><title>'+escapeHtml(label)+'</title></circle>';
      }).join('');
      const baseline = '<line x1="0" y1="'+baseY+'" x2="'+W+'" y2="'+baseY+'" stroke="var(--border-strong)" stroke-width="1" vector-effect="non-scaling-stroke"/>';
      const labelStep = Math.max(1, Math.ceil(n/7));
      const labels = dias.map((d,i) => '<span>'+((i%labelStep===0 || i===n-1) ? escapeHtml(fmtDiaCurto(d.dia)) : '')+'</span>').join('');

      return '<div class="chart-canvas" style="position:relative;height:180px;padding:0;">'
        + '<svg class="simple-chart-svg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="height:100%;">'
          + baseline + linhaSolida + linhaTracejada + dots
        + '</svg>'
      + '</div>'
      + '<div class="simple-chart-xlabels" style="grid-template-columns:repeat('+n+',1fr);">' + labels + '</div>';
    }
    function fluxoCardHTML(){
      let body;
      if(state.loadingFluxo) body = '<div class="table-skel"><span class="spin"></span><span>Carregando…</span></div>';

    // ---- Resumo de DRE (subconjunto dos mesmos campos que a tela DRE usa) ----
    function linhaDreHTML(label, campo, hasOrders, negativo){
      if(!campo) return '';
      const valorHtml = campo.valor===null
        ? '<span style="color:var(--text-faint);font-style:italic;">'+(hasOrders?'Pendente':'Sem dados')+'</span>'
        : (negativo && campo.valor!==0 ? '− ' : '') + money(Math.abs(campo.valor));
      return '<div class="bd-row'+(negativo?' neg':'')+'"><span class="bd-label">'+label+'</span><span class="bd-value">'+valorHtml+'</span></div>';
    }
    function totalDreHTML(label, campo, hasOrders){
      if(!campo) return '';
      const positivo = campo.valor!==null && campo.valor>=0;
      return '<div class="bd-row total"><span class="bd-label">'+label+'</span><span class="bd-value '+(campo.valor===null?'':(positivo?'positive':'negative'))+'">'
        + (campo.valor===null?(hasOrders?'Pendente':'Sem dados'):money(campo.valor)) + '</span></div>';
    }
    function somaCampos(a, b){
      // Soma de exibição só — nunca uma fórmula nova: os dois campos já vêm
      // prontos da mesma DRE que a tela DRE usa, isso só os junta numa
      // linha só ("Deduções") pra caber num resumo compacto.
      if(!a || !b || a.valor===null || b.valor===null) return { valor:null, pendentes:(a?a.pendentes:0)+(b?b.pendentes:0) };
      return { valor: Math.round((a.valor + b.valor)*100)/100, pendentes: a.pendentes+b.pendentes };
    }
    function somaCampos3(a,b,c){ return somaCampos(somaCampos(a,b), c); }
    function dreResumoHTML(){
      let body;
      if(state.loading) body = '<div class="table-skel"><span class="spin"></span><span>Carregando…</span></div>';
      else if(!state.dre) body = '<div class="field-hint">Não foi possível carregar a DRE agora.</div>';
      else{
        const d = state.dre.dre, l = d.linhas, hasOrders = d.hasOrders;
        const deducoes = somaCampos(l.cancelamentos, l.descontos);
        const taxasFreteImposto = somaCampos3(l.taxasComissoes, l.freteVendedor, l.impostos);
        body = linhaDreHTML('Receita Bruta', l.receitaBruta, hasOrders)
          + linhaDreHTML('(−) Deduções (cancelamentos + descontos)', deducoes, hasOrders, true)
          + totalDreHTML('= Receita Líquida', l.receitaLiquida, hasOrders)
          + linhaDreHTML('(−) Custo dos Produtos', l.custoProdutos, hasOrders, true)
          + linhaDreHTML('(−) Taxas, frete e impostos', taxasFreteImposto, hasOrders, true)
          + totalDreHTML('= Margem de Contribuição', l.margemContribuicao, hasOrders)
          + linhaDreHTML('(−) Despesas pagas no período', l.despesasPeriodo, true, true)
          + totalDreHTML('= Resultado Final', l.resultadoFinal, hasOrders);
      }
      return '<div class="panel">'
        + '<div class="panel-head"><div class="panel-title"><span class="panel-title-ic">'+svg('barChart')+'</span>Resumo de DRE</div>'
          + (state.dre ? '<span class="panel-note">'+escapeHtml(state.dre.periodo.label)+'</span>' : '') + '</div>'
        + body
        + '<div style="text-align:right;margin-top:10px;">'+navLink('Ver demonstrativo completo', 'dre')+'</div>'
      + '</div>';
    }

    // ---- Contas a pagar (mesmo `resumo` de /api/contas-pagar) ----
    function contasPagarMiniHTML(){
      let inner;
      if(state.loading) inner = '<div class="table-skel"><span class="spin"></span><span>Carregando…</span></div>';
      else if(!state.contasPagar) inner = '<div class="field-hint">Não foi possível carregar agora.</div>';

        const r = state.contasPagar.resumo;

            + '<div class="fin-mini-stat"><span class="fin-mini-label">A vencer (próx. 7 dias)</span><span class="fin-mini-value">'+money(r.vencendoProximos7Dias)+'</span></div>'
          + '</div>'
          + (linhas.length ? '<div class="fin-mini-table-wrap"><table class="data-table fin-mini-table"><thead><tr><th>Vencimento</th><th>Fornecedor</th><th>Valor</th></tr></thead><tbody>'
            + linhas.map(c=>'<tr><td class="tab-nums">'+fmtDate(c.vencimento)+'</td><td>'+escapeHtml(c.fornecedorNome||c.descricao)+'</td><td class="mono">'+money(c.valor)+'</td></tr>').join('')
            + '</tbody></table></div>' : '<div class="field-hint">Nenhuma conta pendente.</div>');
      }
      return '<div class="panel">'
        + '<div class="panel-head"><div class="panel-title"><span class="panel-title-ic">'+svg('arrowUpCircle')+'</span>Contas a pagar</div>'+navLink('Ver todas', 'payable')+'</div>'
        + inner

    // ---- Contas a receber (mesmo `resumo` de /api/contas-receber) ----
    function contasReceberMiniHTML(){
      let inner;
      if(state.loading) inner = '<div class="table-skel"><span class="spin"></span><span>Carregando…</span></div>';

        inner = '<div class="fin-mini-stats">'
            + '<div class="fin-mini-stat"><span class="fin-mini-label">Total atrasado</span><span class="fin-mini-value" style="color:'+(r.atrasado>0?'var(--danger)':'inherit')+';">'+money(r.atrasado)+'</span></div>'
            + '<div class="fin-mini-stat"><span class="fin-mini-label">A vencer (próx. 7 dias)</span><span class="fin-mini-value">'+money(r.previstoProximos7Dias)+'</span></div>'
          + '</div>'
          + (linhas.length ? '<div class="fin-mini-table-wrap"><table class="data-table fin-mini-table"><thead><tr><th>Previsto</th><th>Cliente/Origem</th><th>Valor</th></tr></thead><tbody>'
            + linhas.map(c=>'<tr><td class="tab-nums">'+fmtDate(c.dataPrevista)+'</td><td>'+escapeHtml(c.origem||c.descricao)+'</td><td class="mono">'+money(c.valor)+'</td></tr>').join('')

      }
      return '<div class="panel">'
        + '<div class="panel-head"><div class="panel-title"><span class="panel-title-ic">'+svg('arrowDownCircle')+'</span>Contas a receber</div>'+navLink('Ver todas', 'receivable')+'</div>'
        + inner
      + '</div>';
    }

    // ---- Recebimentos de marketplaces (agrupado por loja — soma de exibição, ver comentário no topo) ----
    function recebimentosMiniHTML(){
      let inner;
      if(state.loading) inner = '<div class="table-skel"><span class="spin"></span><span>Carregando…</span></div>';
      else if(!state.recebimentos) inner = '<div class="field-hint">Não foi possível carregar agora.</div>';
      else{
        const lista = state.recebimentos.recebimentos || [];
        const porLoja = new Map();
        lista.forEach(r=>{
          const loja = r.loja || '—';
          if(!porLoja.has(loja)) porLoja.set(loja, { aLiberar:0, liberado:0, temIndisponivel:false });
          const g = porLoja.get(loja);
          if(r.status==='recebido' && r.valorRecebido!==null) g.liberado += r.valorRecebido;
          else if(r.valorLiquidoEsperado!==null) g.aLiberar += r.valorLiquidoEsperado;
          else g.temIndisponivel = true;
        });
        const linhas = Array.from(porLoja.entries());
        inner = linhas.length ? '<div class="fin-mini-table-wrap"><table class="data-table fin-mini-table"><thead><tr><th>Marketplace</th><th>A liberar</th><th>Liberado</th></tr></thead><tbody>'
          + linhas.map(([loja,g])=>'<tr><td>'+escapeHtml(loja)+'</td><td class="mono">'+money(g.aLiberar)+'</td><td class="mono">'+money(g.liberado)+'</td></tr>').join('')
          + '</tbody></table></div>' : '<div class="field-hint">Nenhum recebimento no período.</div>';
      }
      return '<div class="panel">'
        + '<div class="panel-head"><div class="panel-title"><span class="panel-title-ic">'+svg('swap')+'</span>Recebimentos de marketplaces</div>'+navLink('Ver consolidação completa', 'settlements')+'</div>'
        + inner
      + '</div>';
    }

    // ---- Despesas fixas (lista real + total previsto já pronto de /api/fluxo-caixa) ----
    function despesasFixasMiniHTML(){
      let inner;
      const previstoPeriodo = state.fluxo && state.fluxo.resumoFormula ? state.fluxo.resumoFormula.despesasFixasPrevistas : null;

        inner = '<div class="fin-mini-stats">'

          + '</div>'
          + (despesas.length ? '<div class="fin-mini-table-wrap"><table class="data-table fin-mini-table"><thead><tr><th>Descrição</th><th>Categoria</th><th>Frequência</th><th>Valor cadastrado</th></tr></thead><tbody>'
            + despesas.slice(0,6).map(d=>'<tr><td>'+escapeHtml(d.descricao)+'</td><td>'+escapeHtml(d.categoria||'—')+'</td><td>'+escapeHtml(d.frequencia||'—')+'</td><td class="mono">'+money(d.valor)+'</td></tr>').join('')
            + '</tbody></table></div>' : '<div class="field-hint">Nenhuma despesa fixa ativa cadastrada.</div>');
      }
      return '<div class="panel">'
        + '<div class="panel-head"><div class="panel-title"><span class="panel-title-ic">'+svg('refreshCw')+'</span>Despesas fixas</div>'+navLink('Ver todas as despesas fixas', 'fixedExpenses')+'</div>'
        + inner
      + '</div>';
    }

    function render(){
      const root = document.getElementById('financeRoot');
      if(!root) return;
      const filtro = window.CerneFiltro.state;

      if(!filtro.loadingEmpresas && !filtro.empresas.length){
        root.innerHTML = '<div class="empty-panel"><div class="empty-icon">'+svg('building')+'</div>'
          + '<h2>Nenhuma empresa ativa</h2>'
          + '<p class="lead">Cadastre e ative uma empresa, conecte o Mercado Livre em <strong>Marketplaces</strong> e sincronize para ver o financeiro aqui.</p></div>';
        return;
      }
      if(!filtro.empresaId){
        root.innerHTML = '<div class="empty-panel"><div class="empty-icon">'+svg('wallet')+'</div><h2>Selecione uma empresa</h2></div>';
        return;
      }

      let html = state.fluxo ? cardsHTML(state.fluxo) : '<div class="table-skel"><span class="spin"></span><span>Carregando indicadores…</span></div>';
      html += '<div class="grid-2" style="margin-top:14px;align-items:start;">'
        + fluxoCardHTML()
        + dreResumoHTML()
      + '</div>';
      html += '<div class="fin-grid-3" style="margin-top:14px;align-items:start;">'
        + contasPagarMiniHTML()
        + contasReceberMiniHTML()
        + recebimentosMiniHTML()
      + '</div>';
      html += '<div style="margin-top:14px;">' + despesasFixasMiniHTML() + '</div>';

      root.querySelectorAll('[data-page]').forEach(el=> el.addEventListener('click', ()=> navigate(el.dataset.page)));

    window.Financeiro = { load };
  })();

  /* ================= PRODUTOS — cadastro simples, por empresa =================
     Nome, SKU, custo e status — e a alíquota de imposto da empresa (movida
     pra cá em 24/08/2026, junto com a extinção da aba separada "Custo &
     Margem"; ver docs/02-decisoes.md). Sem kits/composição/estoque
     automático ainda. Esta é a fonte de custo por SKU usada no cálculo de
     margem das vendas (lib/relatorioVendas.js) — mas a MARGEM em si nunca
     aparece nesta tela, só em Pedidos/Visão Geral/Financeiro/Relatórios. */
  (function(){
    const state = { empresas:[], empresaId:null, loadingEmpresas:false, items:[], loading:false, error:null, status:'todos', search:'',
      aliquota:0, loadingAliquota:false, savingAliquota:false };

    function toast(message, type){
      const wrap = document.getElementById('toastWrap');
      const el = document.createElement('div');
      el.className = 'toast ' + (type||'success');
      el.innerHTML = svg(type==='error' ? 'alertCircle':'checkCircle') + '<span>'+message+'</span>';
      wrap.appendChild(el);
      setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .25s'; setTimeout(()=>el.remove(),250); }, 3200);
    }
    function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function money(v){ return 'R$ ' + Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2}); }
    function fmtDate(iso){ try{ return new Date(iso).toLocaleDateString('pt-BR'); }catch(e){ return '—'; } }

    async function apiEmpresasAtivas(){
      const res = await fetch('/api/empresas?status=ativas');
      return ((await res.json()).empresas) || [];
    }
    async function api(path, opts){
      const res = await fetch('/api/produtos'+path, { headers:{'Content-Type':'application/json'}, ...opts });
      let body = null; try{ body = await res.json(); }catch(e){}
      if(!res.ok){ const err = new Error((body&&body.error)||'Falha na requisição.'); err.errors = body&&body.errors; throw err; }
      return body;
    }
    // 14/09/2026, pedido explícito do usuário: "como podemos fazer para
    // puxar o sku com o custo direto" — SKUs que já apareceram em pedidos
    // reais (Mercado Livre + Shopee) desta empresa mas ainda não têm
    // produto cadastrado (ver rota em routes/produtos.js). Usado só pra
    // sugerir no cadastro/edição de produto — nunca preenche nada sozinho,
    // o usuário sempre escolhe/confirma antes de salvar.
    async function apiSugestoesSku(empresaId){
      const res = await fetch('/api/produtos/sugestoes-sku?empresaId='+empresaId);
      const body = await res.json().catch(()=>({}));
      return (body && body.sugestoes) || [];
    }
    async function apiConfig(path, opts){
      const res = await fetch('/api/config-financeiro'+path, { headers:{'Content-Type':'application/json'}, ...opts });
      let body = null; try{ body = await res.json(); }catch(e){}
      if(!res.ok){ const err = new Error((body&&body.error)||'Falha na requisição.'); err.errors = body&&body.errors; throw err; }
      return body;
    }

    async function loadItens(){
      state.loading = true; state.error = null; render();
      try{
        const params = new URLSearchParams({ empresaId: state.empresaId });
        if(state.status !== 'todos') params.set('status', state.status);
        if(state.search.trim()) params.set('search', state.search.trim());
        const data = await api('?'+params.toString(), { method:'GET' });
        state.items = data.produtos;
      }catch(err){ state.error = err.message || 'Não foi possível carregar os produtos.'; }
      finally{ state.loading = false; render(); }
    }

    async function loadAliquota(){
      state.loadingAliquota = true; render();
      try{
        const data = await apiConfig('/'+state.empresaId, { method:'GET' });
        state.aliquota = data.aliquotaImposto;
      }catch(err){ toast(err.message, 'error'); }
      finally{ state.loadingAliquota = false; render(); }
    }

    async function load(){
      state.loadingEmpresas = true; render();
      try{
        state.empresas = await apiEmpresasAtivas();
        if(!state.empresaId || !state.empresas.find(e=>e.id===state.empresaId)){
          state.empresaId = state.empresas.length ? state.empresas[0].id : null;
        }
      }catch(e){ state.empresas = []; }
      state.loadingEmpresas = false;
      if(state.empresaId) await Promise.all([loadItens(), loadAliquota()]); else render();
    }

    function render(){
      const root = document.getElementById('produtosRoot');
      if(!root) return;

      if(!state.loadingEmpresas && !state.empresas.length){
        root.innerHTML = '<div class="empty-panel"><div class="empty-icon">'+svg('building')+'</div>'
          + '<h2>Nenhuma empresa ativa</h2>'
          + '<p class="lead">Cadastre e ative uma empresa em <strong>Cadastros → Empresas</strong> antes de cadastrar produtos.</p></div>';
        return;
      }

      let html = '<div class="empresa-picker"><label>Empresa</label><select id="prdEmpresaSelect">'
        + state.empresas.map(e=>'<option value="'+e.id+'" '+(e.id===state.empresaId?'selected':'')+'>'+escapeHtml(e.nomeFantasia||e.razaoSocial)+'</option>').join('')
      + '</select></div>';

      html += '<div class="section-label"><span>Imposto configurado</span></div>'
        + '<div class="inline-form">'
          + '<div class="field narrow"><label>Alíquota de imposto (%)</label><input type="text" inputmode="decimal" id="prdAliquota" value="'+(state.loadingAliquota?'':state.aliquota)+'"></div>'
          + '<button class="btn-primary" id="prdSaveAliquota" type="button">'+svg('check')+'<span>Salvar</span></button>'
          + '<div class="field-hint" style="margin:0;">Percentual aplicado sobre o valor de cada venda, para todos os produtos desta empresa. Não vem do Mercado Livre — é uma configuração do ERP.</div>'
        + '</div>';

      html += '<div class="section-label"><span>Produtos cadastrados</span></div>'
        + '<div class="toolbar">'
          + '<div class="seg" id="prdSeg">'
            + [['todos','Todos'],['ativos','Ativos'],['inativos','Inativos']].map(function(par){ return '<button data-status="'+par[0]+'" class="'+(state.status===par[0]?'active':'')+'">'+par[1]+'</button>'; }).join('')
          + '</div>'
          + '<div class="search-box">'+svg('search')+'<input type="text" id="prdSearch" placeholder="Buscar por nome ou SKU" value="'+state.search.replace(/"/g,'&quot;')+'"></div>'
        + '</div>';

      if(state.loading){
        html += '<div class="table-card"><div class="table-skel"><span class="spin"></span><span>Carregando produtos…</span></div></div>';
      } else if(state.error){
        html += '<div class="empty-panel"><div class="empty-icon" style="color:var(--danger); background:var(--danger-soft);">'+svg('alertCircle')+'</div>'
          + '<h2 style="color:var(--danger);">Não foi possível carregar</h2><p class="lead">'+escapeHtml(state.error)+'</p>'
          + '<button class="ghost-btn" id="prdRetry" style="cursor:pointer; opacity:1;">'+svg('activity')+'<span>Tentar novamente</span></button></div>';
      } else if(!state.items.length){
        const filtrado = !!(state.search || state.status!=='todos');
        html += '<div class="empty-panel"><div class="empty-icon">'+svg('box')+'</div>'
          + '<h2>Nenhum produto encontrado</h2>'
          + '<p class="lead">'+(filtrado ? 'Nenhum produto corresponde ao filtro atual.' : 'Cadastre o primeiro produto (nome, SKU e custo) para começar o catálogo desta empresa.')+'</p>'
          + (filtrado ? '' : '<button class="primary-btn enabled" id="prdEmptyNew" type="button">'+svg('plus')+'<span>Cadastrar produto</span></button>')
        + '</div>';
      } else {
        html += '<div class="table-card"><div class="table-wrap"><table class="data-table"><thead><tr>'
          + '<th>Produto</th><th>SKU</th><th>Custo</th><th>Status</th><th>Cadastrado em</th><th></th>'
          + '</tr></thead><tbody>'
          + state.items.map(p => '<tr class="'+(p.ativo?'':'inactive')+'">'
            + '<td>'+escapeHtml(p.nome)+'</td>'
            + '<td class="mono">'+escapeHtml(p.sku)+'</td>'
            + '<td class="mono">'+money(p.custo)+'</td>'

      const saveAliquota = document.getElementById('prdSaveAliquota');
      if(saveAliquota) saveAliquota.addEventListener('click', async ()=>{
        const val = Number(String(document.getElementById('prdAliquota').value).replace(',','.'));
        if(!Number.isFinite(val) || val<0 || val>100){ toast('Informe um percentual entre 0 e 100.', 'error'); return; }

        try{
          await apiConfig('/'+state.empresaId, { method:'PUT', body: JSON.stringify({ aliquotaImposto: val }) });
          state.aliquota = val;
          toast('Alíquota de imposto salva.');

        const id = b.dataset.toggle, next = b.dataset.next === 'true';
        b.disabled = true;

          await api('/'+id+'/status', { method:'PATCH', body: JSON.stringify({ ativo: next }) });
          toast(next ? 'Produto ativado.' : 'Produto desativado.');
          loadItens();
        }catch(err){ toast(err.message, 'error'); b.disabled = false; }

    function openModal(produto){

      const modalRoot = document.getElementById('modalRoot');
      modalRoot.innerHTML = '<div class="modal-overlay" id="modalOverlay">'
        + '<div class="modal-card">'
          + '<div class="modal-head"><div class="modal-title">'+(isEdit?'Editar produto':'Novo produto')+'</div>'
            + '<button class="row-ic-btn" id="modalClose" type="button">'+svg('x')+'</button></div>'
          + '<div class="modal-sub">'+(isEdit?'Atualize os dados do produto.':'Preencha os dados para cadastrar um novo produto no catálogo desta empresa.')+'</div>'
          + '<form id="prdForm">'
            + '<div class="field"><label>Nome do produto</label><input type="text" id="fNome" placeholder="Ex: Caixa de papelão 50x24x15" value="'+(isEdit?escapeHtml(produto.nome):'')+'" maxlength="200">'
              + '<div class="field-error" id="eNome" style="display:none;"></div></div>'
            + '<div class="field"><label>SKU</label><input type="text" id="fSku" list="skuSugestoesList" placeholder="Ex: CX-50X24X15" value="'+(isEdit?escapeHtml(produto.sku):'')+'" maxlength="100">'

              + '<div class="field-error" id="eSku" style="display:none;"></div></div>'

            + '</div>'
          + '</form>'
        + '</div>'
      + '</div>';

      const close = ()=> modalRoot.innerHTML = '';

      document.getElementById('modalClose').addEventListener('click', close);
      document.getElementById('modalCancel').addEventListener('click', close);
      document.getElementById('fNome').focus();

      // Sugestões de SKU puxadas direto dos pedidos (Mercado Livre + Shopee)
      // — pedido explícito do usuário (14/09/2026): evita digitar o SKU na
      // mão e errar (o que faz o custo nunca casar com a venda). Só
      // sugere, nunca preenche nada sem o usuário escolher.
      let sugestoesSku = [];
      const fSkuInput = document.getElementById('fSku');
      const skuHint = document.getElementById('skuSugestoesHint');
      if(skuHint) skuHint.textContent = 'Carregando sugestões de SKU dos pedidos…';
      apiSugestoesSku(state.empresaId).then(function(lista){
        sugestoesSku = lista;
        const datalist = document.getElementById('skuSugestoesList');
        if(!datalist) return; // modal já foi fechado antes da resposta chegar
        if(lista.length){
          datalist.innerHTML = lista.map(function(s){
            return '<option value="'+escapeHtml(s.sku)+'">'+escapeHtml(s.nomeSugerido||s.sku)+' — '+s.qtdPedidos+(s.qtdPedidos===1?' pedido':' pedidos')+' sem custo cadastrado</option>';
          }).join('');
          if(skuHint) skuHint.textContent = 'Comece a digitar pra ver SKUs que já apareceram em pedidos e ainda não têm custo cadastrado — escolher um da lista garante que bate certinho com a venda.';
        } else if(skuHint) {
          skuHint.textContent = isEdit ? '' : 'Nenhum SKU de pedido pendente de custo encontrado no momento — pode digitar o SKU manualmente.';
        }
      }).catch(function(){ if(skuHint) skuHint.textContent = ''; });

      if(fSkuInput && !isEdit){
        fSkuInput.addEventListener('input', function(){
          const sugestao = sugestoesSku.find(function(s){ return s.sku === fSkuInput.value; });

        const payload = {
          empresaId: state.empresaId,
          nome: document.getElementById('fNome').value,
          sku: document.getElementById('fSku').value,
          custo: Number(String(document.getElementById('fCusto').value).replace(',','.')),

        if(isEdit && toggleBtn) payload.ativo = toggleBtn.dataset.on === 'true';

        const saveBtn = document.getElementById('modalSave');
        saveBtn.disabled = true;
        try{
          if(isEdit) await api('/'+produto.id, { method:'PUT', body: JSON.stringify(payload) });
          else await api('', { method:'POST', body: JSON.stringify(payload) });
          close();
          toast(isEdit ? 'Produto atualizado.' : 'Produto cadastrado.');
          loadItens();
        }catch(err){
          saveBtn.disabled = false;
          if(err.errors){
            const fieldMap = { nome:'Nome', sku:'Sku', custo:'Custo' };
            Object.entries(err.errors).forEach(([k,msg])=>{
              const suf = fieldMap[k]; if(!suf) return;
              const el=document.getElementById('e'+suf); if(el){ el.textContent=msg; el.style.display='block'; }
              const input=document.getElementById('f'+suf); if(input) input.classList.add('invalid');

            toast(err.message, 'error');
          }
        }

    document.getElementById('btnNewProduto').addEventListener('click', ()=> openModal());

    window.Produtos = { load };
  })();

  /* ================= FORNECEDORES — cadastro por empresa =================
     Razão social/nome, nome fantasia, CNPJ ou CPF, telefone, e-mail,
     observação e status. Estrutura pronta para futuramente relacionar
     fornecedor a produtos e compras — a relação em si ainda não existe. */
  (function(){
    const state = { empresas:[], empresaId:null, loadingEmpresas:false, items:[], loading:false, error:null, status:'todos', search:'' };

    function toast(message, type){
      const wrap = document.getElementById('toastWrap');
      const el = document.createElement('div');
      el.className = 'toast ' + (type||'success');
      el.innerHTML = svg(type==='error' ? 'alertCircle':'checkCircle') + '<span>'+message+'</span>';
      wrap.appendChild(el);
      setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .25s'; setTimeout(()=>el.remove(),250); }, 3200);
    }
    function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function fmtDate(iso){ try{ return new Date(iso).toLocaleDateString('pt-BR'); }catch(e){ return '—'; } }

    function maskDocumento(v){
      const d = v.replace(/\D/g,'').slice(0,14);
      if(d.length <= 11){
        let out = d;
        if(d.length > 9) out = d.replace(/(\d{3})(\d{3})(\d{3})(\d{0,2})/, '$1.$2.$3-$4');
        else if(d.length > 6) out = d.replace(/(\d{3})(\d{3})(\d{0,3})/, '$1.$2.$3');
        else if(d.length > 3) out = d.replace(/(\d{3})(\d{0,3})/, '$1.$2');
        return out;
      }
      return d.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{0,2})/, '$1.$2.$3/$4-$5');
    }

    async function apiEmpresasAtivas(){
      const res = await fetch('/api/empresas?status=ativas');
      return ((await res.json()).empresas) || [];
    }
    async function api(path, opts){
      const res = await fetch('/api/fornecedores'+path, { headers:{'Content-Type':'application/json'}, ...opts });
      let body = null; try{ body = await res.json(); }catch(e){}
      if(!res.ok){ const err = new Error((body&&body.error)||'Falha na requisição.'); err.errors = body&&body.errors; throw err; }
      return body;
    }

    async function loadItens(){
      state.loading = true; state.error = null; render();
      try{
        const params = new URLSearchParams({ empresaId: state.empresaId });
        if(state.status !== 'todos') params.set('status', state.status);
        if(state.search.trim()) params.set('search', state.search.trim());
        const data = await api('?'+params.toString(), { method:'GET' });
        state.items = data.fornecedores;
      }catch(err){ state.error = err.message || 'Não foi possível carregar os fornecedores.'; }
      finally{ state.loading = false; render(); }
    }

    async function load(){
      state.loadingEmpresas = true; render();
      try{
        state.empresas = await apiEmpresasAtivas();
        if(!state.empresaId || !state.empresas.find(e=>e.id===state.empresaId)){
          state.empresaId = state.empresas.length ? state.empresas[0].id : null;
        }
      }catch(e){ state.empresas = []; }
      state.loadingEmpresas = false;
      if(state.empresaId) await loadItens(); else render();
    }

    function render(){
      const root = document.getElementById('fornecedoresRoot');
      if(!root) return;

      if(!state.loadingEmpresas && !state.empresas.length){
        root.innerHTML = '<div class="empty-panel"><div class="empty-icon">'+svg('building')+'</div>'
          + '<h2>Nenhuma empresa ativa</h2>'
          + '<p class="lead">Cadastre e ative uma empresa em <strong>Cadastros → Empresas</strong> antes de cadastrar fornecedores.</p></div>';
        return;
      }

      let html = '<div class="toolbar">'
        + '<div class="empresa-picker" style="margin-bottom:0;"><select id="forEmpresaSelect">'
          + state.empresas.map(e=>'<option value="'+e.id+'" '+(e.id===state.empresaId?'selected':'')+'>'+escapeHtml(e.nomeFantasia||e.razaoSocial)+'</option>').join('')
        + '</select></div>'
        + '<div class="seg" id="forSeg">'
          + [['todos','Todos'],['ativos','Ativos'],['inativos','Inativos']].map(function(par){ return '<button data-status="'+par[0]+'" class="'+(state.status===par[0]?'active':'')+'">'+par[1]+'</button>'; }).join('')
        + '</div>'
        + '<div class="search-box">'+svg('search')+'<input type="text" id="forSearch" placeholder="Buscar por razão social, fantasia ou CNPJ/CPF" value="'+state.search.replace(/"/g,'&quot;')+'"></div>'
      + '</div>';

      if(state.loading){
        html += '<div class="table-card"><div class="table-skel"><span class="spin"></span><span>Carregando fornecedores…</span></div></div>';
      } else if(state.error){
        html += '<div class="empty-panel"><div class="empty-icon" style="color:var(--danger); background:var(--danger-soft);">'+svg('alertCircle')+'</div>'
          + '<h2 style="color:var(--danger);">Não foi possível carregar</h2><p class="lead">'+escapeHtml(state.error)+'</p>'
          + '<button class="ghost-btn" id="forRetry" style="cursor:pointer; opacity:1;">'+svg('activity')+'<span>Tentar novamente</span></button></div>';
      } else if(!state.items.length){
        const filtrado = !!(state.search || state.status!=='todos');
        html += '<div class="empty-panel"><div class="empty-icon">'+svg('truck')+'</div>'
          + '<h2>Nenhum fornecedor encontrado</h2>'
          + '<p class="lead">'+(filtrado ? 'Nenhum fornecedor corresponde ao filtro atual.' : 'Cadastre o primeiro fornecedor (razão social e CNPJ/CPF) desta empresa.')+'</p>'
          + (filtrado ? '' : '<button class="primary-btn enabled" id="forEmptyNew" type="button">'+svg('plus')+'<span>Cadastrar fornecedor</span></button>')
        + '</div>';
      } else {
        html += '<div class="table-card"><div class="table-wrap"><table class="data-table"><thead><tr>'
          + '<th>Fornecedor</th><th>CNPJ/CPF</th><th>Telefone</th><th>E-mail</th><th>Status</th><th></th>'
          + '</tr></thead><tbody>'
          + state.items.map(f => '<tr class="'+(f.ativo?'':'inactive')+'">'
            + '<td><div class="company-name">'+escapeHtml(f.razaoSocial)+'</div>'+(f.nomeFantasia?'<div class="company-fantasy">'+escapeHtml(f.nomeFantasia)+'</div>':'')+'</td>'
            + '<td class="mono">'+escapeHtml(f.documentoFormatado)+'</td>'
            + '<td class="mono">'+escapeHtml(f.telefone||'—')+'</td>'
            + '<td class="mono">'+escapeHtml(f.email||'—')+'</td>'
            + '<td>'+(f.ativo ? '<span class="badge-status on"><span class="dot"></span>Ativo</span>' : '<span class="badge-status off"><span class="dot"></span>Inativo</span>')+'</td>'
            + '<td><div class="row-actions">'
              + '<button class="row-ic-btn" data-edit="'+f.id+'" title="Editar" type="button">'+svg('edit')+'</button>'
              + '<button class="row-ic-btn '+(f.ativo?'danger':'success')+'" data-toggle="'+f.id+'" data-next="'+(!f.ativo)+'" title="'+(f.ativo?'Desativar':'Ativar')+'" type="button">'+svg('power')+'</button>'
            + '</div></td>'
          + '</tr>').join('')
          + '</tbody></table></div></div>';
      }

      root.innerHTML = html;

      const sel = document.getElementById('forEmpresaSelect');
      if(sel) sel.addEventListener('change', ()=>{ state.empresaId = Number(sel.value); loadItens(); });
      const seg = document.getElementById('forSeg');
      if(seg) seg.querySelectorAll('button').forEach(b=> b.addEventListener('click', ()=>{ state.status = b.dataset.status; loadItens(); }));
      const search = document.getElementById('forSearch');
      if(search) search.addEventListener('input', ()=>{
        state.search = search.value;
        clearTimeout(search._t);
        search._t = setTimeout(loadItens, 300);
      });
      const retry = document.getElementById('forRetry');
      if(retry) retry.addEventListener('click', loadItens);
      const emptyNew = document.getElementById('forEmptyNew');
      if(emptyNew) emptyNew.addEventListener('click', ()=> openModal());
      root.querySelectorAll('[data-edit]').forEach(b=> b.addEventListener('click', ()=>{
        const f = state.items.find(x=> String(x.id)===b.dataset.edit);
        openModal(f);
      }));
      root.querySelectorAll('[data-toggle]').forEach(b=> b.addEventListener('click', async ()=>{
        const id = b.dataset.toggle, next = b.dataset.next === 'true';
        b.disabled = true;
        try{
          await api('/'+id+'/status', { method:'PATCH', body: JSON.stringify({ ativo: next }) });
          toast(next ? 'Fornecedor ativado.' : 'Fornecedor desativado.');
          loadItens();
        }catch(err){ toast(err.message, 'error'); b.disabled = false; }
      }));
    }

    function openModal(fornecedor){
      const isEdit = !!fornecedor;
      const modalRoot = document.getElementById('modalRoot');
      modalRoot.innerHTML = '<div class="modal-overlay" id="modalOverlay">'
        + '<div class="modal-card">'
          + '<div class="modal-head"><div class="modal-title">'+(isEdit?'Editar fornecedor':'Novo fornecedor')+'</div>'
            + '<button class="row-ic-btn" id="modalClose" type="button">'+svg('x')+'</button></div>'
          + '<div class="modal-sub">'+(isEdit?'Atualize os dados do fornecedor.':'Preencha os dados para cadastrar um novo fornecedor desta empresa.')+'</div>'
          + '<form id="forForm">'
            + '<div class="field"><label>Razão social / Nome</label><input type="text" id="fRazao" placeholder="Razão social ou nome completo" value="'+(isEdit?escapeHtml(fornecedor.razaoSocial):'')+'" maxlength="200">'

            + '<div class="field"><label>E-mail <span class="opt">(opcional)</span></label><input type="text" id="fEmail" placeholder="contato@fornecedor.com" value="'+(isEdit?escapeHtml(fornecedor.email||''):'')+'" maxlength="255">'

            + '<div class="field"><label>Observação <span class="opt">(opcional)</span></label><input type="text" id="fObservacao" placeholder="Condições, contato, observações gerais" value="'+(isEdit?escapeHtml(fornecedor.observacao||''):'')+'"></div>'
            + (isEdit ? '<div class="toggle-row"><div><div class="toggle-row-label">Fornecedor ativo</div><div class="toggle-row-sub">Fornecedores inativos ficam ocultos nas seleções do sistema.</div></div>'
              + '<button type="button" class="toggle '+(fornecedor.ativo?'on':'')+'" id="fAtivo" data-on="'+(fornecedor.ativo?'true':'false')+'"></button></div>' : '')
            + '<div class="modal-actions">'
              + '<button type="button" class="btn-secondary" id="modalCancel">Cancelar</button>'
              + '<button type="submit" class="btn-primary" id="modalSave">'+svg('check')+'<span>'+(isEdit?'Salvar alterações':'Cadastrar fornecedor')+'</span></button>'
            + '</div>'
          + '</form>'
        + '</div>'
      + '</div>';

      const overlay = document.getElementById('modalOverlay');
      const close = ()=> modalRoot.innerHTML = '';
      overlay.addEventListener('click', (e)=>{ if(e.target === overlay) close(); });
      document.getElementById('modalClose').addEventListener('click', close);
      document.getElementById('modalCancel').addEventListener('click', close);

      docInput.addEventListener('input', ()=>{ docInput.value = maskDocumento(docInput.value); });
      document.getElementById('fRazao').focus();

      const toggleBtn = document.getElementById('fAtivo');
      if(toggleBtn) toggleBtn.addEventListener('click', ()=>{
        const on = toggleBtn.dataset.on !== 'true';
        toggleBtn.dataset.on = String(on);

      document.getElementById('forForm').addEventListener('submit', async (e)=>{

        ['fRazao','fDocumento','fEmail'].forEach(id=> document.getElementById(id).classList.remove('invalid'));

          loadItens();
        }catch(err){
