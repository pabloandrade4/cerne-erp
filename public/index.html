    visaoFisica: true,
  });

  /* ================= COMPRAS — primeira versão simples =================
     Criar, listar, editar, pesquisar e mudar status de pedidos de compra a
     um fornecedor. Sem IA de compras e sem automatizar entrada de estoque
     ao marcar "Recebido" nesta etapa (pedido explícito do usuário). */
  (function(){
    const STATUS_OPCOES = [
      ['em_aberto','Em aberto'],
      ['pedido_realizado','Pedido realizado'],
      ['recebido','Recebido'],
      ['cancelado','Cancelado'],
    ];
    const STATUS_LABEL = Object.fromEntries(STATUS_OPCOES);
    const state = { empresas:[], empresaId:null, loadingEmpresas:false, items:[], loading:false, error:null, status:'todos', search:'' };

    function toast(message, type){
      const wrap = document.getElementById('toastWrap');
      const el = document.createElement('div');
      el.className = 'toast ' + (type||'success');
      el.innerHTML = svg(type==='error' ? 'alertCircle':'checkCircle') + '<span>'+message+'</span>';
      wrap.appendChild(el);
      setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .25s'; setTimeout(()=>el.remove(),250); }, 3200);
    }
    function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function money(v){ return 'R$ ' + Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2}); }
    function fmtDate(iso){ if(!iso) return '—'; try{ const [y,m,d] = String(iso).slice(0,10).split('-'); return d+'/'+m+'/'+y; }catch(e){ return '—'; } }

    async function apiEmpresasAtivas(){
      const res = await fetch('/api/empresas?status=ativas');
      return ((await res.json()).empresas) || [];
    }
    async function api(path, opts){
      const res = await fetch('/api/compras'+path, { headers:{'Content-Type':'application/json'}, ...opts });
      let body = null; try{ body = await res.json(); }catch(e){}
      if(!res.ok){ const err = new Error((body&&body.error)||'Falha na requisição.'); err.errors = body&&body.errors; throw err; }
      return body;
    }
    async function apiFornecedoresAtivos(empresaId){
      const res = await fetch('/api/fornecedores?empresaId='+empresaId+'&status=ativos');
      return ((await res.json()).fornecedores) || [];
    }
    async function apiProdutosAtivos(empresaId){
      const res = await fetch('/api/produtos?empresaId='+empresaId+'&status=ativos');
      return ((await res.json()).produtos) || [];
    }

    async function loadItens(){
      state.loading = true; state.error = null; render();
      try{
        const params = new URLSearchParams({ empresaId: state.empresaId });
        if(state.status !== 'todos') params.set('status', state.status);
        if(state.search.trim()) params.set('search', state.search.trim());
        const data = await api('?'+params.toString(), { method:'GET' });
        state.items = data.compras;
      }catch(err){ state.error = err.message || 'Não foi possível carregar as compras.'; }
      finally{ state.loading = false; render(); }
    }

    async function load(){
      state.loadingEmpresas = true; render();
      try{
        state.empresas = await apiEmpresasAtivas();
        if(!state.empresaId || !state.empresas.find(e=>e.id===state.empresaId)){
          state.empresaId = state.empresas.length ? state.empresas[0].id : null;
        }
      }catch(e){ state.empresas = []; }
      state.loadingEmpresas = false;
      if(state.empresaId) await loadItens(); else render();
    }

    function render(){
      const root = document.getElementById('comprasRoot');
      if(!root) return;

      if(!state.loadingEmpresas && !state.empresas.length){
        root.innerHTML = '<div class="empty-panel"><div class="empty-icon">'+svg('building')+'</div>'
          + '<h2>Nenhuma empresa ativa</h2>'
          + '<p class="lead">Cadastre e ative uma empresa em <strong>Cadastros → Empresas</strong> antes de registrar compras.</p></div>';
        return;
      }

      let html = '<div class="toolbar">'
        + '<div class="empresa-picker" style="margin-bottom:0;"><select id="cmpEmpresaSelect">'
          + state.empresas.map(e=>'<option value="'+e.id+'" '+(e.id===state.empresaId?'selected':'')+'>'+escapeHtml(e.nomeFantasia||e.razaoSocial)+'</option>').join('')
        + '</select></div>'
        + '<div class="seg" id="cmpSeg">'
          + [['todos','Todos']].concat(STATUS_OPCOES).map(function(par){ return '<button data-status="'+par[0]+'" class="'+(state.status===par[0]?'active':'')+'">'+par[1]+'</button>'; }).join('')
        + '</div>'
        + '<div class="search-box">'+svg('search')+'<input type="text" id="cmpSearch" placeholder="Buscar por fornecedor" value="'+state.search.replace(/"/g,'&quot;')+'"></div>'
      + '</div>';

      if(state.loading){
        html += '<div class="table-card"><div class="table-skel"><span class="spin"></span><span>Carregando compras…</span></div></div>';
      } else if(state.error){
        html += '<div class="empty-panel"><div class="empty-icon" style="color:var(--danger); background:var(--danger-soft);">'+svg('alertCircle')+'</div>'
          + '<h2 style="color:var(--danger);">Não foi possível carregar</h2><p class="lead">'+escapeHtml(state.error)+'</p>'
          + '<button class="ghost-btn" id="cmpRetry" style="cursor:pointer; opacity:1;">'+svg('activity')+'<span>Tentar novamente</span></button></div>';
      } else if(!state.items.length){
        const filtrado = !!(state.search || state.status!=='todos');
        html += '<div class="empty-panel"><div class="empty-icon">'+svg('cart')+'</div>'
          + '<h2>Nenhuma compra encontrada</h2>'
          + '<p class="lead">'+(filtrado ? 'Nenhuma compra corresponde ao filtro atual.' : 'Crie o primeiro pedido de compra desta empresa.')+'</p>'
          + (filtrado ? '' : '<button class="primary-btn enabled" id="cmpEmptyNew" type="button">'+svg('plus')+'<span>Nova compra</span></button>')
        + '</div>';
      } else {
        html += '<div class="table-card"><div class="table-wrap"><table class="data-table"><thead><tr>'
          + '<th>Data</th><th>Fornecedor</th><th>Itens</th><th>Valor total</th><th>Previsão de chegada</th><th>Status</th><th></th>'
          + '</tr></thead><tbody>'
          + state.items.map(c => '<tr>'
            + '<td class="tab-nums">'+fmtDate(c.dataCompra)+'</td>'
            + '<td>'+escapeHtml(c.fornecedorNome||'—')+'</td>'
            + '<td class="tab-nums">'+(c.qtdItens!==undefined?c.qtdItens:'—')+'</td>'
            + '<td class="mono">'+money(c.valorTotal)+'</td>'
            + '<td class="tab-nums">'+fmtDate(c.previsaoChegada)+'</td>'
            + '<td><select class="mono" data-status-select="'+c.id+'" style="font-size:11.5px; padding:4px 8px; border-radius:8px; border:1px solid var(--border); background:var(--surface-2); color:var(--text);">'
              + STATUS_OPCOES.map(function(par){ return '<option value="'+par[0]+'" '+(c.status===par[0]?'selected':'')+'>'+par[1]+'</option>'; }).join('')
            + '</select></td>'
            + '<td><div class="row-actions">'
              + '<button class="row-ic-btn" data-edit="'+c.id+'" title="Editar" type="button">'+svg('edit')+'</button>'
            + '</div></td>'
          + '</tr>').join('')
          + '</tbody></table></div></div>';
      }

      root.innerHTML = html;

      const sel = document.getElementById('cmpEmpresaSelect');
      if(sel) sel.addEventListener('change', ()=>{ state.empresaId = Number(sel.value); loadItens(); });
      const seg = document.getElementById('cmpSeg');
      if(seg) seg.querySelectorAll('button').forEach(b=> b.addEventListener('click', ()=>{ state.status = b.dataset.status; loadItens(); }));
      const search = document.getElementById('cmpSearch');
      if(search) search.addEventListener('input', ()=>{
        state.search = search.value;
        clearTimeout(search._t);
        search._t = setTimeout(loadItens, 300);
      });
      const retry = document.getElementById('cmpRetry');
      if(retry) retry.addEventListener('click', loadItens);
      const emptyNew = document.getElementById('cmpEmptyNew');
      if(emptyNew) emptyNew.addEventListener('click', ()=> openModal());
      root.querySelectorAll('[data-edit]').forEach(b=> b.addEventListener('click', async ()=>{
        try{
          const data = await api('/'+b.dataset.edit, { method:'GET' });
          openModal(data.compra);
        }catch(err){ toast(err.message, 'error'); }
      }));
      root.querySelectorAll('[data-status-select]').forEach(sel=> sel.addEventListener('change', async ()=>{
        const id = sel.dataset.statusSelect;
        sel.disabled = true;
        try{
          await api('/'+id+'/status', { method:'PATCH', body: JSON.stringify({ status: sel.value }) });
          toast('Status da compra atualizado.');
          loadItens();
        }catch(err){ toast(err.message, 'error'); sel.disabled = false; }
      }));
    }

    function openModal(compra){
      const isEdit = !!compra;
      let itens = isEdit && compra.itens && compra.itens.length
        ? compra.itens.map(function(it){ return { produtoId:it.produtoId, quantidade:it.quantidade, custoUnitario:it.custoUnitario, nome:it.produtoNome, sku:it.produtoSku }; })
        : [{ produtoId:null, quantidade:1, custoUnitario:0 }];
      let rowSeq = 0;
      itens.forEach(function(it){ it._rowId = 'r'+(rowSeq++); });

      const modalRoot = document.getElementById('modalRoot');
      modalRoot.innerHTML = '<div class="modal-overlay" id="modalOverlay">'
        + '<div class="modal-card" style="max-width:640px;">'
          + '<div class="modal-head"><div class="modal-title">'+(isEdit?'Editar compra':'Nova compra')+'</div>'
            + '<button class="row-ic-btn" id="modalClose" type="button">'+svg('x')+'</button></div>'
          + '<div class="modal-sub">'+(isEdit?'Atualize os dados do pedido de compra.':'Preencha os dados para registrar um novo pedido de compra.')+'</div>'
          + '<form id="cmpForm">'
            + '<div class="field"><label>Fornecedor</label><select id="fFornecedor"><option value="">Carregando…</option></select>'
              + '<div class="field-error" id="eFornecedor" style="display:none;"></div></div>'
            + '<div class="inline-form" style="margin-top:0;">'
              + '<div class="field narrow"><label>Data da compra</label><input type="date" id="fData" value="'+(isEdit&&compra.dataCompra?String(compra.dataCompra).slice(0,10):new Date().toISOString().slice(0,10))+'"></div>'
              + '<div class="field narrow"><label>Previsão de chegada <span class="opt">(opcional)</span></label><input type="date" id="fPrevisao" value="'+(isEdit&&compra.previsaoChegada?String(compra.previsaoChegada).slice(0,10):'')+'"></div>'
            + '</div>'
            + '<div class="field"><label>Observação <span class="opt">(opcional)</span></label><input type="text" id="fObservacao" placeholder="Observações gerais da compra" value="'+(isEdit?escapeHtml(compra.observacao||''):'')+'"></div>'
            + '<div class="section-label"><span>Itens da compra</span></div>'
            + '<div id="cmpItensList"></div>'
            + '<div class="field-error" id="eItens" style="display:none; margin-bottom:10px;"></div>'
            + '<button type="button" class="ghost-btn" id="cmpAddItem" style="cursor:pointer; opacity:1; margin-bottom:14px;">'+svg('plus')+'<span>Adicionar item</span></button>'
            + '<div class="bd-row total" style="margin-bottom:14px;"><span class="bd-label">Valor total da compra</span><span class="bd-value" id="cmpTotalGeral">R$ 0,00</span></div>'
            + '<div class="modal-actions">'
              + '<button type="button" class="btn-secondary" id="modalCancel">Cancelar</button>'
              + '<button type="submit" class="btn-primary" id="modalSave">'+svg('check')+'<span>'+(isEdit?'Salvar alterações':'Criar compra')+'</span></button>'
            + '</div>'
          + '</form>'
        + '</div>'
      + '</div>';

      const overlay = document.getElementById('modalOverlay');
      const close = ()=> modalRoot.innerHTML = '';
      overlay.addEventListener('click', (e)=>{ if(e.target === overlay) close(); });
      document.getElementById('modalClose').addEventListener('click', close);
      document.getElementById('modalCancel').addEventListener('click', close);

      let produtosAtivos = [];

      function calcularTotal(){
        return itens.reduce(function(acc, it){ return acc + (Number(it.quantidade)||0) * (Number(it.custoUnitario)||0); }, 0);
      }

      function renderItens(){
        const list = document.getElementById('cmpItensList');
        if(!list) return;
        list.innerHTML = itens.map(function(it, idx){
          const totalItem = (Number(it.quantidade)||0) * (Number(it.custoUnitario)||0);
          const produtoAindaAtivo = it.produtoId && produtosAtivos.some(function(p){ return p.id === Number(it.produtoId); });
          const opcaoInativa = (it.produtoId && !produtoAindaAtivo)
            ? '<option value="'+it.produtoId+'" selected>'+escapeHtml(it.nome||('Produto #'+it.produtoId))+(it.sku?' ('+escapeHtml(it.sku)+')':'')+' — inativo</option>'
            : '';
          const opcoesProduto = '<option value="">Selecione…</option>' + opcaoInativa + produtosAtivos.map(function(p){
            return '<option value="'+p.id+'" '+(Number(it.produtoId)===p.id?'selected':'')+'>'+escapeHtml(p.nome)+' ('+escapeHtml(p.sku)+')</option>';
          }).join('');
          return '<div class="inline-form" data-item-row="'+it._rowId+'" style="align-items:flex-end; margin-bottom:8px;">'
            + '<div class="field" style="min-width:200px; margin-bottom:0;"><label>Produto</label><select data-item-produto="'+it._rowId+'">'+opcoesProduto+'</select></div>'
            + '<div class="field narrow" style="margin-bottom:0;"><label>Quantidade</label><input type="text" inputmode="numeric" data-item-qtd="'+it._rowId+'" value="'+it.quantidade+'"></div>'
            + '<div class="field narrow" style="margin-bottom:0;"><label>Custo unitário</label><input type="text" inputmode="decimal" data-item-custo="'+it._rowId+'" value="'+String(it.custoUnitario).replace('.',',')+'"></div>'
            + '<div class="field narrow" style="margin-bottom:0;"><label>Total do item</label><input type="text" value="'+money(totalItem)+'" disabled></div>'
            + (itens.length > 1 ? '<button type="button" class="row-ic-btn danger" data-item-remove="'+it._rowId+'" title="Remover item" style="margin-bottom:2px;">'+svg('x')+'</button>' : '<span style="width:36px;"></span>')
          + '</div>';
        }).join('');

        list.querySelectorAll('[data-item-produto]').forEach(function(sel){
          sel.addEventListener('change', function(){
            const row = itens.find(function(it){ return it._rowId === sel.dataset.itemProduto; });
            if(row) row.produtoId = sel.value ? Number(sel.value) : null;
          });
        });
        list.querySelectorAll('[data-item-qtd]').forEach(function(input){
          input.addEventListener('input', function(){
            const row = itens.find(function(it){ return it._rowId === input.dataset.itemQtd; });
            if(row){ row.quantidade = input.value; renderItens(); atualizarTotalGeral(); posicionarFoco(input.dataset.itemQtd,'qtd'); }
          });
        });
        list.querySelectorAll('[data-item-custo]').forEach(function(input){
          input.addEventListener('input', function(){
            const row = itens.find(function(it){ return it._rowId === input.dataset.itemCusto; });
            if(row){ row.custoUnitario = input.value.replace(',','.'); renderItens(); atualizarTotalGeral(); posicionarFoco(input.dataset.itemCusto,'custo'); }
          });
        });
        list.querySelectorAll('[data-item-remove]').forEach(function(btn){
          btn.addEventListener('click', function(){
            itens = itens.filter(function(it){ return it._rowId !== btn.dataset.itemRemove; });
            renderItens();
            atualizarTotalGeral();
          });
        });
      }

      // Reposiciona o cursor no campo que estava sendo editado depois de um
      // re-render (evita perder o foco a cada tecla digitada).
      let focoPendente = null;
      function posicionarFoco(rowId, campo){
        focoPendente = { rowId, campo };
        requestAnimationFrame(function(){
          if(!focoPendente) return;
          const seletor = focoPendente.campo === 'qtd' ? '[data-item-qtd="'+focoPendente.rowId+'"]' : '[data-item-custo="'+focoPendente.rowId+'"]';
          const el = document.querySelector(seletor);
          if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
          focoPendente = null;
        });
      }

      function atualizarTotalGeral(){
        const el = document.getElementById('cmpTotalGeral');
        if(el) el.textContent = money(calcularTotal());
      }

      document.getElementById('cmpAddItem').addEventListener('click', function(){
        itens.push({ produtoId:null, quantidade:1, custoUnitario:0, _rowId:'r'+(rowSeq++) });
        renderItens();
        atualizarTotalGeral();
      });

      (async function carregarPickers(){
        try{
          const [fornecedores, produtos] = await Promise.all([
            apiFornecedoresAtivos(state.empresaId),
            apiProdutosAtivos(state.empresaId),
          ]);
          produtosAtivos = produtos;
          const fSel = document.getElementById('fFornecedor');
          if(fSel){
            fSel.innerHTML = fornecedores.length
              ? fornecedores.map(function(f){ return '<option value="'+f.id+'" '+(isEdit&&compra.fornecedorId===f.id?'selected':'')+'>'+escapeHtml(f.razaoSocial)+'</option>'; }).join('')
              : '<option value="">Nenhum fornecedor ativo cadastrado</option>';
          }
          renderItens();
          atualizarTotalGeral();
        }catch(e){
          toast('Não foi possível carregar fornecedores/produtos.', 'error');
        }
      })();

      document.getElementById('cmpForm').addEventListener('submit', async (e)=>{
        e.preventDefault();
        ['eFornecedor','eItens'].forEach(id=>{ const el=document.getElementById(id); el.style.display='none'; el.textContent=''; });

        const payload = {
          empresaId: state.empresaId,
          fornecedorId: Number(document.getElementById('fFornecedor').value),
          dataCompra: document.getElementById('fData').value,
          previsaoChegada: document.getElementById('fPrevisao').value,
          observacao: document.getElementById('fObservacao').value,
          itens: itens.map(function(it){ return { produtoId: it.produtoId, quantidade: Number(it.quantidade), custoUnitario: Number(it.custoUnitario) }; }),
        };

        if(!payload.fornecedorId){
          const el = document.getElementById('eFornecedor'); el.textContent = 'Selecione o fornecedor.'; el.style.display = 'block';
          return;
        }

        const saveBtn = document.getElementById('modalSave');
        saveBtn.disabled = true;
        try{
          if(isEdit) await api('/'+compra.id, { method:'PUT', body: JSON.stringify(payload) });
          else await api('', { method:'POST', body: JSON.stringify(payload) });
          close();
          toast(isEdit ? 'Compra atualizada.' : 'Compra criada.');
          loadItens();
        }catch(err){
          saveBtn.disabled = false;
          if(err.errors){
            if(err.errors.fornecedorId){ const el=document.getElementById('eFornecedor'); el.textContent=err.errors.fornecedorId; el.style.display='block'; }
            if(err.errors.itens){ const el=document.getElementById('eItens'); el.textContent=err.errors.itens; el.style.display='block'; }
            if(!err.errors.fornecedorId && !err.errors.itens) toast(err.message, 'error');
          } else {
            toast(err.message, 'error');
          }
        }
      });
    }

    document.getElementById('btnNewCompra').addEventListener('click', ()=> openModal());

    window.Compras = { load };
  })();

  /* ================= CONTAS A PAGAR — lançamento manual, por empresa =================
     Ativado em 24/08/2026 (ver docs/04-alteracoes.md). Usa o filtro do
     HEADER (empresa + período — window.CerneFiltro) em vez de um seletor
     próprio dentro da tela, igual Visão Geral — pedido explícito do
     usuário nesta etapa ("os filtros de empresa e período do header devem
     funcionar nessas três telas"). "Vencido" é calculado no servidor
     (nunca gravado) — ver server/lib/contasPagar.js. */
  (function(){
    const STATUS_OPCOES = [
      ['pendente','Pendente'],
      ['vencido','Vencido'],
      ['pago','Pago'],
      ['cancelado','Cancelado'],
    ];
    const STATUS_LABEL = Object.fromEntries(STATUS_OPCOES);
    const state = { loading:false, error:null, contas:[], resumo:null, status:'todos', search:'' };

    function toast(message, type){
      const wrap = document.getElementById('toastWrap');
      const el = document.createElement('div');
      el.className = 'toast ' + (type||'success');
      el.innerHTML = svg(type==='error' ? 'alertCircle':'checkCircle') + '<span>'+message+'</span>';
      wrap.appendChild(el);
      setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .25s'; setTimeout(()=>el.remove(),250); }, 3200);
    }
    function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function money(v){ return v===null||v===undefined ? '—' : 'R$ ' + Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2}); }
    function fmtDate(iso){ if(!iso) return '—'; try{ const [y,m,d] = String(iso).slice(0,10).split('-'); return d+'/'+m+'/'+y; }catch(e){ return '—'; } }
    // "Hoje" em America/Sao_Paulo (fuso fixo, UTC-3 — Brasil não usa mais
    // horário de verão desde 2019), mesmo cálculo do backend (lib/periodo.js/
    // diaBRT). NUNCA usar new Date().toISOString().slice(0,10) puro aqui: isso
    // pega o dia em UTC, que já virou o dia seguinte entre 21h e 23h59 no
    // horário de Brasília — a data de vencimento/pagamento sugerida ficaria
    // adiantada em 1 dia bem no fim do dia.
    function hojeBRT(){
      const BRT_OFFSET_MS = 3*60*60*1000;
      const brt = new Date(Date.now() - BRT_OFFSET_MS);
      const p = n => String(n).padStart(2,'0');
      return brt.getUTCFullYear()+'-'+p(brt.getUTCMonth()+1)+'-'+p(brt.getUTCDate());
    }
    function tintVars(tint){ return tint==='muted' ? '--tint:var(--text-muted);--tint-soft:var(--surface-2);' : '--tint:var(--'+tint+');--tint-soft:var(--'+tint+'-soft);'; }
    function secCardHTML(k){
      return '<div class="kpi-sec" style="'+tintVars(k.tint)+'">'
        + '<div class="kpi-sec-icon">'+svg(k.icon)+'</div>'
        + '<div class="kpi-sec-body"><div class="kpi-sec-label">'+k.label+'</div><div class="kpi-sec-value">'+k.valueHtml+'</div></div></div>';
    }
    function statusChipStyle(status){
      const cor = status==='pago' ? 'success' : status==='vencido' ? 'danger' : status==='cancelado' ? 'text-muted' : 'warning';
      const bg = status==='cancelado' ? 'var(--surface-2)' : 'var(--'+cor+'-soft)';
      return 'color:var(--'+cor+');background:'+bg+';';
    }

    async function api(path, opts){
      const res = await fetch('/api/contas-pagar'+path, { headers:{'Content-Type':'application/json'}, ...opts });
      let body = null; try{ body = await res.json(); }catch(e){}
      if(!res.ok){ const err = new Error((body&&(body.error||(body.errors&&body.errors.geral)))||'Falha na requisição.'); err.errors = body&&body.errors; throw err; }
      return body;
    }
    async function apiFornecedoresAtivos(empresaId){
      const res = await fetch('/api/fornecedores?empresaId='+empresaId+'&status=ativos');
      return ((await res.json()).fornecedores) || [];
    }
    // Cadastro real de categorias financeiras (31/08/2026) — substitui a
    // antiga lista fixa de sugestões por texto livre (CATEGORIAS_SUGERIDAS)
    // por um cadastro de verdade, editável por empresa, com um único nível
    // de subcategoria — ver lib/categoriasFinanceiras.js.
    async function apiCategoriasFinanceiras(empresaId, incluirInativas){
      const params = new URLSearchParams({ empresaId: empresaId });
      if(incluirInativas) params.set('incluirInativas','true');
      const res = await fetch('/api/categorias-financeiras?'+params.toString());
      const body = await res.json();
      return body.categorias || [];
    }
    async function apiContasBancariasAtivas(empresaId){
      const res = await fetch('/api/contas-bancarias?empresaId='+empresaId);
      const body = await res.json();
      return ((body.contas)||[]).filter(c=>c.ativo!==false);
    }

    async function loadContas(){
      const filtro = window.CerneFiltro.state;
      if(!filtro.empresaId){ state.contas=[]; state.resumo=null; state.loading=false; render(); return; }
      state.loading = true; state.error = null; render();
      try{
        const params = new URLSearchParams({ empresaId: filtro.empresaId, periodo: filtro.periodo });
        if(filtro.periodo === 'personalizado'){ if(filtro.desdePersonalizado) params.set('desde', filtro.desdePersonalizado); if(filtro.atePersonalizado) params.set('ate', filtro.atePersonalizado); }
        if(state.status !== 'todos') params.set('status', state.status);
        if(state.search.trim()) params.set('search', state.search.trim());
        const data = await api('?'+params.toString(), { method:'GET' });
        state.contas = data.contas; state.resumo = data.resumo;
      }catch(err){ state.error = err.message || 'Não foi possível carregar as contas a pagar.'; }
      finally{ state.loading = false; render(); }
    }

    function load(){ loadContas(); }

    window.CerneFiltro.onChange(()=>{
      const page = document.getElementById('page-payable');
      if(page && page.classList.contains('active')) loadContas();
      else render();
    });

    function kpisHTML(r){
      const cards = [
        { label:'Total a pagar', icon:'arrowUpCircle', tint:'copper', valueHtml: money(r.totalAPagar) },
        { label:'Vencendo hoje', icon:'clock', tint: r.vencendoHoje>0?'warning':'muted', valueHtml: money(r.vencendoHoje) },
        { label:'Vencidas', icon:'alertCircle', tint: r.vencidas>0?'danger':'muted', valueHtml: money(r.vencidas) },
        { label:'Pagas no período', icon:'checkCircle', tint:'success', valueHtml: money(r.pagasNoPeriodo) },
      ];
      return '<div class="kpi-sec-grid" style="margin-bottom:14px;">' + cards.map(secCardHTML).join('') + '</div>';
    }

    function render(){
      const root = document.getElementById('contasPagarRoot');
      if(!root) return;
      const filtro = window.CerneFiltro.state;

      if(!filtro.loadingEmpresas && !filtro.empresas.length){
        root.innerHTML = '<div class="empty-panel"><div class="empty-icon">'+svg('building')+'</div>'
          + '<h2>Nenhuma empresa ativa</h2>'
          + '<p class="lead">Cadastre e ative uma empresa em <strong>Cadastros → Empresas</strong> antes de lançar contas a pagar.</p></div>';
        return;
      }

      let html = '';
      if(state.resumo) html += kpisHTML(state.resumo);

      html += '<div class="toolbar">'
        + '<div class="seg" id="cpSeg">'
          + [['todos','Todos']].concat(STATUS_OPCOES).map(function(par){ return '<button data-status="'+par[0]+'" class="'+(state.status===par[0]?'active':'')+'">'+par[1]+'</button>'; }).join('')
        + '</div>'
        + '<div class="search-box">'+svg('search')+'<input type="text" id="cpSearch" placeholder="Buscar por CR, descrição, categoria ou fornecedor" value="'+state.search.replace(/"/g,'&quot;')+'"></div>'
      + '</div>';

      if(state.loading || filtro.loadingEmpresas){
        html += '<div class="table-card"><div class="table-skel"><span class="spin"></span><span>Carregando contas a pagar…</span></div></div>';
      } else if(state.error){
        html += '<div class="empty-panel"><div class="empty-icon" style="color:var(--danger); background:var(--danger-soft);">'+svg('alertCircle')+'</div>'
          + '<h2 style="color:var(--danger);">Não foi possível carregar</h2><p class="lead">'+escapeHtml(state.error)+'</p>'
          + '<button class="ghost-btn" id="cpRetry" style="cursor:pointer; opacity:1;">'+svg('activity')+'<span>Tentar novamente</span></button></div>';
      } else if(!state.contas.length){
        const filtrado = !!(state.search || state.status!=='todos');
        html += '<div class="empty-panel"><div class="empty-icon">'+svg('arrowUpCircle')+'</div>'
          + '<h2>Nenhuma conta a pagar encontrada</h2>'
          + '<p class="lead">'+(filtrado ? 'Nenhuma conta corresponde ao filtro atual.' : 'Cadastre a primeira conta a pagar desta empresa no período selecionado.')+'</p>'
          + (filtrado ? '' : '<button class="primary-btn enabled" id="cpEmptyNew" type="button">'+svg('plus')+'<span>Nova conta a pagar</span></button>')
        + '</div>';
      } else {
        html += '<div class="table-card"><div class="table-wrap"><table class="data-table"><thead><tr>'
          + '<th>Vencimento</th><th>Descrição</th><th>Categoria</th><th>Fornecedor</th><th>Valor</th><th>Status</th><th></th>'
          + '</tr></thead><tbody>'
          + state.contas.map(c => '<tr'+(c.status==='cancelado'?' style="opacity:.6;"':'')+'>'
            + '<td class="tab-nums">'+fmtDate(c.vencimento)+'</td>'
            + '<td>'+escapeHtml(c.descricao)+(c.documento?'<div class="di-sub"><strong>CR '+escapeHtml(c.documento)+'</strong></div>':'')+(c.observacao?'<div class="di-sub">'+escapeHtml(c.observacao)+'</div>':'')+'</td>'
            + '<td>'+escapeHtml(c.categoria||'—')+'</td>'
            + '<td>'+escapeHtml(c.fornecedorNome||'—')+'</td>'
            + '<td class="mono">'+money(c.valor)+'</td>'
            + '<td><span class="status-chip" style="'+statusChipStyle(c.status)+'">'+STATUS_LABEL[c.status]+'</span>'
              + (c.status==='pago' ? '<div class="di-sub">pago em '+fmtDate(c.dataPagamento)+'</div>' : '')+'</td>'
            + '<td><div class="row-actions">'
              + (c.statusBase==='pendente' ? '<button class="row-ic-btn" data-pagar="'+c.id+'" title="Marcar como pago" type="button">'+svg('check')+'</button>' : '')
              + (c.statusBase!=='cancelado' ? '<button class="row-ic-btn" data-edit="'+c.id+'" title="Editar" type="button">'+svg('edit')+'</button>' : '')
              + (c.statusBase==='pendente' ? '<button class="row-ic-btn" data-cancelar="'+c.id+'" title="Cancelar" type="button">'+svg('x')+'</button>' : '')
              + (c.statusBase!=='pago' ? '<button class="row-ic-btn danger" data-excluir="'+c.id+'" title="Excluir" type="button">'+svg('trash')+'</button>' : '')
            + '</div></td>'
          + '</tr>').join('')
          + '</tbody></table></div></div>';
      }

      root.innerHTML = html;

      const seg = document.getElementById('cpSeg');
      if(seg) seg.querySelectorAll('button').forEach(b=> b.addEventListener('click', ()=>{ state.status = b.dataset.status; loadContas(); }));
      const search = document.getElementById('cpSearch');
      if(search) search.addEventListener('input', ()=>{
        state.search = search.value;
        clearTimeout(search._t);
        search._t = setTimeout(loadContas, 300);
      });
      const retry = document.getElementById('cpRetry');
      if(retry) retry.addEventListener('click', loadContas);
      const emptyNew = document.getElementById('cpEmptyNew');
      if(emptyNew) emptyNew.addEventListener('click', ()=> openModal());

      root.querySelectorAll('[data-edit]').forEach(b=> b.addEventListener('click', ()=>{
        const conta = state.contas.find(c=>String(c.id)===b.dataset.edit);
        if(conta) openModal(conta);
      }));
      root.querySelectorAll('[data-pagar]').forEach(b=> b.addEventListener('click', async ()=>{
        const hoje = hojeBRT();
        b.disabled = true;
        try{ await api('/'+b.dataset.pagar+'/pagar', { method:'PATCH', body: JSON.stringify({ dataPagamento: hoje }) }); toast('Conta marcada como paga.'); loadContas(); }
        catch(err){ toast(err.message,'error'); b.disabled = false; }
      }));
      root.querySelectorAll('[data-cancelar]').forEach(b=> b.addEventListener('click', async ()=>{
        b.disabled = true;
        try{ await api('/'+b.dataset.cancelar+'/cancelar', { method:'PATCH' }); toast('Conta cancelada.'); loadContas(); }
        catch(err){ toast(err.message,'error'); b.disabled = false; }
      }));
      root.querySelectorAll('[data-excluir]').forEach(b=> b.addEventListener('click', async ()=>{
        b.disabled = true;
        try{ await api('/'+b.dataset.excluir, { method:'DELETE' }); toast('Conta excluída.'); loadContas(); }
        catch(err){ toast(err.message,'error'); b.disabled = false; }
      }));
    }

    // Gerenciar categorias financeiras (31/08/2026) — cadastro real por
    // empresa, editável direto do formulário de Contas a Pagar (link
    // "gerenciar categorias"). Abre em cima do modal de conta a pagar (sua
    // própria overlay anexada ao <body>, sem tocar em modalRoot) pra não
    // perder o que já foi digitado no formulário por trás. Nunca exclui
    // categoria de verdade — só ativa/desativa, ver lib/categoriasFinanceiras.js.
    function openCategoriasModal(onClose){
      const empresaId = window.CerneFiltro.state.empresaId;
      const wrap = document.createElement('div');
      wrap.className = 'modal-overlay';
      wrap.style.zIndex = '10000';
      document.body.appendChild(wrap);
      const st = { categorias: [], loading: true };

      function close(){ wrap.remove(); if(onClose) onClose(); }

      function linhaHtml(c, sub){
        return '<tr'+(!c.ativa?' style="opacity:.55;"':'')+'>'
          + '<td>'+(sub?'↳ ':'')+escapeHtml(c.nome)+'</td>'
          + '<td><span class="status-chip" style="'+(c.ativa?'color:var(--success);background:var(--success-soft);':'color:var(--text-muted);background:var(--surface-2);')+'">'+(c.ativa?'Ativa':'Desativada')+'</span></td>'
          + '<td><div class="row-actions">'
            + '<button class="row-ic-btn" type="button" data-renomear="'+c.id+'" data-nome-atual="'+escapeHtml(c.nome)+'" title="Renomear">'+svg('edit')+'</button>'
            + '<button class="row-ic-btn" type="button" data-toggle-ativa="'+c.id+'" data-ativar-agora="'+(c.ativa?'0':'1')+'" title="'+(c.ativa?'Desativar':'Ativar')+'">'+svg(c.ativa?'x':'check')+'</button>'
          + '</div></td></tr>';
      }

      function render(){
        let rows = '';
        st.categorias.forEach(function(raiz){
          rows += linhaHtml(raiz, false);
          (raiz.subcategorias||[]).forEach(function(s){ rows += linhaHtml(s, true); });
        });
        wrap.innerHTML = '<div class="modal-card" style="max-width:640px;max-height:88vh;overflow:auto;">'
          + '<div class="modal-head"><div class="modal-title">Categorias financeiras</div><button class="row-ic-btn" id="catmClose" type="button">'+svg('x')+'</button></div>'
          + '<div class="modal-sub">Usadas em Contas a Pagar, no extrato bancário e na DRE. Desativar uma categoria nunca apaga o histórico de lançamentos já feitos com ela.</div>'
          + (st.loading
            ? '<div class="table-skel" style="margin-top:12px;"><span class="spin"></span><span>Carregando…</span></div>'
            : '<div class="table-card" style="margin-top:14px;"><div class="table-wrap"><table class="data-table"><thead><tr><th>Nome</th><th>Status</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div></div>')
          + '<form id="catmForm" style="margin-top:16px;">'
            + '<div class="inline-form" style="margin-top:0;">'
              + '<div class="field narrow"><label>Nova categoria/subcategoria</label><input type="text" id="catmNome" placeholder="Ex: Salgados"></div>'
              + '<div class="field narrow"><label>Subcategoria de <span class="opt">(opcional)</span></label><select id="catmPai"><option value="">Categoria própria (nível principal)</option>'
                + st.categorias.filter(function(r){return r.ativa;}).map(function(r){ return '<option value="'+r.id+'">'+escapeHtml(r.nome)+'</option>'; }).join('') + '</select></div>'
            + '</div>'
            + '<div class="modal-actions"><button type="button" class="btn-secondary" id="catmClose2">Fechar</button><button type="submit" class="btn-primary" id="catmSalvar">'+svg('plus')+'<span>Adicionar</span></button></div>'
          + '</form>'
        + '</div>';

        document.getElementById('catmClose').addEventListener('click', close);
        document.getElementById('catmClose2').addEventListener('click', close);
        wrap.addEventListener('click', function(e){ if(e.target===wrap) close(); });

        wrap.querySelectorAll('[data-toggle-ativa]').forEach(function(btn){
          btn.addEventListener('click', async function(){
            btn.disabled = true;
            const id = btn.dataset.toggleAtiva;
            const ativarAgora = btn.dataset.ativarAgora === '1';
            try{ await fetch('/api/categorias-financeiras/'+id+(ativarAgora?'/ativar':'/desativar'), { method:'PATCH' }); await carregar(); }
            catch(e){ toast('Não foi possível atualizar a categoria.', 'error'); btn.disabled=false; }
          });
        });
        wrap.querySelectorAll('[data-renomear]').forEach(function(btn){
          btn.addEventListener('click', async function(){
            const id = btn.dataset.renomear;
            const atual = btn.dataset.nomeAtual;
            const novo = prompt('Novo nome da categoria:', atual);
            if(!novo || !novo.trim() || novo.trim()===atual) return;
            try{
              const res = await fetch('/api/categorias-financeiras/'+id, { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({nome: novo.trim()}) });
              const body = await res.json().catch(function(){return {};});
              if(!res.ok) throw new Error((body.errors&&body.errors.nome)||'Não foi possível renomear.');
              await carregar();
            }catch(e){ toast(e.message,'error'); }
          });
        });

        document.getElementById('catmForm').addEventListener('submit', async function(e){
          e.preventDefault();
          const nome = document.getElementById('catmNome').value.trim();
          const categoriaPaiId = document.getElementById('catmPai').value || null;
          if(!nome){ toast('Informe o nome da categoria.', 'error'); return; }
          const btn = document.getElementById('catmSalvar'); btn.disabled = true;
          try{
            const res = await fetch('/api/categorias-financeiras', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({empresaId:empresaId, nome:nome, categoriaPaiId:categoriaPaiId}) });
            const body = await res.json().catch(function(){return {};});
            if(!res.ok) throw new Error((body.errors&&(body.errors.nome||body.errors.categoriaPaiId))||'Não foi possível criar a categoria.');
            toast('Categoria criada.');
            await carregar();
          }catch(err){ toast(err.message,'error'); btn.disabled=false; }
        });
      }

      async function carregar(){
        st.loading = true; render();
        try{ st.categorias = await apiCategoriasFinanceiras(empresaId, true); }
        catch(e){ toast('Não foi possível carregar as categorias.', 'error'); }
        finally{ st.loading = false; render(); }
      }

      carregar();
    }

      async function carregarPickers(){
        const empresaId = window.CerneFiltro.state.empresaId;

    function openImportModal(){
      const empresaId = Number(window.CerneFiltro.state.empresaId);
      if(!empresaId){ toast('Selecione uma empresa antes de importar.', 'error'); return; }

      const CAMPOS = [
        ['documento','CR',false], ['descricao','Descrição',true], ['categoria','Categoria',false],
        ['fornecedor','Fornecedor',false], ['valor','Valor',true], ['vencimento','Vencimento',true],
        ['observacao','Observação',false]
      ];
      const imp = { nomeArquivo:'', colunas:[], linhas:[], mapeamento:{}, preview:null, force:new Set(), loading:false };
      const modalRoot = document.getElementById('modalRoot');
      const close = ()=> modalRoot.innerHTML='';

      async function fetchJson(url, opts){
        const res = await fetch(url, opts);
        let body=null; try{ body=await res.json(); }catch(e){}
        if(!res.ok) throw new Error((body&&body.error)||'Falha na importação.');
        return body;
      }

      function shell(conteudo, largura){
        modalRoot.innerHTML = '<div class="modal-overlay" id="cpImpOverlay">'
          + '<div class="modal-card" style="max-width:'+(largura||'980px')+';max-height:92vh;overflow:auto;">'
            + '<div class="modal-head"><div class="modal-title">Importar Contas a Pagar</div>'
              + '<button class="row-ic-btn" id="cpImpClose" type="button">'+svg('x')+'</button></div>'
            + conteudo
          + '</div></div>';
        document.getElementById('cpImpClose').addEventListener('click', close);
        document.getElementById('cpImpOverlay').addEventListener('click', e=>{ if(e.target.id==='cpImpOverlay') close(); });
      }

      function renderInicio(){
        shell('<div class="modal-sub">As contas serão importadas para a <strong>empresa selecionada no cabeçalho</strong> e entrarão na mesma base usada pelo Fluxo de Caixa.</div>'
          + '<div class="empty-panel" style="margin-top:16px;padding:28px 20px;">'
            + '<div class="empty-icon">'+svg('fileText')+'</div>'
            + '<h2>Selecione sua planilha</h2><p class="lead">Aceita CSV ou Excel (.xlsx), até 5.000 linhas.</p>'
            + '<input type="file" id="cpImpFile" accept=".csv,.xlsx" style="display:none;">'
            + '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px;">'
              + '<button class="primary-btn enabled" id="cpImpChoose" type="button">'+svg('fileText')+'<span>Escolher arquivo</span></button>'
              + '<a class="ghost-btn" href="/api/contas-pagar/importar/modelo" style="cursor:pointer;opacity:1;">'+svg('download')+'<span>Baixar modelo</span></a>'
            + '</div>'
          + '</div>', '680px');
        const input=document.getElementById('cpImpFile');
        document.getElementById('cpImpChoose').addEventListener('click', ()=>input.click());
        input.addEventListener('change', async ()=>{
          const file=input.files&&input.files[0]; if(!file) return;
          if(file.size > 10*1024*1024){ toast('Arquivo maior que 10 MB.', 'error'); return; }
          const nome=file.name.toLowerCase();
          if(!nome.endsWith('.csv') && !nome.endsWith('.xlsx')){ toast('Envie um arquivo CSV ou XLSX.', 'error'); return; }
          const btn=document.getElementById('cpImpChoose'); btn.disabled=true; btn.querySelector('span').textContent='Lendo arquivo…';
          try{
            const data=await fetchJson('/api/contas-pagar/importar/ler', { method:'POST', headers:{'Content-Type':'application/octet-stream','X-File-Name':encodeURIComponent(file.name)}, body:file });
            imp.nomeArquivo=data.nomeArquivo; imp.colunas=data.colunas||[]; imp.linhas=data.linhas||[]; imp.mapeamento=data.mapeamentoSugerido||{}; imp.preview=null; imp.force=new Set();
            renderMapeamento();
          }catch(err){ toast(err.message,'error'); btn.disabled=false; btn.querySelector('span').textContent='Escolher arquivo'; }
        });
      }

      function selectCampo(key){
        const atual=imp.mapeamento[key]||'';
        return '<select data-map="'+key+'"><option value="">Não importar</option>'
          + imp.colunas.map(c=>'<option value="'+escapeHtml(c)+'" '+(c===atual?'selected':'')+'>'+escapeHtml(c)+'</option>').join('')
          + '</select>';
      }

      function renderMapeamento(){
        const rows=CAMPOS.map(c=>'<tr><td><strong>'+c[1]+'</strong>'+(c[2]?'<span style="color:var(--danger);"> *</span>':'')+'</td><td>'+selectCampo(c[0])+'</td></tr>').join('');
        shell('<div class="modal-sub">Arquivo: <strong>'+escapeHtml(imp.nomeArquivo)+'</strong> · '+imp.linhas.length+' linha(s). Confira o mapeamento antes da prévia.</div>'
          + '<div class="table-card" style="margin-top:16px;"><div class="table-wrap"><table class="data-table"><thead><tr><th>Campo no PF Embalagens</th><th>Coluna da planilha</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'
          + '<div class="field-hint" style="margin-top:10px;">A planilha segue o cadastro manual: CR, Descrição, Categoria, Fornecedor, Valor, Vencimento e Observação. Obrigatórios: Descrição, Vencimento e Valor.</div>'
          + '<div class="modal-actions"><button class="btn-secondary" id="cpImpTrocar" type="button">Trocar arquivo</button><button class="btn-primary" id="cpImpPreview" type="button">'+svg('check')+'<span>Validar e ver prévia</span></button></div>');
        document.querySelectorAll('[data-map]').forEach(sel=>sel.addEventListener('change', ()=>{ if(sel.value) imp.mapeamento[sel.dataset.map]=sel.value; else delete imp.mapeamento[sel.dataset.map]; imp.preview=null; }));
        document.getElementById('cpImpTrocar').addEventListener('click', renderInicio);
        document.getElementById('cpImpPreview').addEventListener('click', gerarPreview);
      }

      async function gerarPreview(){
        const faltam=['descricao','vencimento','valor'].filter(k=>!imp.mapeamento[k]);
        if(faltam.length){ toast('Mapeie Descrição, Vencimento e Valor.', 'error'); return; }
        const btn=document.getElementById('cpImpPreview'); btn.disabled=true; btn.querySelector('span').textContent='Validando…';
        try{
          imp.preview=await fetchJson('/api/contas-pagar/importar/preview', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({empresaId, linhas:imp.linhas, mapeamento:imp.mapeamento}) });
          imp.force=new Set(); renderPreview();
        }catch(err){ toast(err.message,'error'); btn.disabled=false; btn.querySelector('span').textContent='Validar e ver prévia'; }
      }

      function renderPreview(){
        const r=imp.preview.resumo;
        const cards=[
          ['Linhas',r.total,'muted'], ['Prontas',r.prontas,'success'], ['Duplicidades',r.duplicidades,r.duplicidades?'warning':'muted'], ['Com erro',r.erros,r.erros?'danger':'muted']
        ].map(x=>'<div class="kpi-sec" style="'+tintVars(x[2])+'"><div class="kpi-sec-body"><div class="kpi-sec-label">'+x[0]+'</div><div class="kpi-sec-value">'+x[1]+'</div></div></div>').join('');
        const itens=(imp.preview.itens||[]).slice(0,500);
        const linhasHtml=itens.map(it=>{
          const d=it.dados||{};
          const label=it.status==='pronto'?'Pronto':it.status==='duplicidade'?'Possível duplicidade':'Erro';
          const style=it.status==='pronto'?'color:var(--success);background:var(--success-soft);':it.status==='duplicidade'?'color:var(--warning);background:var(--warning-soft);':'color:var(--danger);background:var(--danger-soft);';
          const force=it.status==='duplicidade' ? '<label style="display:flex;align-items:center;gap:6px;font-size:11px;white-space:nowrap;"><input type="checkbox" data-force="'+it.linha+'"> Importar mesmo assim</label>' : '';
          return '<tr><td class="tab-nums">'+it.linha+'</td><td><span class="status-chip" style="'+style+'">'+label+'</span>'+force+'</td>'
            + '<td>'+escapeHtml(d.fornecedorNomeImportado||'')+(d.fornecedorId?'Fornecedor cadastrado #'+d.fornecedorId:(d.fornecedorNomeImportado?'':'—'))+'</td>'
            + '<td>'+escapeHtml(d.descricao||'')+(it.erros&&it.erros.length?'<div class="di-sub" style="color:var(--danger);">'+escapeHtml(it.erros.join(' · '))+'</div>':'')+'</td>'
            + '<td>'+escapeHtml(d.documento||'—')+(d.parcela?'<div class="di-sub">Parcela '+escapeHtml(d.parcela)+'</div>':'')+'</td>'
            + '<td class="tab-nums">'+fmtDate(d.vencimento)+'</td><td class="mono">'+(d.valor?money(d.valor):'—')+'</td></tr>';
        }).join('');
        shell('<div class="modal-sub">Revise antes de gravar. Linhas com erro nunca são importadas; duplicidades ficam ignoradas, a menos que você marque “Importar mesmo assim”.</div>'
          + '<div class="kpi-sec-grid" style="margin-top:16px;margin-bottom:14px;">'+cards+'</div>'
          + '<div class="table-card"><div class="table-wrap"><table class="data-table"><thead><tr><th>Linha</th><th>Validação</th><th>Fornecedor</th><th>Descrição</th><th>CR</th><th>Vencimento</th><th>Valor</th></tr></thead><tbody>'+linhasHtml+'</tbody></table></div></div>'
          + ((imp.preview.itens||[]).length>500?'<div class="field-hint" style="margin-top:8px;">Mostrando as primeiras 500 linhas na prévia; todas serão processadas na confirmação.</div>':'')
          + '<div class="modal-actions"><button class="btn-secondary" id="cpImpBack" type="button">Voltar ao mapeamento</button><button class="btn-primary" id="cpImpConfirm" type="button">'+svg('check')+'<span>Confirmar importação</span></button></div>');
        document.querySelectorAll('[data-force]').forEach(ch=>ch.addEventListener('change', ()=>{ const n=Number(ch.dataset.force); if(ch.checked) imp.force.add(n); else imp.force.delete(n); }));
        document.getElementById('cpImpBack').addEventListener('click', renderMapeamento);
        document.getElementById('cpImpConfirm').addEventListener('click', confirmar);
      }

      async function confirmar(){
        const btn=document.getElementById('cpImpConfirm'); btn.disabled=true; btn.querySelector('span').textContent='Importando…';
        try{
          const result=await fetchJson('/api/contas-pagar/importar/confirmar', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ empresaId, nomeArquivo:imp.nomeArquivo, linhas:imp.linhas, mapeamento:imp.mapeamento, forceLinhas:Array.from(imp.force) }) });
          close();
          toast(result.importadas+' conta(s) importada(s).'+(result.duplicidadesIgnoradas?' '+result.duplicidadesIgnoradas+' duplicidade(s) ignorada(s).':'')+(result.erros?' '+result.erros+' linha(s) com erro.':''));
          loadContas();
        }catch(err){ toast(err.message,'error'); btn.disabled=false; btn.querySelector('span').textContent='Confirmar importação'; }
      }

      renderInicio();
    }

    document.getElementById('btnNewContaPagar').addEventListener('click', ()=> openModal());
    document.getElementById('btnImportContasPagar').addEventListener('click', ()=> openImportModal());

    window.ContasPagar = { load };
  })();

  /* ================= CONTAS A RECEBER — lançamento manual, por empresa =================
     Ativado em 24/08/2026 — simétrico a Contas a Pagar acima (mesmo uso do
     filtro do header, mesma filosofia de status calculado). */
  (function(){
    const STATUS_OPCOES = [
      ['a_receber','A receber'],
      ['atrasado','Atrasado'],
      ['recebido','Recebido'],
      ['cancelado','Cancelado'],
    ];
    const STATUS_LABEL = Object.fromEntries(STATUS_OPCOES);
    const state = { loading:false, error:null, contas:[], resumo:null, status:'todos', search:'' };
    let origensSugeridas = null;

    function toast(message, type){
      const wrap = document.getElementById('toastWrap');
      const el = document.createElement('div');
      el.className = 'toast ' + (type||'success');
      el.innerHTML = svg(type==='error' ? 'alertCircle':'checkCircle') + '<span>'+message+'</span>';
      wrap.appendChild(el);
      setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .25s'; setTimeout(()=>el.remove(),250); }, 3200);
    }
    function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function money(v){ return v===null||v===undefined ? '—' : 'R$ ' + Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2}); }
    function fmtDate(iso){ if(!iso) return '—'; try{ const [y,m,d] = String(iso).slice(0,10).split('-'); return d+'/'+m+'/'+y; }catch(e){ return '—'; } }
    function tintVars(tint){ return tint==='muted' ? '--tint:var(--text-muted);--tint-soft:var(--surface-2);' : '--tint:var(--'+tint+');--tint-soft:var(--'+tint+'-soft);'; }
    function secCardHTML(k){
      return '<div class="kpi-sec" style="'+tintVars(k.tint)+'">'
        + '<div class="kpi-sec-icon">'+svg(k.icon)+'</div>'
        + '<div class="kpi-sec-body"><div class="kpi-sec-label">'+k.label+'</div><div class="kpi-sec-value">'+k.valueHtml+'</div></div></div>';
    }
    function statusChipStyle(status){
      const cor = status==='recebido' ? 'success' : status==='atrasado' ? 'danger' : status==='cancelado' ? 'text-muted' : 'warning';
      const bg = status==='cancelado' ? 'var(--surface-2)' : 'var(--'+cor+'-soft)';
      return 'color:var(--'+cor+');background:'+bg+';';
    }

    async function api(path, opts){
      const res = await fetch('/api/contas-receber'+path, { headers:{'Content-Type':'application/json'}, ...opts });
      let body = null; try{ body = await res.json(); }catch(e){}
      if(!res.ok){ const err = new Error((body&&(body.error||(body.errors&&body.errors.geral)))||'Falha na requisição.'); err.errors = body&&body.errors; throw err; }
      return body;
    }
    async function apiOrigens(){
      if(origensSugeridas) return origensSugeridas;
      try{ const res = await fetch('/api/contas-receber/origens-sugeridas'); origensSugeridas = ((await res.json()).origens)||[]; }
      catch(e){ origensSugeridas = []; }
      return origensSugeridas;
    }

    async function loadContas(){
      const filtro = window.CerneFiltro.state;
      if(!filtro.empresaId){ state.contas=[]; state.resumo=null; state.loading=false; render(); return; }
      state.loading = true; state.error = null; render();
      try{
        const params = new URLSearchParams({ empresaId: filtro.empresaId, periodo: filtro.periodo });
        if(filtro.periodo === 'personalizado'){ if(filtro.desdePersonalizado) params.set('desde', filtro.desdePersonalizado); if(filtro.atePersonalizado) params.set('ate', filtro.atePersonalizado); }
        if(state.status !== 'todos') params.set('status', state.status);
        if(state.search.trim()) params.set('search', state.search.trim());
        const data = await api('?'+params.toString(), { method:'GET' });
        state.contas = data.contas; state.resumo = data.resumo;
      }catch(err){ state.error = err.message || 'Não foi possível carregar as contas a receber.'; }
      finally{ state.loading = false; render(); }
    }

    function load(){ loadContas(); }

    window.CerneFiltro.onChange(()=>{
      const page = document.getElementById('page-receivable');
      if(page && page.classList.contains('active')) loadContas();
      else render();
    });

    function kpisHTML(r){
      const cards = [
        { label:'Total a receber', icon:'arrowDownCircle', tint:'copper', valueHtml: money(r.totalAReceber) },
        { label:'Previsto para hoje', icon:'clock', tint: r.previstoHoje>0?'warning':'muted', valueHtml: money(r.previstoHoje) },
        { label:'Atrasado', icon:'alertCircle', tint: r.atrasado>0?'danger':'muted', valueHtml: money(r.atrasado) },
        { label:'Recebido no período', icon:'checkCircle', tint:'success', valueHtml: money(r.recebidoNoPeriodo) },
      ];
      return '<div class="kpi-sec-grid" style="margin-bottom:14px;">' + cards.map(secCardHTML).join('') + '</div>';
    }

    function render(){
      const root = document.getElementById('contasReceberRoot');
      if(!root) return;
      const filtro = window.CerneFiltro.state;

      if(!filtro.loadingEmpresas && !filtro.empresas.length){
        root.innerHTML = '<div class="empty-panel"><div class="empty-icon">'+svg('building')+'</div>'
          + '<h2>Nenhuma empresa ativa</h2>'
          + '<p class="lead">Cadastre e ative uma empresa em <strong>Cadastros → Empresas</strong> antes de lançar contas a receber.</p></div>';
        return;
      }

      let html = '';
      if(state.resumo) html += kpisHTML(state.resumo);

      html += '<div class="toolbar">'
        + '<div class="seg" id="crSeg">'
          + [['todos','Todos']].concat(STATUS_OPCOES).map(function(par){ return '<button data-status="'+par[0]+'" class="'+(state.status===par[0]?'active':'')+'">'+par[1]+'</button>'; }).join('')
        + '</div>'
        + '<div class="search-box">'+svg('search')+'<input type="text" id="crSearch" placeholder="Buscar por descrição ou origem" value="'+state.search.replace(/"/g,'&quot;')+'"></div>'
      + '</div>';

      if(state.loading || filtro.loadingEmpresas){
        html += '<div class="table-card"><div class="table-skel"><span class="spin"></span><span>Carregando contas a receber…</span></div></div>';
      } else if(state.error){
        html += '<div class="empty-panel"><div class="empty-icon" style="color:var(--danger); background:var(--danger-soft);">'+svg('alertCircle')+'</div>'
          + '<h2 style="color:var(--danger);">Não foi possível carregar</h2><p class="lead">'+escapeHtml(state.error)+'</p>'
          + '<button class="ghost-btn" id="crRetry" style="cursor:pointer; opacity:1;">'+svg('activity')+'<span>Tentar novamente</span></button></div>';
      } else if(!state.contas.length){
        const filtrado = !!(state.search || state.status!=='todos');
        html += '<div class="empty-panel"><div class="empty-icon">'+svg('arrowDownCircle')+'</div>'
          + '<h2>Nenhuma conta a receber encontrada</h2>'
          + '<p class="lead">'+(filtrado ? 'Nenhuma conta corresponde ao filtro atual.' : 'Cadastre o primeiro lançamento a receber desta empresa no período selecionado.')+'</p>'
          + (filtrado ? '' : '<button class="primary-btn enabled" id="crEmptyNew" type="button">'+svg('plus')+'<span>Nova conta a receber</span></button>')
        + '</div>';
      } else {
        html += '<div class="table-card"><div class="table-wrap"><table class="data-table"><thead><tr>'
          + '<th>Prevista</th><th>Descrição</th><th>Origem</th><th>Valor</th><th>Status</th><th></th>'
          + '</tr></thead><tbody>'
          + state.contas.map(c => '<tr'+(c.status==='cancelado'?' style="opacity:.6;"':'')+'>'
            + '<td class="tab-nums">'+fmtDate(c.dataPrevista)+'</td>'
            + '<td>'+escapeHtml(c.descricao)+(c.observacao?'<div class="di-sub">'+escapeHtml(c.observacao)+'</div>':'')+'</td>'
            + '<td>'+escapeHtml(c.origem||'—')+'</td>'
            + '<td class="mono">'+money(c.valor)+'</td>'
            + '<td><span class="status-chip" style="'+statusChipStyle(c.status)+'">'+STATUS_LABEL[c.status]+'</span>'
              + (c.status==='recebido' ? '<div class="di-sub">recebido em '+fmtDate(c.dataRecebida)+'</div>' : '')+'</td>'
            + '<td><div class="row-actions">'
              + (c.statusBase==='a_receber' ? '<button class="row-ic-btn" data-receber="'+c.id+'" title="Marcar como recebido" type="button">'+svg('check')+'</button>' : '')
              + (c.statusBase==='a_receber' ? '<button class="row-ic-btn" data-edit="'+c.id+'" title="Editar" type="button">'+svg('edit')+'</button>' : '')
              + (c.statusBase==='a_receber' ? '<button class="row-ic-btn" data-cancelar="'+c.id+'" title="Cancelar" type="button">'+svg('x')+'</button>' : '')
              + (c.statusBase!=='recebido' ? '<button class="row-ic-btn danger" data-excluir="'+c.id+'" title="Excluir" type="button">'+svg('trash')+'</button>' : '')
            + '</div></td>'
          + '</tr>').join('')
          + '</tbody></table></div></div>';
      }

      root.innerHTML = html;

      const seg = document.getElementById('crSeg');
      if(seg) seg.querySelectorAll('button').forEach(b=> b.addEventListener('click', ()=>{ state.status = b.dataset.status; loadContas(); }));
      const search = document.getElementById('crSearch');
      if(search) search.addEventListener('input', ()=>{
        state.search = search.value;
        clearTimeout(search._t);
        search._t = setTimeout(loadContas, 300);
      });
      const retry = document.getElementById('crRetry');
      if(retry) retry.addEventListener('click', loadContas);
      const emptyNew = document.getElementById('crEmptyNew');
      if(emptyNew) emptyNew.addEventListener('click', ()=> openModal());

      root.querySelectorAll('[data-edit]').forEach(b=> b.addEventListener('click', ()=>{
        const conta = state.contas.find(c=>String(c.id)===b.dataset.edit);
        if(conta) openModal(conta);
      }));
      root.querySelectorAll('[data-receber]').forEach(b=> b.addEventListener('click', async ()=>{
        const hoje = new Date().toISOString().slice(0,10);
        b.disabled = true;
        try{ await api('/'+b.dataset.receber+'/receber', { method:'PATCH', body: JSON.stringify({ dataRecebida: hoje }) }); toast('Conta marcada como recebida.'); loadContas(); }
        catch(err){ toast(err.message,'error'); b.disabled = false; }
      }));
      root.querySelectorAll('[data-cancelar]').forEach(b=> b.addEventListener('click', async ()=>{
        b.disabled = true;
        try{ await api('/'+b.dataset.cancelar+'/cancelar', { method:'PATCH' }); toast('Conta cancelada.'); loadContas(); }
        catch(err){ toast(err.message,'error'); b.disabled = false; }
      }));
      root.querySelectorAll('[data-excluir]').forEach(b=> b.addEventListener('click', async ()=>{
        b.disabled = true;
        try{ await api('/'+b.dataset.excluir, { method:'DELETE' }); toast('Conta excluída.'); loadContas(); }
        catch(err){ toast(err.message,'error'); b.disabled = false; }
      }));
    }

    function openModal(conta){
      const isEdit = !!conta;
      const modalRoot = document.getElementById('modalRoot');
      const amanha = new Date(Date.now()+24*60*60*1000).toISOString().slice(0,10);
      modalRoot.innerHTML = '<div class="modal-overlay" id="modalOverlay">'
        + '<div class="modal-card" style="max-width:560px;">'
          + '<div class="modal-head"><div class="modal-title">'+(isEdit?'Editar conta a receber':'Nova conta a receber')+'</div>'
            + '<button class="row-ic-btn" id="modalClose" type="button">'+svg('x')+'</button></div>'
          + '<div class="modal-sub">'+(isEdit?'Atualize os dados da conta a receber.':'Preencha os dados para lançar uma nova conta a receber.')+'</div>'
          + '<form id="crForm">'
            + '<div class="field"><label>Descrição</label><input type="text" id="fDescricao" placeholder="Ex: Recebível cliente X" value="'+(isEdit?escapeHtml(conta.descricao):'')+'">'
              + '<div class="field-error" id="eDescricao" style="display:none;"></div></div>'
            + '<div class="field"><label>Origem <span class="opt">(opcional)</span></label><input type="text" id="fOrigem" list="dlOrigensReceber" value="'+(isEdit?escapeHtml(conta.origem||''):'')+'"><datalist id="dlOrigensReceber"></datalist></div>'
            + '<div class="inline-form" style="margin-top:0;">'
              + '<div class="field narrow"><label>Valor</label><input type="text" inputmode="decimal" id="fValor" value="'+(isEdit?String(conta.valor).replace('.',','):'')+'">'
                + '<div class="field-error" id="eValor" style="display:none;"></div></div>'
              + '<div class="field narrow"><label>Data prevista</label><input type="date" id="fDataPrevista" value="'+(isEdit?conta.dataPrevista:amanha)+'">'
                + '<div class="field-error" id="eDataPrevista" style="display:none;"></div></div>'
            + '</div>'
            + '<div class="field"><label>Observação <span class="opt">(opcional)</span></label><input type="text" id="fObservacao" value="'+(isEdit?escapeHtml(conta.observacao||''):'')+'"></div>'
            + '<div class="modal-actions">'
              + '<button type="button" class="btn-secondary" id="modalCancel">Cancelar</button>'
              + '<button type="submit" class="btn-primary" id="modalSave">'+svg('check')+'<span>'+(isEdit?'Salvar alterações':'Criar conta')+'</span></button>'
            + '</div>'
          + '</form>'
        + '</div>'
      + '</div>';

      const overlay = document.getElementById('modalOverlay');
      const close = ()=> modalRoot.innerHTML = '';
      overlay.addEventListener('click', (e)=>{ if(e.target === overlay) close(); });
      document.getElementById('modalClose').addEventListener('click', close);
      document.getElementById('modalCancel').addEventListener('click', close);

      (async function carregarPickers(){
        try{
          const origens = await apiOrigens();
          const dl = document.getElementById('dlOrigensReceber');
          if(dl) dl.innerHTML = origens.map(function(o){ return '<option value="'+escapeHtml(o)+'"></option>'; }).join('');
        }catch(e){}
      })();

      document.getElementById('crForm').addEventListener('submit', async (e)=>{
        e.preventDefault();
        ['eDescricao','eValor','eDataPrevista'].forEach(id=>{ const el=document.getElementById(id); el.style.display='none'; el.textContent=''; });

        const payload = {
          empresaId: window.CerneFiltro.state.empresaId,
          descricao: document.getElementById('fDescricao').value,
          origem: document.getElementById('fOrigem').value,
          valor: Number(document.getElementById('fValor').value.replace(',','.')),
          dataPrevista: document.getElementById('fDataPrevista').value,
          observacao: document.getElementById('fObservacao').value,
        };

        const saveBtn = document.getElementById('modalSave');
        saveBtn.disabled = true;
        try{
          if(isEdit) await api('/'+conta.id, { method:'PUT', body: JSON.stringify(payload) });
          else await api('', { method:'POST', body: JSON.stringify(payload) });
          close();
          toast(isEdit ? 'Conta atualizada.' : 'Conta a receber criada.');
          loadContas();
        }catch(err){
          saveBtn.disabled = false;
          if(err.errors){
            let mostrou = false;
            ['descricao','valor','dataPrevista'].forEach(function(campo){
              const elId = 'e'+campo.charAt(0).toUpperCase()+campo.slice(1);
              if(err.errors[campo] && document.getElementById(elId)){ const el=document.getElementById(elId); el.textContent=err.errors[campo]; el.style.display='block'; mostrou = true; }
            });
            if(!mostrou) toast(err.message, 'error');
          } else {
            toast(err.message, 'error');
          }
        }
      });
    }

    document.getElementById('btnNewContaReceber').addEventListener('click', ()=> openModal());

    window.ContasReceber = { load };
  })();

  /* ================= RECEBIMENTOS — repasses do Mercado Livre (somente leitura) =================
     Ativado em 24/08/2026. Diferente de Contas a Receber: aqui os dados vêm
     REAIS da sincronização do Mercado Livre (ver lib/recebimentosMl.js) —
     nenhum cadastro manual nesta etapa. Data de liberação, valor e data de
     recebimento reais ainda não vêm da API — mostrados como "Informação
     não disponível" (nunca inventados), preparando o terreno para a
     conciliação futura (valor esperado x valor repassado) pedida pelo
     usuário. */
  (function(){
    const state = { loading:false, error:null, recebimentos:[], contasBancarias:[], saldoConsolidado:null, loadingBancos:false };

    function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function money(v){ return v===null||v===undefined ? '<span class="dash">Informação não disponível</span>' : 'R$ ' + Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2}); }
    function fmtDate(iso){ if(!iso) return '<span class="dash">Informação não disponível</span>'; try{ return new Date(iso).toLocaleDateString('pt-BR'); }catch(e){ return '<span class="dash">Informação não disponível</span>'; } }
    const STATUS_LABEL = { a_liberar:'A liberar', disponivel:'Disponível', recebido:'Recebido', divergente:'Divergente' };
    function statusChipStyle(status){
      const cor = status==='recebido' ? 'success' : status==='divergente' ? 'danger' : status==='disponivel' ? 'teal' : 'warning';
      return 'color:var(--'+cor+');background:var(--'+cor+'-soft);';
    }
    function toast(message, type){
      const wrap = document.getElementById('toastWrap');
      const el = document.createElement('div');
      el.className = 'toast ' + (type||'success');
      el.innerHTML = svg(type==='error' ? 'alertCircle':'checkCircle') + '<span>'+message+'</span>';
      wrap.appendChild(el);
      setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .25s'; setTimeout(()=>el.remove(),250); }, 3200);
    }

    async function api(path){
      const res = await fetch('/api/recebimentos'+path);
      let body = null; try{ body = await res.json(); }catch(e){}
      if(!res.ok) throw new Error((body&&body.error)||'Falha na requisição.');
      return body;
    }

    async function apiBancos(path, opts){
      const res = await fetch('/api/contas-bancarias'+path, opts ? { headers:{'Content-Type':'application/json'}, ...opts } : undefined);
      let body = null; try{ body = await res.json(); }catch(e){}
      if(!res.ok) throw new Error((body&&body.error)||'Falha na requisição.');
      return body;
    }

    async function loadContasBancarias(){
      const filtro = window.CerneFiltro.state;
      if(!filtro.empresaId){ state.contasBancarias=[]; state.saldoConsolidado=null; return; }
      state.loadingBancos = true;
      try{
        const data = await apiBancos('?'+new URLSearchParams({empresaId:filtro.empresaId}).toString());
        state.contasBancarias = data.contas||[]; state.saldoConsolidado = data.saldoConsolidado||null;
      }catch(err){ state.contasBancarias=[]; state.saldoConsolidado=null; }
      finally{ state.loadingBancos = false; }
    }

    async function loadRecebimentos(){
      const filtro = window.CerneFiltro.state;
      if(!filtro.empresaId){ state.recebimentos=[]; state.contasBancarias=[]; state.saldoConsolidado=null; state.loading=false; render(); return; }
      state.loading = true; state.error = null; render();
      try{
        const params = new URLSearchParams({ empresaId: filtro.empresaId, periodo: filtro.periodo });
        if(filtro.periodo === 'personalizado'){ if(filtro.desdePersonalizado) params.set('desde', filtro.desdePersonalizado); if(filtro.atePersonalizado) params.set('ate', filtro.atePersonalizado); }
        const [data] = await Promise.all([ api('?'+params.toString()), loadContasBancarias() ]);
        state.recebimentos = data.recebimentos;
      }catch(err){ state.error = err.message || 'Não foi possível carregar os recebimentos.'; }
      finally{ state.loading = false; render(); }
    }

    function load(){ loadRecebimentos(); }

    window.CerneFiltro.onChange(()=>{
      const page = document.getElementById('page-settlements');
      if(page && page.classList.contains('active')) loadRecebimentos();
      else render();
    });

    function render(){
      const root = document.getElementById('recebimentosRoot');
      if(!root) return;
      const filtro = window.CerneFiltro.state;

      if(!filtro.loadingEmpresas && !filtro.empresas.length){
        root.innerHTML = '<div class="empty-panel"><div class="empty-icon">'+svg('building')+'</div>'
          + '<h2>Nenhuma empresa ativa</h2>'
          + '<p class="lead">Cadastre e ative uma empresa, conecte o Mercado Livre em <strong>Marketplaces</strong> e sincronize para ver os recebimentos aqui.</p></div>';
        return;
      }

      let html = contasBancariasPanelHTML();

      html += '<div class="field-hint" style="margin-bottom:12px;max-width:720px;">Esta tela mostra os pedidos com pagamento aprovado do Mercado Livre no período selecionado. Data de liberação, valor recebido e data de recebimento ainda não são retornados pela API nesta integração — aparecem como "Informação não disponível" (nunca um valor inventado) até que essa fonte real exista. Preparado para, no futuro, comparar o valor que o ERP esperava receber com o valor que o marketplace realmente repassou.</div>';

      if(state.loading || filtro.loadingEmpresas){
        html += '<div class="table-card"><div class="table-skel"><span class="spin"></span><span>Carregando recebimentos…</span></div></div>';
      } else if(state.error){
        html += '<div class="empty-panel"><div class="empty-icon" style="color:var(--danger); background:var(--danger-soft);">'+svg('alertCircle')+'</div>'
          + '<h2 style="color:var(--danger);">Não foi possível carregar</h2><p class="lead">'+escapeHtml(state.error)+'</p></div>';
      } else if(!state.recebimentos.length){
        html += '<div class="empty-panel"><div class="empty-icon">'+svg('swap')+'</div>'
          + '<h2>Nenhum recebimento no período</h2>'
          + '<p class="lead">Não há pedidos com pagamento aprovado do Mercado Livre no período e empresa selecionados.</p></div>';
      } else {
        html += '<div class="table-card"><div class="table-wrap"><table class="data-table"><thead><tr>'
          + '<th>Loja</th><th>Pedido</th><th>Data da venda</th><th>Valor bruto</th><th>Taxas/descontos</th><th>Líquido esperado</th><th>Previsão de liberação</th><th>Recebido</th><th>Data recebimento</th><th>Status</th>'
          + '</tr></thead><tbody>'
          + state.recebimentos.map(r => '<tr>'
            + '<td>'+escapeHtml(r.loja||'—')+'</td>'
            + '<td class="mono">'+escapeHtml(r.pedidoRef)+'</td>'
            + '<td class="tab-nums">'+fmtDate(r.dataVenda)+'</td>'
            + '<td class="mono">'+money(r.valorBruto)+'</td>'
            + '<td class="mono">'+(r.taxasDescontos!==null?('− '+money(r.taxasDescontos)):money(null))+'</td>'
            + '<td class="mono">'+money(r.valorLiquidoEsperado)+'</td>'
            + '<td class="tab-nums">'+fmtDate(r.dataPrevistaLiberacao)+'</td>'
            + '<td class="mono">'+money(r.valorRecebido)+'</td>'
            + '<td class="tab-nums">'+fmtDate(r.dataRecebimento)+'</td>'
            + '<td><span class="status-chip" style="'+statusChipStyle(r.status)+'">'+(STATUS_LABEL[r.status]||r.status)+'</span></td>'
          + '</tr>').join('')
          + '</tbody></table></div></div>';
      }

      root.innerHTML = html;
      const btnNovaContaInline = document.getElementById('bancosEmptyNovaConta');
      if(btnNovaContaInline) btnNovaContaInline.addEventListener('click', ()=> openNovaContaBancariaModal());
    }

    function contasBancariasPanelHTML(){
      let html = '<div class="table-card" style="margin-bottom:16px;">'
        + '<div class="panel-head"><div class="panel-title"><span class="panel-title-ic">'+svg('wallet')+'</span>Contas bancárias</div></div>';
      if(state.loadingBancos){
        html += '<div class="table-skel" style="padding:20px;"><span class="spin"></span><span>Carregando contas bancárias…</span></div>';
      } else if(!state.contasBancarias.length){
        html += '<div class="empty-panel" style="padding:24px 20px;">'
          + '<div class="empty-icon">'+svg('wallet')+'</div>'
          + '<h2>Nenhuma conta bancária cadastrada</h2>'
          + '<p class="lead">Cadastre uma conta e importe um extrato (PDF do Nubank, CSV ou XLSX) para o saldo bancário entrar automaticamente no Fluxo de Caixa.</p>'
          + '<button class="primary-btn enabled" id="bancosEmptyNovaConta" type="button" style="margin-top:6px;">'+svg('plus')+'<span>Nova conta bancária</span></button>'
          + '</div>';
      } else {
        const sc = state.saldoConsolidado;
        html += '<div style="padding:14px 20px 6px;">'
          + '<div class="kpi-sec" style="'+(sc?'--tint:var(--success);--tint-soft:var(--success-soft);':'--tint:var(--text-muted);--tint-soft:var(--surface-2);')+'max-width:340px;">'
          + '<div class="kpi-sec-icon">'+svg('wallet')+'</div>'
          + '<div class="kpi-sec-body"><div class="kpi-sec-label">Saldo bancário consolidado</div>'
          + '<div class="kpi-sec-value">'+(sc?money(sc.valor):'<span class="dash">Saldo não informado</span>')+'</div>'
          + (sc&&sc.dataReferencia?'<div class="di-sub">Referência: '+fmtDate(sc.dataReferencia)+(sc.contasSemSaldo?' · '+sc.contasSemSaldo+' conta(s) sem saldo importado':'')+'</div>':'')
          + '</div></div></div>'
          + '<div class="table-wrap"><table class="data-table"><thead><tr><th>Conta</th><th>Banco</th><th>Saldo atual</th><th>Atualizado em</th></tr></thead><tbody>'
          + state.contasBancarias.map(c=>'<tr><td>'+escapeHtml(c.nome)+(c.agencia||c.conta?'<div class="di-sub">'+escapeHtml([c.agencia,c.conta].filter(Boolean).join(' · '))+'</div>':'')+'</td>'
            + '<td>'+escapeHtml(c.banco||'—')+'</td>'
            + '<td class="mono">'+(c.saldoAtual===null?'<span class="dash">Saldo não informado</span>':money(c.saldoAtual))+'</td>'
            + '<td class="tab-nums">'+(c.saldoData?fmtDate(c.saldoData):'<span class="dash">—</span>')+'</td></tr>').join('')
          + '</tbody></table></div>';
      }
      html += '</div>';
      return html;
    }

    async function lerArquivoBase64(file){
      return new Promise((resolve,reject)=>{
        const reader = new FileReader();
        reader.onload = ()=> resolve(String(reader.result).replace(/^data:[^;]+;base64,/, ''));
        reader.onerror = ()=> reject(new Error('Não foi possível ler o arquivo.'));
        reader.readAsDataURL(file);
      });
    }

    function openNovaContaBancariaModal(){
      const empresaId = Number(window.CerneFiltro.state.empresaId);
      if(!empresaId){ toast('Selecione uma empresa antes de cadastrar uma conta.', 'error'); return; }
      const modalRoot = document.getElementById('modalRoot');
      const close = ()=> modalRoot.innerHTML='';
      modalRoot.innerHTML = '<div class="modal-overlay" id="ncbOverlay"><div class="modal-card" style="max-width:480px;">'
        + '<div class="modal-head"><div class="modal-title">Nova conta bancária</div><button class="row-ic-btn" id="ncbClose" type="button">'+svg('x')+'</button></div>'
        + '<div class="modal-sub">Cadastre a conta para depois importar o extrato e manter o saldo bancário atualizado automaticamente.</div>'
        + '<div class="form-grid" style="margin-top:14px;display:flex;flex-direction:column;gap:12px;">'
          + '<label>Nome da conta *<input type="text" id="ncbNome" placeholder="Ex.: Nubank PJ"></label>'
          + '<label>Banco<input type="text" id="ncbBanco" placeholder="Ex.: Nubank"></label>'
          + '<label>Agência<input type="text" id="ncbAgencia"></label>'
          + '<label>Conta<input type="text" id="ncbConta" placeholder="Ex.: 123456789-0"></label>'
        + '</div>'
        + '<div class="modal-actions"><button class="btn-secondary" id="ncbCancelar" type="button">Cancelar</button><button class="btn-primary" id="ncbSalvar" type="button">'+svg('check')+'<span>Cadastrar conta</span></button></div>'
        + '</div></div>';
      document.getElementById('ncbClose').addEventListener('click', close);
      document.getElementById('ncbCancelar').addEventListener('click', close);
      document.getElementById('ncbOverlay').addEventListener('click', e=>{ if(e.target.id==='ncbOverlay') close(); });
      document.getElementById('ncbSalvar').addEventListener('click', async ()=>{
        const btn = document.getElementById('ncbSalvar');
        const nome = document.getElementById('ncbNome').value.trim();
        if(!nome){ toast('Informe o nome da conta.', 'error'); return; }
        btn.disabled = true; btn.querySelector('span').textContent='Salvando…';
        try{
          const r = await apiBancos('', { method:'POST', body: JSON.stringify({
