        + '<span class="bd-label">'+label+'</span>'
        + '<span class="bd-value">'+(valor===null ? '<span style="color:var(--text-faint); font-style:italic; font-family:\'Public Sans\',sans-serif; font-weight:500;">indisponível</span>' : (negative?'− ':'')+money(Math.abs(valor),moeda))+'</span>'
        + '</div>';

      const tarifasSideNote = rf.tarifasMl.componentes.filter(c=>c.valor!==null)
        .map(c=> escapeHtml(c.label)+': '+money(c.valor,moeda)).join(' · ');

      const html = '<div class="side-panel-overlay" id="sidePanelOverlay"></div><div class="side-panel">'
        + '<div class="modal-head"><div class="modal-title">Pedido #'+escapeHtml(pedido.mlOrderId)+'</div><button class="row-ic-btn" id="sidePanelClose" type="button">'+svg('x')+'</button></div>'
        + '<div class="modal-sub">'+escapeHtml(canalLabel)+' · '+fmtDateTime(pedido.dataCriacao)+' · <span class="badge-status '+(pedido.status==='paid'?'on':'off')+'" style="display:inline-flex;"><span class="dot"></span>'+escapeHtml(pedido.status||'—')+'</span></div>'

        + '<div class="detail-section-title">Pedido</div>'
        + '<div class="detail-grid">'
          + '<div class="dg-item"><div class="dg-label">Loja</div><div class="dg-value'+(pedido.loja?'':' muted')+'">'+(escapeHtml(pedido.loja)||'—')+'</div></div>'
          + '<div class="dg-item"><div class="dg-label">Comprador</div><div class="dg-value">'+escapeHtml(pedido.compradorNickname||'—')+'</div></div>'
          + (isShopee
              ? '<div class="dg-item"><div class="dg-label">Forma de pagamento</div><div class="dg-value'+(pedido.metodoPagamento?'':' muted')+'">'+(escapeHtml(pedido.metodoPagamento)||'indisponível')+'</div></div>'
              : isBalcao
              ? '<div class="dg-item"><div class="dg-label">Forma de pagamento</div><div class="dg-value">'+(FORMA_PAGAMENTO_LABEL[pedido.formaPagamento]||escapeHtml(pedido.formaPagamento)||'—')+'</div></div>'
              : '<div class="dg-item"><div class="dg-label">ID do pagamento</div><div class="dg-value'+(pedido.mlPaymentId?'':' muted')+'">'+(pedido.mlPaymentId||'indisponível')+'</div></div>'
                + '<div class="dg-item"><div class="dg-label">ID do envio (shipment)</div><div class="dg-value'+(pedido.mlShippingId?'':' muted')+'">'+(pedido.mlShippingId||'sem envio')+'</div></div>')
          + (isBalcao
              ? '<div class="dg-item"><div class="dg-label">Entrega</div><div class="dg-value">Retirada no local (venda de balcão)</div></div>'
              : '<div class="dg-item"><div class="dg-label">'+(isShopee?'Transportadora':'Modalidade de logística')+'</div><div class="dg-value'+(pedido.envioLogisticType?'':' muted')+'">'+(escapeHtml(pedido.envioLogisticType||pedido.envioLogisticMode)||'indisponível')+'</div></div>')
        + '</div>'

        + '<div class="detail-section-title">Itens</div>'
        + itens.map(it => '<div class="item-row"><div><div class="ir-title">'+escapeHtml(it.titulo||it.mlItemId||it.itemId||'—')+'</div>'
            + '<div class="ir-sku">'+(it.sku?('SKU '+escapeHtml(it.sku)):'sem SKU informado')+' · qtd '+it.quantidade+'</div></div>'
            + '<div class="mono">'+(money(it.valorTotalItem,moeda)||'indisponível')+'</div></div>').join('')

        + '<div class="detail-section-title">Margem de contribuição desta venda</div>'
        + bdLine('Valor da venda', rf.valorVenda, false)
        + (rf.desconto ? bdLine('(−) Desconto (cupom do pagamento)', rf.desconto, true) : '')
        + bdLine('(−) Taxas/comissões '+escapeHtml(canalLabel), rf.tarifasMl.total, true)
        + (tarifasSideNote ? '<div class="bd-side-note">'+tarifasSideNote+'</div>' : '')
        + bdLine('(−) Frete do vendedor', rf.freteVendedor, true)
        + bdLine('(−) Imposto configurado ('+rf.imposto.aliquota+'%)', rf.imposto.valor, true)
        + bdLine('(−) Custo do produto', rf.custoProduto, true)
        + '<div class="bd-row total"><span class="bd-label">= Margem de contribuição</span><span class="bd-value '+(rf.resultado===null?'':(rf.resultado>=0?'positive':'negative'))+'">'
          + (rf.resultado===null ? 'Cálculo incompleto' : money(rf.resultado,moeda)) + '</span></div>'
        + (rf.margemPercentual!==null ? '<div class="bd-row"><span class="bd-label">% sobre o valor da venda</span><span class="bd-value '+(rf.margemPercentual>=0?'positive':'negative')+'">'+(rf.margemPercentual<0?'− ':'')+Math.abs(rf.margemPercentual).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'%</span></div>' : '')
        + (rf.pendencias.length ? '<div class="bd-note">'+svg('alertCircle')+'<span>'+rf.pendencias.map(escapeHtml).join('<br>')+'</span></div>' : '')

        + (isBalcao ? '' :
          '<div class="detail-section-title">Frete pago pelo comprador (informativo)</div>'
          + bdLine(isShopee ? 'Frete comprador' : 'Frete comprador (receiver.cost)', rf.freteComprador, false)
          + '<div class="bd-side-note">'+(isShopee
              ? 'A Shopee ainda não separa esse valor nos dados já sincronizados nesta etapa da integração.'
              : 'Não entra no cálculo do resultado acima — é o valor pago pelo comprador, separado do custo de frete do vendedor.')+'</div>')

        + '</div>';

      sideRoot.innerHTML = html;
      document.getElementById('sidePanelOverlay')?.addEventListener('click', closeSidePanel);
      document.getElementById('sidePanelClose')?.addEventListener('click', closeSidePanel);
    }

    window.Pedidos = { load };
  })();

  /* ================= FINANCEIRO — dashboard consolidado (26/08/2026) =================
     Redesenho visual pedido pelo usuário: reunir numa só tela o que já
     existe, cada um na sua própria tela — nunca um cálculo novo, sempre a
     MESMA função/consulta que a tela cheia usa:
       - Cards de topo + gráfico de saldo: /api/fluxo-caixa (mesmo
         `cardsHTML`/`chartSaldoHTML` de FluxoCaixa, copiados aqui).
       - Resumo de DRE: /api/dre (mesmos campos de `linhas` que a tela DRE
         usa — só um subconjunto, o resto fica um clique em "Ver
         demonstrativo completo").
       - Contas a pagar / Contas a receber: /api/contas-pagar e
         /api/contas-receber — usa o campo `resumo` que essas rotas já
         calculam (mesmo que a lista completa usa), nunca refeito aqui.
       - Recebimentos de marketplaces: /api/recebimentos — agrupado por
         loja só somando (Σ) os valores que cada linha já traz prontos
         (nunca uma fórmula nova, só uma soma de exibição).
       - Despesas fixas: /api/despesas-fixas (lista das ativas) +
         `resumoFormula.despesasFixasPrevistas` que já vem pronto de
         /api/fluxo-caixa (o rateio por frequência/dia já existe em
         lib/fluxoCaixa.js — nunca recalculado aqui).
     Datas: usa o filtro global (window.CerneFiltro) pra empresa e pro
     período de DRE/Contas a pagar/Contas a receber/Recebimentos — exceto
     o Fluxo de Caixa, que continua com seu próprio seletor de período
     (é uma janela pra FRENTE — "próximos N dias" —, um conceito diferente
     do período pra TRÁS do filtro global; forçar os dois a serem a mesma
     coisa mudaria o que o número significa, então ficam separados, do
     jeito que a própria tela de Fluxo de Caixa já funciona).
     "A vencer" nos mini-cards de Contas a Pagar/Receber mostra os
     PRÓXIMOS 7 DIAS (não 30) porque é o que resumoContasPagar/
     resumoContasReceber já calculam — não inventamos uma janela de 30
     dias que a função de resumo não produz. */
  (function(){
    const FLUXO_PERIODOS = [ ['7d','7 dias'], ['30d','30 dias'], ['mes','Este mês'] ];
    const state = {
      loading:false, error:null,
      loadingFluxo:false, erroFluxo:null,
      periodoFluxo:'30d',
      fluxo:null, dre:null, contasPagar:null, contasReceber:null, recebimentos:null, despesasFixas:null,
    };

    function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function money(v){ return v===null||v===undefined ? '—' : 'R$ ' + Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2}); }
    function moneyOuIndisponivel(campo){
      if(!campo || campo.valor===null || campo.valor===undefined) return '<span class="dash" title="Informe o saldo inicial em Fluxo de Caixa">Não informado</span>';
      return money(campo.valor);
    }
    function pct(v){ return v===null||v===undefined ? null : Number(v).toLocaleString('pt-BR',{minimumFractionDigits:1, maximumFractionDigits:1})+'%'; }
    function fmtDate(iso){ if(!iso) return '—'; try{ const [y,m,d] = String(iso).slice(0,10).split('-'); return d+'/'+m+'/'+y; }catch(e){ return '—'; } }
    function fmtDiaCurto(diaISO){ const [, m, d] = diaISO.split('-'); return d+'/'+m; }
    function tintVars(tint){ return tint==='muted' ? '--tint:var(--text-muted);--tint-soft:var(--surface-2);' : '--tint:var(--'+tint+');--tint-soft:var(--'+tint+'-soft);'; }
    function navLink(label, page){ return '<a href="javascript:void(0)" class="fin-nav-link" data-page="'+page+'">'+escapeHtml(label)+'<span class="fin-nav-arrow">→</span></a>'; }

    async function apiGet(url){
      const res = await fetch(url);
      let body = null; try{ body = await res.json(); }catch(e){}
      if(!res.ok) throw new Error((body && body.error) || 'Falha na requisição.');
      return body;
    }

    async function loadFluxo(){
      const filtro = window.CerneFiltro.state;
      if(!filtro.empresaId){ state.fluxo=null; state.loadingFluxo=false; render(); return; }
      state.loadingFluxo = true; state.erroFluxo = null; render();
      try{ state.fluxo = await apiGet('/api/fluxo-caixa?empresaId='+filtro.empresaId+'&periodo='+state.periodoFluxo); }
      catch(err){ state.erroFluxo = err.message || 'Não foi possível carregar o fluxo de caixa.'; state.fluxo = null; }
      state.loadingFluxo = false; render();
    }

    async function loadResto(){
      const filtro = window.CerneFiltro.state;
      if(!filtro.empresaId){ state.dre=state.contasPagar=state.contasReceber=state.recebimentos=state.despesasFixas=null; state.loading=false; render(); return; }
      state.loading = true; state.error = null; render();
      const empresaId = filtro.empresaId, periodo = filtro.periodo;
      const [dre, cp, cr, rec, df] = await Promise.allSettled([
        apiGet('/api/dre?empresaId='+empresaId+'&periodo='+periodo),
        apiGet('/api/contas-pagar?empresaId='+empresaId+'&periodo='+periodo+'&status=pendente'),
        apiGet('/api/contas-receber?empresaId='+empresaId+'&periodo='+periodo+'&status=a_receber'),
        apiGet('/api/recebimentos?empresaId='+empresaId+'&periodo='+periodo),
        apiGet('/api/despesas-fixas?empresaId='+empresaId+'&ativo=true'),
      ]);
      // Cada painel é independente — se um endpoint falhar, os outros continuam
      // mostrando dado real normalmente (nunca tudo quebra por causa de um só).
      state.dre = dre.status==='fulfilled' ? dre.value : null;
      state.contasPagar = cp.status==='fulfilled' ? cp.value : null;
      state.contasReceber = cr.status==='fulfilled' ? cr.value : null;
      state.recebimentos = rec.status==='fulfilled' ? rec.value : null;
      state.despesasFixas = df.status==='fulfilled' ? df.value : null;
      state.error = (dre.status==='rejected' && cp.status==='rejected' && cr.status==='rejected' && rec.status==='rejected' && df.status==='rejected')
        ? 'Não foi possível carregar o financeiro.' : null;
      state.loading = false; render();
    }

    function load(){ loadFluxo(); loadResto(); }

    window.CerneFiltro.onChange(()=>{
      const page = document.getElementById('page-finance');
      if(page && page.classList.contains('active')){ loadFluxo(); loadResto(); }
      else render();
    });

    // ---- cards de topo (mesma função/campos de FluxoCaixa.cardsHTML) ----
    function cardHTML(k){
      return '<div class="kpi-hero" style="'+tintVars(k.tint)+'">'
        + '<div class="kpi-hero-top"><div class="kpi-hero-icon">'+svg(k.icon)+'</div></div>'
        + '<div class="kpi-hero-label">'+escapeHtml(k.label)+'</div>'
        + '<div class="kpi-hero-value">'+k.valueHtml+'</div>'
        + '<div class="kpi-hero-foot"><span class="kpi-hero-note">'+escapeHtml(k.note)+'</span></div>'
      + '</div>';
    }
    function cardsHTML(dados){
      const c = dados.cards;
      const items = [
        { label:'Saldo atual', icon:'wallet', tint: c.saldoAtual.valor===null?'muted':(c.saldoAtual.valor>=0?'success':'danger'), valueHtml: moneyOuIndisponivel(c.saldoAtual), note:'A partir do saldo inicial informado' },
        { label:'Entradas previstas', icon:'arrowDownCircle', tint:'success', valueHtml: money(c.entradasPrevistas), note:'A receber no período' },
        { label:'Saídas previstas', icon:'arrowUpCircle', tint:'copper', valueHtml: money(c.saidasPrevistas), note:'Contas a pagar + despesas fixas' },
        { label:'Saldo projetado', icon:'activity', tint: (c.saldoProjetado.valor===null?'muted':(c.saldoProjetado.valor>=0?'success':'danger')), valueHtml: moneyOuIndisponivel(c.saldoProjetado), note:'Estimado ao fim do período' },
        { label:'Contas vencidas', icon:'alertCircle', tint: c.contasVencidas>0?'danger':'muted', valueHtml: money(c.contasVencidas), note:'A pagar vencidas + a receber atrasadas' },
      ];
      return '<div class="kpi-hero-grid">' + items.map(cardHTML).join('') + '</div>';
    }

    // ---- gráfico de saldo (mesma função de FluxoCaixa.chartSaldoHTML) ----
    function chartSaldoHTML(dados){
      const dias = dados.serieDiaria;
      const temSaldo = dias.some(d => d.saldoAcumulado !== null && d.saldoAcumulado !== undefined);
      if(!dias.length || !temSaldo){
        return '<div class="chart-canvas h-lg">' + chartGridLines(4)
          + chartEmptyState('wallet', 'Informe o saldo inicial em Fluxo de Caixa pra ver a evolução do caixa — sem isso o ERP não inventa nenhum saldo.')
        + '</div>';
      }
      const n = dias.length;
      const W = Math.max(n*14, 14), H = 100, topPad = 10, botPad = 10;
      const usable = H - topPad - botPad;
      const vals = dias.map(d => d.saldoAcumulado||0);
      const maxV = Math.max(0, ...vals), minV = Math.min(0, ...vals);
      const range = (maxV - minV) || 1;
      const yFor = v => topPad + usable * (1 - (v - minV) / range);
      const baseY = yFor(0);

      const pontos = dias.map((d,i)=> ({ x:i*14+7, y:yFor(d.saldoAcumulado||0), d }));
      let corte = pontos.findIndex(p=>p.d.ehHoje);
      if(corte === -1) corte = dias[0].ehPassado ? pontos.length-1 : -1;
      const solidos = corte===-1 ? [] : pontos.slice(0, corte+1);
      const tracejados = corte===-1 ? pontos : pontos.slice(corte);

      const linhaSolida = solidos.length>1 ? '<polyline points="'+solidos.map(p=>p.x+','+p.y).join(' ')+'" fill="none" stroke="var(--teal)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>' : '';
      const linhaTracejada = tracejados.length>1 ? '<polyline points="'+tracejados.map(p=>p.x+','+p.y).join(' ')+'" fill="none" stroke="var(--copper)" stroke-width="2" stroke-dasharray="4 3" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>' : '';
      const dots = pontos.map(p=>{
        const label = fmtDiaCurto(p.d.dia)+' — '+(p.d.ehPassado||p.d.ehHoje?'Realizado':'Projetado')+': '+money(p.d.saldoAcumulado);
        return '<circle cx="'+p.x+'" cy="'+p.y+'" r="1.8" fill="'+(p.d.ehPassado||p.d.ehHoje?'var(--teal)':'var(--copper)')+'" vector-effect="non-scaling-stroke"><title>'+escapeHtml(label)+'</title></circle>';
      }).join('');
      const baseline = '<line x1="0" y1="'+baseY+'" x2="'+W+'" y2="'+baseY+'" stroke="var(--border-strong)" stroke-width="1" vector-effect="non-scaling-stroke"/>';
      const labelStep = Math.max(1, Math.ceil(n/7));
      const labels = dias.map((d,i) => '<span>'+((i%labelStep===0 || i===n-1) ? escapeHtml(fmtDiaCurto(d.dia)) : '')+'</span>').join('');

      return '<div class="chart-canvas" style="position:relative;height:180px;padding:0;">'
        + '<svg class="simple-chart-svg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="height:100%;">'
          + baseline + linhaSolida + linhaTracejada + dots
        + '</svg>'
      + '</div>'
      + '<div class="simple-chart-xlabels" style="grid-template-columns:repeat('+n+',1fr);">' + labels + '</div>';
    }
    function fluxoCardHTML(){
      let body;
      if(state.loadingFluxo) body = '<div class="table-skel"><span class="spin"></span><span>Carregando…</span></div>';
      else if(state.erroFluxo) body = '<div class="field-hint" style="color:var(--danger);">'+escapeHtml(state.erroFluxo)+'</div>';
      else if(!state.fluxo) body = '<div class="field-hint">Selecione uma empresa.</div>';
      else body = chartSaldoHTML(state.fluxo);
      return '<div class="chart-card">'
        + '<div class="chart-card-head">'
          + '<div class="panel-title"><span class="panel-title-ic">'+svg('activity')+'</span>Fluxo de caixa</div>'
          + '<div class="chart-legend">'
            + '<span class="legend-item"><span class="legend-dot" style="background:var(--teal)"></span>Realizado</span>'
            + '<span class="legend-item"><span class="legend-dot" style="background:var(--copper)"></span>Projetado</span>'
            + '<div class="seg" id="finFluxoSeg" style="margin-left:6px;">' + FLUXO_PERIODOS.map(p=>'<button data-periodo="'+p[0]+'" class="'+(state.periodoFluxo===p[0]?'active':'')+'" type="button">'+p[1]+'</button>').join('') + '</div>'
          + '</div>'
        + '</div>'
        + body
        + '<div style="text-align:right;margin-top:10px;">'+navLink('Ver demonstrativo completo', 'cashFlow')+'</div>'
      + '</div>';
    }

    // ---- Resumo de DRE (subconjunto dos mesmos campos que a tela DRE usa) ----
    function linhaDreHTML(label, campo, hasOrders, negativo){
      if(!campo) return '';
      const valorHtml = campo.valor===null
        ? '<span style="color:var(--text-faint);font-style:italic;">'+(hasOrders?'Pendente':'Sem dados')+'</span>'
        : (negativo && campo.valor!==0 ? '− ' : '') + money(Math.abs(campo.valor));
      return '<div class="bd-row'+(negativo?' neg':'')+'"><span class="bd-label">'+label+'</span><span class="bd-value">'+valorHtml+'</span></div>';
    }
    function totalDreHTML(label, campo, hasOrders){
      if(!campo) return '';
      const positivo = campo.valor!==null && campo.valor>=0;
      return '<div class="bd-row total"><span class="bd-label">'+label+'</span><span class="bd-value '+(campo.valor===null?'':(positivo?'positive':'negative'))+'">'
        + (campo.valor===null?(hasOrders?'Pendente':'Sem dados'):money(campo.valor)) + '</span></div>';
    }
    function somaCampos(a, b){
      // Soma de exibição só — nunca uma fórmula nova: os dois campos já vêm
      // prontos da mesma DRE que a tela DRE usa, isso só os junta numa
      // linha só ("Deduções") pra caber num resumo compacto.
      if(!a || !b || a.valor===null || b.valor===null) return { valor:null, pendentes:(a?a.pendentes:0)+(b?b.pendentes:0) };
      return { valor: Math.round((a.valor + b.valor)*100)/100, pendentes: a.pendentes+b.pendentes };
    }
    function somaCampos3(a,b,c){ return somaCampos(somaCampos(a,b), c); }
    function dreResumoHTML(){
      let body;
      if(state.loading) body = '<div class="table-skel"><span class="spin"></span><span>Carregando…</span></div>';
      else if(!state.dre) body = '<div class="field-hint">Não foi possível carregar a DRE agora.</div>';
      else{
        const d = state.dre.dre, l = d.linhas, hasOrders = d.hasOrders;
        const deducoes = somaCampos(l.cancelamentos, l.descontos);
        const taxasFreteImposto = somaCampos3(l.taxasComissoes, l.freteVendedor, l.impostos);
        body = linhaDreHTML('Receita Bruta', l.receitaBruta, hasOrders)
          + linhaDreHTML('(−) Deduções (cancelamentos + descontos)', deducoes, hasOrders, true)
          + totalDreHTML('= Receita Líquida', l.receitaLiquida, hasOrders)
          + linhaDreHTML('(−) Custo dos Produtos', l.custoProdutos, hasOrders, true)
          + linhaDreHTML('(−) Taxas, frete e impostos', taxasFreteImposto, hasOrders, true)
          + totalDreHTML('= Margem de Contribuição', l.margemContribuicao, hasOrders)
          + linhaDreHTML('(−) Despesas pagas no período', l.despesasPeriodo, true, true)
          + totalDreHTML('= Resultado Final', l.resultadoFinal, hasOrders);
      }
      return '<div class="panel">'
        + '<div class="panel-head"><div class="panel-title"><span class="panel-title-ic">'+svg('barChart')+'</span>Resumo de DRE</div>'
          + (state.dre ? '<span class="panel-note">'+escapeHtml(state.dre.periodo.label)+'</span>' : '') + '</div>'
        + body
        + '<div style="text-align:right;margin-top:10px;">'+navLink('Ver demonstrativo completo', 'dre')+'</div>'
      + '</div>';
    }

    // ---- Contas a pagar (mesmo `resumo` de /api/contas-pagar) ----
    function contasPagarMiniHTML(){
      let inner;

            + linhas.map(c=>'<tr><td class="tab-nums">'+fmtDate(c.vencimento)+'</td><td>'+escapeHtml(c.fornecedorNome||c.descricao)+'</td><td class="mono">'+money(c.valor)+'</td></tr>').join('')

    // ---- Recebimentos de marketplaces (agrupado por loja — soma de exibição, ver comentário no topo) ----
    function recebimentosMiniHTML(){
      let inner;
      if(state.loading) inner = '<div class="table-skel"><span class="spin"></span><span>Carregando…</span></div>';
      else if(!state.recebimentos) inner = '<div class="field-hint">Não foi possível carregar agora.</div>';
      else{
        const lista = state.recebimentos.recebimentos || [];
        const porLoja = new Map();
        lista.forEach(r=>{
          const loja = r.loja || '—';
          if(!porLoja.has(loja)) porLoja.set(loja, { aLiberar:0, liberado:0, temIndisponivel:false });
          const g = porLoja.get(loja);
          if(r.status==='recebido' && r.valorRecebido!==null) g.liberado += r.valorRecebido;
          else if(r.valorLiquidoEsperado!==null) g.aLiberar += r.valorLiquidoEsperado;
          else g.temIndisponivel = true;
        });
        const linhas = Array.from(porLoja.entries());
        inner = linhas.length ? '<div class="fin-mini-table-wrap"><table class="data-table fin-mini-table"><thead><tr><th>Marketplace</th><th>A liberar</th><th>Liberado</th></tr></thead><tbody>'
          + linhas.map(([loja,g])=>'<tr><td>'+escapeHtml(loja)+'</td><td class="mono">'+money(g.aLiberar)+'</td><td class="mono">'+money(g.liberado)+'</td></tr>').join('')
          + '</tbody></table></div>' : '<div class="field-hint">Nenhum recebimento no período.</div>';
      }
      return '<div class="panel">'
        + '<div class="panel-head"><div class="panel-title"><span class="panel-title-ic">'+svg('swap')+'</span>Recebimentos de marketplaces</div>'+navLink('Ver consolidação completa', 'settlements')+'</div>'
        + inner
      + '</div>';

    function render(){
      const root = document.getElementById('financeRoot');
      if(!root) return;
