  /* ---------- FILTRO DO HEADER (empresa + período) — fonte única da Visão Geral ----------
     Único lugar que guarda "empresa selecionada" e "período selecionado" pra Visão
     Geral: os dois seletores que ficavam dentro da própria página foram removidos
     (eram um segundo estado, duplicado, e nunca em sincronia com o header). Pedidos
     e Financeiro continuam com o seletor próprio dentro da tela — não fazem parte
     desta correção. */
  const HEADER_PERIODOS = [
    { chave:'hoje', label:'Hoje' },
    { chave:'ontem', label:'Ontem' },
    { chave:'7d', label:'Últimos 7 dias' },
    { chave:'30d', label:'Últimos 30 dias' },
    { chave:'mes', label:'Este mês' },
    // Adicionado em 12/09/2026 (pedido explícito do usuário): poder
    // escolher qualquer intervalo de datas, não só os períodos prontos —
    // em TODA aba que usa este filtro do cabeçalho (a maioria do ERP, ver
    // lib/periodo.js). Mesma opção que Fluxo de Caixa/DRE já tinham no
    // período PRÓPRIO deles.
    { chave:'personalizado', label:'Personalizado' },
  ];
  function hojeBRTStr(){
    const BRT_OFFSET_MS = 3*60*60*1000;
    const brt = new Date(Date.now() - BRT_OFFSET_MS);
    const p = n => String(n).padStart(2,'0');
    return brt.getUTCFullYear()+'-'+p(brt.getUTCMonth()+1)+'-'+p(brt.getUTCDate());
  }
  /* Fase 2 (30/10/2026): "ver as duas empresas juntas" — só para LER
     (Contas a Pagar, Contas a Receber, Repasses). Lançar/editar sempre
     vale para uma empresa só. */
  window.CerneJuntas = {
    on: false,
    param: function(){ return this.on ? 'todas' : window.CerneFiltro.state.empresaId; },
    html: function(id){
      return '<div class="seg" id="'+id+'" title="Escolha se quer ver só a empresa do topo ou as duas empresas somadas">'
        + '<button type="button" data-j="0" class="'+(this.on?'':'active')+'">Só esta empresa</button>'
        + '<button type="button" data-j="1" class="'+(this.on?'active':'')+'">PF + Andrade juntas</button></div>';
    },
    bind: function(id, reload){
      const el = document.getElementById(id); if(!el) return;
      el.querySelectorAll('button').forEach(b=> b.addEventListener('click', ()=>{
        const novo = b.dataset.j === '1';
        if(novo === window.CerneJuntas.on) return;
        window.CerneJuntas.on = novo; reload();
      }));
    }
  };

  window.CerneFiltro = (function(){
    const state = { empresas:[], empresaId:null, loadingEmpresas:true, periodo:'30d', desdePersonalizado:null, atePersonalizado:null };
    const listeners = [];
    function onChange(fn){ listeners.push(fn); }
    function notify(){ listeners.forEach(fn=>{ try{ fn(state); }catch(e){} }); }
    function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    function renderCompanyDropdown(){
      const dd = document.getElementById('companyDropdown');
      if(!dd) return;
      let html = '<div class="dropdown-title">Empresas ativas</div>';
      if(state.loadingEmpresas){
        html += '<div class="dropdown-item"><div><div class="di-name">Carregando…</div></div></div>';
      } else if(!state.empresas.length){
        html += '<div class="dropdown-item"><div><div class="di-name">Nenhuma empresa ativa</div></div></div>';
      } else {
        html += state.empresas.map(e =>
          '<div class="dropdown-item" data-empresa-id="'+e.id+'">'
            + '<div><div class="di-name">'+escapeHtml(e.nomeFantasia||e.razaoSocial)+'</div>'
            + (e.cnpj ? '<div class="di-sub mono">'+escapeHtml(e.cnpj)+'</div>' : '')+'</div>'
            + '<span class="dot'+(e.id===state.empresaId?'':' muted')+'"></span>'
          + '</div>'
        ).join('');
      }
      dd.innerHTML = html;
      dd.querySelectorAll('[data-empresa-id]').forEach(item=>{
        item.addEventListener('click', (e)=>{
          e.stopPropagation();
          const id = Number(item.dataset.empresaId);
          dd.classList.remove('open');
          if(id === state.empresaId) return;
          state.empresaId = id;
          renderCompanyDropdown();
          updateCompanyLabel();
          notify();
        });
      });
    }

    function updateCompanyLabel(){
      const lbl = document.getElementById('companyLabel');
      if(!lbl) return;
      if(state.loadingEmpresas){ lbl.textContent = 'Carregando…'; return; }
      const emp = state.empresas.find(e=>e.id===state.empresaId);
      lbl.textContent = emp ? (emp.nomeFantasia||emp.razaoSocial) : 'Nenhuma empresa ativa';
    }

    function fmtDataBR(iso){
      if(!iso) return '';
      const partes = String(iso).slice(0,10).split('-');
      return partes.length===3 ? (partes[2]+'/'+partes[1]) : iso;
    }

    // O formulário De/Até só aparece dentro do dropdown quando 'personalizado'
    // já é a escolha atual — clicar em "Personalizado" na lista já ativa o
    // período (com um valor padrão de datas) e mostra o formulário pra
    // ajustar; reabrir o dropdown depois também mostra o formulário, sempre
    // com as datas atualmente aplicadas, pra dar pra mudar sem escolher a
    // opção de novo.
    function renderPeriodDropdown(){
      const dd = document.getElementById('periodDropdown');
      if(!dd) return;
      const personalizadoAtivo = state.periodo === 'personalizado';
      dd.innerHTML = '<div class="dropdown-title">Período (Visão Geral)</div>' + HEADER_PERIODOS.map(p =>
        '<div class="dropdown-item" data-periodo="'+p.chave+'">'
          + '<div class="di-name">'+p.label+'</div>'
          + '<span class="dot'+(p.chave===state.periodo?'':' muted')+'"></span>'
        + '</div>'
      ).join('')
      + (personalizadoAtivo
        ? '<div style="padding:10px 14px 12px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;" onclick="event.stopPropagation()">'
            + '<div class="field narrow" style="margin:0;"><label style="font-size:11px;">De</label><input type="date" id="headerPeriodoDesde" value="'+(state.desdePersonalizado||'')+'" style="width:132px;"></div>'
            + '<div class="field narrow" style="margin:0;"><label style="font-size:11px;">Até</label><input type="date" id="headerPeriodoAte" value="'+(state.atePersonalizado||'')+'" style="width:132px;"></div>'
            + '<button class="ghost-btn" id="headerPeriodoAplicar" type="button" style="cursor:pointer;opacity:1;">Aplicar</button>'
          + '</div>'
        : '');
      dd.querySelectorAll('[data-periodo]').forEach(item=>{
        item.addEventListener('click', (e)=>{
          e.stopPropagation();
          const chave = item.dataset.periodo;
          if(chave === 'personalizado'){
            // Fica com o dropdown aberto pra escolher/confirmar as datas —
            // nunca fecha nem notifica só por clicar na opção.
            if(!state.desdePersonalizado) state.desdePersonalizado = hojeBRTStr();
            if(!state.atePersonalizado) state.atePersonalizado = hojeBRTStr();
            const jaEstavaPersonalizado = state.periodo === 'personalizado';
            state.periodo = 'personalizado';
            renderPeriodDropdown();
            updatePeriodLabel();
            if(!jaEstavaPersonalizado) notify();
            return;
          }
          dd.classList.remove('open');
          if(chave === state.periodo) return;
          state.periodo = chave;
          renderPeriodDropdown();
          updatePeriodLabel();
          notify();
        });
      });
      const aplicar = document.getElementById('headerPeriodoAplicar');
      if(aplicar){
        aplicar.addEventListener('click', (e)=>{
          e.stopPropagation();
          const d = document.getElementById('headerPeriodoDesde').value;
          const a = document.getElementById('headerPeriodoAte').value;
          state.desdePersonalizado = d || state.desdePersonalizado || hojeBRTStr();
          state.atePersonalizado = a || state.atePersonalizado || hojeBRTStr();
          dd.classList.remove('open');
          updatePeriodLabel();
          notify();
        });
      }
    }

    // Reaproveitado por outras telas que precisam mostrar o período atual em
    // texto (ex.: IA Gestora) — nunca duplica a lógica de formatação.
    function periodoLabel(){
      if(state.periodo === 'personalizado'){
        return state.desdePersonalizado && state.atePersonalizado
          ? (fmtDataBR(state.desdePersonalizado)+' – '+fmtDataBR(state.atePersonalizado))
          : 'Personalizado';
      }
      const p = HEADER_PERIODOS.find(p => p.chave === state.periodo);
      return p ? p.label : '';
    }

    function updatePeriodLabel(){
      const lbl = document.getElementById('periodLabel');
      if(!lbl) return;
      lbl.textContent = periodoLabel();
    }

    let empresasFetchEmAndamento = null;
    function carregarEmpresas(){
      // Evita duas buscas concorrentes de empresa (ex.: bootstrap inicial +
      // navegação pra Visão Geral acontecendo quase ao mesmo tempo).
      if(empresasFetchEmAndamento) return empresasFetchEmAndamento;
      state.loadingEmpresas = true; renderCompanyDropdown(); updateCompanyLabel();
      empresasFetchEmAndamento = (async ()=>{
        try{
          const res = await fetch('/api/empresas?status=ativas');
          const body = await res.json();
          state.empresas = (body && body.empresas) || [];
        }catch(e){ state.empresas = []; }
        if(!state.empresaId || !state.empresas.find(emp=>emp.id===state.empresaId)){
          state.empresaId = state.empresas.length ? state.empresas[0].id : null;
        }
        state.loadingEmpresas = false;
        renderCompanyDropdown();
        updateCompanyLabel();
        notify();
        empresasFetchEmAndamento = null;
      })();
      return empresasFetchEmAndamento;
    }

    renderPeriodDropdown();
    updatePeriodLabel();
    carregarEmpresas();

    // Fragmento de query string ('' ou '&desde=...&ate=...') pra toda tela
    // que usa este filtro anexar na própria chamada de API sempre que o
    // período for personalizado — nunca precisa duplicar a checagem
    // `periodo==='personalizado'` em cada tela.
    function periodoExtra(){
      if(state.periodo !== 'personalizado') return '';
      const d = state.desdePersonalizado || '', a = state.atePersonalizado || '';
      return (d ? '&desde='+encodeURIComponent(d) : '') + (a ? '&ate='+encodeURIComponent(a) : '');
    }

    return { state, onChange, refreshEmpresas: carregarEmpresas, periodoExtra, periodoLabel };
  })();

  /* ---------- SINCRONIZAÇÃO AUTOMÁTICA DO MERCADO LIVRE (indicador discreto) ----------
     A sincronização em si acontece 100% no servidor (ver server/lib/syncScheduler.js —
     um setInterval de 1 minuto rodando no processo Node, nunca no navegador). Este bloco
     só LÊ o status já calculado pelo servidor (GET /status-automatico) pra mostrar
     "Sincronizado há Xs" no header — o navegador nunca sincroniza nada, mesmo usando um
     setInterval aqui: um é só pra reler um status pronto, o outro (proibido) seria pra
     fazer a sincronização de verdade a partir do front-end. */
  (function(){
    let ultimoStatus = null;

    function fmtRelativo(iso){
      if(!iso) return null;
      const diffMs = Date.now() - new Date(iso).getTime();
      const seg = Math.max(0, Math.round(diffMs/1000));
      if(seg < 60) return 'Sincronizado há ' + seg + (seg===1?' segundo':' segundos');
      const min = Math.round(seg/60);
      if(min < 60) return 'Sincronizado há ' + min + (min===1?' minuto':' minutos');
      try{
        return 'Última sincronização: ' + new Date(iso).toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
      }catch(e){ return null; }
    }

    function render(){
      const wrap = document.getElementById('mlSyncStatus');
      const dot = document.getElementById('mlSyncDot');
      const txt = document.getElementById('mlSyncText');
      if(!wrap || !txt || !ultimoStatus) return;

      wrap.style.display = 'flex';
      wrap.classList.remove('ok','erro');

      if(ultimoStatus.emExecucao){
        txt.textContent = 'Sincronizando…';
      } else if(ultimoStatus.ultimoCicloOk === false){
        wrap.classList.add('erro');
        txt.textContent = 'Erro na sincronização';
        const detalhe = (ultimoStatus.contasComErro||[]).map(c=>c.erro).join(' | ') || ultimoStatus.ultimoErroGeral;
        wrap.title = detalhe ? ('Erro na sincronização automática: ' + detalhe) : 'Erro na sincronização automática.';
      } else if(ultimoStatus.ultimaExecucaoEm){
        wrap.classList.add('ok');
        txt.textContent = fmtRelativo(ultimoStatus.ultimaExecucaoEm) || '—';
        wrap.title = 'Sincronização automática ativa (a cada ' + (ultimoStatus.intervaloSegundos||60) + 's) — última verificação: ' + new Date(ultimoStatus.ultimaExecucaoEm).toLocaleString('pt-BR');
      } else {
        txt.textContent = 'Aguardando 1ª sincronização…';
      }
    }

    async function buscarStatus(){
      try{
        const res = await fetch('/api/integracoes/mercadolivre/status-automatico');
        if(!res.ok) return;
        ultimoStatus = await res.json();
        render();
      }catch(e){ /* falha de rede ao buscar o status não deve gerar erro visível — tenta de novo no próximo tick */ }
    }

    async function iniciar(){
      try{
        const res = await fetch('/api/integracoes/mercadolivre/config-status');
        const body = await res.json();
        if(!body || !body.configurado) return; // ML não configurado neste ambiente — não mostra o indicador
      }catch(e){ return; }

      await buscarStatus();
      setInterval(render, 5000);        // só recalcula o texto relativo ("há Xs") — nenhuma chamada de rede
      setInterval(buscarStatus, 20000);  // relê o status já pronto do servidor — nunca dispara sincronização
    }

    iniciar();
  })();

  /* ---------- THEME TOGGLE ---------- */
  const root = document.documentElement;
  function currentTheme(){
    const stamped = root.getAttribute('data-theme');
    if(stamped) return stamped;
    // Espelha a estrutura do CSS (ver TOKENS): claro é o padrão agora,
    // escuro só quando o sistema operacional pedir isso explicitamente —
    // mesma relação que existia antes, só com os papéis invertidos.
    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  try{
    const saved = localStorage.getItem('cerne.theme');
    if(saved === 'light' || saved === 'dark') root.setAttribute('data-theme', saved);
  }catch(e){}
  document.getElementById('themeToggle')?.addEventListener('click', ()=>{
    const next = currentTheme() === 'dark' ? 'light' : 'dark';

  /* ================= EMPRESAS (dados reais via API) ================= */
  (function(){
    const state = { items:[], loading:false, error:null, status:'todas', search:'' };

    function toast(message, type){
      const wrap = document.getElementById('toastWrap');
      const el = document.createElement('div');
      el.className = 'toast ' + (type||'success');
      el.innerHTML = svg(type==='error' ? 'alertCircle':'checkCircle') + '<span>'+message+'</span>';
      wrap.appendChild(el);
      setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .25s'; setTimeout(()=>el.remove(),250); }, 3200);
    }

    async function api(path, opts){
      const res = await fetch('/api/empresas'+path, {
        headers:{'Content-Type':'application/json'},
        ...opts,
      });
      let body = null;
      try{ body = await res.json(); }catch(e){}
      if(!res.ok){
        const err = new Error((body && (body.error || 'Falha na requisição')) || 'Falha na requisição');
        err.status = res.status; err.errors = body && body.errors;
        throw err;
      }
      return body;
    }

    async function load(){
      state.loading = true; state.error = null; render();
      try{
        const qs = state.status !== 'todas' ? ('?status='+state.status) : '';
        const data = await api(qs, { method:'GET' });
        state.items = data.empresas;
      }catch(err){
        state.error = err.message || 'Não foi possível carregar as empresas.';
      }finally{
        state.loading = false; render();
      }
    }

    function filteredItems(){
      const q = state.search.trim().toLowerCase();
      if(!q) return state.items;
      return state.items.filter(e =>
        e.razaoSocial.toLowerCase().includes(q) ||
        (e.nomeFantasia||'').toLowerCase().includes(q) ||
        e.cnpj.includes(q.replace(/\D/g,''))
      );
    }

    function fmtDate(iso){
      try{ return new Date(iso).toLocaleDateString('pt-BR'); }catch(e){ return '—'; }
    }

    function render(){
      const root = document.getElementById('empresasRoot');
      if(!root) return;

      let html = '<div class="toolbar">'
        + '<div class="seg" id="empSeg">'
          + ['todas','ativas','inativas'].map(s=>'<button data-status="'+s+'" class="'+(state.status===s?'active':'')+'">'+(s[0].toUpperCase()+s.slice(1))+'</button>').join('')
        + '</div>'
        + '<div class="search-box">'+svg('search')+'<input type="text" id="empSearch" placeholder="Buscar por razão social, fantasia ou CNPJ" value="'+state.search.replace(/"/g,'&quot;')+'"></div>'
      + '</div>';

      if(state.loading){
        html += '<div class="table-card"><div class="table-skel"><span class="spin"></span><span>Carregando empresas…</span></div></div>';
      } else if(state.error){
        html += '<div class="empty-panel"><div class="empty-icon" style="color:var(--danger); background:var(--danger-soft);">'+svg('alertCircle')+'</div>'
          + '<h2 style="color:var(--danger);">Não foi possível carregar</h2><p class="lead">'+state.error+'</p>'
          + '<button class="ghost-btn" id="empRetry" style="cursor:pointer; opacity:1;">'+svg('activity')+'<span>Tentar novamente</span></button></div>';
      } else {
        const items = filteredItems();
        if(!state.items.length){
          html += '<div class="empty-panel"><div class="empty-icon">'+svg('building')+'</div>'
            + '<h2>Nenhuma empresa cadastrada</h2>'
            + '<p class="lead">Cadastre a primeira empresa (CNPJ, razão social e nome fantasia) para começar a organizar o grupo dentro do PF Embalagens.</p>'
            + '<button class="primary-btn enabled" id="empEmptyNew" type="button">'+svg('plus')+'<span>Cadastrar empresa</span></button></div>';
        } else if(!items.length){
          html += '<div class="empty-panel"><div class="empty-icon">'+svg('search')+'</div><h2>Nada encontrado</h2><p class="lead">Nenhuma empresa corresponde à busca "'+state.search+'".</p></div>';
        } else {
          html += '<div class="table-card"><div class="table-wrap"><table class="data-table"><thead><tr>'
            + '<th>Empresa</th><th>CNPJ</th><th>Status</th><th>Cadastrada em</th><th></th>'
            + '</tr></thead><tbody>'
            + items.map(e => '<tr class="'+(e.ativo?'':'inactive')+'">'
              + '<td><div class="company-name">'+escapeHtml(e.razaoSocial)+'</div>'+(e.nomeFantasia?'<div class="company-fantasy">'+escapeHtml(e.nomeFantasia)+'</div>':'')+'</td>'
              + '<td class="mono">'+e.cnpjFormatado+'</td>'
              + '<td>'+(e.ativo ? '<span class="badge-status on"><span class="dot"></span>Ativa</span>' : '<span class="badge-status off"><span class="dot"></span>Inativa</span>')+'</td>'
              + '<td class="tab-nums">'+fmtDate(e.criadoEm)+'</td>'
              + '<td><div class="row-actions">'
                + '<button class="row-ic-btn" data-edit="'+e.id+'" title="Editar" type="button">'+svg('edit')+'</button>'
                + '<button class="row-ic-btn '+(e.ativo?'danger':'success')+'" data-toggle="'+e.id+'" data-next="'+(!e.ativo)+'" title="'+(e.ativo?'Desativar':'Ativar')+'" type="button">'+svg('power')+'</button>'
              + '</div></td>'
            + '</tr>').join('')
            + '</tbody></table></div></div>';
        }
      }

      root.innerHTML = html;

      const seg = document.getElementById('empSeg');
      if(seg) seg.querySelectorAll('button').forEach(b=> b.addEventListener('click', ()=>{ state.status = b.dataset.status; load(); }));
      const search = document.getElementById('empSearch');
      if(search) search.addEventListener('input', ()=>{ state.search = search.value; render(); const el=document.getElementById('empSearch'); if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); } });
      const retry = document.getElementById('empRetry');
      if(retry) retry.addEventListener('click', load);
      const emptyNew = document.getElementById('empEmptyNew');
      if(emptyNew) emptyNew.addEventListener('click', ()=> openModal());
      root.querySelectorAll('[data-edit]').forEach(b=> b.addEventListener('click', ()=>{
        const emp = state.items.find(e=> String(e.id)===b.dataset.edit);
        openModal(emp);
      }));
      root.querySelectorAll('[data-toggle]').forEach(b=> b.addEventListener('click', async ()=>{
        const id = b.dataset.toggle, next = b.dataset.next === 'true';
        b.disabled = true;
        try{
          await api('/'+id+'/status', { method:'PATCH', body: JSON.stringify({ ativo: next }) });
          toast(next ? 'Empresa ativada.' : 'Empresa desativada.');
          load();
        }catch(err){ toast(err.message, 'error'); b.disabled = false; }
      }));
    }

    function escapeHtml(s){
      return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function maskCNPJ(v){
      const d = v.replace(/\D/g,'').slice(0,14);
      let out = d;
      if(d.length > 12) out = d.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{0,2})/, '$1.$2.$3/$4-$5');
      else if(d.length > 8) out = d.replace(/(\d{2})(\d{3})(\d{3})(\d{0,4})/, '$1.$2.$3/$4');
      else if(d.length > 5) out = d.replace(/(\d{2})(\d{3})(\d{0,3})/, '$1.$2.$3');
      else if(d.length > 2) out = d.replace(/(\d{2})(\d{0,3})/, '$1.$2');
      return out;
    }

    function openModal(empresa){
      const isEdit = !!empresa;
      const modalRoot = document.getElementById('modalRoot');
      modalRoot.innerHTML = '<div class="modal-overlay" id="modalOverlay">'
        + '<div class="modal-card">'
          + '<div class="modal-head"><div class="modal-title">'+(isEdit?'Editar empresa':'Nova empresa')+'</div>'
            + '<button class="row-ic-btn" id="modalClose" type="button">'+svg('x')+'</button></div>'
          + '<div class="modal-sub">'+(isEdit?'Atualize os dados cadastrais da empresa.':'Preencha os dados para cadastrar uma nova empresa/CNPJ no grupo.')+'</div>'
          + '<form id="empForm">'
            + '<div class="field"><label>CNPJ</label><input type="text" inputmode="numeric" id="fCnpj" placeholder="00.000.000/0000-00" value="'+(isEdit?maskCNPJ(empresa.cnpj):'')+'" maxlength="18">'
              + '<div class="field-error" id="eCnpj" style="display:none;"></div></div>'
            + '<div class="field"><label>Razão social</label><input type="text" id="fRazao" placeholder="Razão social conforme CNPJ" value="'+(isEdit?escapeHtml(empresa.razaoSocial):'')+'" maxlength="200">'
              + '<div class="field-error" id="eRazao" style="display:none;"></div></div>'
            + '<div class="field"><label>Nome fantasia <span class="opt">(opcional)</span></label><input type="text" id="fFantasia" placeholder="Nome usado no dia a dia" value="'+(isEdit?escapeHtml(empresa.nomeFantasia||''):'')+'" maxlength="200"></div>'
            + (isEdit ? '<div class="toggle-row"><div><div class="toggle-row-label">Empresa ativa</div><div class="toggle-row-sub">Empresas inativas ficam ocultas nas seleções do sistema.</div></div>'
              + '<button type="button" class="toggle '+(empresa.ativo?'on':'')+'" id="fAtivo" data-on="'+(empresa.ativo?'true':'false')+'"></button></div>' : '')
            + '<div class="modal-actions">'
              + '<button type="button" class="btn-secondary" id="modalCancel">Cancelar</button>'
              + '<button type="submit" class="btn-primary" id="modalSave">'+svg('check')+'<span>'+(isEdit?'Salvar alterações':'Cadastrar empresa')+'</span></button>'
            + '</div>'
          + '</form>'
        + '</div>'
      + '</div>';

      const overlay = document.getElementById('modalOverlay');
      const close = ()=> modalRoot.innerHTML = '';
      overlay.addEventListener('click', (e)=>{ if(e.target === overlay) close(); });
      document.getElementById('modalClose')?.addEventListener('click', close);
      document.getElementById('modalCancel')?.addEventListener('click', close);

      const cnpjInput = document.getElementById('fCnpj');
      cnpjInput.addEventListener('input', ()=>{ cnpjInput.value = maskCNPJ(cnpjInput.value); });
      cnpjInput.focus();

      const toggleBtn = document.getElementById('fAtivo');
      if(toggleBtn) toggleBtn.addEventListener('click', ()=>{
        const on = toggleBtn.dataset.on !== 'true';
        toggleBtn.dataset.on = String(on);
        toggleBtn.classList.toggle('on', on);
      });

      document.getElementById('empForm')?.addEventListener('submit', async (e)=>{
        e.preventDefault();
        ['eCnpj','eRazao'].forEach(id=>{ const el=document.getElementById(id); el.style.display='none'; el.textContent=''; });
        document.getElementById('fCnpj').classList.remove('invalid');
        document.getElementById('fRazao').classList.remove('invalid');

        const payload = {
          cnpj: document.getElementById('fCnpj').value,
          razaoSocial: document.getElementById('fRazao').value,
          nomeFantasia: document.getElementById('fFantasia').value,
        };
        if(isEdit && toggleBtn) payload.ativo = toggleBtn.dataset.on === 'true';

        const saveBtn = document.getElementById('modalSave');
        saveBtn.disabled = true;
        try{
          if(isEdit) await api('/'+empresa.id, { method:'PUT', body: JSON.stringify(payload) });
          else await api('', { method:'POST', body: JSON.stringify(payload) });
          close();
          toast(isEdit ? 'Empresa atualizada.' : 'Empresa cadastrada.');
          load();
        }catch(err){
          saveBtn.disabled = false;
          if(err.errors){
            if(err.errors.cnpj){ const el=document.getElementById('eCnpj'); el.textContent=err.errors.cnpj; el.style.display='block'; document.getElementById('fCnpj').classList.add('invalid'); }
            if(err.errors.razaoSocial){ const el=document.getElementById('eRazao'); el.textContent=err.errors.razaoSocial; el.style.display='block'; document.getElementById('fRazao').classList.add('invalid'); }
          } else {
            toast(err.message, 'error');
          }
        }
      });
    }

    document.getElementById('btnNewEmpresa')?.addEventListener('click', ()=> openModal());

    window.Empresas = { load };
  })();

  /* ================= MARKETPLACES — Mercado Livre e Shopee (OAuth real) =================

  (function(){
    const state = {
      empresas:[], empresaId:null, loadingEmpresas:false, conta:null, loadingConta:false, syncing:false, configurado:null, syncResult:null,
      contaShopee:null, contasShopee:[], contaShopeeId:null, loadingContaShopee:false, configuradoShopee:null, renovandoShopee:false,
      syncingShopee:false, syncResultShopee:null, pedidosShopee:[], loadingPedidosShopee:false,
    };

    function toast(message, type){
      const wrap = document.getElementById('toastWrap');
      const el = document.createElement('div');
      el.className = 'toast ' + (type||'success');
      el.innerHTML = svg(type==='error' ? 'alertCircle':'checkCircle') + '<span>'+message+'</span>';
      wrap.appendChild(el);
      setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .25s'; setTimeout(()=>el.remove(),250); }, 4200);
    }

    function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function fmtDateTime(iso){ if(!iso) return null; try{ return new Date(iso).toLocaleString('pt-BR'); }catch(e){ return null; } }

    async function apiEmpresasAtivas(){
      const res = await fetch('/api/empresas?status=ativas');
      const body = await res.json();
      return (body && body.empresas) || [];
    }
    async function apiMl(path, opts){
      const res = await fetch('/api/integracoes/mercadolivre'+path, { headers:{'Content-Type':'application/json'}, ...opts });
      let body = null; try{ body = await res.json(); }catch(e){}
      if(!res.ok){ throw new Error((body && body.error) || 'Falha na requisição.'); }
      return body;
    }
    async function apiShopee(path, opts){
      const res = await fetch('/api/integracoes/shopee'+path, { headers:{'Content-Type':'application/json'}, ...opts });
      let body = null; try{ body = await res.json(); }catch(e){}
      if(!res.ok){ throw new Error((body && body.error) || 'Falha na requisição.'); }
      return body;
    }

    async function loadContaDaEmpresa(){
      state.loadingConta = true; render();
      try{
        const data = await apiMl('?empresaId='+state.empresaId);
        state.conta = (data.contas && data.contas[0]) || null;
      }catch(e){ state.conta = null; }
      state.loadingConta = false; render();
    }
    async function loadContaShopeeDaEmpresa(){
      state.loadingContaShopee = true; render();
      try{
        const data = await apiShopee('?empresaId='+state.empresaId);
        state.contasShopee = data.contas || [];
        // 16/10/2026: várias lojas Shopee por empresa — mantém a selecionada, senão a primeira.
        state.contaShopee = state.contasShopee.find(c=>c.id===state.contaShopeeId) || state.contasShopee[0] || null;
        state.contaShopeeId = state.contaShopee ? state.contaShopee.id : null;
      }catch(e){ state.contaShopee = null; state.contasShopee = []; }
      state.loadingContaShopee = false; render();
      if(state.contaShopee) await loadPedidosShopee();
      else state.pedidosShopee = [];
    }

    // Fase 1 da sincronização de pedidos da Shopee (14/09/2026) — só lista o
    // que já foi sincronizado (real, sem cálculo nenhum); não dispara sync.
    async function loadPedidosShopee(){
      if(!state.contaShopee) return;
      state.loadingPedidosShopee = true; render();
      try{
        const data = await apiShopee('/'+state.contaShopee.id+'/pedidos');
        state.pedidosShopee = (data && data.pedidos) || [];
      }catch(e){ state.pedidosShopee = []; }
      state.loadingPedidosShopee = false; render();

    async function load(queryStr){
      if(queryStr){
        const params = new URLSearchParams(queryStr);
        if(params.get('ml') === 'success') toast('Mercado Livre conectado com sucesso.');
        else if(params.get('ml') === 'error') toast(params.get('msg') || 'Não foi possível conectar o Mercado Livre.', 'error');
        if(params.get('shopee') === 'success') toast('Shopee conectada com sucesso.');
        else if(params.get('shopee') === 'error') toast(params.get('msg') || 'Não foi possível conectar a Shopee.', 'error');
      }
      state.loadingEmpresas = true; render();
      try{
        state.empresas = await apiEmpresasAtivas();
        if(!state.empresaId || !state.empresas.find(e=>e.id===state.empresaId)){
          state.empresaId = state.empresas.length ? state.empresas[0].id : null;
        }
      }catch(e){ state.empresas = []; }
      state.loadingEmpresas = false;
      try{ state.configurado = (await fetch('/api/integracoes/mercadolivre/config-status').then(r=>r.json())).configurado; }
      catch(e){ state.configurado = null; }
      try{ state.configuradoShopee = (await fetch('/api/integracoes/shopee/config-status').then(r=>r.json())).configurado; }
      catch(e){ state.configuradoShopee = null; }
      if(state.empresaId){ await Promise.all([loadContaDaEmpresa(), loadContaShopeeDaEmpresa()]); } else render();
    }

    function statusBadge(status){

      if(state.configurado === false){
        html += '<div class="empty-panel" style="margin-bottom:16px;"><div class="empty-icon" style="color:var(--warning); background:var(--warning-soft);">'+svg('alertCircle')+'</div>'
          + '<h2 style="color:var(--warning);">Integração ainda não configurada</h2>'
          + '<p class="lead">O aplicativo do Mercado Livre (Client ID/Secret) ainda não foi configurado neste ambiente.</p></div>';
      }

      if(state.loadingConta){
        html += '<div class="table-card"><div class="table-skel"><span class="spin"></span><span>Carregando conexão…</span></div></div>';
      } else if(state.conta){
        const c = state.conta;
        html += '<div class="conn-card-real">'
          + '<div class="cc-left"><div class="cc-ic">'+svg('store')+'</div><div>'
            + '<div class="cc-nick">'+escapeHtml(c.nickname || ('Usuário '+c.mlUserId))+'</div>'
            + '<div class="cc-sub">Mercado Livre'+(c.siteId?(' · '+c.siteId):'')+' · ID '+c.mlUserId+'</div>'
          + '</div></div>'
          + '<div class="conn-actions">'+statusBadge(c.status)+'</div>'
          + '<div class="conn-meta">'
            + '<div class="conn-meta-item"><div class="cm-label">Última sincronização</div><div class="cm-value">'+(fmtDateTime(c.ultimaSincronizacaoEm) || 'Nunca sincronizado')+'</div></div>'
            + '<div class="conn-meta-item"><div class="cm-label">Token de acesso expira em</div><div class="cm-value">'+(fmtDateTime(c.tokenExpiraEm) || '—')+'</div></div>'
            + '<div class="conn-meta-item"><div class="cm-label">Conectado em</div><div class="cm-value">'+(fmtDateTime(c.criadoEm) || '—')+'</div></div>'
          + '</div>'
          + (c.status==='erro' && c.ultimoErro ? '<div class="bd-note">'+svg('alertCircle')+'<span>'+escapeHtml(c.ultimoErro)+'</span></div>' : '')
          + '<div style="margin-top:16px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; width:100%;">'
            + '<button class="btn-primary" id="mlSyncBtn" type="button" '+(state.syncing?'disabled':'')+'>'+svg('refreshCw')+'<span>'+(state.syncing?'Sincronizando…':'Sincronizar agora')+'</span></button>'
            + '<button class="btn-secondary" id="mlReconnectBtn" type="button">'+svg('link')+'<span>Reconectar</span></button>'
            + (state.syncResult ? '<span class="field-hint" style="margin:0;">'+state.syncResult.importados+' de '+state.syncResult.total+' pedido(s) dos últimos '+(state.syncResult.periodo?state.syncResult.periodo.dias:30)+' dias importados/atualizados'+(state.syncResult.erros.length? (', '+state.syncResult.erros.length+' com erro'):'')+'.</span>' : '<span class="field-hint" style="margin:0;">A sincronização traz os pedidos dos últimos 30 dias.</span>')
          + '</div>'

      } else {
        html += '<div class="empty-panel"><div class="empty-icon">'+svg('store')+'</div>'
          + '<h2>Nenhuma conta conectada</h2>'
          + '<p class="lead">Conecte a conta do Mercado Livre desta empresa para importar pedidos automaticamente. Você será redirecionado ao Mercado Livre para autorizar o acesso — os tokens ficam criptografados no servidor, nunca no navegador.</p>'
          + '<button class="primary-btn enabled" id="mlConnectBtn" type="button">'+svg('link')+'<span>Conectar Mercado Livre</span></button></div>';
      }

    function sparklineAreaSVG(values){

      const h = new Date().getHours();
      if(h < 12) return 'Bom dia';
      if(h < 18) return 'Boa tarde';
      return 'Boa noite';

      const dataCap = dataLabel.charAt(0).toUpperCase() + dataLabel.slice(1);
      return '<div class="ov3-greeting">'
        + '<div><h1>'+escapeHtml(saudacaoTexto())+'!</h1>'

        + '<div class="ov3-greeting-date">'+escapeHtml(dataCap)+'</div>'
      + '</div>';

    // ---- Linha de 6 KPIs em destaque (Faturamento, Margem de contribuição
    // R$/%, Pedidos, Ticket médio, Cancelamentos %). Os 3 primeiros já
    // existiam (com sparkline e "vs. período anterior" no Faturamento); os
    // 3 novos (Pedidos/Ticket médio/Cancelamentos %) são 100% derivados de
    // campos reais que resumirPeriodo() já devolve — nunca um cálculo
    // paralelo. ----
    function faturamentoTendenciaHTML(evolucao){
      if(!evolucao || evolucao.tendencia === 'sem_dado') return '';
      const seta = evolucao.tendencia === 'subindo' ? '▲' : (evolucao.tendencia === 'caindo' ? '▼' : '●');
      const cor = evolucao.tendencia === 'subindo' ? 'pos' : (evolucao.tendencia === 'caindo' ? 'neg' : 'dash');
      const pctTxt = evolucao.variacaoPct !== null ? pctFmt(Math.abs(evolucao.variacaoPct)) : 'sem base pra comparar %';
      return '<span class="'+cor+'" style="font-weight:700;">'+seta+' '+escapeHtml(pctTxt)+'</span> vs. período anterior';
    }

    function kpi6RowHTML(resumo, moeda, hasOrders, serieDiaria, faturamentoEvolucao){
      const serie = serieDiaria || [];
      const spFaturamento = sparklineAreaSVG(serie.map(d => d.faturamento));
      const spMargem = sparklineAreaSVG(serie.map(d => d.margemContribuicao));
      const spMargemPct = sparklineAreaSVG(serie.filter(d => d.faturamento > 0).map(d => (d.margemContribuicao / d.faturamento) * 100));

      const pendCurta = hasOrders ? '<span class="dash">Pendente</span>' : '<span class="dash">Sem dados</span>';

      // Ticket médio e taxa de cancelamento — derivados aqui (mesma conta
      // já usada em duas outras telas: faturamento÷pedidos e
      // cancelados÷(pedidos+cancelados)), nunca um número novo vindo do
      // backend.
      const ticketMedio = (resumo.faturamento.valor !== null && resumo.qtdPedidos > 0) ? resumo.faturamento.valor / resumo.qtdPedidos : null;
      const totalBruto = resumo.qtdPedidos + resumo.cancelados.quantidade;
      const taxaCancelamento = totalBruto > 0 ? (resumo.cancelados.quantidade / totalBruto) * 100 : null;

      const kpis = [
        { label:'Faturamento', icon:'barChart', tint:'copper', spark: spFaturamento,
          // 28/09/2026, pedido explícito do usuário: "quando mostrar o
          // faturamento total tem que mostrar descontando os cancelamentos
          // e devoluções" — o VALOR já excluía os dois (resumirPeriodo em
          // lib/relatorioVendas.js já filtra pedido.status IN
          // ('cancelado','devolvido') antes de somar faturamento), só a
          // legenda não citava devolução — corrigido aqui, sem mudar o
          // cálculo.
          note: resumo.faturamento.valor!==null ? faturamentoTendenciaHTML(faturamentoEvolucao) || 'Já descontando cancelamentos e devoluções' : 'Já descontando cancelamentos e devoluções',
          valueHtml: resumo.faturamento.valor!==null ? escapeHtml(money(resumo.faturamento.valor, moeda)) : pendCurta },
        // 28/09/2026, pedido explícito do usuário: "quero que a margem de
        // contribuição seja apenas uma em visão geral juntando a margem e
        // o lucro em reais no mesmo quadrado" — os dois cards (R$ e %) que
        // existiam separados viraram um só, mostrando o valor em R$ como
        // número principal e o percentual junto dele (não inventa nenhum
        // cálculo novo, só reexibe resumo.margemContribuicao.valor e
        // resumo.margemPercentual, os mesmos já calculados em
        // lib/relatorioVendas.js#resumirPeriodo, no mesmo card).
        { label:'Margem de contribuição', icon:'wallet', tint: resumo.margemContribuicao.valor===null ? 'muted' : (resumo.margemContribuicao.valor>=0?'success':'danger'), spark: spMargem,
          note: 'Sobre a venda já sem cancelamentos/devoluções − taxas − frete vendedor − imposto − custo produto',
          valueHtml: resumo.margemContribuicao.valor!==null
            ? '<span class="'+(resumo.margemContribuicao.valor>=0?'pos':'neg')+'">'+escapeHtml(moneySigned(resumo.margemContribuicao.valor, moeda))
              + (resumo.margemPercentual!==null ? ' <span style="font-size:0.6em;font-weight:600;opacity:0.85;">('+escapeHtml(pctFmt(resumo.margemPercentual))+')</span>' : '')
              + '</span>'
            : pendCurta },
        { label:'Pedidos no período', icon:'bag', tint:'teal',
          note:'Não cancelados',
          valueHtml: String(resumo.qtdPedidos) },
        { label:'Ticket médio', icon:'tag', tint:'petrol',
          note:'Faturamento ÷ pedidos',
          valueHtml: ticketMedio!==null ? escapeHtml(money(ticketMedio, moeda)) : pendCurta },
        { label:'Cancelamentos', icon:'x', tint: taxaCancelamento===null ? 'muted' : (taxaCancelamento>10?'danger':taxaCancelamento>0?'warning':'success'),
          note: resumo.cancelados.quantidade + ' pedido'+(resumo.cancelados.quantidade===1?'':'s')+' cancelado'+(resumo.cancelados.quantidade===1?'':'s'),
          valueHtml: taxaCancelamento!==null ? escapeHtml(pctFmt(taxaCancelamento)) : '<span class="dash">Sem dados</span>' },
      ];
      return '<div class="ov3-kpi-grid">' + kpis.map(k =>
        '<div class="ov3-kpi" style="'+tintVars(k.tint)+'">'
          + '<div class="ov3-kpi-top"><div class="ov3-kpi-icon">'+svg(k.icon)+'</div></div>'
          + '<div class="ov3-kpi-label">'+k.label+'</div>'
          + '<div class="ov3-kpi-value">'+k.valueHtml+'</div>'
          + '<div class="ov3-kpi-note">'+(k.note||'')+'</div>'
          + (k.spark || '')
        + '</div>'
      ).join('') + '</div>';
    }

    // ---- Detalhamento do resultado (Taxas/comissões, Frete do vendedor,
    // Imposto, Custo dos produtos) — os 4 componentes que, junto com o
    // faturamento, formam a margem de contribuição mostrada acima. Mesmos
    // 4 campos que já existiam nesta tela, só reorganizados numa fileira
    // compacta pra abrir espaço pro resto do novo layout. ----
    function detalhamentoStripHTML(resumo, moeda, hasOrders){
      function secMoneyCard(label, icon, obj){
        const pendNote = obj.pendentes>0 ? (obj.pendentes===1?'1 pedido pendente':obj.pendentes+' pedidos pendentes') : null;
        return { label, icon,
          valueHtml: obj.valor!==null ? escapeHtml(money(obj.valor, moeda)) : '<span class="dash">'+(hasOrders?'Pendente':'Sem dados')+'</span>',
          subNote: obj.valor!==null ? (obj.pendentes>0 ? pendNote : null) : pendNote };

      const secs = [

      return '<div class="kpi-sec-grid" style="margin-top:12px;">' + secs.map(k =>

        + '</div>'

    }

    // ---- Gráfico: Faturamento x Margem de contribuição por dia (SVG
    // simples) — mesmo desenho/dado de sempre, nenhuma mudança de cálculo. ----
    function chartHTML(serie, moeda, opts){
      opts = opts || {};
      const heightPx = opts.heightPx || 260;
      if(!serie.length){
        return '<div class="chart-canvas '+(opts.emptyClass||'h-lg')+'">' + chartGridLines(4)
          + chartEmptyState('lineChart', opts.emptyMsg || 'Sem dados no período selecionado. O gráfico aparece assim que houver pedidos não cancelados sincronizados.')
        + '</div>';
      }
      const n = serie.length;
      const W = Math.max(n*10, 10), H = 100, topPad = 8, botPad = 10;
      const usable = H - topPad - botPad;
      const vals = serie.flatMap(d => [d.faturamento, d.margemContribuicao]);
      const maxV = Math.max(0, ...vals);
      const minV = Math.min(0, ...vals);
      const range = (maxV - minV) || 1;
      const yFor = v => topPad + usable * (1 - (v - minV) / range);
      const baseY = yFor(0);

      const barW = 6;
      let bars = '';
      let points = [];
      serie.forEach((d, i) => {
        const cx = i*10 + 5;
        const y1 = yFor(d.faturamento);
        const barY = Math.min(y1, baseY), barH = Math.max(Math.abs(y1-baseY), 0.6);
        const dataLabel = fmtDiaCurto(d.dia)+' — Faturamento: '+money(d.faturamento,moeda)+' · Margem de contribuição: '+money(d.margemContribuicao,moeda);
        bars += '<rect x="'+(cx-barW/2)+'" y="'+barY+'" width="'+barW+'" height="'+barH+'" rx="1" fill="var(--copper)" fill-opacity="0.85"><title>'+escapeHtml(dataLabel)+'</title></rect>';
        points.push(cx+','+yFor(d.margemContribuicao));
      });
      const line = '<polyline points="'+points.join(' ')+'" fill="none" stroke="var(--teal)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>';
      const dots = serie.map((d,i) => {
        const cx = i*10+5, cy = yFor(d.margemContribuicao);
        const dataLabel = fmtDiaCurto(d.dia)+' — Margem de contribuição: '+money(d.margemContribuicao,moeda);
        return '<circle cx="'+cx+'" cy="'+cy+'" r="1.6" fill="var(--teal)" vector-effect="non-scaling-stroke"><title>'+escapeHtml(dataLabel)+'</title></circle>';
      }).join('');
      const baseline = '<line x1="0" y1="'+baseY+'" x2="'+W+'" y2="'+baseY+'" stroke="var(--border-strong)" stroke-width="1" vector-effect="non-scaling-stroke"/>';

      const labelStep = Math.max(1, Math.ceil(n/9));
      const labels = serie.map((d,i) => '<span>'+((i%labelStep===0 || i===n-1) ? escapeHtml(fmtDiaCurto(d.dia)) : '')+'</span>').join('');

      return '<div class="chart-canvas" style="position:relative;height:'+heightPx+'px;padding:0;">'
        + '<svg class="simple-chart-svg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="height:100%;">'
          + baseline + bars + line + dots
        + '</svg>'
      + '</div>'
      + '<div class="simple-chart-xlabels" style="grid-template-columns:repeat('+n+',1fr);">' + labels + '</div>';
    }

    function fmtDiaCurto(diaISO){
      const [, m, d] = diaISO.split('-');
      return d+'/'+m;
    }

    function devolucaoCancelamentoPanelHTML(painel, painelError, contaId){
      const head = '<div class="panel-head"><div class="panel-title"><span class="panel-title-ic">'+svg('swap')+'</span>Devolução e cancelamento</div></div>';
      if(contaId){

      if(!dev.quantidade && !canc.quantidade){
        return '<div class="panel" style="height:100%;">'+head+'<div class="empty-panel" style="padding:20px 10px;"><div class="empty-icon" style="width:36px;height:36px;">'+svg('swap')+'</div><p class="lead" style="font-size:12.5px;margin:8px 0 0;">Nenhuma devolução ou cancelamento no período.</p></div></div>';

      let sincronizacaoValueHtml = '<span class="dash">Carregando…</span>';

      const chips = [

          valueHtml: taxaCancelamento===null ? '<span class="dash">Sem dados</span>' : escapeHtml(pctFmt(taxaCancelamento)),
          status: taxaCancelamento===null ? null : (taxaCancelamento>10?'Alta':taxaCancelamento>0?'Atenção':'Excelente') },
        { label:'Pedidos com margem calculada', icon:'wallet', tint: margemCompletaPct===null ? 'muted' : (margemCompletaPct>=90 ? 'success' : margemCompletaPct>=50 ? 'warning' : 'danger'),
          valueHtml: margemCompletaPct===null ? '<span class="dash">Sem dados</span>' : escapeHtml(pctFmt(margemCompletaPct)),
          status: margemCompletaPct===null ? null : (margemCompletaPct>=90?'Excelente':margemCompletaPct>=50?'Incompleto':'Baixo') },
        { label:'Sincronização empresas/ML/Shopee', icon:'link', tint:'teal', valueHtml: sincronizacaoValueHtml, status:null },
      ];

      return '<div class="panel" style="height:100%;">'
        + '<div class="panel-head"><div class="panel-title"><span class="panel-title-ic">'+svg('activity')+'</span>Saúde da operação</div></div>'

  /* ================= PEDIDOS — importados do Mercado Livre =================
     A listagem vem de /api/pedidos, que por trás usa lib/relatorioVendas.js —
     a MESMA fonte que Visão Geral e Financeiro consultam (routes/relatorios.js)
     pro mesmo período nunca aparecer com números diferentes em telas diferentes. */
  (function(){
    const PERIODOS = [
      { chave:'hoje', label:'Hoje' },
      { chave:'ontem', label:'Ontem' },
      { chave:'7d', label:'Últimos 7 dias' },
      { chave:'30d', label:'Últimos 30 dias' },
      { chave:'mes', label:'Este mês' },
      { chave:'personalizado', label:'Personalizado' },
    ];
    const state = { empresas:[], empresaId:null, loadingEmpresas:false, periodo:'30d', desdePersonalizado:null, atePersonalizado:null, contaId:'', status:'', busca:'',
      items:[], totalNoPeriodo:0, totalFiltrado:0, periodoLabel:'', filtrosDisponiveis:{lojas:[],status:[]}, loading:false, error:null, gerandoRelatorio:false,
      resumo:null, loadingResumo:false };
    function hojeBRT(){
      const BRT_OFFSET_MS = 3*60*60*1000;
      const brt = new Date(Date.now() - BRT_OFFSET_MS);
      const p = n => String(n).padStart(2,'0');
      return brt.getUTCFullYear()+'-'+p(brt.getUTCMonth()+1)+'-'+p(brt.getUTCDate());
    }

    function toast(message, type){
      const wrap = document.getElementById('toastWrap');
      const el = document.createElement('div');
      el.className = 'toast ' + (type||'success');
      el.innerHTML = svg(type==='error' ? 'alertCircle':'checkCircle') + '<span>'+message+'</span>';
      wrap.appendChild(el);
      setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .25s'; setTimeout(()=>el.remove(),250); }, 4200);
    }
    function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function fmtDateTime(iso){ if(!iso) return '—'; try{ return new Date(iso).toLocaleString('pt-BR'); }catch(e){ return '—'; } }
    // Data + hora em duas linhas (mais estreito que a data/hora por extenso) —
    // usado só na coluna "Data" da tabela, que precisa caber na largura normal
    // da tela sem precisar rolar pro lado. O detalhe do pedido continua usando
    // fmtDateTime (por extenso).
    function fmtDataCell(iso){
      if(!iso) return '—';
      try{
        const d = new Date(iso);
        const data = d.toLocaleDateString('pt-BR');
        const hora = d.toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
        return '<div class="cell-stack"><span>'+data+'</span><span class="cell-stack-sub">'+hora+'</span></div>';
      }catch(e){ return '—'; }
    }
    function money(v, moeda){ return v===null||v===undefined ? null : (moeda==='BRL'||!moeda?'R$ ':moeda+' ') + Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2}); }

    async function apiEmpresasAtivas(){
      const res = await fetch('/api/empresas?status=ativas');
      return ((await res.json()).empresas) || [];
    }
    async function apiPedidos(path){
      const res = await fetch('/api/pedidos'+path);
      let body = null; try{ body = await res.json(); }catch(e){}
      if(!res.ok) throw new Error((body && body.error) || 'Falha na requisição.');
      return body;
    }
    async function apiMlSync(contaId){
      const res = await fetch('/api/integracoes/mercadolivre/'+contaId+'/sincronizar', { method:'POST' });
      let body = null; try{ body = await res.json(); }catch(e){}
      if(!res.ok) throw new Error((body && body.error) || 'Falha ao sincronizar.');
      return body;
    }
    async function apiContaDaEmpresa(empresaId){
      const res = await fetch('/api/integracoes/mercadolivre?empresaId='+empresaId);
      const body = await res.json();
      return (body.contas && body.contas[0]) || null;
    }
    // Shopee (14/09/2026, "tudo que foi aplicado no mercado livre pode e
    // deve ser aplicado na shopee") — mesmo padrão da conta do Mercado
    // Livre acima, só apontando pra rota da Shopee (routes/shopee.js).
    async function apiContaShopeeDaEmpresa(empresaId){
      const res = await fetch('/api/integracoes/shopee?empresaId='+empresaId);
      const body = await res.json();
      return (body.contas && body.contas[0]) || null;
    }
    async function apiShopeeSync(contaId){
      const res = await fetch('/api/integracoes/shopee/'+contaId+'/sincronizar', { method:'POST' });
      let body = null; try{ body = await res.json(); }catch(e){}
      if(!res.ok) throw new Error((body && body.error) || 'Falha ao sincronizar a Shopee.');
      return body;
    }
    // KPIs de topo (Pedidos/Vendas/Margem/Ticket médio/Cancelados) — mesma
    // fonte que Visão Geral já usa (/api/relatorios/resumo-vendas, que por
    // trás é resumirPeriodo() de lib/relatorioVendas.js — não recalculado
    // aqui). Loja (contaId) é respeitada aqui também desde 14/09/2026
    // (correção do bug relatado pelo usuário: "quando seleciona a loja as
    // vendas, margem, pedidos, ticket médio e cancelados continuam como se
    // tivesse selecionado todas as lojas") — só Status e Produto/SKU (filtros
    // exclusivos da tabela) continuam de fora dos cards, por isso a nota
    // abaixo deles quando algum desses dois está ativo.
    async function apiResumoVendas(empresaId, periodo, desde, ate, contaId){
      const params = new URLSearchParams({ empresaId, periodo });
      if(periodo === 'personalizado'){ if(desde) params.set('desde', desde); if(ate) params.set('ate', ate); }
      if(contaId) params.set('contaId', contaId);
      const res = await fetch('/api/relatorios/resumo-vendas?'+params.toString());
      let body = null; try{ body = await res.json(); }catch(e){}
      if(!res.ok) throw new Error((body && body.error) || 'Falha ao carregar os indicadores.');
      return body;
    }
    async function loadResumo(){
      if(!state.empresaId){ state.resumo = null; return; }
      state.loadingResumo = true; render();
      try{ state.resumo = await apiResumoVendas(state.empresaId, state.periodo, state.desdePersonalizado, state.atePersonalizado, state.contaId); }
      catch(err){ state.resumo = null; }
      state.loadingResumo = false; render();
    }

    function queryFiltrosAtuais(){
      const params = new URLSearchParams({ empresaId: state.empresaId, periodo: state.periodo });
      if(state.periodo === 'personalizado'){ if(state.desdePersonalizado) params.set('desde', state.desdePersonalizado); if(state.atePersonalizado) params.set('ate', state.atePersonalizado); }
      if(state.contaId) params.set('contaId', state.contaId);
      if(state.status) params.set('status', state.status);
      if(state.busca.trim()) params.set('busca', state.busca.trim());
      return params;
    }

    async function loadPedidos(){
      state.loading = true; state.error = null; render();
      try{
        const data = await apiPedidos('?'+queryFiltrosAtuais().toString());
        state.items = data.pedidos;
        state.totalNoPeriodo = data.totalNoPeriodo;
        state.totalFiltrado = data.totalFiltrado;
        state.periodoLabel = data.periodo ? data.periodo.label : '';
        state.filtrosDisponiveis = data.filtrosDisponiveis || { lojas:[], status:[] };
      }catch(err){ state.error = err.message; }
      state.loading = false; render();
    }

    async function load(){
      state.loadingEmpresas = true; render();
      try{
        state.empresas = await apiEmpresasAtivas();
        if(!state.empresaId || !state.empresas.find(e=>e.id===state.empresaId)){
          state.empresaId = state.empresas.length ? state.empresas[0].id : null;
        }
      }catch(e){ state.empresas = []; }
      state.loadingEmpresas = false;
      if(state.empresaId){ loadResumo(); await loadPedidos(); } else render();
    }

    // ---- KPIs de topo (mesmo resumo de /api/relatorios/resumo-vendas, já usado por Visão Geral) ----
    function kpiRowHTML(){
      if(state.loadingResumo && !state.resumo) return '<div class="table-skel" style="margin-bottom:14px;"><span class="spin"></span><span>Carregando indicadores…</span></div>';
      if(!state.resumo) return '';
      const r = state.resumo.resumo;
      const ticketMedio = (r.faturamento.valor!==null && r.qtdPedidos) ? r.faturamento.valor / r.qtdPedidos : null;
      const moneyKpi = (v) => v===null ? 'Pendente' : 'R$ ' + Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2});
      const items = [
        { label:'Pedidos', icon:'cart', tint:'copper', valueHtml: String(r.qtdPedidos), note:state.resumo.periodo.label },
        // 28/09/2026, pedido explícito do usuário: legenda atualizada pra
        // citar devolução junto de cancelamento — o valor (r.faturamento,
        // vindo do mesmo resumirPeriodo de lib/relatorioVendas.js) já
        // excluía os dois, só a legenda não mencionava devolução.
        { label:'Vendas (R$)', icon:'lineChart', tint:'success', valueHtml: moneyKpi(r.faturamento.valor), note:'Já descontando cancelamentos e devoluções' },
        { label:'Margem (R$)', icon:'wallet', tint: r.margemContribuicao.valor===null?'muted':(r.margemContribuicao.valor>=0?'success':'danger'), valueHtml: moneyKpi(r.margemContribuicao.valor), note: r.margemContribuicao.pendentes ? r.margemContribuicao.pendentes+' pedido(s) sem custo' : (r.comComissaoEstimada ? r.comComissaoEstimada+' pedido(s) Shopee com comissão estimada' : 'Todos os pedidos com custo (já sem cancel./devol.)') },
        { label:'Margem (%)', icon:'percent', tint:'purple', valueHtml: r.margemPercentual===null?'Pendente':r.margemPercentual.toLocaleString('pt-BR',{minimumFractionDigits:1, maximumFractionDigits:1})+'%', note:'Sobre o faturamento' },
        { label:'Ticket médio', icon:'activity', tint:'petrol', valueHtml: moneyKpi(ticketMedio), note:'Vendas ÷ pedidos' },
        { label:'Cancelados', icon:'alertCircle', tint: r.cancelados.quantidade>0?'danger':'muted', valueHtml: String(r.cancelados.quantidade), note: r.cancelados.valor ? moneyKpi(r.cancelados.valor)+' não contabilizado' : 'Nenhum no período' },
      ];
      return '<div class="kpi-hero-grid" style="margin-bottom:14px;">' + items.map(k =>
        '<div class="kpi-hero" style="'+('--tint:var(--'+k.tint+');--tint-soft:var(--'+k.tint+'-soft);')+'">'
          + '<div class="kpi-hero-top"><div class="kpi-hero-icon">'+svg(k.icon)+'</div></div>'
          + '<div class="kpi-hero-label">'+escapeHtml(k.label)+'</div>'
          + '<div class="kpi-hero-value" style="font-size:20px;">'+k.valueHtml+'</div>'
          + '<div class="kpi-hero-foot"><span class="kpi-hero-note">'+escapeHtml(k.note)+'</span></div>'
        + '</div>'
      ).join('') + '</div>'
      + (state.status || state.busca.trim()
          ? '<div class="field-hint" style="margin:-8px 0 14px;">Os indicadores acima já consideram a loja selecionada, mas não os filtros de Status/Produto-SKU (esses afetam só a tabela abaixo).</div>'
          : '');
    }

    function render(){
      const root = document.getElementById('pedidosRoot');
      if(!root) return;

      if(!state.loadingEmpresas && !state.empresas.length){
        root.innerHTML = '<div class="empty-panel"><div class="empty-icon">'+svg('building')+'</div>'
          + '<h2>Nenhuma empresa ativa</h2>'
          + '<p class="lead">Cadastre e ative uma empresa, conecte o Mercado Livre em <strong>Marketplaces</strong> e sincronize para ver os pedidos aqui.</p></div>';
        return;
      }

      let html = '<div class="toolbar">'
        + '<div style="display:flex;gap:10px;flex-wrap:wrap;">'
          + '<div class="empresa-picker" style="margin-bottom:0;"><select id="pedEmpresaSelect">'
            + state.empresas.map(e=>'<option value="'+e.id+'" '+(e.id===state.empresaId?'selected':'')+'>'+escapeHtml(e.nomeFantasia||e.razaoSocial)+'</option>').join('')
          + '</select></div>'
          + '<div class="empresa-picker" style="margin-bottom:0;"><select id="pedPeriodoSelect">'
            + PERIODOS.map(pr=>'<option value="'+pr.chave+'" '+(pr.chave===state.periodo?'selected':'')+'>'+pr.label+'</option>').join('')
          + '</select></div>'
          + (state.periodo === 'personalizado'
              ? '<div class="empresa-picker" style="margin-bottom:0;display:flex;gap:6px;align-items:center;">'
                + '<input type="date" id="pedDesdeInput" value="'+(state.desdePersonalizado||'')+'" style="padding:6px 8px;">'
                + '<span style="color:var(--text-muted);">até</span>'
                + '<input type="date" id="pedAteInput" value="'+(state.atePersonalizado||'')+'" style="padding:6px 8px;">'
                + '<button class="ghost-btn" id="pedAplicarPeriodo" type="button" style="cursor:pointer;opacity:1;">'+svg('check')+'<span>Aplicar</span></button>'
              + '</div>'
              : '')
          + '<div class="empresa-picker" style="margin-bottom:0;"><select id="pedLojaSelect">'
            + '<option value="">Todas as lojas</option>'
            + state.filtrosDisponiveis.lojas.map(l=>'<option value="'+escapeHtml(l.chave)+'" '+(l.chave===state.contaId?'selected':'')+'>'+escapeHtml((l.marketplace==='shopee'?'[Shopee] ':l.marketplace==='balcao'?'[Balcão] ':'[ML] ')+(l.nickname||l.chave))+'</option>').join('')
          + '</select></div>'
          + '<div class="empresa-picker" style="margin-bottom:0;"><select id="pedStatusSelect">'
            + '<option value="">Todos os status</option>'
            + state.filtrosDisponiveis.status.map(s=>'<option value="'+escapeHtml(s)+'" '+(s===state.status?'selected':'')+'>'+escapeHtml(s)+'</option>').join('')
          + '</select></div>'
          + '<div class="search-box" style="margin-bottom:0;">'+svg('search')+'<input type="text" id="pedBuscaInput" placeholder="Produto ou SKU" value="'+escapeHtml(state.busca)+'"></div>'
        + '</div>'
        + '<div style="display:flex;gap:10px;flex-wrap:wrap;">'
          + '<button class="ghost-btn" id="pedSyncBtn" type="button" style="cursor:pointer; opacity:1;">'+svg('refreshCw')+'<span>Sincronizar</span></button>'
          + '<button class="ghost-btn" id="pedRelatorioXlsxBtn" type="button" style="cursor:pointer; opacity:1;" title="Gerar relatório em Excel com os filtros atuais">'+svg('fileText')+'<span>Gerar relatório (Excel)</span></button>'
          + '<button class="ghost-btn" id="pedRelatorioCsvBtn" type="button" style="cursor:pointer; opacity:1;" title="Gerar relatório em CSV com os filtros atuais">'+svg('fileText')+'<span>CSV</span></button>'
        + '</div>'
      + '</div>';

      html += kpiRowHTML();

      if(state.loading){
        html += '<div class="table-card"><div class="table-skel"><span class="spin"></span><span>Carregando pedidos…</span></div></div>';
      } else if(state.error){
        html += '<div class="empty-panel"><div class="empty-icon" style="color:var(--danger); background:var(--danger-soft);">'+svg('alertCircle')+'</div>'
          + '<h2 style="color:var(--danger);">Não foi possível carregar</h2><p class="lead">'+state.error+'</p></div>';
      } else if(!state.items.length){
        html += '<div class="empty-panel"><div class="empty-icon">'+svg('inbox')+'</div>'
          + '<h2>Nenhum pedido no período</h2>'
          + '<p class="lead">Não há pedidos sincronizados em "'+escapeHtml(state.periodoLabel||'')+'". Conecte uma conta do Mercado Livre em <strong>Marketplaces</strong> e clique em "Sincronizar agora", ou escolha outro período.</p></div>';
      } else {
        const cellMoney = (v, moeda, negative) => v===null
          ? '<span style="color:var(--text-faint);font-style:italic;">pendente</span>'
          : (negative && v!==0 ? '− ' : '') + money(Math.abs(v), moeda);
        const pctCell = (v) => v===null
          ? '<span style="color:var(--text-faint);font-style:italic;">pendente</span>'
          : '<span style="'+(v>=0?'color:var(--success);':'color:var(--danger);')+'">'+(v<0?'− ':'')+Math.abs(v).toLocaleString('pt-BR',{minimumFractionDigits:1, maximumFractionDigits:1})+'%</span>';

        // Colunas priorizadas pra tabela caber na largura normal da tela
        // desktop sem precisar rolar pro lado (pedido do usuário). Loja e
        // Imposto continuam disponíveis — só que dentro do detalhe do pedido
        // (clique no ícone de olho), não mais como coluna aqui.
        html += '<div class="table-card"><div class="table-wrap"><table class="data-table compact-orders"><thead><tr>'
          + '<th>Data</th><th>Canal</th><th>Pedido</th><th>Produto / SKU</th><th>Qtd.</th><th>Venda</th>'
          + '<th>Taxas</th><th>Frete vend.</th><th>Custo</th>'
          + '<th>Margem R$</th><th>Margem %</th><th>Logística</th><th>Status</th><th></th>'
          + '</tr></thead><tbody>'
          + state.items.map(p => '<tr data-row-detail="'+escapeHtml(p.detailKey)+'" style="cursor:pointer;'+(p.cancelado?'opacity:.6;':'')+'">'
            + '<td class="tab-nums">'+fmtDataCell(p.dataCriacao)+'</td>'
            + '<td><span class="badge-status '+(p.marketplace==='shopee'?'off':p.marketplace==='balcao'?'warn':'on')+'" style="display:inline-flex;" title="'+(p.marketplace==='shopee'?'Shopee':p.marketplace==='balcao'?'Venda no balcão':'Mercado Livre')+'"><span class="dot"></span>'+(p.marketplace==='shopee'?'Shopee':p.marketplace==='balcao'?'Balcão':'ML')+'</span></td>'
            + '<td class="mono">'+escapeHtml(p.mlOrderId)+'</td>'
            + '<td class="produto-cell">'
              + '<div class="cell-stack"><span class="prod-title" title="'+escapeHtml(p.produtoResumo||'—')+'">'+escapeHtml(p.produtoResumo||'—')+(p.qtdItens>3?' +'+(p.qtdItens-3):'')+'</span>'
              + '<span class="cell-stack-sub mono" title="'+escapeHtml(p.skuResumo||'')+'">'+escapeHtml(p.skuResumo||'sem SKU')+'</span></div>'
            + '</td>'
            + '<td class="tab-nums">'+p.qtdUnidades+'</td>'
            + '<td class="mono">'+(money(p.valorTotal,p.moeda)||'<span style="color:var(--text-faint);font-style:italic;">indisp.</span>')+'</td>'
            + '<td class="mono">'+cellMoney(p.tarifasMl,p.moeda,true)+'</td>'
            + '<td class="mono">'+(money(p.freteVendedor,p.moeda)||'<span style="color:var(--text-faint);font-style:italic;">indisp.</span>')+'</td>'
            + '<td class="mono">'+cellMoney(p.custoProduto,p.moeda,true)+'</td>'
            + '<td class="mono" style="'+(p.margemContribuicao!==null?(p.margemContribuicao>=0?'color:var(--success);':'color:var(--danger);'):'')+'">'+(p.calculoCompleto ? (money(p.margemContribuicao,p.moeda)+(p.comissaoEstimada?' <span title="Comissão da Shopee ainda estimada — repasse real não confirmado" style="color:var(--text-faint);font-style:italic;">(estim.)</span>':'')) : '<span style="color:var(--text-faint);font-style:italic;">pendente</span>')+'</td>'
            + '<td class="mono">'+(p.calculoCompleto ? pctCell(p.margemPercentual) : '<span style="color:var(--text-faint);font-style:italic;">pendente</span>')+'</td>'
            + '<td class="cell-stack-sub" style="white-space:normal;">'+escapeHtml(p.envioLogisticType||'—')+'</td>'
            + '<td><span class="badge-status '+(p.status==='paid'?'on':(p.cancelado?'err':'off'))+'"><span class="dot"></span>'+escapeHtml(p.status||'—')+'</span></td>'
            + '<td><div class="row-actions"><button class="row-ic-btn" data-detail="'+escapeHtml(p.detailKey)+'" title="Ver detalhes (loja, imposto e mais)" type="button">'+svg('eye')+'</button></div></td>'
          + '</tr>').join('')
          + '</tbody></table></div></div>'
          + (state.totalFiltrado > state.items.length
              ? '<div class="field-hint" style="margin-top:10px;">Mostrando os '+state.items.length+' pedidos mais recentes de '+state.totalFiltrado+' que batem o filtro atual'+(state.totalFiltrado!==state.totalNoPeriodo?' (de '+state.totalNoPeriodo+' no período, antes do filtro de loja/status/produto)':'')+'. O botão "Gerar relatório" exporta todos, não só os mostrados aqui.</div>'
              : '')
          + '<div class="field-hint" style="margin-top:6px;">"Pendente" = falta cadastrar o custo do SKU em <strong>Custos</strong> e/ou o Mercado Livre não retornou alguma tarifa desse pedido ainda — nunca um valor estimado. Pedidos cancelados (linha esmaecida) não entram nos totais de Visão Geral e Financeiro. Loja e imposto do pedido estão no detalhe (ícone de olho).</div>';
      }

      root.innerHTML = html;

      const sel = document.getElementById('pedEmpresaSelect');
      if(sel) sel.addEventListener('change', ()=>{ state.empresaId = Number(sel.value); loadResumo(); loadPedidos(); });
      const selPer = document.getElementById('pedPeriodoSelect');
      if(selPer) selPer.addEventListener('change', ()=>{
        state.periodo = selPer.value;
        if(state.periodo === 'personalizado'){
          if(!state.desdePersonalizado) state.desdePersonalizado = hojeBRT();
          if(!state.atePersonalizado) state.atePersonalizado = hojeBRT();
        }
        loadResumo(); loadPedidos();
      });
      const pedAplicarPeriodo = document.getElementById('pedAplicarPeriodo');
      if(pedAplicarPeriodo) pedAplicarPeriodo.addEventListener('click', ()=>{
        const d = document.getElementById('pedDesdeInput').value || hojeBRT();
        const a = document.getElementById('pedAteInput').value || hojeBRT();
        state.desdePersonalizado = d; state.atePersonalizado = a;
        loadResumo(); loadPedidos();
      });
      const syncBtn = document.getElementById('pedSyncBtn');
      if(syncBtn) syncBtn.addEventListener('click', async ()=>{
        syncBtn.disabled = true;
        try{
          // Sincroniza as duas lojas conectadas desta empresa (Mercado Livre
          // e Shopee), quando existirem — mesmo botão de sempre, agora
          // cobrindo as duas (14/09/2026). Cada uma é isolada: se uma
          // falhar, a outra ainda sincroniza normalmente.
          const [contaMl, contaShopee] = await Promise.all([
            apiContaDaEmpresa(state.empresaId),
            apiContaShopeeDaEmpresa(state.empresaId),
          ]);
          if(!contaMl && !contaShopee){
            toast('Conecte o Mercado Livre e/ou a Shopee desta empresa em Marketplaces primeiro.', 'error');
            syncBtn.disabled = false; return;
          }
          const mensagens = [];
          if(contaMl){
            try{ const r = await apiMlSync(contaMl.id); mensagens.push(r.importados+' do Mercado Livre'); }
            catch(err){ mensagens.push('Mercado Livre: '+err.message); }
          }
          if(contaShopee){
            try{ const r = await apiShopeeSync(contaShopee.id); mensagens.push(r.importados+' da Shopee'); }
            catch(err){ mensagens.push('Shopee: '+err.message); }
          }
          toast('Sincronizado — '+mensagens.join(' · ')+'.');
          await loadPedidos();
        }catch(err){ toast(err.message, 'error'); }
        syncBtn.disabled = false;
      });
      const selLoja = document.getElementById('pedLojaSelect');
      if(selLoja) selLoja.addEventListener('change', ()=>{ state.contaId = selLoja.value; loadResumo(); loadPedidos(); });
      const selStatus = document.getElementById('pedStatusSelect');
      if(selStatus) selStatus.addEventListener('change', ()=>{ state.status = selStatus.value; loadPedidos(); });
      const busca = document.getElementById('pedBuscaInput');
      if(busca) busca.addEventListener('input', ()=>{
        state.busca = busca.value;
        clearTimeout(busca._t);
        busca._t = setTimeout(loadPedidos, 300);
      });
      function baixarRelatorio(formato){
        const params = queryFiltrosAtuais();
        params.set('formato', formato);
        window.location.href = '/api/pedidos/relatorio?'+params.toString();
      }
      const relXlsxBtn = document.getElementById('pedRelatorioXlsxBtn');
      if(relXlsxBtn) relXlsxBtn.addEventListener('click', ()=> baixarRelatorio('xlsx'));
      const relCsvBtn = document.getElementById('pedRelatorioCsvBtn');
      if(relCsvBtn) relCsvBtn.addEventListener('click', ()=> baixarRelatorio('csv'));
      root.querySelectorAll('[data-detail]').forEach(b=> b.addEventListener('click', (e)=>{ e.stopPropagation(); openDetail(b.dataset.detail); }));
      root.querySelectorAll('[data-row-detail]').forEach(tr=> tr.addEventListener('click', ()=> openDetail(tr.dataset.rowDetail)));
    }

    // Detalhe do pedido em painel lateral (drawer), em vez do modal
    // centralizado antigo — pedido de redesenho visual do usuário ("se
    // puder ser feito sem alterar a lógica existente"). Só troca o
    // CONTAINER (modal-card -> side-panel); todo o conteúdo abaixo
    // (seções, campos, fórmula de margem) é exatamente o mesmo, buscado do
    // mesmo endpoint /api/pedidos/:id, sem nenhum cálculo novo.
    function closeSidePanel(){
      const root = document.getElementById('sidePanelRoot');
      if(root) root.innerHTML = '';
      document.removeEventListener('keydown', onSidePanelEsc);
    }
    function onSidePanelEsc(e){ if(e.key === 'Escape') closeSidePanel(); }

    async function openDetail(id){
      const sideRoot = document.getElementById('sidePanelRoot');
      sideRoot.innerHTML = '<div class="side-panel-overlay" id="sidePanelOverlay"></div><div class="side-panel"><div class="table-skel"><span class="spin"></span><span>Carregando pedido…</span></div></div>';
      document.getElementById('sidePanelOverlay')?.addEventListener('click', closeSidePanel);
      document.addEventListener('keydown', onSidePanelEsc);

      let data;
      try{ data = await apiPedidos('/'+id); }
      catch(err){ toast(err.message, 'error'); closeSidePanel(); return; }

      const { pedido, itens, resultadoFinanceiro: rf } = data;
      const moeda = pedido.moeda;
      // Shopee (14/09/2026) e Balcão (22/09/2026): mesmo painel de sempre,
      // só trocando os campos que são específicos de cada canal (ID de
      // pagamento/envio do Mercado Livre não existem na Shopee nem no
      // Balcão, e vice-versa — nunca mostrar um rótulo "Mercado Livre" pra
      // um pedido de outro canal nem inventar um ID que ele não manda).
      const isShopee = pedido.marketplace === 'shopee';
      const isBalcao = pedido.marketplace === 'balcao';
      const canalLabel = isShopee ? 'Shopee' : isBalcao ? 'Venda no balcão' : 'Mercado Livre';
      const FORMA_PAGAMENTO_LABEL = { dinheiro:'Dinheiro', pix:'Pix', debito:'Débito', credito:'Crédito', outro:'Outro' };
